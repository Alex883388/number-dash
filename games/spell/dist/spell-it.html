<title>Spell It</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Look, cover, spell: see a word with its picture, hide it, then build it from letter tiles. Animals, food, things around us, number words and tricky words.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root {
  --sky: #e6f3fc; --sky-top: #8fd1fb; --sky-bot: #e8f6ff; --ink: #29345a; --ink-soft: #5d6890; --card: #fdfeff; --card-2: #eef5fc; --line: #d0dff0;
  --sun: #ffc94d; --sun-deep: #e2a526; --sun-ink: #4a3500; --mint: #4fd1a5; --mint-deep: #2a9f78; --mint-soft: #d9f7ea; --lilac: #9d84ff; --lilac-soft: #ece6ff;
  --coral: #ff7b86; --coral-deep: #d9505d; --coral-soft: #ffe1e4; --sky-blue: #5cb8ff; --pink: #ff9fcf;
  --door: #fff3d6; --door-edge: #f0b544; --door-ink: #3a3f6b; --veil: rgba(230, 243, 252, .6);
  --shadow: 0 12px 32px rgba(41, 52, 90, .16); --shadow-sm: 0 4px 14px rgba(41, 52, 90, .14);
  --font-display: "Fredoka", "Arial Rounded MT Bold", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #1c2147; --sky-top: #1d2350; --sky-bot: #3b3a7e; --ink: #edf0ff; --ink-soft: #b4bbe3; --card: #283063; --card-2: #222955; --line: #3b437f;
    --sun: #ffcd5a; --sun-deep: #d99f2c; --sun-ink: #3d2a00; --mint: #5adbb0; --mint-deep: #5adbb0; --mint-soft: #1f4a4a; --lilac: #ab95ff; --lilac-soft: #352f6e;
    --coral: #ff8a94; --coral-deep: #ff8a94; --coral-soft: #4d2a45; --door: #fff1d2; --veil: rgba(28, 33, 71, .55);
    --shadow: 0 14px 36px rgba(0, 0, 0, .42); --shadow-sm: 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #1c2147; --sky-top: #1d2350; --sky-bot: #3b3a7e; --ink: #edf0ff; --ink-soft: #b4bbe3; --card: #283063; --card-2: #222955; --line: #3b437f;
  --sun: #ffcd5a; --sun-deep: #d99f2c; --sun-ink: #3d2a00; --mint: #5adbb0; --mint-deep: #5adbb0; --mint-soft: #1f4a4a; --lilac: #ab95ff; --lilac-soft: #352f6e;
  --coral: #ff8a94; --coral-deep: #ff8a94; --coral-soft: #4d2a45; --door: #fff1d2; --veil: rgba(28, 33, 71, .55);
  --shadow: 0 14px 36px rgba(0, 0, 0, .42); --shadow-sm: 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  background: linear-gradient(var(--sky-top), var(--sky-bot) 75%) fixed; background-color: var(--sky-bot);
}
button { font: inherit; color: inherit; }
button, label, input, .btn, a { touch-action: manipulation; }
[hidden] { display: none !important; }

/* buttons */
.btn {
  font: 600 1.05rem/1.1 var(--font-display); color: var(--ink); background: var(--card-2); border: 2px solid var(--line); border-radius: 16px;
  padding: .75em 1.15em; box-shadow: 0 4px 0 var(--line); cursor: pointer; text-decoration: none; display: inline-block;
  transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:hover { background: var(--card); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn:focus-visible, .seg input:focus-visible + span { outline: 3px solid var(--lilac); outline-offset: 3px; }
.btn.sun { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); box-shadow: 0 4px 0 var(--sun-deep); }
.btn.sun:active { box-shadow: 0 1px 0 var(--sun-deep); }
.btn.big { font-size: 1.6rem; padding: .6em 2.2em; border-radius: 22px; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

/* menu screens: cards over the game */
#screens {
  position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto; pointer-events: none; touch-action: pan-y; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
}
#screens.dim { background: var(--veil); pointer-events: auto; }
.screen { pointer-events: auto; width: min(100%, 600px); animation: rise .35s ease both; }
.card { background: var(--card); border-radius: 28px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 34px); display: grid; gap: 18px; text-align: center; }
.logo { margin: 0; font: 700 clamp(2.5rem, 9vw, 4rem)/.95 var(--font-display); text-wrap: balance; }
.logo span { color: var(--mint-deep); }
.tag { margin: 0 auto; max-width: 40ch; color: var(--ink-soft); font-size: 1.08rem; line-height: 1.5; text-wrap: balance; }
.how { margin: 0; color: var(--ink-soft); font-weight: 700; }
.small-card h2 { margin: 0; font: 700 clamp(1.9rem, 6vw, 2.6rem)/1.05 var(--font-display); text-wrap: balance; }
.small-card p { margin: 0; color: var(--ink-soft); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; margin: 0; }
.stats div { background: var(--card-2); border-radius: 16px; padding: 12px 6px; min-width: 0; }
.stats dt { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 800; }
.stats dd { margin: 4px 0 0; font: 700 1.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; font: 600 .95rem/1.15 var(--font-display); padding: .55em .85em; border-radius: 14px; background: var(--card-2); border: 2px solid var(--line); }
.seg input:checked + span { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); }
@media (pointer: coarse) { .seg span { min-height: 48px; box-sizing: border-box; display: grid; place-items: center; } }
.seg-title { margin: 0 0 8px; font: 600 .9rem/1 var(--font-display); color: var(--ink-soft); }
.stars { font-size: 2.4rem; letter-spacing: .1em; line-height: 1; }
.stars .off { opacity: .22; filter: grayscale(1); }

/* the HUD along the top while playing */
#hud { position: fixed; left: 0; right: 0; top: 0; pointer-events: none; z-index: 10; }
.hud-top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.chipbox { background: var(--card); border-radius: 99px; box-shadow: var(--shadow-sm); }
.hud-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 600 1.05rem/1 var(--font-display); padding: 8px 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.soft { font-size: .9rem; padding: 7px 12px; color: var(--ink-soft); }
.hud-btn { pointer-events: auto; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow-sm); cursor: pointer; display: grid; place-items: center; flex: none; color: var(--ink); }
.hud-btn:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
@media (pointer: coarse) { .hud-btn { width: 58px; height: 58px; } }

/* toasts and screen-reader text */
.toast {
  position: fixed; left: 50%; top: var(--toast-top, 42%); translate: -50% 0; z-index: 30; pointer-events: none; font: 700 1.4rem/1.1 var(--font-display);
  padding: 12px 20px; animation: pop .3s ease both; white-space: nowrap; background: var(--card); border-radius: 99px; box-shadow: var(--shadow-sm);
}
.toast.hello { top: calc(max(128px, 20%) + env(safe-area-inset-top, 0px)); border: 3px solid var(--lilac); }
.toast.good { color: var(--mint-deep); border: 3px solid var(--mint); }
.toast.oops { color: var(--coral-deep); border: 3px solid var(--coral); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(.85); } 70% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { translate: 0 0; } 20% { translate: -7px 0; } 40% { translate: 6px 0; } 60% { translate: -4px 0; } 80% { translate: 3px 0; } }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(79, 209, 165, .7); } 100% { box-shadow: 0 0 0 18px rgba(79, 209, 165, 0); } }
@media (prefers-reduced-motion: reduce) { .screen, .toast, .card { animation: none !important; } }
/* Spell It: one column over the sky. A phase label, the picture card (emoji, number, sum or a
   sentence with a gap), the word's letter boxes, the help buttons, then gold-edged letter tiles
   like the ladder's answer panels. Sizes come from layout() so nothing ever scrolls. */
#play {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap, 14px);
  box-sizing: border-box; touch-action: manipulation;
  padding: var(--top, 80px) max(16px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
.phase {
  height: 34px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; flex: none; padding: 0 16px; border-radius: 99px;
  font: 700 1.05rem/1 var(--font-display); background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm);
}
.phase.look { background: var(--lilac-soft); }
.phase.spell, .phase.work { background: var(--sun); color: var(--sun-ink); }
.phase.done { background: var(--mint-soft); }
.pic {
  height: calc(var(--pic, 140px) + 20px); min-width: min(calc(100% - 8px), 240px); max-width: min(calc(100% - 8px), 760px); flex: none;
  background: var(--card); border: 4px solid var(--door-edge); border-radius: 28px; box-shadow: var(--shadow);
  display: grid; place-items: center; padding: 0 26px; box-sizing: border-box; position: relative; overflow: hidden;
}
.pic .emoji { font: 400 calc(var(--pic, 140px) * .8)/1.1 var(--emoji); }
.pic .num { font: 700 calc(var(--pic, 140px) * .78)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.pic .fact { font: 700 var(--fact, 60px)/1.1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pic .fact b { color: var(--mint-deep); }
.pic .clue { font: 600 var(--clue, 28px)/1.3 var(--font-display); text-align: center; text-wrap: balance; max-width: 30ch; }
.pic .rulebox { display: grid; gap: 6px; justify-items: center; }
.pic .prompt { font: 700 var(--rule, 56px)/1.15 var(--font-display); white-space: nowrap; }
.pic .prompt b { color: var(--lilac); }
.gap { display: inline-block; min-width: 2.6em; height: .9em; border-bottom: 4px solid var(--lilac); margin: 0 .12em; vertical-align: -.08em; }
.gap.filled { min-width: 0; height: auto; border-color: var(--mint); color: var(--mint-deep); vertical-align: baseline; }
.word { display: flex; flex-wrap: nowrap; justify-content: center; column-gap: var(--bg, 6px); flex: none; max-width: 100%; }
.word.two { flex-direction: column; align-items: center; row-gap: 8px; }
.part { display: flex; gap: var(--bg, 6px); }
.box {
  width: var(--bs, 64px); height: calc(var(--bs, 64px) * 1.18); box-sizing: border-box; display: grid; place-items: center; flex: none;
  border-radius: calc(var(--bs, 64px) * .24); background: var(--card); border: 3px solid var(--line); box-shadow: var(--shadow-sm);
  font: 700 calc(var(--bs, 64px) * .72)/1 var(--font-display); color: var(--ink);
}
.box.now { border-color: var(--lilac); box-shadow: 0 0 0 4px var(--lilac-soft); }
.box.peek { color: var(--ink-soft); }
.box.fill { animation: drop .24s ease-out both; }
.box.flip { animation: flip .36s ease both; }
.box.win { background: var(--mint-soft); border-color: var(--mint); animation: pop .35s ease both; }
.box.bump { animation: shake .35s ease; }
.lookbar { width: min(60%, 340px); height: 8px; border-radius: 99px; background: var(--card-2); overflow: hidden; flex: none; visibility: hidden; }
.lookbar.on { visibility: visible; }
.lookbar i { display: block; height: 100%; background: var(--lilac); transform-origin: left center; border-radius: 99px; }
.tools { display: flex; gap: 12px; justify-content: center; flex: none; height: 56px; }
.tools .btn { min-height: 56px; padding: 0 1.1em; display: inline-flex; align-items: center; gap: .4em; }
.tools .btn i { font-style: normal; font-family: var(--emoji); }
.tilebox { position: relative; width: 100%; display: flex; justify-content: center; flex: none; min-height: var(--tiles-h, 160px); }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: var(--tg, 10px); max-width: var(--tiles-w, 920px); }
.tile {
  width: var(--ts, 68px); height: var(--ts, 68px); box-sizing: border-box; padding: 0; margin: 0 0 4px; display: grid; place-items: center; cursor: pointer;
  border-radius: 18px; background: var(--door); border: 3px solid var(--door-edge); color: var(--door-ink); box-shadow: 0 4px 0 var(--door-edge);
  font: 700 calc(var(--ts, 68px) * .58)/1 var(--font-display); transition: transform .08s ease, box-shadow .08s ease;
}
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--door-edge); }
.tile:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
.tile.used { background: transparent; border: 3px dashed var(--line); box-shadow: none; color: transparent; pointer-events: none; }
.tile.nope { background: var(--coral-soft); border-color: var(--coral); box-shadow: 0 4px 0 var(--coral); color: var(--coral-deep); animation: shake .4s ease; }
.tile.hint { border-color: var(--lilac); box-shadow: 0 4px 0 var(--lilac), 0 0 0 5px var(--lilac-soft); }
.tiles.wait .tile { visibility: hidden; }
.tiles.show .tile { animation: rise .3s ease both; }
.tiles.off .tile { opacity: .4; pointer-events: none; }
.tiles .tile.nope, .tiles.show .tile.nope { animation: shake .4s ease; }
.cheer {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font: 700 clamp(1.7rem, 5vh, 2.8rem)/1.1 var(--font-display); color: var(--ink); text-align: center; animation: pop .35s ease both;
}
.spark { position: fixed; pointer-events: none; font: 400 30px/1 var(--emoji); z-index: 15; animation: float .9s ease-out both; }
#play.away { visibility: hidden; }
.toast.music { top: var(--music-y, var(--hud-b, 76px)); font-size: 1.1rem; padding: 9px 16px; }

/* home and results */
.screen { width: min(100%, 640px); }
.head { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 24px; }
.demo { display: flex; justify-content: center; align-items: center; gap: 8px; }
.demo i { font: 400 2.6rem/1 var(--emoji); margin-right: 6px; font-style: normal; }
.demo b {
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; font: 700 1.6rem/1 var(--font-display);
  background: var(--door); border: 3px solid var(--door-edge); color: var(--door-ink); box-shadow: 0 3px 0 var(--door-edge); box-sizing: border-box;
}
.decks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.levelrow { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; align-items: center; }
.toggle { font-size: .95rem; padding: 0 1em; min-height: 48px; display: inline-flex; align-items: center; gap: .4em; box-sizing: border-box; box-shadow: 0 3px 0 var(--line); }
.toggle i { font-style: normal; font-family: var(--emoji); }
.toggle[aria-pressed="true"] { background: var(--lilac-soft); border-color: var(--lilac); box-shadow: 0 3px 0 var(--lilac); }
.deck { cursor: pointer; display: block; }
.deck input { position: absolute; opacity: 0; pointer-events: none; }
.deck span {
  display: grid; gap: 2px; justify-items: center; align-content: center; min-height: 78px; height: 100%; box-sizing: border-box; padding: 6px 4px;
  border-radius: 18px; background: var(--card-2); border: 2px solid var(--line); font: 600 .98rem/1.1 var(--font-display); text-wrap: balance;
}
.deck i { font: 400 1.75rem/1.1 var(--emoji); font-style: normal; }
.deck small { font-size: .78rem; letter-spacing: .12em; color: var(--sun-deep); min-height: 1em; }
.deck input:checked + span { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); }
.deck input:checked + span small { color: var(--sun-ink); }
.deck input:focus-visible + span { outline: 3px solid var(--lilac); outline-offset: 3px; }
.seg span { min-width: 4.6em; padding: .7em 1em; }
.note { margin: 8px 0 0; color: var(--ink-soft); font-weight: 700; font-size: .95rem; min-height: 1.3em; }
.wlist { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.wchip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; font: 600 1.05rem/1.2 var(--font-display);
  background: var(--mint-soft); border: 2px solid var(--mint); color: var(--ink);
}
.wchip.miss { background: var(--coral-soft); border-color: var(--coral); }
.wchip i { font-style: normal; font-family: var(--emoji); font-size: 1.1em; }
.wchip i.n { font-family: var(--font-display); color: var(--ink-soft); font-size: .9em; }
.small-card .list-title { margin: 0 0 6px; font: 600 .9rem/1 var(--font-display); color: var(--ink-soft); }

@keyframes drop { from { transform: translateY(-45%) scale(1.15); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes flip { 0% { transform: rotateX(90deg); } 100% { transform: none; } }
@keyframes float { from { transform: translate(0, 0) scale(.6); opacity: 0; } 25% { opacity: 1; } to { transform: translate(var(--dx, 0), -70px) scale(1.1); opacity: 0; } }
@media (max-width: 560px) {
  #deckChip { display: none; }
  #s-home .card { gap: 14px; }
  .decks { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .deck span { min-height: 64px; padding: 5px 2px; font-size: .86rem; }
  .deck i { font-size: 1.45rem; }
  .demo { display: none; }
  #homeBtns { gap: 8px; }
  #homeBtns .btn { font-size: .88rem; padding: .65em .75em; }
  .seg span { min-width: 0; padding: .6em .9em; }
  #homeStats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  #homeStats dt { font-size: .66rem; letter-spacing: .04em; }
  .demo b { width: 38px; height: 38px; font-size: 1.4rem; }
  .demo i { font-size: 2.2rem; }
  #s-home .tag { font-size: 1rem; }
}
@media (max-height: 860px) { #s-home .card { gap: 13px; } }
@media (prefers-reduced-motion: reduce) { .box, .tile, .tiles .tile, .cheer { animation: none !important; } }
.calm .box, .calm .tile, .calm .tiles .tile, .calm .cheer, .calm .screen, .calm .toast { animation: none !important; }
</style>
<!--BODY-->
<div id="play" hidden>
  <div class="phase look" id="phase">Look</div>
  <div class="pic" id="pic"></div>
  <div class="word" id="word"></div>
  <div class="lookbar" id="lookbar" aria-hidden="true"><i id="lookfill"></i></div>
  <div class="tools">
    <button class="btn" id="hearBtn"><i aria-hidden="true">🔊</i>Hear it</button>
    <button class="btn" id="lookBtn"><i aria-hidden="true">👀</i>Look again</button>
  </div>
  <div class="tilebox"><div class="tiles wait" id="tiles"></div><div class="cheer" id="cheer" hidden></div></div>
</div>

<div id="hud" hidden>
  <div class="hud-top">
    <div class="hud-chips">
      <span class="chip chipbox" id="wordChip">Word 1 / 10</span>
      <span class="chip chipbox" id="starChip">⭐ 0</span>
      <span class="chip soft chipbox" id="deckChip"></span>
    </div>
    <button class="hud-btn" id="pauseBtn" aria-label="Pause">
      <svg width="18" height="20" viewBox="0 0 16 18" aria-hidden="true"><rect x="1" y="1" width="5" height="16" rx="2" fill="currentColor"/><rect x="10" y="1" width="5" height="16" rx="2" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<main id="screens">
  <section class="screen" id="s-home">
    <div class="card">
      <div class="head"><h1 class="logo">Spell <span>It</span></h1><div class="demo" aria-hidden="true"><i>🐱</i><b>c</b><b>a</b><b>t</b></div></div>
      <p class="tag">Look at the word, it hides, then spell it from memory with the letter tiles.</p>
      <div>
        <p class="seg-title">Words</p>
        <div class="decks" id="decks"></div>

/* Sizes so a whole word, its tiles and the picture fit with no scrolling: the boxes as big as

  const cs = getComputedStyle(playEl);

  if (game.state !== 'spell') return;
  const need = game.word.w[game.pos];
  let i = ch === need ? game.tiles.findIndex((t) => !t.used && t.ch === ch) : -1;
  if (i < 0) i = game.tiles.findIndex((t) => !t.used && t.ch === ch);
  if (i >= 0) tapTile(i);
  else if (!calm()) { const b = boxes[game.pos]; b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
}
function lookAgain() {
  if (game.state !== 'spell' || game.listen) return;
  game.looked = true; game.state = 'peek'; game.peekEnd = game.t + 1.5;
  boxes.forEach((b, i) => { if (i >= game.pos) { b.textContent = game.word.w[i]; b.classList.add('peek'); } b.classList.remove('now'); });

}
function endPeek() {

}
function wordDone() {
  const w = game.word, perfect = game.slips === 0 && !game.looked;
  game.state = 'done'; game.nextAt = game.t + 1.9;
  game.results.push({ w: w.w, pic: w.pic, kind: w.kind, perfect: perfect, slips: game.slips, looked: game.looked });
  markNow();
  boxes.forEach((b, i) => { b.classList.remove('fill', 'flip', 'now'); b.style.animationDelay = calm() ? '' : (i * 0.04) + 's'; b.classList.add('win'); });
  if (w.kind === 'fact') { if (perfect) mathRight(w.q); else mathWrong(w.q); }

  setPhase('done');
  tilesEl.className = 'tiles wait';
  cheerEl.textContent = perfect ? pick(['Perfect!', 'Spot on!', 'Brilliant!', 'Super spelling!']) + ' ⭐' : pick(['You got it!', 'Well done!', 'Nice work!']) + ' 👍';
  cheerEl.hidden = false; cheerEl.style.animation = 'none'; void cheerEl.offsetWidth; cheerEl.style.animation = '';

// a word spelled with no slip and no look again is learned; any other goes on the list to come back
function remember(w, perfect) {
  const k = w.w, d = game.deck;
  if (perfect) {
    if (rec.learned.indexOf(k) < 0) rec.learned.push(k);
    rec.missed = rec.missed.filter((m) => !(m.d === d && m.w === k));
  } else if (w.kind !== 'fact') {
    // the last 20 missed words of each deck (so one busy deck never pushes out another's)
    rec.missed = rec.missed.filter((m) => !(m.d === d && m.w === k)).concat([{ d: d, l: game.level, w: k }]);
    const mine = rec.missed.filter((m) => m.d === d);
    if (mine.length > 20) rec.missed.splice(rec.missed.indexOf(mine[0]), 1);
  }
  writeSave();
}
function sparkles(n) {
  if (calm()) return;
  const r = wordEl.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'spark'; s.textContent = pick(['⭐', '✨', '🌟']);
    s.style.left = (r.left + r.width * (i + 0.5) / n - 15) + 'px'; s.style.top = (r.top - 10) + 'px';
    s.style.setProperty('--dx', ((i - n / 2) * 8) + 'px'); s.style.animationDelay = (i * 0.05) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}
function nextWord() {
  game.i++;
  if (game.i >= ROUND) finishRound(); else showWord();
}
function chipFor(r, miss) {
  const tag = r.kind === 'emoji' ? '<i>' + r.pic + '</i>' : r.kind === 'number' || r.kind === 'fact' ? '<i class="n">' + r.pic.replace(' = ?', '') + '</i>'
    : r.kind === 'rule' ? '<i class="n">' + (r.pic.indexOf(' + ') > 0 ? r.pic : r.pic.replace('one ', '').replace(', two …', ' →')) + '</i>' : '';
  return '<span class="wchip' + (miss ? ' miss' : '') + '">' + tag + r.w + '</span>';
}
function finishRound() {
  const perfect = game.results.filter((r) => r.perfect), miss = game.results.filter((r) => !r.perfect);
  const stars = perfect.length >= 9 ? 3 : perfect.length >= 6 ? 2 : 1, key = bestKey(game.deck, game.level, game.listen);
  const prevBest = rec.best[key] || 0, better = prevBest > 0 && stars > prevBest;
  rec.best[key] = Math.max(rec.best[key] || 0, stars); rec.rounds++; rec.perfect += perfect.length;
  writeSave();
  game.state = 'results'; game.lastStars = stars; game.word = null;
  Speech.stop();
  $('#doneTitle').textContent = stars === 3 ? 'Super speller!' : stars === 2 ? 'Great spelling!' : 'Good practice!';
  $('#doneStars').innerHTML = starRow(stars);
  $('#doneNote').textContent = perfect.length + ' of ' + ROUND + ' words perfect' + (game.listen ? ' · 👂 Listen only' : '') + (better ? ' · a new best here!' : '');
  $('#perfectBox').hidden = !perfect.length; $('#perfectList').innerHTML = perfect.map((r) => chipFor(r, false)).join('');
  $('#missBox').hidden = !miss.length; $('#missList').innerHTML = miss.map((r) => chipFor(r, true)).join('');
  $('#doneStats').innerHTML = stat('Words learned', rec.learned.length) + stat('Rounds played', rec.rounds);
  $('#hud').hidden = true; playEl.hidden = true;
  Sound.sfx.win();
  showScreen('done');
  announce(perfect.length + ' of ' + ROUND + ' words perfect. ' + stars + ' stars.');
}

/* ================= menus ================= */
function deckNote() {
  const l = rec.level, d = rec.deck, look = ' · ' + LOOK_SEC[l] + ' s to look';
  const notes = {
    numbers: { easy: 'Spell one to twenty' + look, medium: '21 to 99, with a hyphen: forty-two' + look, hard: 'Work out the sum, spell the answer · math level ' + (MATH[save.settings.mathLevel] || MATH.explorer).name },
    tricky: { easy: 'said, they, once… with a sentence clue', medium: 'because, friend, people… with a sentence clue', hard: 'believe, separate, necessary… with a sentence clue' },
    homophones: { easy: 'Same sound, different spelling: to · too · two, see · sea', medium: 'there · their · they’re, flour · flower', hard: 'weather · whether, aloud · allowed' },
    endings: { easy: 'Add -es, -ing, -ed, -er, -ly: foxes, jumping, taller', medium: 'Drop the e or double the last letter: making, stopped', hard: 'y turns to i, f turns to v, odd plurals: babies, leaves, mice' }
  };
  const base = notes[d] ? notes[d][l] : (l === 'easy' ? '3–4 letter words' : l === 'medium' ? '5–6 letter words' : 'Words of 7 letters or more') + look;
  return rec.listen ? base.replace(look, '') + ' · Listen only: the word is never shown' : base;
}
$('#decks').innerHTML = DECK_IDS.map((id) => '<label class="deck" data-deck="' + id + '"><input type="radio" name="deck" value="' + id + '"><span><i aria-hidden="true">' +
  DECKS[id].icon + '</i>' + DECKS[id].name + '<small></small></span></label>').join('');
function renderHome() {
  DECK_IDS.forEach((id) => {
    const best = rec.best[bestKey(id, rec.level, rec.listen)] || 0, lab = document.querySelector('.deck[data-deck="' + id + '"]');
    lab.querySelector('input').checked = id === rec.deck;
    const sm = lab.querySelector('small');
    sm.textContent = best ? '★'.repeat(best) + '☆'.repeat(3 - best) : '';
    sm.setAttribute('aria-label', best ? 'best ' + best + ' of 3 stars' : 'not played yet');
  });
  const lv = document.querySelector('input[name="level"][value="' + rec.level + '"]');
  if (lv) lv.checked = true;
  $('#deckNote').textContent = deckNote();
  const best = rec.best[bestKey(rec.deck, rec.level, rec.listen)] || 0;
  $('#homeStats').innerHTML = stat('Words learned', rec.learned.length) + stat('Rounds played', rec.rounds) + stat('Best here', best ? '★'.repeat(best) : '–');
  const sp = $('#speakBtn');
  sp.textContent = !Speech.ok ? 'Read aloud: not here' : save.settings.speak ? 'Read aloud: on' : 'Read aloud: off';
  sp.disabled = !Speech.ok; sp.setAttribute('aria-pressed', String(!!save.settings.speak));
  $('#soundBtn').textContent = save.settings.music > 0 ? 'Music: on' : 'Music: off';
  const lb = $('#listenBtn');
  lb.lastChild.textContent = 'Listen only: ' + (rec.listen ? 'on' : 'off');

}
function goHome() {
  game.state = 'menu'; game.word = null; Speech.stop();
  $('#hud').hidden = true; playEl.hidden = true;
  Sound.muffle(false); Sound.play('menu');
  renderHome();
  showScreen('home', false);
}
function pause() {
  if (!PLAYING.has(game.state)) return;
  game.prev = game.state; game.state = 'pause';
  Speech.stop(); Sound.muffle(true);
  playEl.classList.add('away');   // no peeking at the word while paused
  $('#pauseInfo').textContent = 'Word ' + (game.i + 1) + ' of ' + ROUND + ' · ' + DECKS[game.deck].name + ' · ' + LEVEL_NAME[game.level] + (game.listen ? ' · Listen only' : '');
  showScreen('pause');
}
function resume() {
  if (game.state !== 'pause') return;
  showScreen(null); playEl.classList.remove('away');
  game.state = game.prev; lastFrame = performance.now();
  Sound.muffle(false);
}

$('#startBtn').addEventListener('click', () => startRound());
$('#againBtn').addEventListener('click', () => startRound());
$('#resumeBtn').addEventListener('click', resume);
$('#restartBtn').addEventListener('click', () => startRound());
$('#homeBtn').addEventListener('click', goHome);
$('#doneHomeBtn').addEventListener('click', goHome);
$('#pauseBtn').addEventListener('click', pause);

$('#lookBtn').addEventListener('click', lookAgain);
tilesEl.addEventListener('click', (e) => { const b = e.target.closest('.tile'); if (b) tapTile(+b.dataset.i); });

document.addEventListener('change', (e) => {
  if (e.target.name === 'deck' && DECKS[e.target.value]) { rec.deck = e.target.value; writeSave(); renderHome(); }
  else if (e.target.name === 'level' && LEVELS.indexOf(e.target.value) >= 0) { rec.level = e.target.value; writeSave(); renderHome(); }
});
window.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') { if (PLAYING.has(game.state)) { e.preventDefault(); pause(); } else if (game.state === 'pause') { e.preventDefault(); resume(); } return; }
  if (game.state === 'spell' && e.key && e.key.length === 1 && /[a-z'’-]/i.test(e.key)) { e.preventDefault(); if (!e.repeat) typeLetter(e.key.toLowerCase().replace('’', "'")); }

arcadeGuards(pause);
// the menu song starts with the first touch on the home screen (sound needs a tap on iPad)
document.addEventListener('pointerdown', () => { if (game.state === 'menu' && save.settings.music > 0) Sound.play('menu'); });

/* ================= loop: the look time, the peek and the pause after a word ================= */
let lastFrame = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  if (muffled && now > muffleUntil && game.state !== 'pause') { muffled = false; Sound.muffle(false); }
  if (!PLAYING.has(game.state)) return;
  game.t += dt * game.speed;
  if (game.state === 'look') {
    $('#lookfill').style.transform = 'scaleX(' + clamp((game.lookEnd - game.t) / game.lookDur, 0, 1).toFixed(3) + ')';
    if (game.t >= game.lookEnd) cover();
  } else if (game.state === 'peek') { if (game.t >= game.peekEnd) endPeek(); }
  else if (game.state === 'done') { if (game.t >= game.nextAt) nextWord(); }
}
document.body.classList.toggle('calm', calm());
renderHome();
showScreen('home', false);
arcadeLinks();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load('700 40px Fredoka').catch(() => {});

/* ================= test hook ================= */
const nextIndex = () => (game.state === 'spell' ? game.tiles.findIndex((t) => !t.used && t.ch === game.word.w[game.pos]) : -1);
const wrongIndex = () => (game.state === 'spell' ? game.tiles.findIndex((t) => !t.used && t.ch !== game.word.w[game.pos]) : -1);
function mark(i) {
  $$('[data-bot]').forEach((e) => e.removeAttribute('data-bot'));
  const el = i >= 0 ? game.tiles[i].el : $('#phase');

  return i;
}
// what a finished layout must hold: everything inside the screen, tiles 56 px or more, nothing scrolls
function fits() {
  const bad = [], vw = innerWidth, vh = innerHeight, in1 = (r) => r.left >= -0.5 && r.right <= vw + 0.5 && r.top >= -0.5 && r.bottom <= vh + 0.5;
  if (document.documentElement.scrollHeight > vh + 1 || document.documentElement.scrollWidth > vw + 1) bad.push('page scrolls');
  if (!playEl.hidden) {
    const hudB = $('.hud-top').getBoundingClientRect().bottom;
    boxes.forEach((b, i) => { const r = b.getBoundingClientRect(); if (!in1(r)) bad.push('box ' + i + ' outside'); });
    game.tiles.forEach((t, i) => { const r = t.el.getBoundingClientRect(); if (!in1(r)) bad.push('tile ' + i + ' outside'); if (r.width < 56 || r.height < 56) bad.push('tile ' + i + ' small ' + Math.round(r.width)); });
    const pr = picEl.getBoundingClientRect();
    if (pr.top < hudB - 1) bad.push('picture under the HUD');
    if (!in1(pr)) bad.push('picture outside');
    const inner = picEl.firstChild && picEl.firstChild.getBoundingClientRect();
    if (inner && (inner.width > pr.width + 1 || inner.height > pr.height + 1)) bad.push('picture content cut ' + Math.round(inner.width) + 'x' + Math.round(inner.height) + ' in ' + Math.round(pr.width) + 'x' + Math.round(pr.height));
    const tb = tilesEl.getBoundingClientRect();
    if (tb.bottom > vh + 0.5) bad.push('tiles below the screen');
    const wr = wordEl.getBoundingClientRect();
    if (wr.bottom > $('.tools').getBoundingClientRect().top + 0.5) bad.push('word overlaps the buttons');
    if ($('.tools').getBoundingClientRect().bottom > tb.top + 0.5) bad.push('buttons overlap the tiles');
    if (pr.bottom > wr.top + 0.5) bad.push('picture overlaps the word');
  }
  return bad;
}
window.__spell = {

<title>Number Ladder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Climb a ladder of 30 equations: land on the right answer to build the next floor, a wrong one drops you to the ground.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one full-bleed canvas with a tower in the middle; the equation floats big at the
   top, menus are cards over the scenery. Same palette family as Number Dash: pastel sky,
   sunny yellow for the main action, gold-edged answer panels. */
:root {
  --sky: #e6f3fc; --ink: #29345a; --ink-soft: #5d6890; --card: #fdfeff; --card-2: #eef5fc; --line: #d0dff0;
  --sun: #ffc94d; --sun-deep: #e2a526; --sun-ink: #4a3500; --mint: #4fd1a5; --mint-deep: #2a9f78; --lilac: #9d84ff;
  --coral: #ff7b86; --door: #fff3d6; --door-edge: #f0b544; --door-ink: #3a3f6b; --veil: rgba(230, 243, 252, .55);
  --shadow: 0 12px 32px rgba(41, 52, 90, .16);
  --font-display: "Fredoka", "Arial Rounded MT Bold", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #1c2147; --ink: #edf0ff; --ink-soft: #b4bbe3; --card: #283063; --card-2: #222955; --line: #3b437f;
    --sun: #ffcd5a; --sun-deep: #d99f2c; --sun-ink: #3d2a00; --mint: #5adbb0; --mint-deep: #34a882; --lilac: #ab95ff;
    --coral: #ff8a94; --veil: rgba(28, 33, 71, .5); --shadow: 0 14px 36px rgba(0, 0, 0, .42); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #1c2147; --ink: #edf0ff; --ink-soft: #b4bbe3; --card: #283063; --card-2: #222955; --line: #3b437f;
  --sun: #ffcd5a; --sun-deep: #d99f2c; --sun-ink: #3d2a00; --mint: #5adbb0; --mint-deep: #34a882; --lilac: #ab95ff;
  --coral: #ff8a94; --veil: rgba(28, 33, 71, .5); --shadow: 0 14px 36px rgba(0, 0, 0, .42); color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; }
button, label, input, .btn { touch-action: manipulation; }
.btn {
  font: 600 1.05rem/1.1 var(--font-display); color: var(--ink); background: var(--card-2); border: 2px solid var(--line); border-radius: 16px;
  padding: .75em 1.15em; box-shadow: 0 4px 0 var(--line); cursor: pointer; text-decoration: none; display: inline-block;
  transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:hover { background: var(--card); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn:focus-visible, .seg input:focus-visible + span { outline: 3px solid var(--lilac); outline-offset: 3px; }
.btn.sun { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); box-shadow: 0 4px 0 var(--sun-deep); }
.btn.sun:active { box-shadow: 0 1px 0 var(--sun-deep); }
.btn.big { font-size: 1.6rem; padding: .6em 2.2em; border-radius: 22px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

#screens {
  position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto; pointer-events: none; touch-action: pan-y;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
}
#screens.dim { background: var(--veil); }
.screen { pointer-events: auto; width: min(100%, 560px); animation: rise .35s ease both; }
.card { background: var(--card); border-radius: 28px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 34px); display: grid; gap: 18px; text-align: center; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(.85); } 70% { transform: scale(1.04); } 100% { transform: scale(1); } }
.logo { margin: 0; font: 700 clamp(2.6rem, 9vw, 4.2rem)/.95 var(--font-display); text-wrap: balance; }
.logo span { color: var(--mint-deep); }
.tag { margin: 0 auto; max-width: 38ch; color: var(--ink-soft); font-size: 1.08rem; line-height: 1.5; text-wrap: balance; }
.how { margin: 0; color: var(--ink-soft); font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; }
.stats div { background: var(--card-2); border-radius: 16px; padding: 12px 6px; min-width: 0; }
.stats dt { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 800; }
.stats dd { margin: 4px 0 0; font: 700 1.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; font: 600 .95rem/1.15 var(--font-display); padding: .55em .85em; border-radius: 14px; background: var(--card-2); border: 2px solid var(--line); }
.seg input:checked + span { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); }
.seg-title { margin: 0; font: 600 .9rem/1 var(--font-display); color: var(--ink-soft); }
.small-card h2 { margin: 0; font: 700 clamp(1.9rem, 6vw, 2.6rem)/1.05 var(--font-display); text-wrap: balance; }
.small-card p { margin: 0; color: var(--ink-soft); }

#hud { position: fixed; inset: 0; pointer-events: none; }
.hud-top {
  position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.chipbox { background: var(--card); border-radius: 99px; box-shadow: 0 4px 14px rgba(41, 52, 90, .14); }
.hud-chips { display: grid; gap: 6px; justify-items: start; }
.chip { font: 600 1.05rem/1 var(--font-display); padding: 8px 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.soft { font-size: .85rem; padding: 6px 12px; color: var(--ink-soft); }
.hud-btn { pointer-events: auto; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--card); box-shadow: 0 4px 14px rgba(41, 52, 90, .14); cursor: pointer; display: grid; place-items: center; flex: none; }
.hud-btn:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
.q {
  position: absolute; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--card); border-radius: 26px; padding: 10px 26px; box-shadow: var(--shadow); border: 4px solid var(--door-edge);
  font: 700 clamp(30px, min(8vw, 8vh), 72px)/1.05 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap;
  max-width: calc(100% - 200px); animation: qpop .35s ease both;
}
@keyframes qpop { 0% { transform: translateX(-50%) scale(.85); } 70% { transform: translateX(-50%) scale(1.04); } 100% { transform: translateX(-50%) scale(1); } }
.q.good { border-color: var(--mint); color: var(--mint-deep); }
.q b { color: var(--mint-deep); }
#meter {
  position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%);
  width: 16px; height: 46vh; border-radius: 99px; background: var(--card); box-shadow: 0 4px 14px rgba(41, 52, 90, .14); padding: 3px;
}
#meter i { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 0; border-radius: 99px; background: linear-gradient(0deg, var(--mint), var(--sun)); transition: height .3s ease; }
#meter b { position: absolute; left: -7px; right: -7px; height: 4px; border-radius: 4px; background: var(--sun-deep); bottom: 0; }
#oops {
  position: fixed; left: 50%; top: 50%; translate: -50% -50%; width: min(calc(100% - 32px), 440px);
  background: var(--card); border-radius: 26px; box-shadow: var(--shadow); padding: 20px 22px; text-align: center;
  display: grid; gap: 8px; border: 3px solid var(--door-edge); animation: pop .35s ease both; pointer-events: none;
}
#oops h2 { margin: 0; font: 700 1.6rem/1.1 var(--font-display); }
#oops .fact { font: 700 clamp(30px, 8vw, 44px)/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
#oops .fact b { color: var(--mint-deep); }
#oops p { margin: 0; color: var(--ink-soft); font-weight: 700; }
.toast { position: absolute; left: 50%; top: 42%; translate: -50% 0; font: 700 1.4rem/1 var(--font-display); padding: 12px 20px; animation: pop .3s ease both; white-space: nowrap; }
.toast.hello { top: calc(max(128px, 20%) + env(safe-area-inset-top, 0px)); color: var(--ink); border: 3px solid var(--lilac); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (pointer: coarse) { .hud-btn { width: 58px; height: 58px; } }
@media (max-width: 640px) { .q { max-width: calc(100% - 32px); top: calc(70px + env(safe-area-inset-top, 0px)); } #meter { height: 34vh; } }
@media (prefers-reduced-motion: reduce) { .screen, .q, #oops, .toast { animation: none; } }
</style>
<!--BODY-->
<canvas id="game" aria-label="Number Ladder game area"></canvas>

<div id="hud" hidden>
  <div class="hud-top">
    <div class="hud-chips">
      <span class="chip chipbox" id="rungChip">Rung 0 / 30</span>
      <span class="chip soft chipbox" id="fallChip">Falls 0</span>
    </div>
    <button class="hud-btn" id="pauseBtn" aria-label="Pause">
      <svg width="18" height="20" viewBox="0 0 16 18" aria-hidden="true"><rect x="1" y="1" width="5" height="16" rx="2" fill="currentColor"/><rect x="10" y="1" width="5" height="16" rx="2" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="q" id="question" hidden></div>
  <div id="meter" aria-hidden="true"><i id="meterFill"></i><b id="meterBest"></b></div>
  <div class="toast chipbox" id="toast" hidden></div>
  <div class="sr" aria-live="polite" id="announce"></div>
</div>
<div id="oops" hidden>
  <h2 id="oopsTitle">Whoops!</h2>
  <div class="fact" id="oopsFact"></div>
  <p id="oopsHint"></p>
</div>

<main id="screens">
  <section class="screen" id="s-home">
    <div class="card">
      <h1 class="logo">Number <span>Ladder</span></h1>
      <p class="tag">Climb a tower of 30 equations. Land on the right answer to build the next floor. Land on a wrong one and you drop all the way to the ground.</p>
      <div class="row"><button class="btn sun big" id="playBtn">Climb</button></div>
      <p class="how">Tap anywhere (or press Space) to jump.</p>
      <div>
        <p class="seg-title">Math level</p>
        <div class="seg" style="margin-top:8px">
          <label><input type="radio" name="math" value="starter" id="mStarter"><span>Starter · 7–8</span></label>
          <label><input type="radio" name="math" value="explorer" id="mExplorer"><span>Explorer · 9–10</span></label>
          <label><input type="radio" name="math" value="genius" id="mGenius"><span>Genius · 11–12</span></label>
        </div>
      </div>
      <dl class="stats" id="homeStats"></dl>
      <div class="row">
        <button class="btn" id="soundBtn">Music on</button>
        <a class="btn" id="hubLink" hidden href="../">All games</a>
      </div>
    </div>
  </section>
  <section class="screen" id="s-pause" hidden>
    <div class="card small-card">
      <h2>Paused</h2>
      <p id="pauseInfo"></p>
      <div class="row"><button class="btn sun big" id="resumeBtn">Keep climbing</button></div>
      <div class="row"><button class="btn" id="restartBtn">Start over</button><button class="btn" id="homeBtn">Home</button></div>
    </div>
  </section>
  <section class="screen" id="s-top" hidden>
    <div class="card small-card">
      <h2>You reached the top!</h2>
      <p id="topNote"></p>
      <dl class="stats" id="topStats"></dl>
      <div class="row"><button class="btn sun big" id="againBtn">Climb again</button></div>
      <div class="row"><button class="btn" id="topHomeBtn">Home</button><a class="btn" id="topHubLink" hidden href="../">All games</a></div>
    </div>
  </section>
</main>

<script>
(function () {
'use strict';
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const frac = (v) => ((v % 1) + 1) % 1;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* ================= saved progress (this device) =================
   The arcade save is shared with Number Dash: cube look, math level, sound, math stats.
   The ladder keeps its own records next to it. */
const SAVE_KEY = 'number-dash.v1', LADDER_KEY = 'number-ladder.v1';
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const save = {
  levels: {},
  math: { right: 0, wrong: 0, streak: 0, best: 0, tricky: [] },
  settings: { mathLevel: 'explorer', think: 'normal', music: 0.7, sfx: 0.8, sky: 'auto', calm: reduceMotion },
  cube: { color: 0, face: 0 }
};
const rec = { best: 0, bestTime: 0, tops: 0, falls: 0 };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { const d = JSON.parse(raw); for (const k of Object.keys(save)) if (d && d[k] && typeof d[k] === 'object') Object.assign(save[k], d[k]); }
  const lr = localStorage.getItem(LADDER_KEY);
  if (lr) Object.assign(rec, JSON.parse(lr));
} catch (e) { /* storage blocked: play without saving */ }
function writeSave() {
  try {
    const cur = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    cur.math = save.math; cur.settings = save.settings; cur.cube = save.cube;
    if (!cur.levels) cur.levels = save.levels;
    localStorage.setItem(SAVE_KEY, JSON.stringify(cur));
    localStorage.setItem(LADDER_KEY, JSON.stringify(rec));
  } catch (e) { /* ignore */ }
}

/* ================= math questions ================= */
const MINUS = '−', TIMES = '×', DIV = '÷';
const FRAC = { 2: '½', 3: '⅓', 4: '¼', 5: '⅕', 10: '⅒' };
const MATH = {
  starter: { name: 'Starter', kinds: ['add20', 'add20', 'sub20', 'sub20', 'make10', 'double', 'table2510', 'table2510'] },
  explorer: { name: 'Explorer', kinds: ['add100', 'sub100', 'table10', 'table10', 'table10', 'div10', 'div10', 'missing'] },
  genius: { name: 'Genius', kinds: ['table12', 'table12', 'div12', 'order', 'order', 'fraction', 'percent', 'big', 'missingMul'] }
};
const KINDS = {
  add20() { const a = rnd(3, 12), b = rnd(2, 20 - a); return { t: a + ' + ' + b, a: a + b }; },
  sub20() { const a = rnd(9, 20), b = rnd(2, a - 2); return { t: a + ' ' + MINUS + ' ' + b, a: a - b }; },
  make10() { const b = rnd(1, 9); return { t: (10 - b) + ' + ? = 10', a: b }; },
  double() { const a = rnd(3, 10); return { t: a + ' + ' + a, a: a * 2 }; },
  table2510() { const m = pick([2, 5, 10]), b = rnd(1, 10); return { t: b + ' ' + TIMES + ' ' + m, a: b * m, f: [b, m] }; },
  add100() { const a = rnd(14, 68), b = rnd(7, 99 - a); return { t: a + ' + ' + b, a: a + b }; },
  sub100() { const a = rnd(31, 99), b = rnd(8, a - 11); return { t: a + ' ' + MINUS + ' ' + b, a: a - b }; },
  table10() { const a = rnd(2, 10), b = rnd(2, 10); return { t: a + ' ' + TIMES + ' ' + b, a: a * b, f: [a, b] }; },
  div10() { const b = rnd(2, 10), c = rnd(2, 10); return { t: (b * c) + ' ' + DIV + ' ' + b, a: c }; },
  missing() { const a = rnd(6, 40), c = a + rnd(5, 30); return { t: a + ' + ? = ' + c, a: c - a }; },
  table12() { const a = rnd(3, 12), b = rnd(3, 12); return { t: a + ' ' + TIMES + ' ' + b, a: a * b, f: [a, b] }; },
  div12() { const b = rnd(3, 12), c = rnd(3, 12); return { t: (b * c) + ' ' + DIV + ' ' + b, a: c }; },
  order() {
    const a = rnd(2, 9), b = rnd(2, 9), c = rnd(2, 9);
    return Math.random() < 0.5
      ? { t: c + ' + ' + a + ' ' + TIMES + ' ' + b, a: c + a * b, trap: (c + a) * b }
      : { t: a + ' ' + TIMES + ' (' + b + ' + ' + c + ')', a: a * (b + c), trap: a * b + c };
  },
  fraction() { const d = pick([2, 3, 4, 5, 10]), n = rnd(2, 12) * d; return { t: FRAC[d] + ' of ' + n, a: n / d }; },
  percent() {
    const p = pick([10, 25, 50]);
    const base = p === 25 ? rnd(2, 12) * 4 : p === 50 ? rnd(3, 20) * 2 : rnd(2, 15) * 10;
    return { t: p + '% of ' + base, a: base * p / 100 };
  },
  big() { const a = rnd(11, 45) * 5, b = rnd(5, 30) * 5; return Math.random() < 0.5 ? { t: a + ' + ' + b, a: a + b } : { t: (a + b) + ' ' + MINUS + ' ' + b, a: a }; },
  missingMul() { const a = rnd(3, 12), b = rnd(3, 12); return { t: '? ' + TIMES + ' ' + a + ' = ' + (a * b), a: b, f: [b, a] }; }
};
function wrongAnswers(q, n) {
  const ans = q.a, used = new Set([ans]), out = [];
  const cands = [ans + 1, ans - 1, ans + 2, ans - 2];
  if (q.trap !== undefined) cands.push(q.trap, q.trap);
  if (q.f) { const a = q.f[0], b = q.f[1]; cands.push(a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b); }
  if (ans >= 10) {
    cands.push(ans + 10, ans - 10);
    const s = String(ans);
    if (s.length === 2 && s[0] !== s[1] && s[1] !== '0') cands.push(+(s[1] + s[0]));
  }
  for (const v of shuffle(cands)) {
    if (out.length >= n) break;
    if (v >= (ans > 0 ? 1 : 0) && Number.isInteger(v) && !used.has(v)) { used.add(v); out.push(v); }
  }
  while (out.length < n) { const v = ans + rnd(3, 7) * (Math.random() < 0.5 ? -1 : 1); if (v >= (ans > 0 ? 1 : 0) && !used.has(v)) { used.add(v); out.push(v); } }
  return out;
}
let lastAsked = '';
function makeQuestion(lanes) {
  const lv = MATH[save.settings.mathLevel] || MATH.explorer;
  let q = null;
  const tricky = (save.math.tricky || []).filter((t) => t.t !== lastAsked);
  if (tricky.length && Math.random() < 0.3) q = Object.assign({}, pick(tricky), { again: true });
  for (let i = 0; !q || (q.t === lastAsked && i < 6); i++) q = KINDS[pick(lv.kinds)]();
  lastAsked = q.t;
  const choices = shuffle([q.a].concat(wrongAnswers(q, lanes - 1)));
  return { text: q.t.indexOf('?') >= 0 ? q.t : q.t + ' = ?', answer: q.a, choices: choices, correct: choices.indexOf(q.a) + 1, raw: q, done: false };
}
function solvedText(q) { return q.raw.t.indexOf('?') >= 0 ? q.raw.t.replace('?', '<b>' + q.answer + '</b>') : q.raw.t + ' = <b>' + q.answer + '</b>'; }
// The ladder's own question picker: easier sums low down, harder ones near the top.
const TIERS = {
  starter: [['add20', 'sub20', 'make10', 'double'], ['add20', 'sub20', 'make10', 'double', 'table2510'], ['table2510', 'table2510', 'sub20', 'add20', 'double']],
  explorer: [['add100', 'sub100', 'table2510', 'missing'], ['table10', 'div10', 'add100', 'sub100', 'missing'], ['table10', 'div10', 'table12', 'div12', 'missing']],
  genius: [['table10', 'div10', 'big', 'missing'], ['table12', 'div12', 'fraction', 'percent', 'big', 'missingMul'], ['order', 'order', 'table12', 'div12', 'fraction', 'percent', 'missingMul']]
};
function ladderQuestion(r, n) {
  const tiers = TIERS[save.settings.mathLevel] || TIERS.explorer, tier = r <= 10 ? 0 : r <= 20 ? 1 : 2;
  let q = null;
  const tricky = (save.math.tricky || []).filter((t) => t.t !== lastAsked);
  if (tricky.length && Math.random() < 0.25) q = Object.assign({}, pick(tricky), { again: true });
  for (let i = 0; !q || (q.t === lastAsked && i < 6); i++) q = KINDS[pick(tiers[tier])]();
  lastAsked = q.t;
  const choices = shuffle([q.a].concat(wrongAnswers(q, n - 1)));
  return { text: q.t.indexOf('?') >= 0 ? q.t : q.t + ' = ?', answer: q.a, choices: choices, correct: choices.indexOf(q.a), raw: q };
}
function mathRight(q) {
  const m = save.math;
  m.right++; m.streak++; m.best = Math.max(m.best, m.streak);
  if (q.raw.again) m.tricky = m.tricky.filter((t) => t.t !== q.raw.t);
  writeSave();
}
function mathWrong(q) {
  const m = save.math;
  m.wrong++; m.streak = 0;

$('#pauseBtn').addEventListener('pointerdown', (e) => e.stopPropagation());
$('#soundBtn').addEventListener('click', () => {
  save.settings.music = save.settings.music > 0 ? 0 : 0.7; writeSave(); Sound.init(); Sound.setVolumes(); renderHome();
});
document.addEventListener('change', (e) => { if (e.target.name === 'math') { save.settings.mathLevel = e.target.value; writeSave(); } });
if (window.ARCADE_HOME) { ['#hubLink', '#topHubLink'].forEach((s) => { const a = $(s); a.href = window.ARCADE_HOME; a.hidden = false; }); }

/* ================= input ================= */
const JUMP = new Set(['Space', 'ArrowUp', 'KeyW', 'Enter']);
window.addEventListener('keydown', (e) => {
  if (JUMP.has(e.code) && inClimb()) { e.preventDefault(); if (!e.repeat) press(); return; }
  if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat) { if (inClimb()) { e.preventDefault(); pause(); } else if (game.state === 'pause') { e.preventDefault(); resume(); } }
  else if (e.code === 'KeyM' && !e.repeat) { save.settings.music = save.settings.music > 0 ? 0 : 0.7; Sound.init(); Sound.setVolumes(); writeSave(); }
});
cv.addEventListener('pointerdown', (e) => { if (!inClimb()) return; e.preventDefault(); press(); });
cv.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('pointerdown', () => Sound.init());
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); else Sound.init(); });
window.addEventListener('blur', () => pause());
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
window.addEventListener('resize', resize);

/* ================= loop ================= */
let lastFrame = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  if (game.state !== 'pause') {
    acc += dt;
    while (acc >= PH.DT) { step(PH.DT); acc -= PH.DT; }
    stepParts(dt);
  }
  render(now, dt);
}
resize();
renderHome();
showScreen('home');
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load('700 40px Fredoka').catch(() => {});
window.__ladder = { game, predict, press, rec, save, PH, D, TOP, makeRow, platAt, MOTIONS };
})();
</script>

<title>English Quest</title>
<meta name="description" content="Step by step from first English words to IELTS band 8: short lessons with words, grammar, listening, spelling, sentence building and reading.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root {
  --sky: #e6f3fc; --sky-top: #8fd1fb; --sky-bot: #e8f6ff; --ink: #29345a; --ink-soft: #5d6890; --card: #fdfeff; --card-2: #eef5fc; --line: #d0dff0;
  --sun: #ffc94d; --sun-deep: #e2a526; --sun-ink: #4a3500; --mint: #4fd1a5; --mint-deep: #2a9f78; --mint-soft: #d9f7ea; --lilac: #9d84ff; --lilac-soft: #ece6ff;
  --coral: #ff7b86; --coral-deep: #d9505d; --coral-soft: #ffe1e4; --sky-blue: #5cb8ff; --pink: #ff9fcf;
  --door: #fff3d6; --door-edge: #f0b544; --door-ink: #3a3f6b; --veil: rgba(230, 243, 252, .6);
  --shadow: 0 12px 32px rgba(41, 52, 90, .16); --shadow-sm: 0 4px 14px rgba(41, 52, 90, .14);
  --font-display: "Fredoka", "Arial Rounded MT Bold", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #1c2147; --sky-top: #1d2350; --sky-bot: #3b3a7e; --ink: #edf0ff; --ink-soft: #b4bbe3; --card: #283063; --card-2: #222955; --line: #3b437f;
    --sun: #ffcd5a; --sun-deep: #d99f2c; --sun-ink: #3d2a00; --mint: #5adbb0; --mint-deep: #5adbb0; --mint-soft: #1f4a4a; --lilac: #ab95ff; --lilac-soft: #352f6e;
    --coral: #ff8a94; --coral-deep: #ff8a94; --coral-soft: #4d2a45; --door: #fff1d2; --veil: rgba(28, 33, 71, .55);
    --shadow: 0 14px 36px rgba(0, 0, 0, .42); --shadow-sm: 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #1c2147; --sky-top: #1d2350; --sky-bot: #3b3a7e; --ink: #edf0ff; --ink-soft: #b4bbe3; --card: #283063; --card-2: #222955; --line: #3b437f;
  --sun: #ffcd5a; --sun-deep: #d99f2c; --sun-ink: #3d2a00; --mint: #5adbb0; --mint-deep: #5adbb0; --mint-soft: #1f4a4a; --lilac: #ab95ff; --lilac-soft: #352f6e;
  --coral: #ff8a94; --coral-deep: #ff8a94; --coral-soft: #4d2a45; --door: #fff1d2; --veil: rgba(28, 33, 71, .55);
  --shadow: 0 14px 36px rgba(0, 0, 0, .42); --shadow-sm: 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  background: linear-gradient(var(--sky-top), var(--sky-bot) 75%) fixed; background-color: var(--sky-bot);
}
button { font: inherit; color: inherit; }
button, label, input, .btn, a { touch-action: manipulation; }
[hidden] { display: none !important; }

/* buttons */
.btn {
  font: 600 1.05rem/1.1 var(--font-display); color: var(--ink); background: var(--card-2); border: 2px solid var(--line); border-radius: 16px;
  padding: .75em 1.15em; box-shadow: 0 4px 0 var(--line); cursor: pointer; text-decoration: none; display: inline-block;
  transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:hover { background: var(--card); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn:focus-visible, .seg input:focus-visible + span { outline: 3px solid var(--lilac); outline-offset: 3px; }
.btn.sun { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); box-shadow: 0 4px 0 var(--sun-deep); }
.btn.sun:active { box-shadow: 0 1px 0 var(--sun-deep); }
.btn.big { font-size: 1.6rem; padding: .6em 2.2em; border-radius: 22px; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

/* menu screens: cards over the game */
#screens {
  position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto; pointer-events: none; touch-action: pan-y; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
}
#screens.dim { background: var(--veil); pointer-events: auto; }
.screen { pointer-events: auto; width: min(100%, 600px); animation: rise .35s ease both; }
.card { background: var(--card); border-radius: 28px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 34px); display: grid; gap: 18px; text-align: center; }
.logo { margin: 0; font: 700 clamp(2.5rem, 9vw, 4rem)/.95 var(--font-display); text-wrap: balance; }
.logo span { color: var(--mint-deep); }
.tag { margin: 0 auto; max-width: 40ch; color: var(--ink-soft); font-size: 1.08rem; line-height: 1.5; text-wrap: balance; }
.how { margin: 0; color: var(--ink-soft); font-weight: 700; }
.small-card h2 { margin: 0; font: 700 clamp(1.9rem, 6vw, 2.6rem)/1.05 var(--font-display); text-wrap: balance; }
.small-card p { margin: 0; color: var(--ink-soft); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; margin: 0; }
.stats div { background: var(--card-2); border-radius: 16px; padding: 12px 6px; min-width: 0; }
.stats dt { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 800; }
.stats dd { margin: 4px 0 0; font: 700 1.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; font: 600 .95rem/1.15 var(--font-display); padding: .55em .85em; border-radius: 14px; background: var(--card-2); border: 2px solid var(--line); }
.seg input:checked + span { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); }
@media (pointer: coarse) { .seg span { min-height: 48px; box-sizing: border-box; display: grid; place-items: center; } }
.seg-title { margin: 0 0 8px; font: 600 .9rem/1 var(--font-display); color: var(--ink-soft); }
.stars { font-size: 2.4rem; letter-spacing: .1em; line-height: 1; }
.stars .off { opacity: .22; filter: grayscale(1); }

/* the HUD along the top while playing */
#hud { position: fixed; left: 0; right: 0; top: 0; pointer-events: none; z-index: 10; }
.hud-top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.chipbox { background: var(--card); border-radius: 99px; box-shadow: var(--shadow-sm); }
.hud-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 600 1.05rem/1 var(--font-display); padding: 8px 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.soft { font-size: .9rem; padding: 7px 12px; color: var(--ink-soft); }
.hud-btn { pointer-events: auto; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow-sm); cursor: pointer; display: grid; place-items: center; flex: none; color: var(--ink); }
.hud-btn:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
@media (pointer: coarse) { .hud-btn { width: 58px; height: 58px; } }

/* toasts and screen-reader text */
.toast {
  position: fixed; left: 50%; top: var(--toast-top, 42%); translate: -50% 0; z-index: 30; pointer-events: none; font: 700 1.4rem/1.1 var(--font-display);
  padding: 12px 20px; animation: pop .3s ease both; white-space: nowrap; background: var(--card); border-radius: 99px; box-shadow: var(--shadow-sm);
}
.toast.hello { top: calc(max(128px, 20%) + env(safe-area-inset-top, 0px)); border: 3px solid var(--lilac); }
.toast.good { color: var(--mint-deep); border: 3px solid var(--mint); }
.toast.oops { color: var(--coral-deep); border: 3px solid var(--coral); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(.85); } 70% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { translate: 0 0; } 20% { translate: -7px 0; } 40% { translate: 6px 0; } 60% { translate: -4px 0; } 80% { translate: 3px 0; } }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(79, 209, 165, .7); } 100% { box-shadow: 0 0 0 18px rgba(79, 209, 165, 0); } }
@media (prefers-reduced-motion: reduce) { .screen, .toast, .card { animation: none !important; } }
/* Layout: menus are cards (home, path, results); a lesson fills the screen: a thin top bar with
   the progress, the question in the middle, and a feedback sheet that slides up after an answer.
   Each stage has its own colour on the path. */
.home { gap: 14px; }
.tagline { margin: -6px 0 0; font: 600 1.05rem/1.2 var(--font-display); color: var(--ink-soft); }
.level { background: var(--card-2); border-radius: 20px; padding: 14px 16px; display: grid; gap: 10px; text-align: left; }
.level-top { display: flex; align-items: center; gap: 12px; }
.level-top .big { font-family: var(--emoji); font-size: 2.2rem; line-height: 1; }
.level-top b { display: block; font: 700 1.25rem/1.15 var(--font-display); }
.level-top span { color: var(--ink-soft); font-weight: 700; font-size: .92rem; }
.track { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.track i { height: 10px; border-radius: 99px; background: var(--line); }
.track i.done { background: var(--mint); }
.track i.now { background: var(--sun); }
.track-labels { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font: 700 .68rem/1.1 var(--font-body); color: var(--ink-soft); text-align: center; }
.note { margin: 0; font-size: .82rem; color: var(--ink-soft); line-height: 1.4; }
.skills { display: grid; gap: 6px; }
.skill { display: grid; grid-template-columns: 82px 1fr 40px; align-items: center; gap: 8px; font: 700 .85rem/1 var(--font-body); color: var(--ink-soft); }
.skill .bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.skill .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--sky-blue), var(--mint)); }
.skill span:last-child { text-align: right; font-variant-numeric: tabular-nums; }

/* the path */
.path-card { width: min(100%, 720px); }
.stage-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.stage-tabs::-webkit-scrollbar { display: none; }
.stage-tabs button { flex: none; border: 2px solid var(--line); background: var(--card-2); border-radius: 14px; padding: 8px 12px; font: 600 .95rem/1.1 var(--font-display); color: var(--ink); cursor: pointer; min-height: 48px; }
.stage-tabs button.on { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); }
.stage-tabs button.locked { opacity: .55; }
.stage-head { text-align: left; display: grid; gap: 4px; }
.stage-head h2 { margin: 0; font: 700 1.6rem/1.1 var(--font-display); }
.stage-head p { margin: 0; color: var(--ink-soft); }
.nodes { display: grid; gap: 10px; }
.node { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; width: min(100%, 520px); text-align: left; border: 2px solid var(--line); background: var(--card-2); border-radius: 20px; padding: 10px 14px; cursor: pointer; color: var(--ink); font: inherit; min-height: 72px; box-shadow: 0 4px 0 var(--line); }
.node:nth-child(odd) { justify-self: start; } .node:nth-child(even) { justify-self: end; }
.node .em { font-family: var(--emoji); font-size: 2rem; line-height: 1; text-align: center; }
.node b { display: block; font: 600 1.1rem/1.15 var(--font-display); }
.node small { color: var(--ink-soft); font-weight: 700; }
.node .st { font-size: 1.05rem; letter-spacing: .05em; white-space: nowrap; }
.node.next { border-color: var(--sun-deep); background: var(--door); box-shadow: 0 4px 0 var(--sun-deep); }
.node.locked { opacity: .5; cursor: default; box-shadow: none; }
.node.test { border-style: dashed; }
.node:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
.soon { padding: 18px; border-radius: 18px; background: var(--card-2); color: var(--ink-soft); font-weight: 700; }

/* a lesson */
#lesson { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; z-index: 5; }
.lbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.prog { height: 14px; border-radius: 99px; background: var(--card); box-shadow: var(--shadow-sm); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--mint), var(--sun)); transition: width .3s ease; }
.lcount { font: 700 1rem/1 var(--font-display); color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.qwrap { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: grid; }
.q { width: min(100%, 780px); margin: auto; display: grid; gap: 14px; justify-items: center; text-align: center; }
.qlabel { font: 700 .82rem/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); background: var(--card); border-radius: 99px; padding: 7px 12px; box-shadow: var(--shadow-sm); }
.qlabel .sk { color: var(--lilac); }
.prompt { font: 600 clamp(1.25rem, 3.6vw, 2rem)/1.3 var(--font-display); text-wrap: balance; white-space: pre-line; }
.prompt .gap { display: inline-block; min-width: 3.2em; border-bottom: 4px solid var(--sun-deep); margin: 0 .15em; color: var(--mint-deep); }
.bigword { font: 700 clamp(2.4rem, 8vw, 4rem)/1 var(--font-display); }
.pic { font: clamp(4.5rem, 16vw, 7.5rem)/1 var(--emoji); }
.say { display: inline-flex; align-items: center; gap: 8px; }
.say .btn { font-size: 1.15rem; }
.listen-big { width: 112px; height: 112px; border-radius: 50%; border: 0; background: var(--sun); color: var(--sun-ink); box-shadow: 0 6px 0 var(--sun-deep), var(--shadow-sm); font: 2.8rem/1 var(--emoji); cursor: pointer; }
.listen-big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sun-deep); }
.passage { width: 100%; box-sizing: border-box; text-align: left; background: var(--card); border-radius: 20px; box-shadow: var(--shadow-sm); padding: 14px 18px; max-height: 42vh; overflow-y: auto; border: 2px solid var(--line); }
.passage h3 { margin: 0 0 6px; font: 700 1.15rem/1.2 var(--font-display); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.passage p { margin: 0 0 .7em; line-height: 1.6; font-size: 1.05rem; }
.passage .btn { font-size: .9rem; padding: .5em .8em; }
.opts { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.opts.long { grid-template-columns: 1fr; }
.opts.row { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
.opts.row .opt { padding: 10px 8px; font-size: 1.1rem; }
.opt { min-height: 60px; padding: 12px 16px; border-radius: 18px; border: 3px solid var(--door-edge); background: var(--door); color: var(--door-ink); box-shadow: 0 5px 0 var(--door-edge); font: 600 1.2rem/1.25 var(--font-display); cursor: pointer; text-align: center; touch-action: manipulation; }
.opts.long .opt { text-align: left; font-size: 1.08rem; font-family: var(--font-body); font-weight: 700; }
.opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--door-edge); }
.opt .k { display: inline-block; min-width: 1.4em; opacity: .5; font-size: .8em; }
.opt.right { background: #dff8ec; border-color: #2fae84; box-shadow: 0 5px 0 #2fae84; color: #1d4a3b; }
.opt.wrong { background: #ffe1e4; border-color: #d9505d; box-shadow: 0 5px 0 #d9505d; color: #5a1f27; animation: shake .35s ease; }
.opt.dim { opacity: .45; }
.opt:disabled { cursor: default; }
.opt:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
.build { width: 100%; min-height: 64px; box-sizing: border-box; border-radius: 18px; border: 3px dashed var(--line); padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-content: center; background: color-mix(in srgb, var(--card) 70%, transparent); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { min-width: 52px; min-height: 52px; padding: 8px 14px; border-radius: 14px; border: 3px solid var(--door-edge); background: var(--door); color: var(--door-ink); box-shadow: 0 4px 0 var(--door-edge); font: 600 1.2rem/1.1 var(--font-display); cursor: pointer; touch-action: manipulation; }
.tile.used { visibility: hidden; }
.tile.placed { background: var(--card); border-color: var(--sky-blue); box-shadow: 0 4px 0 #3a8fd6; color: var(--ink); }
.tile.bad { background: #ffe1e4; border-color: #d9505d; box-shadow: 0 4px 0 #d9505d; color: #5a1f27; animation: shake .35s ease; }
.boxes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.boxes i { font-style: normal; width: clamp(34px, 7vw, 52px); height: clamp(42px, 8.5vw, 60px); border-radius: 12px; background: var(--card); border: 3px solid var(--line); display: grid; place-items: center; font: 700 clamp(1.3rem, 4vw, 2rem)/1 var(--font-display); }
.boxes i.cur { border-color: var(--lilac); }
.boxes i.ok { border-color: var(--mint); }
.check-row { display: flex; gap: 10px; justify-content: center; }
.sheet { padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; border-top: 3px solid transparent; animation: rise .25s ease both; }
.sheet.good { background: #dff8ec; border-color: #4fd1a5; color: #1d4a3b; }
.sheet.bad { background: #ffe8ea; border-color: #ff7b86; color: #5a1f27; }
.sheet h3 { margin: 0; font: 700 1.3rem/1.1 var(--font-display); }
.sheet p { margin: 4px 0 0; line-height: 1.4; font-weight: 700; }
.sheet .btn { grid-row: span 2; }
@media (max-width: 560px) { .sheet { grid-template-columns: 1fr; } .sheet .btn { grid-row: auto; width: 100%; } }
.results .stars { font-size: 2.6rem; }
.newwords { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 0; padding: 0; list-style: none; }
.newwords li { background: var(--mint-soft); border-radius: 99px; padding: 6px 12px; font: 600 1rem/1.1 var(--font-display); }
.big-msg { font: 700 1.2rem/1.3 var(--font-display); margin: 0; }
.toast { --toast-top: calc(70px + env(safe-area-inset-top, 0px)); }
@media (max-width: 560px) and (min-height: 700px) { .passage { max-height: 52vh; } }
@media (max-height: 600px) { .pic { font-size: 3.6rem; } .bigword { font-size: 2.2rem; } .passage { max-height: 34vh; } }
</style>
<!--BODY-->
<section id="lesson" hidden aria-label="Lesson">
  <div class="lbar">
    <button class="hud-btn" id="quitBtn" aria-label="Stop the lesson">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
    </button>
    <div class="prog" aria-hidden="true"><i id="progFill"></i></div>
    <span class="lcount" id="lcount">1/12</span>
  </div>
  <div class="qwrap"><div class="q" id="q"></div></div>
  <div class="sheet" id="sheet" hidden>
    <div><h3 id="sheetTitle"></h3><p id="sheetText"></p></div>
    <button class="btn sun big" id="nextBtn">Continue</button>
  </div>
</section>

<main id="screens">
  <section class="screen" id="s-home">
    <div class="card home">
      <h1 class="logo">English <span>Quest</span></h1>
      <p class="tagline">Step by step to IELTS 8</p>
      <div class="level" id="level"></div>
      <div class="row"><button class="btn sun big" id="goBtn">Start</button></div>
      <div class="row">
        <button class="btn" id="pathBtn">🗺️ Path</button>
        <button class="btn" id="reviewBtn">🔁 Review</button>
        <button class="btn" id="placeBtn">🎯 Find my level</button>
      </div>

<script>
(function () {
'use strict';
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const frac = (v) => ((v % 1) + 1) % 1;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const fmtTime = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const stat = (k, v) => '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>';
const starRow = (n, of) => Array.from({ length: of || 3 }, (_, i) => '<span' + (i < n ? '' : ' class="off"') + '>⭐</span>').join('');

/* ================= saved progress (this device) =================
   Settings (math level, music, read-aloud) and the math record are shared by every game in
   number-dash.v1; each game keeps its own records under its own key via loadRecords(). */
const SAVE_KEY = 'number-dash.v1';
const save = {
  levels: {},
  math: { right: 0, wrong: 0, streak: 0, best: 0, tricky: [] },
  settings: { mathLevel: 'explorer', think: 'normal', music: 0.7, sfx: 0.8, sky: 'auto', calm: reduceMotion, speak: true },
  cube: { color: 0, face: 0 }
};
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { const d = JSON.parse(raw); for (const k of Object.keys(save)) if (d && d[k] && typeof d[k] === 'object') Object.assign(save[k], d[k]); }
} catch (e) { /* storage blocked: play without saving */ }
const records = { key: '', data: null };
function loadRecords(key, defaults) {
  records.key = key; records.data = defaults;
  try { const raw = localStorage.getItem(key); if (raw) Object.assign(defaults, JSON.parse(raw)); } catch (e) { /* ignore */ }
  return defaults;
}
function writeSave() {
  try {
    const cur = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    cur.math = save.math; cur.settings = save.settings;
    if (!cur.cube) cur.cube = save.cube;
    if (!cur.levels) cur.levels = save.levels;
    localStorage.setItem(SAVE_KEY, JSON.stringify(cur));
    if (records.key) localStorage.setItem(records.key, JSON.stringify(records.data));
  } catch (e) { /* ignore */ }
}

/* ================= math bookkeeping =================
   q is a fact from KINDS (shared/math.js): t = its text, a = its answer. A missed fact is kept
   (the last 12) and comes back now and then in every game until it is answered right. */
function factFrom(kinds, avoid) {
  const tricky = (save.math.tricky || []).filter((t) => !avoid || !avoid.has(t.t));
  if (tricky.length && Math.random() < 0.25) return Object.assign({}, pick(tricky), { again: true });
  let q = KINDS[pick(kinds)]();
  for (let i = 0; i < 12 && avoid && avoid.has(q.t); i++) q = KINDS[pick(kinds)]();
  return q;
}
function mathRight(q) {
  const m = save.math;
  m.right++; m.streak++; m.best = Math.max(m.best, m.streak);
  if (q && q.again) m.tricky = m.tricky.filter((t) => t.t !== q.t);
  writeSave();
}
function mathWrong(q) {
  const m = save.math;
  m.wrong++; m.streak = 0;
  if (q && q.t) {
    const r = { t: q.t, a: q.a };
    if (q.f) r.f = q.f;
    if (q.trap !== undefined) r.trap = q.trap;
    m.tricky = (m.tricky || []).filter((t) => t.t !== r.t).concat([r]).slice(-12);
  }
  writeSave();
}

/* ================= screens, toasts, links ================= */
// show one menu card (<section class="screen" id="s-NAME">) over the game, or none
function showScreen(name, dim) {
  $$('#screens > .screen').forEach((s) => { s.hidden = s.id !== 's-' + name; });
  $('#screens').classList.toggle('dim', !!name && dim !== false);
}
let toastTimer = 0;
// kind: 'hello' (sits higher, for something new), 'good', 'oops', or nothing
function toast(msg, kind, ms) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast' + (kind ? ' ' + kind : ''); t.hidden = false;
  t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms || (kind === 'hello' ? 2400 : 1500));
}
function announce(msg) { const a = $('#announce'); if (a) a.textContent = msg; }
// links marked data-hub lead back to the arcade's home page when the game runs inside the site
function arcadeLinks() { if (window.ARCADE_HOME) $$('[data-hub]').forEach((a) => { a.href = window.ARCADE_HOME; a.hidden = false; }); }
function toggleMusic() { save.settings.music = save.settings.music > 0 ? 0 : 0.7; writeSave(); Sound.init(); Sound.setVolumes(); return save.settings.music > 0; }
// the usual page guards: sound starts on the first touch, no pinch or double-tap zoom, onHide when the page goes away
function arcadeGuards(onHide) {
  document.addEventListener('pointerdown', () => Sound.init());
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (onHide) onHide(); } else Sound.init(); });
  window.addEventListener('blur', () => { if (onHide) onHide(); });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
}

/* ================= read-aloud =================
   English words are spoken with the device's own voice (iPad has good offline ones). Off when
   settings.speak is false. Speech.said keeps the last words asked for, for the playtests. */
const Speech = (function () {
  const ok = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
  const said = [];
  let voice = null;
  function choose() {
    if (!ok) return;
    const en = speechSynthesis.getVoices().filter((v) => /^en[-_]/i.test(v.lang));
    voice = en.find((v) => /Samantha|Karen|Moira|Daniel|Aria|Jenny|Google US English/i.test(v.name)) || en.find((v) => /^en[-_]US/i.test(v.lang)) || en[0] || null;
  }
  if (ok) { choose(); try { speechSynthesis.addEventListener('voiceschanged', choose); } catch (e) { speechSynthesis.onvoiceschanged = choose; } }
  function say(text, rate) {
    said.push(text); if (said.length > 40) said.shift();
    if (!ok || !save.settings.speak) return false;
    try {
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = voice ? voice.lang : 'en-US'; u.rate = rate || 0.9; u.pitch = 1.05;
      // some iOS versions drop a word spoken straight after cancel(), so only cut in when something is
      // still talking, and then give the voice a moment
      if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(() => speechSynthesis.speak(u), 60); }
      else speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }
  return { ok: ok, say: say, said: said, stop() { if (ok) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } } } };
})();

ot a temperature?","The doctor gave me some medicine.","What's the matter with your back?"],"reading":{"title":"Max stays at home","text":"Last Monday Max didn't go to school. He woke up with a headache and a cough, and he had a temperature. His mum took him to the doctor. The doctor said, 'You've got a bad cold. You must stay in bed for two days and drink lots of water.' Max took his medicine and slept a lot. On Wednesday he felt better, and he went back to school.","qs":[{"type":"mc","q":"When did Max wake up with a headache?","opts":["last Monday","last Wednesday","last Friday"],"a":0},{"type":"mc","q":"Who took Max to the doctor?","opts":["his dad","his mum","his grandma"],"a":1},{"type":"tf","q":"The doctor said Max had a bad cold.","opts":["True","False"],"a":0},{"type":"tf","q":"Max had to stay in bed for a week.","opts":["True","False"],"a":1},{"type":"mc","q":"When did Max go back to school?","opts":["on Tuesday","on Wednesday","on Thursday"],"a":1}]},"extra":[{"kind":"preposition","q":"I've got a pain ___ my stomach.","opts":["in","on","at","under"],"a":0,"why":"Use 'in' for a pain inside your body: a pain in my stomach."},{"kind":"collocation","q":"I ___ a bad cough.","opts":["have got","am","do","make"],"a":0,"why":"We say 'have got' a cough, a cold or a headache."}]}]},{"stage":3,"units":[{"id":"flyer-1","title":"Holidays and travel","emoji":"🧭","words":[{"w":"airport","def":"a place where planes take off and land","ex":"We got to the ___ two hours before our plane left.","pos":"noun","pic":"🛫"},{"w":"passport","def":"a small book with your photo that you need to travel to another country","ex":"The officer looked at the photo in my ___ and said, 'Welcome to Spain!'","pos":"noun","pic":"🛂"},{"w":"suitcase","def":"a big bag with a handle that you put your clothes in for a trip","ex":"I can't close my ___ because there are too many clothes in it!","pos":"noun","pic":"🧳"},{"w":"ticket","def":"a piece of paper or a code that shows you have paid to travel or dn't","should to"],"a":0,"why":"Use 'should' + verb to give good advice. Never put 'to' after 'should'."},{"q":"There ___ a lot of luggage on the train.","opts":["was","were","are"],"a":0,"why":"'Luggage' is uncountable, so the verb is singular: there was, not there were."}],"sentences":["How much luggage are you taking on holiday?","I think you will love the hotel.","Don't forget to bring your passport!","We should get to the airport early."],"reading":{"title":"A trip to Scotland","text":"Last summer, Amy and her family went on holiday to Scotland. It was a long journey, so they took the train from London. The train left at eight o'clock in the morning and arrived in Edinburgh after four and a half hours. Amy read a book and looked out of the window at the hills and sheep.\n\nIn Edinburgh they stayed in a small hotel near the castle. Every day they visited a different place. Amy's favourite was a museum about dinosaurs. On the last day she bought a postcard for her best friend, Zara. On it she wrote: 'Scotland is beautiful, but it rains a lot! Next year I will come back with you!'","qs":[{"type":"mc","q":"How did Amy's family travel to Scotland?","opts":["by plane","by train","by car","by bus"],"a":1},{"type":"mc","q":"How long was the train journey?","opts":["four hours","four and a half hours","eight hours","two and a half hours"],"a":1},{"type":"mc","q":"Where was the hotel?","opts":["near the castle","near the station","next to the sea","in the hills"],"a":0},{"type":"tf","q":"Amy's favourite place was a museum about dinosaurs.","opts":["True","False"],"a":0},{"type":"tf","q":"Amy wrote that the weather in Scotland was always sunny.","opts":["True","False"],"a":1}]},"extra":[{"kind":"preposition","q":"We arrived ___ the airport at six o'clock.","opts":["at","to","on","of"],"a":0,"why":"We say 'arrive at' a place like an airport or a station, and 'arrive in' a city or a country."},{"kind":"collocation","q":"We ___ lots of photos on holiday.","opts":["took","made","did","played"],"a":0,"why":"We say 'take a photo', not 'make' or 'do' a photo."}]},{"id":"flyer-2","title":"Nature around us","emoji":"🌳","words":[{"w":"insect","def":"a very small animal with six legs, like an ant or a bee","ex":"A beetle is an ___ with six legs and a hard back.","pos":"noun","pic":"🐞"},{"w":"bee","def":"a flying insect that makes honey","ex":"The ___ flew from flower to flower to make honey.","pos":"noun","pic":"🐝"},{"w":"wing","def":"the part of a bird, an insect or a plane that helps it fly","ex":"My toy plane has got a long ___ on each side.","pos":"noun"},{"w":"feather","def":"one of the soft, light things that cover a bird's body","ex":"I found a long blue ___ that fell from a bird.","pos":"noun","pic":"🪶"},{"w":"desert","def":"a very dry, hot place with lots of sand and very little rain","ex":"Camels can walk for days in the hot, dry ___.","pos":"noun","pic":"🏜️"},{"w":"forest","def":"a large area of land covered with trees","ex":"We walked under the tall trees in the ___ and saw a deer.","pos":"noun","pic":"🌲"},{"w":"planet","def":"a very big round thing in space that moves around the sun, like Earth or Mars","ex":"Jupiter is the biggest ___ in our solar system.","pos":"noun","pic":"🪐"},{"w":"storm","def":"very bad weather with strong wind and heavy rain","ex":"There was a big ___ last night, with strong wind and lots of rain.","pos":"noun","pic":"⛈️"},{"w":"environment","def":"the air, water and land around us, where people, animals and plants live","ex":"We should protect the ___ and keep our rivers clean.","pos":"noun","pic":"🌍"},{"w":"wild","def":"living in nature, not kept by people","ex":"Lions are ___ animals, so you can't keep one as a pet.","pos":"adj"},{"w":"recycle","def":"to use old paper, glass or plastic again to make new things","ex":"Don't throw that bottle away. We can ___ it!","pos":"verb","pic":"♻️"},{"w":"plastic","def":"a light material that people make; many bottles and bags are made of it","ex":"This bottle isn't made of glass. It's made of ___.","pos":"noun"}],"grammar":[{"q":"The cheetah is the ___ animal on land.","opts":["fastest","faster","most fast"],"a":0,"why":"Use 'the' + -est to compare one thing with all the others: the fastest."},{"q":"Mount Everest is the ___ mountain in the world.","opts":["highest","higher","most high"],"a":0,"why":"Short adjectives add -est: high, the highest."},{"q":"This is the ___ beautiful forest I know.","opts":["most","more","much"],"a":0,"why":"Long adjectives use 'the most': the most beautiful."},{"q":"The water is ___ cold to swim in.","opts":["too","enough","very much"],"a":0,"why":"'Too' means more than is good: too cold to swim."},{"q":"My brother isn't tall ___ to reach the bird's nest.","opts":["enough","too","very"],"a":0,"why":"'Enough' means as much as you need. It comes after the adjective: tall enough."},{"q":"A bee is an insect ___ makes honey.","opts":["which","who","where"],"a":0,"why":"Use 'which' for animals and things, and 'who' for people."}],"sentences":["Bees fly from flower to flower.","We should recycle our plastic bottles.","The water was too cold to swim in.","A bird uses its wings to fly."],"reading":{"title":"Busy bees","text":"Bees are small, but they are some of the most important insects in the world. A bee has got four wings and six legs. It flies from flower to flower and drinks a sweet juice called nectar. Back at its home, the hive, it turns the nectar into honey.\n\nBees also help plants. When a bee visits a flower, yellow powder from the flower sticks to its body. The bee carries it to the next flower, and this helps fruit like apples and strawberries grow.\n\nYou can help bees too. Plant some flowers in your garden or in a pot by the window. Bees love blue and purple flowers best!","qs":[{"type":"mc","q":"How many wings has a bee got?","opts":["two","four","six"],"a":1},{"type":"mc","q":"What is a hive?","opts":["a bee's home","a kind of flower","a sweet juice"],"a":0},{"type":"tf","q":"Bees help fruit like apples to grow.","opts":["True","False"],"a":0},{"type":"tf","q":"Bees like red flowers best.","opts":["True","False"],"a":1},{"type":"mc","q":"What does a bee make from nectar?","opts":["powder","honey","flowers"],"a":1}]},"extra":[{"kind":"preposition","q":"Bees fly ___ flower to flower.","opts":["from","at","in","of"],"a":0,"why":"We say 'from one place to another': from flower to flower."},{"kind":"collocation","q":"We must ___ care of our planet.","opts":["take","make","do","have"],"a":0,"why":"We say 'take care of' something. It means 'look after' it."}]},{"id":"flyer-3","title":"Jobs people do","emoji":"💼","words":[{"w":"vet","def":"a doctor for animals","ex":"The ___ looked at our cat's ear and gave her some medicine.","pos":"noun"},{"w":"dentist","def":"a person whose job is to look after people's teeth","ex":"I go to the ___ twice a year to check my teeth.","pos":"noun","pic":"🪥"},{"w":"artist","def":"a person who paints or draws pictures","ex":"The ___ painted a beautiful picture of the sea.","pos":"noun","pic":"🖌️"},{"w":"firefighter","def":"a person whose job is to stop fires and help people","ex":"The ___ climbed a long ladder to help the cat down from the tree.","pos":"noun","pic":"👨‍🚒"},{"w":"journalist","def":"a person who writes news stories for newspapers, TV or websites","ex":"The ___ asked the football player lots of questions for the newspaper.","pos":"noun","pic":"📰"},{"w":"mechanic","def":"a person whose job is to repair cars and machines","ex":"Our car broke down, so we took it to a ___.","pos":"noun","pic":"🔧"},{"w":"photographer","def":"a person who takes photos as a job","ex":"The ___ said, 'Smile!' and took a picture of our class.","pos":"noun","pic":"📷"},{"w":"pilot","def":"a person who flies a plane","ex":"The ___ said, 'Welcome on board! We will land in Paris in one hour.'","pos":"noun","pic":"👨‍✈️"},{"w":"police officer","def":"a person whose job is to keep people safe and make sure they follow the law","ex":"If you get lost, ask a ___ for help.","pos":"noun","pic":"👮"},{"w":"waiter","def":"a person who brings food to your table in a restaurant","ex":"The ___ brought us our pizzas and some water.","pos":"noun"},{"w":"factory","def":"a big building where people and machines make things like cars or toys","ex":"My uncle works in a chocolate ___ that makes 10,000 bars a day.","pos":"noun","pic":"🏭"},{"w":"uniform","def":"special clothes that everyone in a group or a job wears","ex":"Nurses and police officers wear a ___ at work.","pos":"noun"}],"grammar":[{"q":"A pilot is a person ___ flies planes.","opts":["who","which","where"],"a":0,"why":"Use 'who' for people."},{"q":"This is the camera ___ my dad uses at work.","opts":["which","who","where"],"a":0,"why":"Use 'which' for things."},{"q":"Have you ever ___ a real astronaut?","opts":["met","meet","meeting"],"a":0,"why":"The present perfect is have + past participle: meet, met."},{"q":"My mum ___ worked in three different countries.","opts":["has","have","is"],"a":0,"why":"In the present perfect, use 'has' with he, she and it: she has worked."},{"q":"I ___ never been to a TV studio.","opts":["have","has","am"],"a":0,"why":"In the present perfect, use 'have' with I, you, we and they: I have never been."},{"q":"You want to be a vet? You ___ study science at school.","opts":["should","shouldn't","are"],"a":0,"why":"Use 'should' to give good advice. Vets need science, so you should study it."}],"sentences":["I know a man who works in a chocolate factory.","Have you ever met a real pilot?","You should ask a police officer for help.","My mum has never worn a uniform."],"reading":{"title":"What do you want to be?","text":"Our teacher asked us, 'What do you want to be when you grow up?' Everyone had a different answer.\n\nJack wants to be a pilot because he loves planes. He has already flown to six countries with his family. Mia wants to be a dentist like her mum. She says it is an important job, and you should look after your teeth every day! Sam wants to be an astronaut. He has read lots of books about space, and he wants to be the first person on Mars.\n\nI want to be a journalist. I love asking people questions and writing stories. Last week I wrote a story about our school for the local newspaper!","qs":[{"type":"mc","q":"Why does Jack want to be a pilot?","opts":["He loves planes.","His dad is a pilot.","He wants to go to Mars."],"a":0},{"type":"mc","q":"What job does Mia's mum do?","opts":["She's a pilot.","She's a dentist.","She's a journalist.","She's a teacher."],"a":1},{"type":"tf","q":"Sam has read lots of books about space.","opts":["True","False"],"a":0},{"type":"tf","q":"The writer wants to be an astronaut.","opts":["True","False"],"a":1},{"type":"mc","q":"What did the writer write about last week?","opts":["space","planes","their school"],"a":2}]},"extra":[{"kind":"preposition","q":"Firefighters often work ___ night.","opts":["at","in","on","to"],"a":0,"why":"We say 'at night', but 'in the morning' and 'in the afternoon'."},{"kind":"collocation","q":"A good journalist ___ lots of questions.","opts":["asks","makes","does","says"],"a":0,"why":"We say 'ask a question', not 'make', 'do' or 'say' a question."}]},{"id":"flyer-4","title":"A story from the past","emoji":"📖","words":[{"w":"castle","def":"a big old building with thick walls and towers, where kings and queens lived","ex":"The king and queen lived in a ___ on top of the hill.","pos":"noun","pic":"🏰"},{"w":"king","def":"the man who is the head of a country, often with a crown","ex":"The ___ wore a gold crown and sat on his big chair.","pos":"noun","pic":"👑"},{"w":"queen","def":"the woman who is the head of a country, or the wife of a king","ex":"The king and the ___ had a beautiful daughter.","pos":"noun"},{"w":"dragon","def":"a big animal in stories that has wings and breathes fire","ex":"The friendly ___ in the story had big wings and could breathe fire.","pos":"noun","pic":"🐉"},{"w":"adventure","def":"an exciting trip where unusual things happen","ex":"The children went on an exciting ___ to find the lost treasure.","pos":"noun"},{"w":"gold","def":"a yellow metal that costs a lot of money","ex":"The pirates found a box full of ___ coins.","pos":"noun","pic":"🪙"},{"w":"secret","def":"something that only you or a few people know","ex":"Can you keep a ___? Don't tell anyone!","pos":"noun"},{"w":"suddenly","def":"very quickly, when you don't expect it","ex":"We were walking in the forest when ___ it started to rain.","pos":"adv"},{"w":"midnight","def":"twelve o'clock at night","ex":"At ___, when everyone was asleep, the old clock started to talk!","pos":"noun","pic":"🕛"},{"w":"museum","def":"a building where you can look at old or interesting things","ex":"We saw old dinosaur bones at the ___.","pos":"noun","pic":"🏛️"},{"w":"history","def":"the study of things that happened in the past","ex":"In our ___ lesson, we learned about the kings and queens of England.","pos":"noun","pic":"📜"},{"w":"century","def":"a time of one hundred years","ex":"This castle is very old. People built it in the twelfth ___.","pos":"noun"}],"grammar":[{"q":"I ___ reading a book when the phone rang.","opts":["was","were","am"],"a":0,"why":"Use was or were + -ing for something that was going on in the past. With I, use 'was'."},{"q":"The children ___ playing in the garden when it started to rain.","opts":["were","was","are"],"a":0,"why":"With we, you and they (the children), use 'were' + -ing."},{"q":"What ___ you doing at eight o'clock last night?","opts":["were","was","did"],"a":0,"why":"Ask about something that was going on in the past with 'What were you doing?'"},{"q":"While the king was sleeping, the dragon ___ into the castle.","opts":["flew","flying","fly"],"a":0,"why":"Use the past simple for the short action that happened in the middle: the dragon flew."},{"q":"She was walking home ___ she found a gold coin.","opts":["when","while","during"],"a":0,"why":"Use 'when' before the short action: She was walking home when she found a coin."},{"q":"Long ago, people ___ in castles.","opts":["lived","living","live"],"a":0,"why":"'Long ago' is in the past, so use the past simple: lived."}],"sentences":["What were you doing at midnight?","Nobody knew the secret of the castle.","We visited a museum about the history of London.","The children were looking for the hidden treasure."],"reading":{"title":"The dragon who loved cake","text":"Long ago, a small green dragon called Pip lived in a cave near a big castle. Pip wasn't scary at all. He loved cake more than anything!\n\nOne night, at midnight, while the king and queen were sleeping, Pip flew to the castle kitchen. The cook was making a huge chocolate cake for the princess's birthday. Suddenly she saw Pip at the window. She was very surprised, but Pip smiled and said, 'Please may I have a small piece?'\n\nThe cook laughed and gave him some cake. The next day, the princess invited Pip to her party. From that day, the dragon and the princess were best friends.","qs":[{"type":"mc","q":"Where did Pip live?","opts":["in the castle","in a cave","in the forest","in the kitchen"],"a":1},{"type":"mc","q":"What were the king and queen doing when Pip flew to the castle?","opts":["They were sleeping.","They were eating cake.","They were having a party.","They were reading."],"a":0},{"type":"mc","q":"Who was making a cake?","opts":["the princess","the queen","the cook"],"a":2},{"type":"tf","q":"The cook was angry with Pip.","opts":["True","False"],"a":1},{"type":"tf","q":"The princess invited Pip to her party.","opts":["True","False"],"a":0}]},"extra":[{"kind":"linking","q":"Pip was hungry, ___ he flew to the kitchen.","opts":["so","but","because","or"],"a":0,"why":"Use 'so' to say what happened because of something: he was hungry, so he flew to the kitchen."},{"kind":"preposition","q":"The story happened ___ the twelfth century.","opts":["in","on","at","to"],"a":0,"why":"Use 'in' with centuries, years and months: in the twelfth century."}]},{"id":"flyer-5","title":"Screens and gadgets","emoji":"📱","words":[{"w":"screen","def":"the flat glass part of a TV, computer or phone where you see pictures","ex":"The ___ on my tablet is broken, so I can't see the pictures.","pos":"noun","pic":"🖥️"},{"w":"keyboard","def":"the part of a computer with keys for letters and numbers that you press to type","ex":"I type my stories on the ___ with all ten fingers.","pos":"noun","pic":"⌨️"},{"w":"laptop","def":"a small computer that you can carry and use on your knees","ex":"My dad takes his ___ on the train so he can work.","pos":"noun","pic":"💻"},{"w":"mouse","def":"a small thing you move with your hand to point and click on a computer","ex":"Click on the picture with the ___.","pos":"noun","pic":"🖱️"},{"w":"website","def":"a place on the internet with pages of information about something","ex":"You can find the times of all the films on the cinema's ___.","pos":"noun","pic":"🌐"},{"w":"password","def":"a secret word that you type to open your computer, phone or game","ex":"Never tell anyone your ___, not even your best friend!","pos":"noun","pic":"🔑"},{"w":"app","def":"a small program that you put on a phone or tablet to do one job","ex":"I use a free ___ on my phone to learn Spanish.","pos":"noun"},{"w":"download","def":"to copy a game, song or file from the internet onto your computer or phone","ex":"Ask your parents before you ___ a new game.","pos":"verb","pic":"📥"},{"w":"online","def":"using or connected to the internet","ex":"My cousin and I play chess ___ every Sunday.","pos":"adv"},{"w":"information","def":"facts about something","ex":"This website has lots of useful ___ about dinosaurs.","pos":"noun","pic":"ℹ️"},{"w":"headphones","def":"a thing you wear over your ears to listen to music without other people hearing it","ex":"Please put on your ___. Your music is too loud for me!","pos":"noun","pic":"🎧"},{"w":"switch off","def":"to stop a machine or a light working, often by pressing a button","ex":"Please ___ the lights when you leave the room.","pos":"phrase","pic":"📴"}],"grammar":[{"q":"If you play games all night, you ___ be tired tomorrow.","opts":["will","would","are"],"a":0,"why":"First conditional: if + present simple, then will + verb."},{"q":"If the battery ___ flat, the phone will stop working.","opts":["is","will be","was"],"a":0,"why":"After 'if' in the first conditional, use the present simple, not 'will'."},{"q":"I have ___ downloaded the new game. Do you want to play?","opts":["just","yet","ever"],"a":0,"why":"'Just' means a very short time ago. It goes between 'have' and the verb."},{"q":"Have you finished your homework ___?","opts":["yet","just","ever"],"a":0,"why":"Use 'yet' at the end of present perfect questions and negatives."},{"q":"This laptop is ___ heavy. I can't carry it.","opts":["too","enough","very much"],"a":0,"why":"'Too' means more than is good: too heavy to carry."},{"q":"Can you give me some ___ about the new phone?","opts":["information","informations","an information"],"a":0,"why":"'Information' is uncountable: no -s and no 'an'."}],"sentences":["Have you downloaded the new game yet?","My brother is too young to play this game.","Don't tell anyone your password.","I need a new battery for my camera."],"reading":{"title":"Ella's screen time","text":"Ella is eleven and she loves gadgets. She has got a laptop, a tablet and some big blue headphones. Every evening she goes online to play games with her friends or watch videos.\n\nLast month, Ella started to get headaches, and she often felt tired at school. Her mum said, 'I think you are spending too much time in front of screens. If you switch off your tablet an hour before bed, you will sleep better.'\n\nElla wasn't happy at first, but she tried it. Now she reads a book before bed instead. She has already finished three books this month, and her headaches have stopped. 'I still love my games,' she says, 'but books are fun too!'","qs":[{"type":"mc","q":"What does Ella do online every evening?","opts":["She does her homework.","She plays games and watches videos.","She reads books.","She writes stories."],"a":1},{"type":"mc","q":"What did Ella's mum tell her to do?","opts":["switch off her tablet an hour before bed","buy some new headphones","play more games with her friends"],"a":0},{"type":"tf","q":"Ella was very happy with her mum's idea at first.","opts":["True","False"],"a":1},{"type":"mc","q":"How many books has Ella finished this month?","opts":["two","three","four"],"a":1},{"type":"tf","q":"Ella's headaches have stopped.","opts":["True","False"],"a":0}]},"extra":[{"kind":"phrasal","q":"Can you ___ the music, please? It's too loud.","opts":["turn down","turn up","look for","get on"],"a":0,"why":"'Turn down' means make it quieter. 'Turn up' means make it louder."},{"kind":"preposition","q":"I found the information ___ the internet.","opts":["on","in","at","by"],"a":0,"why":"We say 'on the internet' and 'on a website'."}]}]},{"stage":4,"units":[{"id":"explorer-1","title":"Amazing animal homes","emoji":"🦫","words":[{"w":"burrow","def":"a hole or tunnel in the ground that an animal digs to live in","ex":"The rabbit ran into its ___ when it saw the fox.","pos":"noun","pic":"🐇"},{"w":"shelter","def":"a place that keeps you safe from bad weather or danger","ex":"The cave gave the bats ___ from the wind and rain.","pos":"noun"},{"w":"colony","def":"a large group of the same kind of animal that live together","ex":"A ___ of ants can have millions of members.","pos":"noun","pic":"🐜"},{"w":"hive","def":"a home where bees live and make honey","ex":"The bees flew back to their ___ with pollen on their legs.","pos":"noun","pic":"🐝"},{"w":"dam","def":"a wall built across a river to hold back the water","ex":"Beavers build a ___ of sticks and mud across the stream.","pos":"noun","pic":"🦫"},{"w":"predator","def":"an animal that hunts and eats other animals","ex":"The owl is a ___ that hunts mice at night.","pos":"noun","pic":"🦉","syn":["hunter"],"ant":["prey"]},{"w":"protect","def":"to keep someone or something safe from harm","ex":"Thick walls of mud ___ the chicks from the hot sun.","pos":"verb","syn":["guard","defend"],"forms":{"noun":"protection","verb":"protect","adj":"protective"}},{"w":"survive","def":"to stay alive, especially in a difficult situation","ex":"Camels can ___ for many days without drinking water.","pos":"verb","pic":"🐪","forms":{"noun":"survival","verb":"survive"}},{"w":"hollow","def":"empty inside","ex":"The woodpecker made its home in a ___ tree.","pos":"adj","ant":["solid"]},{"w":"underground","def":"below the surface of the earth","ex":"Moles spend most of their lives ___, digging tunnels in the dark.","pos":"adv"},{"w":"construct","def":"to build something, such as a house, a bridge or a nest","ex":"Weaver birds ___ their nests by tying knots in grass.","pos":"verb","syn":["build"],"forms":{"noun":"construction","verb":"construct"}},{"w":"habitat","def":"the natural place where an animal or plant usually lives","ex":"The rainforest is the natural ___ of many colourful frogs.","pos":"noun","pic":"🌳","syn":["home"]}],"grammar":[{"q":"Scientists ___ a new kind of spider web last year.","opts":["found","have found","find","were found"],"a":0,"why":"'Last year' is a finished time, so use the past simple: found."},{"q":"Owls ___ in that old barn since last winter.","opts":["have lived","lived","live","are living"],"a":0,"why":"With 'since', use the present perfect for something that started in the past and is still true now."},{"q":"Most bird nests ___ from twigs, grass and mud.","opts":["are made","make","are making","is made"],"a":0,"why":"The nests don't make anything; birds make them. Use the passive: are + made (plural, because 'nests')."},{"q":"This old wasp nest ___ in our garden last summer.","opts":["was found","is found","found","were found"],"a":0,"why":"Someone found the nest at a finished time, so use the past passive. 'Nest' is singular, so use 'was'."},{"q":"A beaver is an animal ___ builds dams across rivers.","opts":["which","where","what","whose"],"a":0,"why":"Use 'which' (or 'that') to give more information about an animal or a thing."},{"q":"This is the cave ___ thousands of bats sleep in winter.","opts":["where","which","who","what"],"a":0,"why":"Use 'where' after a place when a full sentence follows (bats sleep there)."}],"sentences":["Beavers have built dams across the river.","Termite mounds are built by millions of insects.","Has the bee colony survived the winter?","This is the tree where the owls live."],"reading":{"title":"Animal builders","text":"Humans are not the only great builders. Many animals make amazing homes, and some of them work together in huge teams.\n\nBeavers are famous for their dams. They cut down small trees with their strong teeth and push sticks, stones and mud together across a stream. The water behind the dam becomes a quiet pond. In the middle of it, the beavers build a home called a lodge. Its door is under the water, so most predators cannot get in.\n\nThe male weaver bird uses his beak to tie knots in long pieces of grass. If a female does not like the nest he has made, he may pull it apart and start again.\n\nTermites are tiny insects, but their mounds can be taller than an adult. Inside, there are lots of tunnels. They let air move through the mound and help to keep the colony cool.","qs":[{"type":"mc","q":"Why is the door of a beaver lodge under the water?","opts":["to keep most predators out","to let fresh air in","to catch fish more easily","to stop the pond from freezing"],"a":0},{"type":"tfng","q":"Beavers use only sticks to build their dams.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Weaver birds build a new nest every year.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"Some termite homes are higher than a grown-up person.","opts":["True","False","Not Given"],"a":0},{"type":"mc","q":"What do the tunnels inside a termite mound do?","opts":["They help to keep the mound cool.","They store food for the winter.","They join it to other mounds.","They let rainwater flow in."],"a":0}]},"extra":[{"kind":"collocation","q":"Birds ___ a nest in spring.","opts":["build","do","take","put"],"a":0,"why":"We say 'build a nest' (or 'make a nest'). We never 'do' or 'take' a nest."},{"kind":"preposition","q":"Many animals depend ___ their homes to stay safe.","opts":["on","of","at","with"],"a":0,"why":"'Depend on' is a fixed pair: the verb 'depend' is followed by 'on'."},{"kind":"wordform","q":"Thick fur gives the animal ___ from the cold. (protect)","opts":["protection","protect","protective","protected"],"a":0,"why":"After 'gives the animal' we need a noun (a thing it gets): protection."},{"kind":"phrasal","q":"Both parents ___ the eggs until the chicks hatch.","opts":["look after","look up","look forward","look out"],"a":0,"why":"'Look after' means take care of someone or something."}]},{"id":"explorer-2","title":"Great inventions","emoji":"💡","words":[{"w":"invent","def":"to make or design something that has never existed before","ex":"Do you think someone will ever ___ a car that can fly?","pos":"verb","forms":{"noun":"invention","verb":"invent","adj":"inventive"}},{"w":"engineer","def":"a person who plans and builds machines, roads or bridges","ex":"The ___ checked every part of the bridge before it opened.","pos":"noun","pic":"👷"},{"w":"device","def":"a small machine or tool made for a special job","ex":"A smartwatch is a tiny ___ that you wear on your wrist.","pos":"noun","pic":"⌚","syn":["gadget","tool"]},{"w":"electricity","def":"a kind of energy that gives power to lights and machines","ex":"Before ___, people used candles and oil lamps to light their homes.","pos":"noun","pic":"⚡"},{"w":"engine","def":"the part of a car, train or plane that makes it move","ex":"The car's ___ was so quiet that I couldn't hear it.","pos":"noun"},{"w":"battery","def":"a small object that stores power for things like torches and phones","ex":"My torch stopped working because the ___ was flat.","pos":"noun","pic":"🔋"},{"w":"microscope","def":"a tool that makes very small things look much bigger","ex":"Under the ___, a drop of pond water was full of tiny living things.","pos":"noun","pic":"🔬"},{"w":"design","def":"to plan and draw how something will look and work","ex":"Engineers ___ new cars on computers before they build them.","pos":"verb","pic":"📐"},{"w":"improve","def":"to make something better","ex":"Scientists keep trying to ___ batteries so that they last longer.","pos":"verb","forms":{"noun":"improvement","verb":"improve"}},{"w":"replace","def":"to take the place of something, or to put something new in its place","ex":"Will robots ___ waiters in restaurants one day?","pos":"verb","forms":{"noun":"replacement","verb":"replace"}},{"w":"experiment","def":"a test that scientists do to find out or prove something","ex":"Every failed ___ taught the inventor something new.","pos":"noun","pic":"🧪","syn":["test"]},{"w":"practical","def":"useful and sensible for real life","ex":"Rubber boots are a ___ choice for a muddy walk.","pos":"adj","syn":["useful"],"ant":["impractical"]}],"grammar":[{"q":"The telephone ___ by Alexander Graham Bell in 1876.","opts":["was invented","invented","is invented","has invented"],"a":0,"why":"The telephone didn't invent anything; Bell invented it. Use the past passive: was + invented."},{"q":"People ___ wash their clothes by hand before washing machines were invented.","opts":["used to","use to","were used","using to"],"a":0,"why":"'Used to' + verb talks about a past habit that is not true now."},{"q":"My sister enjoys ___ robots out of old boxes.","opts":["building","to build","build","built"],"a":0,"why":"After 'enjoy', use the -ing form of the verb."},{"q":"The inventor decided ___ a smaller, cheaper machine.","opts":["to make","making","make","made"],"a":0,"why":"After 'decide', use 'to' + verb."},{"q":"Smartphones ___ the way we live since they first appeared.","opts":["have changed","changed","change","are changing"],"a":0,"why":"With 'since', use the present perfect: the change started in the past and is still true now."},{"q":"Have you ever ___ a 3D printer?","opts":["used","use","using","uses"],"a":0,"why":"The present perfect is have + past participle: have you ever used...?"}],"sentences":["Velcro was invented by a Swiss engineer.","My grandparents used to write letters to each other.","He decided to build a machine that cleans windows.","Have you ever used a microscope at school?"],"reading":{"title":"Happy accidents","text":"Some of the world's most useful inventions were not planned at all.\n\nIn 1941, a Swiss engineer called George de Mestral went for a walk in the mountains with his dog. When they got home, both of them were covered in tiny seeds from a plant. He looked at the seeds under a microscope and saw hundreds of little hooks. These hooks caught on the loops in cloth and fur. De Mestral decided to copy the idea. After years of experiments, he invented Velcro, which is now used on shoes, bags and even space suits.\n\nA few years later, an American engineer called Percy Spencer was working with a machine that made radio waves. He noticed that a chocolate bar in his pocket had melted. Next, he tried some popcorn, and it popped! This led to the first microwave oven. It was nearly as tall as a person, so it was not very practical for a kitchen.\n\nBoth inventors noticed something small and asked, 'Why did that happen?'","qs":[{"type":"mc","q":"What did de Mestral see under the microscope?","opts":["tiny hooks on the seeds","loops in his dog's fur","holes in his trousers","insects on the seeds"],"a":0},{"type":"tfng","q":"De Mestral invented Velcro soon after his walk.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Velcro is more popular today than buttons.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"The first microwave oven was too big to be useful in most homes.","opts":["True","False","Not Given"],"a":0},{"type":"mc","q":"What is the main idea of the text?","opts":["Some great inventions began with a lucky surprise.","Engineers should always work in the mountains.","Velcro is better than the microwave oven.","Most inventions take only a few days to make."],"a":0}]},"extra":[{"kind":"collocation","q":"Inventors often ___ mistakes before they get things right.","opts":["make","do","take","have"],"a":0,"why":"We say 'make a mistake', not 'do a mistake'."},{"kind":"linking","q":"The first microwave oven was very big, ___ it was not practical for homes.","opts":["so","because","but","although"],"a":0,"why":"'So' shows a result: the oven was big, and the result was that it didn't suit homes."},{"kind":"wordform","q":"The telephone was an amazing ___. (invent)","opts":["invention","inventor","invented","inventive"],"a":0,"why":"We need a noun for a thing: invention. An 'inventor' is a person."},{"kind":"phrasal","q":"When the machine broke, the engineer tried to ___ what was wrong.","opts":["find out","give up","take off","turn down"],"a":0,"why":"'Find out' means discover a fact or learn something new."}]},{"id":"explorer-3","title":"Healthy habits","emoji":"🥦","words":[{"w":"diet","def":"the kind of food that you usually eat","ex":"A healthy ___ includes plenty of fruit and vegetables.","pos":"noun","pic":"🥗"},{"w":"balanced","def":"with the right amount of each different thing","ex":"A ___ lunch has a bit of everything: bread, cheese, salad and fruit.","pos":"adj","pic":"⚖️"},{"w":"vitamin","def":"something in food that your body needs in small amounts to stay healthy","ex":"Oranges and kiwis are full of ___ C.","pos":"noun","pic":"🍊"},{"w":"fit","def":"healthy and strong, especially because of exercise","ex":"My aunt cycles to work every day to stay ___.","pos":"adj","pic":"🚴","syn":["healthy"],"ant":["unfit"]},{"w":"muscle","def":"a part of the body that tightens and loosens to make you move","ex":"Your heart is a ___ that works all day and all night.","pos":"noun","pic":"💪"},{"w":"habit","def":"something you do often, almost without thinking","ex":"Brushing your teeth twice a day is a good ___.","pos":"noun","pic":"🪥"},{"w":"avoid","def":"to stay away from something, or to try not to do it","ex":"Try to ___ sugary drinks between meals.","pos":"verb"},{"w":"breathe","def":"to take air into your body and let it out again","ex":"During a race, runners ___ faster and more deeply.","pos":"verb","pic":"🌬️","forms":{"noun":"breath","verb":"breathe"}},{"w":"relax","def":"to rest and become calm","ex":"Reading a good book helps me ___ before bed.","pos":"verb","pic":"🛀","syn":["rest"],"forms":{"noun":"relaxation","verb":"relax","adj":"relaxed"}},{"w":"stressed","def":"worried and tense because of problems or too much work","ex":"I felt ___ before the test, so I took some slow, deep breaths.","pos":"adj","ant":["calm"]},{"w":"skip","def":"to not do something that you usually do","ex":"It's not a good idea to ___ breakfast before a busy day at school.","pos":"verb","syn":["miss"]},{"w":"routine","def":"the usual things you do each day, in the same order","ex":"My bedtime ___ is a bath, a story and then lights out.","pos":"noun"}],"grammar":[{"q":"If you ___ enough sleep, you will feel tired at school.","opts":["don't get","won't get","didn't get","not get"],"a":0,"why":"In the first conditional, use the present simple after 'if' (don't get), and 'will' in the other half."},{"q":"If you drink more water, you ___ better.","opts":["will feel","would felt","felt","feeling"],"a":0,"why":"This is a real possibility in the future: if + present simple, then will + verb."},{"q":"If I ___ a famous chef, I would cook healthy food for every school.","opts":["were","am","will be","would be"],"a":0,"why":"This is imaginary (second conditional), so use a past form after 'if'. 'If I were' is correct."},{"q":"If we walked to school, we ___ fitter.","opts":["would be","will be","are","would been"],"a":0,"why":"Second conditional: if + past simple, then would + verb (would be)."},{"q":"When I was little, I ___ hate vegetables, but now I love them.","opts":["used to","use to","am used to","was use to"],"a":0,"why":"'Used to' + verb is for something that was true in the past but is not true now."},{"q":"Try to avoid ___ too many sweets.","opts":["eating","to eat","eat","ate"],"a":0,"why":"After 'avoid', use the -ing form of the verb."}],"sentences":["My little brother used to hate green vegetables.","You should try to avoid sugary drinks.","Which fruit has the most vitamin C?","My doctor told me to drink more water."],"reading":{"title":"Sleep: your secret superpower","text":"Most children aged 6 to 12 need between nine and twelve hours of sleep a night. That sounds like a lot, but your body and brain are very busy while you sleep.\n\nDuring deep sleep, your body grows and repairs your muscles. Your brain is busy too. It sorts out what you have learnt during the day and stores the important parts, a bit like a librarian putting books on the right shelves. This is why a good night's sleep before a test can help you remember more.\n\nIf you don't get enough sleep, you may feel grumpy and find it hard to concentrate.\n\nSo how can you sleep better? Experts suggest going to bed at the same time every night. They also advise switching off phones and tablets an hour before bed, because the light from screens can make it harder to fall asleep. A calm routine, like reading a book or having a warm bath, helps your body relax.","qs":[{"type":"mc","q":"Why does the writer compare the brain to a librarian?","opts":["It puts new information in the right order.","It reads books while you sleep.","It keeps the body quiet at night.","It only works during the day."],"a":0},{"type":"tfng","q":"Your brain stops working while you are asleep.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"The light from screens can make it difficult to get to sleep.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"A warm drink before bed is the best way to fall asleep.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What do experts suggest?","opts":["going to bed at the same time every night","using a tablet in bed","sleeping only at weekends","having a big meal just before bed"],"a":0}]},"extra":[{"kind":"collocation","q":"It's important to ___ some exercise every day.","opts":["do","make","play","go"],"a":0,"why":"We say 'do exercise' (or 'take exercise'). We 'play' games and sports, and we 'go' swimming or running."},{"kind":"phrasal","q":"My dad is trying to ___ eating sweets after dinner.","opts":["give up","give in","give away","give back"],"a":0,"why":"'Give up' means stop doing something that you did often."},{"kind":"linking","q":"I drink lots of water ___ it helps me to concentrate.","opts":["because","although","but","unless"],"a":0,"why":"'Because' gives the reason: why do I drink lots of water? It helps me concentrate."},{"kind":"idiom","q":"I'm feeling a bit ___ today, so I'm staying at home in bed.","opts":["under the weather","over the moon","on cloud nine","a piece of cake"],"a":0,"why":"'Under the weather' means a little ill. 'Over the moon' and 'on cloud nine' mean very happy."}]},{"id":"explorer-4","title":"Festivals around the world","emoji":"🏮","words":[{"w":"celebrate","def":"to do something special and enjoyable for an important day","ex":"Families get together to ___ the new year.","pos":"verb","pic":"🥳","forms":{"noun":"celebration","verb":"celebrate"}},{"w":"tradition","def":"something people have done in the same way for a very long time","ex":"Eating pancakes on Shrove Tuesday is a British ___.","pos":"noun","pic":"🥞","forms":{"noun":"tradition","adj":"traditional","adv":"traditionally"}},{"w":"costume","def":"special clothes that make you look like a different person, animal or thing","ex":"She wore a dragon ___ in the parade.","pos":"noun"},{"w":"parade","def":"a line of people, bands or vehicles moving through the streets for a special day","ex":"Thousands of people watched the ___ go through the city centre.","pos":"noun"},{"w":"firework","def":"a small object that explodes in the sky with bright colours and loud bangs","ex":"Each ___ lit up the night sky with red and gold.","pos":"noun","pic":"🎆"},{"w":"lantern","def":"a lamp with a cover around it, often made of paper or glass","ex":"Each child carried a paper ___ through the dark streets.","pos":"noun","pic":"🏮"},{"w":"decorate","def":"to make something look nicer by adding pretty things to it","ex":"Let's ___ the classroom with paper flowers.","pos":"verb","forms":{"noun":"decoration","verb":"decorate","adj":"decorative"}},{"w":"crowd","def":"a large group of people in one place","ex":"A huge ___ cheered as the band marched past.","pos":"noun"},{"w":"ancient","def":"very old; from thousands of years ago","ex":"The first Olympic Games were held in ___ Greece.","pos":"adj","pic":"🏛️","ant":["modern"]},{"w":"gather","def":"to come together in one place as a group","ex":"On New Year's Eve, people ___ in the square to watch the clock.","pos":"verb","syn":["meet"]},{"w":"feast","def":"a large, special meal for many people","ex":"After the parade, the whole village shared a ___ of rice, fruit and sweets.","pos":"noun","pic":"🍲"},{"w":"occasion","def":"a special event or time","ex":"A wedding is a happy ___ for the whole family.","pos":"noun","syn":["event"]}],"grammar":[{"q":"'I am tired,' said Mia. Mia said that she ___ tired.","opts":["was","were","be","been"],"a":0,"why":"In reported speech, the verb usually moves one step back in time: 'am' becomes 'was'."},{"q":"My teacher ___ us that the festival starts at six.","opts":["told","said","spoke","talked"],"a":0,"why":"'Tell' needs a person after it (told us). 'Say' does not (she said that...)."},{"q":"During Diwali, small oil lamps ___ in windows and doorways.","opts":["are lit","lights","are lighting","is lit"],"a":0,"why":"The lamps don't light themselves; people light them. Use the passive: are + lit (plural, because 'lamps')."},{"q":"I ___ to a carnival, but I would love to go to one.","opts":["have never been","have never go","never been","am never going"],"a":0,"why":"For experiences in your life up to now, use the present perfect: have never been."},{"q":"The first Notting Hill Carnival ___ place in the 1960s.","opts":["took","has taken","takes","was taken"],"a":0,"why":"The 1960s is a finished time, so use the past simple: took place."},{"q":"The man ___ leads the parade plays the drums.","opts":["who","which","whose","where"],"a":0,"why":"Use 'who' (or 'that') to give more information about a person."}],"sentences":["Thousands of people watched the parade.","My aunt told me that the festival was amazing.","Do you know who decorated the classroom?","We have decorated the house with paper lanterns."],"reading":{"title":"Festivals of colour and light","text":"All around the world, people gather to celebrate special days. Two of the biggest festivals are Diwali and Lunar New Year.\n\nDiwali, the festival of lights, is celebrated by millions of people in India and in many other countries. It usually takes place in October or November and lasts for five days. Families light small clay lamps called diyas and put them in windows and doorways. Many people also make rangoli, which are beautiful patterns on the floor made from coloured powder, rice or flower petals.\n\nLunar New Year usually falls in January or February. In China, it is also called the Spring Festival. Homes are decorated in red, because red is thought to be a lucky colour. Children often receive red envelopes with money inside. In the streets, crowds watch lion and dragon dances to the sound of loud drums. The celebrations end with the Lantern Festival, when thousands of lanterns light up the night.","qs":[{"type":"tfng","q":"Diwali lasts for less than a week.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Rangoli patterns are always made from rice.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Diwali is more popular than Lunar New Year.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"Why are homes decorated in red at Lunar New Year?","opts":["Many people believe red brings good luck.","Red decorations are the cheapest.","Red is the colour of spring.","Dragons are always red."],"a":0},{"type":"mc","q":"What is another name for Lunar New Year in China?","opts":["the Spring Festival","the Lantern Festival","the festival of lights","the Dragon Festival"],"a":0}]},"extra":[{"kind":"preposition","q":"Diwali usually takes place ___ October or November.","opts":["in","on","at","by"],"a":0,"why":"Use 'in' with months, 'on' with days and dates, and 'at' with clock times."},{"kind":"paraphrase","q":"Which sentence means the same as 'The festival takes place every year'?","opts":["The festival happens once a year.","The festival takes a year to plan.","The festival is held every month.","The festival finished last year."],"a":0,"why":"'Takes place every year' means it happens once a year."},{"kind":"wordform","q":"The streets look beautiful with all the ___. (decorate)","opts":["decorations","decorate","decorative","decorated"],"a":0,"why":"After 'all the' we need a plural noun: decorations."},{"kind":"phrasal","q":"Before the parade, the children ___ their costumes to check that they fitted.","opts":["tried on","gave up","put off","ran out"],"a":0,"why":"'Try on' means put clothes on to see if they fit."}]},{"id":"explorer-5","title":"Oceans and space","emoji":"🚀","words":[{"w":"orbit","def":"to travel around a planet, moon or star in a curved path","ex":"The International Space Station takes about 90 minutes to ___ the Earth.","pos":"verb","pic":"🛰️"},{"w":"astronaut","def":"a person who is trained to travel into space","ex":"The ___ floated around inside the space station.","pos":"noun","pic":"🧑‍🚀"},{"w":"gravity","def":"the force that pulls things towards the ground or towards each other","ex":"Because of ___, the far side of the Moon ___ in 1959.","opts":["was taken","took","was took","has taken"],"a":0,"why":"The photo didn't take anything; a spacecraft took it. Use the past passive: was + taken."},{"q":"Humans ___ on Mars yet.","opts":["haven't landed","hasn't landed","don't land","weren't landed"],"a":0,"why":"Use the present perfect with 'yet'. 'Humans' is plural, so use 'haven't'."},{"q":"Astronauts have to practise ___ in a huge swimming pool.","opts":["moving","to move","move","moved"],"a":0,"why":"After 'practise', use the -ing form. ('Practise' with an 's' is the British spelling of the verb.)"},{"q":"'I can see the whole of Africa,' said the astronaut. She said that she ___ see the whole of Africa.","opts":["could","cans","is able","must"],"a":0,"why":"In reported speech, 'can' usually becomes 'could'."}],"sentences":["Rockets are launched from a base in Florida.","Robots can explore the deepest parts of the ocean.","The telescope that we used belongs to my uncle.","Have astronauts ever landed on Mars?"],"reading":{"title":"Exploring the deep","text":"Space is not the only place that is hard to explore. The ocean covers more than 70 per cent of the Earth's surface, but most of it has never been explored in detail.\n\nThe deepest part of the ocean is in the Mariana Trench in the Pacific. It is about 11,000 metres deep. If you put Mount Everest at the bottom, its top would still be more than two kilometres under the water. No sunlight reaches these depths, and the water pressure is enormous: more than 1,000 times greater than at the surface. Even so, strange creatures live in the deep ocean, and many of them make their own light.\n\nSpace and the deep sea have a lot in common. Both are dark, and humans cannot survive in either place without special equipment. Astronauts wear space suits, and deep-sea explorers travel in small, very strong submarines. Today, robots do much of the exploring in both places and send photos and information back to scientists.","qs":[{"type":"mc","q":"How deep is the deepest part of the ocean?","opts":["about 11,000 metres","about 2,000 metres","about 8,800 metres","about 1,000 metres"],"a":0},{"type":"tfng","q":"Mount Everest would be completely covered by water in the Mariana Trench.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Sunlight can reach the bottom of the Mariana Trench.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Submarines cost more to build than rockets.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What does the writer say space and the deep sea have in common?","opts":["Humans need special equipment to survive in both.","Both are full of plants.","Both have been fully explored.","Both are warm and bright."],"a":0}]},"extra":[{"kind":"phrasal","q":"Three, two, one... and the rocket ___!","opts":["took off","took up","got over","ran out"],"a":0,"why":"'Take off' means leave the ground and rise into the air."},{"kind":"cohesion","q":"Which sentence comes next? 'The Moon has no air. ___'","opts":["Because of this, astronauts must wear space suits there.","The Moon is very beautiful.","However, there is lots of air on the Moon.","For example, the Earth is round."],"a":0,"why":"'Because of this' links a cause (there is no air) to its result (astronauts need space suits)."},{"kind":"linking","q":"___ the Moon looks small, it is about a quarter as wide as the Earth.","opts":["Although","Because","So","Unless"],"a":0,"why":"'Although' joins two ideas that are surprising together: it looks small, but it is quite big."},{"kind":"wordform","q":"Space ___ costs a lot of money. (explore)","opts":["exploration","explorer","explore","explored"],"a":0,"why":"We need a noun for the activity: exploration. An 'explorer' is a person."}]}]},{"stage":5,"units":[{"id":"achiever-1","title":"Climate and energy","emoji":"🌍","words":[{"w":"renewable","def":"coming from a natural source that will not run out, such as the sun or the wind","ex":"Wind and so

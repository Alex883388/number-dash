before our plane left.","pos":"noun","pic":"🛫"},{"w":"passport","def":"a small book with your photo that you need to travel to another country","ex":"The officer looked at the photo in my ___ and said, 'Welcome to Spain!'","pos":"noun","pic":"🛂"},{"w":"suitcase","def":"a big bag with a handle that you put your clothes in for a trip","ex":"I can't close my ___ because there are too many clothes in it!","pos":"noun","pic":"🧳"},{"w":"ticket","def":"a piece of paper or a code that shows you have paid to travel or go in somewhere","ex":"I bought a train ___ to London for twenty pounds.","pos":"noun","pic":"🎫"},{"w":"journey","def":"travelling from one place to another","ex":"The ___ from our house to Grandma's takes three hours by car.","pos":"noun"},{"w":"flight","def":"a trip in a plane","ex":"Our ___ to Rome is late because there is a problem with the plane.","pos":"noun","pic":"✈️"},{"w":"hotel","def":"a building where you pay to sleep and eat when you are on holiday","ex":"Our ___ had a big swimming pool and a restaurant.","pos":"noun","pic":"🏨"},{"w":"tent","def":"a small house made of cloth that you can carry and put up outside","ex":"When we go camping, we sleep in a ___.","pos":"noun","pic":"⛺"},{"w":"postcard","def":"a card with a picture on one side that you send to people when you are on holiday","ex":"I sent Grandma a ___ with a picture of the beach on it.","pos":"noun"},{"w":"luggage","def":"all the bags and suitcases that you take on a trip","ex":"How much ___ have you got? Only one bag.","pos":"noun"},{"w":"abroad","def":"in or to another country","ex":"This summer we're going ___ for the first time, to France!","pos":"adv"},{"w":"tourist","def":"a person who visits a place on holiday","ex":"The ___ took a photo of the castle with her camera.","pos":"noun"},{"w":"pack","def":"to put your things into a bag or suitcase before a trip","ex":"Don't forget to ___ your toothbrush and your pyjamas!","pos":"verb"},{"w":"arrive","def":"to get to a place at the end of a journey","ex":"Our plane will ___ in Paris at three o'clock.","pos":"verb"},{"w":"passenger","def":"a person who travels in a car, bus, train or plane but isn't the driver","ex":"Every ___ on the plane must sit down and wear a seat belt.","pos":"noun"},{"w":"platform","def":"the place in a station where you wait to get on a train","ex":"The train to London leaves from ___ 4.","pos":"noun","pic":"🚉"},{"w":"souvenir","def":"a small thing you buy on holiday to help you remember the place","ex":"I bought a little model of the Eiffel Tower as a ___ of Paris.","pos":"noun"},{"w":"sightseeing","def":"visiting the famous and interesting places in a town or city","ex":"We spent the day ___ in Rome and saw lots of famous old buildings.","pos":"noun"},{"w":"rucksack","def":"a bag that you carry on your back when you walk or travel","ex":"I carried my water and sandwiches in a ___ on my back.","pos":"noun","pic":"🎒"},{"w":"island","def":"a piece of land with water all around it","ex":"We took a boat to a small ___ with white beaches and palm trees.","pos":"noun","pic":"🏝️"}],"grammar":[{"q":"Take a coat. I think it ___ be cold in the mountains.","opts":["will","is","was"],"a":0,"why":"Use 'will' + verb to say what you think will happen in the future."},{"q":"Those bags look heavy. I ___ help you carry them.","opts":["will","am","was"],"a":0,"why":"Use 'will' to offer to do something: I'll help you."},{"q":"How ___ luggage have you got?","opts":["much","many","a"],"a":0,"why":"'Luggage' is uncountable (you can't say 'two luggages'), so use 'how much'."},{"q":"How ___ suitcases are you taking?","opts":["many","much","any"],"a":0,"why":"'Suitcases' is countable (one, two, three...), so use 'how many'."},{"q":"You ___ take a hat. It's very sunny in Egypt.","opts":["should","shouldn't","should to"],"a":0,"why":"Use 'should' + verb to give good advice. Never put 'to' after 'should'."},{"q":"There ___ a lot of luggage on the train.","opts":["was","were","are"],"a":0,"why":"'Luggage' is uncountable, so the verb is singular: there was, not there were."},{"q":"Have you ever ___ to an island?","opts":["been","went","go"],"a":0,"why":"Use 'Have you ever been to...?' to ask about things in your life."},{"q":"This is the ___ hotel in the town. It's got three swimming pools!","opts":["best","better","goodest"],"a":0,"why":"'Good' is irregular: good, better, the best."},{"q":"We haven't got ___ money left for souvenirs.","opts":["much","many","a"],"a":0,"why":"'Money' is uncountable, so use 'much' with 'not': not much money."},{"q":"I was ___ my suitcase when the taxi arrived.","opts":["packing","packed","pack"],"a":0,"why":"Use was or were + -ing for something that was going on when something else happened."}],"sentences":["How much luggage are you taking on holiday?","I think you will love the hotel.","Don't forget to bring your passport!","We should get to the airport early.","Have you ever been to an island?","The train to London leaves from platform two."],"reading":[{"title":"A trip to Scotland","text":"Last summer, Amy and her family went on holiday to Scotland. It was a long journey, so they took the train from London. The train left at eight o'clock in the morning and arrived in Edinburgh after four and a half hours. Amy read a book and looked out of the window at the hills and sheep.\n\nIn Edinburgh they stayed in a small hotel near the castle. Every day they visited a different place. Amy's favourite was a museum about dinosaurs. On the last day she bought a postcard for her best friend, Zara. On it she wrote: 'Scotland is beautiful, but it rains a lot! Next year I will come back with you!'","qs":[{"type":"mc","q":"How did Amy's family travel to Scotland?","opts":["by plane","by train","by car","by bus"],"a":1},{"type":"mc","q":"How long was the train journey?","opts":["four hours","four and a half hours","eight hours","two and a half hours"],"a":1},{"type":"mc","q":"Where was the hotel?","opts":["near the castle","near the station","next to the sea","in the hills"],"a":0},{"type":"tf","q":"Amy's favourite place was a museum about dinosaurs.","opts":["True","False"],"a":0},{"type":"tf","q":"Amy wrote that the weather in Scotland was always sunny.","opts":["True","False"],"a":1}]},{"title":"Camping on an island","text":"Last August, Tom and his family went camping on a small island. They took a boat from the coast with their rucksacks and a big tent. The journey only took forty minutes, but Tom felt a bit sick on the boat.\n\nOn the island there were no cars and no shops. Every day they swam in the sea, walked along the beach and looked for shells. One evening, while they were cooking dinner on a little fire, they saw dolphins jumping in the water!\n\nOn the last day, Tom found a beautiful white shell. He didn't buy a souvenir, because the shell was the best souvenir of all.","qs":[{"type":"mc","q":"How did they get to the island?","opts":["by plane","by boat","by train","by bus"],"a":1},{"type":"tf","q":"Tom felt a bit sick on the boat.","opts":["True","False"],"a":0},{"type":"tf","q":"There were lots of shops on the island.","opts":["True","False"],"a":1},{"type":"mc","q":"What did they see while they were cooking dinner?","opts":["dolphins","a ship","a storm"],"a":0},{"type":"mc","q":"Why didn't Tom buy a souvenir?","opts":["He had no money.","The shell was the best souvenir.","He forgot."],"a":1}]}],"extra":[{"kind":"preposition","q":"We arrived ___ the airport at six o'clock.","opts":["at","to","on","of"],"a":0,"why":"We say 'arrive at' a place like an airport or a station, and 'arrive in' a city or a country."},{"kind":"collocation","q":"We ___ lots of photos on holiday.","opts":["took","made","did","played"],"a":0,"why":"We say 'take a photo', not 'make' or 'do' a photo."},{"kind":"phrasal","q":"Our plane will ___ at ten o'clock, so we must be at the airport by eight.","opts":["take off","take after","put on","look for"],"a":0,"why":"When a plane takes off, it leaves the ground and goes up into the sky."},{"kind":"preposition","q":"We're going ___ holiday to Italy next week.","opts":["on","in","at","for"],"a":0,"why":"We say 'go on holiday' and 'be on holiday'."}]},{"id":"flyer-2","title":"Nature around us","emoji":"🌳","words":[{"w":"insect","def":"a very small animal with six legs, like an ant or a bee","ex":"A beetle is an ___ with six legs and a hard back.","pos":"noun","pic":"🐞"},{"w":"bee","def":"a flying insect that makes honey","ex":"The ___ flew from flower to flower to make honey.","pos":"noun","pic":"🐝"},{"w":"wing","def":"the part of a bird, an insect or a plane that helps it fly","ex":"My toy plane has got a long ___ on each side.","pos":"noun"},{"w":"feather","def":"one of the soft, light things that cover a bird's body","ex":"I found a long blue ___ that fell from a bird.","pos":"noun","pic":"🪶"},{"w":"desert","def":"a very dry, hot place with lots of sand and very little rain","ex":"Camels can walk for days in the hot, dry ___.","pos":"noun","pic":"🏜️"},{"w":"forest","def":"a large area of land covered with trees","ex":"We walked under the tall trees in the ___ and saw a deer.","pos":"noun","pic":"🌲"},{"w":"planet","def":"a very big round thing in space that moves around the sun, like Earth or Mars","ex":"Jupiter is the biggest ___ in our solar system.","pos":"noun","pic":"🪐"},{"w":"storm","def":"very bad weather with strong wind and heavy rain","ex":"There was a big ___ last night, with strong wind and lots of rain.","pos":"noun","pic":"⛈️"},{"w":"environment","def":"the air, water and land around us, where people, animals and plants live","ex":"We should protect the ___ and keep our rivers clean.","pos":"noun","pic":"🌍"},{"w":"wild","def":"living in nature, not kept by people","ex":"Lions are ___ animals, so you can't keep one as a pet.","pos":"adj"},{"w":"recycle","def":"to use old paper, glass or plastic again to make new things","ex":"Don't throw that bottle away. We can ___ it!","pos":"verb","pic":"♻️"},{"w":"plastic","def":"a light material that people make; many bottles and bags are made of it","ex":"This bottle isn't made of glass. It's made of ___.","pos":"noun"},{"w":"butterfly","def":"an insect with big, beautiful wings in lots of colours","ex":"A ___ landed on the flower and opened its orange and black wings.","pos":"noun","pic":"🦋"},{"w":"caterpillar","def":"a small, long animal like a worm that later turns into a butterfly","ex":"The hungry green ___ ate lots of leaves, and then it turned into a butterfly.","pos":"noun","pic":"🐛"},{"w":"leaf","def":"one of the flat green parts that grow on a tree or a plant","ex":"In autumn, every ___ on the tree turns red or yellow.","pos":"noun","pic":"🍃"},{"w":"rubbish","def":"things that you throw away because you don't want them any more","ex":"There was so much ___ on the beach: old bottles, bags and paper.","pos":"noun","pic":"🗑️"},{"w":"waterfall","def":"a place where a river falls down over rocks from a high place","ex":"The river falls over the rocks and makes a beautiful ___.","pos":"noun"},{"w":"mountain","def":"a very high hill","ex":"It took us six hours to climb to the top of the ___.","pos":"noun","pic":"🏔️"},{"w":"grow","def":"to get bigger","ex":"Give the plant some water every day and it will ___ tall.","pos":"verb","pic":"🌱"},{"w":"nature","def":"all the plants, animals and places in the world that people didn't make","ex":"Grandma loves ___. She spends hours in the forest watching birds and insects.","pos":"noun"}],"grammar":[{"q":"The cheetah is the ___ animal on land.","opts":["fastest","faster","most fast"],"a":0,"why":"Use 'the' + -est to compare one thing with all the others: the fastest."},{"q":"Mount Everest is the ___ mountain in the world.","opts":["highest","higher","most high"],"a":0,"why":"Short adjectives add -est: high, the highest."},{"q":"This is the ___ beautiful forest I know.","opts":["most","more","much"],"a":0,"why":"Long adjectives use 'the most': the most beautiful."},{"q":"The water is ___ cold to swim in.","opts":["too","enough","very much"],"a":0,"why":"'Too' means more than is good: too cold to swim."},{"q":"My brother isn't tall ___ to reach the bird's nest.","opts":["enough","too","very"],"a":0,"why":"'Enough' means as much as you need. It comes after the adjective: tall enough."},{"q":"A bee is an insect ___ makes honey.","opts":["which","who","where"],"a":0,"why":"Use 'which' for animals and things, and 'who' for people."},{"q":"The blue whale is the ___ animal in the world.","opts":["biggest","bigest","most big"],"a":0,"why":"Big ends in one vowel + one consonant, so double the g and add -est: the biggest."},{"q":"There isn't ___ water in the desert for trees to grow.","opts":["enough","too","too many"],"a":0,"why":"'Enough' goes before a noun and means as much as you need: enough water."},{"q":"That was the ___ storm we have ever had.","opts":["worst","baddest","worse"],"a":0,"why":"'Bad' is irregular: bad, worse, the worst."},{"q":"We ___ leave rubbish in the forest. It's bad for the animals.","opts":["shouldn't","should","don't should"],"a":0,"why":"Use 'shouldn't' + verb to say something is a bad idea."}],"sentences":["Bees fly from flower to flower.","We should recycle our plastic bottles.","The water was too cold to swim in.","A bird uses its wings to fly.","The caterpillar turned into a beautiful butterfly.","How much rubbish did you collect?"],"reading":[{"title":"Busy bees","text":"Bees are small, but they are some of the most important insects in the world. A bee has got four wings and six legs. It flies from flower to flower and drinks a sweet juice called nectar. Back at its home, the hive, it turns the nectar into honey.\n\nBees also help plants. When a bee visits a flower, yellow powder from the flower sticks to its body. The bee carries it to the next flower, and this helps fruit like apples and strawberries grow.\n\nYou can help bees too. Plant some flowers in your garden or in a pot by the window. Bees love blue and purple flowers best!","qs":[{"type":"mc","q":"How many wings has a bee got?","opts":["two","four","six"],"a":1},{"type":"mc","q":"What is a hive?","opts":["a bee's home","a kind of flower","a sweet juice"],"a":0},{"type":"tf","q":"Bees help fruit like apples to grow.","opts":["True","False"],"a":0},{"type":"tf","q":"Bees like red flowers best.","opts":["True","False"],"a":1},{"type":"mc","q":"What does a bee make from nectar?","opts":["powder","honey","flowers"],"a":1}]},{"title":"From egg to butterfly","text":"Did you know that every butterfly starts its life as a tiny egg? A mother butterfly lays her eggs on a leaf. After a few days, a small caterpillar comes out of each egg. It is very hungry, so it eats leaves all day and grows very quickly.\n\nWhen the caterpillar is big enough, it makes a hard case around its body. Inside, something amazing happens. After about two weeks, the case opens and a butterfly comes out! At first its wings are wet, so it waits in the sun until they are dry. Then it flies away to find flowers.","qs":[{"type":"mc","q":"Where does a mother butterfly lay her eggs?","opts":["on a leaf","in the water","under a rock","in a flower"],"a":0},{"type":"mc","q":"What does the caterpillar eat?","opts":["flowers","leaves","insects"],"a":1},{"type":"tf","q":"The caterpillar grows very slowly.","opts":["True","False"],"a":1},{"type":"mc","q":"How long does the caterpillar stay inside the hard case?","opts":["about two days","about two weeks","about two months"],"a":1},{"type":"tf","q":"A new butterfly's wings are wet at first.","opts":["True","False"],"a":0}]}],"extra":[{"kind":"preposition","q":"Bees fly ___ flower to flower.","opts":["from","at","in","of"],"a":0,"why":"We say 'from one place to another': from flower to flower."},{"kind":"collocation","q":"We must ___ care of our planet.","opts":["take","make","do","have"],"a":0,"why":"We say 'take care of' something. It means 'look after' it."},{"kind":"phrasal","q":"Please don't ___ your plastic bottles. We can recycle them!","opts":["throw away","put on","look after","get up"],"a":0,"why":"'Throw away' means put something in the bin because you don't want it."},{"kind":"linking","q":"Bees are very small, ___ they are very important.","opts":["but","because","so","or"],"a":0,"why":"Use 'but' to join two ideas that are different or surprising."}]},{"id":"flyer-3","title":"Jobs people do","emoji":"💼","words":[{"w":"vet","def":"a doctor for animals","ex":"The ___ looked at our cat's ear and gave her some medicine.","pos":"noun"},{"w":"dentist","def":"a person whose job is to look after people's teeth","ex":"I go to the ___ twice a year to check my teeth.","pos":"noun","pic":"🪥"},{"w":"artist","def":"a person who paints or draws pictures","ex":"The ___ painted a beautiful picture of the sea.","pos":"noun","pic":"🖌️"},{"w":"firefighter","def":"a person whose job is to stop fires and help people","ex":"The ___ climbed a long ladder to help the cat down from the tree.","pos":"noun","pic":"👨‍🚒"},{"w":"journalist","def":"a person who writes news stories for newspapers, TV or websites","ex":"The ___ asked the football player lots of questions for the newspaper.","pos":"noun","pic":"📰"},{"w":"mechanic","def":"a person whose job is to repair cars and machines","ex":"Our car broke down, so we took it to a ___.","pos":"noun","pic":"🔧"},{"w":"photographer","def":"a person who takes photos as a job","ex":"The ___ said, 'Smile!' and took a picture of our class.","pos":"noun","pic":"📷"},{"w":"pilot","def":"a person who flies a plane","ex":"The ___ said, 'Welcome on board! We will land in Paris in one hour.'","pos":"noun","pic":"👨‍✈️"},{"w":"police officer","def":"a person whose job is to keep people safe and make sure they follow the law","ex":"If you get lost, ask a ___ for help.","pos":"noun","pic":"👮"},{"w":"waiter","def":"a person who brings food to your table in a restaurant","ex":"The ___ brought us our pizzas and some water.","pos":"noun"},{"w":"factory","def":"a big building where people and machines make things like cars or toys","ex":"My uncle works in a chocolate ___ that makes 10,000 bars a day.","pos":"noun","pic":"🏭"},{"w":"uniform","def":"special clothes that everyone in a group or a job wears","ex":"Nurses and police officers wear a ___ at work.","pos":"noun"},{"w":"farmer","def":"a person who keeps animals or grows food on a farm","ex":"The ___ gets up at five o'clock to give the cows their breakfast.","pos":"noun","pic":"🧑‍🌾"},{"w":"chef","def":"a person whose job is to cook food in a restaurant","ex":"The ___ in this restaurant makes the best pizza in town.","pos":"noun","pic":"🧑‍🍳"},{"w":"builder","def":"a person whose job is to make houses and other buildings","ex":"The ___ put the bricks on top of each other to make a wall.","pos":"noun","pic":"👷"},{"w":"actor","def":"a person who plays a part in a film, a play or a TV show","ex":"The ___ in that film was so funny that everyone in the cinema laughed.","pos":"noun","pic":"🎭"},{"w":"hairdresser","def":"a person whose job is to cut and wash people's hair","ex":"My hair is too long. I'm going to the ___ on Saturday.","pos":"noun","pic":"💇"},{"w":"office","def":"a room or building where people work at desks","ex":"My mum works in an ___ on the tenth floor. Her desk is by the window.","pos":"noun","pic":"🏢"},{"w":"shop assistant","def":"a person whose job is to help people in a shop","ex":"The ___ helped me find a T-shirt in my size.","pos":"noun"},{"w":"earn","def":"to get money for the work that you do","ex":"My brother washes cars on Saturdays to ___ some money.","pos":"verb"}],"grammar":[{"q":"A pilot is a person ___ flies planes.","opts":["who","which","where"],"a":0,"why":"Use 'who' for people."},{"q":"This is the camera ___ my dad uses at work.","opts":["which","who","where"],"a":0,"why":"Use 'which' for things."},{"q":"Have you ever ___ a real astronaut?","opts":["met","meet","meeting"],"a":0,"why":"The present perfect is have + past participle: meet, met."},{"q":"My mum ___ worked in three different countries.","opts":["has","have","is"],"a":0,"why":"In the present perfect, use 'has' with he, she and it: she has worked."},{"q":"I ___ never been to a TV studio.","opts":["have","has","am"],"a":0,"why":"In the present perfect, use 'have' with I, you, we and they: I have never been."},{"q":"You want to be a vet? You ___ study science at school.","opts":["should","shouldn't","are"],"a":0,"why":"Use 'should' to give good advice. Vets need science, so you should study it."},{"q":"The actor has ___ three films this year.","opts":["made","maked","make"],"a":0,"why":"'Make' is irregular: make, made, has made."},{"q":"The hairdresser was ___ my hair when the phone rang.","opts":["cutting","cut","cuts"],"a":0,"why":"Use was + -ing for the longer action. The phone rang in the middle of it."},{"q":"Being a firefighter is one of the ___ jobs in the world.","opts":["most exciting","excitingest","more exciting"],"a":0,"why":"Long adjectives use 'the most': one of the most exciting jobs."},{"q":"If you ___ hard, you will be a great vet one day.","opts":["work","will work","worked"],"a":0,"why":"First conditional: after 'if', use the present simple, not 'will'."}],"sentences":["I know a man who works in a chocolate factory.","Have you ever met a real pilot?","You should ask a police officer for help.","My mum has never worn a uniform.","Does your uncle earn a lot of money?","The builder was standing on the roof."],"reading":[{"title":"What do you want to be?","text":"Our teacher asked us, 'What do you want to be when you grow up?' Everyone had a different answer.\n\nJack wants to be a pilot because he loves planes. He has already flown to six countries with his family. Mia wants to be a dentist like her mum. She says it is an important job, and you should look after your teeth every day! Sam wants to be an astronaut. He has read lots of books about space, and he wants to be the first person on Mars.\n\nI want to be a journalist. I love asking people questions and writing stories. Last week I wrote a story about our school for the local newspaper!","qs":[{"type":"mc","q":"Why does Jack want to be a pilot?","opts":["He loves planes.","His dad is a pilot.","He wants to go to Mars."],"a":0},{"type":"mc","q":"What job does Mia's mum do?","opts":["She's a pilot.","She's a dentist.","She's a journalist.","She's a teacher."],"a":1},{"type":"tf","q":"Sam has read lots of books about space.","opts":["True","False"],"a":0},{"type":"tf","q":"The writer wants to be an astronaut.","opts":["True","False"],"a":1},{"type":"mc","q":"What did the writer write about last week?","opts":["space","planes","their school"],"a":2}]},{"title":"Aunt Rosa's jobs","text":"My aunt Rosa has had lots of different jobs. When she left school, she worked as a shop assistant in a clothes shop. Then she became a hairdresser, but she didn't enjoy it very much.\n\nNow Rosa is a chef in a busy restaurant. She starts work at eleven o'clock in the morning and finishes late at night. It is hard work, and she doesn't earn a lot of money, but she loves it. Her favourite dish is fish with lemon and rice.\n\nLast month, a famous actor came to the restaurant. He ate Rosa's fish and said, 'This is the best fish I have ever eaten!'","qs":[{"type":"mc","q":"What was Rosa's first job?","opts":["a hairdresser","a shop assistant","a chef","an actor"],"a":1},{"type":"tf","q":"Rosa enjoyed being a hairdresser very much.","opts":["True","False"],"a":1},{"type":"mc","q":"What time does Rosa start work?","opts":["at ten o'clock","at eleven o'clock","late at night"],"a":1},{"type":"tf","q":"Rosa loves her job as a chef.","opts":["True","False"],"a":0},{"type":"mc","q":"Who came to the restaurant last month?","opts":["a famous actor","a famous singer","a famous chef"],"a":0}]}],"extra":[{"kind":"preposition","q":"Firefighters often work ___ night.","opts":["at","in","on","to"],"a":0,"why":"We say 'at night', but 'in the morning' and 'in the afternoon'."},{"kind":"collocation","q":"A good journalist ___ lots of questions.","opts":["asks","makes","does","says"],"a":0,"why":"We say 'ask a question', not 'make', 'do' or 'say' a question."},{"kind":"collocation","q":"Firefighters ___ a very important job.","opts":["do","make","play","take"],"a":0,"why":"We say 'do a job', not 'make' a job."},{"kind":"preposition","q":"My cousin works ___ a waiter in a cafe.","opts":["as","like","for","in"],"a":0,"why":"Use 'as' to say what someone's job is: he works as a waiter."}]},{"id":"flyer-4","title":"A story from the past","emoji":"📖","words":[{"w":"castle","def":"a big old building with thick walls and towers, where kings and queens lived","ex":"The king and queen lived in a ___ on top of the hill.","pos":"noun","pic":"🏰"},{"w":"king","def":"the man who is the head of a country, often with a crown","ex":"The ___ wore a gold crown and sat on his big chair.","pos":"noun","pic":"👑"},{"w":"queen","def":"the woman who is the head of a country, or the wife of a king","ex":"The king and the ___ had a beautiful daughter.","pos":"noun"},{"w":"dragon","def":"a big animal in stories that has wings and breathes fire","ex":"The friendly ___ in the story had big wings and could breathe fire.","pos":"noun","pic":"🐉"},{"w":"adventure","def":"an exciting trip where unusual things happen","ex":"The children went on an exciting ___ to find the lost treasure.","pos":"noun"},{"w":"gold","def":"a yellow metal that costs a lot of money","ex":"The pirates found a box full of ___ coins.","pos":"noun","pic":"🪙"},{"w":"secret","def":"something that only you or a few people know","ex":"Can you keep a ___? Don't tell anyone!","pos":"noun"},{"w":"suddenly","def":"very quickly, when you don't expect it","ex":"We were walking in the forest when ___ it started to rain.","pos":"adv"},{"w":"midnight","def":"twelve o'clock at night","ex":"At ___, when everyone was asleep, the old clock started to talk!","pos":"noun","pic":"🕛"},{"w":"museum","def":"a building where you can look at old or interesting things","ex":"We saw old dinosaur bones at the ___.","pos":"noun","pic":"🏛️"},{"w":"history","def":"the study of things that happened in the past","ex":"In our ___ lesson, we learned about the kings and queens of England.","pos":"noun","pic":"📜"},{"w":"century","def":"a time of one hundred years","ex":"This castle is very old. People built it in the twelfth ___.","pos":"noun"},{"w":"prince","def":"the son of a king and a queen","ex":"The queen's son is a ___. One day he will be king.","pos":"noun","pic":"🤴"},{"w":"princess","def":"the daughter of a king and a queen","ex":"The king's daughter, the ___, had long golden hair.","pos":"noun","pic":"👸"},{"w":"pirate","def":"a person in stories who sails the seas and takes gold from other ships","ex":"The ___ had a big black hat, a parrot and a ship full of gold.","pos":"noun","pic":"🏴‍☠️"},{"w":"treasure","def":"gold, money and beautiful things that cost a lot, often hidden","ex":"They opened the old box and found ___: gold coins, rings and jewels.","pos":"noun","pic":"💎"},{"w":"magic","def":"a special power in stories that makes impossible things happen","ex":"The wizard used ___ to turn the frog into a prince.","pos":"noun","pic":"🪄"},{"w":"giant","def":"a very big, tall person in stories","ex":"The ___ was so tall that his head was above the clouds.","pos":"noun"},{"w":"brave","def":"not afraid of danger or difficult things","ex":"The ___ knight wasn't afraid of the dragon at all.","pos":"adj"},{"w":"ago","def":"before now; in the past","ex":"This castle was built eight hundred years ___.","pos":"adv"}],"grammar":[{"q":"I ___ reading a book when the phone rang.","opts":["was","were","am"],"a":0,"why":"Use was or were + -ing for something that was going on in the past. With I, use 'was'."},{"q":"The children ___ playing in the garden when it started to rain.","opts":["were","was","are"],"a":0,"why":"With we, you and they (the children), use 'were' + -ing."},{"q":"What ___ you doing at eight o'clock last night?","opts":["were","was","did"],"a":0,"why":"Ask about something that was going on in the past with 'What were you doing?'"},{"q":"While the king was sleeping, the dragon ___ into the castle.","opts":["flew","flying","fly"],"a":0,"why":"Use the past simple for the short action that happened in the middle: the dragon flew."},{"q":"She was walking home ___ she found a gold coin.","opts":["when","while","during"],"a":0,"why":"Use 'when' before the short action: She was walking home when she found a coin."},{"q":"Long ago, people ___ in castles.","opts":["lived","living","live"],"a":0,"why":"'Long ago' is in the past, so use the past simple: lived."},{"q":"What ___ the princess doing when the dragon arrived?","opts":["was","were","did"],"a":0,"why":"The princess = she, so ask with 'was' + -ing: What was she doing?"},{"q":"The prince ___ dinner when the giant knocked on the door.","opts":["was having","were having","has"],"a":0,"why":"Use was + -ing for the longer action. The giant knocked in the middle of it."},{"q":"This is the ___ castle in our country. It's 900 years old.","opts":["oldest","older","most old"],"a":0,"why":"Short adjectives add -est to talk about the top one of all: the oldest."},{"q":"We ___ the castle museum last summer.","opts":["visited","have visited","visit"],"a":0,"why":"'Last summer' is a finished time in the past, so use the past simple: we visited."}],"sentences":["What were you doing at midnight?","Nobody knew the secret of the castle.","We visited a museum about the history of London.","The children were looking for the hidden treasure.","The brave prince wasn't afraid of the giant.","Which pirate found the treasure?"],"reading":[{"title":"The dragon who loved cake","text":"Long ago, a small green dragon called Pip lived in a cave near a big castle. Pip wasn't scary at all. He loved cake more than anything!\n\nOne night, at midnight, while the king and queen were sleeping, Pip flew to the castle kitchen. The cook was making a huge chocolate cake for the princess's birthday. Suddenly she saw Pip at the window. She was very surprised, but Pip smiled and said, 'Please may I have a small piece?'\n\nThe cook laughed and gave him some cake. The next day, the princess invited Pip to her party. From that day, the dragon and the princess were best friends.","qs":[{"type":"mc","q":"Where did Pip live?","opts":["in the castle","in a cave","in the forest","in the kitchen"],"a":1},{"type":"mc","q":"What were the king and queen doing when Pip flew to the castle?","opts":["They were sleeping.","They were eating cake.","They were having a party.","They were reading."],"a":0},{"type":"mc","q":"Who was making a cake?","opts":["the princess","the queen","the cook"],"a":2},{"type":"tf","q":"The cook was angry with Pip.","opts":["True","False"],"a":1},{"type":"tf","q":"The princess invited Pip to her party.","opts":["True","False"],"a":0}]},{"title":"The giant on the mountain","text":"Long ago, a giant lived on a mountain near a small village. He was very, very tall, so the people in the village thought he was dangerous. Nobody ever visited him.\n\nOne day, a brave young prince called Leo decided to climb the mountain. When he arrived at the top, the giant was planting flowers in his garden. 'Hello!' said the giant with a big smile. 'Would you like to help me? Nobody ever comes to see me.'\n\nLeo stayed all afternoon. They planted flowers, played games and laughed a lot. The next day, Leo brought all the children from the village, and they had a picnic in the giant's garden. From that day, the giant always had lots of friends.","qs":[{"type":"mc","q":"Why did nobody visit the giant?","opts":["He lived too far away.","People thought he was dangerous.","He didn't like visitors.","The mountain was too high."],"a":1},{"type":"mc","q":"What was the giant doing when Leo arrived?","opts":["He was sleeping.","He was planting flowers.","He was making a cake."],"a":1},{"type":"tf","q":"The giant was angry when he saw Leo.","opts":["True","False"],"a":1},{"type":"tf","q":"Leo stayed with the giant all afternoon.","opts":["True","False"],"a":0},{"type":"mc","q":"Who did Leo bring the next day?","opts":["the king and queen","the children from the village","his horse"],"a":1}]}],"extra":[{"kind":"linking","q":"Pip was hungry, ___ he flew to the kitchen.","opts":["so","but","because","or"],"a":0,"why":"Use 'so' to say what happened because of something: he was hungry, so he flew to the kitchen."},{"kind":"preposition","q":"The story happened ___ the twelfth century.","opts":["in","on","at","to"],"a":0,"why":"Use 'in' with centuries, years and months: in the twelfth century."},{"kind":"linking","q":"The princess was happy ___ she found her lost ring.","opts":["because","but","or","so"],"a":0,"why":"Use 'because' to give the reason: she was happy because she found her ring."},{"kind":"phrasal","q":"The pirates spent many years ___ the lost treasure.","opts":["looking for","looking after","giving up","taking off"],"a":0,"why":"'Look for' means try to find something."}]},{"id":"flyer-5","title":"Screens and gadgets","emoji":"📱","words":[{"w":"screen","def":"the flat glass part of a TV, computer or phone where you see pictures","ex":"The ___ on my tablet is broken, so I can't see the pictures.","pos":"noun","pic":"🖥️"},{"w":"keyboard","def":"the part of a computer with keys for letters and numbers that you press to type","ex":"I type my stories on the ___ with all ten fingers.","pos":"noun","pic":"⌨️"},{"w":"laptop","def":"a small computer that you can carry and use on your knees","ex":"My dad takes his ___ on the train so he can work.","pos":"noun","pic":"💻"},{"w":"mouse","def":"a small thing you move with your hand to point and click on a computer","ex":"Click on the picture with the ___.","pos":"noun","pic":"🖱️"},{"w":"website","def":"a place on the internet with pages of information about something","ex":"You can find the times of all the films on the cinema's ___.","pos":"noun","pic":"🌐"},{"w":"password","def":"a secret word that you type to open your computer, phone or game","ex":"Never tell anyone your ___, not even your best friend!","pos":"noun","pic":"🔑"},{"w":"app","def":"a small program that you put on a phone or tablet to do one job","ex":"I use a free ___ on my phone to learn Spanish.","pos":"noun"},{"w":"download","def":"to copy a game, song or file from the internet onto your computer or phone","ex":"Ask your parents before you ___ a new game.","pos":"verb","pic":"📥"},{"w":"online","def":"using or connected to the internet","ex":"My cousin and I play chess ___ every Sunday.","pos":"adv"},{"w":"information","def":"facts about something","ex":"This website has lots of useful ___ about dinosaurs.","pos":"noun","pic":"ℹ️"},{"w":"headphones","def":"a thing you wear over your ears to listen to music without other people hearing it","ex":"Please put on your ___. Your music is too loud for me!","pos":"noun","pic":"🎧"},{"w":"switch off","def":"to stop a machine or a light working, often by pressing a button","ex":"Please ___ the lights when you leave the room.","pos":"phrase","pic":"📴"},{"w":"email","def":"a message that you write on a computer or phone and send over the internet","ex":"I sent my teacher an ___ with my homework in it.","pos":"noun","pic":"📧"},{"w":"message","def":"a few words that you send to someone, for example on a phone","ex":"Mum sent me a ___ on my phone: 'Dinner is ready!'","pos":"noun","pic":"💬"},{"w":"smartphone","def":"a mobile phone that can go online and use apps","ex":"I keep my ___ in my pocket so I can call Mum.","pos":"noun"},{"w":"printer","def":"a machine that puts words and pictures from a computer onto paper","ex":"Can you put more paper in the ___? I want to print my story.","pos":"noun","pic":"🖨️"},{"w":"search","def":"to try to find something, for example on the internet","ex":"I'm going to ___ online for some information about sharks.","pos":"verb","pic":"🔍"},{"w":"type","def":"to write using the keys on a keyboard","ex":"My grandma can ___ very fast with only two fingers!","pos":"verb"},{"w":"switch on","def":"to make a machine or a light start working","ex":"It's dark in here. Can you ___ the light, please?","pos":"phrase"},{"w":"save","def":"to keep your work on a computer so that you don't lose it","ex":"Don't forget to ___ your story before you switch off the computer!","pos":"verb","pic":"💾"}],"grammar":[{"q":"If you play games all night, you ___ be tired tomorrow.","opts":["will","would","are"],"a":0,"why":"First conditional: if + present simple, then will + verb."},{"q":"If the battery ___ flat, the phone will stop working.","opts":["is","will be","was"],"a":0,"why":"After 'if' in the first conditional, use the present simple, not 'will'."},{"q":"I have ___ downloaded the new game. Do you want to play?","opts":["just","yet","ever"],"a":0,"why":"'Just' means a very short time ago. It goes between 'have' and the verb."},{"q":"Have you finished your homework ___?","opts":["yet","just","ever"],"a":0,"why":"Use 'yet' at the end of present perfect questions and negatives."},{"q":"This laptop is ___ heavy. I can't carry it.","opts":["too","enough","very much"],"a":0,"why":"'Too' means more than is good: too heavy to carry."},{"q":"Can you give me some ___ about the new phone?","opts":["information","informations","an information"],"a":0,"why":"'Information' is uncountable: no -s and no 'an'."},{"q":"If you don't charge your phone, it ___ work tomorrow.","opts":["won't","doesn't","isn't"],"a":0,"why":"First conditional: if + present simple, then won't (will not) + verb for the result."},{"q":"I've ___ finished my homework, so I can play now.","opts":["already","yet","ever"],"a":0,"why":"'Already' means before now, maybe sooner than you think. It goes between 'have' and the verb."},{"q":"How ___ emails did you get today?","opts":["many","much","any"],"a":0,"why":"'Emails' are countable (one email, two emails), so use 'how many'."},{"q":"I ___ typing my story when the screen went black.","opts":["was","were","am"],"a":0,"why":"Use 'was' + -ing with I for something that was going on in the past."}],"sentences":["Have you downloaded the new game yet?","My brother is too young to play this game.","Don't tell anyone your password.","I need a new battery for my camera.","Don't forget to save your work!","Can you send me an email?"],"reading":[{"title":"Ella's screen time","text":"Ella is eleven and she loves gadgets. She has got a laptop, a tablet and some big blue headphones. Every evening she goes online to play games with her friends or watch videos.\n\nLast month, Ella started to get headaches, and she often felt tired at school. Her mum said, 'I think you are spending too much time in front of screens. If you switch off your tablet an hour before bed, you will sleep better.'\n\nElla wasn't happy at first, but she tried it. Now she reads a book before bed instead. She has already finished three books this month, and her headaches have stopped. 'I still love my games,' she says, 'but books are fun too!'","qs":[{"type":"mc","q":"What does Ella do online every evening?","opts":["She does her homework.","She plays games and watches videos.","She reads books.","She writes stories."],"a":1},{"type":"mc","q":"What did Ella's mum tell her to do?","opts":["switch off her tablet an hour before bed","buy some new headphones","play more games with her friends"],"a":0},{"type":"tf","q":"Ella was very happy with her mum's idea at first.","opts":["True","False"],"a":1},{"type":"mc","q":"How many books has Ella finished this month?","opts":["two","three","four"],"a":1},{"type":"tf","q":"Ella's headaches have stopped.","opts":["True","False"],"a":0}]},{"title":"Grandpa goes online","text":"Last year my grandpa bought his first smartphone. At first he didn't like it at all. 'The buttons are too small,' he said, 'and I can't type fast enough!'\n\nSo every Sunday I helped him. First I showed him how to send a message. Then he learned how to search for information about his favourite football team. Now he sends me an email every morning, and he uses an app to talk to my cousin in Australia.\n\nLast week Grandpa sent me a message: 'I've just downloaded a game. If you come on Saturday, I will beat you!' I think he loves his phone more than I love mine now!","qs":[{"type":"mc","q":"What did Grandpa think about his phone at first?","opts":["He loved it.","He didn't like it.","He thought it was too big."],"a":1},{"type":"mc","q":"When did the writer help Grandpa?","opts":["every Saturday","every Sunday","every morning"],"a":1},{"type":"tf","q":"Grandpa uses an app to talk to the writer's cousin.","opts":["True","False"],"a":0},{"type":"tf","q":"Grandpa sends the writer an email every evening.","opts":["True","False"],"a":1},{"type":"mc","q":"What has Grandpa just downloaded?","opts":["a game","a football app","a film"],"a":0}]}],"extra":[{"kind":"phrasal","q":"Can you ___ the music, please? It's too loud.","opts":["turn down","turn up","look for","get on"],"a":0,"why":"'Turn down' means make it quieter. 'Turn up' means make it louder."},{"kind":"preposition","q":"I found the information ___ the internet.","opts":["on","in","at","by"],"a":0,"why":"We say 'on the internet' and 'on a website'."},{"kind":"phrasal","q":"Type your name and password to ___ to the game.","opts":["log in","log out","sit down","look after"],"a":0,"why":"'Log in' means type your name and password to start using a website or a game."},{"kind":"wordform","q":"Always use the internet ___ (safe).","opts":["safely","safe","safety","safest"],"a":0,"why":"We need an adverb with -ly to say how you use it: safely."}]}]},{"stage":4,"units":[{"id":"explorer-1","title":"Amazing animal homes","emoji":"🦫","words":[{"w":"burrow","def":"a hole or tunnel in the ground that an animal digs to live in","ex":"The rabbit ran into its ___ when it saw the fox.","pos":"noun","pic":"🐇"},{"w":"shelter","def":"a place that keeps you safe from bad weather or danger","ex":"The cave gave the bats ___ from the wind and rain.","pos":"noun"},{"w":"colony","def":"a large group of the same kind of animal that live together","ex":"A ___ of ants can have millions of members.","pos":"noun","pic":"🐜"},{"w":"hive","def":"a home where bees live and make honey","ex":"The bees flew back to their ___ with pollen on their legs.","pos":"noun","pic":"🐝"},{"w":"dam","def":"a wall built across a river to hold back the water","ex":"Beavers build a ___ of sticks and mud across the stream.","pos":"noun","pic":"🦫"},{"w":"predator","def":"an animal that hunts and eats other animals","ex":"The owl is a ___ that hunts mice at night.","pos":"noun","pic":"🦉","syn":["hunter"],"ant":["prey"]},{"w":"protect","def":"to keep someone or something safe from harm","ex":"Thick walls of mud ___ the chicks from the hot sun.","pos":"verb","syn":["guard","defend"],"forms":{"noun":"protection","verb":"protect","adj":"protective"}},{"w":"survive","def":"to stay alive, especially in a difficult situation","ex":"Camels can ___ for many days without drinking water.","pos":"verb","pic":"🐪","forms":{"noun":"survival","verb":"survive"}},{"w":"hollow","def":"empty inside","ex":"The woodpecker made its home in a ___ tree.","pos":"adj","ant":["solid"]},{"w":"underground","def":"below the surface of the earth","ex":"Moles spend most of their lives ___, digging tunnels in the dark.","pos":"adv"},{"w":"construct","def":"to build something, such as a house, a bridge or a nest","ex":"Weaver birds ___ their nests by tying knots in grass.","pos":"verb","syn":["build"],"forms":{"noun":"construction","verb":"construct"}},{"w":"habitat","def":"the natural place where an animal or plant usually lives","ex":"The rainforest is the natural ___ of many colourful frogs.","pos":"noun","pic":"🌳","syn":["home"]},{"w":"hibernate","def":"to spend the winter in a kind of deep sleep, as some animals do","ex":"Hedgehogs ___ in piles of dry leaves until the spring.","pos":"verb","pic":"🦔","forms":{"noun":"hibernation","verb":"hibernate"}},{"w":"nocturnal","def":"active at night and asleep during the day","ex":"Most owls are ___ birds, so they hunt when it is dark.","pos":"adj","pic":"🌙"},{"w":"migrate","def":"to travel to a different part of the world at the same time every year","ex":"Every autumn, swallows ___ to Africa to find warmer weather and more insects.","pos":"verb","forms":{"noun":"migration","verb":"migrate"}},{"w":"territory","def":"an area that an animal treats as its own and defends from others","ex":"A robin sings loudly to warn other robins to stay out of its ___.","pos":"noun"},{"w":"chamber","def":"a small room or space, for example one deep inside a nest or a burrow","ex":"The queen ant lays her eggs in a special ___ deep under the ground.","pos":"noun"},{"w":"entrance","def":"the door, gate or opening that you use to go into a place","ex":"The ___ to the rabbit's burrow was hidden under a bush.","pos":"noun","syn":["entry"],"ant":["exit"]},{"w":"rely","def":"to need someone or something and trust them to help you","ex":"Baby birds ___ on their parents for food and warmth.","pos":"verb","syn":["depend"]},{"w":"harsh","def":"very difficult to live in, for example extremely cold, dry or windy","ex":"Emperor penguins survive the ___ winters of Antarctica.","pos":"adj","pic":"🐧","syn":["severe"],"ant":["mild"]}],"grammar":[{"q":"Scientists ___ a new kind of spider web last year.","opts":["found","have found","find","were found"],"a":0,"why":"'Last year' is a finished time, so use the past simple: found."},{"q":"Owls ___ in that old barn since last winter.","opts":["have lived","lived","live","are living"],"a":0,"why":"With 'since', use the present perfect for something that started in the past and is still true now."},{"q":"Most bird nests ___ from twigs, grass and mud.","opts":["are made","make","are making","is made"],"a":0,"why":"The nests don't make anything; birds make them. Use the passive: are + made (plural, because 'nests')."},{"q":"This old wasp nest ___ in our garden last summer.","opts":["was found","is found","found","were found"],"a":0,"why":"Someone found the nest at a finished time, so use the past passive. 'Nest' is singular, so use 'was'."},{"q":"A beaver is an animal ___ builds dams across rivers.","opts":["which","where","what","whose"],"a":0,"why":"Use 'which' (or 'that') to give more information about an animal or a thing."},{"q":"This is the cave ___ thousands of bats sleep in winter.","opts":["where","which","who","what"],"a":0,"why":"Use 'where' after a place when a full sentence follows (bats sleep there)."},{"q":"There ___ be a pond in this field, and lots of frogs lived in it.","opts":["used to","use to","was used to","is used to"],"a":0,"why":"'Used to' + verb talks about something that was true in the past but is not true now."},{"q":"A hermit crab is an animal ___ home is an old shell from a sea snail.","opts":["whose","which","who","where"],"a":0,"why":"Use 'whose' to show that something belongs to someone or something: the crab's home."},{"q":"Moles are very good at ___ tunnels.","opts":["digging","to dig","dig","dug"],"a":0,"why":"After a preposition such as 'at', use the -ing form of the verb: good at digging."},{"q":"If you ___ too close to the nest, the birds will fly away.","opts":["go","will go","went","had gone"],"a":0,"why":"First conditional: if + present simple (go), then will + verb. Don't use 'will' after 'if' here."}],"sentences":["Beavers have built dams across the river.","Termite mounds are built by millions of insects.","Has the bee colony survived the winter?","This is the tree where the owls live.","Hedgehogs hibernate in piles of dry leaves.","Swallows used to build their nests in our barn."],"reading":[{"title":"Animal builders","text":"Humans are not the only great builders. Many animals make amazing homes, and some of them work together in huge teams.\n\nBeavers are famous for their dams. They cut down small trees with their strong teeth and push sticks, stones and mud together across a stream. The water behind the dam becomes a quiet pond. In the middle of it, the beavers build a home called a lodge. Its door is under the water, so most predators cannot get in.\n\nThe male weaver bird uses his beak to tie knots in long pieces of grass. If a female does not like the nest he has made, he may pull it apart and start again.\n\nTermites are tiny insects, but their mounds can be taller than an adult. Inside, there are lots of tunnels. They let air move through the mound and help to keep the colony cool.","qs":[{"type":"mc","q":"Why is the door of a beaver lodge under the water?","opts":["to keep most predators out","to let fresh air in","to catch fish more easily","to stop the pond from freezing"],"a":0},{"type":"tfng","q":"Beavers use only sticks to build their dams.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Weaver birds build a new nest every year.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"Some termite homes are higher than a grown-up person.","opts":["True","False","Not Given"],"a":0},{"type":"mc","q":"What do the tunnels inside a termite mound do?","opts":["They help to keep the mound cool.","They store food for the winter.","They join it to other mounds.","They let rainwater flow in."],"a":0}]},{"title":"The bird apartment block","text":"In the dry Kalahari Desert of southern Africa, you may see something strange in a tree: a huge pile of grass that looks like a haystack. In fact, it is the home of a whole colony of small brown birds called sociable weavers.\n\nUnlike most birds, sociable weavers build one giant nest together. The biggest nests can be several metres wide and hold more than a hundred birds. Inside, each pair has its own small chamber, and the entrance to it is a short tunnel underneath.\n\nThe nest is also a clever shelter from the harsh weather. Desert days are very hot, but winter nights can be freezing. The thick walls of grass keep the chambers cool during the day and warm at night.\n\nSome of these nests are used for more than a hundred years. The birds keep repairing them and adding fresh grass, so they slowly grow bigger and bigger.","qs":[{"type":"mc","q":"Why might someone think the nest is a haystack?","opts":["It is a huge pile of grass.","It is on the ground.","It is full of farm animals.","It is very small and yellow."],"a":0},{"type":"tfng","q":"Sociable weavers usually build their nests alone.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Each pair of birds has a room of its own inside the nest.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Other kinds of birds sometimes live in these nests too.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"How do the thick walls of grass help the birds?","opts":["They keep the chambers cool by day and warm at night.","They hide the birds from people.","They give the birds food in winter.","They make the nest lighter."],"a":0}]}],"extra":[{"kind":"collocation","q":"Birds ___ a nest in spring.","opts":["build","do","take","put"],"a":0,"why":"We say 'build a nest' (or 'make a nest'). We never 'do' or 'take' a nest."},{"kind":"preposition","q":"Many animals depend ___ their homes to stay safe.","opts":["on","of","at","with"],"a":0,"why":"'Depend on' is a fixed pair: the verb 'depend' is followed by 'on'."},{"kind":"wordform","q":"Thick fur gives the animal ___ from the cold. (protect)","opts":["protection","protect","protective","protected"],"a":0,"why":"After 'gives the animal' we need a noun (a thing it gets): protection."},{"kind":"phrasal","q":"Both parents ___ the eggs until the chicks hatch.","opts":["look after","look up","look forward","look out"],"a":0,"why":"'Look after' means take care of someone or something."},{"kind":"linking","q":"Hedgehogs hibernate in winter ___ there are very few insects for them to eat.","opts":["because","although","so","unless"],"a":0,"why":"'Because' gives the reason: why do hedgehogs hibernate? There is not enough food for them."},{"kind":"paraphrase","q":"Which sentence means the same as 'Many swallows return to the same nest every spring'?","opts":["Every spring, many swallows come back to their old nest.","Many swallows build a new nest every spring.","Many swallows leave their nest in spring.","Swallows only use a nest once."],"a":0,"why":"'Return to' means 'come back to', and 'the same nest' is their old nest."}]},{"id":"explorer-2","title":"Great inventions","emoji":"💡","words":[{"w":"invent","def":"to make or design something that has never existed before","ex":"Do you think someone will ever ___ a car that can fly?","pos":"verb","forms":{"noun":"invention","verb":"invent","adj":"inventive"}},{"w":"engineer","def":"a person who plans and builds machines, roads or bridges","ex":"The ___ checked every part of the bridge before it opened.","pos":"noun","pic":"👷"},{"w":"device","def":"a small machine or tool made for a special job","ex":"A smartwatch is a tiny ___ that you wear on your wrist.","pos":"noun","pic":"⌚","syn":["gadget","tool"]},{"w":"electricity","def":"a kind of energy that gives power to lights and machines","ex":"Before ___, people used candles and oil lamps to light their homes.","pos":"noun","pic":"⚡"},{"w":"engine","def":"the part of a car, train or plane that makes it move","ex":"The car's ___ was so quiet that I couldn't hear it.","pos":"noun"},{"w":"battery","def":"a small object that stores power for things like torches and phones","ex":"My torch stopped working because the ___ was flat.","pos":"noun","pic":"🔋"},{"w":"microscope","def":"a tool that makes very small things look much bigger","ex":"Under the ___, a drop of pond water was full of tiny living things.","pos":"noun","pic":"🔬"},{"w":"design","def":"to plan and draw how something will look and work","ex":"Engineers ___ new cars on computers before they build them.","pos":"verb","pic":"📐"},{"w":"improve","def":"to make something better","ex":"Scientists keep trying to ___ batteries so that they last longer.","pos":"verb","forms":{"noun":"improvement","verb":"improve"}},{"w":"replace","def":"to take the place of something, or to put something new in its place","ex":"Will robots ___ waiters in restaurants one day?","pos":"verb","forms":{"noun":"replacement","verb":"replace"}},{"w":"experiment","def":"a test that scientists do to find out or prove something","ex":"Every failed ___ taught the inventor something new.","pos":"noun","pic":"🧪","syn":["test"]},{"w":"practical","def":"useful and sensible for real life","ex":"Rubber boots are a ___ choice for a muddy walk.","pos":"adj","syn":["useful"],"ant":["impractical"]},{"w":"material","def":"what something is made from, such as wood, metal, glass or plastic","ex":"Plastic is a cheap ___ that can be made into almost any shape.","pos":"noun"},{"w":"steam","def":"the hot gas that water turns into when it boils","ex":"In the 1800s, many trains and ships were powered by ___.","pos":"noun","pic":"🚂"},{"w":"wire","def":"a long, thin piece of metal that electricity can travel along","ex":"The bulb is joined to the battery by a thin copper ___.","pos":"noun"},{"w":"operate","def":"to make a machine work, or to control it","ex":"Only trained workers are allowed to ___ this huge machine.","pos":"verb"},{"w":"convenient","def":"useful and easy for you, because it saves time or fits your plans","ex":"The new bus stop is very ___ for us because it is right outside our house.","pos":"adj","ant":["inconvenient"],"forms":{"noun":"convenience","adj":"convenient"}},{"w":"genius","def":"a person who is extremely clever or skilful","ex":"Leonardo da Vinci was a ___ who drew plans for flying machines.","pos":"noun"},{"w":"attempt","def":"a try at doing something, especially something difficult","ex":"His first ___ to build a robot ended in a pile of broken parts.","pos":"noun","syn":["try"]},{"w":"accurate","def":"correct and exact, with no mistakes","ex":"Atomic clocks are so ___ that they lose less than a second in millions of years.","pos":"adj","ant":["inaccurate"],"forms":{"noun":"accuracy","adj":"accurate","adv":"accurately"}}],"grammar":[{"q":"The telephone ___ by Alexander Graham Bell in 1876.","opts":["was invented","invented","is invented","has invented"],"a":0,"why":"The telephone didn't invent anything; Bell invented it. Use the past passive: was + invented."},{"q":"People ___ wash their clothes by hand before washing machines were invented.","opts":["used to","use to","were used","using to"],"a":0,"why":"'Used to' + verb talks about a past habit that is not true now."},{"q":"My sister enjoys ___ robots out of old boxes.","opts":["building","to build","build","built"],"a":0,"why":"After 'enjoy', use the -ing form of the verb."},{"q":"The inventor decided ___ a smaller, cheaper machine.","opts":["to make","making","make","made"],"a":0,"why":"After 'decide', use 'to' + verb."},{"q":"Smartphones ___ the way we live since they first appeared.","opts":["have changed","changed","change","are changing"],"a":0,"why":"With 'since', use the present perfect: the change started in the past and is still true now."},{"q":"Have you ever ___ a 3D printer?","opts":["used","use","using","uses"],"a":0,"why":"The present perfect is have + past participle: have you ever used...?"},{"q":"'This machine doesn't work,' said the engineer. The engineer said that the machine ___ work.","opts":["didn't","don't","wasn't","not"],"a":0,"why":"In reported speech, the present (doesn't) usually moves one step back to the past (didn't)."},{"q":"Thomas Edison kept ___ until his light bulb worked.","opts":["trying","to try","try","tried"],"a":0,"why":"After 'keep' (meaning continue), use the -ing form: kept trying."},{"q":"In the 1940s, the first computers ___ as big as a room.","opts":["were","have been","are","has been"],"a":0,"why":"'In the 1940s' is a finished time in the past, so use the past simple: were."},{"q":"If I ___ a time machine, I would travel back to see the dinosaurs.","opts":["had","have","will have","would have"],"a":0,"why":"This is imaginary (second conditional), so use the past simple after 'if' (had), then would + verb."}],"sentences":["Velcro was invented by a Swiss engineer.","My grandparents used to write letters to each other.","He decided to build a machine that cleans windows.","Have you ever used a microscope at school?","The first trains were pulled by steam engines.","The engineer said that the machine didn't work."],"reading":[{"title":"Happy accidents","text":"Some of the world's most useful inventions were not planned at all.\n\nIn 1941, a Swiss engineer called George de Mestral went for a walk in the mountains with his dog. When they got home, both of them were covered in tiny seeds from a plant. He looked at the seeds under a microscope and saw hundreds of little hooks. These hooks caught on the loops in cloth and fur. De Mestral decided to copy the idea. After years of experiments, he invented Velcro, which is now used on shoes, bags and even space suits.\n\nA few years later, an American engineer called Percy Spencer was working with a machine that made radio waves. He noticed that a chocolate bar in his pocket had melted. Next, he tried some popcorn, and it popped! This led to the first microwave oven. It was nearly as tall as a person, so it was not very practical for a kitchen.\n\nBoth inventors noticed something small and asked, 'Why did that happen?'","qs":[{"type":"mc","q":"What did de Mestral see under the microscope?","opts":["tiny hooks on the seeds","loops in his dog's fur","holes in his trousers","insects on the seeds"],"a":0},{"type":"tfng","q":"De Mestral invented Velcro soon after his walk.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Velcro is more popular today than buttons.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"The first microwave oven was too big to be useful in most homes.","opts":["True","False","Not Given"],"a":0},{"type":"mc","q":"What is the main idea of the text?","opts":["Some great inventions began with a lucky surprise.","Engineers should always work in the mountains.","Velcro is better than the microwave oven.","Most inventions take only a few days to make."],"a":0}]},{"title":"How the bicycle grew up","text":"The first bicycle did not have any pedals. In 1817, a German inventor called Karl Drais built a wooden 'running machine'. Riders sat on it and pushed themselves along the road with their feet.\n\nIn the 1860s, pedals were added to the front wheel. Makers soon realised that a bigger front wheel carried the bike further with each turn of the pedals. This led to the penny-farthing, which had a huge front wheel and a tiny back one. It was fast, but the seat was so high that riders often fell off.\n\nThe 'safety bicycle' of the 1880s solved this problem. Its two wheels were almost the same size, and a chain joined the pedals to the back wheel, just like on a bike today. A few years later, air-filled rubber tyres made riding much more comfortable.\n\nSince then, bikes have been improved again and again, but the basic design has hardly changed in more than a hundred years.","qs":[{"type":"tfng","q":"The first bicycle had pedals on its front wheel.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Karl Drais's running machine was made of wood.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"The penny-farthing cost more than the safety bicycle.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"Why did the penny-farthing have such a big front wheel?","opts":["It made the bike go further with each turn of the pedals.","It helped riders to see over walls.","It made the seat more comfortable.","It made the bike easier to get on."],"a":0},{"type":"mc","q":"What does the writer say about bikes today?","opts":["Their basic design is very like the safety bicycle's.","They have a huge front wheel.","Riders push them along with their feet.","They are still made of wood."],"a":0}]}],"extra":[{"kind":"collocation","q":"Inventors often ___ mistakes before they get things right.","opts":["make","do","take","have"],"a":0,"why":"We say 'make a mistake', not 'do a mistake'."},{"kind":"linking","q":"The first microwave oven was very big, ___ it was not practical for homes.","opts":["so","because","but","although"],"a":0,"why":"'So' shows a result: the oven was big, and the result was that it didn't suit homes."},{"kind":"wordform","q":"The telephone was an amazing ___. (invent)","opts":["invention","inventor","invented","inventive"],"a":0,"why":"We need a noun for a thing: invention. An 'inventor' is a person."},{"kind":"phrasal","q":"When the machine broke, the engineer tried to ___ what was wrong.","opts":["find out","give up","take off","turn down"],"a":0,"why":"'Find out' means discover a fact or learn something new."},{"kind":"preposition","q":"Rubber is used ___ making tyres and boots.","opts":["for","of","at","on"],"a":0,"why":"'Used for' + -ing tells us what job something does: rubber is used for making tyres."},{"kind":"paraphrase","q":"Which sentence means the same as 'The microwave oven was invented by accident'?","opts":["Nobody planned to invent the microwave oven.","The microwave oven caused an accident.","The microwave oven was invented on purpose.","The microwave oven was invented by a doctor."],"a":0,"why":"'By accident' means without planning it, so nobody planned the invention."}]},{"id":"explorer-3","title":"Healthy habits","emoji":"🥦","words":[{"w":"diet","def":"the kind of food that you usually eat","ex":"A healthy ___ includes plenty of fruit and vegetables.","pos":"noun","pic":"🥗"},{"w":"balanced","def":"with the right amount of each different thing","ex":"A ___ lunch has a bit of everything: bread, cheese, salad and fruit.","pos":"adj","pic":"⚖️"},{"w":"vitamin","def":"something in food that your body needs in small amounts to stay healthy","ex":"Oranges and kiwis are full of ___ C.","pos":"noun","pic":"🍊"},{"w":"fit","def":"healthy and strong, especially because of exercise","ex":"My aunt cycles to work every day to stay ___.","pos":"adj","pic":"🚴","syn":["healthy"],"ant":["unfit"]},{"w":"muscle","def":"a part of the body that tightens and loosens to make you move","ex":"Your heart is a ___ that works all day and all night.","pos":"noun","pic":"💪"},{"w":"habit","def":"something you do often, almost without thinking","ex":"Brushing your teeth twice a day is a good ___.","pos":"noun","pic":"🪥"},{"w":"avoid","def":"to stay away from something, or to try not to do it","ex":"Try to ___ sugary drinks between meals.","pos":"verb"},{"w":"breathe","def":"to take air into your body and let it out again","ex":"During a race, runners ___ faster and more deeply.","pos":"verb","pic":"🌬️","forms":{"noun":"breath","verb":"breathe"}},{"w":"relax","def":"to rest and become calm","ex":"Reading a good book helps me ___ before bed.","pos":"verb","pic":"🛀","syn":["rest"],"forms":{"noun":"relaxation","verb":"relax","adj":"relaxed"}},{"w":"stressed","def":"worried and tense because of problems or too much work","ex":"I felt ___ before the test, so I took some slow, deep breaths.","pos":"adj","ant":["calm"]},{"w":"skip","def":"to not do something that you usually do","ex":"It's not a good idea to ___ breakfast before a busy day at school.","pos":"verb","syn":["miss"]},{"w":"routine","def":"the usual things you do each day, in the same order","ex":"My bedtime ___ is a bath, a story and then lights out.","pos":"noun"},{"w":"lifestyle","def":"the way a person lives, for example what they eat and how active they are","ex":"Walking to school every day is part of a healthy ___.","pos":"noun"},{"w":"benefit","def":"a good or helpful result that you get from something","ex":"One ___ of cycling to school is that you get fresh air and exercise.","pos":"noun","syn":["advantage"],"ant":["disadvantage"],"forms":{"noun":"benefit","adj":"beneficial"}},{"w":"harmful","def":"causing damage or making someone ill","ex":"Strong sunshine can be ___ to your skin, so wear sun cream.","pos":"adj","ant":["harmless"],"forms":{"noun":"harm","adj":"harmful"}},{"w":"portion","def":"the amount of a food that is served to one person at one time","ex":"A small ___ of chips is plenty for one person.","pos":"noun","syn":["serving"]},{"w":"hydrated","def":"having enough water in your body","ex":"On hot days, carry a water bottle so that you stay ___.","pos":"adj","pic":"💧","ant":["dehydrated"]},{"w":"concentrate","def":"to give all your attention to one thing","ex":"It's hard to ___ on your homework when the TV is on.","pos":"verb","syn":["focus"],"forms":{"noun":"concentration","verb":"concentrate"}},{"w":"mood","def":"the way you feel at a particular time, for example happy or cross","ex":"A walk in the sunshine always puts me in a good ___.","pos":"noun","pic":"😊"},{"w":"recover","def":"to become healthy again after you have been ill or hurt","ex":"After a long run, your muscles need time to ___.","pos":"verb","forms":{"noun":"recovery","verb":"recover"}}],"grammar":[{"q":"If you ___ enough sleep, you will feel tired at school.","opts":["don't get","won't get","didn't get","not get"],"a":0,"why":"In the first conditional, use the present simple after 'if' (don't get), and 'will' in the other half."},{"q":"If you drink more water, you ___ better.","opts":["will feel","would felt","felt","feeling"],"a":0,"why":"This is a real possibility in the future: if + present simple, then will + verb."},{"q":"If I ___ a famous chef, I would cook healthy food for every school.","opts":["were","am","will be","would be"],"a":0,"why":"This is imaginary (second conditional), so use a past form after 'if'. 'If I were' is correct."},{"q":"If we walked to school, we ___ fitter.","opts":["would be","will be","are","would been"],"a":0,"why":"Second conditional: if + past simple, then would + verb (would be)."},{"q":"When I was little, I ___ hate vegetables, but now I love them.","opts":["used to","use to","am used to","was use to"],"a":0,"why":"'Used to' + verb is for something that was true in the past but is not true now."},{"q":"Try to avoid ___ too many sweets.","opts":["eating","to eat","eat","ate"],"a":0,"why":"After 'avoid', use the -ing form of the verb."},{"q":"I ___ three glasses of water so far today.","opts":["have drunk","drank","drink","have drank"],"a":0,"why":"'So far today' means up to now, so use the present perfect. The past participle of 'drink' is 'drunk'."},{"q":"I ___ the flu last month, but I'm fine now.","opts":["had","have had","have","am having"],"a":0,"why":"'Last month' is a finished time, so use the past simple: had."},{"q":"___ for half an hour a day is good for your heart.","opts":["Walking","Walk","Walked","To walking"],"a":0,"why":"When an activity is the subject of a sentence, use the -ing form: Walking is good for you."},{"q":"Foods ___ contain a lot of sugar are bad for your teeth.","opts":["that","who","what","where"],"a":0,"why":"Use 'that' (or 'which') to say which things you mean. 'Who' is only for people."}],"sentences":["My little brother used to hate green vegetables.","You should try to avoid sugary drinks.","Which fruit has the most vitamin C?","My doctor told me to drink more water.","Swimming is good for almost every muscle in your body.","It took me a week to recover from the flu."],"reading":[{"title":"Sleep: your secret superpower","text":"Most children aged 6 to 12 need between nine and twelve hours of sleep a night. That sounds like a lot, but your body and brain are very busy while you sleep.\n\nDuring deep sleep, your body grows and repairs your muscles. Your brain is busy too. It sorts out what you have learnt during the day and stores the important parts, a bit like a librarian putting books on the right shelves. This is why a good night's sleep before a test can help you remember more.\n\nIf you don't get enough sleep, you may feel grumpy and find it hard to concentrate.\n\nSo how can you sleep better? Experts suggest going to bed at the same time every night. They also advise switching off phones and tablets an hour before bed, because the light from screens can make it harder to fall asleep. A calm routine, like reading a book or having a warm bath, helps your body relax.","qs":[{"type":"mc","q":"Why does the writer compare the brain to a librarian?","opts":["It puts new information in the right order.","It reads books while you sleep.","It keeps the body quiet at night.","It only works during the day."],"a":0},{"type":"tfng","q":"Your brain stops working while you are asleep.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"The light from screens can make it difficult to get to sleep.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"A warm drink before bed is the best way to fall asleep.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What do experts suggest?","opts":["going to bed at the same time every night","using a tablet in bed","sleeping only at weekends","having a big meal just before bed"],"a":0}]},{"title":"Water: your body's best friend","text":"About 60 per cent of your body is water. It is in your blood, your muscles and even your bones. Every day, you lose some of it when you breathe, sweat and go to the toilet, so you need to replace it.\n\nIf you don't drink enough, you may get a headache, feel tired or find it hard to concentrate. This is why many schools let pupils keep a water bottle on their desks. Experts in the UK suggest drinking six to eight glasses of liquid a day, and more when it is hot or you are doing sport.\n\nYou don't only get water from drinks. Many fruits and vegetables are full of it. A cucumber is about 95 per cent water, and a watermelon is not far behind.\n\nWater is also the best drink for your teeth. Unlike fizzy drinks and many fruit juices, it contains no sugar. Best of all, tap water in the UK is safe to drink and very cheap.","qs":[{"type":"mc","q":"Why do we need to drink water every day?","opts":["Our bodies lose water in several ways.","Water makes our bones grow bigger.","We cannot eat fruit without it.","It stops us from breathing too fast."],"a":0},{"type":"tfng","q":"There is water in your bones.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"You can only get water from drinks.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Most pupils in the UK drink too little water at school.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the text, why is water good for your teeth?","opts":["It has no sugar in it.","It is very cold.","It is cheaper than juice.","It makes your teeth white."],"a":0}]}],"extra":[{"kind":"collocation","q":"It's important to ___ some exercise every day.","opts":["do","make","play","go"],"a":0,"why":"We say 'do exercise' (or 'take exercise'). We 'play' games and sports, and we 'go' swimming or running."},{"kind":"phrasal","q":"My dad is trying to ___ eating sweets after dinner.","opts":["give up","give in","give away","give back"],"a":0,"why":"'Give up' means stop doing something that you did often."},{"kind":"linking","q":"I drink lots of water ___ it helps me to concentrate.","opts":["because","although","but","unless"],"a":0,"why":"'Because' gives the reason: why do I drink lots of water? It helps me concentrate."},{"kind":"idiom","q":"I'm feeling a bit ___ today, so I'm staying at home in bed.","opts":["under the weather","over the moon","on cloud nine","a piece of cake"],"a":0,"why":"'Under the weather' means a little ill. 'Over the moon' and 'on cloud nine' mean very happy."},{"kind":"wordform","q":"Fresh fruit and vegetables are ___ to your health. (benefit)","opts":["beneficial","benefit","benefits","beneficially"],"a":0,"why":"After 'are' we need an adjective. 'Beneficial' means good for you."},{"kind":"preposition","q":"Too much salt is bad ___ your heart.","opts":["for","at","with","on"],"a":0,"why":"We say 'good for' or 'bad for' your health. 'Bad at' is about skills, as in 'bad at maths'."}]},{"id":"explorer-4","title":"Festivals around the world","emoji":"🏮","words":[{"w":"celebrate","def":"to do something special and enjoyable for an important day","ex":"Families get together to ___ the new year.","pos":"verb","pic":"🥳","forms":{"noun":"celebration","verb":"celebrate"}},{"w":"tradition","def":"something people have done in the same way for a very long time","ex":"Eating pancakes on Shrove Tuesday is a British ___.","pos":"noun","pic":"🥞","forms":{"noun":"tradition","adj":"traditional","adv":"traditionally"}},{"w":"costume","def":"special clothes that make you look like a different person, animal or thing","ex":"She wore a dragon ___ in the parade.","pos":"noun"},{"w":"parade","def":"a line of people, bands or vehicles moving through the streets for a special day","ex":"Thousands of people watched the ___ go through the city centre.","pos":"noun"},{"w":"firework","def":"a small object that explodes in the sky with bright colours and loud bangs","ex":"Each ___ lit up the night sky with red and gold.","pos":"noun","pic":"🎆"},{"w":"lantern","def":"a lamp with a cover around it, often made of paper or glass","ex":"Each child carried a paper ___ through the dark streets.","pos":"noun","pic":"🏮"},{"w":"decorate","def":"to make something look nicer by adding pretty things to it","ex":"Let's ___ the classroom with paper flowers.","pos":"verb","forms":{"noun":"decoration","verb":"decorate","adj":"decorative"}},{"w":"crowd","def":"a large group of people in one place","ex":"A huge ___ cheered as the band marched past.","pos":"noun"},{"w":"ancient","def":"very old; from thousands of years ago","ex":"The first Olympic Games were held in ___ Greece.","pos":"adj","pic":"🏛️","ant":["modern"]},{"w":"gather","def":"to come together in one place as a group","ex":"On New Year's Eve, people ___ in the square to watch the clock.","pos":"verb","syn":["meet"]},{"w":"feast","def":"a large, special meal for many people","ex":"After the parade, the whole village shared a ___ of rice, fruit and sweets.","pos":"noun","pic":"🍲"},{"w":"occasion","def":"a special event or time","ex":"A wedding is a happy ___ for the whole family.","pos":"noun","syn":["event"]},{"w":"carnival","def":"a big public party in the streets, with music, dancing and people in costumes","ex":"Our town's summer ___ has floats, steel bands and dancing in the streets.","pos":"noun","pic":"🎭"},{"w":"custom","def":"something that people in a place usually do, often for a very long time","ex":"In Japan, it is a ___ to take off your shoes before you go into someone's home.","pos":"noun","syn":["tradition"]},{"w":"anniversary","def":"the same date each year as the day when something important happened","ex":"My grandparents had a big party for their fiftieth wedding ___.","pos":"noun"},{"w":"symbol","def":"a picture, shape or object that stands for an idea","ex":"In many countries, a white dove is a ___ of peace.","pos":"noun","pic":"🕊️"},{"w":"host","def":"to hold an event and welcome the people who come to it","ex":"Our school will ___ a music festival for five other schools in June.","pos":"verb"},{"w":"annual","def":"happening once every year","ex":"The village holds its ___ flower show in July.","pos":"adj","syn":["yearly"],"forms":{"adj":"annual","adv":"annually"}},{"w":"spectacular","def":"very exciting and impressive to look at","ex":"The fireworks over the harbour at midnight were ___.","pos":"adj","syn":["impressive"]},{"w":"take part","def":"to join in an activity or event with other people","ex":"Everyone in our class will ___ in the school concert.","pos":"phrase","syn":["participate"]}],"grammar":[{"q":"'I am tired,' said Mia. Mia said that she ___ tired.","opts":["was","were","be","been"],"a":0,"why":"In reported speech, the verb usually moves one step back in time: 'am' becomes 'was'."},{"q":"My teacher ___ us that the festival starts at six.","opts":["told","said","spoke","talked"],"a":0,"why":"'Tell' needs a person after it (told us). 'Say' does not (she said that...)."},{"q":"During Diwali, small oil lamps ___ in windows and doorways.","opts":["are lit","lights","are lighting","is lit"],"a":0,"why":"The lamps don't light themselves; people light them. Use the passive: are + lit (plural, because 'lamps')."},{"q":"I ___ to a carnival, but I would love to go to one.","opts":["have never been","have never go","never been","am never going"],"a":0,"why":"For experiences in your life up to now, use the present perfect: have never been."},{"q":"The first Notting Hill Carnival ___ place in the 1960s.","opts":["took","has taken","takes","was taken"],"a":0,"why":"The 1960s is a finished time, so use the past simple: took place."},{"q":"The man ___ leads the parade plays the drums.","opts":["who","which","whose","where"],"a":0,"why":"Use 'who' (or 'that') to give more information about a person."},{"q":"The first Christmas cards ___ in London in 1843.","opts":["were sent","sent","are sent","was sent"],"a":0,"why":"The cards didn't send anything; people sent them. Use the past passive: were + sent (plural, because 'cards')."},{"q":"In Scotland and Ireland, people ___ carve lanterns out of turnips at Halloween.","opts":["used to","were using","use to","are used to"],"a":0,"why":"'Used to' + verb describes a past habit that has changed. Today most people carve pumpkins."},{"q":"We're looking forward to ___ the fireworks tonight.","opts":["watching","watch","to watch","watched"],"a":0,"why":"In 'look forward to', 'to' is a preposition, so it is followed by the -ing form: watching."},{"q":"We have ___ decorated the tree, so now we can relax.","opts":["already","yet","ever","since"],"a":0,"why":"Use 'already' in positive sentences to say something has happened, maybe sooner than expected. 'Yet' is for questions and negatives."}],"sentences":["Thousands of people watched the parade.","My aunt told me that the festival was amazing.","Do you know who decorated the classroom?","We have decorated the house with paper lanterns.","We a

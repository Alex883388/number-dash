lar power are ___ sources of energy.","pos":"adj","pic":"♻️","ant":["non-renewable"]},{"w":"fossil fuel","def":"a fuel such as coal, oil or gas, formed over millions of years from dead plants and animals","ex":"Coal is a ___ that formed from plants millions of years ago.","pos":"noun"},{"w":"emissions","def":"gases that are sent into the air, for example by cars and factories","ex":"The city wants to cut its carbon ___ by half.","pos":"noun","pic":"🏭"},{"w":"carbon footprint","def":"the amount of carbon dioxide that a person's activities add to the air","ex":"Cycling instead of going by car reduces your ___.","pos":"noun","pic":"👣"},{"w":"sustainable","def":"able to continue for a long time without harming the planet","ex":"Bamboo is a ___ material because it grows back very quickly.","pos":"adj","pic":"🎋","forms":{"noun":"sustainability","adj":"sustainable"}},{"w":"consume","def":"to use energy, fuel, food or time","ex":"Old fridges ___ much more electricity than new ones.","pos":"verb","syn":["use"],"forms":{"noun":"consumption","verb":"consume"}},{"w":"efficient","def":"working well without wasting energy, time or money","ex":"LED bulbs are more ___ than old bulbs because they waste less energy as heat.","pos":"adj","pic":"💡","ant":["wasteful"],"forms":{"noun":"efficiency","adj":"efficient","adv":"efficiently"}},{"w":"drought","def":"a long period with little or no rain","ex":"After months of ___, the river was almost dry.","pos":"noun","pic":"🏜️"},{"w":"glacier","def":"a huge mass of ice that moves very slowly down a mountain or valley","ex":"As the planet warms, the ___ is shrinking a little every year.","pos":"noun","pic":"🏔️"},{"w":"generate","def":"to produce energy, such as electricity or heat","ex":"Wind turbines ___ electricity when the wind blows.","pos":"verb","syn":["produce"],"forms":{"noun":"generation","verb":"generate"}},{"w":"global","def":"affecting or including the whole world","ex":"Plastic in the oceans is a ___ problem, not just a local one.","pos":"adj","pic":"🌐","syn":["worldwide"],"ant":["local"]},{"w":"impact","def":"a strong effect that something has on something else","ex":"Cars have a big ___ on the air quality in cities.","pos":"noun","syn":["effect"]}],"grammar":[{"q":"Hundreds of new wind turbines ___ in the North Sea in recent years.","opts":["have been built","have built","were building","has been built"],"a":0,"why":"The turbines didn't build anything, so use the passive. 'In recent years' goes with the present perfect: have been built."},{"q":"Next year, solar panels ___ on the roof of every new house in our town.","opts":["will be installed","will install","are installing","installed"],"a":0,"why":"This is the future passive: will be + past participle. The panels don't install anything themselves."},{"q":"Plastic bottles can ___ into new clothes.","opts":["be recycled","recycle","recycled","be recycling"],"a":0,"why":"After a modal verb like 'can', the passive is be + past participle: can be recycled."},{"q":"If we ___ the lights off last night, we would have saved energy.","opts":["had turned","turned","have turned","would turn"],"a":0,"why":"Third conditional (an imaginary past): if + had + past participle, then would have + past participle."},{"q":"I wish our school ___ solar panels on its roof.","opts":["had","has","will have","is having"],"a":0,"why":"When we wish the present were different, we use a past form after 'wish': I wish it had..."},{"q":"___ the rain, the solar panels still produced some electricity.","opts":["Despite","Although","However","Because"],"a":0,"why":"'Despite' is followed by a noun (the rain). 'Although' needs a full clause, such as 'Although it rained'."}],"sentences":["Wind turbines have been built along the coast of Scotland.","If only the bus ran on electricity.","Have you ever calculated the size of your carbon footprint?","More houses are being fitted with solar panels."],"reading":{"title":"An island powered by the wind","text":"Samsø is a small Danish island with about 4,000 residents. In the 1990s, it depended on oil and on electricity from coal power stations on the mainland. Today, it is famous around the world as an island that produces all of its electricity from renewable sources.\n\nThe change began in 1997, when Samsø won a national competition to become a renewable energy island. However, the plan could not succeed without local support, and at first many islanders were worried. Would wind turbines spoil their beautiful views? Would the project cost too much? Rather than forcing the idea on people, the organisers held meetings in village halls and listened to their concerns.\n\nThe key decision was to let local people own the turbines. Farmers, families and businesses bought shares, so the money from the electricity stayed on the island. As a result, the turbines became something to be proud of rather than something to complain about.\n\nWithin about ten years, Samsø's turbines were generating more electricity than the island needed, and the extra power was sold to the mainland. Many homes are now warmed by local heating stations that burn straw, a waste product from farms.\n\nSamsø shows that the biggest challenge in changing how we use energy is not always the technology. Often, it is persuading people to work together.","qs":[{"type":"mc","q":"What is the writer's main purpose?","opts":["to show how a community worked together to change its energy","to explain how a wind turbine works","to persuade readers to move to Samsø","to compare the costs of oil and coal"],"a":0},{"type":"tfng","q":"Everyone on Samsø supported the project from the very beginning.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Islanders themselves own some of the wind turbines.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Electricity on Samsø is now cheaper than anywhere else in Denmark.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What is used to heat many homes on Samsø today?","opts":["straw from farms","oil from the mainland","coal","electricity from the mainland"],"a":0}]},"extra":[{"kind":"collocation","q":"Everyone can ___ a difference by using less energy at home.","opts":["make","do","take","give"],"a":0,"why":"'Make a difference' is a fixed phrase that means to have a good effect."},{"kind":"wordform","q":"The country's energy ___ fell last year. (consume)","opts":["consumption","consumer","consuming","consumed"],"a":0,"why":"We need a noun for the amount used: consumption. A 'consumer' is a person who buys or uses things."},{"kind":"linking","q":"Solar power is clean and cheap. ___, solar panels produce no electricity at night.","opts":["However","Therefore","For example","In addition"],"a":0,"why":"'However' introduces a contrast: first a good point, then a problem."},{"kind":"register","q":"Which sentence is the most suitable for an academic essay?","opts":["Burning fossil fuels significantly increases carbon emissions.","Burning coal and stuff is really bad for the air.","Loads of carbon gets pumped out when we burn things.","Fossil fuels? Seriously bad news for the planet!"],"a":0,"why":"Academic writing uses precise words (significantly, emissions) and avoids chatty phrases like 'and stuff' or 'loads of'."},{"kind":"paraphrase","q":"Which sentence means the same as 'Electricity from the sun is getting cheaper'?","opts":["The cost of solar power is falling.","Solar power is becoming more expensive.","The sun produces less electricity than before.","Most cheap electricity comes from the sun."],"a":0,"why":"'Electricity from the sun' is solar power, and 'getting cheaper' means the cost is falling."},{"kind":"cohesion","q":"Which sentence best continues the text? 'Many countries are building wind farms out at sea. ___'","opts":["This is because winds are usually stronger and steadier over the ocean.","However, wind is a type of weather.","For example, sea water is very salty.","As a result, people enjoy swimming in summer."],"a":0,"why":"'This is because' gives the reason for the idea in the sentence before it."}]},{"id":"achiever-2","title":"How we communicate","emoji":"💬","words":[{"w":"gesture","def":"a movement of your hand, head or face that shows a meaning","ex":"Waving goodbye is a ___ that people understand in many countries.","pos":"noun","pic":"👋"},{"w":"body language","def":"the way your face, hands and position show how you feel","ex":"His ___ showed he was nervous: he kept looking at the floor.","pos":"noun","pic":"🙆"},{"w":"fluent","def":"able to speak a language easily and well","ex":"After five years in Spain, my cousin became ___ in Spanish.","pos":"adj","forms":{"noun":"fluency","adj":"fluent","adv":"fluently"}},{"w":"misunderstand","def":"to understand something in the wrong way","ex":"Short text messages are easy to ___ because you cannot hear the tone of voice.","pos":"verb","forms":{"noun":"misunderstanding","verb":"misunderstand"}},{"w":"persuade","def":"to make someone agree to do something by giving good reasons","ex":"I tried to ___ my parents to let me have a pet rabbit.","pos":"verb","syn":["convince"],"forms":{"noun":"persuasion","verb":"persuade","adj":"persuasive"}},{"w":"express","def":"to show a feeling or an idea in words, pictures or actions","ex":"Some children find it easier to ___ their feelings through drawing.","pos":"verb","pic":"🎨","forms":{"noun":"expression","verb":"express"}},{"w":"signal","def":"a sound, light, movement or radio wave that carries a message","ex":"Up in the mountains, my phone had no ___, so I couldn't call home.","pos":"noun","pic":"📶"},{"w":"interrupt","def":"to stop someone while they are speaking by saying something yourself","ex":"It's rude to ___ someone when they are in the middle of a story.","pos":"verb","forms":{"noun":"interruption","verb":"interrupt"}},{"w":"accent","def":"the way people from a particular place pronounce words","ex":"My cousin from Glasgow has a strong Scottish ___.","pos":"noun"},{"w":"translate","def":"to change words from one language into another","ex":"Can you ___ this menu from French into English?","pos":"verb","forms":{"noun":"translation","verb":"translate"}},{"w":"audience","def":"the people who watch or listen to a show, film or talk","ex":"The ___ clapped loudly at the end of her speech.","pos":"noun","pic":"👏"},{"w":"eye contact","def":"looking straight into someone's eyes while you talk to them","ex":"Good speakers make ___ with the people who are listening.","pos":"noun","pic":"👀"}],"grammar":[{"q":"She asked me where ___.","opts":["I lived","did I live","do I live","I do live"],"a":0,"why":"In a reported question, use normal sentence order (I lived), not question order (did I live)."},{"q":"Tom asked ___ I could speak French.","opts":["if","that","what","do"],"a":0,"why":"To report a yes/no question, use 'if' (or 'whether')."},{"q":"The teacher told us ___ our phones off during the talk.","opts":["to turn","turn","turning","that turn"],"a":0,"why":"To report an order, use tell + person + to + verb: told us to turn."},{"q":"My friend ___ me to practise speaking English every day.","opts":["advised","suggested","said","explained"],"a":0,"why":"'Advise' can be followed by a person + to + verb. We can't say 'suggested me to', 'said me to' or 'explained me to'."},{"q":"Samuel Morse, ___ gave his name to Morse code, was also a painter.","opts":["who","that","which","whose"],"a":0,"why":"For a person in a non-defining clause (between commas), use 'who'. 'That' can't be used after a comma like this."},{"q":"The first text message ___ in 1992.","opts":["was sent","has been sent","sent","is sent"],"a":0,"why":"1992 is a finished time in the past, so use the past simple passive: was sent."}],"sentences":["She asked me whether I had ever been to Japan.","The teacher told us not to interrupt each other.","My message, which I sent to the wrong person, was very embarrassing.","Do you know how many languages are spoken in India?"],"reading":{"title":"The island where people whistle","text":"On La Gomera, one of Spain's Canary Islands, some people can hold a conversation without saying a single word. Instead, they whistle. Their language, Silbo Gomero, turns Spanish into whistled sounds that rise and fall in pitch.\n\nThe island is covered with deep valleys and steep hills, so walking from one farm to the next could take hours. A loud whistle, however, can cross a valley in seconds and be heard several kilometres away. For centuries, shepherds and farmers used Silbo to send messages, warn their neighbours and arrange to meet.\n\nIn the twentieth century, roads and telephones arrived, and fewer young people learnt to whistle. The language might have disappeared completely if the island had not decided to protect it. In 1999, Silbo became a compulsory subject in local schools, and today children on the island learn it in class. In 2009, UNESCO recognised it as an important part of the world's cultural heritage.\n\nScientists find Silbo fascinating, too. Studies have shown that skilled whistlers use the same parts of the brain that normally deal with speech. This suggests that the brain treats whistling as a real language, not just as music.","qs":[{"type":"mc","q":"What is the text mainly about?","opts":["a whistled language and how it was saved","how to learn Spanish quickly","the history of the telephone","why farmers live in valleys"],"a":0},{"type":"tfng","q":"Silbo Gomero is based on the Spanish language.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Children on La Gomera can choose whether or not to learn Silbo at school.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"It takes most people about a year to learn Silbo well.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What did the brain studies suggest?","opts":["The brain treats Silbo like a real language.","Whistling is just a kind of music.","Whistlers have bigger brains than other people.","Silbo is harder to learn than Spanish."],"a":0}]},"extra":[{"kind":"idiom","q":"The party was meant to be a surprise, but my little brother ___.","opts":["let the cat out of the bag","broke the ice","hit the nail on the head","was over the moon"],"a":0,"why":"'Let the cat out of the bag' means tell a secret by mistake."},{"kind":"phrasal","q":"The line was so bad that I couldn't ___ what she was saying.","opts":["make out","make up","break down","put up"],"a":0,"why":"'Make out' means manage to hear, see or understand something with difficulty."},{"kind":"register","q":"Which is the most polite way to ask a teacher for help?","opts":["Could you possibly explain this again, please?","Explain this again.","What? Say that again.","You need to explain this again."],"a":0,"why":"'Could you possibly... please?' is polite and indirect. The others sound like orders or are rude."},{"kind":"collocation","q":"Our head teacher ___ a speech at the end-of-year assembly.","opts":["gave","did","said","told"],"a":0,"why":"We 'give a speech' (or 'make a speech'). We don't 'do', 'say' or 'tell' a speech."},{"kind":"wordform","q":"Her ___ in three languages helped her to get the job. (fluent)","opts":["fluency","fluent","fluently","fluented"],"a":0,"why":"After 'Her' we need a noun: fluency."},{"kind":"cohesion","q":"Which sentence best continues the text? 'Humans are not the only animals that communicate with sound. ___'","opts":["Whales, for example, make sounds that can travel hundreds of kilometres underwater.","However, whales are mammals.","In contrast, many people enjoy music.","Therefore, sound is very loud."],"a":0,"why":"'For example' introduces an example that supports the sentence before it."}]},{"id":"achiever-3","title":"Science and discovery","emoji":"🔬","words":[{"w":"hypothesis","def":"an idea that scientists test to find out whether it is true","ex":"Her ___ was that plants grow faster with music, so she tested it.","pos":"noun"},{"w":"evidence","def":"facts or signs that show that something is true","ex":"Fossils give us ___ that dinosaurs once lived here.","pos":"noun","pic":"🦴","syn":["proof"]},{"w":"breakthrough","def":"an important discovery that solves a problem or opens a new way forward","ex":"The first vaccine was a major ___ in medicine.","pos":"noun","pic":"💉"},{"w":"analyse","def":"to study something in detail to understand or explain it","ex":"Back at the lab, the scientists will ___ the rock samples.","pos":"verb","forms":{"noun":"analysis","verb":"analyse"}},{"w":"laboratory","def":"a room or building where scientists do experiments","ex":"The ___ was full of test tubes and microscopes.","pos":"noun","pic":"🧪"},{"w":"accidentally","def":"by chance, without planning to","ex":"Fleming ___ discovered penicillin when mould grew on one of his dishes.","pos":"adv","ant":["deliberately"],"forms":{"noun":"accident","adj":"accidental","adv":"accidentally"}},{"w":"observe","def":"to watch something carefully to learn about it","ex":"Galileo used a telescope to ___ the moons of Jupiter.","pos":"verb","pic":"🔭","syn":["watch"],"forms":{"noun":"observation","verb":"observe"}},{"w":"theory","def":"an idea or set of ideas that explains why something happens","ex":"Darwin's ___ of evolution changed how we understand living things.","pos":"noun"},{"w":"species","def":"a group of animals or plants of the same type","ex":"Scientists discover thousands of new ___ of insects every year.","pos":"noun","pic":"🐞"},{"w":"conclusion","def":"what you decide is true after looking at all the facts","ex":"After the experiment, we wrote our ___ at the bottom of the page.","pos":"noun","forms":{"noun":"conclusion","verb":"conclude"}},{"w":"investigate","def":"to try to find out all the facts about something","ex":"The team will ___ how dolphins use sounds to find food.","pos":"verb","pic":"🐬","forms":{"noun":"investigation","verb":"investigate"}},{"w":"curious","def":"wanting to know or learn about something","ex":"Young children are naturally ___ and ask lots of questions.","pos":"adj","pic":"🤔","forms":{"noun":"curiosity","adj":"curious","adv":"curiously"}}],"grammar":[{"q":"If Fleming had cleaned his dishes before his holiday, he ___ penicillin.","opts":["might not have discovered","might not discover","would not discover","had not discovered"],"a":0,"why":"In the third conditional, the result uses would/might + have + past participle."},{"q":"These footprints are 70 million years old. The dinosaur that made them ___ very heavy.","opts":["must have been","should have been","can have been","must be"],"a":0,"why":"'Must have been' shows we are sure about something in the past because of the evidence."},{"q":"You ___ your results before you wrote your conclusion. Now it is full of mistakes.","opts":["should have checked","must have checked","should check","might checked"],"a":0,"why":"'Should have' + past participle means it was a good idea, but you didn't do it."},{"q":"Penicillin, ___ was discovered in 1928, has saved millions of lives.","opts":["which","that","who","what"],"a":0,"why":"Use 'which' for a thing in a non-defining clause (between commas). 'That' is not used after a comma."},{"q":"Marie Curie, ___ work on radioactivity earned her two Nobel Prizes, was born in Poland.","opts":["whose","who","which","that"],"a":0,"why":"'Whose' shows that something belongs to someone: her work."},{"q":"The rock samples ___ in the laboratory at the moment.","opts":["are being tested","are testing","are tested","have tested"],"a":0,"why":"Someone is testing the samples right now, so use the present continuous passive: are being tested."}],"sentences":["Scientists must have made a mistake in their calculations.","The results of the experiment have been checked by three scientists.","Do you know who discovered the four largest moons of Jupiter?","I should have asked my teacher for help."],"reading":{"title":"The mould that changed medicine","text":"In September 1928, the Scottish scientist Alexander Fleming returned to his laboratory in London after a summer holiday. Before leaving, he had stacked several dishes of bacteria on a bench. When he examined them, he noticed something unusual. A blue-green mould had grown on one dish, and around it there was a clear ring where the bacteria had been killed.\n\nFleming was curious rather than annoyed. He grew more of the mould and found that it produced a substance that could destroy many harmful bacteria. He named it penicillin. However, he struggled to produce it in large amounts, and for about ten years his discovery received little attention.\n\nThe breakthrough came at the University of Oxford, where a team led by Howard Florey and Ernst Chain found a way to purify penicillin. In 1941, they tested it on patients, and the results were remarkable. By the mid-1940s, penicillin was being produced in huge quantities, and in 1945 Fleming, Florey and Chain shared the Nobel Prize.\n\nFleming's story is often told as a lucky accident, and luck certainly played a part. But the mould only mattered because a scientist was paying attention. Many people might have thrown the dish away without a second thought.","qs":[{"type":"mc","q":"What is the main point of the last paragraph?","opts":["Luck alone does not explain the discovery.","Fleming was the luckiest scientist in history.","Scientists should never throw dishes away.","The Oxford team deserved more credit than Fleming."],"a":0},{"type":"tfng","q":"Fleming noticed the mould while he was on holiday.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Fleming found it difficult to make large quantities of penicillin.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Florey and Chain had worked with Fleming before 1928.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What did the Oxford team achieve?","opts":["They found a way to purify penicillin.","They discovered the blue-green mould.","They won the Nobel Prize without Fleming.","They proved that the mould was harmful."],"a":0}]},"extra":[{"kind":"collocation","q":"Before the trip, the class ___ some research on the island's birds.","opts":["did","made","took","had"],"a":0,"why":"We say 'do research' (or 'carry out research'), not 'make research'."},{"kind":"wordform","q":"Her careful ___ of the data showed a clear pattern. (analyse)","opts":["analysis","analyse","analytical","analysed"],"a":0,"why":"After 'Her careful' we need a noun: analysis."},{"kind":"paraphrase","q":"Which sentence means the same as 'The results were not what the team had expected'?","opts":["The team was surprised by the results.","The team knew what the results would be.","The experiment had no results.","The team did not carry out the experiment."],"a":0,"why":"If the results were not what they expected, the results surprised them."},{"kind":"linking","q":"Some scientists work in laboratories, ___ others spend most of their time outdoors.","opts":["whereas","despite","because of","so that"],"a":0,"why":"'Whereas' compares two different facts or groups of people."},{"kind":"preposition","q":"Marie Curie is famous ___ her research on radioactivity.","opts":["for","of","with","about"],"a":0,"why":"We say 'famous for' something."},{"kind":"mainidea","q":"Read the paragraph: 'Many great discoveries began with a simple question. Isaac Newton is said to have wondered why apples fall straight down. Charles Darwin asked why birds on different islands had different beaks. Their curiosity led to ideas that changed science.' Which heading fits best?","opts":["Curiosity drives discovery","The life of Isaac Newton","Birds of faraway islands","Why apples fall from trees"],"a":0,"why":"The paragraph uses two examples to make one point: asking questions leads to discoveries."}]},{"id":"achiever-4","title":"Cities of the future","emoji":"🏙️","words":[{"w":"urban","def":"connected with towns and cities","ex":"More than half of the world's people now live in ___ areas.","pos":"adj","pic":"🌆","ant":["rural"]},{"w":"affordable","def":"cheap enough for most people to pay for","ex":"Young families need ___ homes near good schools.","pos":"adj","ant":["expensive"],"forms":{"verb":"afford","adj":"affordable"}},{"w":"infrastructure","def":"the basic systems a place needs, such as roads, railways, water pipes and power lines","ex":"The town needs better ___ before thousands of new homes are built.","pos":"noun","pic":"🌉"},{"w":"congestion","def":"a situation in which there is too much traffic on the roads","ex":"Road ___ is worst in the morning, when everyone drives to work.","pos":"noun","pic":"🚗"},{"w":"pedestrian","def":"a person who is walking in the street, not driving or riding","ex":"The square is closed to cars, so every ___ can walk safely.","pos":"noun","pic":"🚶"},{"w":"commute","def":"to travel regularly between your home and your work or school","ex":"My mum has to ___ for an hour to get to her office.","pos":"verb","pic":"🚆","forms":{"noun":"commuter","verb":"commute"}},{"w":"skyscraper","def":"a very tall building in a city","ex":"From the top of the ___, the cars below looked like toys.","pos":"noun","pic":"🏢"},{"w":"resident","def":"a person who lives in a particular place","ex":"Every ___ of our street was invited to the meeting about the new park.","pos":"noun","pic":"🏘️"},{"w":"vertical","def":"going straight up, not across","ex":"A ___ farm grows vegetables on many floors inside a building.","pos":"adj","ant":["horizontal"]},{"w":"overcrowded","def":"with too many people in one place","ex":"The train was so ___ that we had to stand all the way.","pos":"adj","syn":["packed"]},{"w":"driverless","def":"able to move without a person controlling it","ex":"In some cities, ___ trains already carry passengers.","pos":"adj","pic":"🚝"},{"w":"green space","def":"an area of grass, trees or plants in a town, such as a park","ex":"The new estate has plenty of ___ where children can play.","pos":"noun","pic":"🌳"}],"grammar":[{"q":"We're ___ solar panels fitted on our roof next week.","opts":["having","making","letting","doing"],"a":0,"why":"'Have something done' means another person does the job for you: we're having panels fitted."},{"q":"The city council had the old bridge ___ last year.","opts":["repaired","repair","repairing","to repair"],"a":0,"why":"In 'have something done', the verb is a past participle: had the bridge repaired."},{"q":"In the future, many cars ___ by computers instead of people.","opts":["will be driven","will drive","are driving","drove"],"a":0,"why":"Computers will do the driving, so use the future passive: will be + past participle (will be driven)."},{"q":"I wish there ___ less traffic outside my school.","opts":["were","is","will be","has been"],"a":0,"why":"After 'wish' about the present, use a past form: I wish there were."},{"q":"If only they ___ more parks when they built the city!","opts":["had planned","plan","will plan","have planned"],"a":0,"why":"For a regret about the past, use 'if only' + had + past participle."},{"q":"___ the city is very crowded, it has lots of green spaces.","opts":["Although","Despite","However","Because of"],"a":0,"why":"'Although' is followed by a full clause (the city is crowded). 'Despite' and 'because of' need a noun."}],"sentences":["We had our bikes checked at the shop.","Vegetables can be grown on the roofs of buildings.","I wish more people would cycle to work.","Do you think driverless cars will make our roads safer?"],"reading":{"title":"A city in a garden","text":"Imagine a city where giant metal trees light up at night and tall buildings are covered in plants. This is not science fiction: it is Singapore, one of the most crowded places on Earth.\n\nSingapore is a small island with millions of residents, so there is very little room to spread out. Instead of losing its nature, however, the city decided to grow upwards. Many skyscrapers now have gardens on their roofs or plants climbing up their walls. These green walls do more than look attractive. They help to keep the buildings cool, which means less electricity is needed for air conditioning.\n\nThe most famous example is Gardens by the Bay, which opened in 2012. Its 18 'Supertrees' are between 25 and 50 metres tall and are covered in thousands of living plants. Some of them have solar panels on top, and they also collect rainwater for the gardens. In the evening, visitors can walk along a high bridge between some of the trees and enjoy a show of light and music.\n\nPlanners in other countries are studying Singapore's ideas carefully. Although every city is different, many of them face the same problem: how to make room for more people without losing the green spaces that keep residents healthy and happy.","qs":[{"type":"mc","q":"What is the main idea of the text?","opts":["Singapore has found ways to keep nature in a crowded city.","Singapore has the tallest trees in the world.","Skyscrapers are bad for the environment.","Solar panels work best on trees."],"a":0},{"type":"tfng","q":"Singapore has plenty of empty land for new buildings.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Plants on buildings can reduce the need for air conditioning.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Most visitors to Gardens by the Bay come from other countries.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What do some of the Supertrees collect?","opts":["rainwater","rubbish","seeds","heat from the sea"],"a":0}]},"extra":[{"kind":"collocation","q":"The roads are busiest during ___ hour, when people travel to and from work.","opts":["rush","fast","hurry","quick"],"a":0,"why":"'Rush hour' is the fixed phrase for the busy time when people travel to and from work."},{"kind":"linking","q":"Big cities offer many jobs. ___, housing there is often very expensive.","opts":["However","Therefore","Moreover","For instance"],"a":0,"why":"'However' introduces a contrast: a good point followed by a problem."},{"kind":"wordform","q":"Thousands of ___ travel into London by train every morning. (commute)","opts":["commuters","commute","commuting","commuted"],"a":0,"why":"After 'Thousands of' we need a plural noun for people: commuters."},{"kind":"register","q":"Which sentence is the most suitable for a report to the city council?","opts":["Traffic congestion in the city centre has increased considerably.","The traffic in town is totally crazy these days.","There are way too many cars around now.","Honestly, driving in town is a nightmare!"],"a":0,"why":"A formal report uses precise words like 'congestion' and 'considerably' and avoids chatty language."},{"kind":"cohesion","q":"Which sentence best fills the gap? 'Cities are growing fast. ___ This means that planners must find new ways to provide homes and transport.'","opts":["By 2050, about two thirds of people may live in urban areas.","Some cities are very old.","My uncle lives in a city.","Buses and trains are types of transport."],"a":0,"why":"The missing sentence must give a fact about growth, so that 'This means...' follows logically."},{"kind":"paraphrase","q":"Which sentence means the same as 'The new park is within walking distance of most homes'?","opts":["Most people can easily walk to the new park.","Most people need a car to reach the new park.","The new park is inside most people's homes.","Walking is not allowed in the new park."],"a":0,"why":"'Within walking distance' means close enough to walk to."}]},{"id":"achiever-5","title":"Sport and teamwork","emoji":"🤝","words":[{"w":"teammate","def":"a person who is in the same team as you","ex":"She passed the ball to a ___, who scored the winning goal.","pos":"noun","pic":"⚽"},{"w":"opponent","def":"the person or team that you play against","ex":"At the end of the match, she shook hands with her ___.","pos":"noun","pic":"🎾","syn":["rival"]},{"w":"cooperate","def":"to work together with other people to reach the same goal","ex":"In a rowing race, all eight rowers must ___ perfectly to move the boat fast.","pos":"verb","pic":"🚣","forms":{"noun":"cooperation","verb":"cooperate","adj":"cooperative"}},{"w":"tactics","def":"plans for how to win a game or reach a goal","ex":"At half-time, the coach changed the team's ___.","pos":"noun","pic":"📋"},{"w":"referee","def":"the person who makes sure players follow the rules in a match","ex":"The ___ blew the whistle to start the second half.","pos":"noun"},{"w":"determination","def":"the quality of not giving up, even when something is difficult","ex":"With hard work and ___, she finally won the race.","pos":"noun","forms":{"noun":"determination","adj":"determined"}},{"w":"stamina","def":"the physical energy to keep going for a long time","ex":"Marathon runners need great ___ to run for 42 kilometres.","pos":"noun","pic":"🏃"},{"w":"injury","def":"harm done to a person's body, for example in an accident or a game","ex":"He missed three matches because of a knee ___.","pos":"noun","pic":"🩹","forms":{"noun":"injury","verb":"injure","adj":"injured"}},{"w":"motivate","def":"to make someone want to do something and work hard at it","ex":"A good captain knows how to ___ the team when they are losing.","pos":"verb","forms":{"noun":"motivation","verb":"motivate"}},{"w":"spectator","def":"a person who watches a sports event","ex":"Every ___ in the stadium stood up and cheered.","pos":"noun","pic":"🏟️","syn":["viewer"]},{"w":"compete","def":"to take part in a contest and try to win it","ex":"Athletes from more than 200 countries ___ at the Olympic Games.","pos":"verb","pic":"🏅","forms":{"noun":"competition","verb":"compete","adj":"competitive"}},{"w":"sportsmanship","def":"fair, kind and polite behaviour in sport, even when you lose","ex":"Helping an opponent who has fallen is a great example of ___.","pos":"noun"}],"grammar":[{"q":"If our goalkeeper ___ that penalty, we would have won the cup.","opts":["had saved","saved","would save","has saved"],"a":0,"why":"Third conditional: if + had + past participle, then would have + past participle."},{"q":"I'm not sure why Ella missed training. She ___ ill.","opts":["might have been","must have be","should have been","can't be"],"a":0,"why":"'Might have been' shows a possibility in the past. We are not sure, so 'must' and 'can't' are too certain."},{"q":"The coach ___ that we should drink more water during matches.","opts":["recommended","told","encouraged","advised to"],"a":0,"why":"'Recommend' can be followed by 'that'. 'Tell' and 'encourage' need a person first (told us, encouraged us)."},{"q":"The stadium ___ for the final, so it looks brand new.","opts":["has been repainted","has repainted","is repainting","had repainted"],"a":0,"why":"The stadium didn't paint anything, so use the passive. The result is clear now, so use the present perfect passive."},{"q":"Wembley Stadium, ___ the FA Cup Final is played, can hold 90,000 people.","opts":["where","which","that","who"],"a":0,"why":"Use 'where' for a place when a full clause follows (the final is played there)."},{"q":"Despite ___ a goal down at half-time, the team won 3-1.","opts":["being","they were","be","was"],"a":0,"why":"'Despite' is followed by a noun or an -ing form, not by a full clause."}],"sentences":["The coach told us to pass the ball more quickly.","Our goalkeeper, whose gloves were too big, kept dropping the ball.","The stadium will be opened by the team captain.","Do you know how many players there are in a rugby team?"],"reading":{"title":"Winning together","text":"The Tour de France is one of the toughest races in the world. Every July, about 170 cyclists ride more than 3,000 kilometres around France in three weeks. It may look like a contest between individuals, but no rider could win it alone.\n\nEach team has eight riders, and usually only one of them has a real chance of winning. Most of the others are known as 'domestiques', a French word meaning 'servants'. Their job is to help their leader. They fetch water bottles and food from the team car, ride in front of the leader to block the wind and, if the leader's bike breaks, they may even hand over their own.\n\nRiding just behind another cyclist takes much less effort than riding at the front, because the rider in front pushes through the air. Domestiques take turns at the front so that their leader can save energy for the hardest mountain climbs. By the final week, many of them are exhausted, having spent their strength on someone else's success.\n\nDespite this, domestiques are highly respected by fans and other riders, who know that the race is rarely won by one person. The winner wears the famous yellow jersey in Paris, but the whole team has earned it.","qs":[{"type":"mc","q":"Why did the writer write this text?","opts":["to show that winning a cycling race depends on a whole team","to explain how to repair a racing bike","to describe the mountains of France","to persuade readers to become professional cyclists"],"a":0},{"type":"tfng","q":"Most riders in a team expect to win the Tour de France.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Cycling just behind another rider is easier than cycling at the front.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Domestiques often become team leaders later in their careers.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What does the French word 'domestique' mean?","opts":["servant","leader","cyclist","winner"],"a":0}]},"extra":[{"kind":"idiom","q":"We were losing 2-0, but we didn't ___, and in the end we drew 2-2.","opts":["throw in the towel","hit the roof","cost an arm and a leg","spill the beans"],"a":0,"why":"'Throw in the towel' means give up."},{"kind":"collocation","q":"Our team ___ the match 3-1.","opts":["won","beat","gained","earned"],"a":0,"why":"You win a match or a game, but you beat a person or a team."},{"kind":"phrasal","q":"The final was ___ until Sunday because of the storm.","opts":["put off","put up","taken off","called up"],"a":0,"why":"'Put off' means move an event to a later time."},{"kind":"wordform","q":"Swimming is a very ___ sport at our school: everyone wants to win. (compete)","opts":["competitive","competition","competitor","competing"],"a":0,"why":"We need an adjective after 'very' to describe the sport: competitive."},{"kind":"linking","q":"___ he had a sore ankle, Leo played the whole match.","opts":["Even though","Despite","In spite","However"],"a":0,"why":"'Even though' is followed by a full clause (he had a sore ankle). 'Despite' and 'in spite of' need a noun or an -ing form."},{"kind":"cohesion","q":"Which sentence best completes the paragraph? 'Team sports teach children many useful skills. They learn to communicate clearly and to trust others. ___'","opts":["They also learn how to deal with losing as well as winning.","However, football was invented in England.","Tennis players usually play alone.","As a result, stadiums are very large."],"a":0,"why":"The last sentence adds one more skill, so it continues the same idea with 'also'."}]}]},{"stage":6,"units":[{"id":"expert-1","title":"How the brain learns","emoji":"🧠","words":[{"w":"cognitive","def":"connected with thinking, learning, understanding and remembering","ex":"Puzzles and chess can sharpen ___ skills such as memory and attention.","pos":"adj","forms":{"noun":"cognition","adj":"cognitive"}},{"w":"retain","def":"to keep something, especially information in your memory","ex":"Without regular review, we ___ only a small part of what we hear in a lesson.","pos":"verb","syn":["keep","remember"],"ant":["forget","lose"],"forms":{"verb":"retain","noun":"retention"}},{"w":"stimulus","def":"something that causes a reaction in a living thing","ex":"The brain reacts to a sudden ___, such as a loud bang, in a fraction of a second.","pos":"noun"},{"w":"consolidate","def":"to make something, such as a memory, stronger and more lasting","ex":"During deep sleep, the brain replays the day's events to ___ them into long-term memories.","pos":"verb","syn":["strengthen"],"ant":["weaken"],"forms":{"verb":"consolidate","noun":"consolidation"}},{"w":"neuron","def":"a nerve cell that carries electrical messages around the brain and body","ex":"Each ___ can link to thousands of other nerve cells through tiny branches.","pos":"noun"},{"w":"plasticity","def":"the brain's ability to change and build new connections throughout life","ex":"Thanks to its ___, the brain can rewire itself when we learn a new skill.","pos":"noun"},{"w":"acquire","def":"to gain knowledge or a skill through your own effort or experience","ex":"Young children ___ their first language without any formal lessons.","pos":"verb","syn":["gain","obtain"],"ant":["lose"],"forms":{"verb":"acquire","noun":"acquisition"}},{"w":"perceive","def":"to notice or become aware of something through the senses or the mind","ex":"Our eyes send signals to the brain, which allows us to ___ colour, shape and movement.","pos":"verb","syn":["notice","sense"],"forms":{"verb":"perceive","noun":"perception","adj":"perceptive"}},{"w":"retrieval","def":"the act of finding and bringing back information stored in memory","ex":"Practice questions help because every act of ___ makes a memory easier to find again.","pos":"noun","forms":{"noun":"retrieval","verb":"retrieve"}},{"w":"fatigue","def":"great tiredness after hard physical or mental effort","ex":"After four hours of revision without a break, mental ___ made it impossible to focus.","pos":"noun","syn":["tiredness","exhaustion"],"ant":["energy"]},{"w":"rote","def":"repeating something many times in order to remember it, without thinking about its meaning","ex":"Learning times tables by ___ can work, but understanding why the answers are right is even better.","pos":"noun"},{"w":"innate","def":"present from birth rather than learnt","ex":"Some researchers argue that babies have an ___ ability to recognise human faces.","pos":"adj","syn":["inborn","natural"],"ant":["learned"]}],"grammar":[{"q":"Never ___ so much about the brain as they do today.","opts":["have scientists known","scientists have known","had scientists know","scientists knew"],"a":0,"why":"When 'Never' starts the sentence, the auxiliary comes before the subject: Never have scientists known."},{"q":"___ helps memory most is testing yourself, not rereading your notes.","opts":["What","That","Which","It"],"a":0,"why":"A 'What' cleft sentence puts the focus on the key idea: What helps most is..."},{"q":"It is widely believed ___ we use only ten per cent of our brains, but this is a myth.","opts":["that","what","which","if"],"a":0,"why":"The reporting pattern is 'It is believed that + clause'."},{"q":"___ by the results, the researchers repeated the experiment to make sure.","opts":["Surprised","Surprising","Having surprised","To surprise"],"a":0,"why":"The researchers were surprised (passive meaning), so use the past participle 'Surprised'."},{"q":"If I had gone to bed earlier last night, I ___ so tired now.","opts":["wouldn't feel","wouldn't have felt","won't feel","didn't feel"],"a":0,"why":"Mixed conditional: a past condition (had gone) with a present result (now) takes 'would + verb'."},{"q":"Short breaks during study ___ improve concentration, although more research is needed.","opts":["appear to","appears to","are certain to","have been proved to"],"a":0,"why":"'More research is needed' calls for cautious hedging, and the plural subject 'breaks' needs 'appear to'."}],"sentences":["Sleep plays a vital role in the consolidation of new memories.","The brain's remarkable plasticity allows it to adapt throughout life.","Mental fatigue makes it much harder for students to concentrate.","Babies appear to have an innate ability to recognise faces."],"reading":{"title":"Why testing beats rereading","text":"For generations, students have prepared for exams by rereading their notes and highlighting key passages. It feels productive: the material looks increasingly familiar, and familiarity is easily mistaken for understanding. Yet a large body of research in cognitive psychology suggests that this popular method is surprisingly inefficient.\n\nThe alternative, known as retrieval practice, involves deliberately recalling information without looking at it, for example by answering practice questions or explaining a topic from memory. In a well-known series of experiments, students who tested themselves after reading a passage remembered considerably more a week later than those who simply read it again, even though the rereaders had felt more confident. The effort of searching memory appears to strengthen the pathways that lead back to the information, making it easier to find next time.\n\nTiming matters too. Spreading study sessions over several days, rather than cramming them into a single evening, tends to produce more durable learning. Researchers believe that a small amount of forgetting between sessions is actually useful, because it forces the brain to work harder at each attempt to recall. Sleep also plays a part: during deep sleep, the brain seems to replay and consolidate what was learnt during the day.\n\nNone of this means that rereading is worthless; it can be a sensible first step when meeting a topic for the first time. However, the evidence suggests that learners who want knowledge to last should spend less time looking at their notes and more time trying to remember what is in them.","qs":[{"type":"tfng","q":"In the experiments described, the students who reread the passage felt less sure of themselves than those who tested themselves.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Retrieval practice was first developed by classroom teachers rather than by scientists.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the first paragraph, why does rereading feel effective to many students?","opts":["They confuse recognising material with really understanding it.","It takes far less time than any other method.","Most teachers recommend it as the best way to revise.","It helps them to sleep better before an exam."],"a":0},{"type":"mc","q":"The writer would most likely advise a student with a test in two weeks to","opts":["quiz themselves in short sessions spread across the two weeks.","reread all their notes several times on the evening before the test.","wait until they feel confident before they start to revise.","highlight every important sentence in their textbook."],"a":0},{"type":"mc","q":"What is the writer's main purpose in the passage?","opts":["to argue that active recall is a more effective way to study than rereading","to explain in detail how nerve cells carry messages","to criticise students who never revise for their exams","to show that rereading is of no value at any stage of learning"],"a":0}]},"extra":[{"kind":"collocation","q":"New brain scans may ___ light on how memories are stored.","opts":["shed","drop","give","make"],"a":0,"why":"'Shed light on' is a fixed phrase meaning 'help to explain'."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Familiarity is easily mistaken for understanding.'?","opts":["People often think they understand something simply because it looks familiar.","People rarely recognise material that they understand well.","Understanding something well makes it look less familiar.","Material always becomes easy to understand once it is familiar."],"a":0,"why":"'Mistaken for' means wrongly taken to be: familiar material is wrongly thought to be understood."},{"kind":"register","q":"Which sentence is most suitable for an academic essay?","opts":["Evidence suggests that retrieval practice improves long-term retention.","Testing yourself is way better for remembering stuff.","Honestly, rereading your notes is a total waste of time.","Loads of studies say quizzes really help you remember things."],"a":0,"why":"Academic style is cautious (suggests) and uses precise, formal words, not 'way better', 'stuff' or 'loads of'."},{"kind":"wordform","q":"The ___ (retain) of new vocabulary improves when words are reviewed every few days.","opts":["retention","retainer","retained","retainable"],"a":0,"why":"After 'The' and before 'of' we need a noun: retain becomes retention."},{"kind":"linking","q":"Rereading can be useful at first; ___, it is less effective than self-testing for long-term learning.","opts":["nevertheless","therefore","similarly","for instance"],"a":0,"why":"The second idea contrasts with the first, so we need a concession link: nevertheless."},{"kind":"cohesion","q":"Which sentence best follows? 'Spreading study over several days produces more durable learning than cramming.'","opts":["This is partly because a little forgetting between sessions makes each recall more effortful.","Cramming, in other words, means spreading study over several days.","For example, many students enjoy listening to music.","As a result, sleep has no effect on memory at all."],"a":0,"why":"'This is partly because' gives a reason for the claim. The others contradict it or change the topic."}]},{"id":"expert-2","title":"Biodiversity","emoji":"🦋","words":[{"w":"indigenous","def":"living or growing naturally in a place, not brought there from somewhere else","ex":"The kiwi is ___ to New Zealand and is found nowhere else in the wild.","pos":"adj","syn":["native"],"ant":["introduced","foreign"]},{"w":"decline","def":"a gradual fall in the number, amount or quality of something","ex":"Scientists have recorded a steady ___ in the number of wild bees in some regions.","pos":"noun","syn":["fall","drop"],"ant":["increase","rise"]},{"w":"deplete","def":"to reduce the amount of something so much that very little is left","ex":"Overfishing can ___ fish stocks faster than they are able to recover.","pos":"verb","forms":{"verb":"deplete","noun":"depletion","adj":"depleted"}},{"w":"pollinator","def":"an animal, such as a bee or a bat, that carries pollen from flower to flower","ex":"The bee is the best-known ___, but moths, birds and bats do the same job.","pos":"noun"},{"w":"invasive","def":"spreading into a new area and harming the plants or animals already living there","ex":"Gardeners are asked not to plant ___ species that could escape and crowd out wild flowers.","pos":"adj","ant":["native"]},{"w":"interdependent","def":"relying on each other in order to survive or work well","ex":"In a rainforest, plants and animals are ___: when one species disappears, others suffer too.","pos":"adj"},{"w":"restoration","def":"the work of returning something to its earlier, healthy condition","ex":"The ___ of the wetland brought back birds that had not been seen there for decades.","pos":"noun","forms":{"noun":"restoration","verb":"restore"}},{"w":"fragmentation","def":"the breaking of something into small, separate parts","ex":"New roads cause habitat ___, leaving animals trapped in small patches of forest.","pos":"noun","forms":{"noun":"fragmentation","verb":"fragment"}},{"w":"sustain","def":"to keep something alive, or to keep it going over a long time","ex":"A single old oak tree can ___ hundreds of different kinds of insects.","pos":"verb","syn":["support"],"forms":{"verb":"sustain","adj":"sustainable","noun":"sustainability"}},{"w":"abundant","def":"existing in very large numbers or amounts","ex":"Before the dam was built, salmon were so ___ that the river seemed to shine silver.","pos":"adj","syn":["plentiful"],"ant":["scarce","rare"],"forms":{"adj":"abundant","noun":"abundance"}},{"w":"keystone species","def":"a plant or animal that many other living things in its area depend on","ex":"Sea otters are a ___ because they stop sea urchins from destroying kelp forests.","pos":"phrase"},{"w":"evolve","def":"to develop gradually over many generations","ex":"Species slowly ___ as small changes are passed from one generation to the next.","pos":"verb","forms":{"verb":"evolve","noun":"evolution","adj":"evolutionary"}}],"grammar":[{"q":"Not only ___ wild flowers, but they also pollinate many of our crops.","opts":["do bees pollinate","bees pollinate","bees do pollinate","pollinate bees"],"a":0,"why":"When 'Not only' starts a sentence, use question order: Not only do bees pollinate..."},{"q":"The kakapo, a flightless parrot from New Zealand, ___ to be the heaviest parrot in the world.","opts":["is thought","thinks","is thinking","it is thought"],"a":0,"why":"Use 'subject + is thought to be' when we report what people generally believe."},{"q":"The rapid ___ of rainforests threatens thousands of species.","opts":["destruction","destroy","destroyed","destructive"],"a":0,"why":"After 'The rapid' and before 'of' we need a noun: destroy becomes destruction (nominalisation)."},{"q":"It is vital that every visitor ___ to the marked paths in the nature reserve.","opts":["keep","kept","keeping","to keep"],"a":0,"why":"After 'It is vital that...', formal English uses the base form (the subjunctive): every visitor keep."},{"q":"___ in only one small forest, the bird is at great risk if that forest is cleared.","opts":["Found","Finding","Having found","To find"],"a":0,"why":"The bird is found there (passive meaning), so the participle clause starts with 'Found'."},{"q":"It was the arrival of rats on the island ___ caused the decline of its native birds.","opts":["that","what","who","where"],"a":0,"why":"In a cleft sentence 'It was X that...', use 'that'; 'who' is only for people."}],"sentences":["Bees pollinate many of the crops that we depend on for food.","Healthy soils sustain an enormous variety of tiny living creatures.","It is vital that every visitor keep to the marked paths.","Sea otters are a keystone species in the kelp forests of the Pacific."],"reading":{"title":"The wolves of Yellowstone","text":"In 1995, a small group of grey wolves was released into Yellowstone National Park in the United States, roughly seventy years after the animals had disappeared from the area. The decision was controversial, yet it has since become one of the most widely discussed experiments in modern conservation.\n\nWolves are often described as a keystone species, meaning that their influence on an ecosystem is far greater than their numbers would suggest. Before their return, large herds of elk grazed freely along the park's rivers, eating young willow and aspen trees before they could grow tall. Once wolves were back, the elk were not only reduced in number but also appeared to change their behaviour, spending less time in open valleys where they could easily be spotted.\n\nAccording to some researchers, this set off a chain of effects known as a trophic cascade. With less grazing, willows recovered along certain riverbanks, providing food and building material for beavers. Beaver dams, in turn, created ponds that suited fish, frogs and birds.\n\nHowever, the story may be less tidy than it is sometimes told. Other scientists point out that the recovery of plants has been patchy, and that several factors, including dry weather, a growing number of bears and the activities of people outside the park, also affected elk numbers. Separating the role of the wolves from these other influences has proved difficult.\n\nWhat few dispute is that the return of a single predator encouraged scientists to look far more closely at how the members of an ecosystem depend on one another. Whatever the precise explanation, Yellowstone has become a living laboratory for the study of nature's connections.","qs":[{"type":"tfng","q":"Wolves had been absent from Yellowstone for about seven decades before 1995.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"The wolves released in 1995 had been brought from Canada.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"Scientists all agree that the wolves were the main reason the willows recovered.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"What does the writer suggest by saying the story 'may be less tidy than it is sometimes told'?","opts":["The popular version may simplify a more complicated situation.","The park has become dirtier since the wolves arrived.","Scientists have decided to stop studying the wolves.","The wolves have caused more damage than anyone expected."],"a":0},{"type":"mc","q":"Which title best summarises the passage?","opts":["Wolves and willows: a powerful but debated chain of effects","How beavers build their dams and ponds","Why wolves should be kept out of national parks","The history of Yellowstone's first human visitors"],"a":0}]},"extra":[{"kind":"collocation","q":"Plastic waste ___ a serious threat to sea turtles.","opts":["poses","makes","does","takes"],"a":0,"why":"We say 'pose a threat'; make, do and take do not go with 'threat'."},{"kind":"wordform","q":"Bees play a vital role in the ___ (pollinate) of many fruit trees.","opts":["pollination","pollinator","pollinate","pollinated"],"a":0,"why":"We need a noun for the process: pollination. A pollinator is the animal, not the process."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Their influence is far greater than their numbers would suggest.'?","opts":["Although there are few of them, they have a very large effect.","Because there are many of them, their effect is large.","Their numbers are growing faster than their influence.","Their effect is small because there are so few of them."],"a":0,"why":"'Greater than their numbers would suggest' means a big effect from a small number."},{"kind":"linking","q":"___ wolves reduced the number of elk, other factors such as dry weather also played a part.","opts":["While","Because","Unless","So that"],"a":0,"why":"'While' here means 'although': it admits one point and then adds a contrasting one."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'Bees, butterflies and bats move pollen between flowers, allowing plants to produce seeds and fruit. Without them, many crops would give far smaller harvests, and some wild plants could disappear.'","opts":["Why pollinators matter","How bats find their way in the dark","The life cycle of a butterfly","Farming without machines"],"a":0,"why":"The whole paragraph explains how important pollinating animals are for plants and crops."},{"kind":"preposition","q":"Many woodland birds depend ___ the shelter that old trees provide.","opts":["on","of","at","with"],"a":0,"why":"The verb 'depend' is followed by 'on' (or 'upon')."}]},{"id":"expert-3","title":"Ancient civilisations","emoji":"🏛️","words":[{"w":"artefact","def":"an object made by people, especially one from the past that is of historical interest","ex":"Each ___ found in the tomb was photographed before it was carefully moved.","pos":"noun"},{"w":"excavate","def":"to dig carefully in the ground to find objects or buildings from the past","ex":"Archaeologists spent ten years trying to ___ the buried city.","pos":"verb","forms":{"verb":"excavate","noun":"excavation"}},{"w":"inscription","def":"words cut into stone, metal or another hard surface","ex":"The ___ on the Rosetta Stone appears in three different scripts.","pos":"noun","forms":{"noun":"inscription","verb":"inscribe"}},{"w":"dynasty","def":"a series of rulers who all belong to the same family","ex":"The Ming ___ ruled China for nearly three hundred years.","pos":"noun"},{"w":"hierarchy","def":"a system in which people or things are arranged in levels of importance","ex":"In ancient Egypt, the pharaoh stood at the top of a strict social ___.","pos":"noun","forms":{"noun":"hierarchy","adj":"hierarchical"}},{"w":"irrigation","def":"supplying water to land through channels or pipes so that crops can grow","ex":"Without ___ canals, farmers in Mesopotamia could not have grown crops in such a dry land.","pos":"noun","forms":{"noun":"irrigation","verb":"irrigate"}},{"w":"decipher","def":"to work out the meaning of writing that is very difficult to read or understand","ex":"It took scholars many years to ___ Egyptian hieroglyphs.","pos":"verb","syn":["decode"],"forms":{"verb":"decipher","noun":"decipherment"}},{"w":"prosperous","def":"rich and successful","ex":"Thanks to trade, once poor fishing villages became ___ towns full of wealthy merchants.","pos":"adj","syn":["wealthy","thriving"],"ant":["poor"],"forms":{"adj":"prosperous","noun":"prosperity","verb":"prosper"}},{"w":"legacy","def":"something from the past that is handed down to the people who come later","ex":"The Romans left a lasting ___ of roads, bridges and thousands of Latin-based words.","pos":"noun","syn":["heritage"]},{"w":"chronological","def":"arranged in the order in which events happened","ex":"The museum displays its objects in ___ order, from the oldest to the most recent.","pos":"adj","forms":{"adj":"chronological","adv":"chronologically"}},{"w":"derive","def":"to come from, or develop from, something else","ex":"The word 'pharaoh' is thought to ___ from an Egyptian phrase meaning 'great house'.","pos":"verb","forms":{"verb":"derive","noun":"derivation"}},{"w":"sophisticated","def":"advanced and complex, showing a lot of skill and knowledge","ex":"The Maya developed a ___ calendar based on careful observation of the sky.","pos":"adj","syn":["advanced"],"ant":["simple","basic"]}],"grammar":[{"q":"The pyramids at Giza ___ built around 4,500 years ago.","opts":["are believed to have been","are believed to be","believe to have been","are believing to have been"],"a":0,"why":"For a belief now about a past event, use 'is/are believed to have been + past participle'."},{"q":"Only when the Rosetta Stone was studied closely ___ able to read hieroglyphs.","opts":["were scholars","scholars were","did scholars","scholars had"],"a":0,"why":"After 'Only when + clause' at the start, the main clause uses question order: were scholars able."},{"q":"Hardly ___ the door of the tomb when they saw the glint of gold.","opts":["had they opened","they had opened","did they opened","have they opened"],"a":0,"why":"'Hardly had + subject + past participle... when' shows one past action followed at once by another."},{"q":"If the Romans hadn't built such strong roads, some of them ___ still in use today.","opts":["wouldn't be","wouldn't have been","won't be","aren't"],"a":0,"why":"Mixed conditional: a past condition (hadn't built) with a present result (today) takes 'would + verb'."},{"q":"___ the hieroglyphs, Champollion could finally read the names of the pharaohs.","opts":["Having deciphered","Deciphered","Having been deciphered","To be deciphered"],"a":0,"why":"Champollion did the deciphering first (active, earlier action), so use 'Having + past participle'."},{"q":"It ___ that the city was abandoned after its river changed course.","opts":["is thought","thinks","is thinking","has thought"],"a":0,"why":"'It is thought that...' reports a general belief without saying who holds it."}],"sentences":["Archaeologists use careful methods to excavate a site without damaging it.","Many English words are derived from the language of the ancient Romans.","Champollion is credited with the decipherment of Egyptian hieroglyphs.","The Great Pyramid is believed to have been built for the pharaoh Khufu."],"reading":{"title":"Reading the Rosetta Stone","text":"When a slab of dark stone was found near the town of Rashid, known in English as Rosetta, in 1799, few could have guessed how important it would become. The stone carries the same official message written three times: in hieroglyphs, in a later Egyptian script called Demotic, and in ancient Greek. Since scholars could already read Greek, the stone offered something extremely rare: a key to a writing system that nobody had understood for well over a thousand years.\n\nEven so, the task proved far harder than expected. Many early researchers assumed that each hieroglyph represented a whole idea, much like a small picture, and their attempts to match the signs to the Greek text led nowhere. The English scientist Thomas Young made important progress, showing that the oval shapes known as cartouches contained royal names written with signs for sounds.\n\nIt was the French scholar Jean-François Champollion who finally solved the puzzle in 1822. His great advantage was a deep knowledge of Coptic, a late form of the Egyptian language that was still used in church services. This allowed him to recognise that hieroglyphic writing was a mixture of signs: some stood for sounds, while others represented whole words or ideas.\n\nThe consequences were enormous. Thousands of inscriptions on temples, tombs and papyrus scrolls could now be read, opening a window onto Egyptian history, religion and daily life. Today the stone is one of the most visited objects in the British Museum, and its name has entered everyday English: a 'Rosetta Stone' is anything that unlocks a difficult problem.","qs":[{"type":"tfng","q":"When the stone was found, scholars were already able to read one of its three versions of the message.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Champollion travelled to Egypt before he solved the puzzle of the hieroglyphs.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"Why did many early attempts to read the hieroglyphs fail?","opts":["Researchers wrongly believed that every sign stood for a complete idea.","The Greek part of the stone was too damaged to read.","Nobody was allowed to study the stone closely.","The hieroglyphs on the stone were written in Coptic."],"a":0},{"type":"mc","q":"What can be inferred from the passage?","opts":["Champollion built on earlier discoveries rather than working entirely alone.","Thomas Young understood hieroglyphs better than Champollion did.","Demotic was the oldest of the three scripts on the stone.","Hieroglyphs were still widely read when the stone was found."],"a":0},{"type":"mc","q":"Why does the writer mention the everyday meaning of 'a Rosetta Stone'?","opts":["to show how deeply the discovery has influenced the way people speak","to explain how the stone was taken to the British Museum","to suggest that the stone is less important than people think","to compare the work of Champollion with that of Young"],"a":0}]},"extra":[{"kind":"collocation","q":"The discovery of the tomb ___ a great deal of interest around the world.","opts":["attracted","collected","took","made"],"a":0,"why":"We say 'attract interest' (or 'attract attention'); collect, take and make do not go with 'interest' here."},{"kind":"wordform","q":"The ___ (prosperous) of the city depended on trade along the river.","opts":["prosperity","prosper","prosperously","prospered"],"a":0,"why":"After 'The' and before 'of' we need a noun: prosperous becomes prosperity."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Nobody had understood the writing for well over a thousand years.'?","opts":["For more than ten centuries, no one had been able to read it.","It had been understood for just under a thousand years.","Only a few experts had read it during the previous thousand years.","The writing had been invented a little over a thousand years earlier."],"a":0,"why":"'Well over a thousand years' means clearly more than ten centuries, and 'nobody' means no one at all."},{"kind":"register","q":"Which sentence is most appropriate in a formal history essay?","opts":["The civilisation declined owing to a combination of environmental and economic factors.","The civilisation kind of fell apart because of loads of problems.","Basically, things went wrong and the civilisation was finished.","The civilisation went downhill big time for lots of reasons."],"a":0,"why":"Formal writing uses precise words (declined, owing to, factors) and avoids 'kind of', 'loads of' and 'big time'."},{"kind":"cohesion","q":"Which sentence best follows? 'Many early researchers assumed that each hieroglyph represented a whole idea.'","opts":["This belief, however, turned out to be only partly correct.","Hieroglyphs are therefore impossible to read today.","In addition, the stone was found in 1799 near Rosetta.","As a result, Greek was the only language the Egyptians wrote."],"a":0,"why":"'This belief' points back to the assumption and 'however' prepares the correction. The others are false or off topic."},{"kind":"linking","q":"The Indus script has been studied for over a century; ___, it has still not been deciphered.","opts":["even so","consequently","in addition","for example"],"a":0,"why":"The result is the opposite of what we would expect, so we need a concession link: even so."}]},{"id":"expert-4","title":"Robots and AI","emoji":"🤖","words":[{"w":"algorithm","def":"a set of step-by-step rules that a computer follows to solve a problem","ex":"The music app uses an ___ to suggest songs you might enjoy.","pos":"noun","forms":{"noun":"algorithm","adj":"algorithmic"}},{"w":"automate","def":"to make a process work by machine so that people do not have to do it","ex":"Many factories ___ dull, repetitive tasks so that workers can focus on skilled jobs.","pos":"verb","forms":{"verb":"automate","noun":"automation","adj":"automated"}},{"w":"autonomous","def":"able to act and make decisions on its own, without human control","ex":"An ___ drone can fly a planned route without a human pilot.","pos":"adj","syn":["independent"],"forms":{"adj":"autonomous","noun":"autonomy","adv":"autonomously"}},{"w":"sensor","def":"a device that detects things such as light, heat, sound or movement","ex":"A ___ underneath the robot vacuum stops it falling down the stairs.","pos":"noun"},{"w":"bias","def":"an unfair preference for or against a person, group or idea","ex":"If the training photos show mostly one group of people, the system may develop a ___.","pos":"noun","syn":["prejudice"],"forms":{"noun":"bias","adj":"biased"}},{"w":"interpret","def":"to work out and explain the meaning of something","ex":"Voice assistants must ___ what we mean, not just the words we say.","pos":"verb","forms":{"verb":"interpret","noun":"interpretation"}},{"w":"precision","def":"the quality of being very exact and accurate","ex":"Surgical robots can make tiny cuts with a ___ that no human hand can match.","pos":"noun","syn":["accuracy"],"forms":{"noun":"precision","adj":"precise","adv":"precisely"}},{"w":"ethical","def":"connected with what is morally right or wrong","ex":"Scientists are debating the ___ questions raised by machines that make decisions about people.","pos":"adj","ant":["unethical"],"forms":{"adj":"ethical","noun":"ethics","adv":"ethically"}},{"w":"capability","def":"the ability or power to do something","ex":"The latest robot vacuum has the ___ to map every room in a house.","pos":"noun","forms":{"noun":"capability","adj":"capable"}},{"w":"obsolete","def":"no longer used because something newer and better has been invented","ex":"Floppy disks became ___ once people began storing files on memory sticks.","pos":"adj","syn":["outdated"],"ant":["modern","new"]},{"w":"prototype","def":"the first model of something new, made in order to test the design","ex":"The engineers built a cardboard ___ before making the robot from metal.","pos":"noun"},{"w":"replicate","def":"to copy something exactly, or to do it again in the same way","ex":"Engineers are trying to ___ the gentle way a human hand grips a ripe strawberry.","pos":"verb","syn":["copy","reproduce"],"forms":{"verb":"replicate","noun":"replication"}}],"grammar":[{"q":"What makes this robot special ___ that it can learn from its own mistakes.","opts":["is","are","it is","being"],"a":0,"why":"A 'What' clause acts as a singular subject, so it takes 'is': What makes it special is..."},{"q":"The engineers insisted that the robot ___ tested again before the competition.","opts":["be","being","to be","been"],"a":0,"why":"After 'insist that', formal English uses the base form (the subjunctive): the robot be tested."},{"q":"___ the sensor detect an obstacle, the robot will stop immediately.","opts":["Should","If","Would","Were"],"a":0,"why":"'Should + subject + verb' is a formal way to say 'If...': Should the sensor detect = If the sensor detects."},{"q":"The first industrial robot is said ___ in a car factory in the early 1960s.","opts":["to have been used","to be used","to have used","that it was used"],"a":0,"why":"The robot was used (passive) in the past, so use 'is said to have been + past participle'."},{"q":"If our robot weren't so well designed, it ___ the competition last week.","opts":["wouldn't have won","wouldn't win","won't have won","didn't win"],"a":0,"why":"Mixed conditional: a present fact (weren't so well designed) with a past result (last week) takes 'would have + past participle'."},{"q":"Robots ___ in hospitals can carry medicines from one ward to another.","opts":["used","using","are used","use"],"a":0,"why":"'Used in hospitals' is a shortened passive relative clause meaning 'that are used in hospitals'."}],"sentences":["Surgical robots can make cuts with remarkable precision.","The robot uses a sensor to detect obstacles in its path.","Voice assistants must interpret the meaning behind the words we say.","Training a system on biased data can lead to unfair decisions."],"reading":{"title":"Why easy is hard for robots","text":"In 1997, a computer called Deep Blue defeated the world chess champion Garry Kasparov, a moment many saw as proof that machines were about to overtake human intelligence. Yet decades later, robots still struggle with tasks such as folding a basket of laundry or picking up an unfamiliar object without dropping it. This puzzling contrast has a name: Moravec's paradox.\n\nIn the 1980s, the robotics researcher Hans Moravec and others observed that the tasks humans find difficult, such as advanced mathematics or chess, are often relatively easy for computers, whereas skills that a young child masters without effort, like recognising a face or walking across a cluttered room, are extremely hard to build into a machine.\n\nOne explanation lies in evolution. The abilities to see, balance and grasp objects have been refined over hundreds of millions of years, so they are deeply built into our nervous system and operate without our noticing. Abstract reasoning, by contrast, is a comparatively recent development, and we are aware of how much effort it requires precisely because our brains are not especially well suited to it. In other words, what feels easy to us is not necessarily simple; it may be the result of an enormous amount of hidden processing.\n\nRecent advances in machine learning have narrowed the gap. Robots trained on vast amounts of data are becoming better at recognising objects and adjusting their grip. Nevertheless, engineers still describe the messy, unpredictable real world as one of their greatest challenges. For the time being, a robot that can beat you at chess is far easier to build than one that can tidy your bedroom.","qs":[{"type":"tfng","q":"Deep Blue's victory persuaded some people that computers would soon be more intelligent than humans.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Hans Moravec built the first robot that was able to walk across a room.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"According to the writer, humans find abstract reasoning effortless because it developed recently.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"What does the writer suggest about tasks that feel easy to people?","opts":["They may depend on a great deal of processing that we are not aware of.","They are always simple for machines to copy.","They have developed only in the last few thousand years.","They require more conscious effort than playing chess."],"a":0},{"type":"mc","q":"What is the main purpose of the final paragraph?","opts":["to admit that progress has been made while stressing that a challenge remains","to argue that machine learning has completely solved the paradox","to explain in detail how chess computers are built","to suggest that robots should never be used in homes"],"a":0}]},"extra":[{"kind":"collocation","q":"Self-driving cars have ___ a heated debate about road safety.","opts":["sparked","made","built","done"],"a":0,"why":"We say 'spark a debate' (start it suddenly); make, build and do do not go with 'debate'."},{"kind":"phrasal","q":"Engineers are trying to ___ a way to make robots grip soft objects safely.","opts":["come up with","come down with","put up with","get on with"],"a":0,"why":"'Come up with' means to think of an idea or a plan."},{"kind":"paraphrase","q":"Which sentence means the same as: 'What feels easy to us is not necessarily simple.'?","opts":["Something can seem effortless to people and still be very complex.","Simple tasks are always easy for people to do.","People never find complex tasks easy.","If a task feels difficult, it must be complicated."],"a":0,"why":"'Not necessarily simple' means it might be complex, even though it feels easy."},{"kind":"register","q":"Which sentence is most suitable for an IELTS Writing Task 2 essay?","opts":["It could be argued that automation will transform the job market.","Robots are gonna take over loads of jobs, no doubt.","I reckon robots will totally change work.","Automation? Huge deal for jobs, obviously."],"a":0,"why":"An academic essay uses an impersonal, cautious structure ('It could be argued that') and no slang."},{"kind":"wordform","q":"Some delivery robots can now operate ___ (autonomy) for several hours.","opts":["autonomously","autonomous","autonomy","autonomic"],"a":0,"why":"We need an adverb to describe how they operate: autonomously."},{"kind":"cohesion","q":"Which sentence best fills the gap? 'Robots are becoming better at recognising objects. ___ Even so, engineers say the real world remains a huge challenge.'","opts":["This is largely thanks to training on vast amounts of data.","Robots, however, cannot recognise any objects at all.","Chess was invented many centuries ago.","As a result, the real world is no longer a problem for engineers."],"a":0,"why":"'This' refers back to the progress and explains it, and 'Even so' then adds the contrast. The others break the logic."}]},{"id":"expert-5","title":"Food and water for all","emoji":"🌾","words":[{"w":"scarcity","def":"a situation in which there is not enough of something that people need","ex":"Water ___ is a growing concern in many dry regions of the world.","pos":"noun","syn":["shortage"],"ant":["plenty"],"forms":{"noun":"scarcity","adj":"scarce"}},{"w":"yield","def":"the amount of crops or food that a piece of land produces","ex":"Farmers measure the ___ of each field in tonnes of grain per hectare.","pos":"noun","syn":["harvest","crop"]},{"w":"fertile","def":"able to produce plenty of good, healthy crops","ex":"Each year the river flooded, leaving behind a layer of ___ mud.","pos":"adj","ant":["barren"],"forms":{"adj":"fertile","noun":"fertility","verb":"fertilise"}},{"w":"nutrient","def":"a substance that plants, animals and people need in order to live and grow","ex":"Iron is a ___ that helps the blood carry oxygen around the body.","pos":"noun"},{"w":"allocate","def":"to give a share of money, time or resources for a particular purpose","ex":"The council voted to ___ a quarter of its budget to fixing old water pipes.","pos":"verb","syn":["assign"],"forms":{"verb":"allocate","noun":"allocation"}},{"w":"desalination","def":"the process of removing salt from seawater so that people can drink or use it","ex":"Some dry coastal countries rely on ___ to turn seawater into drinking water.","pos":"noun"},{"w":"sanitation","def":"systems such as toilets and drains that keep places clean and protect health","ex":"Clean water and good ___ prevent the spread of many illnesses.","pos":"noun"},{"w":"distribute","def":"to share things out among a number of people or places","ex":"A network of pipes and pumps can ___ water from the reservoir to homes across the city.","pos":"verb","syn":["share"],"forms":{"verb":"distribute","noun":"distribution"}},{"w":"surplus","def":"an amount that is more than what is needed","ex":"In a good year, the farm grows more than the village needs and sells the ___ to nearby towns.","pos

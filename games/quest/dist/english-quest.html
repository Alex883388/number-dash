lthough modern machines use doses far smaller than those of the early years. Röntgen's story illustrates a recurring pattern in science: a chance observation, followed by patient investigation, can transform a field, yet the full consequences of a discovery may take decades to understand.","qs":[{"type":"tfng","q":"Röntgen gave the rays their name because he did not know what they were.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Röntgen had trained and worked as a doctor before he became a physicist.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the passage, why were X-rays used carelessly at first?","opts":["Their power to damage the body had not yet been recognised.","Röntgen had told people that they were completely safe.","The early machines produced only very weak rays.","Doctors were not allowed to use them for patients."],"a":0},{"type":"mc","q":"What can be inferred about the shoe-shop X-ray machines?","opts":["They exposed customers to radiation before proper safety limits existed.","They were invented by Röntgen himself.","They were mainly used to find broken bones in feet.","They were banned as soon as X-rays were discovered."],"a":0},{"type":"mc","q":"Which statement best summarises the writer's point in the final paragraph?","opts":["A lucky observation can transform a field, but its effects may not be fully understood for a long time.","Most scientific discoveries happen by accident and need no further work.","X-rays are now too dangerous to be used in hospitals.","Scientists should always patent their discoveries."],"a":0}]}],"extra":[{"kind":"collocation","q":"The new treatment ___ promising results in early trials.","opts":["yielded","made","did","brought up"],"a":0,"why":"'Yield results' means produce them; make, do and bring up do not combine with 'results' in this way."},{"kind":"cohesion","q":"Which sentence best follows? 'Placebos can reduce pain and tiredness.'","opts":["They cannot, however, cure infections or mend broken bones.","As a result, real medicines are no longer needed.","For instance, they destroy harmful bacteria.","In addition, broken bones heal faster with placebos."],"a":0,"why":"'However' adds the important limit. The other sentences make claims the passage rejects."},{"kind":"register","q":"Which sentence is most suitable for an academic essay?","opts":["Excessive use of antibiotics may contribute to the development of resistant bacteria.","Taking loads of antibiotics is a really bad idea, honestly.","If you take antibiotics all the time, germs get tough.","Antibiotics? Don't overdo them, or bugs fight back."],"a":0,"why":"Academic writing is impersonal and cautious (may contribute) and uses precise terms instead of 'loads', 'germs' or 'bugs'."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Their effects are largely confined to symptoms that people feel and report.'?","opts":["They mainly affect symptoms that patients notice and describe themselves.","Their effects can be measured only with special machines.","People rarely report how they feel during treatment.","Their effects are spread equally across all kinds of illness."],"a":0,"why":"'Largely confined to' means mostly limited to, and 'feel and report' means notice and describe."},{"kind":"preposition","q":"A small number of people are allergic ___ penicillin.","opts":["to","with","of","for"],"a":0,"why":"The adjective 'allergic' is always followed by 'to'."},{"kind":"wordform","q":"The researchers said the results were ___ (conclusion) and called for larger trials.","opts":["inconclusive","conclusive","concluding","conclusion"],"a":0,"why":"Calling for larger trials shows the results did not settle the question, so we need the negative adjective: inconclusive."},{"kind":"linking","q":"Röntgen could have made a fortune from his discovery; ___, he chose not to patent it.","opts":["instead","therefore","likewise","for example"],"a":0,"why":"'Instead' introduces what he did in place of the expected choice. 'Therefore', 'likewise' and 'for example' do not show this contrast."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'Some medicines come from surprising places. Aspirin is related to a substance found in willow bark, which people chewed to ease pain thousands of years ago. A drug for treating malaria was developed from a traditional Chinese herbal remedy, and at least one powerful painkiller was inspired by the venom of sea snails.'","opts":["Nature as a source of medicines","How to treat a headache at home","The dangers of sea snails","Why herbal remedies never work"],"a":0,"why":"Each example shows a medicine that came from a plant or an animal, so the paragraph is about nature as a source of medicines."},{"kind":"collocation","q":"The new treatment ___ a significant improvement on older methods.","opts":["represents","does","brings up","takes"],"a":0,"why":"Something 'represents an improvement' when it is an example of progress; 'does', 'brings up' and 'takes' do not go with 'improvement'."},{"kind":"register","q":"Which sentence is most appropriate in a medical research paper?","opts":["Participants who received the treatment reported significantly less pain than those in the control group.","The people who got the real pills felt way better.","Basically, the treatment worked loads better than nothing.","Guess what? The pills really helped with the pain!"],"a":0,"why":"A research paper uses precise, impersonal terms ('participants', 'control group', 'significantly'), not chatty words like 'way', 'loads' or 'guess what'."}]},{"id":"band8-5","title":"Art, music and creativity","emoji":"🎨","words":[{"w":"aesthetic","def":"connected with beauty and with how pleasing something looks","ex":"The architect cared about the ___ appeal of the bridge as much as its strength.","pos":"adj","forms":{"adj":"aesthetic","noun":"aesthetics"}},{"w":"improvise","def":"to make up music, words or actions on the spot, without prep y or support to artists or to an activity such as music","ex":"Lorenzo de' Medici, a wealthy ___ of the arts, paid many Florentine painters and sculptors to work for him.","pos":"noun","syn":["sponsor","supporter"]}],"grammar":[{"q":"So moving ___ that the audience stood and cheered for ten minutes.","opts":["was the performance","the performance was","did the performance","the performance had"],"a":0,"why":"After 'So + adjective' at the start of a sentence, the verb comes before the subject: So moving was the performance."},{"q":"___ Monet often painted outdoors to capture changing light, many earlier artists worked mainly in studios.","opts":["Whereas","Despite","Owing to","Notwithstanding"],"a":0,"why":"'Whereas' joins two clauses to contrast them; despite, owing to and notwithstanding need a noun, not a clause."},{"q":"It was the invention of the paint tube ___ made it easier for artists to paint outdoors.","opts":["that","what","where","whom"],"a":0,"why":"A cleft sentence 'It was X that...' highlights X; 'what', 'where' and 'whom' do not fit this pattern."},{"q":"Seldom ___ such a young composer received so much praise.","opts":["has","have","is","did"],"a":0,"why":"After 'Seldom' at the start, invert: Seldom has + singular subject + past participle (received)."},{"q":"___ in 1889, The Starry Night is one of Van Gogh's best-known works.","opts":["Painted","Painting","Having painted","To paint"],"a":0,"why":"The picture was painted (passive meaning), so the participle clause begins with 'Painted'."},{"q":"The more an artist practises, ___ their technique becomes.","opts":["the more reliable","more reliable","the most reliable","the reliable"],"a":0,"why":"The pattern 'The more..., the more...' needs 'the + comparative' in both halves."},{"q":"Nowhere ___ the influence of Japanese prints more obvious than in the work of Van Gogh.","opts":["is","are","does","has"],"a":0,"why":"After 'Nowhere' at the start, invert the verb and subject; the singular subject 'the influence' needs 'is'."},{"q":"The Mona Lisa ___ to have been painted over a period of several years.","opts":["is thought","thinks","is thinking","has thought"],"a":0,"why":"A painting cannot think, so use the passive reporting pattern 'is thought to have been + past participle'."},{"q":"___ much they practise, few musicians ever feel that a piece is truly perfect.","opts":["However","Whatever","Although","Despite"],"a":0,"why":"'However much + clause' means 'no matter how much'. 'Whatever', 'Although' and 'Despite' cannot be followed by 'much' in this way."},{"q":"___ in a damp cellar for over a century, the painting needed careful cleaning.","opts":["Having been stored","Having stored","Storing","To store"],"a":0,"why":"Someone stored the painting earlier (passive and before the main action), so use 'Having been + past participle'."}],"sentences":["Jazz musicians are famous for improvising solos on the spot.","Picasso was one of the most prolific artists of the twentieth century.","The invention of the paint tube allowed artists to work outdoors.","Critics dismissed the song as derivative of earlier hits.","Michelangelo spent four years painting the ceiling of the Sistine Chapel.","The curator chose which paintings would hang in each room."],"reading":[{"title":"The improvising brain","text":"When a jazz pianist improvises, she is composing and performing at the same moment, producing music that has never existed before and will never be played in exactly the same way again. For centuries, such spontaneous creativity was regarded as something close to magic. Recently, however, neuroscientists have begun to investigate what actually happens in the brain when musicians invent music on the spot.\n\nIn a well-known study published in 2008, researchers in the United States asked professional jazz pianists to play a specially designed keyboard while lying inside a brain scanner. The musicians alternated between playing a memorised piece and improvising freely. During improvisation, the scans showed reduced activity in a region at the front of the brain associated with self-monitoring and conscious control, while an area linked to self-expression became more active. Later studies of freestyle rappers reported a broadly similar pattern.\n\nOne interpretation is that improvisation requires musicians to switch off, at least partially, the inner critic that constantly judges what they are doing. Rather than evaluating every note before playing it, the performer allows ideas to flow, trusting years of practice to keep them within the rules of the style.\n\nIt would be a mistake, though, to conclude that creativity is simply a matter of letting go. The musicians in these experiments were highly trained experts who had spent thousands of hours mastering scales, harmonies and patterns. Their apparent freedom rested on an extensive store of knowledge that had become automatic. A beginner who silenced their inner critic would be unlikely to produce anything comparable.\n\nMoreover, researchers caution that a scanner is a highly artificial setting, and that studies involving small numbers of participants cannot reveal the full complexity of artistic invention. What the research does suggest is that creativity may involve a delicate balance between discipline and spontaneity: the hard work of learning, followed by the courage to stop thinking and play.","qs":[{"type":"tfng","q":"The pianists who took part in the 2008 study had all played together in the same band.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"The writer believes that beginners could improvise as well as experts if they simply stopped judging themselves.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"According to the passage, what happens to the 'inner critic' during improvisation?","opts":["It becomes less active, so ideas can flow more freely.","It becomes more active and checks every note.","It is replaced by pieces of music learnt by heart.","It stops the musician from following the rules of the style."],"a":0},{"type":"mc","q":"What can be inferred about the experts' 'apparent freedom'?","opts":["It only looked effortless because of years of earlier training.","It was caused by the design of the special keyboard.","It was greater when they played memorised pieces.","It disappeared once they were lying inside the scanner."],"a":0},{"type":"mc","q":"Why does the writer mention that a scanner is 'a highly artificial setting'?","opts":["to point out a limitation of the research","to explain why the musicians played badly","to argue that the studies should never have been carried out","to show that the results apply to every kind of artist"],"a":0}]},{"title":"Why tunes get stuck","text":"Almost everyone has experienced it: a fragment of a song begins playing in the mind and refuses to stop, sometimes for hours. Psychologists call these unwanted repetitions 'involuntary musical imagery', although they are better known by a name borrowed from German, 'earworms'. In one large survey carried out in Finland, around nine in ten people reported having an earworm at least once a week, suggesting that the experience is less a quirk than a normal feature of how the mind works.\n\nWhy do some tunes get stuck more readily than others? In a 2016 study, researchers in London asked around three thousand people to name the songs that most often became earworms for them, and then compared the features of those songs with similar songs that were rarely named. The 'sticky' tunes tended to be relatively fast, with a common, easy-to-sing melodic shape, but they also contained some unusual leaps or repetitions that made them distinctive. In other words, a successful earworm seems to combine the familiar with the surprising.\n\nRecent exposure plays an important part too. Songs heard frequently, or heard shortly before the earworm begins, are particularly likely to return. Stress and tasks that demand little attention, such as repetitive chores, can also leave the mind more open to them.\n\nFor those who find earworms irritating, research offers a few modest remedies. One study found that chewing gum reduced the number of times participants heard a tune in their heads, perhaps because it interferes with the inner 'voice' we use when silently rehearsing sounds. Absorbing tasks, such as a moderately difficult puzzle, may also help. Some people even recommend listening to the whole song, on the theory that an unfinished fragment is what keeps the loop going, though this idea remains largely untested.\n\nFor most people, however, earworms are harmless, and many report that their stuck songs are ones they actually enjoy.","qs":[{"type":"tfng","q":"The survey in Finland suggested that earworms are an unusual experience.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"All the songs in the 2016 study had been in the music charts in the same year.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the 2016 study, what made a tune more likely to become an earworm?","opts":["a mixture of a familiar, simple shape and a few unexpected features","a very slow speed and very few repeated notes","being completely unlike any other song","being sung by a famous performer"],"a":0},{"type":"mc","q":"What can be inferred about the advice to listen to the whole song?","opts":["There is little scientific evidence so far that it works.","It has been proved to be the best remedy.","It works only for people who chew gum.","Researchers have shown that it makes earworms worse."],"a":0},{"type":"mc","q":"What is the main purpose of the passage?","opts":["to explain what earworms are, why they happen and how they might be reduced","to warn readers that earworms are harmful to health","to compare the musical tastes of people in Finland and London","to argue that people should listen to less music"],"a":0}]}],"extra":[{"kind":"collocation","q":"The film ___ the imagination of audiences around the world.","opts":["captured","caught up","took over","held up"],"a":0,"why":"We say a story or idea 'captures the imagination'; the phrasal verbs here have different meanings."},{"kind":"register","q":"Which sentence would suit a formal review in an arts journal?","opts":["The composer's use of silence creates a sense of tension that persists throughout the work.","The bit with the silence is super tense, I loved it.","Honestly, the quiet parts are kind of awesome.","There's loads of silence and it's really dramatic, you know?"],"a":0,"why":"A formal review uses precise, impersonal language; 'super', 'kind of awesome' and 'you know?' are informal."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Their apparent freedom rested on an extensive store of knowledge that had become automatic.'?","opts":["They seemed free only because a great deal of learning had become second nature to them.","They were free because they had forgotten everything they had learnt.","They had little knowledge, so they felt free to experiment.","Their knowledge prevented them from playing freely."],"a":0,"why":"'Apparent' means seeming, 'rested on' means depended on, and 'automatic' knowledge is second nature."},{"kind":"linking","q":"Which sentence best joins the ideas? 'Improvisation feels spontaneous.' + 'It depends on years of disciplined practice.'","opts":["Although improvisation feels spontaneous, it depends on years of disciplined practice.","Because improvisation feels spontaneous, it depends on years of disciplined practice.","Improvisation feels spontaneous, so it depends on years of disciplined practice.","Improvisation feels spontaneous; for example, it depends on years of disciplined practice."],"a":0,"why":"The ideas contrast (spontaneous vs disciplined), so we need a concession: although. The others wrongly show cause or example."},{"kind":"cohesion","q":"Which order is most logical? A: Over time, these patterns become automatic. B: Musicians first practise scales and patterns slowly. C: Only then can they combine them freely while performing.","opts":["B, A, C","A, B, C","C, A, B","B, C, A"],"a":0,"why":"B starts the process ('first'), A follows ('Over time, these patterns'), and C ends it ('Only then')."},{"kind":"wordform","q":"The painting is a striking ___ (juxtapose) of bright colours and deep shadows.","opts":["juxtaposition","juxtaposed","juxtaposing","juxtapose"],"a":0,"why":"After 'a striking' and before 'of' we need a noun: juxtaposition."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'Before the 1840s, painters who wanted to work outdoors had to mix their own colours and carry them in delicate pig's bladders, which often burst. The invention of the metal paint tube changed this. Paint could now be stored for long periods and carried easily, making it far more practical to paint a landscape while looking at it.'","opts":["How a small invention helped painters to work outside","Why landscapes are hard to paint","The life of a famous landscape painter","How colours are made from plants"],"a":0,"why":"The paragraph describes a problem for outdoor painters and how the paint tube solved it."},{"kind":"collocation","q":"The exhibition ___ record numbers of visitors in its first month.","opts":["drew","pulled down","made","did"],"a":0,"why":"An event 'draws' visitors or crowds, meaning it attracts them; 'pulled down', 'made' and 'did' do not have this meaning."},{"kind":"paraphrase","q":"Which sentence means the same as: 'A successful earworm seems to combine the familiar with the surprising.'?","opts":["Tunes that stick usually mix predictable features with unexpected ones.","Only completely new tunes become earworms.","Familiar tunes are never surprising.","Surprising tunes are easier to forget than familiar ones."],"a":0,"why":"'Combine the familiar with the surprising' means it contains both things we expect and things we do not."},{"kind":"linking","q":"___ dismissed by critics at fir   const nx = nextStep();
  $('#goBtn').textContent = !rec.lessons && !rec.placed ? 'Start' : nx && nx.kind === 'test' ? 'Stage test' : 'Continue';
  $('#reviewBtn').textContent = '🔁 Review' + (rec.review.length ? ' (' + rec.review.length + ')' : '');
  $('#homeStats').innerHTML = stat('Streak', '🔥 ' + streak()) + stat('Words', rec.learned.length) + stat('Stages passed', done + ' / 7');
  const sk = Object.keys(SKILL).filter((k) => rec.skills[k] && rec.skills[k][1]);
  $('#skills').innerHTML = sk.map((k) => { const v = rec.skills[k], p = Math.round(v[0] / v[1] * 100); return '<div class="skill"><span>' + SKILL[k] + '</span><span class="bar"><i style="width:' + p + '%"></i></span><span>' + p + '%</span></div>'; }).join('');
  $('#soundBtn').textContent = save.settings.music > 0 ? 'Music on' : 'Music off';
  $('#speakBtn').textContent = save.settings.speak ? 'Read aloud on' : 'Read aloud off';
}
let pathStage = 0;
function renderPath(s) {
  pathStage = s || pathStage || levelNow();
  const st = STAGES[pathStage - 1];
  $('#tabs').innerHTML = STAGES.map((x) => '<button role="tab" aria-selected="' + (x.n === pathStage) + '" class="' + (x.n === pathStage ? 'on' : '') + (x.n > rec.unlocked ? ' locked' : '') + '" data-s="' + x.n + '">' + x.icon + ' ' + x.cefr + '</button>').join('');
  $('#stageHead').innerHTML = '<h2>' + st.icon + ' ' + st.name + '</h2><p>' + st.cefr + (st.ielts ? ' · IELTS ' + st.ielts + ' (practice estimate)' : '') + ' · ' + esc(st.about) + '</p>';
  if (!has(pathStage)) { $('#nodes').innerHTML = '<div class="soon">This stage is coming soon.</div>'; return; }
  const nx = nextStep();
  let h = '';
  CONTENT[pathStage - 1].units.forEach((un, u) => {
    const open = unitOpen(pathStage, u), stars = starsOf(pathStage, u), isNext = nx && nx.kind === 'unit' && nx.s === pathStage && nx.u === u;
    h += '<button class="node' + (open ? '' : ' locked') + (isNext ? ' next' : '') + '" data-u="' + u + '"' + (open ? '' : ' aria-disabled="true"') + '><span class="em" aria-hidden="true">' + (open ? un.emoji : '🔒') + '</span><span><b>' + esc(un.title) + '</b><small>Lesson ' + (u + 1) + '</small></span><span class="st">' + (open ? starRow(stars) : '') + '</span></button>';
  });
  const topen = testOpen(pathStage), t = rec.tests[pathStage];
  h += '<button class="node test' + (topen ? '' : ' locked') + (nx && nx.kind === 'test' && nx.s === pathStage ? ' next' : '') + '" data-test="1"><span class="em" aria-hidden="true">' + (topen ? '🏁' : '🔒') + '</span><span><b>Stage test</b><small>' + (t && t.passed ? 'Passed · best ' + t.best + '%' : t ? 'Best ' + t.best + '% · needs 80%' : '20 questions · needs 80%') + '</small></span><span class="st">' + (t && t.passed ? '✅' : '') + '</span></button>';
  $('#nodes').innerHTML = h;
}
function goNext() {
  const nx = nextStep();
  if (!rec.lessons && !rec.placed && has(2)) { startLesson('place'); return; }
  if (!nx) { renderPath(); showScreen('path'); return; }
  startLesson(nx.kind, nx.s, nx.u);
}
function goHome() { $('#lesson').hidden = true; $('#toast').hidden = true; Speech.stop(); Sound.play('menu'); renderHome(); showScreen('home'); }

document.addEventListener('click', onTap);
$('#nextBtn').addEventListener('click', next);
$('#quitBtn').addEventListener('click', () => { if (L.kind === 'place' && L.place && L.place.best) endLesson(); else goHome(); });
$('#goBtn').addEventListener('click', goNext);
$('#pathBtn').addEventListener('click', () => { renderPath(levelNow()); showScreen('path'); });
$('#reviewBtn').addEventListener('click', () => startLesson('review'));
$('#placeBtn').addEventListener('click', () => startLesson('place'));
$('#pathHomeBtn').addEventListener('click', goHome);
$('#doneHomeBtn').addEventListener('click', goHome);
$('#donePathBtn').addEventListener('click', () => { renderPath(L.kind === 'place' ? levelNow() : L.s || levelNow()); showScreen('path'); });
$('#doneNextBtn').addEventListener('click', goNext);
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-s]'); if (b) renderPath(+b.dataset.s); });
$('#nodes').addEventListener('click', (e) => {
  const b = e.target.closest('.node'); if (!b || b.classList.contains('locked')) return;
  if (b.dataset.test) startLesson('test', pathStage); else startLesson('unit', pathStage, +b.dataset.u);
});
$('#soundBtn').addEventListener('click', () => { toggleMusic(); renderHome(); });
$('#speakBtn').addEventListener('click', () => { save.settings.speak = !save.settings.speak; writeSave(); renderHome(); if (save.settings.speak) Speech.say('Read aloud is on'); else Speech.stop(); });
window.addEventListener('keydown', (e) => {
  if ($('#lesson').hidden) return;
  const q = L.qs[L.i];
  if (e.key === 'Enter' && L.answered) { e.preventDefault(); next(); return; }
  if (q && q.kind === 'choice' && !L.answered && /^[1-4]$/.test(e.key) && +e.key <= q.opts.length) chooseOpt(q, +e.key - 1);
  if (q && q.kind === 'spell' && !L.answered && /^[a-z]$/i.test(e.key)) { const t = $$('#tiles .tile').find((x) => !x.classList.contains('used') && x.textContent === e.key.toLowerCase()); if (t) t.click(); }
  if (e.key === 'Escape') goHome();
});
arcadeGuards(() => Speech.stop());
arcadeLinks();

window.__quest = { L, rec, save, STAGES, CONTENT, has, next, startLesson, nextStep, unitOpen, testOpen, wordQ, unitLesson, stageTest, spotQ, showQ, Speech,
  // answer the current question: right = true picks the right answer (or builds / spells it), false picks a wrong one
  answer(right) {
    const q = L.qs[L.i]; if (!q || L.answered) return false;
    if (q.kind === 'choice') chooseOpt(q, right ? q.a : (q.a + 1) % q.opts.length);
    else if (q.kind === 'spot') $$('#spot .tile')[right ? q.bad : (q.bad + 1) % q.tiles.length].click();
    else if (q.kind === 'order') {
      const used = [];
      if (right) q.words.forEach((w) => used.push(q.tiles.findIndex((t, k) => t === w && !used.includes(k))));
      else { q.tiles.forEach((_, k) => used.unshift(k)); if (used.map((k) => q.tiles[k]).join(' ') === q.sentence) used.reverse(); }
      q.built = used; renderBuild(q); $('#checkBtn').click();
    }
    else if (q.kind === 'spell') { if (!right) { const bad = $$('#tiles .tile').find((t) => t.textContent !== q.word[q.pos]); if (bad) bad.click(); } q.word.split('').slice(q.pos).forEach((ch) => { const t = $$('#tiles .tile').find((x) => !x.classList.contains('used') && x.textContent === ch); if (t) t.click(); }); }
    return true;
  } };
renderHome();
showScreen('home');
})();
</script>

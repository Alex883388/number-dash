"why":"After 'So + adjective' at the start of a sentence, invert the verb and subject: So scarce was water that..."},{"q":"The ___ of clean water to every home took decades to achieve.","opts":["provision","provide","provided","provident"],"a":0,"why":"After 'The' and before 'of' we need a noun: provide becomes provision (nominalisation)."},{"q":"It is essential that every school ___ access to safe drinking water.","opts":["have","having","to have","had had"],"a":0,"why":"After 'It is essential that...', formal English uses the base form (the subjunctive): every school have."},{"q":"If farmers hadn't adopted drip irrigation, they ___ able to grow crops here now.","opts":["wouldn't be","wouldn't have been","won't be","weren't"],"a":0,"why":"Mixed conditional: a past condition (hadn't adopted) with a present result (now) takes 'would + verb'."},{"q":"Global demand for food ___ to rise as the population grows.","opts":["is expected","expects","is expecting","has expected"],"a":0,"why":"Demand cannot expect anything itself, so use the passive reporting verb: is expected to rise."},{"q":"Only by reducing waste ___ enough food for everyone on the planet.","opts":["can we produce","we can produce","we produce","can produce we"],"a":0,"why":"When 'Only by + -ing' starts the sentence, the main clause uses question order: can we produce."},{"q":"The new crops ___ to have increased yields, although the data is still incomplete.","opts":["seem","seems","are seemed","seeming"],"a":0,"why":"'Seem to have + past participle' is a cautious way to describe a past result; the plural subject 'crops' needs 'seem'."},{"q":"If the town didn't have a desalination plant, it ___ out of water during last summer's drought.","opts":["would have run","would run","will have run","had run"],"a":0,"why":"Mixed conditional: a present fact (the town has a plant) with a past result (last summer) takes 'would have + past participle'."},{"q":"___ was the demand for clean water that the new plant had to run day and night.","opts":["Such","So","Too","Very"],"a":0,"why":"'Such + be + noun phrase + that...' stresses how great something was: Such was the demand that... 'So' would need an adjective."}],"sentences":["Rice is a staple food for billions of people around the world.","It is essential that every child have access to safe drinking water.","Desalination plants turn seawater into water that is safe to drink.","The provision of clean water to every home took decades.","Strawberries are so perishable that they must reach the shops within days.","Only by reducing waste can we produce enough food for everyone."],"reading":[{"title":"Catching water from the air","text":"In some of the driest places on Earth, the air itself may hold part of the answer to water scarcity. Along the coasts of Chile and Morocco, communities have experimented with an unusual technique: catching fog.\n\nA fog collector is essentially a large panel of fine mesh stretched between two poles. As wind pushes fog through the mesh, tiny water droplets cling to the threads, merge into larger drops and run down into a gutter at the bottom. From there, the water flows through pipes into storage tanks, where it can be used for drinking, cooking or watering vegetable gardens. The system requires no electricity and has few moving parts, which makes it relatively cheap to build and maintain.\n\nThe idea is not entirely new. Desert plants and animals have long relied on fog, and researchers have studied a beetle in the Namib Desert that collects droplets on its bumpy back before tipping them towards its mouth. Engineers have borrowed ideas from such creatures in an attempt to design more efficient materials.\n\nFog harvesting is not, however, a solution for everyone. It works only where fog is frequent and a steady wind blows it inland, usually on hills or mountains near the sea. Even in suitable places, the amount collected varies greatly from one day to the next, and nets can be torn by strong winds. For these reasons, experts tend to see fog collection as a useful supplement to other water sources rather than a replacement for them.\n\nNevertheless, for a remote village where the nearest well is far away, a few nets on a hillside can make daily life noticeably easier.","qs":[{"type":"tfng","q":"Fog collectors need a supply of electricity in order to work.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"The first fog collectors were built in Morocco.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"The quantity of water that a fog net gathers can change considerably from day to day.","opts":["True","False","Not Given"],"a":0},{"type":"mc","q":"Which place would probably be the most suitable for a fog collector?","opts":["a windy hillside close to the sea","a sheltered valley far from the coast","a flat inland desert with clear skies","a city centre surrounded by tall buildings"],"a":0},{"type":"mc","q":"Which statement best summarises the writer's view of fog harvesting?","opts":["It is a helpful addition to other water sources in the right places.","It will soon replace wells and rivers as the main source of water.","It is too expensive for most villages to use.","It has failed in every place where it has been tried."],"a":0}]},{"title":"The city that nearly ran dry","text":"In early 2018, the people of Cape Town, South Africa, faced an extraordinary prospect. After three years of unusually low rainfall, the dams that supply the city had fallen to dangerously low levels, and officials warned of 'Day Zero': the date on which most taps would be switched off. If that day came, residents would have to queue at around two hundred collection points for a daily allowance of 25 litres per person.\n\nThe warning had a dramatic effect. Residents were asked to limit their use to 50 litres per person per day, roughly the amount used in a few minutes of an ordinary shower. People saved the water from their sinks to flush toilets, kept showers to two minutes and let their gardens turn brown. Hotels removed the plugs from their baths and encouraged guests to take quick showers.\n\nThese efforts were combined with action by the authorities. Water pressure across the network was reduced to limit leaks and waste, and farmers agreed to release part of their water allowance to the city. As a result, Cape Town's daily water consumption fell to roughly half of what it had been in 2015.\n\nDay Zero was postponed several times and, when good rains finally arrived in the winter of 2018, it was called off altogether. Experts point out that the crisis was avoided not by a single technological solution but by millions of small changes in daily behaviour.\n\nThe episode offers a lesson for other growing cities. As populations rise and rainfall becomes less predictable, many places may need to treat water not as an endless resource but as one that must be carefully managed.","qs":[{"type":"tfng","q":"Before the crisis, Cape Town had experienced several years of heavier rain than usual.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Day Zero was first predicted by a team of university scientists.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the passage, what would have happened on Day Zero?","opts":["People would have had to fetch a small daily ration of water from shared points.","All use of water would have been banned for one day.","Farmers would have been given extra water for their crops.","The price of water would have doubled overnight."],"a":0},{"type":"mc","q":"What does the writer imply about how the crisis was avoided?","opts":["Changes in everyday habits played a central part.","New technology solved the problem almost on its own.","The city authorities did nothing to help.","The rains alone would have prevented it without any other changes."],"a":0},{"type":"mc","q":"What is the main purpose of the final paragraph?","opts":["to suggest that Cape Town's experience is relevant to other cities","to describe the heavy rains of the winter of 2018","to criticise the officials who ran the city","to explain how dams are designed and built"],"a":0}]}],"extra":[{"kind":"collocation","q":"Governments must ___ steps to reduce food waste.","opts":["take","make","do","put"],"a":0,"why":"The fixed phrase is 'take steps' (take action); make, do and put do not go with 'steps' here."},{"kind":"preposition","q":"Many farmers have switched ___ crops that need less water.","opts":["to","at","on","for"],"a":0,"why":"We 'switch to' something new (or 'switch from' the old thing)."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Fog collection is a supplement to other water sources rather than a replacement for them.'?","opts":["Fog collection adds to other water sources but cannot take their place.","Fog collection should be used instead of other water sources.","Other water sources are less useful than fog collection.","Fog collection is used only when other water sources have disappeared."],"a":0,"why":"A supplement is something extra that is added; a replacement takes the place of something."},{"kind":"linking","q":"The nets are cheap to build. ___, they produce very little water when there is no wind.","opts":["On the other hand","As a result","In the same way","For this reason"],"a":0,"why":"The second sentence gives a disadvantage that contrasts with the first, so we need 'On the other hand'."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'In many countries, a large share of the food that is grown is never eaten. Some is lost on farms or during transport, while some is thrown away by shops and households. Reducing this waste could feed more people without using any extra land.'","opts":["The potential of cutting food waste","How to grow vegetables at home","Why transport costs are rising","The early history of farming"],"a":0,"why":"The paragraph describes where food is wasted and ends with the benefit of reducing that waste."},{"kind":"wordform","q":"Farmers in dry areas need crops that are ___ (resist) to drought.","opts":["resistant","resistance","resisting","resistible"],"a":0,"why":"After 'are' and before 'to' we need an adjective: resistant to something."},{"kind":"register","q":"Which sentence is most suitable for an IELTS Writing Task 1 report?","opts":["Water consumption in the city fell by approximately fifty per cent between 2015 and 2018.","Water use dropped loads, which was awesome.","People basically used half the water, more or less.","Check it out: water use halved in three years!"],"a":0,"why":"A Task 1 report gives figures precisely and neutrally ('approximately fifty per cent'), without chatty words or exclamations."},{"kind":"cohesion","q":"Which order is most logical? A: This forced officials to warn of a date when the taps would be turned off. B: Three dry winters left the city's dams almost empty. C: Faced with this warning, residents cut their water use by half.","opts":["B, A, C","A, B, C","C, B, A","B, C, A"],"a":0,"why":"B gives the cause, A ('This forced...') the official response, and C ('Faced with this warning') how residents reacted."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Many places may need to treat water not as an endless resource but as one that must be carefully managed.'?","opts":["Many places may have to stop assuming water will never run out and look after it carefully.","Water is an endless resource, so it needs very little management.","Many places should use more water than they do now.","Water will soon run out in every place on Earth."],"a":0,"why":"'Not as an endless resource' means no longer assuming it will never run out, and 'carefully managed' means looked after with care."},{"kind":"collocation","q":"The long drought ___ a heavy toll on the farmers' harvests.","opts":["took","made","gave","did"],"a":0,"why":"'Take a toll on' something is a fixed phrase meaning to cause it serious harm over time."}]}]},{"stage":7,"units":[{"id":"band8-1","title":"Language and culture","emoji":"🗣️","words":[{"w":"ubiquitous","def":"seeming to be everywhere at the same time","ex":"English words such as 'weekend' and 'email' have become ___ in languages around the world.","pos":"adj","syn":["widespread","universal"],"ant":["rare"],"forms":{"adj":"ubiquitous","noun":"ubiquity"}},{"w":"nuance","def":"a very slight difference in meaning, feeling or tone","ex":"A skilled translator captures every ___ of the original poem, not just its basic meaning.","pos":"noun","syn":["subtlety"],"forms":{"noun":"nuance","adj":"nuanced"}},{"w":"idiomatic","def":"natural to native speakers, especially in its use of fixed expressions","ex":"Her English was not just correct but highly ___, full of expressions that native speakers use.","pos":"adj","forms":{"adj":"idiomatic","noun":"idiom"}},{"w":"convey","def":"to communicate or express a feeling, idea or message","ex":"A single gesture can ___ respect in one culture and rudeness in another.","pos":"verb","syn":["communicate","express"]},{"w":"assimilate","def":"to take in and absorb something so that it becomes part of you","ex":"Over the centuries, English has managed to ___ words from almost every language it has met.","pos":"verb","syn":["absorb"],"forms":{"verb":"assimilate","noun":"assimilation"}},{"w":"dialect","def":"a form of a language spoken in one area, with some of its own words and grammar","ex":"In the next valley, people spoke a ___ that visitors from the city struggled to follow.","pos":"noun"},{"w":"proficiency","def":"a high level of skill or ability in something","ex":"The exam measures ___ in reading, writing, listening and speaking.","pos":"noun","syn":["skill","competence"],"forms":{"noun":"proficiency","adj":"proficient"}},{"w":"revitalise","def":"to give new life and energy to something that was becoming weaker","ex":"Schools that teach in Welsh have helped to ___ the language.","pos":"verb","syn":["revive"],"forms":{"verb":"revitalise","noun":"revitalisation"}},{"w":"coherent","def":"clear, logical and easy to follow","ex":"A ___ essay moves smoothly and logically from one idea to the next.","pos":"adj","ant":["incoherent","confused"],"forms":{"adj":"coherent","noun":"coherence"}},{"w":"inherent","def":"existing as a natural and permanent part of something","ex":"Some loss of meaning is ___ in translation, however skilled the translator.","pos":"adj","forms":{"adj":"inherent","adv":"inherently"}},{"w":"lingua franca","def":"a shared language used between people whose first languages are different","ex":"English often serves as a ___ at international science conferences.","pos":"phrase"},{"w":"etymology","def":"the origin and history of a word and its meaning","ex":"The ___ of 'breakfast' is simple: the first meal of the day breaks the night's fast.","pos":"noun","forms":{"noun":"etymology","adj":"etymological"}},{"w":"vernacular","def":"the plain, everyday language that ordinary people speak, rather than formal or technical language","ex":"Scientists writing for children must translate technical terms into the ___, using everyday words.","pos":"noun"},{"w":"connotation","def":"a feeling or idea that a word suggests in addition to its basic meaning","ex":"'Cheap' and 'inexpensive' mean almost the same, but 'cheap' can carry a negative ___ of poor quality.","pos":"noun","forms":{"noun":"connotation","verb":"connote"}},{"w":"ambiguous","def":"having more than one possible meaning, so that it is unclear","ex":"The sentence 'I saw her duck' is ___, since 'duck' could be a bird or a quick movement.","pos":"adj","ant":["clear","unambiguous"],"forms":{"adj":"ambiguous","noun":"ambiguity","adv":"ambiguously"}},{"w":"articulate","def":"to pronounce sounds or words clearly and carefully","ex":"Singers are trained to ___ every consonant so that the words can be heard at the back of the hall.","pos":"verb","forms":{"verb":"articulate","noun":"articulation"}},{"w":"colloquial","def":"used in informal conversation rather than in formal speech or writing","ex":"'Gonna' is a ___ form of 'going to' and is best avoided in an essay.","pos":"adj","syn":["informal","conversational"],"ant":["formal"],"forms":{"adj":"colloquial","noun":"colloquialism"}},{"w":"lexicon","def":"all the words of a language, or all the words that one person knows","ex":"The Oxford English Dictionary aims to record the entire ___ of English, from everyday words to rare technical terms.","pos":"noun","syn":["vocabulary"]},{"w":"polyglot","def":"a person who can speak many languages","ex":"The word ___ comes from Greek and means 'many tongues', a fitting name for someone who speaks many languages.","pos":"noun"},{"w":"denote","def":"to be a sign of something, or to mean it","ex":"On most maps, blue lines are used to ___ rivers and streams.","pos":"verb","syn":["represent","indicate"]}],"grammar":[{"q":"Little ___ that his invented word would one day appear in dictionaries.","opts":["did he realise","he realised","he did realise","realised he"],"a":0,"why":"When 'Little' starts the sentence with a negative meaning, use question order: Little did he realise."},{"q":"___ I admire her novels, I find them very hard to translate.","opts":["Much as","As much","Despite","However much as"],"a":0,"why":"'Much as + clause' is a formal way of saying 'Although': Much as I admire them..."},{"q":"___ been for the printing press, English spelling might never have become standardised.","opts":["Had it not","Had not it","Were it not","Did it not"],"a":0,"why":"'Had it not been for X' is the inverted form of 'If it had not been for X' about the past."},{"q":"The two languages are related, ___ only distantly.","opts":["albeit","despite","whereas","even"],"a":0,"why":"'Albeit' means 'although' and can be followed by a short phrase without a verb."},{"q":"___ its many borrowings from French, English has a large number of formal words.","opts":["Owing to","Because","Due","Thanks for"],"a":0,"why":"'Owing to' is followed by a noun phrase to give a cause; 'because' would need 'of'."},{"q":"Such ___ the popularity of the books that they were translated into dozens of languages.","opts":["was","were","did","had"],"a":0,"why":"In 'Such + be + subject + that...', the verb agrees with the singular subject 'the popularity'."},{"q":"___ subtitles, many viewers would be unable to enjoy films in foreign languages.","opts":["But for","Except","Unless","Despite"],"a":0,"why":"'But for + noun' is a formal way of saying 'If it were not for': But for subtitles... 'Unless' and 'Except' do not work here, and 'Despite' makes no sense."},{"q":"Rarely, if ever, ___ a dictionary taken as long to complete as the Oxford English Dictionary.","opts":["has","have","did","was"],"a":0,"why":"After 'Rarely, if ever' at the start, invert: has + singular subject + past participle (taken). 'Did' would need the base form 'take'."},{"q":"___ language a child is born into, they will master its basic grammar within the first few years of life.","opts":["Whatever","However","Whoever","Wherever"],"a":0,"why":"'Whatever + noun' means 'no matter which': whatever language. 'However', 'Whoever' and 'Wherever' cannot come directly before a noun like this."},{"q":"The rules of English spelling are so complex ___ to confuse even many native speakers.","opts":["as","that","so","for"],"a":0,"why":"The pattern is 'so + adjective + as to + verb': so complex as to confuse. 'That' would need a full clause."}],"sentences":["English has assimilated words from almost every language it has encountered.","A skilled translator must capture every nuance of the original text.","Little did he realise that his invented word would become so popular.","English has become the lingua franca of international science.","Rarely, if ever, has a dictionary taken so long to complete.","Many English words carry connotations that learners find hard to grasp."],"reading":[{"title":"Does language shape thought?","text":"Does the language we speak influence the way we think? The question has fascinated thinkers for generations, and few ideas in linguistics have been as hotly contested.\n\nThe best-known version of the claim is associated with the American linguist Benjamin Lee Whorf, who argued in the 1930s that the structure of a language shapes how its speakers perceive the world. Whorf suggested, for instance, that the Hopi language of North America contained no words for time as Europeans understood it, and that its speakers therefore experienced time differently. Later researchers challenged his analysis, showing that Hopi does in fact have many ways of expressing time, and for several decades the whole idea fell out of favour.\n\nRecent studies, however, have revived interest in a more modest form of the theory. Speakers of Guugu Yimithirr, an Aboriginal language of northern Australia, describe locations using compass directions rather than words such as 'left' and 'right'. Instead of saying 'the cup is to your left', they might say 'the cup is to the north'. Remarkably, speakers appear to keep track of their orientation at all times, even in unfamiliar buildings, an ability that seems closely linked to the demands of their language.\n\nColour offers another intriguing example. Russian has two separate basic words for lighter and darker blue, and in laboratory experiments Russian speakers were slightly quicker than English speakers at telling apart shades that fall on either side of that boundary.\n\nCrucially, none of this suggests that language imprisons thought. English speakers can learn to use compass directions, and anyone can see the difference between two shades of blue. What the evidence implies is subtler: the habits of a language may gently steer attention towards certain features of experience, making some distinctions more automatic than others. In that sense, learning a new language may offer not only new words, but also new ways of noticing.","qs":[{"type":"tfng","q":"Whorf's claims about the Hopi language were later shown to be inaccurate.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Guugu Yimithirr is spoken by more people today than it was a century ago.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"In the experiments, Russian speakers could see differences between shades of blue that English speakers were unable to see.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"What does the writer imply about the Guugu Yimithirr speakers' sense of direction?","opts":["It is probably sharpened by the constant need to use compass terms when speaking.","It is something they are born with, whichever language they learn.","It works less well inside unfamiliar buildings than outdoors.","It is less reliable than the sense of direction of English speakers."],"a":0},{"type":"mc","q":"Which statement best expresses the writer's overall position?","opts":["Language may influence what we pay attention to, but it does not limit what we can think.","Language completely determines what its speakers are able to think.","Language has no effect at all on the way people think.","Whorf's original theory has now been fully confirmed."],"a":0}]},{"title":"A language born in a playground","text":"Linguists rarely have the chance to watch a language come into existence. Almost every language in use today developed gradually over thousands of years, long before anyone could record how it began. In Nicaragua in the late 1970s and 1980s, however, researchers were able to observe something close to the birth of a new language.\n\nUntil then, deaf people in Nicaragua had few opportunities to meet one another. Most grew up in hearing families and communicated with relatives through simple gestures of their own invention, known as home signs, which were not shared beyond the household. That changed when new schools for deaf children opened in the capital, Managua, bringing hundreds of pupils together for the first time.\n\nThe teachers concentrated on lip-reading and spoken Spanish, with limited success. Outside the classroom, though, in the playground and on the school buses, the children began combining their different home signs into a shared system of communication. Strikingly, when younger children later joined the schools and learnt this system from the older pupils, they did not simply copy it. They made it faster, more regular and more grammatically complex.\n\nIn 1986, the American linguist Judy Kegl was invited to study the children's signing. She and later researchers, notably Ann Senghas, found clear differences between the generations. Older signers, for instance, tended to describe an event such as something rolling down a hill with a single sign showing the whole movement at once, much as hearing people do when they gesture while speaking. Younger signers were more likely to break the event into separate signs for the manner of the movement and for its direction, and then combine them in sequence, a pattern typical of fully developed languages.\n\nMany linguists regard Nicaraguan Sign Language as powerful evidence that children do not merely absorb a language but actively reshape it. The case does not settle every debate about how much of our capacity for grammar is innate. It does suggest, however, that when young minds have a community to communicate with, they can turn a loose collection of gestures into a structured language within a few generations of learners.","qs":[{"type":"tfng","q":"Before the new schools opened, deaf people across Nicaragua already shared one common sign language.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"The girls and the boys at the schools developed different versions of the signing system.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the passage, how did the younger children change the signing system?","opts":["They made it quicker, more consistent and richer in grammar.","They replaced it with the spoken Spanish taught in class.","They copied it exactly as the older pupils used it.","They returned to the home signs used by their own families."],"a":0},{"type":"mc","q":"What can be inferred from the comparison with hearing people's gestures?","opts":["The older signers' descriptions were closer to everyday gesture than to a fully developed language.","Hearing people in Nicaragua had learnt to sign from the deaf pupils.","The younger signers could not describe movement at all.","Gestures made while speaking are more complex than any sign language."],"a":0},{"type":"mc","q":"Which statement best expresses the main idea of the passage?","opts":["A new language arose when deaf children were brought together, and each new group of learners made it more structured.","Lip-reading is the most effective way to teach deaf children.","Nicaraguan Sign Language has existed for thousands of years.","Linguists have proved exactly how much of grammar is innate."],"a":0}]}],"extra":[{"kind":"collocation","q":"The theory remains ___ contested among linguists.","opts":["hotly","warmly","burningly","boilingly"],"a":0,"why":"'Hotly contested' (or 'hotly debated') is a fixed collocation meaning argued about strongly."},{"kind":"paraphrase","q":"Which is the closest paraphrase of: 'Language may gently steer attention towards certain features of experience.'?","opts":["The language we speak may make us more likely to notice some things.","Language forces us to ignore most of what we experience.","Our experiences decide which language we will speak.","People who pay close attention learn languages more quickly."],"a":0,"why":"'Steer attention towards' means guide what we notice, and 'may gently' keeps the claim cautious."},{"kind":"register","q":"Which is the most appropriate way to begin the conclusion of an academic essay?","opts":["In conclusion, the evidence indicates that language influences, but does not determine, thought.","So yeah, language kind of changes how we think.","To wrap things up, I totally think language matters.","Anyway, that's basically it about language and thought."],"a":0,"why":"A formal conclusion is impersonal and precise; 'so yeah', 'wrap things up' and 'basically' are conversational."},{"kind":"cohesion","q":"Which sentence best fills the gap? 'Whorf claimed that Hopi had no words for time. ___ As a result, the theory fell out of favour for decades.'","opts":["Later research, however, showed that Hopi has many ways of expressing time.","Hopi is one of many languages spoken in North America.","Similarly, many other languages have words for time.","This claim was therefore accepted by every linguist."],"a":0,"why":"Only the disproof of Whorf's claim explains why the theory 'fell out of favour' in the next sentence."},{"kind":"wordform","q":"Many English words are ___ (etymology) related to Latin.","opts":["etymologically","etymological","etymology","etymologist"],"a":0,"why":"We need an adverb to describe the adjective 'related': etymologically related."},{"kind":"idiom","q":"Jokes are hard to translate because humour often gets ___ in translation.","opts":["lost","missed","dropped","forgotten"],"a":0,"why":"The idiom is 'lost in translation': meaning or effect that disappears when words change language."},{"kind":"linking","q":"The island's valleys are deep and steep; ___, whistling a message was often far quicker than walking to deliver it.","opts":["hence","whereas","albeit","nonetheless"],"a":0,"why":"Quicker whistling is the result of the steep valleys, so we need a cause-and-effect link: hence. The others show contrast or concession."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'Some words cross borders more easily than others. Terms for new technology, food and sport are often borrowed directly, so that words like football or sushi sound similar in dozens of languages. Words for basic ideas, such as numbers, body parts and family members, resist borrowing and can remain stable for thousands of years.'","opts":["Which kinds of words are most likely to be borrowed","The international history of football","Why numbers are difficult to learn","How new technology is invented"],"a":0,"why":"The paragraph contrasts words that are easily borrowed with words that resist borrowing; the other headings pick out single examples."},{"kind":"collocation","q":"A year spent abroad can ___ a lifelong interest in other cultures.","opts":["kindle","light up","burn","fire off"],"a":0,"why":"To 'kindle an interest' means to start it, like lighting a small fire. 'Light up', 'burn' and 'fire off' do not combine with 'interest'."},{"kind":"paraphrase","q":"Which is the closest paraphrase of: 'Each one transposes an ordinary spoken language into whistles.'?","opts":["Each turns an existing spoken language into a whistled form.","Each is a completely new language made only of whistles.","Each can be understood by speakers of any language.","Each replaces whistling with ordinary speech."],"a":0,"why":"'Transposes into' means changes into another form, and 'an ordinary spoken language' means one that already exists."}]},{"id":"band8-2","title":"Cities and change","emoji":"🏙️","words":[{"w":"exacerbate","def":"to make a problem or a bad situation worse","ex":"Cutting down street trees can ___ the heat in city centres during summer.","pos":"verb","syn":["worsen"],"ant":["ease","relieve"],"forms":{"verb":"exacerbate","noun":"exacerbation"}},{"w":"mitigate","def":"to make something harmful or unpleasant less severe","ex":"Green roofs help to ___ flooding by soaking up rainwater.","pos":"verb","syn":["reduce","ease"],"ant":["worsen"],"forms":{"verb":"mitigate","noun":"mitigation"}},{"w":"gridlock","def":"a situation in which traffic is so heavy that it cannot move at all","ex":"When the bridge closed, the city centre was brought to a standstill by hours of ___.","pos":"noun"},{"w":"regeneration","def":"the process of improving a run-down area so that it becomes busy and attractive again","ex":"The ___ of the old docks turned empty warehouses into homes, offices and museums.","pos":"noun","forms":{"noun":"regeneration","verb":"regenerate"}},{"w":"metropolis","def":"a very large, important and busy city","ex":"Within a few decades, the small fishing town had grown into a bustling ___ of millions.","pos":"noun","forms":{"noun":"metropolis","adj":"metropolitan"}},{"w":"densely","def":"with a lot of people or things packed closely together","ex":"Hong Kong is one of the most ___ populated places on Earth.","pos":"adv","ant":["sparsely"],"forms":{"adv":"densely","adj":"dense","noun":"density"}},{"w":"sprawl","def":"the spread of a city into the countryside around it, often without careful planning","ex":"Urban ___ has swallowed farmland on the edges of many fast-growing cities.","pos":"noun"},{"w":"unprecedented","def":"never having happened or existed before","ex":"The twentieth century saw cities grow at an ___ rate.","pos":"adj","syn":["unparalleled"]},{"w":"pedestrianise","def":"to close a street to traffic so that only people on foot can use it","ex":"The council plans to ___ the high street, so cars will no longer be allowed there.","pos":"verb","forms":{"verb":"pedestrianise","noun":"pedestrianisation"}},{"w":"resilient","def":"able to recover quickly after something difficult or damaging happens","ex":"A ___ city can recover quickly after floods, storms or power cuts.","pos":"adj","syn":["tough"],"forms":{"adj":"resilient","noun":"resilience"}},{"w":"amenity","def":"a useful or pleasant place or service, such as a park, a library or a pool","ex":"The new library is an ___ that the whole neighbourhood can enjoy.","pos":"noun"},{"w":"dilapidated","def":"old, broken and in very poor condition","ex":"The ___ factory, with its broken windows and rotting roof, was finally restored.","pos":"adj","syn":["crumbling"]},{"w":"commuter belt","def":"the area around a large city where many people who work in the city live","ex":"House prices in the ___ around London have risen as more workers move out of the capital.","pos":"phrase"},{"w":"retrofit","def":"to add new parts or equipment to an older building or machine","ex":"Engineers are able to ___ old buses with electric motors, so they no longer need diesel.","pos":"verb"},{"w":"thoroughfare","def":"a main road through a town or city that many people and vehicles use","ex":"Once a busy ___ full of lorries, the street is now a quiet avenue lined with trees.","pos":"noun"},{"w":"municipal","def":"belonging to, or run by, the local government of a town or city","ex":"The ___ swimming pool is run by the city council and costs very little to use.","pos":"adj"},{"w":"repurpose","def":"to change something so that it can be used for a different purpose","ex":"Instead of knocking down the old power station, architects chose to ___ it as an art gallery.","pos":"verb","syn":["adapt"]},{"w":"permeable","def":"allowing liquids, such as rainwater, to pass through","ex":"Paving made from ___ materials lets rainwater soak into the ground instead of flooding the street.","pos":"adj","ant":["impermeable","waterproof"]},{"w":"footfall","def":"the number of people who visit a shop, street or area during a period of time","ex":"After the street was closed to cars, ___ rose and many shops reported higher sales.","pos":"noun"},{"w":"encroach","def":"to spread gradually into an area that belongs to something or someone else","ex":"As the city expanded, new housing began to ___ on the surrounding farmland.","pos":"verb","forms":{"verb":"encroach","noun":"encroachment"}}],"grammar":[{"q":"Not until the Underground opened in 1863 ___ travel quickly beneath London's streets.","opts":["could Londoners","Londoners could","Londoners can","can Londoners"],"a":0,"why":"After 'Not until + time' at the start, the main clause is inverted, and the past needs 'could'."},{"q":"The city introduced a scheme ___ residents can hire bicycles cheaply from docking stations.","opts":["whereby","whereas","wherever","which"],"a":0,"why":"'Whereby' means 'by which' or 'under which': a scheme whereby residents can hire bicycles."},{"q":"The council planted thousands of trees, ___ lowering summer temperatures in the streets.","opts":["thereby","whereby","whereas","so that"],"a":0,"why":"'Thereby + -ing' shows the result of the action just described: planted trees, thereby lowering temperatures."},{"q":"___ the high cost, most residents supported the new bridge.","opts":["Notwithstanding","Although","Even though","Whereas"],"a":0,"why":"'Notwithstanding' is a formal preposition meaning 'despite', so it can be followed by a noun phrase."},{"q":"Were the city ___ more cycle lanes, fewer people would drive to work.","opts":["to build","build","building","built"],"a":0,"why":"'Were + subject + to + verb' is a formal inverted way of saying 'If the city built...'."},{"q":"By 2050, roughly two thirds of the world's people ___ in cities.","opts":["are expected to be living","are expecting to be lived","are expected living","have expected to live"],"a":0,"why":"Use the passive reporting verb with a continuous infinitive for a predicted situation: are expected to be living."},{"q":"It was only when the river flooded the city centre ___ the council took the problem seriously.","opts":["that","which","what","so"],"a":0,"why":"The cleft pattern is 'It was only when + clause + that...'; it stresses the moment something finally happened."},{"q":"Only once the new metro line had opened ___ traffic in the centre begin to ease.","opts":["did","had","was","does"],"a":0,"why":"After 'Only once + clause' at the start, invert the main clause; with the base form 'begin' in the past we need 'did'."},{"q":"The old market hall is currently ___ into a library and community centre.","opts":["being converted","been converted","converting","to be converted"],"a":0,"why":"For a passive action in progress now, use 'is being + past participle': is currently being converted."},{"q":"There is growing evidence ___ green spaces improve the well-being of city residents.","opts":["that","which","what","of"],"a":0,"why":"'Evidence that + clause' explains what the evidence shows. 'Of' would need a noun or '-ing', and 'which' and 'what' do not fit."}],"sentences":["Green roofs help to mitigate flooding by soaking up rainwater.","The regeneration of the old docks created thousands of new homes.","Hong Kong is one of the most densely populated places on Earth.","Cutting down street trees can exacerbate the summer heat.","The council plans to retrofit its tower blocks with solar panels.","Architects chose to repurpose the power station as an art gallery."],"reading":[{"title":"A stream beneath the motorway","text":"For much of the late twentieth century, the Cheonggyecheon stream in central Seoul was invisible. It had been covered with concrete in the 1950s and 1960s, and an elevated motorway was later built above it, carrying vast numbers of vehicles through the heart of the South Korean capital.\n\nIn 2003, the city authorities took the unprecedented step of demolishing the motorway and uncovering the stream. Critics predicted that removing such a major road would exacerbate traffic problems and bring the centre to a standstill. In the event, the anticipated gridlock never materialised, partly because the project coincided with a major reorganisation of the city's bus network, which encouraged many commuters to leave their cars at home.\n\nWhen the restored stream opened in 2005, its success with the public was immediate. The banks, lined with walkways, bridges and planting, attracted large numbers of visitors, and the area quickly became one of the city's most popular amenities. Studies also indicated that temperatures along the stream on hot days were several degrees lower than on nearby roads, suggesting that urban waterways can help to mitigate the heat that builds up in dense city centres.\n\nNevertheless, the project has not escaped criticism. Since the original stream had largely dried up, much of the water that flows through it today has to be pumped in from the Han River and from underground sources, at considerable ongoing cost. Some ecologists argue that the result resembles a long, landscaped fountain more than a genuine natural habitat, while others point out that the design gave priority to appearance rather than to the needs of wildlife.\n\nEven so, Cheonggyecheon has inspired planners around the world. Its significance lies less in its precise design than in the question it raised: if a city can live without a motorway that once seemed essential, what other assumptions about urban life might be open to change?","qs":[{"type":"tfng","q":"Building the new stream cost less than building the original motorway had done.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"Most of the water in today's stream reaches it naturally from the stream's original source.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"According to the passage, why did the predicted traffic problems not happen?","opts":["Changes to public transport at the same time persuaded many people not to drive.","Most drivers chose to move out of the city centre.","A new motorway was built alongside the stream.","The stream was used as a route for boats instead of cars."],"a":0},{"type":"mc","q":"What can be inferred about the ecologists mentioned in the fourth paragraph?","opts":["They doubt that the stream has real value as a home for wildlife.","They want the stream to be covered with concrete again.","They believe the water should come only from underground.","They were responsible for designing the walkways and bridges."],"a":0},{"type":"mc","q":"What is the writer's main purpose in the final paragraph?","opts":["to suggest that the project's wider importance lies in challenging fixed ideas about cities","to recommend that every city should demolish its motorways","to describe the exact design of the stream in detail","to argue that the critics of the project were completely wrong"],"a":0}]},{"title":"The Great Stink","text":"In the hot summer of 1858, the River Thames in London smelt so foul that the period became known as the Great Stink. For decades, the city's waste had flowed more or less directly into the river, and as London's population soared, the problem had grown steadily worse. With the stench drifting into the Houses of Parliament, where curtains were soaked in chemicals in an attempt to mask it, politicians who had long delayed action suddenly found the matter impossible to ignore.\n\nWithin weeks, funding was approved for an ambitious scheme designed by Joseph Bazalgette, chief engineer of the city's Metropolitan Board of Works. His plan was to intercept waste before it reached the central stretch of the river and carry it eastwards, beyond the city, through a network of large brick tunnels. Construction occupied much of the following two decades and required some 130 kilometres of main sewers, linked to roughly 1,800 kilometres of smaller street sewers. Along parts of the river, the tunnels were hidden inside newly built embankments, which also created roads and riverside gardens.\n\nBazalgette is often praised for his foresight. Having calculated the pipe sizes the city required, he reportedly doubled them to allow for future growth, a decision that helped the system cope with a population far larger than he could have imagined.\n\nIronically, the scheme was largely motivated by a mistaken belief that disease spread through bad air. In fact, many illnesses were carried by dirty water. By keeping waste away from the drinking water supply, the new sewers nevertheless brought dramatic improvements in public health.\n\nEven so, no design lasts for ever. By the early twenty-first century, heavy rain regularly overwhelmed the Victorian system, sending overflow into the Thames. A new 25-kilometre 'super sewer' beneath the river, completed in the mid-2020s, was built to tackle the problem, a reminder that the hidden structures beneath a city must evolve as the city above them does.","qs":[{"type":"tfng","q":"Once the smell reached Parliament, the authorities acted on the problem without much further delay.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Bazalgette's design was chosen in a competition between several engineers.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What does the writer find ironic about the scheme?","opts":["It improved health for a reason that its planners had not understood.","It made the smell of the river worse instead of better.","It was paid for by the politicians who had opposed it.","It was finished long before anyone needed it."],"a":0},{"type":"mc","q":"What can be inferred about Bazalgette's decision to double the pipe sizes?","opts":["It kept the system useful for far longer than it might otherwise have been.","It made the project too expensive to finish.","It was criticised as a waste of money by later engineers.","It caused the overflows that happen during heavy rain today."],"a":0},{"type":"mc","q":"What is the main point of the final paragraph?","opts":["Even a highly successful system must eventually be updated as a city changes.","The Victorian sewers were badly designed from the start.","Heavy rain in London is more common than it was in the past.","The new tunnel will be the last one London ever needs."],"a":0}]}],"extra":[{"kind":"collocation","q":"The plan to close the main road ___ fierce opposition from local drivers.","opts":["met with","came across","got into","fell over"],"a":0,"why":"We say a plan 'meets with opposition' (or criticism, approval); the other verbs do not combine with 'opposition'."},{"kind":"linking","q":"Car use in the centre fell sharply; ___, air quality improved.","opts":["consequently","nonetheless","conversely","in contrast"],"a":0,"why":"Better air is the result of less car use, so we need a cause-and-effect link: consequently."},{"kind":"paraphrase","q":"Which sentence means the same as: 'The anticipated gridlock never materialised.'?","opts":["The traffic jams that people expected did not happen.","The traffic jams happened earlier than expected.","Nobody had expected any traffic problems.","The traffic jams were even worse than people had feared."],"a":0,"why":"'Anticipated' means expected, and 'never materialised' means it did not actually happen."},{"kind":"register","q":"Which sentence is most suitable for an IELTS Writing Task 1 report?","opts":["The proportion of residents commuting by bus rose steadily between 2000 and 2020.","Loads more people started taking the bus, which is great.","Bus use went up a lot, as you can see.","Basically, buses got way more popular over time."],"a":0,"why":"A Task 1 report describes data precisely and neutrally, without opinions ('great') or chatty words ('loads', 'basically')."},{"kind":"cohesion","q":"Which order is most logical? A: As a result, a plan was made to clean it and bring wildlife back. B: The river had been polluted for decades. C: Within ten years, otters had returned to its banks.","opts":["B, A, C","A, B, C","C, B, A","B, C, A"],"a":0,"why":"B gives the problem, A ('As a result') the response, and C ('Within ten years') the outcome."},{"kind":"wordform","q":"Many residents were ___ (sceptic) about the plan at first.","opts":["sceptical","scepticism","sceptic","sceptically"],"a":0,"why":"After 'were' and before 'about' we need an adjective: sceptical (British spelling)."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'In a number of cities, old railway lines that no longer carry trains have been turned into raised parks. The Promenade Plantée in Paris, opened in 1993, was one of the first, and New York's High Line later followed its example. Such projects give residents green space without the need to knock down any buildings.'","opts":["New life for disused railways","The history of the Paris metro","Why trains are faster than cars","How a railway bridge is built"],"a":0,"why":"The paragraph describes old railway lines being turned into parks and the benefit this brings."},{"kind":"collocation","q":"Planners must ___ a balance between building new homes and protecting green space.","opts":["strike","hit","beat","knock"],"a":0,"why":"'Strike a balance' is a fixed phrase meaning to find a fair middle point between two needs."},{"kind":"linking","q":"___ its high cost, the new tram line has proved hugely popular with residents.","opts":["For all","Because of","Thanks to","As well as"],"a":0,"why":"'For all + noun' is a formal way of saying 'despite'. A high cost does not cause popularity, so 'because of' and 'thanks to' do not fit."},{"kind":"wordform","q":"The city's population has grown ___ (exponent) over the past fifty years.","opts":["exponentially","exponential","exponent","exponents"],"a":0,"why":"We need an adverb to describe how it has grown: exponentially, meaning faster and faster."}]},{"id":"band8-3","title":"Exploring space","emoji":"🚀","words":[{"w":"trajectory","def":"the curved path that a moving object follows through the air or through space","ex":"Engineers calculated the probe's ___ so that it would swing past Jupiter and gain speed.","pos":"noun","syn":["path","course"]},{"w":"propulsion","def":"the force that pushes a vehicle forward, or the system that produces this force","ex":"Ion ___ pushes a spacecraft forward very gently, but for months or even years.","pos":"noun","forms":{"noun":"propulsion","verb":"propel"}},{"w":"celestial","def":"relating to the sky or to outer space","ex":"Ancient sailors found their way by observing the Sun, the Moon and other ___ bodies.","pos":"adj","syn":["heavenly"]},{"w":"habitable","def":"suitable or good enough for people or other living things to live in","ex":"Astronomers are searching for ___ planets where liquid water could exist on the surface.","pos":"adj","ant":["uninhabitable"]},{"w":"speculate","def":"to form ideas or guesses about something without having firm evidence","ex":"Scientists can only ___ about what might lie beneath the thick ice of Europa.","pos":"verb","syn":["guess","wonder"],"forms":{"verb":"speculate","noun":"speculation","adj":"speculative"}},{"w":"anomaly","def":"something that is different from what is normal or expected","ex":"A strange ___ in the data turned out to be caused by a faulty instrument.","pos":"noun","syn":["irregularity"],"forms":{"noun":"anomaly","adj":"anomalous"}},{"w":"pristine","def":"in perfect condition, as clean and untouched as when new","ex":"Samples kept in a ___ state, untouched by Earth's air, are far more valuable to scientists.","pos":"adj","syn":["untouched","spotless"]},{"w":"payload","def":"the cargo, such as a satellite or supplies, that a rocket or spacecraft carries","ex":"The rocket's ___ was a weather satellite that will help forecasters predict storms.","pos":"noun","syn":["cargo"]},{"w":"rudimentary","def":"very basic and simple, often an early form of something","ex":"The earliest space probes carried ___ cameras compared with today's instruments.","pos":"adj","syn":["basic","primitive"],"ant":["advanced"]},{"w":"feasible","def":"possible and practical to do","ex":"Reusable rockets have made frequent launches financially ___.","pos":"adj","syn":["practical","possible"],"ant":["impractical"],"forms":{"adj":"feasible","noun":"feasibility"}},{"w":"debris","def":"broken pieces of something that has been destroyed or thrown away","ex":"Space ___, such as old satellite parts, can damage working spacecraft.","pos":"noun"},{"w":"deploy","def":"to move something into position or open it out so that it is ready to use","ex":"Once in space, the telescope had to ___ its huge sunshield.","pos":"verb","forms":{"verb":"deploy","noun":"deployment"}},{"w":"cosmonaut","def":"an astronaut from the Soviet Union or Russia","ex":"Yuri Gagarin, a Soviet ___, became the first person to travel into space in 1961.","pos":"noun","syn":["astronaut"]},{"w":"luminous","def":"giving out light, or shining brightly, especially in the dark","ex":"Through the telescope, the comet appeared as a ___ smudge with a long, faint tail.","pos":"adj","syn":["glowing","bright"],"ant":["dim"]},{"w":"inhospitable","def":"very difficult to live or survive in because the conditions are so harsh","ex":"With its crushing pressure and a surface hot enough to melt lead, Venus is extremely ___.","pos":"adj","ant":["hospitable","welcoming"]},{"w":"rendezvous","def":"a planned meeting, especially of two spacecraft in space","ex":"After two days in orbit, the capsule made a successful ___ with the space station.","pos":"noun"},{"w":"microgravity","def":"the condition of near weightlessness that astronauts experience in orbit","ex":"In ___, astronauts' muscles weaken, so they must exercise for about two hours a day.","pos":"noun"},{"w":"terrain","def":"land of a particular kind, described by what its surface is like","ex":"The rover was designed to climb over steep, uneven ___ such as the walls of craters.","pos":"noun","syn":["ground","landscape"]},{"w":"elliptical","def":"shaped like a flattened circle; oval","ex":"Comets follow long, ___ orbits that carry them close to the Sun and then far out again.","pos":"adj","syn":["oval"],"forms":{"adj":"elliptical","noun":"ellipse"}},{"w":"jettison","def":"to throw away something that is no longer needed, especially from a vehicle that is moving","ex":"Once their fuel is used up, rockets ___ their empty stages, which fall back towards Earth.","pos":"verb","syn":["discard","dump"]}],"grammar":[{"q":"No sooner ___ the rocket cleared the tower than the crowd began to cheer.","opts":["had","has","did","was"],"a":0,"why":"'No sooner had + subject + past participle... than' shows that one past event followed the other at once."},{"q":"Only by landing probes on Venus ___ its surface up close.","opts":["have scientists seen","scientists have seen","scientists saw","did scientists saw"],"a":0,"why":"When 'Only by + -ing' starts the sentence, the main clause uses question order: have scientists seen."},{"q":"The launch was postponed ___ a fault in the fuel system.","opts":["on account of","because","owing","so as"],"a":0,"why":"'On account of' is followed by a noun phrase to give the cause; 'because' would need 'of'."},{"q":"Had the crew not trained so thoroughly, they ___ the emergency so calmly.","opts":["could not have handled","could not handle","cannot have handled","will not have handled"],"a":0,"why":"'Had... not' is an inverted past conditional, so the result needs 'could not have + past participle'."},{"q":"___ fascinating it may be, Venus is far too hot for any human visit.","opts":["However","Although","Despite","Whatever"],"a":0,"why":"'However + adjective + subject + may be' shows concession: no matter how fascinating it is."},{"q":"The telescope, ___ sunshield is about the size of a tennis court, had to be folded to fit inside the rocket.","opts":["whose","which","its","that's"],"a":0,"why":"'Whose' shows possession in a relative clause: the telescope's sunshield."},{"q":"At no point ___ the astronauts in any real danger during the spacewalk.","opts":["were","was","did","had"],"a":0,"why":"'At no point' is negative, so the verb comes before the subject; the plural 'astronauts' needs 'were'."},{"q":"___ through space for more than forty years, Voyager 1 is now the most distant human-made object.","opts":["Having travelled","Travelled","To travel","Having been travelled"],"a":0,"why":"Voyager has done the travelling (active, over a long earlier period), so use 'Having + past participle'. 'Travel' has no passive."},{"q":"___ a crew ever reach Mars, they will need to grow much of their own food.","opts":["Should","Would","Had","Were"],"a":0,"why":"'Should + subject + base form' is a formal way to say 'If...ever': Should a crew reach. 'Were' would need 'to reach'."},{"q":"___ that sunlight takes about eight minutes to reach us, we always see the Sun as it was slightly in the past.","opts":["Given","Giving","Despite","Although"],"a":0,"why":"'Given that + clause' means 'because we know that'. 'Despite' needs a noun, and 'Although that' is not possible."}],"sentences":["No sooner had the rocket cleared the tower than the crowd cheered.","Astronomers are searching for habitable planets beyond our solar system.","Space debris poses a growing threat to working satellites.","Reusable rockets have made frequent launches financially feasible.","Rockets jettison empty stages once their fuel is used up.","At no point were the astronauts in any real danger."],"reading":[{"title":"Time capsules from the asteroids","text":"Meteorites have been falling to Earth for billions of years, and scientists have long studied them for clues about the early solar system. Yet these natural visitors have a serious drawback: by the time they are found, they have been heated while passing through the atmosphere and have often lain on the ground for years, absorbing water and microbes. Distinguishing what they originally contained from what they have picked up on Earth is notoriously difficult.\n\nTo obtain more reliable material, space agencies have attempted something far more ambitious: collecting rock and dust directly from asteroids and bringing it home. Japan's Hayabusa2 mission returned samples from the asteroid Ryugu in 2020, and NASA's OSIRIS-REx spacecraft delivered material from the asteroid Bennu in 2023. In both cases, the samples were sealed inside capsules, protected during their fiery descent and opened only in specially designed clean rooms.\n\nThe reason for such precautions is that asteroids like Ryugu and Bennu are thought to have changed relatively little since the solar system formed around four and a half billion years ago. They therefore act as time capsules, preserving the raw ingredients from which the planets were assembled. Analyses of both samples have revealed water-bearing minerals and a variety of carbon-based molecules, including some of the amino acids that living things use to build proteins.\n\nThese findings do not mean that life existed on the asteroids. They do, however, lend weight to the idea that some of the building blocks of life may have been delivered to the early Earth from space. Equally importantly, because the material has never been exposed to Earth's environment, researchers can be considerably more confident that what they detect was genuinely present in space.\n\nPerhaps the most far-sighted decision was to set aside a large part of the material, untouched, for future generations. Scientists recognise that instruments not yet invented may one day answer questions that nobody has yet thought to ask.","qs":[{"type":"tfng","q":"Meteorites can be altered by conditions on Earth after they land.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"The Bennu samples contained a greater number of amino acids than the Ryugu samples.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"The writer states that the samples prove life once existed on the asteroids.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"Why were the samples most likely opened only in special clean rooms?","opts":["to avoid mixing material from Earth with material from space","to protect scientists from dangerous chemicals","to keep the samples at a very high temperature","to allow members of the public to watch"],"a":0},{"type":"mc","q":"Why does the writer mention instruments 'not yet invented'?","opts":["to explain why some of the material has deliberately been left unstudied","to criticise the quality of the equipment used today","to suggest that the missions were launched too early","to warn that the samples will soon be used up"],"a":0}]},{"title":"One twin in orbit","text":"Sending people on long journeys to Mars will require a detailed understanding of how the human body copes with months in space. One of the most unusual experiments in this field took advantage of a rare opportunity. In 2015, the American astronaut Scott Kelly began a stay of almost a year aboard the International Space Station, while his identical twin brother, Mark, also a former astronaut, remained on Earth. Because the brothers share the same genes, scientists could compare them to see which changes might be caused by spaceflight itself.\n\nTen research teams examined everything from the brothers' blood and gut bacteria to their thinking skills. Some of the findings were striking. In microgravity, body fluids shift towards the head, and Scott showed changes in his eyes and in the walls of a major artery in his neck. The caps at the ends of his chromosomes, known as telomeres, which normally shorten with age, unexpectedly grew longer during the mission, only to shorten rapidly once he returned. Many of his genes also changed their level of activity.\n\nReassuringly, most of these changes faded within months of his return to Earth. His immune system responded normally to a flu vaccine given in space, and the bacteria in his gut, which had altered during the flight, returned to something close to their earlier state. However, a small proportion of the changes in gene activity persisted for at least six months, and his performance in some mental tests declined slightly after landing.\n\nThe researchers were careful not to overstate their conclusions. A study of a single pair of people cannot show which effects would appear in every astronaut, and some differences between the twins may have had other causes. Nevertheless, the project provided a valuable starting point, identifying areas that deserve closer study before crews undertake the far longer voyages that a mission to Mars would involve.","qs":[{"type":"tfng","q":"Mark Kelly had never travelled into space himself.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Scott Kelly was selected for the mission because he had a twin brother.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What happened to Scott Kelly's telomeres?","opts":["Contrary to expectations, they lengthened in space but quickly shortened after he came back.","They shortened in space and then grew back to their normal length on Earth.","They stayed exactly the same throughout the study.","They grew longer in space and remained longer for years afterwards."],"a":0},{"type":"mc","q":"Why was it useful that the brothers were identical twins?","opts":["Any differences between them were unlikely to be caused by their genes.","They could both live on the space station at the same time.","Identical twins are known to cope better with spaceflight.","It meant that the study could include many more people."],"a":0},{"type":"mc","q":"What is the main purpose of the final paragraph?","opts":["to point out the limits of the study while recognising its value","to argue that the study proved spaceflight is safe for everyone","to suggest that a mission to Mars should be cancelled","to describe the next experiment that the twins will take part in"],"a":0}]}],"extra":[{"kind":"collocation","q":"The new findings ___ weight to the idea that some of life's ingredients came from space.","opts":["lend","borrow","put","throw"],"a":0,"why":"'Lend weight to an idea' is a fixed phrase meaning to make it seem more likely to be true."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Distinguishing what they originally contained from what they have picked up on Earth is notoriously difficult.'?","opts":["It is famously hard to tell which substances came from space and which were added on Earth.","Scientists can easily separate material from space and material from Earth.","Meteorites pick up very little material after they land on Earth.","It is extremely difficult to find meteorites once they have landed."],"a":0,"why":"'Distinguishing X from Y' means telling them apart, and 'notoriously' means well known for being so."},{"kind":"register","q":"Which sentence is most appropriate in a scientific report?","opts":["The samples were stored in a nitrogen-filled cabinet to prevent contamination.","We stuck the samples in a box so nothing got on them.","The samples went into a cabinet, which was pretty cool.","To keep them clean, the samples were, like, put away safely."],"a":0,"why":"Scientific reports use the passive, precise terms (nitrogen-filled, contamination) and no chatty words."},{"kind":"linking","q":"The capsule remained sealed throughout the journey; ___, the samples were never exposed to Earth's air.","opts":["as a result","in spite of this","by contrast","even so"],"a":0,"why":"Never being exposed is the result of the sealing, so we need a cause-and-effect link: as a result."},{"kind":"cohesion","q":"Which sentence best fills the gap? 'Meteorites are valuable to scientists. ___ This is why sample-return missions are so important.'","opts":["However, they are often changed by Earth's conditions before they are found.","Furthermore, they are completely free from contamination.","For example, they have been falling for billions of years.","Therefore, no further space missions are needed."],"a":0,"why":"Only the limitation of meteorites explains why missions that collect clean samples matter."},{"kind":"wordform","q":"Asteroids preserve material that has remained largely ___ (change) for billions of years.","opts":["unchanged","changing","changeable","unchangeable"],"a":0,"why":"We need an adjective meaning 'not changed': unchanged. 'Unchangeable' means it cannot be changed."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'On the International Space Station, water is far too precious to waste. Moisture from the crew's breath and sweat is collected from the air, and even urine is filtered and purified. As a result, almost all of the station's water is recycled and used again.'","opts":["How the space station recycles its water","Why astronauts drink less water than people on Earth","The dangers of sweating in space","How water was discovered on the Moon"],"a":0,"why":"Every sentence explains how water is collected, cleaned and reused on board the station."},{"kind":"collocation","q":"The discovery of ice on the Moon has ___ fresh impetus to plans for a lunar base.","opts":["given","made","taken","done"],"a":0,"why":"We 'give impetus to' a plan, meaning we make it move forward faster; make, take and do do not go with 'impetus'."},{"kind":"paraphrase","q":"Which sentence means the same as: 'The researchers were careful not to overstate their conclusions.'?","opts":["The researchers took care not to claim more than their results showed.","The researchers refused to publish any conclusions.","The researchers made their conclusions sound as dramatic as possible.","The researchers could not reach any conclusions at all."],"a":0,"why":"To 'overstate' something is to make it seem bigger or more certain than it really is."},{"kind":"cohesion","q":"Which sentence best fills the gap? 'Muscles and bones weaken in microgravity. ___ Even so, many astronauts need several weeks to regain their strength after landing.'","opts":["To reduce this, crew members exercise for about two hours every day.","As a result, astronauts never need to exercise in space.","For example, the station circles the Earth about every ninety minutes.","Therefore, nobody has ever felt weak after a long mission."],"a":0,"why":"'Even so' needs something that should have helped: daily exercise reduces the weakening, yet recovery still takes weeks."}]},{"id":"band8-4","title":"Medicine and health science","emoji":"🔬","words":[{"w":"immunity","def":"the body's ability to protect itself against a particular disease","ex":"Vaccines help the body build ___ without having to catch the illness first.","pos":"noun","forms":{"noun":"immunity","adj":"immune"}},{"w":"pathogen","def":"a tiny living thing, such as a virus or bacterium, that causes disease","ex":"A virus is one kind of ___; certain bacteria and fungi are others.","pos":"noun","syn":["germ"]},{"w":"diagnosis","def":"the act of identifying which illness a person has by examining them","ex":"Early ___ makes many conditions much easier to treat.","pos":"noun","forms":{"noun":"diagnosis","verb":"diagnose"}},{"w":"efficacy","def":"the ability of something, such as a medicine, to produce the result it is meant to","ex":"Clinical trials test the ___ of a new medicine as well as its safety.","pos":"noun","syn":["effectiveness"]},{"w":"placebo","def":"a pill or treatment with no active medicine in it, used in tests to compare results","ex":"Half the volunteers received the real drug and half received a ___ that looked identical.","pos":"noun"},{"w":"contagious","def":"easily spread from one person to another by contact","ex":"Chickenpox is highly ___, so children who have it usually stay at home for a few days.","pos":"adj","syn":["infectious","catching"]},{"w":"dormant","def":"not active now, but able to become active later","ex":"Some bacteria can remain ___ inside a tough protective coat until conditions improve.","pos":"adj","syn":["inactive"],"ant":["active"]},{"w":"prognosis","def":"a doctor's opinion about how an illness or injury is likely to develop","ex":"After the operation, the doctor said the ___ was excellent and she would make a full recovery.","pos":"noun"},{"w":"adverse","def":"harmful or unpleasant; having a negative effect","ex":"Like all medicines, the drug can have ___ effects in a small number of people.","pos":"adj","syn":["harmful","negative"],"ant":["beneficial"]},{"w":"antibiotic","def":"a medicine that kills bacteria or stops them from growing","ex":"Penicillin, discovered by Alexander Fleming in 1928, became the first widely used ___.","pos":"noun"},{"w":"alleviate","def":"to make pain or a problem less severe","ex":"Gentle stretching can help to ___ back pain.","pos":"verb","syn":["relieve","ease"],"ant":["worsen"],"forms":{"verb":"alleviate","noun":"alleviation"}},{"w":"susceptible","def":"easily affected or harmed by something","ex":"Young children are more ___ to ear infections than adults are.","pos":"adj","syn":["vulnerable"],"ant":["resistant"],"forms":{"adj":"susceptible","noun":"susceptibility"}},{"w":"eradicate","def":"to destroy or get rid of something completely","ex":"A worldwide vaccination campaign helped to ___ smallpox, which was declared gone for good in 1980.","pos":"verb","syn":["eliminate","destroy"],"forms":{"verb":"eradicate","noun":"eradication"}},{"w":"inoculate","def":"to protect a person against a disease by putting a weak or harmless form of it into their body","ex":"In 1796, Edward Jenner used material from cowpox to ___ a young boy against smallpox.","pos":"verb","syn":["vaccinate"],"forms":{"verb":"inoculate","noun":"inoculation"}},{"w":"clinical","def":"connected with examining and treating patients, rather than with theory or laboratory work","ex":"Before a new medicine is approved, it must pass several stages of ___ trials involving volunteers.","pos":"adj"},{"w":"genome","def":"the complete set of genetic information in a living thing","ex":"Scientists finished reading almost the entire human ___ in 2003, after thirteen years of work.","pos":"noun"},{"w":"dosage","def":"the amount of a medicine that should be taken at one time, and how often","ex":"The correct ___ for a child is usually much lower than for an adult.","pos":"noun","syn":["dose"]},{"w":"metabolism","def":"the chemical processes in the body that turn food into energy","ex":"Hummingbirds have an extremely fast ___, so they must feed almost constantly.","pos":"noun","forms":{"noun":"metabolism","adj":"metabolic"}},{"w":"sedentary","def":"involving a lot of sitting and very little physical activity","ex":"Doctors warn that a ___ lifestyle, with long hours in front of screens, can harm children's health.","pos":"adj","syn":["inactive"],"ant":["active"]},{"w":"longevity","def":"long life, or the length of a person's or animal's life","ex":"Greenland sharks are famous for their ___: some are thought to live for more than 250 years.","pos":"noun"}],"grammar":[{"q":"Doctors recommend that every patient ___ the full course of treatment.","opts":["complete","completed","completing","to complete"],"a":0,"why":"After 'recommend that', formal English uses the base form (the subjunctive): every patient complete."},{"q":"It was not until the 1940s ___ penicillin was produced on a large scale.","opts":["that","when","which","so"],"a":0,"why":"'It was not until + time + that...' is a fixed cleft pattern that stresses when something finally happened."},{"q":"Effective ___ the treatment is, it is not suitable for very young children.","opts":["though","however","despite","even"],"a":0,"why":"'Adjective + though + subject + verb' is a formal concession: Effective though it is = Although it is effective."},{"q":"Hand-washing has become far more common, ___ has led to fewer stomach infections.","opts":["which","what","that","it"],"a":0,"why":"After a comma, 'which' can refer to the whole previous idea; 'that' cannot follow a comma like this."},{"q":"Vaccines are thought ___ millions of lives over the past century.","opts":["to have saved","to save","having saved","that they saved"],"a":0,"why":"'Over the past century' refers to past time, so use the perfect infinitive: are thought to have saved."},{"q":"Under no circumstances ___ antibiotics be shared with other people.","opts":["should","must not","should not","can't"],"a":0,"why":"'Under no circumstances' is already negative and needs inversion, so use 'should' without 'not'."},{"q":"Scarcely ___ the vaccine been approved when millions of doses were ordered.","opts":["had","has","did","was"],"a":0,"why":"'Scarcely had + subject + past participle... when' shows that one past event followed another immediately."},{"q":"___ the right dose, the medicine can relieve pain within an hour.","opts":["Taken at","Taking at","Having taken at","To take at"],"a":0,"why":"The medicine is taken by the patient (passive meaning), so the participle clause starts with the past participle 'Taken'."},{"q":"If the trial ___ to fail, the company would lose years of work.","opts":["were","was being","is","has"],"a":0,"why":"'If + subject + were to + verb' describes an unlikely or imagined future event, followed by 'would' in the result clause."},{"q":"Only later ___ that they had been given a placebo rather than the real drug.","opts":["did the volunteers discover","the volunteers discovered","had discovered the volunteers","the volunteers did discover"],"a":0,"why":"When 'Only later' starts the sentence, the main clause uses question order: did the volunteers discover."}],"sentences":["Vaccines help the body build immunity against a particular disease.","Early diagnosis makes many illnesses far easier to treat.","Doctors recommend that every patient complete the full course of antibiotics.","Gentle exercise can help to alleviate the symptoms of back pain.","A worldwide campaign helped to eradicate smallpox by 1980.","Greenland sharks are thought to live for more than 250 years."],"reading":[{"title":"The power of expectation","text":"In clinical trials, new medicines are usually compared not with nothing at all but with a placebo: a pill or treatment that looks identical to the real one but contains no active ingredient. Strikingly, many volunteers who receive the placebo report that they feel better. Far from being a nuisance, this so-called placebo effect has become a fascinating subject of research in its own right.\n\nThe effect appears to depend heavily on expectation. Studies have found that, in some circumstances, two placebo pills tend to work better than one, injections better than pills, and pills described as expensive better than those described as cheap. Even colour may play a part. Such findings suggest that the brain, anticipating relief, can alter how the body experiences symptoms, particularly pain, which is strongly influenced by attention and mood.\n\nMore surprising still are studies of open-label placebos, in which patients are told quite openly that the pills they are taking contain no medicine. In several trials, a proportion of these patients nevertheless reported meaningful improvements in their symptoms. Researchers are still debating why: the ritual of taking a pill, the care and attention of a doctor, or simply the hope of getting better may all contribute.\n\nIt is important, however, not to exaggerate what placebos can do. Their effects are largely confined to symptoms that people feel and report, such as pain, tiredness or nausea. A placebo cannot destroy bacteria or mend a broken bone, and relying on one instead of proven treatment could be dangerous. The reverse phenomenon, known as the nocebo effect, also exists: people warned about possible side effects sometimes experience them even when they have been given no active drug.\n\nFor doctors, the lesson may not be to prescribe sugar pills, but to recognise that the way a treatment is explained and delivered can influence how well it works.","qs":[{"type":"tfng","q":"Blue placebo pills have been shown to work better than red ones.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"According to the passage, a placebo can help a broken bone to heal.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"How does the writer explain the effect of placebos on pain?","opts":["The expectation of relief can change how the body experiences symptoms.","Placebo pills contain small amounts of real medicine.","Pain usually disappears on its own after a few days.","Patients who expect relief are given stronger medicines."],"a":0},{"type":"mc","q":"What does the writer imply in the final paragraph?","opts":["The way doctors communicate with patients may form part of an effective treatment.","Doctors should give sugar pills instead of real medicines.","Placebos are more dangerous than most real medicines.","Patients should not be told how their treatment works."],"a":0},{"type":"mc","q":"What is the main idea of the passage?","opts":["The placebo effect is real and intriguing, but its power is limited.","Placebos can cure most illnesses if patients believe in them.","Clinical trials no longer need to use placebos.","The nocebo effect is more important than the placebo effect."],"a":0}]},{"title":"The accidental ray","text":"In November 1895, the German physicist Wilhelm Röntgen was experimenting with a glass tube through which he passed an electric current. Although the tube was covered in black card, he noticed that a screen coated with a special chemical was glowing faintly on a bench nearby. Some invisible form of radiation, it seemed, was passing straight through the card. Not knowing what it was, Röntgen called it 'X', the symbol used in mathematics for an unknown quantity.\n\nOver the following weeks, he investigated the mysterious rays with great care, discovering that they passed easily through paper, wood and flesh but were blocked by denser materials such as metal and bone. He also produced an image of the bones in his wife's hand, complete with her wedding ring. When he published his findings at the end of the year, the news spread around the world with remarkable speed, and within months doctors in several countries were using X-rays to locate broken bones and swallowed objects.\n\nRöntgen declined to patent his discovery, reportedly believing that it should benefit everyone, and in 1901 he received the first Nobel Prize in Physics.\n\nThe early enthusiasm, however, outpaced understanding. Since nobody yet realised that high doses of radiation could harm living tissue, X-rays were used with little caution. Researchers who exposed themselves repeatedly suffered burns, and for several decades some shoe shops even offered X-ray machines that allowed customers to see the bones of their feet inside new shoes. Only gradually did scientists establish safe limits.\n\nToday, X-rays remain one of the most widely used tools in medicine, a

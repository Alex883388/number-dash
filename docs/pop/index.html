<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.ARCADE_HOME = "../";</script>
<title>Number Pop</title>
<meta name="description" content="Tap number bubbles that add up to the big number. Hit it exactly and they pop: number bonds, sums to 50, take away and times tables.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root {
  --sky: #e6f3fc; --sky-top: #8fd1fb; --sky-bot: #e8f6ff; --ink: #29345a; --ink-soft: #5d6890; --card: #fdfeff; --card-2: #eef5fc; --line: #d0dff0;
  --sun: #ffc94d; --sun-deep: #e2a526; --sun-ink: #4a3500; --mint: #4fd1a5; --mint-deep: #2a9f78; --mint-soft: #d9f7ea; --lilac: #9d84ff; --lilac-soft: #ece6ff;
  --coral: #ff7b86; --coral-deep: #d9505d; --coral-soft: #ffe1e4; --sky-blue: #5cb8ff; --pink: #ff9fcf;
  --door: #fff3d6; --door-edge: #f0b544; --door-ink: #3a3f6b; --veil: rgba(230, 243, 252, .6);
  --shadow: 0 12px 32px rgba(41, 52, 90, .16); --shadow-sm: 0 4px 14px rgba(41, 52, 90, .14);
  --font-display: "Fredoka", "Arial Rounded MT Bold", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #1c2147; --sky-top: #1d2350; --sky-bot: #3b3a7e; --ink: #edf0ff; --ink-soft: #b4bbe3; --card: #283063; --card-2: #222955; --line: #3b437f;
    --sun: #ffcd5a; --sun-deep: #d99f2c; --sun-ink: #3d2a00; --mint: #5adbb0; --mint-deep: #5adbb0; --mint-soft: #1f4a4a; --lilac: #ab95ff; --lilac-soft: #352f6e;
    --coral: #ff8a94; --coral-deep: #ff8a94; --coral-soft: #4d2a45; --door: #fff1d2; --veil: rgba(28, 33, 71, .55);
    --shadow: 0 14px 36px rgba(0, 0, 0, .42); --shadow-sm: 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #1c2147; --sky-top: #1d2350; --sky-bot: #3b3a7e; --ink: #edf0ff; --ink-soft: #b4bbe3; --card: #283063; --card-2: #222955; --line: #3b437f;
  --sun: #ffcd5a; --sun-deep: #d99f2c; --sun-ink: #3d2a00; --mint: #5adbb0; --mint-deep: #5adbb0; --mint-soft: #1f4a4a; --lilac: #ab95ff; --lilac-soft: #352f6e;
  --coral: #ff8a94; --coral-deep: #ff8a94; --coral-soft: #4d2a45; --door: #fff1d2; --veil: rgba(28, 33, 71, .55);
  --shadow: 0 14px 36px rgba(0, 0, 0, .42); --shadow-sm: 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  background: linear-gradient(var(--sky-top), var(--sky-bot) 75%) fixed; background-color: var(--sky-bot);
}
button { font: inherit; color: inherit; }
button, label, input, .btn, a { touch-action: manipulation; }
[hidden] { display: none !important; }

/* buttons */
.btn {
  font: 600 1.05rem/1.1 var(--font-display); color: var(--ink); background: var(--card-2); border: 2px solid var(--line); border-radius: 16px;
  padding: .75em 1.15em; box-shadow: 0 4px 0 var(--line); cursor: pointer; text-decoration: none; display: inline-block;
  transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:hover { background: var(--card); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn:focus-visible, .seg input:focus-visible + span { outline: 3px solid var(--lilac); outline-offset: 3px; }
.btn.sun { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); box-shadow: 0 4px 0 var(--sun-deep); }
.btn.sun:active { box-shadow: 0 1px 0 var(--sun-deep); }
.btn.big { font-size: 1.6rem; padding: .6em 2.2em; border-radius: 22px; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

/* menu screens: cards over the game */
#screens {
  position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto; pointer-events: none; touch-action: pan-y; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
}
#screens.dim { background: var(--veil); pointer-events: auto; }
.screen { pointer-events: auto; width: min(100%, 600px); animation: rise .35s ease both; }
.card { background: var(--card); border-radius: 28px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 34px); display: grid; gap: 18px; text-align: center; }
.logo { margin: 0; font: 700 clamp(2.5rem, 9vw, 4rem)/.95 var(--font-display); text-wrap: balance; }
.logo span { color: var(--mint-deep); }
.tag { margin: 0 auto; max-width: 40ch; color: var(--ink-soft); font-size: 1.08rem; line-height: 1.5; text-wrap: balance; }
.how { margin: 0; color: var(--ink-soft); font-weight: 700; }
.small-card h2 { margin: 0; font: 700 clamp(1.9rem, 6vw, 2.6rem)/1.05 var(--font-display); text-wrap: balance; }
.small-card p { margin: 0; color: var(--ink-soft); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; margin: 0; }
.stats div { background: var(--card-2); border-radius: 16px; padding: 12px 6px; min-width: 0; }
.stats dt { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 800; }
.stats dd { margin: 4px 0 0; font: 700 1.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; font: 600 .95rem/1.15 var(--font-display); padding: .55em .85em; border-radius: 14px; background: var(--card-2); border: 2px solid var(--line); }
.seg input:checked + span { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); }
@media (pointer: coarse) { .seg span { min-height: 48px; box-sizing: border-box; display: grid; place-items: center; } }
.seg-title { margin: 0 0 8px; font: 600 .9rem/1 var(--font-display); color: var(--ink-soft); }
.stars { font-size: 2.4rem; letter-spacing: .1em; line-height: 1; }
.stars .off { opacity: .22; filter: grayscale(1); }

/* the HUD along the top while playing */
#hud { position: fixed; left: 0; right: 0; top: 0; pointer-events: none; z-index: 10; }
.hud-top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.chipbox { background: var(--card); border-radius: 99px; box-shadow: var(--shadow-sm); }
.hud-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 600 1.05rem/1 var(--font-display); padding: 8px 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.soft { font-size: .9rem; padding: 7px 12px; color: var(--ink-soft); }
.hud-btn { pointer-events: auto; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow-sm); cursor: pointer; display: grid; place-items: center; flex: none; color: var(--ink); }
.hud-btn:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
@media (pointer: coarse) { .hud-btn { width: 58px; height: 58px; } }

/* toasts and screen-reader text */
.toast {
  position: fixed; left: 50%; top: var(--toast-top, 42%); translate: -50% 0; z-index: 30; pointer-events: none; font: 700 1.4rem/1.1 var(--font-display);
  padding: 12px 20px; animation: pop .3s ease both; white-space: nowrap; background: var(--card); border-radius: 99px; box-shadow: var(--shadow-sm);
}
.toast.hello { top: calc(max(128px, 20%) + env(safe-area-inset-top, 0px)); border: 3px solid var(--lilac); }
.toast.good { color: var(--mint-deep); border: 3px solid var(--mint); }
.toast.oops { color: var(--coral-deep); border: 3px solid var(--coral); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(.85); } 70% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { translate: 0 0; } 20% { translate: -7px 0; } 40% { translate: 6px 0; } 60% { translate: -4px 0; } 80% { translate: 3px 0; } }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(79, 209, 165, .7); } 100% { box-shadow: 0 0 0 18px rgba(79, 209, 165, 0); } }
@media (prefers-reduced-motion: reduce) { .screen, .toast, .card { animation: none !important; } }
/* Number Pop. Layout: a sunny target badge at the top ("Make 17"), a gold-edged strip under it with
   the live equation, and below them a soft play field where the number bubbles drift. Menus are
   cards over the field. The bubbles keep their pastel colours in dark mode, like answer panels. */
:root { --field: rgba(255, 255, 255, .26); --field-edge: rgba(255, 255, 255, .7); --bubble-shadow: 0 8px 16px rgba(41, 52, 90, .16); --bg-bubble: rgba(255, 255, 255, .5); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --field: rgba(255, 255, 255, .05); --field-edge: rgba(255, 255, 255, .16); --bubble-shadow: 0 8px 18px rgba(0, 0, 0, .35); --bg-bubble: rgba(255, 255, 255, .1); }
}
:root[data-theme="dark"] { --field: rgba(255, 255, 255, .05); --field-edge: rgba(255, 255, 255, .16); --bubble-shadow: 0 8px 18px rgba(0, 0, 0, .35); --bg-bubble: rgba(255, 255, 255, .1); }

#bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
#bg i { position: absolute; border-radius: 50%; border: 2px solid var(--bg-bubble); background: radial-gradient(circle at 34% 28%, var(--bg-bubble) 0 10%, transparent 34%); animation: drift 13s ease-in-out infinite alternate; }
#bg i:nth-child(2n) { animation-duration: 17s; animation-delay: -6s; }
@keyframes drift { from { transform: translateY(0); } to { transform: translateY(-28px); } }

#game {
  position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; touch-action: none;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
body.menu .goal, body.menu .strip { visibility: hidden; }
.goal {
  flex: none; height: clamp(64px, 11vh, 92px); min-width: 210px; max-width: calc(100% - 300px); padding: 0 30px;
  display: grid; align-content: center; justify-items: center; gap: 3px;
  background: var(--sun); border: 4px solid var(--sun-deep); color: var(--sun-ink); border-radius: 28px; box-shadow: 0 5px 0 var(--sun-deep), var(--shadow-sm);
}
.goal .op { font: 800 .74rem/1 var(--font-body); text-transform: uppercase; letter-spacing: .12em; background: rgba(255, 255, 255, .55); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.goal[data-kind="times"] .op, .goal[data-kind="div"] .op { background: #ece6ff; color: #4b3a9e; }
.goal[data-kind="ask"] .op { background: #dcf6e9; color: #1d6e4f; }
.goal[data-kind="pct"] .op { background: #ffe4f2; color: #8a2160; }
.goal .make { font: 700 clamp(30px, min(11vw, 5.6vh), 50px)/1 var(--font-display); white-space: nowrap; font-variant-numeric: tabular-nums; }
.goal .make b { font-size: 1.18em; }
.goal .make b.q { font-size: 1em; }
.goal.pulse { animation: pop .35s ease both; }
.strip {
  flex: none; height: clamp(46px, 7vh, 60px); width: min(620px, calc(100% - 300px)); padding: 0 18px; box-sizing: border-box;
  display: grid; place-items: center; overflow: hidden; white-space: nowrap;
  background: var(--card); border: 3px solid var(--door-edge); border-radius: 20px; box-shadow: var(--shadow-sm);
  font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums;
}
.strip .line { display: block; max-width: 100%; }
.strip .hint { font: 700 clamp(1rem, 2.3vh, 1.25rem)/1.15 var(--font-body); display: block; color: var(--ink-soft); white-space: normal; text-align: center; }
.strip .hint b { font-family: var(--font-display); color: var(--ink); }
.strip .tot { color: var(--ink-soft); }
.strip.good { border-color: var(--mint); }
.strip.good .tot { color: var(--mint-deep); }
.strip.over { border-color: var(--coral); }
.strip.over .tot { color: var(--coral-deep); }
.strip.shake { animation: shake .42s ease; }
#field { flex: 1 1 auto; align-self: stretch; min-height: 0; position: relative; border-radius: 32px; background: var(--field); border: 2px solid var(--field-edge); }

/* the bubbles: buttons that drift; picked ones turn sunny and stand still */
#field .bub {
  position: absolute; left: 0; top: 0; width: var(--d, 96px); height: var(--d, 96px); margin: 0; padding: 0; box-sizing: border-box; border-radius: 50%; cursor: pointer;
  border: calc(var(--d, 96px) * .045) solid var(--edge); color: var(--txt, #2c3566); touch-action: none; will-change: transform;
  background: radial-gradient(circle at 33% 27%, rgba(255, 255, 255, .95) 0 8%, rgba(255, 255, 255, 0) 24%), radial-gradient(circle at 50% 56%, var(--fill) 0 56%, var(--fill2) 100%);
  box-shadow: var(--bubble-shadow); display: grid; place-items: center; transition: box-shadow .2s;
  font: 700 calc(var(--d, 96px) * .4)/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em;
}
#field .bub.c0 { --fill: #d6edff; --fill2: #a6d4fa; --edge: #62afe9; }
#field .bub.c1 { --fill: #d6f7e8; --fill2: #a3e6c8; --edge: #46bf92; }
#field .bub.c2 { --fill: #e9e2ff; --fill2: #c8b9fb; --edge: #937cea; }
#field .bub.long { font-size: calc(var(--d, 96px) * .32); }
.fq { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: .62em; line-height: 1; margin: 0 .06em; }
.fq span + span { border-top: .1em solid currentColor; margin-top: .08em; padding-top: .06em; min-width: 1.15em; text-align: center; }
#field .bub.frac .fq { font-size: .82em; }
.goal .make .fq { font-size: .56em; }
.strip .hint .fq { font-size: .85em; }
.strip .line > .eq .fq, .strip .line > .fq, .strip .tot .fq { font-size: .68em; }
#field .bub.cu { --fill: #fdeee3; --fill2: #f2c9a8; --edge: #c0773f; }
#field .bub.ag { --fill: #f6f8fb; --fill2: #d6dce6; --edge: #8e99ad; }
#field .bub.au { --fill: #f3f5f9; --fill2: #dde2ea; --edge: #c9a227; border-width: calc(var(--d, 96px) * .08); }
#field .bub.note { --fill: #e3f6e9; --fill2: #b3e2c2; --edge: #3d9a60; border-radius: 30%; }
#field .bub.neg { --fill: #ffe3e6; --fill2: #ffb4bd; --edge: #e05468; --txt: #9b2336; }
#field .bub.pct { --fill: #ffe9f5; --fill2: #f7bfdf; --edge: #cf5aa0; --txt: #7a1d52; }
#field .bub.on { --fill: #fff0ad; --fill2: #ffc94d; --edge: #d9961a; --txt: #4a3500; box-shadow: 0 0 0 7px rgba(255, 201, 77, .5), var(--bubble-shadow); }
#field .bub.neg.on { --txt: #9b2336; }
#field .bub.hint { animation: hint 2.6s ease-in-out infinite; }
#field .bub:focus { outline: none; }
#field .bub:focus-visible { outline: 3px solid var(--lilac); outline-offset: 4px; }
@keyframes hint { 0%, 100% { box-shadow: 0 0 0 2px rgba(255, 255, 255, .5), var(--bubble-shadow); } 50% { box-shadow: 0 0 0 12px rgba(255, 255, 255, .75), var(--bubble-shadow); } }
body.calm #field .bub.hint { animation: none; box-shadow: 0 0 0 9px rgba(255, 255, 255, .75), var(--bubble-shadow); }
body:not(.menu) .toast { top: var(--toast-top, 42%); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

/* HUD: chips stacked on the left on wide screens, in a row on phones */
.chip.prog::before { content: ''; display: inline-block; width: .8em; height: .8em; margin-right: 7px; vertical-align: -.06em; border-radius: 50%; border: 2px solid #62afe9; background: radial-gradient(circle at 34% 30%, #fff 0 18%, #bfe2ff 40%); box-sizing: border-box; }
@media (min-width: 700px) { .hud-chips { flex-direction: column; align-items: flex-start; } }

/* home: the worlds */
.worlds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
/* sixteen worlds: four rows of four on an iPad (six of three on a phone), compact enough that the whole home card fits a landscape iPad and a 390 x 844 phone */
.world {
  min-height: 68px; display: grid; align-content: center; justify-items: center; gap: 2px; padding: 4px; border-radius: 18px; cursor: pointer; min-width: 0;
  background: var(--card-2); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); color: var(--ink); transition: transform .08s ease, box-shadow .08s ease;
}
.world:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.world:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
.world b { font: 700 1.12rem/1.05 var(--font-display); white-space: nowrap; }
.world small { font-weight: 800; font-size: .82rem; line-height: 1.15; color: var(--ink-soft); white-space: nowrap; }
.world .ws { font-size: .88rem; letter-spacing: .06em; line-height: 1; background: var(--card); padding: 3px 9px; border-radius: 99px; }
.world .ws .off { opacity: .25; filter: grayscale(1); }
.world[aria-checked="true"] { background: var(--sun); border-color: var(--sun-deep); box-shadow: 0 4px 0 var(--sun-deep); color: var(--sun-ink); }
.world[aria-checked="true"] small { color: var(--sun-ink); }
.world[aria-checked="true"] .ws .off { opacity: .35; }
@media (max-height: 900px) { #s-home .card { gap: 12px; } }
#doneStars span { display: inline-block; animation: pop .45s ease both; }
#doneStars span:nth-child(2) { animation-delay: .2s; }
#doneStars span:nth-child(3) { animation-delay: .4s; }
#doneStats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.done-world { margin: -8px 0 0; font: 700 1rem/1 var(--font-display); color: var(--ink-soft); }
#doneNext { font-weight: 700; }

@media (max-width: 699px) {
  #game { padding-top: calc(78px + env(safe-area-inset-top, 0px)); }
  .goal { max-width: 100%; }
  .strip { width: 100%; }
}
@media (max-width: 520px) {
  .worlds { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .world { min-height: 64px; padding: 4px 2px; border-radius: 14px; }
  .world:last-child:nth-child(3n + 1) { grid-column: 2; }   /* a lone last world sits in the middle */
  .world b { font-size: .98rem; }
  .world small { font-size: .72rem; }
  .world .ws { font-size: .74rem; padding: 3px 6px; }
}
@media (prefers-reduced-motion: reduce) { #bg i, .goal.pulse, .strip.shake, #doneStars span { animation: none !important; } }
body.calm #bg i, body.calm .goal.pulse, body.calm .strip.shake { animation: none; }
</style>
</head>
<body>
<div id="bg" aria-hidden="true">
  <i style="left:4%;top:12%;width:120px;height:120px"></i><i style="left:82%;top:8%;width:84px;height:84px"></i>
  <i style="left:12%;top:68%;width:70px;height:70px"></i><i style="left:74%;top:60%;width:150px;height:150px"></i>
  <i style="left:44%;top:84%;width:96px;height:96px"></i><i style="left:58%;top:28%;width:56px;height:56px"></i>
</div>
<div id="game">
  <div class="goal" id="goal" data-kind="plus"><span class="op" id="opLabel">add</span><span class="make">Make <b id="targetNum">10</b></span></div>
  <div class="strip" id="strip"></div>

  s.innerHTML = '<span class="line">' + html + '</span>';
  const fit = chars ? Math.min(s.clientHeight * 0.62, (s.clientWidth - 40) / (chars * 0.6)) : 0;
  s.style.fontSize = fit ? Math.max(14, fit).toFixed(1) + 'px' : '';
  // stacked fractions are narrower than their text: fit by measuring instead
  if (chars && fracMode()) {
    const max = s.clientHeight * 0.6;
    s.style.fontSize = max.toFixed(1) + 'px';
    const wide = s.firstChild.scrollWidth, room = s.clientWidth - 40;
    if (wide > room) s.style.fontSize = Math.max(14, max * room / wide).toFixed(1) + 'px';
  }
}

/* ================= particles ================= */
const parts = [];
function burst(x, y, color, n) {
  if (calm()) n = Math.ceil(n / 3);
  const sp = calm() ? 0.5 : 1;
  for (let k = 0; k < n; k++) {
    const a = Math.random() * 6.283, v = (70 + Math.random() * 150) * sp;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 3 + Math.random() * 5, life: 0.45 + Math.random() * 0.4, t: 0, c: k % 3 ? color : '#ffc94d' });
  }
  parts.push({ ring: true, x: x, y: y, r: R, vx: 0, vy: 0, life: 0.35, t: 0, c: color });
}
function floatText(x, y, text) { parts.push({ text: text, x: x, y: y, vx: 0, vy: -46, life: 1.0, t: 0, c: '#2a9f78' }); }
function stepParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (!p.ring && !p.text) { p.vy += 160 * dt; p.vx *= 0.985; }
  }
}
let fxDirty = false;
function drawParts() {
  if (!parts.length && !fxDirty) return;
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  fxDirty = parts.length > 0;
  for (const p of parts) {
    const u = p.t / p.life, a = 1 - u;
    fctx.globalAlpha = a;
    if (p.ring) { fctx.strokeStyle = p.c; fctx.lineWidth = Math.max(1, 5 * a); fctx.beginPath(); fctx.arc(p.x, p.y, p.r * (1 + 0.55 * u), 0, 6.283); fctx.stroke(); }
    else if (p.text) {
      fctx.font = '700 30px Fredoka, "Arial Rounded MT Bold", ui-rounded, sans-serif'; fctx.textAlign = 'center'; fctx.textBaseline = 'middle';
      fctx.lineWidth = 6; fctx.strokeStyle = '#ffffff'; fctx.strokeText(p.text, p.x, p.y); fctx.fillStyle = p.c; fctx.fillText(p.text, p.x, p.y);
    } else { fctx.fillStyle = p.c; fctx.beginPath(); fctx.arc(p.x, p.y, p.r * (1 - 0.4 * u), 0, 6.283); fctx.fill(); }
  }
  fctx.globalAlpha = 1;
}

/* ================= round flow ================= */
function step(dt) {
  game.t += dt;
  if (game.state === 'play' && game.done < ROUND) game.time += dt;
  moveBubbles(dt);
  for (const b of slots) {
    if (b.st === 'pop') { b.t += dt; if (b.t >= 0.3) { b.st = 'gone'; b.t = 0; } }
    else if (b.st === 'gone' && game.state === 'menu' && b.i < game.n) { b.t += dt; if (b.t > 0.8) spawn(b, rnd(1, 20)); }
  }
  if (game.state === 'play') {
    if (game.phase === 'letgo' && game.t >= game.phaseUntil) releaseAll();
    else if (game.phase === 'pop' && game.t >= game.phaseUntil) {
      if (game.done >= ROUND) finishRound();
      else newTarget(slots.filter((b) => b.i < game.n && (b.st === 'pop' || b.st === 'gone')));
    } else if (game.phase === 'pick') {
      // stuck for a while: one answer bubble glows softly (never the whole answer); a question shows its first step
      const waited = game.time - game.targetAt;
      if (game.kind === 'ask') { if (!game.hints && waited > 12) { game.hints = 1; if (!game.picks.length) showStrip(); } }
      else if (game.hints < game.sol.length - 1 && waited > 15 + game.hints * 8) {
        const b = slots[game.sol[game.hints]];
        if (b && !b.picked) b.el.classList.add('hint');
        game.hints++;
      }
    }
  }
  if (hookFn) { try { hookFn(game); } catch (e) { hookFn = null; throw e; } }
}
let shownSec = -1;
function updateHud() {
  $('#progChip').textContent = game.done + ' / ' + ROUND;
  $('#scoreChip').textContent = game.score + ' pts';
  shownSec = -1; updateClock();
}
function updateClock() {
  const s = Math.floor(game.time);
  if (s !== shownSec) { shownSec = s; $('#timeChip').textContent = fmtTime(game.time); }
}
function startRound(w) {
  game.w = w; game.n = w.n; game.state = 'play'; game.attempt++;
  game.done = 0; game.time = 0; game.endTime = 0; game.slips = 0; game.score = 0; game.streak = 0; game.bestStreak = 0;
  game.target = 0; game.picks = []; game.phase = 'pick'; game.result = null; game.asked = new Set();
  game.fd = w.frac ? fracFamily() : 0;
  document.body.classList.remove('menu');
  document.body.classList.toggle('calm', calm());
  $('#hud').hidden = false;
  for (const b of slots) { setPicked(b, false); b.el.classList.remove('hint'); b.st = 'off'; b.el.hidden = true; }
  resize();
  newTarget(slots.slice(0, game.n));
  Sound.muffle(false);
  if (game.attempt === 0) Sound.play('pop', true);
  else { Sound.play('pop'); const name = Sound.remix(game.attempt, 0, 'pop'); if (name) toast('♪ ' + name); }
  updateHud();
}
function finishRound() {
  const w = game.w, time = game.endTime, stars = starsFor(w, time, game.slips), r = wrec(w.id);
  const better = !r.best || time < r.best, first = !r.plays;
  game.state = 'done'; game.phase = 'end';
  r.plays++; rec.rounds++;
  if (better) r.best = time;
  r.stars = Math.max(r.stars, stars); r.points = Math.max(r.points || 0, game.score);
  writeSave();
  Sound.sfx.win();
  game.result = { world: w.id, time: time, stars: stars, slips: game.slips, score: game.score, better: better && !first, first: first, bestStreak: game.bestStreak };
  setTimeout(() => { if (game.state === 'done') showDone(); }, 900);
}
function showDone() {
  const res = game.result, w = game.w, r = wrec(w.id);
  $('#doneTitle').textContent = res.stars === 3 ? 'Pop star!' : 'All 10 popped!';
  $('#doneWorld').textContent = w.name;
  $('#doneStars').innerHTML = starRow(res.stars);
  $('#doneStars').setAttribute('aria-label', res.stars + ' of 3 stars');
  $('#doneNote').textContent = res.better ? 'A new best time!' : res.first ? 'Your first round in ' + w.name + '!' : 'Best time: ' + fmtTime(r.best);
  $('#doneStats').innerHTML = stat('Time', fmtTime(res.time)) + stat('Slips', res.slips) + stat('Points', res.score);
  $('#doneNext').textContent = res.stars >= 3 ? (w.id < WORLDS.length ? 'Ready for ' + WORLDS[w.id].name + '?' : 'Every world, every star. Wow!')
    : res.stars === 2 ? '3 stars: ' + fmtTime(w.t3) + ' or less, with ' + SLIPS3 + ' slips or fewer' : '2 stars: ' + fmtTime(w.t2) + ' or less';
  $('#nextBtn').hidden = res.stars < 2 || w.id >= WORLDS.length;
  $('#hud').hidden = true;
  showScreen('done');
  arcadeLinks();
  for (let k = 0; k < res.stars; k++) setTimeout(() => Sound.sfx.star(), 200 + k * 200);
  announce('All ten popped in ' + fmtTime(res.time) + '. ' + res.stars + ' stars.');
}

/* ================= menus ================= */
function renderHome() {
  $('#worlds').innerHTML = WORLDS.map((w) => {
    const r = rec.worlds[w.id] || { stars: 0 };
    return '<button class="world" type="button" role="radio" data-w="' + w.id + '" aria-checked="' + (+rec.world === w.id) + '" aria-label="' + w.name + ', ' + r.stars + ' of 3 stars">' +
      '<b>' + w.name + '</b><small>' + w.ex + '</small><span class="ws" aria-hidden="true">' + starRow(r.stars) + '</span></button>';
  }).join('');
  const el = document.querySelector('input[name="math"][value="' + save.settings.mathLevel + '"]');
  if (el) el.checked = true;
  $('#soundBtn').textContent = save.settings.music > 0 ? 'Music on' : 'Music off';
  arcadeLinks();
  requestAnimationFrame(fitNames);
}
// a long world name shrinks a little to stay inside its card (Double & halve on a phone)
function fitNames() {
  $$('.world b').forEach((b) => {
    b.style.fontSize = '';
    const c = b.parentNode, cs = getComputedStyle(c), room = c.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (room > 0 && b.offsetWidth > room) b.style.fontSize = (parseFloat(getComputedStyle(b).fontSize) * room / b.offsetWidth).toFixed(1) + 'px';
  });
}
function menuField() {
  game.n = 10; resize();
  for (const b of slots) { setPicked(b, false); b.el.classList.remove('hint'); if (b.i >= game.n) { b.st = 'off'; b.el.hidden = true; } else if (!alive(b)) spawn(b, rnd(1, 20)); else setValue(b, rnd(1, 20)); }   // plain numbers on the home screen
}
function goHome() {
  game.state = 'menu'; game.phase = 'pick'; game.picks = [];
  document.body.classList.add('menu');
  $('#hud').hidden = true;
  menuField();
  Sound.muffle(false); Sound.play('menu');
  renderHome();
  showScreen('home', false);
}
function play() {
  Sound.init();
  showScreen(null);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  startRound(worldById(rec.world));
}
function pause() {
  if (game.state !== 'play') return;
  game.state = 'pause';
  Sound.muffle(true);
  $('#pauseInfo').textContent = game.w.name + ' · ' + game.done + ' of ' + ROUND + ' popped · ' + fmtTime(game.time);
  showScreen('pause');
}
function resume() {
  if (game.state !== 'pause') return;
  showScreen(null);
  game.state = 'play'; lastFrame = performance.now(); acc = 0;
  Sound.muffle(false);
}
$('#worlds').addEventListener('click', (e) => {
  const b = e.target.closest('.world');
  if (!b) return;
  rec.world = +b.dataset.w; writeSave();
  $$('.world').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
  Sound.sfx.check();
});
$('#playBtn').addEventListener('click', play);
$('#againBtn').addEventListener('click', play);
$('#nextBtn').addEventListener('click', () => { rec.world = Math.min(WORLDS.length, game.w.id + 1); writeSave(); play(); });
$('#resumeBtn').addEventListener('click', resume);
$('#restartBtn').addEventListener('click', () => { showScreen(null); startRound(game.w); });
$('#homeBtn').addEventListener('click', goHome);
$('#doneHomeBtn').addEventListener('click', goHome);
$('#pauseBtn').addEventListener('click', (e) => { e.stopPropagation(); pause(); });
$('#soundBtn').addEventListener('click', () => { toggleMusic(); renderHome(); });
document.addEventListener('change', (e) => { if (e.target.name === 'math') { save.settings.mathLevel = e.target.value; writeSave(); } });

/* ================= input ================= */
// a finger press picks at once; a click without a press before it (keyboard) picks too
field.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.bub');
  if (!el) return;
  e.preventDefault();
  lastPointerTap = performance.now();
  tap(+el.dataset.i);
});
field.addEventListener('click', (e) => {
  const el = e.target.closest('.bub');
  if (!el || performance.now() - lastPointerTap < 700) return;
  tap(+el.dataset.i);
});
field.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => {
  if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat) {
    if (game.state === 'play') { e.preventDefault(); pause(); } else if (game.state === 'pause') { e.preventDefault(); resume(); }
  } else if (e.code === 'KeyM' && !e.repeat) { toggleMusic(); if (game.state === 'menu') renderHome(); }
});
arcadeGuards(() => pause());
document.addEventListener('pointerdown', () => { if (game.state === 'menu') { Sound.init(); Sound.play('menu'); } });
window.addEventListener('resize', resize);

/* ================= loop ================= */
const DT = 1 / 120;
let lastFrame = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(speed > 1 ? 0.25 : 0.05, Math.max(0, (now - lastFrame) / 1000));   // tests may run sped up on a slow headless frame rate
  lastFrame = now;
  if (game.state !== 'pause') {
    acc += dt * speed;
    for (let n = 0; acc >= DT && n < 600; n++) { step(DT); acc -= DT; }
    stepParts(dt * Math.min(speed, 2));
    if (game.state === 'play') updateClock();
  }
  drawBubbles();
  drawParts();
}
document.body.classList.add('menu');
document.body.classList.toggle('calm', calm());
resize();
menuField();
renderHome();
showScreen('home', false);
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load('700 40px Fredoka').then(() => { fitNames(); fitGoal(); }).catch(() => {});
// test hook: what a bot needs to play (bubble x/y are page coordinates of the centres)
window.__pop = {
  game: game, slots: slots, WORLDS: WORLDS, rec: rec, save: save, ROUND: ROUND, SLIPS3: SLIPS3, PCT: PCT, tap: tap, stars: starsFor, home: goHome,
  state() {
    return { state: game.state, phase: game.phase, world: game.w.id, kind: game.kind, target: game.target, tid: game.tid, done: game.done,
      time: game.time, slips: game.slips, tSlips: game.tSlips, score: game.score, streak: game.streak, picks: game.picks.slice(), sol: game.sol.slice(), result: game.result, fd: game.fd || 0,
      q: game.q ? game.q.text : '' };
  },
  // generation checks: pop these bubbles (default: the planted answer) and plan the next target at once
  next(idx) {
    (idx || game.sol).forEach((i) => { setPicked(slots[i], false); slots[i].st = 'gone'; });
    game.picks = []; game.phase = 'pick'; game.done = (game.done + 1) % ROUND;
    newTarget(slots.filter((b) => b.i < game.n && (b.st === 'pop' || b.st === 'gone')));
    return game.tid;
  },
  bubbles() { return slots.slice(0, game.n).map((b) => ({ i: b.i, v: b.v, st: b.st, picked: b.picked, x: FL + b.x, y: FT + b.y, d: D })); },
  target() { return { value: game.target, kind: game.kind, tid: game.tid }; },
  start(id) { rec.world = +id; play(); return game.state; },
  setSpeed(k) { speed = k; },
  layout() { return { FL: FL, FT: FT, FW: FW, FH: FH, D: D }; },
  set hook(fn) { hookFn = fn; },
  get hook() { return hookFn; }
};
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#8fd1fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Number Arcade">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.ARCADE_HOME = "../";</script>
<title>Pair Up</title>
<meta name="description" content="A memory card game: flip two cards and find the pairs that belong together, a sum and its answer, a picture and its English word.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root {
  --sky: #e6f3fc; --sky-top: #8fd1fb; --sky-bot: #e8f6ff; --ink: #29345a; --ink-soft: #5d6890; --card: #fdfeff; --card-2: #eef5fc; --line: #d0dff0;
  --sun: #ffc94d; --sun-deep: #e2a526; --sun-ink: #4a3500; --mint: #4fd1a5; --mint-deep: #2a9f78; --mint-soft: #d9f7ea; --lilac: #9d84ff; --lilac-soft: #ece6ff;
  --coral: #ff7b86; --coral-deep: #d9505d; --coral-soft: #ffe1e4; --sky-blue: #5cb8ff; --pink: #ff9fcf;
  --door: #fff3d6; --door-edge: #f0b544; --door-ink: #3a3f6b; --veil: rgba(230, 243, 252, .6);
  --shadow: 0 12px 32px rgba(41, 52, 90, .16); --shadow-sm: 0 4px 14px rgba(41, 52, 90, .14);
  --font-display: "Fredoka", "Arial Rounded MT Bold", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #1c2147; --sky-top: #1d2350; --sky-bot: #3b3a7e; --ink: #edf0ff; --ink-soft: #b4bbe3; --card: #283063; --card-2: #222955; --line: #3b437f;
    --sun: #ffcd5a; --sun-deep: #d99f2c; --sun-ink: #3d2a00; --mint: #5adbb0; --mint-deep: #5adbb0; --mint-soft: #1f4a4a; --lilac: #ab95ff; --lilac-soft: #352f6e;
    --coral: #ff8a94; --coral-deep: #ff8a94; --coral-soft: #4d2a45; --door: #fff1d2; --veil: rgba(28, 33, 71, .55);
    --shadow: 0 14px 36px rgba(0, 0, 0, .42); --shadow-sm: 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #1c2147; --sky-top: #1d2350; --sky-bot: #3b3a7e; --ink: #edf0ff; --ink-soft: #b4bbe3; --card: #283063; --card-2: #222955; --line: #3b437f;
  --sun: #ffcd5a; --sun-deep: #d99f2c; --sun-ink: #3d2a00; --mint: #5adbb0; --mint-deep: #5adbb0; --mint-soft: #1f4a4a; --lilac: #ab95ff; --lilac-soft: #352f6e;
  --coral: #ff8a94; --coral-deep: #ff8a94; --coral-soft: #4d2a45; --door: #fff1d2; --veil: rgba(28, 33, 71, .55);
  --shadow: 0 14px 36px rgba(0, 0, 0, .42); --shadow-sm: 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  background: linear-gradient(var(--sky-top), var(--sky-bot) 75%) fixed; background-color: var(--sky-bot);
}
button { font: inherit; color: inherit; }
button, label, input, .btn, a { touch-action: manipulation; }
[hidden] { display: none !important; }

/* buttons */
.btn {
  font: 600 1.05rem/1.1 var(--font-display); color: var(--ink); background: var(--card-2); border: 2px solid var(--line); border-radius: 16px;
  padding: .75em 1.15em; box-shadow: 0 4px 0 var(--line); cursor: pointer; text-decoration: none; display: inline-block;
  transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:hover { background: var(--card); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn:focus-visible, .seg input:focus-visible + span { outline: 3px solid var(--lilac); outline-offset: 3px; }
.btn.sun { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); box-shadow: 0 4px 0 var(--sun-deep); }
.btn.sun:active { box-shadow: 0 1px 0 var(--sun-deep); }
.btn.big { font-size: 1.6rem; padding: .6em 2.2em; border-radius: 22px; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

/* menu screens: cards over the game */
#screens {
  position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto; pointer-events: none; touch-action: pan-y; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
}
#screens.dim { background: var(--veil); pointer-events: auto; }
.screen { pointer-events: auto; width: min(100%, 600px); animation: rise .35s ease both; }
.card { background: var(--card); border-radius: 28px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 34px); display: grid; gap: 18px; text-align: center; }
.logo { margin: 0; font: 700 clamp(2.5rem, 9vw, 4rem)/.95 var(--font-display); text-wrap: balance; }
.logo span { color: var(--mint-deep); }
.tag { margin: 0 auto; max-width: 40ch; color: var(--ink-soft); font-size: 1.08rem; line-height: 1.5; text-wrap: balance; }
.how { margin: 0; color: var(--ink-soft); font-weight: 700; }
.small-card h2 { margin: 0; font: 700 clamp(1.9rem, 6vw, 2.6rem)/1.05 var(--font-display); text-wrap: balance; }
.small-card p { margin: 0; color: var(--ink-soft); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; margin: 0; }
.stats div { background: var(--card-2); border-radius: 16px; padding: 12px 6px; min-width: 0; }
.stats dt { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 800; }
.stats dd { margin: 4px 0 0; font: 700 1.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; font: 600 .95rem/1.15 var(--font-display); padding: .55em .85em; border-radius: 14px; background: var(--card-2); border: 2px solid var(--line); }
.seg input:checked + span { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); }
@media (pointer: coarse) { .seg span { min-height: 48px; box-sizing: border-box; display: grid; place-items: center; } }
.seg-title { margin: 0 0 8px; font: 600 .9rem/1 var(--font-display); color: var(--ink-soft); }
.stars { font-size: 2.4rem; letter-spacing: .1em; line-height: 1; }
.stars .off { opacity: .22; filter: grayscale(1); }

/* the HUD along the top while playing */
#hud { position: fixed; left: 0; right: 0; top: 0; pointer-events: none; z-index: 10; }
.hud-top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.chipbox { background: var(--card); border-radius: 99px; box-shadow: var(--shadow-sm); }
.hud-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 600 1.05rem/1 var(--font-display); padding: 8px 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.soft { font-size: .9rem; padding: 7px 12px; color: var(--ink-soft); }
.hud-btn { pointer-events: auto; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow-sm); cursor: pointer; display: grid; place-items: center; flex: none; color: var(--ink); }
.hud-btn:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
@media (pointer: coarse) { .hud-btn { width: 58px; height: 58px; } }

/* toasts and screen-reader text */
.toast {
  position: fixed; left: 50%; top: var(--toast-top, 42%); translate: -50% 0; z-index: 30; pointer-events: none; font: 700 1.4rem/1.1 var(--font-display);
  padding: 12px 20px; animation: pop .3s ease both; white-space: nowrap; background: var(--card); border-radius: 99px; box-shadow: var(--shadow-sm);
}
.toast.hello { top: calc(max(128px, 20%) + env(safe-area-inset-top, 0px)); border: 3px solid var(--lilac); }
.toast.good { color: var(--mint-deep); border: 3px solid var(--mint); }
.toast.oops { color: var(--coral-deep); border: 3px solid var(--coral); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(.85); } 70% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { translate: 0 0; } 20% { translate: -7px 0; } 40% { translate: 6px 0; } 60% { translate: -4px 0; } 80% { translate: 3px 0; } }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(79, 209, 165, .7); } 100% { box-shadow: 0 0 0 18px rgba(79, 209, 165, 0); } }
@media (prefers-reduced-motion: reduce) { .screen, .toast, .card { animation: none !important; } }
/* Layout: the board fills the screen under the HUD; cards are sized by script so a board of
   12, 16 or 24 fits any iPad or phone without scrolling. Card backs: blue-lilac for number
   decks, peach-pink for word decks. */
#play {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: calc(76px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(66px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
#board { display: grid; gap: var(--gap, 10px); justify-content: center; align-content: center; --cw: 120px; --ch: 140px; }
.pc { width: var(--cw); height: var(--ch); padding: 0; border: 0; background: none; cursor: pointer; perspective: 900px; border-radius: 18px; }
.pc:focus-visible { outline: 4px solid var(--lilac); outline-offset: 3px; }
.pc .inner { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .32s ease; }
.pc.up .inner, .pc.matched .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: clamp(10px, calc(var(--cw) * .14), 18px); -webkit-backface-visibility: hidden; backface-visibility: hidden; display: grid; place-items: center; overflow: hidden; }
.back {
  background:
    radial-gradient(circle at 22% 20%, rgba(255, 255, 255, .35) 0 7%, transparent 8%),
    radial-gradient(circle at 78% 80%, rgba(255, 255, 255, .3) 0 9%, transparent 10%),
    radial-gradient(circle at 80% 22%, rgba(255, 255, 255, .22) 0 5%, transparent 6%),
    linear-gradient(145deg, #7fb6ff, #a98bff);
  border: 3px solid rgba(255, 255, 255, .75); box-shadow: 0 5px 0 #7a68d6, var(--shadow-sm);
}
.words .back { background:
    radial-gradient(circle at 22% 20%, rgba(255, 255, 255, .35) 0 7%, transparent 8%),
    radial-gradient(circle at 78% 80%, rgba(255, 255, 255, .3) 0 9%, transparent 10%),
    radial-gradient(circle at 80% 22%, rgba(255, 255, 255, .22) 0 5%, transparent 6%),
    linear-gradient(145deg, #ffb48a, #ff8fbf); box-shadow: 0 5px 0 #d9709c, var(--shadow-sm); }
.back::after { content: "?"; font: 700 calc(var(--cw) * .42)/1 var(--font-display); color: rgba(255, 255, 255, .92); text-shadow: 0 3px 0 rgba(60, 40, 140, .18); }
.front { transform: rotateY(180deg); background: var(--door); border: 3px solid var(--door-edge); box-shadow: 0 5px 0 var(--door-edge), var(--shadow-sm); color: var(--door-ink); padding: 6%; text-align: center; }
.front .v { display: inline-block; font: 700 1em/1.05 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.front .v.emoji { font-family: var(--emoji); line-height: 1; }
.front .v.word { font-weight: 600; }
.pc.matched .front { background: #dff8ec; border-color: var(--mint); box-shadow: 0 5px 0 #2fae84, var(--shadow-sm); animation: glow .6s ease-out; }
.pc.matched .front::after { content: "✓"; position: absolute; top: 4%; right: 7%; font: 700 calc(var(--cw) * .16)/1 var(--font-display); color: #2a9f78; }
.pc.miss .front { border-color: var(--coral); box-shadow: 0 5px 0 var(--coral-deep), var(--shadow-sm); }
.pc.matched { cursor: default; }
@media (prefers-reduced-motion: reduce) { .pc .inner { transition: none; } .pc.matched .front { animation: none; } }

/* home: deck tiles */
.decks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.decks label { cursor: pointer; }
.decks label:last-child { grid-column: 1 / -1; }
.decks input { position: absolute; opacity: 0; pointer-events: none; }
.decks span { display: grid; gap: 2px; justify-items: center; padding: 10px 6px; border-radius: 16px; background: var(--card-2); border: 2px solid var(--line); font: 600 .95rem/1.1 var(--font-display); height: 100%; box-sizing: border-box; }
.decks span i { font-style: normal; font-family: var(--emoji); font-size: 1.6rem; line-height: 1.1; }
.decks span small { font: 700 .72rem/1.2 var(--font-body); color: var(--ink-soft); }
.decks input:checked + span { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); }
.decks input:checked + span small { color: var(--sun-ink); }
.decks input:focus-visible + span { outline: 3px solid var(--lilac); outline-offset: 3px; }
@media (max-width: 420px) { .decks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.found { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 0; padding: 0; list-style: none; }
.found li { background: var(--mint-soft); color: var(--ink); border-radius: 99px; padding: 6px 12px; font: 600 1rem/1.1 var(--font-display); }
.found li .e { font-family: var(--emoji); }
/* the status line under the board: the look-first countdown, then each pair found */
.status { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 12; font: 700 1.15rem/1 var(--font-display); padding: 11px 18px; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }
.status.good { color: var(--mint-deep); }
.card.home { gap: 16px; }
</style>
</head>
<body>
<div id="play" aria-label="Pair Up board"><div id="board"></div></div>

<div id="hud" hidden>
  <div class="hud-top">
    <div class="hud-chips">
      <span class="chip chipbox" id="pairChip">Pairs 0 / 8</span>
      <span class="chip soft chipbox" id="moveChip">Moves 0</span>
      <span class="chip soft chipbox" id="timeChip">0:00</span>
    </div>
    <button class="hud-btn" id="pauseBtn" aria-label="Pause">
      <svg width="18" height="20" viewBox="0 0 16 18" aria-hidden="true"><rect x="1" y="1" width="5" height="16" rx="2" fill="currentColor"/><rect x="10" y="1" width="5" height="16" rx="2" fill="currentColor"/></svg>
    </button>
  </div>
</div>
<div class="status chipbox" id="status" hidden></div>

<main id="screens">
  <section class="screen" id="s-home">
    <div class="card home">
      <h1 class="logo">Pair <span>Up</span></h1>
      <p class="tag">Flip two cards. Find the pairs that belong together: a sum and its answer, a picture and its word.</p>
      <div>
        <p class="seg-title">Cards</p>
        <div class="decks" id="decks"></div>
      </div>
      <div class="row" style="gap:18px">
        <div>
          <p class="seg-title">Board</p>
          <div class="seg" id="sizes"></div>
        </div>
        <div>
          <p class="seg-title">Level</p>
          <div class="seg">
            <label><input type="radio" name="math" value="starter"><span>7–8</span></label>
            <label><input type="radio" name="math" value="explorer"><span>9–10</span></label>
            <label><input type="radio" name="math" value="genius"><span>11–12</span></label>
          </div>
        </div>
      </div>
      <div class="row"><button class="btn sun big" id="playBtn">Play</button></div>
      <dl class="stats" id="homeStats"></dl>
      <div class="row">
        <button class="btn" id="soundBtn">Music on</button>
        <button class="btn" id="speakBtn">Read aloud on</button>
        <a class="btn" data-hub hidden href="../">All games</a>
      </div>
    </div>
  </section>
  <section class="screen" id="s-pause" hidden>
    <div class="card small-card">
      <h2>Paused</h2>
      <p id="pauseInfo"></p>
      <div class="row"><button class="btn sun big" id="resumeBtn">Keep playing</button></div>
      <div class="row"><button class="btn" id="newBtn">New cards</button><button class="btn" id="homeBtn">Home</button></div>
    </div>
  </section>
  <section class="screen" id="s-done" hidden>
    <div class="card small-card">
      <h2 id="doneTitle">All pairs found!</h2>
      <div class="stars" id="doneStars" aria-hidden="true"></div>
      <p id="doneNote"></p>
      <dl class="stats" id="doneStats"></dl>
      <ul class="found" id="doneFound" aria-label="Pairs you found"></ul>
      <div class="row"><button class="btn sun big" id="againBtn">Play again</button></div>
      <div class="row"><button class="btn" id="doneHomeBtn">Home</button><a class="btn" data-hub hidden href="../">All games</a></div>
    </div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>
<div class="sr" aria-live="polite" id="announce"></div>

<script>
(function () {
'use strict';
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const frac = (v) => ((v % 1) + 1) % 1;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const fmtTime = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const stat = (k, v) => '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>';
const starRow = (n, of) => Array.from({ length: of || 3 }, (_, i) => '<span' + (i < n ? '' : ' class="off"') + '>⭐</span>').join('');

/* ================= saved progress (this device) =================
   Settings (math level, music, read-aloud) and the math record are shared by every game in
   number-dash.v1; each game keeps its own records under its own key via loadRecords(). */
const SAVE_KEY = 'number-dash.v1';
const save = {
  levels: {},
  math: { right: 0, wrong: 0, streak: 0, best: 0, tricky: [] },
  settings: { mathLevel: 'explorer', think: 'normal', music: 0.7, sfx: 0.8, sky: 'auto', calm: reduceMotion, speak: true },
  cube: { color: 0, face: 0 }
};
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { const d = JSON.parse(raw); for (const k of Object.keys(save)) if (d && d[k] && typeof d[k] === 'object') Object.assign(save[k], d[k]); }
} catch (e) { /* storage blocked: play without saving */ }
const records = { key: '', data: null };
function loadRecords(key, defaults) {
  records.key = key; records.data = defaults;
  try { const raw = localStorage.getItem(key); if (raw) Object.assign(defaults, JSON.parse(raw)); } catch (e) { /* ignore */ }
  return defaults;
}
function writeSave() {
  try {
    const cur = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    cur.math = save.math; cur.settings = save.settings;
    if (!cur.cube) cur.cube = save.cube;
    if (!cur.levels) cur.levels = save.levels;
    localStorage.setItem(SAVE_KEY, JSON.stringify(cur));
    if (records.key) localStorage.setItem(records.key, JSON.stringify(records.data));
  } catch (e) { /* ignore */ }
}

/* ================= math bookkeeping =================
   q is a fact from KINDS (shared/math.js): t = its text, a = its answer. A missed fact is kept
   (the last 12) and comes back now and then in every game until it is answered right. */
function factFrom(kinds, avoid) {
  const tricky = (save.math.tricky || []).filter((t) => !avoid || !avoid.has(t.t));
  if (tricky.length && Math.random() < 0.25) return Object.assign({}, pick(tricky), { again: true });
  let q = KINDS[pick(kinds)]();
  for (let i = 0; i < 12 && avoid && avoid.has(q.t); i++) q = KINDS[pick(kinds)]();
  return q;
}
function mathRight(q) {
  const m = save.math;
  m.right++; m.streak++; m.best = Math.max(m.best, m.streak);
  if (q && q.again) m.tricky = m.tricky.filter((t) => t.t !== q.t);
  writeSave();
}

    if (!ctx) return;
    const t = ctx.currentTime + (delay || 0), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + dur + 0.05);
  }
  function bell(m, v, delay) { if (ctx) pluck(ctx.currentTime + (delay || 0), m, v, 0.5, sfxBus); }
  function whoosh() {
    if (!ctx) return;
    const t = ctx.currentTime, s = ctx.createBufferSource(); s.buffer = noise;
    const bp = filter('bandpass', 500, 1.2), g = ctx.createGain();
    bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(2600, t + 0.3);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    s.connect(bp); bp.connect(g); g.connect(sfxBus); s.start(t, 0, 0.4);
  }
  const sfx = {
    orb() { blip('sine', 520, 900, 0.14, 0.18); },
    pad() { blip('triangle', 260, 760, 0.18, 0.16); },
    portal: whoosh,
    star() { [84, 88, 91].forEach((m, i) => bell(m, 0.15, i * 0.07)); },
    right() { bell(76, 0.2, 0); bell(83, 0.2, 0.09); bell(88, 0.14, 0.18); },
    wrong() { blip('sine', 330, 170, 0.32, 0.2, 0.05); },
    die() { blip('sine', 240, 90, 0.22, 0.22); },
    win() { [72, 76, 79, 84, 88, 91].forEach((m, i) => bell(m, 0.15, i * 0.09)); },
    click() { blip('sine', 880, 880, 0.04, 0.05); },
    check() { blip('sine', 660, 990, 0.09, 0.07); }
  };
  return { init, play, remix, beatAt, muffle, slow, setVolumes, sfx, bpm: () => (song ? song.bpm : 80), ready: () => !!ctx };
})();

/* ================= the game ================= */
const game = { state: 'menu', cards: [], open: [], moves: 0, found: 0, pairs: [], deck: 'times', size: SIZES[1], t0: 0, elapsed: 0, started: false, round: 0, waitTimer: 0, peekTimer: 0, prev: 'play', remixName: '' };
const board = $('#board');
const deckOf = (id) => DECKS.find((d) => d.id === id) || DECKS[0];
const sizeOf = (id) => SIZES.find((s) => s.id === id) || SIZES[1];
const keyOf = () => game.deck + '-' + game.size.id;
// stars by moves (one move = two cards turned). A player who remembers every card turned needs
// about 1.6 moves a pair; the 12-pair board gives a little more room (measured by simulation)
const starLine = (n) => [Math.round(n * (n >= 12 ? 1.75 : 1.6)), Math.round(n * (n >= 12 ? 3 : 2.4))];
const starsFor = (moves, n) => (moves <= starLine(n)[0] ? 3 : moves <= starLine(n)[1] ? 2 : 1);

function newBoard() {
  clearTimeout(game.waitTimer); clearInterval(game.peekTimer);
  game.deck = rec.deck; game.size = sizeOf(rec.size);
  game.pairs = dealPairs(game.deck, game.size.n);
  const cards = [];
  game.pairs.forEach((p, i) => { cards.push(Object.assign({ pair: i, up: false, matched: false }, p.a)); cards.push(Object.assign({ pair: i, up: false, matched: false }, p.b)); });
  game.cards = shuffle(cards);
  game.open = []; game.moves = 0; game.found = 0; game.started = false; game.elapsed = 0;
  $('#play').classList.toggle('words', !!deckOf(game.deck).words && game.deck !== 'mix');
  board.innerHTML = game.cards.map((c, i) =>
    '<button class="pc" data-i="' + i + '" aria-label="Card ' + (i + 1) + ', face down"><span class="inner"><span class="face back"></span><span class="face front"><span class="v ' + c.kind + '"></span></span></span></button>').join('');
  game.cards.forEach((c, i) => { c.el = board.children[i]; c.el.querySelector('.v').textContent = c.v; });
  layout();
  updateHud();
  // a short look at every card first, then they turn over
  game.state = 'peek';
  game.cards.forEach((c) => setUp(c, true, true));
  let left = game.size.peek;
  status('Remember them! ' + left);
  game.peekTimer = setInterval(() => {
    if (game.state === 'pause') return;
    left--;
    if (left > 0) { status('Remember them! ' + left); return; }
    clearInterval(game.peekTimer);
    game.cards.forEach((c, i) => setTimeout(() => setUp(c, false, true), reduceMotion ? 0 : i * 18));
    game.state = 'play';
    status(game.remixName ? '♪ ' + game.remixName : 'Find the pairs!');
    announce('Cards turned over. Find the pairs.');
  }, 1000);
  announce('Remember the cards. ' + game.size.n + ' pairs.');
}
function status(text, kind) { const s = $('#status'); s.textContent = text; s.className = 'status chipbox' + (kind ? ' ' + kind : ''); s.hidden = !text; }
function setUp(c, up, quiet) {
  c.up = up;
  c.el.classList.toggle('up', up);
  c.el.setAttribute('aria-label', up || c.matched ? c.v : 'Card ' + (game.cards.indexOf(c) + 1) + ', face down');
  if (up && !quiet && c.say) Speech.say(c.say);
}

// size the cards so the whole board fits: try every column count, keep the biggest card
function layout() {
  const play = $('#play'), cs = getComputedStyle(play), n = game.cards.length || 16;
  const W = play.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = play.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const gap = clamp(Math.round(Math.min(W, H) * 0.02), 6, 14);
  let best = null;
  for (let cols = 2; cols <= n; cols++) {
    if (n % cols) continue;   // full rows only: 3×4, 4×4, 6×4 …
    const rows = n / cols;
    const cw = (W - gap * (cols - 1)) / cols, ch = (H - gap * (rows - 1)) / rows;
    const w = Math.min(cw, ch / 1.05, 200);
    if (!best || w > best.w + 0.5) best = { cols: cols, w: w, h: Math.min(ch, w * 1.3) };
  }
  const w = Math.floor(best.w), h = Math.floor(best.h);
  board.style.setProperty('--cw', w + 'px'); board.style.setProperty('--ch', h + 'px'); board.style.setProperty('--gap', gap + 'px');
  board.style.gridTemplateColumns = 'repeat(' + best.cols + ', ' + w + 'px)';
  game.cards.forEach((c) => fitText(c, w, h));
}
// the biggest font that keeps the card's text inside it (hyphenated words may break onto two lines)
function fitText(c, w, h) {
  const el = c.el.querySelector('.v'), inner = w * 0.84;
  if (c.kind === 'emoji') { el.style.fontSize = Math.min(w * 0.58, h * 0.5) + 'px'; return; }
  let parts = c.kind === 'word' && c.v.length > 7 && c.v.indexOf('-') > 0 && c.v.indexOf(' ') < 0 ? c.v.split('-').map((s, i, a) => s + (i < a.length - 1 ? '-' : '')) : [c.v];
  if (c.kind === 'word' && c.v.length > 10 && c.v.indexOf(' ') > 0) {
    const sp = [...c.v].map((ch, k) => (ch === ' ' ? k : -1)).filter((k) => k > 0), mid = c.v.length / 2;
    const cut = sp.reduce((b, k) => (Math.abs(k - mid) < Math.abs(b - mid) ? k : b), sp[0]);
    parts = [c.v.slice(0, cut), c.v.slice(cut + 1)];
  }
  const longest = Math.max.apply(null, parts.map((s) => s.length));
  const per = c.kind === 'expr' ? 0.56 : 0.58;
  let size = Math.max(11, Math.min(inner / (per * longest), (h * 0.72) / (parts.length * 1.08), c.kind === 'num' ? w * 0.42 : w * 0.3));
  el.style.fontSize = size + 'px';
  el.innerHTML = parts.length > 1 ? parts.map((s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')).join('<br>') : '';
  if (parts.length === 1) el.textContent = c.v;
  // the estimate is close; a word with wide letters (maximum) is measured and trimmed to fit
  for (let k = 0; k < 4 && el.offsetWidth > inner && size > 11; k++) { size = Math.max(11, size * inner / el.offsetWidth * 0.97); el.style.fontSize = size + 'px'; }
}

function tapCard(i) {
  if (game.state === 'wait') closeOpen();
  if (game.state !== 'play') return;
  const c = game.cards[i];
  if (!c || c.up || c.matched) return;
  if (!game.started) { game.started = true; game.t0 = performance.now(); }
  setUp(c, true);
  Sound.sfx.click();
  game.open.push(c);
  if (game.open.length < 2) return;
  game.moves++;
  const [a, b] = game.open;
  if (a.pair === b.pair) {
    a.matched = b.matched = true; game.open = []; game.found++;
    [a, b].forEach((x) => { x.el.classList.add('matched'); x.el.setAttribute('aria-disabled', 'true'); });
    const p = game.pairs[a.pair];
    if (p.fact) mathRight(p.fact);
    Sound.sfx.right();
    status('✓ ' + p.learned, 'good');
    announce('Pair! ' + p.learned);
    if (game.found === game.pairs.length) { game.elapsed = elapsed(); game.state = 'won'; setTimeout(finish, 650); }
  } else {
    [a, b].forEach((x) => x.el.classList.add('miss'));
    Sound.sfx.check();
    game.state = 'wait';
    game.waitTimer = setTimeout(closeOpen, 1100);
  }
  updateHud();
}
// turn the two unmatched cards back over (also when a third card is tapped before they turn)
function closeOpen() {
  clearTimeout(game.waitTimer);
  game.open.forEach((x) => { x.el.classList.remove('miss'); setUp(x, false); });
  game.open = [];
  if (game.state === 'wait') game.state = 'play';
}

function elapsed() { return game.elapsed + (game.started && (game.state === 'play' || game.state === 'wait') ? (performance.now() - game.t0) / 1000 : 0); }
function updateHud() {
  $('#pairChip').textContent = 'Pairs ' + game.found + ' / ' + game.pairs.length;
  $('#moveChip').textContent = 'Moves ' + game.moves;
  $('#timeChip').textContent = fmtTime(elapsed());
}
setInterval(() => { if (game.state === 'play' || game.state === 'wait') $('#timeChip').textContent = fmtTime(elapsed()); }, 250);

function finish() {
  if (game.state !== 'won') return;
  const time = game.elapsed, n = game.pairs.length, stars = starsFor(game.moves, n), key = keyOf();
  game.state = 'done';
  const prevBest = rec.best[key], better = !prevBest || game.moves < prevBest;
  if (better) rec.best[key] = game.moves;
  rec.stars[key] = Math.max(rec.stars[key] || 0, stars);
  rec.wins++; rec.pairs += n;
  writeSave();
  Sound.sfx.win();
  $('#doneTitle').textContent = stars === 3 ? 'Super memory!' : stars === 2 ? 'All pairs found!' : 'You found them all!';
  $('#doneStars').innerHTML = starRow(stars);
  $('#doneNote').textContent = better && prevBest ? 'New best: fewer moves than ever!' : stars < 3 ? 'Three stars at ' + starLine(n)[0] + ' moves or fewer.' : 'Three stars!';
  $('#doneStats').innerHTML = stat('Moves', game.moves) + stat('Time', fmtTime(time)) + stat('Best', rec.best[key]);
  $('#doneFound').innerHTML = game.pairs.map((p) => '<li>' + p.learned.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</li>').join('');
  announce('All pairs found in ' + game.moves + ' moves. ' + stars + ' stars.');
  setTimeout(() => { if (game.state === 'done') { $('#hud').hidden = true; status(''); showScreen('done'); } }, 500);
}

/* ================= menus ================= */
function renderHome() {
  $('#decks').innerHTML = DECKS.map((d) => '<label><input type="radio" name="deck" value="' + d.id + '"' + (d.id === rec.deck ? ' checked' : '') + '><span><i aria-hidden="true">' + d.icon + '</i>' + d.name + '<small>' + d.note + (rec.stars[d.id + '-' + rec.size] ? ' · ' + '⭐'.repeat(rec.stars[d.id + '-' + rec.size]) : '') + '</small></span></label>').join('');
  $('#sizes').innerHTML = SIZES.map((s) => '<label><input type="radio" name="size" value="' + s.id + '"' + (s.id === rec.size ? ' checked' : '') + '><span>' + s.name + '</span></label>').join('');
  const lv = document.querySelector('input[name="math"][value="' + save.settings.mathLevel + '"]');
  if (lv) lv.checked = true;
  const key = rec.deck + '-' + rec.size;
  $('#homeStats').innerHTML = stat('Best moves', rec.best[key] || '–') + stat('Boards cleared', rec.wins) + stat('Pairs found', rec.pairs);
  $('#soundBtn').textContent = save.settings.music > 0 ? 'Music on' : 'Music off';
  $('#speakBtn').textContent = save.settings.speak ? 'Read aloud on' : 'Read aloud off';
}
function start() {
  Sound.init();
  game.round++;
  // a new remix for every new board after the first, named in the status line once the cards turn over
  if (game.round === 1) { Sound.play('pair', true); game.remixName = ''; }
  else game.remixName = Sound.remix(game.round - 1, 0, 'pair');
  showScreen(null);
  $('#hud').hidden = false;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  newBoard();
}
function goHome() {
  clearTimeout(game.waitTimer); clearInterval(game.peekTimer);
  game.state = 'menu'; game.round = 0; $('#hud').hidden = true; status('');
  board.innerHTML = ''; game.cards = [];
  Sound.play('menu'); Sound.muffle(false);
  renderHome(); showScreen('home');
}
function pause() {
  if (!(game.state === 'play' || game.state === 'wait' || game.state === 'peek')) return;
  if (game.state === 'wait') closeOpen();
  if (game.started) game.elapsed = elapsed();
  game.prev = game.state; game.state = 'pause';
  Sound.muffle(true);
  $('#pauseInfo').textContent = 'Pairs ' + game.found + ' of ' + game.pairs.length + ' · ' + game.moves + ' moves';
  showScreen('pause');
}
function resume() {
  if (game.state !== 'pause') return;
  showScreen(null);
  game.state = game.prev; game.t0 = performance.now();
  Sound.muffle(false);
}

board.addEventListener('click', (e) => { const b = e.target.closest('.pc'); if (b) tapCard(+b.dataset.i); });
$('#playBtn').addEventListener('click', start);
$('#againBtn').addEventListener('click', start);
$('#newBtn').addEventListener('click', () => { showScreen(null); start(); });
$('#resumeBtn').addEventListener('click', resume);
$('#homeBtn').addEventListener('click', goHome);
$('#doneHomeBtn').addEventListener('click', goHome);
$('#pauseBtn').addEventListener('click', pause);
$('#soundBtn').addEventListener('click', () => { toggleMusic(); renderHome(); });
$('#speakBtn').addEventListener('click', () => { save.settings.speak = !save.settings.speak; writeSave(); renderHome(); if (save.settings.speak) Speech.say('Read aloud is on'); else Speech.stop(); });
document.addEventListener('change', (e) => {
  if (e.target.name === 'math') { save.settings.mathLevel = e.target.value; writeSave(); }
  else if (e.target.name === 'deck') { rec.deck = e.target.value; writeSave(); renderHome(); }
  else if (e.target.name === 'size') { rec.size = e.target.value; writeSave(); renderHome(); }
});
window.addEventListener('keydown', (e) => {
  if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat) { if (game.state === 'pause') resume(); else pause(); }
});
window.addEventListener('resize', () => { if (game.cards.length) layout(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (game.cards.length) layout(); });
arcadeGuards(pause);
arcadeLinks();

window.__pair = { game, rec, save, tap: tapCard, start, starsFor, dealPairs, numberWord, ordinalWord, Speech };
renderHome();
showScreen('home');
})();
</script>

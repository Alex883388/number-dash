en to be: familiar material is wrongly thought to be understood."},{"kind":"register","q":"Which sentence is most suitable for an academic essay?","opts":["Evidence suggests that retrieval practice improves long-term retention.","Testing yourself is way better for remembering stuff.","Honestly, rereading your notes is a total waste of time.","Loads of studies say quizzes really help you remember things."],"a":0,"why":"Academic style is cautious (suggests) and uses precise, formal words, not 'way better', 'stuff' or 'loads of'."},{"kind":"wordform","q":"The ___ (retain) of new vocabulary improves when words are reviewed every few days.","opts":["retention","retainer","retained","retainable"],"a":0,"why":"After 'The' and before 'of' we need a noun: retain becomes retention."},{"kind":"linking","q":"Rereading can be useful at first; ___, it is less effective than self-testing for long-term learning.","opts":["nevertheless","therefore","similarly","for instance"],"a":0,"why":"The second idea contrasts with the first, so we need a concession link: nevertheless."},{"kind":"cohesion","q":"Which sentence best follows? 'Spreading study over several days produces more durable learning than cramming.'","opts":["This is partly because a little forgetting between sessions makes each recall more effortful.","Cramming, in other words, means spreading study over several days.","For example, many students enjoy listening to music.","As a result, sleep has no effect on memory at all."],"a":0,"why":"'This is partly because' gives a reason for the claim. The others contradict it or change the topic."},{"kind":"collocation","q":"The researchers were careful not to ___ firm conclusions from such a small study.","opts":["draw","pull","take","make"],"a":0,"why":"We 'draw' (or reach) a conclusion; pull, take and make are not used with 'conclusions' in academic English."},{"kind":"wordform","q":"The trainees' brains changed only after a ___ (prolong) period of intense study.","opts":["prolonged","prolonging","prolongation","prolong"],"a":0,"why":"Before the noun 'period' we need an adjective: prolonged, meaning lasting a long time."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'Many people believe that they learn best when lessons match their preferred learning style, such as pictures or spoken words. However, careful experiments have found little evidence that teaching people in their favourite style helps them remember more. What seems to matter far more is whether the method suits the material being learnt.'","opts":["A popular belief that the evidence does not support","How to discover your own learning style","Why pictures always work better than words","The history of teaching in schools"],"a":0,"why":"The paragraph describes a common belief ('many people believe') and then shows that experiments do not back it up."},{"kind":"linking","q":"___ its small size, the study attracted attention from scientists around the world.","opts":["Despite","Although","Because of","Owing to"],"a":0,"why":"'Despite' + noun phrase shows contrast. 'Although' needs a clause, and 'because of' and 'owing to' give a cause, which makes no sense here."}],"writing":[{"kind":"paragraph","sents":["Retrieval practice is one of the most effective ways to make learning last.","Instead of rereading their notes, learners try to recall information from memory, for example by answering practice questions.","This effort of searching memory appears to strengthen the pathways that lead back to the information.","As a result, material that has been actively recalled is usually remembered for much longer.","Students would therefore benefit from testing themselves regularly rather than simply reviewing their notes."]},{"kind":"paragraph","sents":["Sleep plays a crucial role in turning new information into lasting memories.","During deep sleep, the brain appears to replay experiences from the day.","This replay is thought to consolidate memories, moving them into long-term storage.","Consequently, pupils who stay up late to revise may remember less than those who rest properly.","A good night's sleep, in other words, is part of studying rather than a break from it."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Lots of studies say testing yourself is really good for remembering stuff.'?","opts":["A considerable body of research suggests that self-testing improves long-term retention.","Many studies say testing yourself is very good for remembering things.","Testing yourself is good, and studies have shown it loads of times, I think.","Research proves that testing always makes people remember everything."],"a":0,"why":"The first is formal, precise and suitably cautious ('suggests'). The others stay vague ('things'), sound chatty ('loads', 'I think') or overclaim ('proves', 'always')."},{"kind":"topic","q":"Which topic sentence fits best? '___ For example, a child who learns the violin develops stronger connections in the brain areas that control the fingers. Even in older adults, learning a new skill such as juggling can produce measurable changes in brain structure.'","opts":["The brain continues to change physically in response to learning throughout life.","Playing the violin is a popular hobby among children.","Older adults should all learn to juggle.","The brain is very interesting and has lots of different parts."],"a":0,"why":"Both examples show the brain changing through learning at different ages. The others pick out one detail, give advice the paragraph never gives, or are vague."},{"kind":"thesis","q":"Some people believe that children learn best by memorising facts, while others think that understanding is more important. Discuss both views and give your opinion. Which is the clearest thesis statement?","opts":["While memorising facts has some value, this essay argues that deep understanding should be the main aim, as it allows knowledge to be applied.","Memorising and understanding are both things that children do at school.","In this essay I will talk about memory.","Memorising facts is completely useless and should be banned in every school."],"a":0,"why":"The first recognises both views, takes a clear position and gives a reason. The others describe without answering, are vague, or overclaim and ignore one side."}]},{"id":"expert-2","title":"Biodiversity","emoji":"🦋","words":[{"w":"indigenous","def":"living or growing naturally in a place, not brought there from somewhere else","ex":"The kiwi is ___ to New Zealand and is found nowhere else in the wild.","pos":"adj","syn":["native"],"ant":["introduced","foreign"]},{"w":"decline","def":"a gradual fall in the number, amount or quality of something","ex":"Scientists have recorded a steady ___ in the number of wild bees in some regions.","pos":"noun","syn":["fall","drop"],"ant":["increase","rise"]},{"w":"deplete","def":"to reduce the amount of something so much that very little is left","ex":"Overfishing can ___ fish stocks faster than they are able to recover.","pos":"verb","forms":{"verb":"deplete","noun":"depletion","adj":"depleted"}},{"w":"pollinator","def":"an animal, such as a bee or a bat, that carries pollen from flower to flower","ex":"The bee is the best-known ___, but moths, birds and bats do the same job.","pos":"noun"},{"w":"invasive","def":"spreading into a new area and harming the plants or animals already living there","ex":"Gardeners are asked not to plant ___ species that could escape and crowd out wild flowers.","pos":"adj","ant":["native"]},{"w":"interdependent","def":"relying on each other in order to survive or work well","ex":"In a rainforest, plants and animals are ___: when one species disappears, others suffer too.","pos":"adj"},{"w":"restoration","def":"the work of returning something to its earlier, healthy condition","ex":"The ___ of the wetland brought back birds that had not been seen there for decades.","pos":"noun","forms":{"noun":"restoration","verb":"restore"}},{"w":"fragmentation","def":"the breaking of something into small, separate parts","ex":"New roads cause habitat ___, leaving animals trapped in small patches of forest.","pos":"noun","forms":{"noun":"fragmentation","verb":"fragment"}},{"w":"sustain","def":"to keep something alive, or to keep it going over a long time","ex":"A single old oak tree can ___ hundreds of different kinds of insects.","pos":"verb","syn":["support"],"forms":{"verb":"sustain","adj":"sustainable","noun":"sustainability"}},{"w":"abundant","def":"existing in very large numbers or amounts","ex":"Before the dam was built, salmon were so ___ that the river seemed to shine silver.","pos":"adj","syn":["plentiful"],"ant":["scarce","rare"],"forms":{"adj":"abundant","noun":"abundance"}},{"w":"keystone species","def":"a plant or animal that many other living things in its area depend on","ex":"Sea otters are a ___ because they stop sea urchins from destroying kelp forests.","pos":"phrase"},{"w":"evolve","def":"to develop gradually over many generations","ex":"Species slowly ___ as small changes are passed from one generation to the next.","pos":"verb","forms":{"verb":"evolve","noun":"evolution","adj":"evolutionary"}},{"w":"biodiversity","def":"the variety of plants, animals and other living things in a particular place","ex":"A healthy coral reef has such rich ___ that it can be home to thousands of different species.","pos":"noun"},{"w":"aquatic","def":"living or growing in water","ex":"Frogs begin life as ___ tadpoles, breathing through gills, before they move onto land.","pos":"adj"},{"w":"flourish","def":"to grow strongly and healthily","ex":"Once the goats were removed from the island, rare plants began to ___ again.","pos":"verb","syn":["thrive"]},{"w":"reintroduce","def":"to bring a plant or animal back to an area where it used to live","ex":"Conservationists plan to ___ beavers to rivers where they have not lived for centuries.","pos":"verb","forms":{"verb":"reintroduce","noun":"reintroduction"}},{"w":"dispersal","def":"the spreading of things, such as seeds, over a wide area","ex":"Birds that eat berries help with seed ___, dropping the seeds far from the parent plant.","pos":"noun","forms":{"noun":"dispersal","verb":"disperse"}},{"w":"inhabit","def":"to live in a particular place","ex":"Polar bears ___ the frozen coasts of the Arctic, hunting seals on the sea ice.","pos":"verb","syn":["occupy"],"forms":{"verb":"inhabit","noun":"inhabitant"}},{"w":"niche","def":"the particular role and place of a living thing within its environment","ex":"Each species of finch fills its own ___, feeding on a different kind of seed.","pos":"noun"},{"w":"coexist","def":"to live or exist together in the same place at the same time","ex":"In some forests, wolves and bears manage to ___ peacefully, each keeping out of the other's way.","pos":"verb","forms":{"verb":"coexist","noun":"coexistence"}}],"grammar":[{"q":"Not only ___ wild flowers, but they also pollinate many of our crops.","opts":["do bees pollinate","bees pollinate","bees do pollinate","pollinate bees"],"a":0,"why":"When 'Not only' starts a sentence, use question order: Not only do bees pollinate..."},{"q":"The kakapo, a flightless parrot from New Zealand, ___ to be the heaviest parrot in the world.","opts":["is thought","thinks","is thinking","it is thought"],"a":0,"why":"Use 'subject + is thought to be' when we report what people generally believe."},{"q":"The rapid ___ of rainforests threatens thousands of species.","opts":["destruction","destroy","destroyed","destructive"],"a":0,"why":"After 'The rapid' and before 'of' we need a noun: destroy becomes destruction (nominalisation)."},{"q":"It is vital that every visitor ___ to the marked paths in the nature reserve.","opts":["keep","kept","keeping","to keep"],"a":0,"why":"After 'It is vital that...', formal English uses the base form (the subjunctive): every visitor keep."},{"q":"___ in only one small forest, the bird is at great risk if that forest is cleared.","opts":["Found","Finding","Having found","To find"],"a":0,"why":"The bird is found there (passive meaning), so the participle clause starts with 'Found'."},{"q":"It was the arrival of rats on the island ___ caused the decline of its native birds.","opts":["that","what","who","where"],"a":0,"why":"In a cleft sentence 'It was X that...', use 'that'; 'who' is only for people."},{"q":"Only after the rats had been removed ___ to nest on the island again.","opts":["did the seabirds begin","the seabirds began","began the seabirds","the seabirds did begin"],"a":0,"why":"When 'Only after + clause' starts the sentence, the main clause uses question order: did the seabirds begin."},{"q":"Around a million species ___ to be at risk, according to a major report published in 2019.","opts":["are estimated","estimate","are estimating","it is estimated"],"a":0,"why":"Species cannot estimate anything themselves, so use the passive reporting pattern: are estimated to be."},{"q":"The ___ of wildlife corridors allows animals to move safely from one forest to another.","opts":["creation","create","creative","created"],"a":0,"why":"After 'The' and before 'of' we need a noun: create becomes creation (nominalisation)."},{"q":"It would ___ that the turtles return to the same beach to nest every few years.","opts":["appear","appears","be appeared","appearing"],"a":0,"why":"'It would appear that...' is a cautious way of saying 'It seems that...'; after 'would' we need the base form."}],"sentences":["Bees pollinate many of the crops that we depend on for food.","Healthy soils sustain an enormous variety of tiny living creatures.","It is vital that every visitor keep to the marked paths.","Sea otters are a keystone species in the kelp forests of the Pacific.","Frogs begin life as aquatic tadpoles that breathe through gills.","Polar bears inhabit the frozen coasts of the Arctic Ocean."],"reading":[{"title":"The wolves of Yellowstone","text":"In 1995, a small group of grey wolves was released into Yellowstone National Park in the United States, roughly seventy years after the animals had disappeared from the area. The decision was controversial, yet it has since become one of the most widely discussed experiments in modern conservation.\n\nWolves are often described as a keystone species, meaning that their influence on an ecosystem is far greater than their numbers would suggest. Before their return, large herds of elk grazed freely along the park's rivers, eating young willow and aspen trees before they could grow tall. Once wolves were back, the elk were not only reduced in number but also appeared to change their behaviour, spending less time in open valleys where they could easily be spotted.\n\nAccording to some researchers, this set off a chain of effects known as a trophic cascade. With less grazing, willows recovered along certain riverbanks, providing food and building material for beavers. Beaver dams, in turn, created ponds that suited fish, frogs and birds.\n\nHowever, the story may be less tidy than it is sometimes told. Other scientists point out that the recovery of plants has been patchy, and that several factors, including dry weather, a growing number of bears and the activities of people outside the park, also affected elk numbers. Separating the role of the wolves from these other influences has proved difficult.\n\nWhat few dispute is that the return of a single predator encouraged scientists to look far more closely at how the members of an ecosystem depend on one another. Whatever the precise explanation, Yellowstone has become a living laboratory for the study of nature's connections.","qs":[{"type":"tfng","q":"Wolves had been absent from Yellowstone for about seven decades before 1995.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"The wolves released in 1995 had been brought from Canada.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"Scientists all agree that the wolves were the main reason the willows recovered.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"What does the writer suggest by saying the story 'may be less tidy than it is sometimes told'?","opts":["The popular version may simplify a more complicated situation.","The park has become dirtier since the wolves arrived.","Scientists have decided to stop studying the wolves.","The wolves have caused more damage than anyone expected."],"a":0},{"type":"mc","q":"Which title best summarises the passage?","opts":["Wolves and willows: a powerful but debated chain of effects","How beavers build their dams and ponds","Why wolves should be kept out of national parks","The history of Yellowstone's first human visitors"],"a":0}]},{"title":"A vault for the world's seeds","text":"Deep inside a frozen mountain on Spitsbergen, an island in the Norwegian Arctic, lies one of the most unusual storehouses on Earth. The Svalbard Global Seed Vault, which opened in 2008, holds copies of seeds from crop collections around the world. Its purpose is simple but ambitious: to act as a back-up, so that if seeds kept elsewhere are lost through accident, equipment failure or natural disaster, they can be replaced.\n\nThe location was chosen with great care. The vault lies well above sea level, and the surrounding rock and permafrost keep it naturally cold. Inside, the seeds are sealed in foil packets and stored at about minus 18 degrees Celsius, a temperature at which many kinds of seed can survive for decades, and some for centuries. The vault has room for around 4.5 million samples, each usually containing several hundred seeds.\n\nThe arrangement resembles a safe-deposit box at a bank. Countries and organisations that send seeds remain their owners, and only they can withdraw them. The first withdrawal took place in 2015, when a research centre that had lost access to its own collection asked for some of its samples back, so that it could grow fresh seeds at new sites.\n\nWhy does such variety matter? Old and local crop varieties often carry useful traits, such as resistance to drought or to particular pests, which plant breeders may one day need as conditions change. Once a variety disappears, these traits cannot be recreated.\n\nEven this carefully planned facility has faced surprises. In 2017, unusually warm weather allowed meltwater to flow into the entrance tunnel. The seeds themselves were not affected, but the incident led to improvements to the building. The vault, in other words, is not a guarantee, but it is a remarkable insurance policy for the plants that feed us.","qs":[{"type":"tfng","q":"Organisations that store seeds in the vault give up their ownership of them.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Norway pays for all the seeds to be collected and sent to the vault.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the passage, why are old and local crop varieties valuable?","opts":["They may have qualities that plant breeders will need in the future.","They grow much faster than modern varieties.","They can easily be recreated if they are lost.","They are the only seeds that survive at low temperatures."],"a":0},{"type":"mc","q":"What can be inferred about the research centre that made the first withdrawal?","opts":["It had earlier sent copies of its own seeds to the vault.","It was based on the island of Spitsbergen.","It had never stored seeds anywhere before.","It wanted to study the effect of cold on seeds."],"a":0},{"type":"mc","q":"What is the writer's main purpose in the final paragraph?","opts":["to show that the vault is valuable even though it cannot offer complete protection","to argue that the vault should be moved to a warmer place","to explain how the entrance tunnel was first built","to suggest that the seeds are no longer safe in the vault"],"a":0}]}],"extra":[{"kind":"collocation","q":"Plastic waste ___ a serious threat to sea turtles.","opts":["poses","makes","does","takes"],"a":0,"why":"We say 'pose a threat'; make, do and take do not go with 'threat'."},{"kind":"wordform","q":"Bees play a vital role in the ___ (pollinate) of many fruit trees.","opts":["pollination","pollinator","pollinate","pollinated"],"a":0,"why":"We need a noun for the process: pollination. A pollinator is the animal, not the process."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Their influence is far greater than their numbers would suggest.'?","opts":["Although there are few of them, they have a very large effect.","Because there are many of them, their effect is large.","Their numbers are growing faster than their influence.","Their effect is small because there are so few of them."],"a":0,"why":"'Greater than their numbers would suggest' means a big effect from a small number."},{"kind":"linking","q":"___ wolves reduced the number of elk, other factors such as dry weather also played a part.","opts":["While","Because","Unless","So that"],"a":0,"why":"'While' here means 'although': it admits one point and then adds a contrasting one."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'Bees, butterflies and bats move pollen between flowers, allowing plants to produce seeds and fruit. Without them, many crops would give far smaller harvests, and some wild plants could disappear.'","opts":["Why pollinators matter","How bats find their way in the dark","The life cycle of a butterfly","Farming without machines"],"a":0,"why":"The whole paragraph explains how important pollinating animals are for plants and crops."},{"kind":"preposition","q":"Many woodland birds depend ___ the shelter that old trees provide.","opts":["on","of","at","with"],"a":0,"why":"The verb 'depend' is followed by 'on' (or 'upon')."},{"kind":"register","q":"Which sentence is most suitable for an academic essay?","opts":["The loss of hedgerows has been linked to declining numbers of farmland birds.","Chopping down hedges is really bad news for birds.","Birds are in big trouble 'cause hedges keep disappearing.","Hedges? Get rid of them and the birds are gone, simple as that."],"a":0,"why":"Academic writing is impersonal and cautious ('has been linked to') and avoids chatty phrases such as 'bad news' or 'big trouble'."},{"kind":"cohesion","q":"Which sentence best fills the gap? 'Seed banks store samples of many plant varieties. ___ If a variety is lost in the wild, it can therefore be grown again.'","opts":["These samples can stay alive for decades at very low temperatures.","However, most seeds die within a few days in a freezer.","For example, sunflowers are popular in gardens.","In contrast, wild animals cannot be stored in this way."],"a":0,"why":"'Therefore' needs a reason before it: only the fact that the samples stay alive explains why a lost variety can be grown again."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Once a variety disappears, these traits cannot be recreated.'?","opts":["If a variety is lost, its special qualities are lost for ever.","These traits disappear whenever a new variety is created.","Lost varieties can be recreated from their traits.","A variety disappears as soon as its traits are recreated."],"a":0,"why":"'Once it disappears' means after it is lost, and 'cannot be recreated' means it can never be made again."},{"kind":"collocation","q":"Conservation groups are working hard to ___ awareness of the importance of wild bees.","opts":["raise","rise","lift","make"],"a":0,"why":"We 'raise awareness' of something. 'Rise' cannot take an object, and 'lift' and 'make' do not go with 'awareness'."}],"writing":[{"kind":"paragraph","sents":["Pollinators are essential to both wild ecosystems and human food supplies.","Bees, butterflies and other animals carry pollen between flowers, allowing plants to produce seeds and fruit.","Without this service, many crops, such as apples and almonds, would give far smaller harvests.","However, pollinator numbers have declined in many regions because of habitat loss and the use of pesticides.","Protecting wild flowers and reducing chemical use could therefore help to secure future food production."]},{"kind":"paragraph","sents":["Wildlife corridors offer a practical solution to the problem of habitat fragmentation.","When roads and farms divide a forest, animals can become trapped in small, isolated patches.","Such isolation makes it harder for them to find food and mates.","A corridor, such as a strip of woodland or a bridge over a motorway, reconnects these patches.","As a result, animals can move freely again, and their populations become more stable."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Lots of animals are dying out because people are wrecking where they live.'?","opts":["Many species are in decline as a result of habitat destruction caused by human activity.","Loads of animals are disappearing because people are destroying their homes.","Animals are dying because of things people do.","Every animal on Earth will soon disappear because of humans."],"a":0,"why":"The first uses precise academic terms ('species', 'in decline', 'habitat destruction'). The others are informal ('loads'), vague ('things people do') or overclaim ('every animal')."},{"kind":"topic","q":"Which topic sentence fits best? '___ A single oak tree, for instance, can support hundreds of species of insects, birds and fungi. When such trees are cut down, many of these species lose both their food and their shelter.'","opts":["Old trees provide homes for a remarkable range of wildlife.","Oak trees grow slowly and can live for hundreds of years.","Fungi are living things that are neither plants nor animals.","Trees are nice and we should like them more."],"a":0,"why":"The body is about the many species that depend on one tree. The other sentences are off topic or too vague and informal for a topic sentence."},{"kind":"thesis","q":"Some people think that protecting wild animals is a waste of money when there are so many human problems to solve. To what extent do you agree or disagree? Which is the clearest thesis statement?","opts":["I disagree, because protecting wildlife also protects the clean water, food and stable climate on which people depend.","There are many wild animals and many human problems in the world.","Animals are cute, so obviously we have to save them.","Not a single penny should be spent on people until every animal is safe."],"a":0,"why":"The first answers the question directly and links wildlife to human needs. The others give no position, rely on a weak and informal reason, or take an extreme view."}]},{"id":"expert-3","title":"Ancient civilisations","emoji":"🏛️","words":[{"w":"artefact","def":"an object made by people, especially one from the past that is of historical interest","ex":"Each ___ found in the tomb was photographed before it was carefully moved.","pos":"noun"},{"w":"excavate","def":"to dig carefully in the ground to find objects or buildings from the past","ex":"Archaeologists spent ten years trying to ___ the buried city.","pos":"verb","forms":{"verb":"excavate","noun":"excavation"}},{"w":"inscription","def":"words cut into stone, metal or another hard surface","ex":"The ___ on the Rosetta Stone appears in three different scripts.","pos":"noun","forms":{"noun":"inscription","verb":"inscribe"}},{"w":"dynasty","def":"a series of rulers who all belong to the same family","ex":"The Ming ___ ruled China for nearly three hundred years.","pos":"noun"},{"w":"hierarchy","def":"a system in which people or things are arranged in levels of importance","ex":"In ancient Egypt, the pharaoh stood at the top of a strict social ___.","pos":"noun","forms":{"noun":"hierarchy","adj":"hierarchical"}},{"w":"irrigation","def":"supplying water to land through channels or pipes so that crops can grow","ex":"Without ___ canals, farmers in Mesopotamia could not have grown crops in such a dry land.","pos":"noun","forms":{"noun":"irrigation","verb":"irrigate"}},{"w":"decipher","def":"to work out the meaning of writing that is very difficult to read or understand","ex":"It took scholars many years to ___ Egyptian hieroglyphs.","pos":"verb","syn":["decode"],"forms":{"verb":"decipher","noun":"decipherment"}},{"w":"prosperous","def":"rich and successful","ex":"Thanks to trade, once poor fishing villages became ___ towns full of wealthy merchants.","pos":"adj","syn":["wealthy","thriving"],"ant":["poor"],"forms":{"adj":"prosperous","noun":"prosperity","verb":"prosper"}},{"w":"legacy","def":"something from the past that is handed down to the people who come later","ex":"The Romans left a lasting ___ of roads, bridges and thousands of Latin-based words.","pos":"noun","syn":["heritage"]},{"w":"chronological","def":"arranged in the order in which events happened","ex":"The museum displays its objects in ___ order, from the oldest to the most recent.","pos":"adj","forms":{"adj":"chronological","adv":"chronologically"}},{"w":"derive","def":"to come from, or develop from, something else","ex":"The word 'pharaoh' is thought to ___ from an Egyptian phrase meaning 'great house'.","pos":"verb","forms":{"verb":"derive","noun":"derivation"}},{"w":"sophisticated","def":"advanced and complex, showing a lot of skill and knowledge","ex":"The Maya developed a ___ calendar based on careful observation of the sky.","pos":"adj","syn":["advanced"],"ant":["simple","basic"]},{"w":"papyrus","def":"a kind of paper made in ancient Egypt from the stems of a water plant","ex":"Egyptian scribes wrote on sheets of ___ made from reeds that grew along the Nile.","pos":"noun"},{"w":"scribe","def":"a person whose job was to write out documents by hand before printing was invented","ex":"Training to become a ___ in ancient Egypt took many years of copying signs.","pos":"noun"},{"w":"nomadic","def":"moving from place to place instead of living in one place","ex":"Before farming began, most people led a ___ life, never staying in one place for long.","pos":"adj","ant":["settled"],"forms":{"adj":"nomadic","noun":"nomad"}},{"w":"domesticate","def":"to tame wild animals or grow wild plants so that people can keep and use them","ex":"Wolves were the first wild animals that humans managed to ___, turning them over time into dogs.","pos":"verb","syn":["tame"],"forms":{"verb":"domesticate","noun":"domestication"}},{"w":"commemorate","def":"to do something special in order to remember and honour an important person or event","ex":"The coins were made to ___ the emperor's tenth year on the throne.","pos":"verb","syn":["honour"],"forms":{"verb":"commemorate","noun":"commemoration"}},{"w":"attribute","def":"to say that something was caused, made or written by a particular person or thing","ex":"Many historians ___ the city's decline to a long period of drought.","pos":"verb","forms":{"verb":"attribute","noun":"attribution"}},{"w":"aqueduct","def":"a bridge or channel built to carry water over a long distance","ex":"The Pont du Gard in France is a Roman ___ that once carried water across a river valley.","pos":"noun"},{"w":"subsequently","def":"after something else had happened; later","ex":"The statue was found by a farmer in 1820 and ___ taken to the Louvre in Paris.","pos":"adv","syn":["later","afterwards"],"forms":{"adv":"subsequently","adj":"subsequent"}}],"grammar":[{"q":"The pyramids at Giza ___ built around 4,500 years ago.","opts":["are believed to have been","are believed to be","believe to have been","are believing to have been"],"a":0,"why":"For a belief now about a past event, use 'is/are believed to have been + past participle'."},{"q":"Only when the Rosetta Stone was studied closely ___ able to read hieroglyphs.","opts":["were scholars","scholars were","did scholars","scholars had"],"a":0,"why":"After 'Only when + clause' at the start, the main clause uses question order: were scholars able."},{"q":"Hardly ___ the door of the tomb when they saw the glint of gold.","opts":["had they opened","they had opened","did they opened","have they opened"],"a":0,"why":"'Hardly had + subject + past participle... when' shows one past action followed at once by another."},{"q":"If the Romans hadn't built such strong roads, some of them ___ still in use today.","opts":["wouldn't be","wouldn't have been","won't be","aren't"],"a":0,"why":"Mixed conditional: a past condition (hadn't built) with a present result (today) takes 'would + verb'."},{"q":"___ the hieroglyphs, Champollion could finally read the names of the pharaohs.","opts":["Having deciphered","Deciphered","Having been deciphered","To be deciphered"],"a":0,"why":"Champollion did the deciphering first (active, earlier action), so use 'Having + past participle'."},{"q":"It ___ that the city was abandoned after its river changed course.","opts":["is thought","thinks","is thinking","has thought"],"a":0,"why":"'It is thought that...' reports a general belief without saying who holds it."},{"q":"___ surprised the archaeologists most was the size of the hidden chamber.","opts":["What","Which","That","It"],"a":0,"why":"A 'What' cleft puts the focus on the key point: What surprised them most was... 'Which', 'That' and 'It' cannot start this pattern."},{"q":"It is crucial that the site ___ carefully before any building work begins.","opts":["be surveyed","being surveyed","to be surveyed","surveying"],"a":0,"why":"After 'It is crucial that...', formal English uses the base form (the subjunctive); here it is passive: the site be surveyed."},{"q":"Little ___ the farmer know that his field hid the remains of an ancient city.","opts":["did","had","was","knew"],"a":0,"why":"When 'Little' starts the sentence with a negative meaning, use 'did + subject + base form': Little did the farmer know."},{"q":"The ___ of writing allowed early cities to keep records of trade and taxes.","opts":["invention","invent","inventive","invented"],"a":0,"why":"After 'The' and before 'of' we need a noun: invent becomes invention (nominalisation)."}],"sentences":["Archaeologists use careful methods to excavate a site without damaging it.","Many English words are derived from the language of the ancient Romans.","Champollion is credited with the decipherment of Egyptian hieroglyphs.","The Great Pyramid is believed to have been built for the pharaoh Khufu.","Wolves were the first wild animals that humans domesticated.","Egyptian scribes wrote on sheets made from the papyrus plant."],"reading":[{"title":"Reading the Rosetta Stone","text":"When a slab of dark stone was found near the town of Rashid, known in English as Rosetta, in 1799, few could have guessed how important it would become. The stone carries the same official message written three times: in hieroglyphs, in a later Egyptian script called Demotic, and in ancient Greek. Since scholars could already read Greek, the stone offered something extremely rare: a key to a writing system that nobody had understood for well over a thousand years.\n\nEven so, the task proved far harder than expected. Many early researchers assumed that each hieroglyph represented a whole idea, much like a small picture, and their attempts to match the signs to the Greek text led nowhere. The English scientist Thomas Young made important progress, showing that the oval shapes known as cartouches contained royal names written with signs for sounds.\n\nIt was the French scholar Jean-François Champollion who finally solved the puzzle in 1822. His great advantage was a deep knowledge of Coptic, a late form of the Egyptian language that was still used in church services. This allowed him to recognise that hieroglyphic writing was a mixture of signs: some stood for sounds, while others represented whole words or ideas.\n\nThe consequences were enormous. Thousands of inscriptions on temples, tombs and papyrus scrolls could now be read, opening a window onto Egyptian history, religion and daily life. Today the stone is one of the most visited objects in the British Museum, and its name has entered everyday English: a 'Rosetta Stone' is anything that unlocks a difficult problem.","qs":[{"type":"tfng","q":"When the stone was found, scholars were already able to read one of its three versions of the message.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Champollion travelled to Egypt before he solved the puzzle of the hieroglyphs.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"Why did many early attempts to read the hieroglyphs fail?","opts":["Researchers wrongly believed that every sign stood for a complete idea.","The Greek part of the stone was too damaged to read.","Nobody was allowed to study the stone closely.","The hieroglyphs on the stone were written in Coptic."],"a":0},{"type":"mc","q":"What can be inferred from the passage?","opts":["Champollion built on earlier discoveries rather than working entirely alone.","Thomas Young understood hieroglyphs better than Champollion did.","Demotic was the oldest of the three scripts on the stone.","Hieroglyphs were still widely read when the stone was found."],"a":0},{"type":"mc","q":"Why does the writer mention the everyday meaning of 'a Rosetta Stone'?","opts":["to show how deeply the discovery has influenced the way people speak","to explain how the stone was taken to the British Museum","to suggest that the stone is less important than people think","to compare the work of Champollion with that of Young"],"a":0}]},{"title":"An ancient computer from the sea","text":"In 1900, a group of sponge divers sheltering from a storm near the Greek island of Antikythera came across the wreck of an ancient ship. Over the following months, divers brought up bronze and marble statues, pottery and coins. Among the finds was a shapeless lump of corroded bronze and wood that attracted little attention at first. Only later did someone notice that it contained a gearwheel.\n\nThe object, now known as the Antikythera mechanism, is thought to date from around the second or first century BC. It survives in dozens of fragments, and at least thirty bronze gears can still be identified. For most of the twentieth century, researchers could only guess how it had worked. A major step forward came in the 2000s, when X-ray scans allowed scientists to see inside the fragments and to read thousands of tiny letters inscribed on its surfaces, many of which had not been visible for two thousand years.\n\nThese studies revealed that the device was, in effect, a hand-operated calculator for the sky. By turning a handle, a user could show the positions of the Sun and Moon on a chosen date, display the phase of the Moon and predict eclipses. One dial even tracked the four-year cycle of major athletic games, including the Olympics.\n\nWhat astonishes historians is the sophistication of its design. No device of comparable complexity is known from the following thousand years or more. Some researchers suggest that it cannot have been the only one of its kind, since such skill is unlikely to have appeared from nowhere, yet no similar machine has been found. Who built it, and why, remains uncertain.","qs":[{"type":"tfng","q":"The divers found the shipwreck while they were deliberately searching for ancient treasure.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"The mechanism was the heaviest object recovered from the wreck.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the passage, what did the X-ray scans make possible?","opts":["reading writing on the device that could no longer be seen with the eye","rebuilding the ancient ship from its broken pieces","discovering the name of the person who built the device","proving that the device was used at the Olympic Games"],"a":0},{"type":"mc","q":"What can be inferred from the final paragraph?","opts":["Some experts believe similar devices once existed, although none has been discovered.","The mechanism was copied many times in the centuries that followed.","Historians know exactly who designed the mechanism.","The device was too simple to have been the only one of its kind."],"a":0},{"type":"mc","q":"Which title best summarises the passage?","opts":["A remarkable device whose secrets are slowly being uncovered","How sponge divers worked in ancient Greece","The early history of the Olympic Games","Why bronze objects change in sea water"],"a":0}]}],"extra":[{"kind":"collocation","q":"The discovery of the tomb ___ a great deal of interest around the world.","opts":["attracted","collected","took","made"],"a":0,"why":"We say 'attract interest' (or 'attract attention'); collect, take and make do not go with 'interest' here."},{"kind":"wordform","q":"The ___ (prosperous) of the city depended on trade along the river.","opts":["prosperity","prosper","prosperously","prospered"],"a":0,"why":"After 'The' and before 'of' we need a noun: prosperous becomes prosperity."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Nobody had understood the writing for well over a thousand years.'?","opts":["For more than ten centuries, no one had been able to read it.","It had been understood for just under a thousand years.","Only a few experts had read it during the previous thousand years.","The writing had been invented a little over a thousand years earlier."],"a":0,"why":"'Well over a thousand years' means clearly more than ten centuries, and 'nobody' means no one at all."},{"kind":"register","q":"Which sentence is most appropriate in a formal history essay?","opts":["The civilisation declined owing to a combination of environmental and economic factors.","The civilisation kind of fell apart because of loads of problems.","Basically, things went wrong and the civilisation was finished.","The civilisation went downhill big time for lots of reasons."],"a":0,"why":"Formal writing uses precise words (declined, owing to, factors) and avoids 'kind of', 'loads of' and 'big time'."},{"kind":"cohesion","q":"Which sentence best follows? 'Many early researchers assumed that each hieroglyph represented a whole idea.'","opts":["This belief, however, turned out to be only partly correct.","Hieroglyphs are therefore impossible to read today.","In addition, the stone was found in 1799 near Rosetta.","As a result, Greek was the only language the Egyptians wrote."],"a":0,"why":"'This belief' points back to the assumption and 'however' prepares the correction. The others are false or off topic."},{"kind":"linking","q":"The Indus script has been studied for over a century; ___, it has still not been deciphered.","opts":["even so","consequently","in addition","for example"],"a":0,"why":"The result is the opposite of what we would expect, so we need a concession link: even so."},{"kind":"collocation","q":"The discovery ___ doubt on the idea that ancient technology was always simple.","opts":["cast","threw away","put","made"],"a":0,"why":"To 'cast doubt on' an idea means to make it seem less certain; 'put' and 'made' do not go with 'doubt on', and 'threw away' means something else."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'Many Roman harbour walls have survived in sea water for around two thousand years, while some modern concrete cracks within decades. Studies suggest that the Romans' mixture of volcanic ash, lime and seawater slowly formed new minerals, which made the material stronger over time.'","opts":["The secret of Rome's long-lasting concrete","How the Romans built their ships","Why modern harbours are larger","The dangers of living near volcanoes"],"a":0,"why":"The paragraph compares Roman and modern concrete and explains why the Roman kind has lasted so long."},{"kind":"linking","q":"The city grew rich ___ its position on a major trade route.","opts":["by virtue of","in spite of","regardless of","instead of"],"a":0,"why":"'By virtue of' is a formal way to give a reason (because of). The other phrases show contrast or replacement, which does not fit."},{"kind":"paraphrase","q":"Which sentence means the same as: 'No device of comparable complexity is known from the following thousand years.'?","opts":["For ten centuries afterwards, nothing so complicated is known to have been made.","Many similar devices were made during the following thousand years.","The device was copied exactly a thousand years later.","It took a thousand years to build such a complex device."],"a":0,"why":"'Of comparable complexity' means just as complicated, and 'no device is known' means none has been found from that period."}],"writing":[{"kind":"paragraph","sents":["The development of irrigation was a turning point for early civilisations.","In Mesopotamia, farmers dug canals to carry water from the Tigris and Euphrates rivers to their fields.","This allowed them to grow far more food than they needed for themselves.","The resulting surplus meant that some people could stop farming and become builders, traders or scribes.","In this way, a simple technology helped to create the first cities."]},{"kind":"paragraph","sents":["Radiocarbon dating has transformed the way archaeologists establish the age of their finds.","The method measures how much of a particular form of carbon remains in material that was once alive, such as wood or bone.","Because this carbon decays at a known rate, scientists can calculate roughly when the plant or animal died.","Thanks to this technique, many earlier estimates based only on styles of pottery have since been corrected."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'The Romans did lots of stuff that we still use today.'?","opts":["Many Roman innovations, such as concrete and paved roads, continue to influence modern engineering.","The Romans made loads of things we still use.","We still use Roman things today, like stuff for building.","Everything we use today was invented by the Romans."],"a":0,"why":"The first names specific examples and uses precise words ('innovations', 'influence'). The others are vague or informal ('loads', 'stuff') or overclaim ('everything')."},{"kind":"topic","q":"Which topic sentence fits best? '___ Clay tablets from Mesopotamia record the sale of grain and cattle, while Egyptian papyri list the taxes paid by farmers. Without such records, large cities would have been very difficult to organise.'","opts":["Early writing systems played a vital role in organising trade and taxation.","Papyrus was made from reeds that grew along the Nile.","Cattle were very important animals in the ancient world.","Writing is something people have done for a really long time."],"a":0,"why":"Both examples are records of trade and tax, and the last sentence explains why they mattered. The others focus on a minor detail or are vague."},{"kind":"thesis","q":"Some people believe that money spent on archaeological excavations would be better spent on modern needs. To what extent do you agree or disagree? Which is the clearest thesis statement?","opts":["Although modern needs are pressing, I believe funding archaeology is justified, since understanding the past helps societies to make wiser decisions today.","Archaeology involves digging up old objects from the ground.","Old stuff is boring, so who cares about it?","In this essay, both archaeology and modern needs will be mentioned."],"a":0,"why":"The first states a clear, reasoned position on the question. The others only describe archaeology, are too informal, or promise to mention the topic without taking a view."}]},{"id":"expert-4","title":"Robots and AI","emoji":"🤖","words":[{"w":"algorithm","def":"a set of step-by-step rules that a computer follows to solve a problem","ex":"The music app uses an ___ to suggest songs you might enjoy.","pos":"noun","forms":{"noun":"algorithm","adj":"algorithmic"}},{"w":"automate","def":"to make a process work by machine so that people do not have to do it","ex":"Many factories ___ dull, repetitive tasks so that workers can focus on skilled jobs.","pos":"verb","forms":{"verb":"automate","noun":"automation","adj":"automated"}},{"w":"autonomous","def":"able to act and make decisions on its own, without human control","ex":"An ___ drone can fly a planned route without a human pilot.","pos":"adj","syn":["independent"],"forms":{"adj":"autonomous","noun":"autonomy","adv":"autonomously"}},{"w":"sensor","def":"a device that detects things such as light, heat, sound or movement","ex":"A ___ underneath the robot vacuum stops it falling down the stairs.","pos":"noun"},{"w":"bias","def":"an unfair preference for or against a person, group or idea","ex":"If the training photos show mostly one group of people, the system may develop a ___.","pos":"noun","syn":["prejudice"],"forms":{"noun":"bias","adj":"biased"}},{"w":"interpret","def":"to work out and explain the meaning of something","ex":"Voice assistants must ___ what we mean, not just the words we say.","pos":"verb","forms":{"verb":"interpret","noun":"interpretation"}},{"w":"precision","def":"the quality of being very exact and accurate","ex":"Surgical robots can make tiny cuts with a ___ that no human hand can match.","pos":"noun","syn":["accuracy"],"forms":{"noun":"precision","adj":"precise","adv":"precisely"}},{"w":"ethical","def":"connected with what is morally right or wrong","ex":"Scientists are debating the ___ questions raised by machines that make decisions about people.","pos":"adj","ant":["unethical"],"forms":{"adj":"ethical","noun":"ethics","adv":"ethically"}},{"w":"capability","def":"the ability or power to do something","ex":"The latest robot vacuum has the ___ to map every room in a house.","pos":"noun","forms":{"noun":"capability","adj":"capable"}},{"w":"obsolete","def":"no longer used because something newer and better has been invented","ex":"Floppy disks became ___ once people began storing files on memory sticks.","pos":"adj","syn":["outdated"],"ant":["modern","new"]},{"w":"prototype","def":"the first model of something new, made in order to test the design","ex":"The engineers built a cardboard ___ before making the robot from metal.","pos":"noun"},{"w":"replicate","def":"to copy something exactly, or to do it again in the same way","ex":"Engineers are trying to ___ the gentle way a human hand grips a ripe strawberry.","pos":"verb","syn":["copy","reproduce"],"forms":{"verb":"replicate","noun":"replication"}},{"w":"artificial intelligence","def":"the ability of computers to do tasks that normally need human thinking, such as understanding speech","ex":"Thanks to ___, some apps can now translate a spoken conversation almost instantly.","pos":"phrase"},{"w":"dataset","def":"a large collection of information that a computer can study or use","ex":"The program learnt to recognise birds after studying a ___ of over a million labelled photos.","pos":"noun"},{"w":"malfunction","def":"to fail to work in the normal or correct way","ex":"If a sensor begins to ___, the robot switches itself off for safety.","pos":"verb","syn":["fail"]},{"w":"humanoid","def":"having a body shaped like a human's, with a head, arms and legs","ex":"With its head, two arms and two legs, the ___ robot looked surprisingly like a person.","pos":"adj"},{"w":"manipulate","def":"to handle or move objects skilfully, with the hands or with a machine","ex":"Picking up an egg is hard for a robot because it must ___ fragile objects without crushing them.","pos":"verb","forms":{"verb":"manipulate","noun":"manipulation"}},{"w":"accountable","def":"expected to explain your decisions and to take responsibility for them","ex":"If a self-driving car makes a mistake, who should be held ___: the owner or the maker?","pos":"adj","syn":["responsible"],"forms":{"adj":"accountable","noun":"accountability"}},{"w":"verify","def":"to check that something is true or correct","ex":"Before trusting a chatbot's answer, it is wise to ___ it against a reliable source.","pos":"verb","syn":["check","confirm"],"forms":{"verb":"verify","noun":"verification"}},{"w":"intervene","def":"to become involved in a situation in order to change what happens","ex":"The robot works alone, but a human operator can ___ if something goes wrong.","pos":"verb","forms":{"verb":"intervene","noun":"intervention"}}],"grammar":[{"q":"What makes this robot special ___ that it can learn from its own mistakes.","opts":["is","are","it is","being"],"a":0,"why":"A 'What' clause acts as a singular subject, so it takes 'is': What makes it special is..."},{"q":"The engineers insisted that the robot ___ tested again before the competition.","opts":["be","being","to be","been"],"a":0,"why":"After 'insist that', formal English uses the base form (the subjunctive): the robot be tested."},{"q":"___ the sensor detect an obstacle, the robot will stop immediately.","opts":["Should","If","Would","Were"],"a":0,"why":"'Should + subject + verb' is a formal way to say 'If...': Should the sensor detect = If the sensor detects."},{"q":"The first industrial robot is said ___ in a car factory in the early 1960s.","opts":["to have been used","to be used","to have used","that it was used"],"a":0,"why":"The robot was used (passive) in the past, so use 'is said to have been + past participle'."},{"q":"If our robot weren't so well designed, it ___ the competition last week.","opts":["wouldn't have won","wouldn't win","won't have won","didn't win"],"a":0,"why":"Mixed conditional: a present fact (weren't so well designed) with a past result (last week) takes 'would have + past participle'."},{"q":"Robots ___ in hospitals can carry medicines from one ward to another.","opts":["used","using","are used","use"],"a":0,"why":"'Used in hospitals' is a shortened passive relative clause meaning 'that are used in hospitals'."},{"q":"___ robots to take over every household chore, people would have far more free time.","opts":["Were","Should","Did","If"],"a":0,"why":"'Were + subject + to + verb' is a formal inverted way of saying 'If robots took over...'."},{"q":"It ___ that the word 'robot' was first used in a play written in 1920.","opts":["is generally agreed","generally agrees","is generally agreeing","has generally agreed"],"a":0,"why":"'It is generally agreed that...' reports a widely held view without saying who holds it."},{"q":"Voice assistants ___ to misunderstand people who speak with a strong regional accent.","opts":["tend","tends","are tended","tending"],"a":0,"why":"'Tend to' is a cautious way to describe what usually happens; the plural subject 'assistants' needs 'tend'."},{"q":"___ in 1961, the first industrial robot lifted hot metal parts in a car factory.","opts":["Installed","Installing","Having installed","To install"],"a":0,"why":"The robot was installed by people (passive meaning), so the participle clause starts with the past participle 'Installed'."}],"sentences":["Surgical robots can make cuts with remarkable precision.","The robot uses a sensor to detect obstacles in its path.","Voice assistants must interpret the meaning behind the words we say.","Training a system on biased data can lead to unfair decisions.","A human operator can intervene if the robot malfunctions.","The humanoid robot walked on two legs and waved its arms."],"reading":[{"title":"Why easy is hard for robots","text":"In 1997, a computer called Deep Blue defeated the world chess champion Garry Kasparov, a moment many saw as proof that machines were about to overtake human intelligence. Yet decades later, robots still struggle with tasks such as folding a basket of laundry or picking up an unfamiliar object without dropping it. This puzzling contrast has a name: Moravec's paradox.\n\nIn the 1980s, the robotics researcher Hans Moravec and others observed that the tasks humans find difficult, such as advanced mathematics or chess, are often relatively easy for computers, whereas skills that a young child masters without effort, like recognising a face or walking across a cluttered room, are extremely hard to build into a machine.\n\nOne explanation lies in evolution. The abilities to see, balance and grasp objects have been refined over hundreds of millions of years, so they are deeply built into our nervous system and operate without our noticing. Abstract reasoning, by contrast, is a comparatively recent development, and we are aware of how much effort it requires precisely because our brains are not especially well suited to it. In other words, what feels easy to us is not necessarily simple; it may be the result of an enormous amount of hidden processing.\n\nRecent advances in machine learning have narrowed the gap. Robots trained on vast amounts of data are becoming better at recognising objects and adjusting their grip. Nevertheless, engineers still describe the messy, unpredictable real world as one of their greatest challenges. For the time being, a robot that can beat you at chess is far easier to build than one that can tidy your bedroom.","qs":[{"type":"tfng","q":"Deep Blue's victory persuaded some people that computers would soon be more intelligent than humans.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Hans Moravec built the first robot that was able to walk across a room.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"According to the writer, humans find abstract reasoning effortless because it developed recently.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"What does the writer suggest about tasks that feel easy to people?","opts":["They may depend on a great deal of processing that we are not aware of.","They are always simple for machines to copy.","They have developed only in the last few thousand years.","They require more conscious effort than playing chess."],"a":0},{"type":"mc","q":"What is the main purpose of the final paragraph?","opts":["to admit that progress has been made while stressing that a challenge remains","to argue that machine learning has completely solved the paradox","to explain in detail how chess computers are built","to suggest that robots should never be used in homes"],"a":0}]},{"title":"Can a machine fool us?","text":"In 1950, the British mathematician Alan Turing published a paper that began with a deceptively simple question: can machines think? Recognising that words such as 'think' are hard to define, Turing proposed replacing the question with a practical test, which he called the imitation game. A human judge holds written conversations with two hidden partners, one a person and the other a computer. If the judge cannot reliably tell which is which, Turing argued, we would have little reason to deny that the machine is behaving intelligently.\n\nTuring also made a cautious prediction: by around the year 2000, computers would play the game so well that an average judge would have no more than a seventy per cent chance of identifying them correctly after five minutes of questioning.\n\nInterestingly, people can be fooled by surprisingly simple programs. In the 1960s, the computer scientist Joseph Weizenbaum created ELIZA, a program that imitated a counsellor by turning users' statements into questions. Although ELIZA understood nothing, some users became convinced that it was listening to them, a reaction that troubled its creator.\n\nCritics argue that this is exactly the weakness of Turing's test. A machine might produce convincing replies by following rules, without grasping what any of the words mean. The philosopher John Searle illustrated this point in 1980 with a famous thought experiment, imagining a person who follows written instructions to answer questions in Chinese without understanding a single word of the language.\n\nToday's chatbots can hold conversations that would have astonished Turing. Yet many researchers now see the test less as a measure of intelligence than as a reminder of something about ourselves: how readily we assume that a fluent speaker must also be a thinking one.","qs":[{"type":"tfng","q":"Turing thought the question 'Can machines think?' could easily be answered as it stood.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"ELIZA was the first computer program ever to win a prize for conversation.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"Which of the following best restates the prediction that Turing made?","opts":["By about 2000, an average judge would be wrong at least three times in ten after five minutes.","By 2000, computers would always beat human judges.","By 2000, judges would spot computers seventy per cent more often than before.","By 2000, computers would be able to think exactly like people."],"a":0},{"type":"mc","q":"Why does the writer mention Searle's thought experiment?","opts":["to illustrate how answers could seem intelligent without any real understanding","to show that Chinese is harder to learn than English","to support Turing's view that the test measures intelligence","to explain how ELIZA was built"],"a":0},{"type":"mc","q":"What does the writer suggest in the final paragraph?","opts":["The test may reveal more about human assumptions than about machine intelligence.","Modern chatbots have finally proved that machines can think.","Turing would have been disappointed by modern chatbots.","The test should be made longer than five minutes."],"a":0}]}],"extra":[{"kind":"collocation","q":"Self-driving cars have ___ a heated debate about road safety.","opts":["sparked","made","built","done"],"a":0,"why":"We say 'spark a debate' (start it suddenly); make, build and do do not go with 'debate'."},{"kind":"phrasal","q":"Engineers are trying to ___ a way to make robots grip soft objects safely.","opts":["come up with","come down with","put up with","get on with"],"a":0,"why":"'Come up with' means to think of an idea or a plan."},{"kind":"paraphrase","q":"Which sentence means the same as: 'What feels easy to us is not necessarily simple.'?","opts":["Something can seem effortless to people and still be very complex.","Simple tasks are always easy for people to do.","People never find complex tasks easy.","If a task feels difficult, it must be complicated."],"a":0,"why":"'Not necessarily simple' means it might be complex, even though it feels easy."},{"kind":"register","q":"Which sentence is most suitable for an IELTS Writing Task 2 essay?","opts":["It could be argued that automation will transform the job market.","Robots are gonna take over loads of jobs, no doubt.","I reckon robots will totally change work.","Automation? Huge deal for jobs, obviously."],"a":0,"why":"An academic essay uses an impersonal, cautious structure ('It could be argued that') and no slang."},{"kind":"wordform","q":"Some delivery robots can now operate ___ (autonomy) for several hours.","opts":["autonomously","autonomous","autonomy","autonomic"],"a":0,"why":"We need an adverb to describe how they operate: autonomously."},{"kind":"cohesion","q":"Which sentence best fills the gap? 'Robots are becoming better at recognising objects. ___ Even so, engineers say the real world remains a huge challenge.'","opts":["This is largely thanks to training on vast amounts of data.","Robots, however, cannot recognise any objects at all.","Chess was invented many centuries ago.","As a result, the real world is no longer a problem for engineers."],"a":0,"why":"'This' refers back to the progress and explains it, and 'Even so' then adds the contrast. The others break the logic."},{"kind":"linking","q":"The program sounded intelligent; ___, it did not understand a single word.","opts":["in reality","as a result","similarly","for instance"],"a":0,"why":"'In reality' introduces the true situation, which contrasts with how things seemed. The others show result, likeness or an example."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'Robot vacuum cleaners map a room as they move, using sensors to detect walls and furniture. Over time, they build a picture of the home and plan the most efficient route. Some can even recognise objects such as socks or cables and steer around them.'","opts":["How robot vacuums find their way","Why robots are replacing cleaners","The history of household machines","How to choose a new carpet"],"a":0,"why":"Every sentence describes how the robot senses, maps and moves around a home."},{"kind":"collocation","q":"Robots are increasingly used to ___ tasks that are too dangerous for people.","opts":["carry out","carry on","make","bring out"],"a":0,"why":"We 'carry out' (perform) a task. 'Carry on' means continue, and 'make' and 'bring out' do not go with 'tasks'."},{"kind":"wordform","q":"Engineers must make sure that robots behave ___ (predict) when people are nearby.","opts":["predictably","predictable","prediction","unpredictable"],"a":0,"why":"After the verb 'behave' we need an adverb: predictably, meaning in a way people can expect."}],"writing":[{"kind":"paragraph","sents":["One clear benefit of robots is their ability to carry out tasks that are dangerous for people.","For example, robots are now used to inspect deep tunnels, clean the insides of tall chimneys and examine the hulls of ships underwater.","In each of these situations, a machine can work for hours without being harmed by heat, darkness or a lack of oxygen.","As a result, fewer workers need to put themselves at risk."]},{"kind":"paragraph","sents":["Artificial intelligence systems are only as fair as the data used to train them.","If a system learns mainly from photos of one group of people, it may recognise other groups less accurately.","Such errors are not deliberate, but they can still lead to unfair outcomes.","Developers therefore need to test their systems on a wide variety of people before releasing them."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Robots are going to take loads of jobs soon.'?","opts":["Automation is likely to replace a significant number of routine jobs in the coming decades.","Robots will take lots of jobs very soon.","Every single job will be done by robots by next year.","Jobs and robots are connected in some way."],"a":0,"why":"The first is precise ('routine jobs', 'coming decades') and cautious ('is likely to'). The others stay vague, overclaim wildly or say almost nothing."},{"kind":"topic","q":"Which topic sentence fits best? '___ A robot vacuum cleaner, for example, can map a room and avoid furniture without any human help. Similarly, some delivery robots can find their way along pavements and cross quiet roads on their own.'","opts":["Many everyday machines can now perform tasks autonomously.","Vacuum cleaners were invented more than a hundred years ago.","Robots are really cool and do lots of things.","Pavements in many cities are too narrow."],"a":0,"why":"Both examples show machines working without human control. The others are off topic or too informal and vague to introduce the paragraph."},{"kind":"thesis","q":"Some people think that artificial intelligence will do more harm than good. To what extent do you agree or disagree? Which is the clearest thesis statement?","opts":["I largely disagree: although artificial intelligence raises genuine risks, careful regulation can allow its benefits in medicine and science to outweigh them.","Artificial intelligence is a type of technology used in computers and phones.","Artificial intelligence will definitely destroy the world, so it must be stopped immediately.","There are good things and bad things about artificial intelligence, as with everything."],"a":0,"why":"The first gives a clear, balanced position with a reason. The others describe instead of answering, overclaim, or sit on the fence without a view."}]},{"id":"expert-5","title":"Food and water for all","emoji":"🌾","words":[{"w":"scarcity","def":"a situation in which there is not enough of something that people need","ex":"Water ___ is a growing concern in many dry regions of the world.","pos":"noun","syn":["shortage"],"ant":["plenty"],"forms":{"noun":"scarcity","adj":"scarce"}},{"w":"yield","def":"the amount of crops or food that a piece of land produces","ex":"Farmers measure the ___ of each field in tonnes of grain per hectare.","pos":"noun","syn":["harvest","crop"]},{"w":"fertile","def":"able to produce plenty of good, healthy crops","ex":"Each year the river flooded, leaving behind a layer of ___ mud.","pos":"adj","ant":["barren"],"forms":{"adj":"fertile","noun":"fertility","verb":"fertilise"}},{"w":"nutrient","def":"a substance that plants, animals and people need in order to live and grow","ex":"Iron is a ___ that helps the blood carry oxygen around the body.","pos":"noun"},{"w":"allocate","def":"to give a share of money, time or resources for a particular purpose","ex":"The council voted to ___ a quarter of its budget to fixing old water pipes.","pos":"verb","syn":["assign"],"forms":{"verb":"allocate","noun":"allocation"}},{"w":"desalination","def":"the process of removing salt from seawater so that people can drink or use it","ex":"Some dry coastal countries rely on ___ to turn seawater into drinking water.","pos":"noun"},{"w":"sanitation","def":"systems such as toilets and drains that keep places clean and protect health","ex":"Clean water and good ___ prevent the spread of many illnesses.","pos":"noun"},{"w":"distribute","def":"to share things out among a number of people or places","ex":"A network of pipes and pumps can ___ water from the reservoir to homes across the city.","pos":"verb","syn":["share"],"forms":{"verb":"distribute","noun":"distribution"}},{"w":"surplus","def":"an amount that is more than what is needed","ex":"In a good year, the farm grows more than the village needs and sells the ___ to nearby towns.","pos":"noun","ant":["shortage"]},{"w":"staple","def":"a basic food that people eat regularly and in large amounts","ex":"Rice is a ___ for more than half of the world's population.","pos":"noun"},{"w":"self-sufficient","def":"able to produce everything you need without help from others","ex":"The island grows all its own vegetables and is almost ___ in food.","pos":"adj","syn":["independent"]},{"w":"contaminate","def":"to make something dirty, harmful or unsafe by adding a substance to it","ex":"Waste from factories can ___ rivers and the fish that live in them.","pos":"verb","syn":["pollute"],"forms":{"verb":"contaminate","noun":"contamination"}},{"w":"aquifer","def":"a layer of rock or sand under the ground that holds water","ex":"Farmers pump water up from a deep ___ that lies beneath the dry plain.","pos":"noun"},{"w":"perishable","def":"likely to go bad quickly, such as fresh fruit, milk or fish","ex":"Strawberries are highly ___, so they must reach the shops within a day or two.","pos":"adj"},{"w":"livestock","def":"farm animals such as cows, sheep, goats and pigs","ex":"Much of the world's farmland is used to grow food for ___ rather than for people.","pos":"noun"},{"w":"cultivate","def":"to prepare land and grow crops on it","ex":"Terraces cut into the hillsides allow farmers to ___ rice where the ground would otherwise be far too steep.","pos":"verb","syn":["grow","farm"],"forms":{"verb":"cultivate","noun":"cultivation"}},{"w":"equitable","def":"fair and reasonable, giving everyone an equal share","ex":"The two countries reached an ___ agreement, dividing the river's water equally between them.","pos":"adj","syn":["fair"],"ant":["unfair"],"forms":{"adj":"equitable","adv":"equitably"}},{"w":"purify","def":"to remove dirty or harmful substances from something","ex":"Boiling is a simple way to ___ water from a stream before you drink it.","pos":"verb","syn":["clean"],"ant":["pollute","contaminate"],"forms":{"verb":"purify","noun":"purification"}},{"w":"crop rotation","def":"growing different crops in a field from year to year so that the soil stays healthy","ex":"With ___, a farmer might grow wheat one year and beans the next to keep the soil rich.","pos":"phrase"},{"w":"adequate","def":"enough in amount, or good enough for a particular purpose","ex":"The old well provides barely ___ water for the village's daily needs.","pos":"adj","syn":["sufficient","enough"],"ant":["inadequate","insufficient"],"forms":{"adj":"adequate","adv":"adequately"}}],"grammar":[{"q":"Rarely ___ such a severe shortage of rain in this region.","opts":["has there been","there has been","there was","it has been"],"a":0,"why":"When 'Rarely' starts a sentence, the auxiliary comes before the subject: Rarely has there been..."},{"q":"So scarce ___ that every drop was carefully saved.","opts":["was water","water was","did water","water had"],"a":0,"why":"After 'So + adjective' at the start of a sentence, invert the verb and subject: So scarce was water that..."},{"q":"The ___ of clean water to every home took decades to achieve.","opts":["provision","provide","provided","provident"],"a":0,"why":"After 'The' and before 'of' we need a noun: provide becomes provision (nominalisation)."},{"q":"It is essential that every school ___ access to safe drinking water.","opts":["have","having","to have","had had"],"a":0,"why":"After 'It is essential that...', formal English uses the base form (the subjunctive): every school have."},{"q":"If farmers hadn't adopted drip irrigation, they ___ able to grow crops here now.","opts":["wouldn't be","wouldn't have been","won't be","weren't"],"a":0,"why":"Mixed conditional: a past condition (hadn't adopted) with a present result (now) takes 'would + verb'."},{"q":"Global demand for food ___ to rise as the population grows.","opts":["is expected","expects","is expecting","has expected"],"a":0,"why":"Demand cannot expect anything itself, so use the passive reporting verb: is expected to rise."},{"q":"Only by reducing waste ___ enough food for everyone on the planet.","opts":["can we produce","we can produce","we produce","can produce we"],"a":0,"why":"When 'Only by + -ing' starts the sentence, the main clause uses question order: can we produce."},{"q":"The new crops ___ to have increased yields, although the data is still incomplete.","opts":["seem","seems","are seemed","seeming"],"a":0,"why":"'Seem to have + past participle' is a cautious way to describe a past result; the plural subject 'crops' needs 'seem'."},{"q":"If the town didn't have a desalination plant, it ___ out of water during last summer's drought.","opts":["would have run","would run","will have run","had run"],"a":0,"why":"Mixed conditional: a present fact (the town has a plant) with a past result (last summer) takes 'would have + past participle'."},{"q":"___ was the demand for clean water that the new plant had to run day and night.","opts":["Such","So","Too","Very"],"a":0,"why":"'Such + be + noun phrase + that...' stresses how great something was: Such was the demand that... 'So' would need an adjective."}],"sentences":["Rice is a staple food for billions of people around the world.","It is essential that every child have access to safe drinking water.","Desalination plants turn seawater into water that is safe to drink.","The provision of clean water to every home took decades.","Strawberries are so perishable that they must reach the shops within days.","Only by reducing waste can we produce enough food for everyone."],"reading":[{"title":"Catching water from the air","text":"In some of the driest places on Earth, the air itself may hold part of the answer to water scarcity. Along the coasts of Chile and Morocco, communities have experimented with an unusual technique: catching fog.\n\nA fog collector is essentially a large panel of fine mesh stretched between two poles. As wind pushes fog through the mesh, tiny water droplets cling to the threads, merge into larger drops and run down into a gutter at the bottom. From there, the water flows through pipes into storage tanks, where it can be used for drinking, cooking or watering vegetable gardens. The system requires no electricity and has few moving parts, which makes it relatively cheap to build and maintain.\n\nThe idea is not entirely new. Desert plants and animals have long relied on fog, and researchers have studied a beetle in the Namib Desert that collects droplets on its bumpy back before tipping them towards its mouth. Engineers have borrowed ideas from such creatures in an attempt to design more efficient materials.\n\nFog harvesting is not, however, a solution for everyone. It works only where fog is frequent and a steady wind blows it inland, usually on hills or mountains near the sea. Even in suitable places, the amount collected varies greatly from one day to the next, and nets can be torn by strong winds. For these reasons, experts tend to see fog collection as a useful supplement to other water sources rather than a replacement for them.\n\nNevertheless, for a remote village where the nearest well is far away, a few nets on a hillside can make daily life noticeably easier.","qs":[{"type":"tfng","q":"Fog collectors need a supply of electricity in order to work.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"The first fog collectors were built in Morocco.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"The quantity of water that a fog net gathers can change considerably from day to day.","opts":["True","False","Not Given"],"a":0},{"type":"mc","q":"Which place would probably be the most suitable for a fog collector?","opts":["a windy hillside close to the sea","a sheltered valley far from the coast","a flat inland desert with clear skies","a city centre surrounded by tall buildings"],"a":0},{"type":"mc","q":"Which statement best summarises the writer's view of fog harvesting?","opts":["It is a helpful addition to other water sources in the right places.","It will soon replace wells and rivers as the main source of water.","It is too expensive for most villages to use.","It has failed in every place where it has been tried."],"a":0}]},{"title":"The city that nearly ran dry","text":"In early 2018, the people of Cape Town, South Africa, faced an extraordinary prospect. After three years of unusually low rainfall, the dams that supply the city had fallen to dangerously low levels, and officials warned of 'Day Zero': the date on which most taps would be switched off. If that day came, residents would have to queue at around two hundred collection points for a daily allowance of 25 litres per person.\n\nThe warning had a dramatic effect. Residents were asked to limit their use to 50 litres per person per day, roughly the amount used in a few minutes of an ordinary shower. People saved the water from their sinks to flush toilets, kept showers to two minutes and let their gardens turn brown. Hotels removed the plugs from their baths and encouraged guests to take quick showers.\n\nThese efforts were combined with action by the authorities. Water pressure across the network was reduced to limit leaks and waste, and farmers agreed to release part of their water allowance to the city. As a result, Cape Town's daily water consumption fell to roughly half of what it had been in 2015.\n\nDay Zero was postponed several times and, when good rains finally arrived in the winter of 2018, it was called off altogether. Experts point out that the crisis was avoided not by a single technological solution but by millions of small changes in daily behaviour.\n\nThe episode offers a lesson for other growing cities. As populations rise and rainfall becomes less predictable, many places may need to treat water not as an endless resource but as one that must be carefully managed.","qs":[{"type":"tfng","q":"Before the crisis, Cape Town had experienced several years of heavier rain than usual.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Day Zero was first predicted by a team of university scientists.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the passage, what would have happened on Day Zero?","opts":["People would have had to fetch a small daily ration of water from shared points.","All use of water would have been banned for one day.","Farmers would have been given extra water for their crops.","The price of water would have doubled overnight."],"a":0},{"type":"mc","q":"What does the writer imply about how the crisis wa

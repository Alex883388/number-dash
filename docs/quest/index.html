in after you have been ill or hurt","ex":"After a long run, your muscles need time to ___.","pos":"verb","forms":{"noun":"recovery","verb":"recover"}}],"grammar":[{"q":"If you ___ enough sleep, you will feel tired at school.","opts":["don't get","won't get","didn't get","not get"],"a":0,"why":"In the first conditional, use the present simple after 'if' (don't get), and 'will' in the other half."},{"q":"If you drink more water, you ___ better.","opts":["will feel","would felt","felt","feeling"],"a":0,"why":"This is a real possibility in the future: if + present simple, then will + verb."},{"q":"If I ___ a famous chef, I would cook healthy food for every school.","opts":["were","am","will be","would be"],"a":0,"why":"This is imaginary (second conditional), so use a past form after 'if'. 'If I were' is correct."},{"q":"If we walked to school, we ___ fitter.","opts":["would be","will be","are","would been"],"a":0,"why":"Second conditional: if + past simple, then would + verb (would be)."},{"q":"When I was little, I ___ hate vegetables, but now I love them.","opts":["used to","use to","am used to","was use to"],"a":0,"why":"'Used to' + verb is for something that was true in the past but is not true now."},{"q":"Try to avoid ___ too many sweets.","opts":["eating","to eat","eat","ate"],"a":0,"why":"After 'avoid', use the -ing form of the verb."},{"q":"I ___ three glasses of water so far today.","opts":["have drunk","drank","drink","have drank"],"a":0,"why":"'So far today' means up to now, so use the present perfect. The past participle of 'drink' is 'drunk'."},{"q":"I ___ the flu last month, but I'm fine now.","opts":["had","have had","have","am having"],"a":0,"why":"'Last month' is a finished time, so use the past simple: had."},{"q":"___ for half an hour a day is good for your heart.","opts":["Walking","Walk","Walked","To walking"],"a":0,"why":"When an activity is the subject of a sentence, use the -ing form: Walking is good for you."},{"q":"Foods ___ contain a lot of sugar are bad for your teeth.","opts":["that","who","what","where"],"a":0,"why":"Use 'that' (or 'which') to say which things you mean. 'Who' is only for people."}],"sentences":["My little brother used to hate green vegetables.","You should try to avoid sugary drinks.","Which fruit has the most vitamin C?","My doctor told me to drink more water.","Swimming is good for almost every muscle in your body.","It took me a week to recover from the flu."],"reading":[{"title":"Sleep: your secret superpower","text":"Most children aged 6 to 12 need between nine and twelve hours of sleep a night. That sounds like a lot, but your body and brain are very busy while you sleep.\n\nDuring deep sleep, your body grows and repairs your muscles. Your brain is busy too. It sorts out what you have learnt during the day and stores the important parts, a bit like a librarian putting books on the right shelves. This is why a good night's sleep before a test can help you remember more.\n\nIf you don't get enough sleep, you may feel grumpy and find it hard to concentrate.\n\nSo how can you sleep better? Experts suggest going to bed at the same time every night. They also advise switching off phones and tablets an hour before bed, because the light from screens can make it harder to fall asleep. A calm routine, like reading a book or having a warm bath, helps your body relax.","qs":[{"type":"mc","q":"Why does the writer compare the brain to a librarian?","opts":["It puts new information in the right order.","It reads books while you sleep.","It keeps the body quiet at night.","It only works during the day."],"a":0},{"type":"tfng","q":"Your brain stops working while you are asleep.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"The light from screens can make it difficult to get to sleep.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"A warm drink before bed is the best way to fall asleep.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What do experts suggest?","opts":["going to bed at the same time every night","using a tablet in bed","sleeping only at weekends","having a big meal just before bed"],"a":0}]},{"title":"Water: your body's best friend","text":"About 60 per cent of your body is water. It is in your blood, your muscles and even your bones. Every day, you lose some of it when you breathe, sweat and go to the toilet, so you need to replace it.\n\nIf you don't drink enough, you may get a headache, feel tired or find it hard to concentrate. This is why many schools let pupils keep a water bottle on their desks. Experts in the UK suggest drinking six to eight glasses of liquid a day, and more when it is hot or you are doing sport.\n\nYou don't only get water from drinks. Many fruits and vegetables are full of it. A cucumber is about 95 per cent water, and a watermelon is not far behind.\n\nWater is also the best drink for your teeth. Unlike fizzy drinks and many fruit juices, it contains no sugar. Best of all, tap water in the UK is safe to drink and very cheap.","qs":[{"type":"mc","q":"Why do we need to drink water every day?","opts":["Our bodies lose water in several ways.","Water makes our bones grow bigger.","We cannot eat fruit without it.","It stops us from breathing too fast."],"a":0},{"type":"tfng","q":"There is water in your bones.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"You can only get water from drinks.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Most pupils in the UK drink too little water at school.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the text, why is water good for your teeth?","opts":["It has no sugar in it.","It is very cold.","It is cheaper than juice.","It makes your teeth white."],"a":0}]}],"extra":[{"kind":"collocation","q":"It's important to ___ some exercise every day.","opts":["do","make","play","go"],"a":0,"why":"We say 'do exercise' (or 'take exercise'). We 'play' games and sports, and we 'go' swimming or running."},{"kind":"phrasal","q":"My dad is trying to ___ eating sweets after dinner.","opts":["give up","give in","give away","give back"],"a":0,"why":"'Give up' means stop doing something that you did often."},{"kind":"linking","q":"I drink lots of water ___ it helps me to concentrate.","opts":["because","although","but","unless"],"a":0,"why":"'Because' gives the reason: why do I drink lots of water? It helps me concentrate."},{"kind":"idiom","q":"I'm feeling a bit ___ today, so I'm staying at home in bed.","opts":["under the weather","over the moon","on cloud nine","a piece of cake"],"a":0,"why":"'Under the weather' means a little ill. 'Over the moon' and 'on cloud nine' mean very happy."},{"kind":"wordform","q":"Fresh fruit and vegetables are ___ to your health. (benefit)","opts":["beneficial","benefit","benefits","beneficially"],"a":0,"why":"After 'are' we need an adjective. 'Beneficial' means good for you."},{"kind":"preposition","q":"Too much salt is bad ___ your heart.","opts":["for","at","with","on"],"a":0,"why":"We say 'good for' or 'bad for' your health. 'Bad at' is about skills, as in 'bad at maths'."}],"writing":[{"kind":"paragraph","sents":["Eating breakfast is one of the healthiest habits you can have.","After a long night's sleep, your body needs energy to get going.","A healthy breakfast, such as porridge with fruit, gives you this energy.","It also helps you to concentrate in your morning lessons.","For these reasons, it is a bad idea to skip breakfast."]},{"kind":"paragraph","sents":["Regular exercise is good for both your body and your mind.","Firstly, it makes your heart and muscles stronger.","Secondly, it can put you in a better mood and help you to relax.","Because of these benefits, experts say that children should be active for at least an hour every day.","Walking to school or playing football with friends is an easy way to do this."]},{"kind":"topic","q":"Read the rest of a paragraph: 'Sugar can damage your teeth, especially if you eat sweets between meals. Fizzy drinks are also full of sugar but do not fill you up, so it is easy to have too much.' Which topic sentence fits best?","opts":["Eating too much sugar is bad for your health in more than one way.","Sweets are sold in every supermarket.","Sugar is yummy and everyone loves it!","Teeth are quite small."],"a":0,"why":"The paragraph gives two problems caused by sugar, so the topic sentence must introduce sugar's harmful effects. The others are off topic or chatty."},{"kind":"thesis","q":"Essay question: 'Should schools stop selling sweets and fizzy drinks? Give your opinion.' Which is the clearest thesis statement?","opts":["I believe schools should stop selling sweets and fizzy drinks, because they harm pupils' teeth and health.","Lots of children like sweets.","Fizzy drinks come in many colours and flavours.","This is an interesting question that people often talk about."],"a":0,"why":"The best thesis answers the question clearly and gives a reason. The others only give facts or say nothing about your opinion."}]},{"id":"explorer-4","title":"Festivals around the world","emoji":"🏮","words":[{"w":"celebrate","def":"to do something special and enjoyable for an important day","ex":"Families get together to ___ the new year.","pos":"verb","pic":"🥳","forms":{"noun":"celebration","verb":"celebrate"}},{"w":"tradition","def":"something people have done in the same way for a very long time","ex":"Eating pancakes on Shrove Tuesday is a British ___.","pos":"noun","pic":"🥞","forms":{"noun":"tradition","adj":"traditional","adv":"traditionally"}},{"w":"costume","def":"special clothes that make you look like a different person, animal or thing","ex":"She wore a dragon ___ in the parade.","pos":"noun"},{"w":"parade","def":"a line of people, bands or vehicles moving through the streets for a special day","ex":"Thousands of people watched the ___ go through the city centre.","pos":"noun"},{"w":"firework","def":"a small object that explodes in the sky with bright colours and loud bangs","ex":"Each ___ lit up the night sky with red and gold.","pos":"noun","pic":"🎆"},{"w":"lantern","def":"a lamp with a cover around it, often made of paper or glass","ex":"Each child carried a paper ___ through the dark streets.","pos":"noun","pic":"🏮"},{"w":"decorate","def":"to make something look nicer by adding pretty things to it","ex":"Let's ___ the classroom with paper flowers.","pos":"verb","forms":{"noun":"decoration","verb":"decorate","adj":"decorative"}},{"w":"crowd","def":"a large group of people in one place","ex":"A huge ___ cheered as the band marched past.","pos":"noun"},{"w":"ancient","def":"very old; from thousands of years ago","ex":"The first Olympic Games were held in ___ Greece.","pos":"adj","pic":"🏛️","ant":["modern"]},{"w":"gather","def":"to come together in one place as a group","ex":"On New Year's Eve, people ___ in the square to watch the clock.","pos":"verb","syn":["meet"]},{"w":"feast","def":"a large, special meal for many people","ex":"After the parade, the whole village shared a ___ of rice, fruit and sweets.","pos":"noun","pic":"🍲"},{"w":"occasion","def":"a special event or time","ex":"A wedding is a happy ___ for the whole family.","pos":"noun","syn":["event"]},{"w":"carnival","def":"a big public party in the streets, with music, dancing and people in costumes","ex":"Our town's summer ___ has floats, steel bands and dancing in the streets.","pos":"noun","pic":"🎭"},{"w":"custom","def":"something that people in a place usually do, often for a very long time","ex":"In Japan, it is a ___ to take off your shoes before you go into someone's home.","pos":"noun","syn":["tradition"]},{"w":"anniversary","def":"the same date each year as the day when something important happened","ex":"My grandparents had a big party for their fiftieth wedding ___.","pos":"noun"},{"w":"symbol","def":"a picture, shape or object that stands for an idea","ex":"In many countries, a white dove is a ___ of peace.","pos":"noun","pic":"🕊️"},{"w":"host","def":"to hold an event and welcome the people who come to it","ex":"Our school will ___ a music festival for five other schools in June.","pos":"verb"},{"w":"annual","def":"happening once every year","ex":"The village holds its ___ flower show in July.","pos":"adj","syn":["yearly"],"forms":{"adj":"annual","adv":"annually"}},{"w":"spectacular","def":"very exciting and impressive to look at","ex":"The fireworks over the harbour at midnight were ___.","pos":"adj","syn":["impressive"]},{"w":"take part","def":"to join in an activity or event with other people","ex":"Everyone in our class will ___ in the school concert.","pos":"phrase","syn":["participate"]}],"grammar":[{"q":"'I am tired,' said Mia. Mia said that she ___ tired.","opts":["was","were","be","been"],"a":0,"why":"In reported speech, the verb usually moves one step back in time: 'am' becomes 'was'."},{"q":"My teacher ___ us that the festival starts at six.","opts":["told","said","spoke","talked"],"a":0,"why":"'Tell' needs a person after it (told us). 'Say' does not (she said that...)."},{"q":"During Diwali, small oil lamps ___ in windows and doorways.","opts":["are lit","lights","are lighting","is lit"],"a":0,"why":"The lamps don't light themselves; people light them. Use the passive: are + lit (plural, because 'lamps')."},{"q":"I ___ to a carnival, but I would love to go to one.","opts":["have never been","have never go","never been","am never going"],"a":0,"why":"For experiences in your life up to now, use the present perfect: have never been."},{"q":"The first Notting Hill Carnival ___ place in the 1960s.","opts":["took","has taken","takes","was taken"],"a":0,"why":"The 1960s is a finished time, so use the past simple: took place."},{"q":"The man ___ leads the parade plays the drums.","opts":["who","which","whose","where"],"a":0,"why":"Use 'who' (or 'that') to give more information about a person."},{"q":"The first Christmas cards ___ in London in 1843.","opts":["were sent","sent","are sent","was sent"],"a":0,"why":"The cards didn't send anything; people sent them. Use the past passive: were + sent (plural, because 'cards')."},{"q":"In Scotland and Ireland, people ___ carve lanterns out of turnips at Halloween.","opts":["used to","were using","use to","are used to"],"a":0,"why":"'Used to' + verb describes a past habit that has changed. Today most people carve pumpkins."},{"q":"We're looking forward to ___ the fireworks tonight.","opts":["watching","watch","to watch","watched"],"a":0,"why":"In 'look forward to', 'to' is a preposition, so it is followed by the -ing form: watching."},{"q":"We have ___ decorated the tree, so now we can relax.","opts":["already","yet","ever","since"],"a":0,"why":"Use 'already' in positive sentences to say something has happened, maybe sooner than expected. 'Yet' is for questions and negatives."}],"sentences":["Thousands of people watched the parade.","My aunt told me that the festival was amazing.","Do you know who decorated the classroom?","We have decorated the house with paper lanterns.","We are looking forward to watching the fireworks.","Thousands of dancers take part in the carnival."],"reading":[{"title":"Festivals of colour and light","text":"All around the world, people gather to celebrate special days. Two of the biggest festivals are Diwali and Lunar New Year.\n\nDiwali, the festival of lights, is celebrated by millions of people in India and in many other countries. It usually takes place in October or November and lasts for five days. Families light small clay lamps called diyas and put them in windows and doorways. Many people also make rangoli, which are beautiful patterns on the floor made from coloured powder, rice or flower petals.\n\nLunar New Year usually falls in January or February. In China, it is also called the Spring Festival. Homes are decorated in red, because red is thought to be a lucky colour. Children often receive red envelopes with money inside. In the streets, crowds watch lion and dragon dances to the sound of loud drums. The celebrations end with the Lantern Festival, when thousands of lanterns light up the night.","qs":[{"type":"tfng","q":"Diwali lasts for less than a week.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Rangoli patterns are always made from rice.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Diwali is more popular than Lunar New Year.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"Why are homes decorated in red at Lunar New Year?","opts":["Many people believe red brings good luck.","Red decorations are the cheapest.","Red is the colour of spring.","Dragons are always red."],"a":0},{"type":"mc","q":"What is another name for Lunar New Year in China?","opts":["the Spring Festival","the Lantern Festival","the festival of lights","the Dragon Festival"],"a":0}]},{"title":"A city made of ice","text":"Every winter, the city of Harbin in northern China hosts one of the biggest ice festivals in the world. Winters there are long and freezing: in January, the temperature often falls below minus 20 degrees Celsius.\n\nThe festival turns this cold weather into something spectacular. Thousands of workers cut huge blocks of ice from the frozen Songhua River and carry them to the festival park. Then artists use saws and chisels to shape them. They build castles, bridges, animals and even slides that children (and adults!) can ride down.\n\nThe festival usually opens in early January and goes on until the ice begins to melt. During the day, the sculptures sparkle in the winter sunshine. At night, coloured lights inside the ice make the whole park glow red, green, blue and gold.\n\nVisitors need to wear warm coats, thick gloves and hats, and a hot drink is always welcome.","qs":[{"type":"mc","q":"Where does the ice for the festival come from?","opts":["a frozen river","a factory in the city","the sea","mountains in the north"],"a":0},{"type":"tfng","q":"In January, it is often colder than minus 20 degrees Celsius in Harbin.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"The ice festival is open all year round.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Visitors have to buy a ticket to enter the festival park.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What makes the park glow at night?","opts":["coloured lights inside the ice","fireworks over the river","the light of the moon","candles on the castles"],"a":0}]}],"extra":[{"kind":"preposition","q":"Diwali usually takes place ___ October or November.","opts":["in","on","at","by"],"a":0,"why":"Use 'in' with months, 'on' with days and dates, and 'at' with clock times."},{"kind":"paraphrase","q":"Which sentence means the same as 'The festival takes place every year'?","opts":["The festival happens once a year.","The festival takes a year to plan.","The festival is held every month.","The festival finished last year."],"a":0,"why":"'Takes place every year' means it happens once a year."},{"kind":"wordform","q":"The streets look beautiful with all the ___. (decorate)","opts":["decorations","decorate","decorative","decorated"],"a":0,"why":"After 'all the' we need a plural noun: decorations."},{"kind":"phrasal","q":"Before the parade, the children ___ their costumes to check that they fitted.","opts":["tried on","gave up","put off","ran out"],"a":0,"why":"'Try on' means put clothes on to see if they fit."},{"kind":"collocation","q":"We ___ a great time at the carnival last weekend.","opts":["had","made","did","took"],"a":0,"why":"We say 'have a good time' or 'have a great time', not 'make' or 'do' a time."},{"kind":"linking","q":"We stayed up until midnight ___ we wanted to see the fireworks.","opts":["because","although","so","but"],"a":0,"why":"'Because' gives the reason: why did we stay up late? We wanted to see the fireworks."}],"writing":[{"kind":"paragraph","sents":["In Japan, the arrival of spring is celebrated with a tradition called hanami.","The name means 'looking at flowers', and it refers to the pink cherry blossom.","When this blossom appears, families and friends gather under the trees for picnics.","However, the blossom only lasts for about a week or two, so there is not much time for these picnics.","That is why people check blossom forecasts to choose the best day for their picnic."]},{"kind":"paragraph","sents":["One of the messiest festivals in the world takes place in Buñol, a small town in Spain.","It is called La Tomatina, and it is held on the last Wednesday of August.","On that day, thousands of people throw ripe tomatoes at each other for about an hour.","When the hour is over, the streets are washed clean with hoses.","It may be messy, but visitors from all over the world love it."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Lots and lots of people came to see the parade.'?","opts":["Thousands of people came to watch the parade.","Loads of people came to see the parade.","Lots of people came to see the parade, I think.","People came to the parade, like, a lot."],"a":0,"why":"'Thousands of people' gives a clear idea of the number. 'Loads of', 'I think' and 'like, a lot' are chatty and vague."},{"kind":"topic","q":"Read the rest of a paragraph: 'At Christmas, many families in Britain eat roast turkey. At Lunar New Year, Chinese families often eat dumplings, which are said to bring good luck.' Which topic sentence fits best?","opts":["Special foods are an important part of many festivals.","A turkey is a large bird.","Christmas is in December.","Food is so tasty, isn't it?"],"a":0,"why":"The paragraph gives two examples of festival food, so the topic sentence must be about festival food in general. The others are off topic, too narrow or chatty."}]},{"id":"explorer-5","title":"Oceans and space","emoji":"🚀","words":[{"w":"orbit","def":"to travel around a planet, moon or star in a curved path","ex":"The International Space Station takes about 90 minutes to ___ the Earth.","pos":"verb","pic":"🛰️"},{"w":"astronaut","def":"a person who is trained to travel into space","ex":"The ___ floated around inside the space station.","pos":"noun","pic":"🧑‍🚀"},{"w":"gravity","def":"the force that pulls things towards the ground or towards each other","ex":"Because of ___, an apple falls down from a tree, not up.","pos":"noun","pic":"🍎"},{"w":"atmosphere","def":"the layer of gases around a planet","ex":"The Moon has no ___, so there is no air to breathe.","pos":"noun"},{"w":"surface","def":"the top or outside part of something","ex":"More than two thirds of the Earth's ___ is covered by water.","pos":"noun"},{"w":"explore","def":"to travel around a place to learn about it","ex":"One day, people may ___ the surface of Mars.","pos":"verb","forms":{"noun":"exploration","verb":"explore"}},{"w":"depth","def":"how deep something is","ex":"Sunlight cannot reach a ___ of more than 1,000 metres in the ocean.","pos":"noun","forms":{"noun":"depth","adj":"deep","verb":"deepen"}},{"w":"pressure","def":"the force of something pushing on something else","ex":"Deep under the sea, the water ___ is very high, so submarines need thick walls.","pos":"noun"},{"w":"creature","def":"any living animal, especially a strange or unusual one","ex":"The anglerfish is a strange ___ with a light on its head.","pos":"noun","pic":"🐙"},{"w":"telescope","def":"a tool that makes things that are far away look nearer and bigger","ex":"Through a ___, you can see craters on the Moon.","pos":"noun","pic":"🔭"},{"w":"launch","def":"to send a rocket or spacecraft up into the sky or into space","ex":"Engineers will ___ the rocket when the weather is calm.","pos":"verb","pic":"🚀"},{"w":"mission","def":"an important journey or job, often into space","ex":"The Apollo 11 ___ took the first people to the Moon in 1969.","pos":"noun","pic":"🌕"},{"w":"satellite","def":"a machine sent into space to travel around the Earth and send back information","ex":"Weather forecasters use photos taken by a ___ high above the Earth.","pos":"noun","pic":"📡"},{"w":"spacecraft","def":"a vehicle that can travel in space","ex":"The ___ took about seven months to reach Mars.","pos":"noun"},{"w":"galaxy","def":"a huge group of stars, gas and dust held together in space","ex":"On a clear, dark night, you can see part of our ___ as a pale band of light across the sky.","pos":"noun","pic":"🌌"},{"w":"oxygen","def":"a gas in the air that people and animals need in order to stay alive","ex":"Tiny plants that float in the ocean make much of the ___ that we breathe.","pos":"noun"},{"w":"tide","def":"the regular rise and fall of the level of the sea, which happens about twice a day","ex":"When the ___ goes out, you can look for crabs in the rock pools.","pos":"noun","pic":"🌊"},{"w":"current","def":"a strong movement of water or air in one direction","ex":"The Gulf Stream is a warm ocean ___ that flows across the Atlantic.","pos":"noun"},{"w":"submarine","def":"a ship that can travel deep under the water","ex":"Scientists used a small ___ to study the creatures on the sea floor.","pos":"noun"},{"w":"vast","def":"extremely big","ex":"The Pacific is a ___ ocean that covers about a third of the Earth's surface.","pos":"adj","syn":["huge","enormous"],"ant":["tiny"]}],"grammar":[{"q":"If I ___ in space, I would look at the Earth every day.","opts":["lived","live","will live","would live"],"a":0,"why":"This is imaginary (second conditional), so use the past simple after 'if': lived."},{"q":"If there were no gravity, everything ___ away.","opts":["would float","will float","floats","floated"],"a":0,"why":"Second conditional: if + past simple (were), then would + verb (would float)."},{"q":"The first photo of the far side of the Moon ___ in 1959.","opts":["was taken","took","was took","has taken"],"a":0,"why":"The photo didn't take anything; a spacecraft took it. Use the past passive: was + taken."},{"q":"Humans ___ on Mars yet.","opts":["haven't landed","hasn't landed","don't land","weren't landed"],"a":0,"why":"Use the present perfect with 'yet'. 'Humans' is plural, so use 'haven't'."},{"q":"Astronauts have to practise ___ in a huge swimming pool.","opts":["moving","to move","move","moved"],"a":0,"why":"After 'practise', use the -ing form. ('Practise' with an 's' is the British spelling of the verb.)"},{"q":"'I can see the whole of Africa,' said the astronaut. She said that she ___ see the whole of Africa.","opts":["could","cans","is able","must"],"a":0,"why":"In reported speech, 'can' usually becomes 'could'."},{"q":"The International Space Station ___ in space since 1998.","opts":["has been","was","is","is being"],"a":0,"why":"With 'since', use the present perfect for something that started in the past and is still true now."},{"q":"If the weather ___ bad tomorrow, they won't launch the rocket.","opts":["is","will be","was","would be"],"a":0,"why":"First conditional: after 'if', use the present simple (is), even when you talk about the future."},{"q":"Today, much of the deep ocean ___ by robots rather than people.","opts":["is explored","explores","is exploring","are explored"],"a":0,"why":"The ocean doesn't explore anything; robots explore it. Use the present passive. 'Much of the ocean' is singular, so use 'is'."},{"q":"Many children hope ___ astronauts when they grow up.","opts":["to become","becoming","become","became"],"a":0,"why":"After 'hope', use 'to' + verb: hope to become."}],"sentences":["Rockets are launched from a base in Florida.","Robots can explore the deepest parts of the ocean.","The telescope that we used belongs to my uncle.","Have astronauts ever landed on Mars?","Robots are used to explore the deep ocean.","Our Sun is one of billions of stars in the Milky Way."],"reading":[{"title":"Exploring the deep","text":"Space is not the only place that is hard to explore. The ocean covers more than 70 per cent of the Earth's surface, but most of it has never been explored in detail.\n\nThe deepest part of the ocean is in the Mariana Trench in the Pacific. It is about 11,000 metres deep. If you put Mount Everest at the bottom, its top would still be more than two kilometres under the water. No sunlight reaches these depths, and the water pressure is enormous: more than 1,000 times greater than at the surface. Even so, strange creatures live in the deep ocean, and many of them make their own light.\n\nSpace and the deep sea have a lot in common. Both are dark, and humans cannot survive in either place without special equipment. Astronauts wear space suits, and deep-sea explorers travel in small, very strong submarines. Today, robots do much of the exploring in both places and send photos and information back to scientists.","qs":[{"type":"mc","q":"How deep is the deepest part of the ocean?","opts":["about 11,000 metres","about 2,000 metres","about 8,800 metres","about 1,000 metres"],"a":0},{"type":"tfng","q":"Mount Everest would be completely covered by water in the Mariana Trench.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Sunlight can reach the bottom of the Mariana Trench.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Submarines cost more to build than rockets.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What does the writer say space and the deep sea have in common?","opts":["Humans need special equipment to survive in both.","Both are full of plants.","Both have been fully explored.","Both are warm and bright."],"a":0}]},{"title":"A day on the space station","text":"About 400 kilometres above our heads, the International Space Station travels around the Earth at about 28,000 kilometres an hour. Because it completes an orbit every 90 minutes, the astronauts on board see about 16 sunrises every day!\n\nLife in space is strange. Because everything floats, nothing stays where you put it, so tools, pens and food packets are fixed to the walls with Velcro. At night, astronauts sleep in sleeping bags that are tied to the wall, so they don't drift around and bump into things.\n\nStaying healthy takes hard work. In space, muscles and bones get weaker because they do not have to hold up the body. To stop this, astronauts exercise for about two hours every day on special machines.\n\nWater is precious, too. Almost all the water on the station is recycled, including the water in the astronauts' breath and sweat. It is cleaned so carefully that they can drink it again.","qs":[{"type":"mc","q":"Why do astronauts on the station see about 16 sunrises a day?","opts":["The station goes around the Earth every 90 minutes.","The Sun is much closer to the station.","The astronauts sleep for only 90 minutes.","The station has very big windows."],"a":0},{"type":"tfng","q":"Astronauts on the station sleep in normal beds.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Astronauts exercise for about two hours a day.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Most astronauts stay on the station for about six months.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"Why are tools and pens fixed to the walls?","opts":["so that they do not float away","so that they stay clean","so that astronauts can find them in the dark","so that they do not get too cold"],"a":0}]}],"extra":[{"kind":"phrasal","q":"Three, two, one... and the rocket ___!","opts":["took off","took up","got over","ran out"],"a":0,"why":"'Take off' means leave the ground and rise into the air."},{"kind":"cohesion","q":"Which sentence comes next? 'The Moon has no air. ___'","opts":["Because of this, astronauts must wear space suits there.","The Moon is very beautiful.","However, there is lots of air on the Moon.","For example, the Earth is round."],"a":0,"why":"'Because of this' links a cause (there is no air) to its result (astronauts need space suits)."},{"kind":"linking","q":"___ the Moon looks small, it is about a quarter as wide as the Earth.","opts":["Although","Because","So","Unless"],"a":0,"why":"'Although' joins two ideas that are surprising together: it looks small, but it is quite big."},{"kind":"wordform","q":"Space ___ costs a lot of money. (explore)","opts":["exploration","explorer","explore","explored"],"a":0,"why":"We need a noun for the activity: exploration. An 'explorer' is a person."},{"kind":"collocation","q":"From the space station, the astronaut ___ a photo of her home town.","opts":["took","made","did","wrote"],"a":0,"why":"We say 'take a photo' (or 'take a picture'), not 'make' or 'do' a photo."},{"kind":"preposition","q":"The space station travels ___ the Earth every 90 minutes.","opts":["around","under","through","into"],"a":0,"why":"Something in orbit moves around (or round) a planet, in a circle."}],"writing":[{"kind":"paragraph","sents":["The first Moon landing in 1969 was one of the greatest moments in the history of exploration.","On 20 July, Apollo 11's lunar module, called Eagle, landed on the Moon's surface.","A few hours later, Neil Armstrong became the first person to walk on the Moon.","He was soon followed by Buzz Aldrin, while Michael Collins stayed in orbit.","Millions of people around the world watched these events live on television."]},{"kind":"paragraph","sents":["The tides in the sea are caused mainly by the Moon.","As the Moon travels around the Earth, its gravity pulls on the oceans.","This pull makes the sea rise in some places and fall in others.","As a result, the sea on most coasts rises and falls about twice a day.","So the next time you are at the seaside, remember that the Moon is moving the water."]},{"kind":"thesis","q":"Essay question: 'Some people think that more money should be spent on exploring space. Others think it should be spent on problems on Earth. Discuss both views and give your opinion.' Which is the clearest thesis statement?","opts":["Although exploring space teaches us a great deal, I believe money should first be spent on problems on Earth, such as protecting the oceans.","Space is very big and full of stars.","Rockets are expensive and they look cool.","There are two views about this question."],"a":0,"why":"The best thesis mentions both views and gives a clear opinion. The others do not answer the question."},{"kind":"topic","q":"Read the rest of a paragraph: 'The ocean covers more than 70 per cent of the Earth's surface, but most of it has never been explored in detail. Many deep-sea creatures have not even been given names yet.' Which topic sentence fits best?","opts":["We still know surprisingly little about the ocean.","The ocean is wet and salty.","Space is easier to explore than the sea.","Fish are my favourite animals."],"a":0,"why":"Both sentences show how much of the ocean is still unknown. The others are too obvious, about space or about the writer."}]},{"id":"explorer-6","title":"Money and shopping","emoji":"💰","words":[{"w":"budget","def":"a plan for how much money you can spend and what you will spend it on","ex":"We set a ___ of £20 for the birthday party.","pos":"noun"},{"w":"bargain","def":"something you buy for much less than its usual price","ex":"At only £3, this warm winter coat was a real ___.","pos":"noun","syn":["deal"]},{"w":"discount","def":"an amount of money taken off the usual price","ex":"Students get a 10 per cent ___ at the museum shop.","pos":"noun","syn":["reduction"]},{"w":"refund","def":"money that a shop gives back to you when you return something","ex":"The toy was broken, so the shop gave us a full ___.","pos":"noun"},{"w":"receipt","def":"a piece of paper that shows what you bought and how much you paid","ex":"Keep the ___ in case you need to take the shirt back.","pos":"noun","pic":"🧾"},{"w":"purchase","def":"to buy something (a more formal word)","ex":"You can ___ tickets online or at the door.","pos":"verb","syn":["buy"]},{"w":"lend","def":"to give something to someone for a short time and expect to get it back","ex":"Could you ___ me your pen for a minute?","pos":"verb","ant":["borrow"]},{"w":"currency","def":"the kind of money that is used in a country","ex":"The euro is the ___ of many countries in Europe.","pos":"noun","pic":"💶"},{"w":"exchange","def":"to take something back to a shop and get a different thing instead","ex":"Can I ___ these jeans for a bigger size?","pos":"verb","syn":["swap"]},{"w":"compare","def":"to look at two or more things to see how they are similar or different","ex":"Always ___ prices before you buy something expensive.","pos":"verb","forms":{"noun":"comparison","verb":"compare"}},{"w":"brand","def":"the name of a product made by a particular company","ex":"This ___ of trainers is very popular with teenagers.","pos":"noun"},{"w":"second-hand","def":"owned by someone else before you","ex":"I bought a ___ bike, and it works perfectly.","pos":"adj","ant":["new"]},{"w":"queue","def":"a line of people who are waiting for something","ex":"We waited in a ___ for twenty minutes to buy ice cream.","pos":"noun"},{"w":"deliver","def":"to take things such as letters or shopping to someone's home","ex":"The shop will ___ our new sofa on Friday.","pos":"verb","pic":"📦","forms":{"noun":"delivery","verb":"deliver"}},{"w":"worth","def":"having a particular value in money","ex":"This old comic is now ___ more than £100.","pos":"adj"},{"w":"charity","def":"an organisation that collects money to help people or animals in need","ex":"Our class raised £200 for a ___ that protects wild birds.","pos":"noun"},{"w":"donate","def":"to give money or things to help others, often through an organisation","ex":"Every month, I ___ a little of my pocket money to an animal charity.","pos":"verb","forms":{"noun":"donation","verb":"donate"}},{"w":"salary","def":"the money that you get every month for doing your job","ex":"My aunt's ___ is paid into her bank account at the end of each month.","pos":"noun","syn":["pay"]},{"w":"value","def":"how much something is worth","ex":"The ___ of an old coin depends on how rare it is.","pos":"noun","forms":{"noun":"value","adj":"valuable"}},{"w":"essential","def":"completely necessary; something you must have","ex":"Bread and milk are ___ items that most families buy every week.","pos":"adj","ant":["unnecessary"]}],"grammar":[{"q":"I ___ enough money for a new bike yet.","opts":["haven't saved","didn't save","don't save","hasn't saved"],"a":0,"why":"Use the present perfect with 'yet' for something that hasn't happened up to now. 'I' goes with 'haven't'."},{"q":"Last Saturday, we ___ a second-hand bike at the market.","opts":["bought","have bought","buy","were bought"],"a":0,"why":"'Last Saturday' is a finished time, so use the past simple: bought."},{"q":"If I ___ a lot of money, I would buy a house by the sea for my parents.","opts":["won","win","will win","would win"],"a":0,"why":"This is imaginary (second conditional), so use the past simple after 'if' (won), then would + verb."},{"q":"If you ___ your receipt, the shop will give you a refund.","opts":["keep","will keep","keeps","keeping"],"a":0,"why":"First conditional: if + present simple (keep), then will + verb. Don't use 'will' after 'if'."},{"q":"In the UK, coins ___ by the Royal Mint in Wales.","opts":["are made","make","is made","are making"],"a":0,"why":"The coins don't make anything; the Royal Mint makes them. Use the present passive: are + made (plural, because 'coins')."},{"q":"The first paper money ___ in China about 1,000 years ago.","opts":["was used","used","is used","were used"],"a":0,"why":"Use the past passive for a finished time. 'Money' is uncountable, so use 'was', not 'were'."},{"q":"People ___ pay for everything with coins and notes, but now many use cards or phones.","opts":["used to","use to","were used to","are used to"],"a":0,"why":"'Used to' + verb describes a past habit that is not true now."},{"q":"'I want to save my money,' said Ben. Ben said that he ___ to save his money.","opts":["wanted","want","wanting","was want"],"a":0,"why":"In reported speech, the present simple (want) usually moves back to the past simple (wanted)."},{"q":"My sister is saving up ___ a new phone.","opts":["to buy","buying","buy","bought"],"a":0,"why":"Use 'to' + verb to give the purpose: she is saving up so that she can buy a phone."},{"q":"A charity shop is a shop ___ sells things that people have given away.","opts":["that","who","where","what"],"a":0,"why":"Use 'that' (or 'which') to say which shop you mean. 'Where' would need a subject after it: a shop where people sell things."}],"sentences":["This jumper was a bargain in the sales.","British coins are made by the Royal Mint.","My sister is saving up to buy a new phone.","A charity shop sells things that people have donated.","Have you ever bought anything second-hand?","The supermarket queue was very long."],"reading":[{"title":"The story of money","text":"Long ago, before money was invented, people who wanted something had to swap. A farmer might exchange a bag of grain for a pair of shoes. But this was not always easy. What if the shoemaker did not want any grain?\n\nTo solve this problem, people began to use objects that everyone agreed were valuable. In parts of Africa and Asia, small, shiny cowrie shells were used as money for centuries.\n\nThe first coins were made about 2,600 years ago in Lydia, in what is now Turkey. Coins were small, strong and easy to carry. Later, about 1,000 years ago, paper money was used for the first time in China. It was much lighter than a heavy bag of coins.\n\nToday, money is changing again. In many countries, people pay with cards or phones, and some shops no longer accept cash at all. Who knows what money will look like in the future?","qs":[{"type":"mc","q":"Why was swapping not always easy?","opts":["The other person might not want what you had.","Shoes were too expensive.","Farmers did not grow any grain.","People did not like shopping."],"a":0},{"type":"tfng","q":"Shells were once used as money in some parts of the world.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"The first coins were made in China.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Gold coins were worth more than paper money.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What was one advantage of paper money?","opts":["It was lighter than coins.","It was made of shells.","It never got old.","It could only be used in Turkey."],"a":0}]},{"title":"The secrets of the supermarket","text":"Have you ever gone to the supermarket for a pint of milk and come home with a full bag? If so, you are not alone. Supermarkets are carefully designed to make us buy more.\n\nFor example, everyday items such as milk and bread are often placed at the back of the shop. To reach them, customers have to walk past hundreds of other products, and many people pick up something they had not planned to buy.\n\nPrices are also chosen carefully. A price of £1.99 seems much lower than £2, even though the difference is only one penny. Sweets used to be displayed near the tills, where children waiting in the queue could easily see them. In England, large shops are no longer allowed to do this.\n\nKnowing these tricks can help you to save money. Before you go shopping, write a list and decide how much you want to spend. Then stick to your budget!","qs":[{"type":"mc","q":"What is the main idea of the text?","opts":["Supermarkets use clever tricks to make us spend more.","Milk is cheaper than bread.","Children should not go shopping.","Shops in England are closing."],"a":0},{"type":"tfng","q":"Milk and bread are often found near the entrance of the shop.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"A price ending in 99 can make something seem cheaper.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Most people spend more at the supermarket on Saturdays.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What does the writer advise you to do before you go shopping?","opts":["Write a list and set a budget.","Go when you are very hungry.","Take a younger brother or sister.","Only buy things from the back of the shop."],"a":0}]}],"extra":[{"kind":"collocation","q":"Can I ___ by card, please?","opts":["pay","buy","spend","cost"],"a":0,"why":"We say 'pay by card' or 'pay in cash'. You 'buy' a thing and 'spend' money."},{"kind":"preposition","q":"How much did you spend ___ your new trainers?","opts":["on","for","at","with"],"a":0,"why":"We 'spend money on' something."},{"kind":"phrasal","q":"I'm ___ a birthday present for my dad. Have you got any ideas?","opts":["looking for","looking after","looking up","looking out"],"a":0,"why":"'Look for' means try to find something."},{"kind":"wordform","q":"Thank you for your kind ___ to the school fair. (donate)","opts":["donation","donate","donor","donated"],"a":0,"why":"After 'your kind' we need a noun for the thing you gave: donation. A 'donor' is a person."},{"kind":"linking","q":"I wanted to buy the game, ___ I didn't have enough money.","opts":["but","so","because","or"],"a":0,"why":"'But' joins two ideas that go against each other: I wanted it, but I couldn't pay."},{"kind":"paraphrase","q":"Which sentence means the same as 'These shoes were a bargain'?","opts":["These shoes cost less than they usually do.","These shoes were very expensive.","These shoes were a present.","These shoes did not fit."],"a":0,"why":"A 'bargain' is something that you buy for less than its usual price."}],"writing":[{"kind":"paragraph","sents":["Many parents give their children pocket money every week.","This helps children to learn how to manage money.","For example, they may need to save for several weeks to buy something special.","In this way, they learn that they cannot have everything at once.","These are lessons that will be useful for the rest of their lives."]},{"kind":"paragraph","sents":["Charity shops are a great place to find a bargain.","They sell clothes, books and toys that people have given away.","Because the shop gets these things for free, it can sell them at low prices.","The money it makes is then used to help people or animals in need.","So when you shop there, you save money and help others at the same time."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'The price of the game went down a bit in the sale.'?","opts":["The price of the game fell slightly in the sale.","The game got a bit cheaper, kind of.","The price of the game went down loads.","The game's price did a small drop."],"a":0,"why":"'Fell slightly' is short and exact. 'Kind of' is vague, 'loads' is chatty and changes the meaning, and 'did a small drop' is not natural English."},{"kind":"thesis","q":"Essay question: 'Should children get pocket money for helping at home? Give your opinion.' Which is the clearest thesis statement?","opts":["I think children should get pocket money for helping at home, because it teaches them that work has value.","Pocket money is money that children get.","My friend gets five pounds a week.","Helping at home can mean many different things."],"a":0,"why":"The best thesis answers the question and gives a reason. The others only explain a word, tell a story or stay vague."}]}]},{"stage":5,"units":[{"id":"achiever-1","title":"Climate and energy","emoji":"🌍","words":[{"w":"renewable","def":"coming from a natural source that will not run out, such as the sun or the wind","ex":"Wind and solar power are ___ sources of energy.","pos":"adj","pic":"♻️","ant":["non-renewable"]},{"w":"fossil fuel","def":"a fuel such as coal, oil or gas, formed over millions of years from dead plants and animals","ex":"Coal is a ___ that formed from plants millions of years ago.","pos":"noun"},{"w":"emissions","def":"gases that are sent into the air, for example by cars and factories","ex":"The city wants to cut its carbon ___ by half.","pos":"noun","pic":"🏭"},{"w":"carbon footprint","def":"the amount of carbon dioxide that a person's activities add to the air","ex":"Cycling instead of going by car reduces your ___.","pos":"noun","pic":"👣"},{"w":"sustainable","def":"able to continue for a long time without harming the planet","ex":"Bamboo is a ___ material because it grows back very quickly.","pos":"adj","pic":"🎋","forms":{"noun":"sustainability","adj":"sustainable"}},{"w":"consume","def":"to use energy, fuel, food or time","ex":"Old fridges ___ much more electricity than new ones.","pos":"verb","syn":["use"],"forms":{"noun":"consumption","verb":"consume"}},{"w":"efficient","def":"working well without wasting energy, time or money","ex":"LED bulbs are more ___ than old bulbs because they waste less energy as heat.","pos":"adj","pic":"💡","ant":["wasteful"],"forms":{"noun":"efficiency","adj":"efficient","adv":"efficiently"}},{"w":"drought","def":"a long period with little or no rain","ex":"After months of ___, the river was almost dry.","pos":"noun","pic":"🏜️"},{"w":"glacier","def":"a huge mass of ice that moves very slowly down a mountain or valley","ex":"As the planet warms, the ___ is shrinking a little every year.","pos":"noun","pic":"🏔️"},{"w":"generate","def":"to produce energy, such as electricity or heat","ex":"Wind turbines ___ electricity when the wind blows.","pos":"verb","syn":["produce"],"forms":{"noun":"generation","verb":"generate"}},{"w":"global","def":"affecting or including the whole world","ex":"Plastic in the oceans is a ___ problem, not just a local one.","pos":"adj","pic":"🌐","syn":["worldwide"],"ant":["local"]},{"w":"impact","def":"a strong effect that something has on something else","ex":"Cars have a big ___ on the air quality in cities.","pos":"noun","syn":["effect"]},{"w":"insulation","def":"material that stops heat from escaping, for example from a house","ex":"Thick ___ in the roof keeps the house warm in winter.","pos":"noun","forms":{"noun":"insulation","verb":"insulate"}},{"w":"conserve","def":"to use as little of something as possible, so that it lasts longer","ex":"We can ___ water by taking shorter showers.","pos":"verb","syn":["save"],"ant":["waste"],"forms":{"noun":"conservation","verb":"conserve"}},{"w":"greenhouse gas","def":"a gas, such as carbon dioxide, that traps heat in the air around the Earth","ex":"Methane, which is produced by cows, is a powerful ___.","pos":"noun"},{"w":"extreme","def":"very great or very severe; much more than usual","ex":"Scientists expect more ___ weather, such as heatwaves and floods.","pos":"adj","forms":{"adj":"extreme","adv":"extremely"}},{"w":"sea level","def":"the average height of the surface of the sea","ex":"As the ice melts, the ___ around the world is slowly rising.","pos":"noun"},{"w":"alternative","def":"something that you can choose instead of something else","ex":"Cycling is a cheap and healthy ___ to driving.","pos":"noun","syn":["option"]},{"w":"absorb","def":"to take in a liquid, a gas or heat, like a sponge takes in water","ex":"Dark clothes ___ more heat from the sun than white ones.","pos":"verb","forms":{"noun":"absorption","verb":"absorb"}},{"w":"solar panel","def":"a flat piece of equipment that turns sunlight into electricity","ex":"A small ___ on the roof of the shed powers the lights in our garden.","pos":"noun","pic":"☀️"}],"grammar":[{"q":"Hundreds of new wind turbines ___ in the North Sea in recent years.","opts":["have been built","have built","were building","has been built"],"a":0,"why":"The turbines didn't build anything, so use the passive. 'In recent years' goes with the present perfect: have been built."},{"q":"Next year, solar panels ___ on the roof of every new house in our town.","opts":["will be installed","will install","are installing","installed"],"a":0,"why":"This is the future passive: will be + past participle. The panels don't install anything themselves."},{"q":"Plastic bottles can ___ into new clothes.","opts":["be recycled","recycle","recycled","be recycling"],"a":0,"why":"After a modal verb like 'can', the passive is be + past participle: can be recycled."},{"q":"If we ___ the lights off last night, we would have saved energy.","opts":["had turned","turned","have turned","would turn"],"a":0,"why":"Third conditional (an imaginary past): if + had + past participle, then would have + past participle."},{"q":"I wish our school ___ solar panels on its roof.","opts":["had","has","will have","is having"],"a":0,"why":"When we wish the present were different, we use a past form after 'wish': I wish it had..."},{"q":"___ the rain, the solar panels still produced some electricity.","opts":["Despite","Although","However","Because"],"a":0,"why":"'Despite' is followed by a noun (the rain). 'Although' needs a full clause, such as 'Although it rained'."},{"q":"We're going to ___ our loft insulated before the winter.","opts":["have","do","let","put"],"a":0,"why":"'Have something done' means you pay someone else to do the job: we're going to have the loft insulated."},{"q":"The lights are still on in the empty classroom. Someone ___ forgotten to switch them off.","opts":["must have","should have","can have","must"],"a":0,"why":"'Must have' + past participle shows we are almost sure about the past because of the evidence."},{"q":"The Sun, ___ is about 150 million kilometres away, gives the Earth almost all of its energy.","opts":["which","that","who","where"],"a":0,"why":"Use 'which' for a thing in a non-defining clause (between commas). 'That' is not used after a comma."},{"q":"A new solar farm ___ near our village at the moment.","opts":["is being built","is building","has built","was built"],"a":0,"why":"The work is happening now and the farm doesn't build itself, so use the present continuous passive: is being built."}],"sentences":["Wind turbines have been built along the coast of Scotland.","If only the bus ran on electricity.","Have you ever calculated the size of your carbon footprint?","More houses are being fitted with solar panels.","Forests absorb huge amounts of carbon dioxide from the air.","A new solar farm is being built near our village."],"reading":[{"title":"An island powered by the wind","text":"Samsø is a small Danish island with about 4,000 residents. In the 1990s, it depended on oil and on electricity from coal power stations on the mainland. Today, it is famous around the world as an island that produces all of its electricity from renewable sources.\n\nThe change began in 1997, when Samsø won a national competition to become a renewable energy island. However, the plan could not succeed without local support, and at first many islanders were worried. Would wind turbines spoil their beautiful views? Would the project cost too much? Rather than forcing the idea on people, the organisers held meetings in village halls and listened to their concerns.\n\nThe key decision was to let local people own the turbines. Farmers, families and businesses bought shares, so the money from the electricity stayed on the island. As a result, the turbines became something to be proud of rather than something to complain about.\n\nWithin about ten years, Samsø's turbines were generating more electricity than the island needed, and the extra power was sold to the mainland. Many homes are now warmed by local heating stations that burn straw, a waste product from farms.\n\nSamsø shows that the biggest challenge in changing how we use energy is not always the technology. Often, it is persuading people to work together.","qs":[{"type":"mc","q":"What is the writer's main purpose?","opts":["to show how a community worked together to change its energy","to explain how a wind turbine works","to persuade readers to move to Samsø","to compare the costs of oil and coal"],"a":0},{"type":"tfng","q":"Everyone on Samsø supported the project from the very beginning.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Islanders themselves own some of the wind turbines.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Electricity on Samsø is now cheaper than anywhere else in Denmark.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What is used to heat many homes on Samsø today?","opts":["straw from farms","oil from the mainland","coal","electricity from the mainland"],"a":0}]},{"title":"Reading the past in ice","text":"In the middle of Antarctica, it is so cold that the snow which falls each year never melts. Instead, each new layer presses down on the layers below and slowly turns them into solid ice. Over a very long time, this ice has built up into a sheet that is more than three kilometres thick in places.\n\nAs the snow is squeezed into ice, tiny bubbles of air are trapped inside it. These bubbles are like miniature time capsules. To study them, scientists drill deep into the ice sheet and pull out long cylinders of ice, known as ice cores. The deeper the ice, the older it is, and some cores contain air from more than 800,000 years ago.\n\nBy analysing the bubbles, researchers can measure how much carbon dioxide there was in the atmosphere in the distant past. Other clues in the ice allow them to work out what the temperature was like. Their results show that, over long periods, carbon dioxide levels and temperatures have risen and fallen together.\n\nThe ice cores also reveal that there is more carbon dioxide in the air today than at any time in at least the last 800,000 years. This is one of the clearest pieces of evidence that burning fossil fuels is changing the Earth's climate.","qs":[{"type":"mc","q":"What is the writer's main purpose?","opts":["to explain how ice can tell us about the Earth's climate in the past","to describe what it is like to live in Antarctica","to persuade readers to visit the South Pole","to explain why snow never melts"],"a":0},{"type":"tfng","q":"The ice at the bottom of a core is younger than the ice near the top.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Scientists can study ancient air that is trapped in the ice.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Drilling a deep ice core takes several years.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What have scientists learnt about carbon dioxide and temperature?","opts":["Over long periods, they have risen and fallen together.","Neither of them has ever changed.","Temperature has no link with carbon dioxide.","Carbon dioxide only rises in winter."],"a":0}]}],"extra":[{"kind":"collocation","q":"Everyone can ___ a difference by using less energy at home.","opts":["make","do","take","give"],"a":0,"why":"'Make a difference' is a fixed phrase that means to have a good effect."},{"kind":"wordform","q":"The country's energy ___ fell last year. (consume)","opts":["consumption","consumer","consuming","consumed"],"a":0,"why":"We need a noun for the amount used: consumption. A 'consumer' is a person who buys or uses things."},{"kind":"linking","q":"Solar power is clean and cheap. ___, solar panels produce no electricity at night.","opts":["However","Therefore","For example","In addition"],"a":0,"why":"'However' introduces a contrast: first a good point, then a problem."},{"kind":"register","q":"Which sentence is the most suitable for an academic essay?","opts":["Burning fossil fuels significantly increases carbon emissions.","Burning coal and stuff is really bad for the air.","Loads of carbon gets pumped out when we burn things.","Fossil fuels? Seriously bad news for the planet!"],"a":0,"why":"Academic writing uses precise words (significantly, emissions) and avoids chatty phrases like 'and stuff' or 'loads of'."},{"kind":"paraphrase","q":"Which sentence means the same as 'Electricity from the sun is getting cheaper'?","opts":["The cost of solar power is falling.","Solar power is becoming more expensive.","The sun produces less electricity than before.","Most cheap electricity comes from the sun."],"a":0,"why":"'Electricity from the sun' is solar power, and 'getting cheaper' means the cost is falling."},{"kind":"cohesion","q":"Which sentence best continues the text? 'Many countries are building wind farms out at sea. ___'","opts":["This is because winds are usually stronger and steadier over the ocean.","However, wind is a type of weather.","For example, sea water is very salty.","As a result, people enjoy swimming in summer."],"a":0,"why":"'This is because' gives the reason for the idea in the sentence before it."},{"kind":"phrasal","q":"If we keep using oil at this rate, one day we will ___ of it.","opts":["run out","run over","run into","run up"],"a":0,"why":"'Run out of' something means use all of it, so there is none left."},{"kind":"preposition","q":"Many countries want to reduce their dependence ___ oil and gas.","opts":["on","of","from","with"],"a":0,"why":"We say 'dependence on' something, just as we say 'depend on' it."},{"kind":"mainidea","q":"Read the paragraph: 'Electric cars do not release fumes into city streets, which helps to keep the air clean. However, they are only as clean as the electricity they use. If that electricity comes from burning coal or gas, the cars are still responsible for some emissions.' Which heading fits best?","opts":["Electric cars: cleaner, but not perfect","How to charge an electric car","Why coal is cheaper than gas","The history of the motor car"],"a":0,"why":"The paragraph gives one good point and one problem, so the best heading shows both sides."},{"kind":"collocation","q":"Our school council decided to ___ action to save energy.","opts":["take","make","do","give"],"a":0,"why":"'Take action' is a fixed phrase that means do something to deal with a problem."}],"writing":[{"kind":"paragraph","sents":["Solar power has several advantages over fossil fuels.","Firstly, sunlight is free and will never run out.","Secondly, solar panels produce no greenhouse gases while they are working.","However, they cannot generate electricity at night, so some of the energy has to be stored in batteries.","Despite this drawback, solar power is likely to play a major role in the future."]},{"kind":"paragraph","sents":["There are several simple ways in which families can reduce the energy they use at home.","One of the easiest is to switch off lights and devices when nobody is using them.","Another is to improve the insulation in the roof and walls, so that less heat escapes.","Although this costs money at first, it lowers heating bills for many years.","If every household made these changes, the total savings would be enormous."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Lots of countries are using way more wind power now.'?","opts":["Many countries have significantly increased their use of wind power.","Loads of countries use wind power a lot more now.","Wind power is used by countries, which is good.","Countries are doing wind power more and more, basically."],"a":0,"why":"'Significantly increased' is precise and formal. 'Loads of', 'basically' and 'doing wind power' are chatty, and 'which is good' is vague."},{"kind":"topic","q":"Read the rest of a paragraph: 'For instance, many cities now have bike-sharing schemes and electric buses. Some have also created low-emission zones, where the most polluting vehicles must pay to enter.' Which topic sentence fits best?","opts":["Cities around the world are finding new ways to cut traffic emissions.","Bicycles were invented in the nineteenth century.","Electric buses are quieter than diesel buses.","Cities are big places where lots of people live."],"a":0,"why":"'For instance' shows that examples of a general point follow. Only the first option is a general point that every example supports."},{"kind":"thesis","q":"Essay question: 'Some people believe that individuals can do little to fight climate change, and that only governments and large companies can make a difference. To what extent do you agree or disagree?' Which is the clearest thesis statement?","opts":["While governments and companies have the greatest power, I disagree that individuals can do little, because millions of small changes add up.","Climate change is a big problem in the world today.","Governments, companies and people are all different.","I think recycling is fun and everyone should try it!"],"a":0,"why":"The best thesis takes a clear position on the question and gives a reason. The others state facts, say nothing, or are chatty and off the point."}]},{"id":"achiever-2","title":"How we communicate","emoji":"💬","words":[{"w":"gesture","def":"a movement of your hand, head or face that shows a meaning","ex":"Waving goodbye is a ___ that people understand in many countries.","pos":"noun","pic":"👋"},{"w":"body language","def":"the way your face, hands and position show how you feel","ex":"His ___ showed he was nervous: he kept looking at the floor.","pos":"noun","pic":"🙆"},{"w":"fluent","def":"able to speak a language easily and well","ex":"After five years in Spain, my cousin became ___ in Spanish.","pos":"adj","forms":{"noun":"fluency","adj":"fluent","adv":"fluently"}},{"w":"misunderstand","def":"to understand something in the wrong way","ex":"Short text messages are easy to ___ because you cannot hear the tone of voice.","pos":"verb","forms":{"noun":"misunderstanding","verb":"misunderstand"}},{"w":"persuade","def":"to make someone agree to do something by giving good reasons","ex":"I tried to ___ my parents to let me have a pet rabbit.","pos":"verb","syn":["convince"],"forms":{"noun":"persuasion","verb":"persuade","adj":"persuasive"}},{"w":"express","def":"to show a feeling or an idea in words, pictures or actions","ex":"Some children find it easier to ___ their feelings through drawing.","pos":"verb","pic":"🎨","forms":{"noun":"expression","verb":"express"}},{"w":"signal","def":"a sound, light, movement or radio wave that carries a message","ex":"Up in the mountains, my phone had no ___, so I couldn't call home.","pos":"noun","pic":"📶"},{"w":"interrupt","def":"to stop someone while they are speaking by saying something yourself","ex":"It's rude to ___ someone when they are in the middle of a story.","pos":"verb","forms":{"noun":"interruption","verb":"interrupt"}},{"w":"accent","def":"the way people from a particular place pronounce words","ex":"My cousin from Glasgow has a strong Scottish ___.","pos":"noun"},{"w":"translate","def":"to change words from one language into another","ex":"Can you ___ this menu from French into English?","pos":"verb","forms":{"noun":"translation","verb":"translate"}},{"w":"audience","def":"the people who watch or listen to a show, film or talk","ex":"The ___ clapped loudly at the end of her speech.","pos":"noun","pic":"👏"},{"w":"eye contact","def":"looking straight into someone's eyes while you talk to them","ex":"Good speakers make ___ with the people who are listening.","pos":"noun","pic":"👀"},{"w":"pronounce","def":"to make the sound of a word or a letter in a particular way","ex":"Many learners find it hard to ___ the 'th' sound in English.","pos":"verb","forms":{"noun":"pronunciation","verb":"pronounce"}},{"w":"bilingual","def":"able to speak two languages equally well","ex":"My cousin is ___: she speaks Welsh at school and English at home.","pos":"adj"},{"w":"native speaker","def":"someone who has spoken a language since they were a baby","ex":"Even a ___ of English sometimes needs to look up a word in a dictionary.","pos":"noun"},{"w":"tone","def":"the way a voice sounds, which shows how the speaker feels","ex":"I could tell from her ___ of voice that she was annoyed.","pos":"noun"},{"w":"summarise","def":"to give only the most important points of something, in a few words","ex":"Can you ___ the main ideas of the article in three sentences?","pos":"verb","forms":{"noun":"summary","verb":"summarise"}},{"w":"clarify","def":"to make something easier to understand by explaining it in more detail","ex":"Could you ___ what you mean by that, please?","pos":"verb","forms":{"noun":"clarification","verb":"clarify"}},{"w":"sign language","def":"a way of talking that uses movements of the hands instead of spoken words","ex":"Our teacher taught us how to say 'thank you' in ___.","pos":"noun","pic":"🤟"},{"w":"nod","def":"to move your head up and down, often to show that you agree","ex":"If you agree with me, just ___ your head.","pos":"verb"}],"grammar":[{"q":"She asked me where ___.","opts":["I lived","did I live","do I live","I do live"],"a":0,"why":"In a reported question, use normal sentence order (I lived), not question order (did I live)."},{"q":"Tom asked ___ I could speak French.","opts":["if","that","what","do"],"a":0,"why":"To report a yes/no question, use 'if' (or 'whether')."},{"q":"The teacher told us ___ our phones off during the talk.","opts":["to turn","turn","turning","that turn"],"a":0,"why":"To report an order, use tell + person + to + verb: told us to turn."},{"q":"My friend ___ me to practise speaking English every day.","opts":["advised","suggested","said","explained"],"a":0,"why":"'Advise' can be followed by a person + to + verb. We can't say 'suggested me to', 'said me to' or 'explained me to'."},{"q":"Samuel Morse, ___ gave his name to Morse code, was also a painter.","opts":["who","that","which","whose"],"a":0,"why":"For a person in a non-defining clause (between commas), use 'who'. 'That' can't be used after a comma like this."},{"q":"The first text message ___ in 1992.","opts":["was sent","has been sent","sent","is sent"],"a":0,"why":"1992 is a finished time in the past, so use the past simple passive: was sent."},{"q":"'I met your teacher yesterday,' said Mum. Mum told me that she ___ my teacher the day before.","opts":["had met","has met","meets","had meet"],"a":0,"why":"In reported speech, the past simple (met) often moves back to the past perfect: had met."},{"q":"I wish I ___ Japanese. Then I could chat to my pen friend in her own language.","opts":["spoke","speak","will speak","have spoken"],"a":0,"why":"To wish that the present were different, use a past form after 'wish': I wish I spoke."},{"q":"You ___ told me you were coming! I would have made more food.","opts":["should have","should","can have","would"],"a":0,"why":"'Should have' + past participle means it was a good idea, but it didn't happen: you didn't tell me."},{"q":"Louis Braille, ___ alphabet of raised dots is used by blind people around the world, was born in France.","opts":["whose","who","which","that"],"a":0,"why":"'Whose' shows that something belongs to someone: Braille's alphabet. It works in a clause between commas, too."}],"sentences":["She asked me whether I had ever been to Japan.","The teacher told us not to interrupt each other.","My message, which I sent to the wrong person, was very embarrassing.","Do you know how many languages are spoken in India?","You should have told me that you were coming.","Louis Braille invented an alphabet that blind people can read with their fingers."],"reading":[{"title":"The island where people whistle","text":"On La Gomera, one of Spain's Canary Islands, some people can hold a conversation without saying a single word. Instead, they whistle. Their language, Silbo Gomero, turns Spanish into whistled sounds that rise and fall in pitch.\n\nThe island is covered with deep valleys and steep hills, so walking from one farm to the next could take hours. A loud whistle, however, can cross a valley in seconds and be heard several kilometres away. For centuries, shepherds and farmers used Silbo to send messages, warn their neighbours and arrange to meet.\n\nIn the twentieth century, roads and telephones arrived, and fewer young people learnt to whistle. The language might have disappeared completely if the island had not decided to protect it. In 1999, Silbo became a compulsory subject in local schools, and today children on the island learn it in class. In 2009, UNESCO recognised it as an important part of the world's cultural heritage.\n\nScientists find Silbo fascinating, too. Studies have shown that skilled whistlers use the same parts of the brain that normally deal with speech. This suggests that the brain treats whistling as a real language, not just as music.","qs":[{"type":"mc","q":"What is the text mainly about?","opts":["a whistled language and how it was saved","how to learn Spanish quickly","the history of the telephone","why farmers live in valleys"],"a":0},{"type":"tfng","q":"Silbo Gomero is based on the Spanish language.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Children on La Gomera can choose whether or not to learn Silbo at school.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"It takes most people about a year to learn Silbo well.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What did the brain studies suggest?","opts":["The brain treats Silbo like a real language.","Whistling is just a kind of music.","Whistlers have bigger brains than other people.","Silbo is harder to learn than Spanish."],"a":0}]},{"title":"Small pictures, big messages","text":"In 1999, a Japanese designer called Shigetaka Kurita was working for a mobile phone company. At that time, text messages had to be very short, and words alone could sound cold or unclear. Kurita's answer was a set of 176 tiny pictures, each one just 12 dots wide and 12 dots high. They became known as emoji.\n\nMany people assume that the word comes from 'emotion', but it does not. It combines two Japanese words: 'e', which means picture, and 'moji', which means character.\n\nAt first, emoji were only available in Japan. However, in 2010 they were added to the international system that computers use to display text, and soon smartphones everywhere had them. Today there are more than 3,000, from food and animals to flags and faces.\n\nEmoji do an important job. In a face-to-face conversation, our tone of voice and body language show how we feel. In a written message, these clues are missing, so a short reply such as 'OK' can easily be misunderstood. Adding a smiling face shows that the writer is friendly rather than annoyed.\n\nKurita's original designs are now so famous that in 2016 they became part of the collection of the Museum of Modern Art in New York.","qs":[{"type":"mc","q":"What is the main idea of the text?","opts":["Emoji began in Japan and help to make written messages clearer.","Emoji are more popular in Japan than anywhere else.","Text messages should always be very short.","Museums should collect more mobile phones."],"a":0},{"type":"tfng","q":"The word 'emoji' comes from the English word 'emotion'.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Kurita's first set contained fewer than 200 pictures.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Older people use emoji less often than younger people.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the text, why can a reply such as 'OK' be misunderstood?","opts":["The reader cannot hear the writer's tone of voice.","It is too long.","It is written in Japanese.","It contains too many emoji."],"a":0}]}],"extra":[{"kind":"idiom","q":"The party was meant to be a surprise, but my little brother ___.","opts":["let the cat out of the bag","broke the ice","hit the nail on the head","was over the moon"],"a":0,"why":"'Let the cat out of the bag' means tell a secret by mistake."},{"kind":"phrasal","q":"The line was so bad that I couldn't ___ what she was saying.","opts":["make out","make up","break down","put up"],"a":0,"why":"'Make out' means manage to hear, see or understand something with difficulty."},{"kind":"register","q":"Which is the most polite way to ask a teacher for help?","opts":["Could you possibly explain this again, please?","Explain this again.","What? Say that again.","You need to explain this again."],"a":0,"why":"'Could you possibly... please?' is polite and indirect. The others sound like orders or are rude."},{"kind":"collocation","q":"Our head teacher ___ a speech at the end-of-year assembly.","opts":["gave","did","said","told"],"a":0,"why":"We 'give a speech' (or 'make a speech'). We don't 'do', 'say' or 'tell' a speech."},{"kind":"wordform","q":"Her ___ in three languages helped her to get the job. (fluent)","opts":["fluency","fluent","fluently","fluented"],"a":0,"why":"After 'Her' we need a noun: fluency."},{"kind":"cohesion","q":"Which sentence best continues the text? 'Humans are not the only animals that communicate with sound. ___'","opts":["Whales, for example, make sounds that can travel hundreds of kilometres underwater.","However, whales are mammals.","In contrast, many people enjoy music.","Therefore, sound is very loud."],"a":0,"why":"'For example' introduces an example that supports the sentence before it."},{"kind":"paraphrase","q":"Which sentence means the same as 'I couldn't get my message across'?","opts":["I couldn't make people understand what I meant.","I couldn't send my message on time.","I couldn't cross the road to talk to them.","I didn't want to share my message."],"a":0,"why":"'Get a message across' means make people understand it."},{"kind":"linking","q":"___ he had lived in France for years, he still found some French jokes hard to understand.","opts":["Although","Despite","Because","So"],"a":0,"why":"'Although' is followed by a full clause and shows a surprising contrast. 'Despite' would need a noun or an -ing form."},{"kind":"preposition","q":"He is very good ___ explaining difficult ideas in simple words.","opts":["at","in","for","of"],"a":0,"why":"We say 'good at' a skill or an activity. 'Good for' means healthy or useful."},{"kind":"mainidea","q":"Read the paragraph: 'Long before telephones, people found clever ways to send messages over long distances. Some lit fires on hilltops, while others used drums or smoke signals. Sailors raised coloured flags to talk to other ships. All of these methods let news travel faster than a person could walk.' Which heading fits best?","opts":["Early ways of sending messages far","How to light a fire on a hill","Life on a sailing ship","The invention of the telephone"],"a":0,"why":"Fires, drums and flags are all examples of one idea: old ways of sending messages over long distances."}],"writing":[{"kind":"paragraph","sents":["Body language often says as much as the words we use.","For example, people who are nervous may avoid eye contact or cross their arms.","In contrast, confident speakers usually stand up straight and smile at their audience.","Listeners notice these signals, often without realising it.","Therefore, anyone giving a presentation should think about how they move as well as what they say."]},{"kind":"paragraph","sents":["Learning a second language brings many benefits.","The most obvious one is that it allows you to communicate with more people.","In addition, it can help you to understand another culture, including its jokes and traditions.","This kind of understanding can make travelling abroad far more enjoyable.","For these reasons, many schools encourage pupils to start a new language at a young age."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Texting has changed how people talk to each other a lot.'?","opts":["Text messaging has had a significant impact on the way people communicate.","Texting has changed talking loads.","Texting changed stuff about talking.","People text, and talking is different, I guess."],"a":0,"why":"'Had a significant impact on the way people communicate' is precise and formal. 'Loads', 'stuff' and 'I guess' are chatty and vague."},{"kind":"topic","q":"Read the rest of a paragraph: 'In Japan, bowing is a common way to say hello. In many parts of Europe, however, friends often kiss each other on the cheek, while a handshake is more usual in business.' Which topic sentence fits best?","opts":["People in different countries greet each other in different ways.","Bowing is a Japanese tradition.","Business meetings can be very long.","Saying hello is nice."],"a":0,"why":"The paragraph compares greetings in several places, so the topic sentence must cover greetings around the world. The others are too narrow, off topic or vague."},{"kind":"thesis","q":"Essay question: 'Some people think children should sta

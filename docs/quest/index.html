s avoided?","opts":["Changes in everyday habits played a central part.","New technology solved the problem almost on its own.","The city authorities did nothing to help.","The rains alone would have prevented it without any other changes."],"a":0},{"type":"mc","q":"What is the main purpose of the final paragraph?","opts":["to suggest that Cape Town's experience is relevant to other cities","to describe the heavy rains of the winter of 2018","to criticise the officials who ran the city","to explain how dams are designed and built"],"a":0}]}],"extra":[{"kind":"collocation","q":"Governments must ___ steps to reduce food waste.","opts":["take","make","do","put"],"a":0,"why":"The fixed phrase is 'take steps' (take action); make, do and put do not go with 'steps' here."},{"kind":"preposition","q":"Many farmers have switched ___ crops that need less water.","opts":["to","at","on","for"],"a":0,"why":"We 'switch to' something new (or 'switch from' the old thing)."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Fog collection is a supplement to other water sources rather than a replacement for them.'?","opts":["Fog collection adds to other water sources but cannot take their place.","Fog collection should be used instead of other water sources.","Other water sources are less useful than fog collection.","Fog collection is used only when other water sources have disappeared."],"a":0,"why":"A supplement is something extra that is added; a replacement takes the place of something."},{"kind":"linking","q":"The nets are cheap to build. ___, they produce very little water when there is no wind.","opts":["On the other hand","As a result","In the same way","For this reason"],"a":0,"why":"The second sentence gives a disadvantage that contrasts with the first, so we need 'On the other hand'."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'In many countries, a large share of the food that is grown is never eaten. Some is lost on farms or during transport, while some is thrown away by shops and households. Reducing this waste could feed more people without using any extra land.'","opts":["The potential of cutting food waste","How to grow vegetables at home","Why transport costs are rising","The early history of farming"],"a":0,"why":"The paragraph describes where food is wasted and ends with the benefit of reducing that waste."},{"kind":"wordform","q":"Farmers in dry areas need crops that are ___ (resist) to drought.","opts":["resistant","resistance","resisting","resistible"],"a":0,"why":"After 'are' and before 'to' we need an adjective: resistant to something."},{"kind":"register","q":"Which sentence is most suitable for an IELTS Writing Task 1 report?","opts":["Water consumption in the city fell by approximately fifty per cent between 2015 and 2018.","Water use dropped loads, which was awesome.","People basically used half the water, more or less.","Check it out: water use halved in three years!"],"a":0,"why":"A Task 1 report gives figures precisely and neutrally ('approximately fifty per cent'), without chatty words or exclamations."},{"kind":"cohesion","q":"Which order is most logical? A: This forced officials to warn of a date when the taps would be turned off. B: Three dry winters left the city's dams almost empty. C: Faced with this warning, residents cut their water use by half.","opts":["B, A, C","A, B, C","C, B, A","B, C, A"],"a":0,"why":"B gives the cause, A ('This forced...') the official response, and C ('Faced with this warning') how residents reacted."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Many places may need to treat water not as an endless resource but as one that must be carefully managed.'?","opts":["Many places may have to stop assuming water will never run out and look after it carefully.","Water is an endless resource, so it needs very little management.","Many places should use more water than they do now.","Water will soon run out in every place on Earth."],"a":0,"why":"'Not as an endless resource' means no longer assuming it will never run out, and 'carefully managed' means looked after with care."},{"kind":"collocation","q":"The long drought ___ a heavy toll on the farmers' harvests.","opts":["took","made","gave","did"],"a":0,"why":"'Take a toll on' something is a fixed phrase meaning to cause it serious harm over time."}],"writing":[{"kind":"paragraph","sents":["Reducing food waste may be one of the simplest ways to feed a growing population.","A large share of the food produced worldwide is never eaten: some is lost on farms or during transport, and some is thrown away at home.","If even part of this waste were prevented, more people could be fed without clearing any new land.","To achieve this, simple measures such as better storage and clearer date labels would help."]},{"kind":"paragraph","sents":["Drip irrigation allows farmers to grow crops using far less water.","Instead of flooding whole fields, the system delivers small amounts of water directly to the roots of each plant through narrow pipes.","This means that much less water is lost through evaporation or runoff.","As a result, the method has become especially valuable in dry regions where water is scarce."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Lots of people in the world don't have enough clean water, which is really bad.'?","opts":["A substantial proportion of the world's population lacks reliable access to safe drinking water.","Many people don't have clean water and it's terrible.","Nobody in the world has clean water any more.","Water is something people need, and some people have it."],"a":0,"why":"The first is precise and formal ('substantial proportion', 'lacks reliable access'). The others are informal, plainly untrue, or too vague to say anything."},{"kind":"topic","q":"Which topic sentence fits best? '___ In the Netherlands, for instance, greenhouses use LED lighting and recycled water to grow large quantities of tomatoes on very little land. Such methods could help countries with limited farmland to produce more of their own food.'","opts":["Technology can greatly increase the amount of food grown on a small area of land.","Tomatoes are a popular ingredient in many dishes.","The Netherlands is a small country in Europe.","Farming is a job that lots of people do."],"a":0,"why":"The example and the conclusion are both about high yields from little land. The others mention a detail of the example or are too general."},{"kind":"thesis","q":"Some people think that governments should make water more expensive to encourage people to use less. To what extent do you agree or disagree? Which is the clearest thesis statement?","opts":["I partly agree: higher prices for heavy users could reduce waste, but a basic daily amount should remain affordable for every household.","Water is used for drinking, cooking and washing.","Water should cost loads, because why not?","This essay will look at the topic of water prices."],"a":0,"why":"The first answers the question with a clear, qualified position. The others only describe water, give no real reason, or announce the topic without an opinion."}]},{"id":"expert-6","title":"Work and the future of jobs","emoji":"💼","words":[{"w":"employability","def":"the skills and qualities that make a person likely to find and keep a job","ex":"Universities now publish ___ figures showing how many graduates find work within six months.","pos":"noun","forms":{"noun":"employability","adj":"employable"}},{"w":"remote working","def":"doing your job from home or another place away from the workplace, using the internet","ex":"With ___, many office staff now do their jobs at their kitchen tables instead of travelling in.","pos":"phrase"},{"w":"freelance","def":"working on separate projects for several different organisations, rather than for one employer","ex":"As a ___ designer, she works on projects for several different companies each year.","pos":"adj","forms":{"adj":"freelance","noun":"freelancer"}},{"w":"vocational","def":"connected with the skills and training needed for a particular job","ex":"Many colleges offer ___ courses in plumbing and electrical work that prepare students for a trade.","pos":"adj"},{"w":"apprenticeship","def":"a period of training in which a young person learns a skilled job while working for an employer","ex":"During her four-year ___, she earned a wage while learning to repair aircraft engines.","pos":"noun","forms":{"noun":"apprenticeship","verb":"apprentice"}},{"w":"workforce","def":"all the people who work in a particular company, industry or country","ex":"Women now make up almost half of the country's ___.","pos":"noun","syn":["staff","employees"]},{"w":"upskill","def":"to learn new skills, or to teach workers new skills, so that they can cope with a changing job","ex":"Older employees are being encouraged to ___ so that they can use the new software.","pos":"verb"},{"w":"flexitime","def":"a system that lets employees choose, within limits, when they start and finish work","ex":"Thanks to ___, staff can start at seven and leave at three, or arrive later and stay later.","pos":"noun"},{"w":"work-life balance","def":"a healthy division of your time between your job and your family, rest and hobbies","ex":"Very long hours at the office can damage your ___, leaving little time for family and hobbies.","pos":"phrase"},{"w":"occupation","def":"a person's job or profession","ex":"On the form, please write your name, age and ___, for example 'teacher' or 'nurse'.","pos":"noun","syn":["job","profession"],"forms":{"noun":"occupation","adj":"occupational"}},{"w":"entrepreneur","def":"a person who starts their own business, often taking financial risks to do so","ex":"At sixteen, the young ___ launched an app that helps students swap second-hand textbooks.","pos":"noun","forms":{"noun":"entrepreneur","adj":"entrepreneurial"}},{"w":"incentive","def":"something, such as extra money, that encourages a person to work harder or to do something","ex":"Many companies offer a bonus as an ___ for staff who meet their targets.","pos":"noun","syn":["encouragement","reward"]},{"w":"collaborate","def":"to work together with other people in order to produce or achieve something","ex":"Engineers in three countries had to ___ closely to design the new high-speed train.","pos":"verb","syn":["cooperate"],"forms":{"verb":"collaborate","noun":"collaboration","adj":"collaborative"}},{"w":"menial","def":"describing work that is boring, needs little skill and is often poorly paid","ex":"Robots can take over ___ tasks, such as lifting boxes, leaving people free for more interesting work.","pos":"adj"},{"w":"mentor","def":"an experienced person who advises and helps someone with less experience","ex":"Each new nurse is paired with a ___ who has worked on the ward for many years.","pos":"noun","syn":["adviser"]},{"w":"workload","def":"the amount of work that a person is expected to do","ex":"With two colleagues away, her ___ doubled and she had to stay late every evening.","pos":"noun"},{"w":"recruit","def":"to find new people to join a company or an organisation","ex":"The hospital plans to ___ two hundred new nurses over the next year.","pos":"verb","syn":["hire","employ"],"forms":{"verb":"recruit","noun":"recruitment"}},{"w":"versatile","def":"able to do many different things, or to be used in many different ways","ex":"A ___ worker who can cook, serve customers and manage stock is valuable in a small cafe.","pos":"adj","syn":["adaptable","flexible"],"forms":{"adj":"versatile","noun":"versatility"}},{"w":"sector","def":"one part of a country's economy, such as farming, manufacturing or services","ex":"The tourism ___ employs more people than farming in many coastal regions.","pos":"noun"},{"w":"aptitude","def":"a natural ability to learn or to do something well","ex":"Some employers ask applicants to take an ___ test that measures their talent for logical thinking.","pos":"noun","syn":["talent","gift"]}],"grammar":[{"q":"Not only ___ from home, but she chooses her own working hours too.","opts":["does she work","she works","works she","she does work"],"a":0,"why":"When 'Not only' starts a sentence, use question order: Not only does she work..."},{"q":"It ___ that millions of new jobs will be created in renewable energy over the next decade.","opts":["is predicted","predicts","is predicting","has predicted"],"a":0,"why":"'It is predicted that...' reports a general forecast without saying who made it."},{"q":"What most employees value ___ the chance to keep learning new skills.","opts":["is","are","it is","being"],"a":0,"why":"A 'What' clause is a singular subject, and here the complement 'the chance' is singular too, so use 'is'."},{"q":"___ by the success of the trial, the company introduced a four-day week for all its staff.","opts":["Encouraged","Encouraging","Having encouraged","To encourage"],"a":0,"why":"The company was encouraged by the results (passive meaning), so the participle clause starts with 'Encouraged'."},{"q":"If she hadn't done an apprenticeship, she ___ such a well-paid job now.","opts":["wouldn't have","wouldn't have had","won't have","didn't have"],"a":0,"why":"Mixed conditional: a past condition (hadn't done) with a present result (now) takes 'would + verb'."},{"q":"The manager recommended that every new employee ___ a mentor.","opts":["be given","is giving","giving","to be given"],"a":0,"why":"After 'recommend that', formal English uses the base form (the subjunctive); here it is passive: be given."},{"q":"Demand for care workers ___ to grow as people live longer.","opts":["is likely","likes","is liking","likely"],"a":0,"why":"'Be likely to' is a cautious way to make a prediction; the sentence needs the verb 'is' before 'likely'."},{"q":"Rarely ___ a single invention changed working life as much as the internet has.","opts":["has","have","did","was"],"a":0,"why":"After 'Rarely' at the start, invert: has + singular subject + past participle (changed)."},{"q":"The ___ of new technology has changed the way many offices work.","opts":["introduction","introduce","introductory","introduced"],"a":0,"why":"After 'The' and before 'of' we need a noun: introduce becomes introduction (nominalisation)."},{"q":"___ the factory not trained its staff in time, it would have had to close.","opts":["Had","If","Should","Were"],"a":0,"why":"'Had + subject + not + past participle' is the inverted form of 'If the factory had not trained...' about the past."}],"sentences":["Many colleges offer vocational courses that prepare students for skilled trades.","Each new nurse is paired with an experienced mentor.","The company is paying for evening classes to upskill its staff.","Transferable skills remain useful even if you change careers.","Had the factory not trained its staff, it would have closed.","Rarely has a single invention changed working life so much."],"reading":[{"title":"Working four days, paid for five","text":"In 2022, around sixty British companies took part in what was then the largest trial of a four-day working week. For six months, about 2,900 employees worked roughly a fifth fewer hours, with no reduction in pay. The aim was not simply to squeeze five days of work into four longer ones; instead, organisations were encouraged to cut unnecessary meetings, reorganise tasks and find more efficient ways of working.\n\nThe results, published in 2023, attracted worldwide attention. The great majority of the companies chose to continue with the shorter week after the trial ended, and several made the change permanent. Employees reported less stress and tiredness, took fewer days off sick and were less likely to leave their jobs. Meanwhile, the companies' revenue remained broadly stable.\n\nSupporters argue that these findings show that long hours and high productivity are not the same thing. Rested workers, they suggest, concentrate better and make fewer mistakes, so they can achieve as much in less time.\n\nCritics, however, urge caution. The companies volunteered to take part, so they may have been unusually well suited to the experiment, and many were small, office-based organisations. It is far less clear how a four-day week would work in a hospital, a school or a factory, where many tasks must be covered at fixed times. Furthermore, six months may not be long enough to show whether the benefits last.\n\nFor now, the trial has shifted the debate. Rather than asking whether shorter weeks are possible, many employers are beginning to ask in which kinds of work they might succeed.","qs":[{"type":"tfng","q":"Employees in the trial had to accept lower pay in return for working fewer hours.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Most of the companies in the trial were based in London.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the passage, how were companies expected to cope with fewer working hours?","opts":["by working more efficiently, for example by holding fewer unnecessary meetings","by asking staff to work much longer days","by employing extra workers on the fifth day","by cutting the pay of their managers"],"a":0},{"type":"mc","q":"Why do the critics mention hospitals, schools and factories?","opts":["to suggest that the results may not apply to jobs that need people at set times","to show that these workplaces took part in the trial","to argue that these workers deserve higher pay","to prove that shorter weeks always fail"],"a":0},{"type":"mc","q":"What is the main point of the final paragraph?","opts":["The trial has changed the question that people ask about shorter working weeks.","The trial has proved that every job can move to a four-day week.","Employers have lost interest in shorter working weeks.","A longer trial is about to begin in hospitals."],"a":0}]},{"title":"The cash machine and the bank clerk","text":"When automated teller machines, or ATMs, began to spread across the United States in the 1970s and 1980s, many observers assumed that human bank tellers would soon disappear. After all, the machines could hand out cash and accept deposits at any hour of the day, without ever needing a break.\n\nWhat actually happened was more surprising. According to research by the economist James Bessen, the number of bank tellers in the United States did not fall as ATMs became common; in fact, it rose slightly over the following decades. The explanation lies in costs. Because cash machines reduced the number of staff needed in each branch, it became cheaper to run a branch, and banks responded by opening many more of them. More branches meant more tellers overall, even though each branch employed fewer.\n\nJust as importantly, the job itself changed. With machines handling routine withdrawals, tellers spent more of their time on tasks that required human skills, such as advising customers and explaining financial products. In other words, the technology took over particular tasks rather than an entire occupation.\n\nThis story is often used to argue that automation tends to transform jobs rather than destroy them. However, it should not be over-interpreted. Since the 2010s, as more people have turned to online and mobile banking, the number of tellers in the United States has declined, and many branches have closed. The lesson may be that the effects of a technology depend on how it changes the wider economy, and that these effects can shift over time.","qs":[{"type":"tfng","q":"Many people expected cash machines to make bank tellers unnecessary.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"James Bessen worked as a bank teller before he became an economist.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the passage, why did the number of tellers rise?","opts":["Branches became cheaper to run, so banks opened more of them and needed more staff in total.","Each branch employed more tellers than before.","Customers refused to use the new machines.","The machines often broke down and needed people to repair them."],"a":0},{"type":"mc","q":"What can be inferred about the tellers' work after cash machines arrived?","opts":["It came to depend more on communicating with customers.","It consisted mainly of counting cash by hand.","It became less skilled than before.","It was done mostly at night."],"a":0},{"type":"mc","q":"Why does the writer mention online and mobile banking?","opts":["to warn that the cash machine example should not be used for overconfident predictions","to show that tellers prefer working online","to argue that banks should close all their branches","to explain how cash machines were invented"],"a":0}]}],"extra":[{"kind":"collocation","q":"Over twenty years, she ___ a successful career in engineering.","opts":["built","made up","did","gave"],"a":0,"why":"We 'build a career' step by step; 'made up', 'did' and 'gave' do not go with 'career'."},{"kind":"collocation","q":"The new scheme aims to ___ the gap between what schools teach and what employers need.","opts":["bridge","build","jump","join"],"a":0,"why":"To 'bridge a gap' means to connect two things that are far apart; 'build', 'jump' and 'join' are not used with 'the gap between'."},{"kind":"wordform","q":"Employers increasingly look for people who can work ___ (collaborate) with colleagues.","opts":["collaboratively","collaborative","collaboration","collaborator"],"a":0,"why":"After the verb 'work' we need an adverb: collaboratively."},{"kind":"wordform","q":"A four-day week may not be ___ (practice) in hospitals, where staff are needed at all hours.","opts":["practical","practise","practically","practicality"],"a":0,"why":"After 'be' we need an adjective: practical, meaning possible and sensible to do."},{"kind":"paraphrase","q":"Which sentence means the same as: 'The technology took over particular tasks rather than an entire occupation.'?","opts":["Machines replaced some parts of the job, but not the job as a whole.","Machines replaced the whole job but left a few tasks.","The technology created a completely new occupation.","People refused to let machines do any of their tasks."],"a":0,"why":"'Particular tasks' are parts of a job, and 'rather than an entire occupation' means not the whole job."},{"kind":"register","q":"Which sentence is most suitable for an IELTS Writing Task 2 essay?","opts":["Remote working can offer employees greater flexibility, although it may reduce opportunities for teamwork.","Working from home is awesome, but you miss your mates.","Working from home is the best, no question.","Honestly, offices are kind of pointless now."],"a":0,"why":"Task 2 needs balanced, formal language ('greater flexibility', 'may reduce'); the others use slang or one-sided chat."},{"kind":"linking","q":"Remote working saves time on commuting; ___, some employees find it harder to separate work from home life.","opts":["on the other hand","as a result","in the same way","for this reason"],"a":0,"why":"The second idea is a disadvantage that contrasts with the first, so we need 'on the other hand'."},{"kind":"cohesion","q":"Which order is most logical? A: As a result, the firm decided to offer flexitime to all its staff. B: A small company noticed that many employees were arriving late because of the school run. C: Within a year, fewer people were late and staff said they were happier at work.","opts":["B, A, C","A, B, C","C, B, A","B, C, A"],"a":0,"why":"B gives the problem, A ('As a result') the firm's decision, and C ('Within a year') the outcome."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'Many of the jobs that today's pupils will do have not yet been invented. Twenty years ago, few people had heard of app developers or social media managers. Because the job market changes so quickly, schools increasingly focus on skills such as problem-solving and adaptability.'","opts":["Preparing pupils for jobs that do not yet exist","How to become an app developer","The history of social media","Why schools should teach only one career"],"a":0,"why":"The paragraph explains that future jobs are unknown and how schools respond to this."},{"kind":"phrasal","q":"The shop had to ___ several new workers to cope with the busy holiday season.","opts":["take on","take off","take after","take in"],"a":0,"why":"'Take on' workers means to employ them. 'Take off' means remove or leave the ground, and 'take after' means look like a relative."}],"writing":[{"kind":"paragraph","sents":["Remote working has brought both benefits and challenges for employees.","On the positive side, people who work from home save the time and money they would otherwise spend commuting.","Many also find that they can concentrate better without the interruptions of a busy office.","On the other hand, working alone can make it harder to share ideas and to feel part of a team.","For this reason, many companies now combine home working with regular days in the office."]},{"kind":"paragraph","sents":["Apprenticeships offer young people a valuable alternative to university.","Instead of studying full-time, apprentices learn a skilled trade while working for an employer.","This means that they earn a wage from the start and avoid large student debts.","Moreover, because they gain real experience, they are often well placed to find permanent jobs when their training ends.","Governments could therefore do more to encourage employers to offer such schemes."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Working from home is good because you don't waste time on the bus and stuff.'?","opts":["Remote working can save employees a considerable amount of time that would otherwise be spent commuting.","Working from home is good because you save time on the bus.","Working from home is great, as you don't have to bother with buses and things.","Nobody ever wastes any time when they work from home."],"a":0,"why":"The first uses precise terms ('remote working', 'commuting') and a cautious 'can'. The others stay informal ('and things') or make an absolute claim."},{"kind":"topic","q":"Which topic sentence fits best? '___ Doctors and nurses must care for patients through the night, and many factories run their machines around the clock. In such workplaces, a shorter week would mean hiring extra staff or reorganising shifts.'","opts":["A four-day week would be much harder to introduce in some jobs than in others.","Nurses work very hard and deserve more pay.","Factories use many different kinds of machines.","Work is something that most adults do."],"a":0,"why":"The body explains why round-the-clock workplaces would struggle with a shorter week. The others are off topic or far too general."},{"kind":"thesis","q":"Some people believe that in the future most jobs will be done by robots and computers, while others think people will always be needed at work. Discuss both views and give your opinion. Which is the clearest thesis statement?","opts":["Although machines will take over many routine tasks, I believe human workers will remain essential in roles that depend on creativity, care and judgement.","Robots and computers are used in many workplaces today.","Robots will do absolutely every job, so there is no point in studying.","Some people think one thing and others think another about robots."],"a":0,"why":"The first weighs both views and gives a clear, reasoned opinion. The others describe, overclaim, or simply repeat the question without a position."}]}]},{"stage":7,"units":[{"id":"band8-1","title":"Language and culture","emoji":"🗣️","words":[{"w":"ubiquitous","def":"seeming to be everywhere at the same time","ex":"English words such as 'weekend' and 'email' have become ___ in languages around the world.","pos":"adj","syn":["widespread","universal"],"ant":["rare"],"forms":{"adj":"ubiquitous","noun":"ubiquity"}},{"w":"nuance","def":"a very slight difference in meaning, feeling or tone","ex":"A skilled translator captures every ___ of the original poem, not just its basic meaning.","pos":"noun","syn":["subtlety"],"forms":{"noun":"nuance","adj":"nuanced"}},{"w":"idiomatic","def":"natural to native speakers, especially in its use of fixed expressions","ex":"Her English was not just correct but highly ___, full of expressions that native speakers use.","pos":"adj","forms":{"adj":"idiomatic","noun":"idiom"}},{"w":"convey","def":"to communicate or express a feeling, idea or message","ex":"A single gesture can ___ respect in one culture and rudeness in another.","pos":"verb","syn":["communicate","express"]},{"w":"assimilate","def":"to take in and absorb something so that it becomes part of you","ex":"Over the centuries, English has managed to ___ words from almost every language it has met.","pos":"verb","syn":["absorb"],"forms":{"verb":"assimilate","noun":"assimilation"}},{"w":"dialect","def":"a form of a language spoken in one area, with some of its own words and grammar","ex":"In the next valley, people spoke a ___ that visitors from the city struggled to follow.","pos":"noun"},{"w":"proficiency","def":"a high level of skill or ability in something","ex":"The exam measures ___ in reading, writing, listening and speaking.","pos":"noun","syn":["skill","competence"],"forms":{"noun":"proficiency","adj":"proficient"}},{"w":"revitalise","def":"to give new life and energy to something that was becoming weaker","ex":"Schools that teach in Welsh have helped to ___ the language.","pos":"verb","syn":["revive"],"forms":{"verb":"revitalise","noun":"revitalisation"}},{"w":"coherent","def":"clear, logical and easy to follow","ex":"A ___ essay moves smoothly and logically from one idea to the next.","pos":"adj","ant":["incoherent","confused"],"forms":{"adj":"coherent","noun":"coherence"}},{"w":"inherent","def":"existing as a natural and permanent part of something","ex":"Some loss of meaning is ___ in translation, however skilled the translator.","pos":"adj","forms":{"adj":"inherent","adv":"inherently"}},{"w":"lingua franca","def":"a shared language used between people whose first languages are different","ex":"English often serves as a ___ at international science conferences.","pos":"phrase"},{"w":"etymology","def":"the origin and history of a word and its meaning","ex":"The ___ of 'breakfast' is simple: the first meal of the day breaks the night's fast.","pos":"noun","forms":{"noun":"etymology","adj":"etymological"}},{"w":"vernacular","def":"the plain, everyday language that ordinary people speak, rather than formal or technical language","ex":"Scientists writing for children must translate technical terms into the ___, using everyday words.","pos":"noun"},{"w":"connotation","def":"a feeling or idea that a word suggests in addition to its basic meaning","ex":"'Cheap' and 'inexpensive' mean almost the same, but 'cheap' can carry a negative ___ of poor quality.","pos":"noun","forms":{"noun":"connotation","verb":"connote"}},{"w":"ambiguous","def":"having more than one possible meaning, so that it is unclear","ex":"The sentence 'I saw her duck' is ___, since 'duck' could be a bird or a quick movement.","pos":"adj","ant":["clear","unambiguous"],"forms":{"adj":"ambiguous","noun":"ambiguity","adv":"ambiguously"}},{"w":"articulate","def":"to pronounce sounds or words clearly and carefully","ex":"Singers are trained to ___ every consonant so that the words can be heard at the back of the hall.","pos":"verb","forms":{"verb":"articulate","noun":"articulation"}},{"w":"colloquial","def":"used in informal conversation rather than in formal speech or writing","ex":"'Gonna' is a ___ form of 'going to' and is best avoided in an essay.","pos":"adj","syn":["informal","conversational"],"ant":["formal"],"forms":{"adj":"colloquial","noun":"colloquialism"}},{"w":"lexicon","def":"all the words of a language, or all the words that one person knows","ex":"The Oxford English Dictionary aims to record the entire ___ of English, from everyday words to rare technical terms.","pos":"noun","syn":["vocabulary"]},{"w":"polyglot","def":"a person who can speak many languages","ex":"The word ___ comes from Greek and means 'many tongues', a fitting name for someone who speaks many languages.","pos":"noun"},{"w":"denote","def":"to be a sign of something, or to mean it","ex":"On most maps, blue lines are used to ___ rivers and streams.","pos":"verb","syn":["represent","indicate"]}],"grammar":[{"q":"Little ___ that his invented word would one day appear in dictionaries.","opts":["did he realise","he realised","he did realise","realised he"],"a":0,"why":"When 'Little' starts the sentence with a negative meaning, use question order: Little did he realise."},{"q":"___ I admire her novels, I find them very hard to translate.","opts":["Much as","As much","Despite","However much as"],"a":0,"why":"'Much as + clause' is a formal way of saying 'Although': Much as I admire them..."},{"q":"___ been for the printing press, English spelling might never have become standardised.","opts":["Had it not","Had not it","Were it not","Did it not"],"a":0,"why":"'Had it not been for X' is the inverted form of 'If it had not been for X' about the past."},{"q":"The two languages are related, ___ only distantly.","opts":["albeit","despite","whereas","even"],"a":0,"why":"'Albeit' means 'although' and can be followed by a short phrase without a verb."},{"q":"___ its many borrowings from French, English has a large number of formal words.","opts":["Owing to","Because","Due","Thanks for"],"a":0,"why":"'Owing to' is followed by a noun phrase to give a cause; 'because' would need 'of'."},{"q":"Such ___ the popularity of the books that they were translated into dozens of languages.","opts":["was","were","did","had"],"a":0,"why":"In 'Such + be + subject + that...', the verb agrees with the singular subject 'the popularity'."},{"q":"___ subtitles, many viewers would be unable to enjoy films in foreign languages.","opts":["But for","Except","Unless","Despite"],"a":0,"why":"'But for + noun' is a formal way of saying 'If it were not for': But for subtitles... 'Unless' and 'Except' do not work here, and 'Despite' makes no sense."},{"q":"Rarely, if ever, ___ a dictionary taken as long to complete as the Oxford English Dictionary.","opts":["has","have","did","was"],"a":0,"why":"After 'Rarely, if ever' at the start, invert: has + singular subject + past participle (taken). 'Did' would need the base form 'take'."},{"q":"___ language a child is born into, they will master its basic grammar within the first few years of life.","opts":["Whatever","However","Whoever","Wherever"],"a":0,"why":"'Whatever + noun' means 'no matter which': whatever language. 'However', 'Whoever' and 'Wherever' cannot come directly before a noun like this."},{"q":"The rules of English spelling are so complex ___ to confuse even many native speakers.","opts":["as","that","so","for"],"a":0,"why":"The pattern is 'so + adjective + as to + verb': so complex as to confuse. 'That' would need a full clause."}],"sentences":["English has assimilated words from almost every language it has encountered.","A skilled translator must capture every nuance of the original text.","Little did he realise that his invented word would become so popular.","English has become the lingua franca of international science.","Rarely, if ever, has a dictionary taken so long to complete.","Many English words carry connotations that learners find hard to grasp."],"reading":[{"title":"Does language shape thought?","text":"Does the language we speak influence the way we think? The question has fascinated thinkers for generations, and few ideas in linguistics have been as hotly contested.\n\nThe best-known version of the claim is associated with the American linguist Benjamin Lee Whorf, who argued in the 1930s that the structure of a language shapes how its speakers perceive the world. Whorf suggested, for instance, that the Hopi language of North America contained no words for time as Europeans understood it, and that its speakers therefore experienced time differently. Later researchers challenged his analysis, showing that Hopi does in fact have many ways of expressing time, and for several decades the whole idea fell out of favour.\n\nRecent studies, however, have revived interest in a more modest form of the theory. Speakers of Guugu Yimithirr, an Aboriginal language of northern Australia, describe locations using compass directions rather than words such as 'left' and 'right'. Instead of saying 'the cup is to your left', they might say 'the cup is to the north'. Remarkably, speakers appear to keep track of their orientation at all times, even in unfamiliar buildings, an ability that seems closely linked to the demands of their language.\n\nColour offers another intriguing example. Russian has two separate basic words for lighter and darker blue, and in laboratory experiments Russian speakers were slightly quicker than English speakers at telling apart shades that fall on either side of that boundary.\n\nCrucially, none of this suggests that language imprisons thought. English speakers can learn to use compass directions, and anyone can see the difference between two shades of blue. What the evidence implies is subtler: the habits of a language may gently steer attention towards certain features of experience, making some distinctions more automatic than others. In that sense, learning a new language may offer not only new words, but also new ways of noticing.","qs":[{"type":"tfng","q":"Whorf's claims about the Hopi language were later shown to be inaccurate.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Guugu Yimithirr is spoken by more people today than it was a century ago.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"In the experiments, Russian speakers could see differences between shades of blue that English speakers were unable to see.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"What does the writer imply about the Guugu Yimithirr speakers' sense of direction?","opts":["It is probably sharpened by the constant need to use compass terms when speaking.","It is something they are born with, whichever language they learn.","It works less well inside unfamiliar buildings than outdoors.","It is less reliable than the sense of direction of English speakers."],"a":0},{"type":"mc","q":"Which statement best expresses the writer's overall position?","opts":["Language may influence what we pay attention to, but it does not limit what we can think.","Language completely determines what its speakers are able to think.","Language has no effect at all on the way people think.","Whorf's original theory has now been fully confirmed."],"a":0}]},{"title":"A language born in a playground","text":"Linguists rarely have the chance to watch a language come into existence. Almost every language in use today developed gradually over thousands of years, long before anyone could record how it began. In Nicaragua in the late 1970s and 1980s, however, researchers were able to observe something close to the birth of a new language.\n\nUntil then, deaf people in Nicaragua had few opportunities to meet one another. Most grew up in hearing families and communicated with relatives through simple gestures of their own invention, known as home signs, which were not shared beyond the household. That changed when new schools for deaf children opened in the capital, Managua, bringing hundreds of pupils together for the first time.\n\nThe teachers concentrated on lip-reading and spoken Spanish, with limited success. Outside the classroom, though, in the playground and on the school buses, the children began combining their different home signs into a shared system of communication. Strikingly, when younger children later joined the schools and learnt this system from the older pupils, they did not simply copy it. They made it faster, more regular and more grammatically complex.\n\nIn 1986, the American linguist Judy Kegl was invited to study the children's signing. She and later researchers, notably Ann Senghas, found clear differences between the generations. Older signers, for instance, tended to describe an event such as something rolling down a hill with a single sign showing the whole movement at once, much as hearing people do when they gesture while speaking. Younger signers were more likely to break the event into separate signs for the manner of the movement and for its direction, and then combine them in sequence, a pattern typical of fully developed languages.\n\nMany linguists regard Nicaraguan Sign Language as powerful evidence that children do not merely absorb a language but actively reshape it. The case does not settle every debate about how much of our capacity for grammar is innate. It does suggest, however, that when young minds have a community to communicate with, they can turn a loose collection of gestures into a structured language within a few generations of learners.","qs":[{"type":"tfng","q":"Before the new schools opened, deaf people across Nicaragua already shared one common sign language.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"The girls and the boys at the schools developed different versions of the signing system.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the passage, how did the younger children change the signing system?","opts":["They made it quicker, more consistent and richer in grammar.","They replaced it with the spoken Spanish taught in class.","They copied it exactly as the older pupils used it.","They returned to the home signs used by their own families."],"a":0},{"type":"mc","q":"What can be inferred from the comparison with hearing people's gestures?","opts":["The older signers' descriptions were closer to everyday gesture than to a fully developed language.","Hearing people in Nicaragua had learnt to sign from the deaf pupils.","The younger signers could not describe movement at all.","Gestures made while speaking are more complex than any sign language."],"a":0},{"type":"mc","q":"Which statement best expresses the main idea of the passage?","opts":["A new language arose when deaf children were brought together, and each new group of learners made it more structured.","Lip-reading is the most effective way to teach deaf children.","Nicaraguan Sign Language has existed for thousands of years.","Linguists have proved exactly how much of grammar is innate."],"a":0}]}],"extra":[{"kind":"collocation","q":"The theory remains ___ contested among linguists.","opts":["hotly","warmly","burningly","boilingly"],"a":0,"why":"'Hotly contested' (or 'hotly debated') is a fixed collocation meaning argued about strongly."},{"kind":"paraphrase","q":"Which is the closest paraphrase of: 'Language may gently steer attention towards certain features of experience.'?","opts":["The language we speak may make us more likely to notice some things.","Language forces us to ignore most of what we experience.","Our experiences decide which language we will speak.","People who pay close attention learn languages more quickly."],"a":0,"why":"'Steer attention towards' means guide what we notice, and 'may gently' keeps the claim cautious."},{"kind":"register","q":"Which is the most appropriate way to begin the conclusion of an academic essay?","opts":["In conclusion, the evidence indicates that language influences, but does not determine, thought.","So yeah, language kind of changes how we think.","To wrap things up, I totally think language matters.","Anyway, that's basically it about language and thought."],"a":0,"why":"A formal conclusion is impersonal and precise; 'so yeah', 'wrap things up' and 'basically' are conversational."},{"kind":"cohesion","q":"Which sentence best fills the gap? 'Whorf claimed that Hopi had no words for time. ___ As a result, the theory fell out of favour for decades.'","opts":["Later research, however, showed that Hopi has many ways of expressing time.","Hopi is one of many languages spoken in North America.","Similarly, many other languages have words for time.","This claim was therefore accepted by every linguist."],"a":0,"why":"Only the disproof of Whorf's claim explains why the theory 'fell out of favour' in the next sentence."},{"kind":"wordform","q":"Many English words are ___ (etymology) related to Latin.","opts":["etymologically","etymological","etymology","etymologist"],"a":0,"why":"We need an adverb to describe the adjective 'related': etymologically related."},{"kind":"idiom","q":"Jokes are hard to translate because humour often gets ___ in translation.","opts":["lost","missed","dropped","forgotten"],"a":0,"why":"The idiom is 'lost in translation': meaning or effect that disappears when words change language."},{"kind":"linking","q":"The island's valleys are deep and steep; ___, whistling a message was often far quicker than walking to deliver it.","opts":["hence","whereas","albeit","nonetheless"],"a":0,"why":"Quicker whistling is the result of the steep valleys, so we need a cause-and-effect link: hence. The others show contrast or concession."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'Some words cross borders more easily than others. Terms for new technology, food and sport are often borrowed directly, so that words like football or sushi sound similar in dozens of languages. Words for basic ideas, such as numbers, body parts and family members, resist borrowing and can remain stable for thousands of years.'","opts":["Which kinds of words are most likely to be borrowed","The international history of football","Why numbers are difficult to learn","How new technology is invented"],"a":0,"why":"The paragraph contrasts words that are easily borrowed with words that resist borrowing; the other headings pick out single examples."},{"kind":"collocation","q":"A year spent abroad can ___ a lifelong interest in other cultures.","opts":["kindle","light up","burn","fire off"],"a":0,"why":"To 'kindle an interest' means to start it, like lighting a small fire. 'Light up', 'burn' and 'fire off' do not combine with 'interest'."},{"kind":"paraphrase","q":"Which is the closest paraphrase of: 'Each one transposes an ordinary spoken language into whistles.'?","opts":["Each turns an existing spoken language into a whistled form.","Each is a completely new language made only of whistles.","Each can be understood by speakers of any language.","Each replaces whistling with ordinary speech."],"a":0,"why":"'Transposes into' means changes into another form, and 'an ordinary spoken language' means one that already exists."}],"writing":[{"kind":"paragraph","sents":["The revival of Welsh shows that a declining language can be brought back into everyday use.","During the twentieth century, the proportion of Welsh speakers fell steadily as English dominated work, the media and education.","From the 1960s onwards, however, campaigners won greater recognition for the language, and Welsh-medium schools expanded.","These schools have produced a generation of young people who can speak Welsh with confidence.","The Welsh experience suggests that education plays a central role in the survival of a language."]},{"kind":"paragraph","sents":["English owes much of its enormous vocabulary to borrowing from other languages.","After 1066, for example, thousands of French words entered English, particularly in areas such as law, food and government.","Later, the Renaissance brought a wave of Latin and Greek terms into scholarly writing.","As a result of these layers, English often has several words for a single idea, such as 'kingly', 'royal' and 'regal'.","This richness allows writers to make fine distinctions of tone and register."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Lots of languages are kind of disappearing these days.'?","opts":["A significant proportion of the world's languages are at risk of falling out of use within the coming decades.","Loads of languages are disappearing nowadays.","Every language except English will vanish by next year.","Languages are things that come and go, sort of."],"a":0,"why":"The first is precise and measured ('a significant proportion', 'at risk of'). The others are informal ('loads', 'sort of'), absurdly overclaimed, or vague."},{"kind":"topic","q":"Which topic sentence fits best? '___ Speakers of some Australian languages, for example, describe positions using compass directions rather than words for left and right. Similarly, Russian has two separate basic words for lighter and darker shades of blue.'","opts":["Languages differ in the distinctions that they require their speakers to make.","Australia is home to a great many indigenous languages.","Blue is one of the most popular colours in the world.","Languages are very different and quite interesting."],"a":0,"why":"Both examples show a language making speakers mark a particular distinction. The others focus on a side detail or are too vague for academic writing."},{"kind":"thesis","q":"Some people argue that the spread of English as a global language is a positive development, while others believe it threatens local cultures. Discuss both views and give your own opinion. Which is the clearest thesis statement?","opts":["Although a shared global language undeniably facilitates trade and research, I would argue that its benefits can be kept without sacrificing local languages, provided these are actively supported in schools.","English is spoken as a first or second language in many countries.","English is the best language and everyone should just use it.","There are many arguments on both sides, and it is a very complex issue."],"a":0,"why":"The first weighs both views and gives a clear, conditional opinion. The others state a fact, give an informal and one-sided claim, or avoid taking a position."}]},{"id":"band8-2","title":"Cities and change","emoji":"🏙️","words":[{"w":"exacerbate","def":"to make a problem or a bad situation worse","ex":"Cutting down street trees can ___ the heat in city centres during summer.","pos":"verb","syn":["worsen"],"ant":["ease","relieve"],"forms":{"verb":"exacerbate","noun":"exacerbation"}},{"w":"mitigate","def":"to make something harmful or unpleasant less severe","ex":"Green roofs help to ___ flooding by soaking up rainwater.","pos":"verb","syn":["reduce","ease"],"ant":["worsen"],"forms":{"verb":"mitigate","noun":"mitigation"}},{"w":"gridlock","def":"a situation in which traffic is so heavy that it cannot move at all","ex":"When the bridge closed, the city centre was brought to a standstill by hours of ___.","pos":"noun"},{"w":"regeneration","def":"the process of improving a run-down area so that it becomes busy and attractive again","ex":"The ___ of the old docks turned empty warehouses into homes, offices and museums.","pos":"noun","forms":{"noun":"regeneration","verb":"regenerate"}},{"w":"metropolis","def":"a very large, important and busy city","ex":"Within a few decades, the small fishing town had grown into a bustling ___ of millions.","pos":"noun","forms":{"noun":"metropolis","adj":"metropolitan"}},{"w":"densely","def":"with a lot of people or things packed closely together","ex":"Hong Kong is one of the most ___ populated places on Earth.","pos":"adv","ant":["sparsely"],"forms":{"adv":"densely","adj":"dense","noun":"density"}},{"w":"sprawl","def":"the spread of a city into the countryside around it, often without careful planning","ex":"Urban ___ has swallowed farmland on the edges of many fast-growing cities.","pos":"noun"},{"w":"unprecedented","def":"never having happened or existed before","ex":"The twentieth century saw cities grow at an ___ rate.","pos":"adj","syn":["unparalleled"]},{"w":"pedestrianise","def":"to close a street to traffic so that only people on foot can use it","ex":"The council plans to ___ the high street, so cars will no longer be allowed there.","pos":"verb","forms":{"verb":"pedestrianise","noun":"pedestrianisation"}},{"w":"resilient","def":"able to recover quickly after something difficult or damaging happens","ex":"A ___ city can recover quickly after floods, storms or power cuts.","pos":"adj","syn":["tough"],"forms":{"adj":"resilient","noun":"resilience"}},{"w":"amenity","def":"a useful or pleasant place or service, such as a park, a library or a pool","ex":"The new library is an ___ that the whole neighbourhood can enjoy.","pos":"noun"},{"w":"dilapidated","def":"old, broken and in very poor condition","ex":"The ___ factory, with its broken windows and rotting roof, was finally restored.","pos":"adj","syn":["crumbling"]},{"w":"commuter belt","def":"the area around a large city where many people who work in the city live","ex":"House prices in the ___ around London have risen as more workers move out of the capital.","pos":"phrase"},{"w":"retrofit","def":"to add new parts or equipment to an older building or machine","ex":"Engineers are able to ___ old buses with electric motors, so they no longer need diesel.","pos":"verb"},{"w":"thoroughfare","def":"a main road through a town or city that many people and vehicles use","ex":"Once a busy ___ full of lorries, the street is now a quiet avenue lined with trees.","pos":"noun"},{"w":"municipal","def":"belonging to, or run by, the local government of a town or city","ex":"The ___ swimming pool is run by the city council and costs very little to use.","pos":"adj"},{"w":"repurpose","def":"to change something so that it can be used for a different purpose","ex":"Instead of knocking down the old power station, architects chose to ___ it as an art gallery.","pos":"verb","syn":["adapt"]},{"w":"permeable","def":"allowing liquids, such as rainwater, to pass through","ex":"Paving made from ___ materials lets rainwater soak into the ground instead of flooding the street.","pos":"adj","ant":["impermeable","waterproof"]},{"w":"footfall","def":"the number of people who visit a shop, street or area during a period of time","ex":"After the street was closed to cars, ___ rose and many shops reported higher sales.","pos":"noun"},{"w":"encroach","def":"to spread gradually into an area that belongs to something or someone else","ex":"As the city expanded, new housing began to ___ on the surrounding farmland.","pos":"verb","forms":{"verb":"encroach","noun":"encroachment"}}],"grammar":[{"q":"Not until the Underground opened in 1863 ___ travel quickly beneath London's streets.","opts":["could Londoners","Londoners could","Londoners can","can Londoners"],"a":0,"why":"After 'Not until + time' at the start, the main clause is inverted, and the past needs 'could'."},{"q":"The city introduced a scheme ___ residents can hire bicycles cheaply from docking stations.","opts":["whereby","whereas","wherever","which"],"a":0,"why":"'Whereby' means 'by which' or 'under which': a scheme whereby residents can hire bicycles."},{"q":"The council planted thousands of trees, ___ lowering summer temperatures in the streets.","opts":["thereby","whereby","whereas","so that"],"a":0,"why":"'Thereby + -ing' shows the result of the action just described: planted trees, thereby lowering temperatures."},{"q":"___ the high cost, most residents supported the new bridge.","opts":["Notwithstanding","Although","Even though","Whereas"],"a":0,"why":"'Notwithstanding' is a formal preposition meaning 'despite', so it can be followed by a noun phrase."},{"q":"Were the city ___ more cycle lanes, fewer people would drive to work.","opts":["to build","build","building","built"],"a":0,"why":"'Were + subject + to + verb' is a formal inverted way of saying 'If the city built...'."},{"q":"By 2050, roughly two thirds of the world's people ___ in cities.","opts":["are expected to be living","are expecting to be lived","are expected living","have expected to live"],"a":0,"why":"Use the passive reporting verb with a continuous infinitive for a predicted situation: are expected to be living."},{"q":"It was only when the river flooded the city centre ___ the council took the problem seriously.","opts":["that","which","what","so"],"a":0,"why":"The cleft pattern is 'It was only when + clause + that...'; it stresses the moment something finally happened."},{"q":"Only once the new metro line had opened ___ traffic in the centre begin to ease.","opts":["did","had","was","does"],"a":0,"why":"After 'Only once + clause' at the start, invert the main clause; with the base form 'begin' in the past we need 'did'."},{"q":"The old market hall is currently ___ into a library and community centre.","opts":["being converted","been converted","converting","to be converted"],"a":0,"why":"For a passive action in progress now, use 'is being + past participle': is currently being converted."},{"q":"There is growing evidence ___ green spaces improve the well-being of city residents.","opts":["that","which","what","of"],"a":0,"why":"'Evidence that + clause' explains what the evidence shows. 'Of' would need a noun or '-ing', and 'which' and 'what' do not fit."}],"sentences":["Green roofs help to mitigate flooding by soaking up rainwater.","The regeneration of the old docks created thousands of new homes.","Hong Kong is one of the most densely populated places on Earth.","Cutting down street trees can exacerbate the summer heat.","The council plans to retrofit its tower blocks with solar panels.","Architects chose to repurpose the power station as an art gallery."],"reading":[{"title":"A stream beneath the motorway","text":"For much of the late twentieth century, the Cheonggyecheon stream in central Seoul was invisible. It had been covered with concrete in the 1950s and 1960s, and an elevated motorway was later built above it, carrying vast numbers of vehicles through the heart of the South Korean capital.\n\nIn 2003, the city authorities took the unprecedented step of demolishing the motorway and uncovering the stream. Critics predicted that removing such a major road would exacerbate traffic problems and bring the centre to a standstill. In the event, the anticipated gridlock never materialised, partly because the project coincided with a major reorganisation of the city's bus network, which encouraged many commuters to leave their cars at home.\n\nWhen the restored stream opened in 2005, its success with the public was immediate. The banks, lined with walkways, bridges and planting, attracted large numbers of visitors, and the area quickly became one of the city's most popular amenities. Studies also indicated that temperatures along the stream on hot days were several degrees lower than on nearby roads, suggesting that urban waterways can help to mitigate the heat that builds up in dense city centres.\n\nNevertheless, the project has not escaped criticism. Since the original stream had largely dried up, much of the water that flows through it today has to be pumped in from the Han River and from underground sources, at considerable ongoing cost. Some ecologists argue that the result resembles a long, landscaped fountain more than a genuine natural habitat, while others point out that the design gave priority to appearance rather than to the needs of wildlife.\n\nEven so, Cheonggyecheon has inspired planners around the world. Its significance lies less in its precise design than in the question it raised: if a city can live without a motorway that once seemed essential, what other assumptions about urban life might be open to change?","qs":[{"type":"tfng","q":"Building the new stream cost less than building the original motorway had done.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"Most of the water in today's stream reaches it naturally from the stream's original source.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"According to the passage, why did the predicted traffic problems not happen?","opts":["Changes to public transport at the same time persuaded many people not to drive.","Most drivers chose to move out of the city centre.","A new motorway was built alongside the stream.","The stream was used as a route for boats instead of cars."],"a":0},{"type":"mc","q":"What can be inferred about the ecologists mentioned in the fourth paragraph?","opts":["They doubt that the stream has real value as a home for wildlife.","They want the stream to be covered with concrete again.","They believe the water should come only from underground.","They were responsible for designing the walkways and bridges."],"a":0},{"type":"mc","q":"What is the writer's main purpose in the final paragraph?","opts":["to suggest that the project's wider importance lies in challenging fixed ideas about cities","to recommend that every city should demolish its motorways","to describe the exact design of the stream in detail","to argue that the critics of the project were completely wrong"],"a":0}]},{"title":"The Great Stink","text":"In the hot summer of 1858, the River Thames in London smelt so foul that the period became known as the Great Stink. For decades, the city's waste had flowed more or less directly into the river, and as London's population soared, the problem had grown steadily worse. With the stench drifting into the Houses of Parliament, where curtains were soaked in chemicals in an attempt to mask it, politicians who had long delayed action suddenly found the matter impossible to ignore.\n\nWithin weeks, funding was approved for an ambitious scheme designed by Joseph Bazalgette, chief engineer of the city's Metropolitan Board of Works. His plan was to intercept waste before it reached the central stretch of the river and carry it eastwards, beyond the city, through a network of large brick tunnels. Construction occupied much of the following two decades and required some 130 kilometres of main sewers, linked to roughly 1,800 kilometres of smaller street sewers. Along parts of the river, the tunnels were hidden inside newly built embankments, which also created roads and riverside gardens.\n\nBazalgette is often praised for his foresight. Having calculated the pipe sizes the city required, he reportedly doubled them to allow for future growth, a decision that helped the system cope with a population far larger than he could have imagined.\n\nIronically, the scheme was largely motivated by a mistaken belief that disease spread through bad air. In fact, many illnesses were carried by dirty water. By keeping waste away from the drinking water supply, the new sewers nevertheless brought dramatic improvements in public health.\n\nEven so, no design lasts for ever. By the early twenty-first century, heavy rain regularly overwhelmed the Victorian system, sending overflow into the Thames. A new 25-kilometre 'super sewer' beneath the river, completed in the mid-2020s, was built to tackle the problem, a reminder that the hidden structures beneath a city must evolve as the city above them does.","qs":[{"type":"tfng","q":"Once the smell reached Parliament, the authorities acted on the problem without much further delay.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Bazalgette's design was chosen in a competition between several engineers.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What does the writer find ironic about the scheme?","opts":["It improved health for a reason that its planners had not understood.","It made the smell of the river worse instead of better.","It was paid for by the politicians who had opposed it.","It was finished long before anyone needed it."],"a":0},{"type":"mc","q":"What can be inferred about Bazalgette's decision to double the pipe sizes?","opts":["It kept the system useful for far longer than it might otherwise have been.","It made the project too expensive to finish.","It was criticised as a waste of money by later engineers.","It caused the overflows that happen during heavy rain today."],"a":0},{"type":"mc","q":"What is the main point of the final paragraph?","opts":["Even a highly successful system must eventually be updated as a city changes.","The Victorian sewers were badly designed from the start.","Heavy rain in London is more common than it was in the past.","The new tunnel will be the last one London ever needs."],"a":0}]}],"extra":[{"kind":"collocation","q":"The plan to close the main road ___ fierce opposition from local drivers.","opts":["met with","came across","got into","fell over"],"a":0,"why":"We say a plan 'meets with opposition' (or criticism, approval); the other verbs do not combine with 'opposition'."},{"kind":"linking","q":"Car use in the centre fell sharply; ___, air quality improved.","opts":["consequently","nonetheless","conversely","in contrast"],"a":0,"why":"Better air is the result of less car use, so we need a cause-and-effect link: consequently."},{"kind":"paraphrase","q":"Which sentence means the same as: 'The anticipated gridlock never materialised.'?","opts":["The traffic jams that people expected did not happen.","The traffic jams happened earlier than expected.","Nobody had expected any traffic problems.","The traffic jams were even worse than people had feared."],"a":0,"why":"'Anticipated' means expected, and 'never materialised' means it did not actually happen."},{"kind":"register","q":"Which sentence is most suitable for an IELTS Writing Task 1 report?","opts":["The proportion of residents commuting by bus rose steadily between 2000 and 2020.","Loads more people started taking the bus, which is great.","Bus use went up a lot, as you can see.","Basically, buses got way more popular over time."],"a":0,"why":"A Task 1 report describes data precisely and neutrally, without opinions ('great') or chatty words ('loads', 'basically')."},{"kind":"cohesion","q":"Which order is most logical? A: As a result, a plan was made to clean it and bring wildlife back. B: The river had been polluted for decades. C: Within ten years, otters had returned to its banks.","opts":["B, A, C","A, B, C","C, B, A","B, C, A"],"a":0,"why":"B gives the problem, A ('As a result') the response, and C ('Within ten years') the outcome."},{"kind":"wordform","q":"Many residents were ___ (sceptic) about the plan at first.","opts":["sceptical","scepticism","sceptic","sceptically"],"a":0,"why":"After 'were' and before 'about' we need an adjective: sceptical (British spelling)."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'In a number of cities, old railway lines that no longer carry trains have been turned into raised parks. The Promenade Plantée in Paris, opened in 1993, was one of the first, and New York's High Line later followed its example. Such projects give residents green space without the need to knock down any buildings.'","opts":["New life for disused railways","The history of the Paris metro","Why trains are faster than cars","How a railway bridge is built"],"a":0,"why":"The paragraph describes old railway lines being turned into parks and the benefit this brings."},{"kind":"collocation","q":"Planners must ___ a balance between building new homes and protecting green space.","opts":["strike","hit","beat","knock"],"a":0,"why":"'Strike a balance' is a fixed phrase meaning to find a fair middle point between two needs."},{"kind":"linking","q":"___ its high cost, the new tram line has proved hugely popular with residents.","opts":["For all","Because of","Thanks to","As well as"],"a":0,"why":"'For all + noun' is a formal way of saying 'despite'. A high cost does not cause popularity, so 'because of' and 'thanks to' do not fit."},{"kind":"wordform","q":"The city's population has grown ___ (exponent) over the past fifty years.","opts":["exponentially","exponential","exponent","exponents"],"a":0,"why":"We need an adverb to describe how it has grown: exponentially, meaning faster and faster."}],"writing":[{"kind":"paragraph","sents":["Green roofs offer cities a practical means of adapting to more extreme weather.","When rooftops are covered with soil and plants, buildings can absorb a substantial share of the rain that falls on them.","This reduces the volume of water rushing into drains during storms, lowering the risk of flash floods.","In addition, the plants cool the surrounding air as water evaporates from their leaves, mitigating the heat that builds up in dense centres.","Given these combined benefits, several cities now require green roofs on certain new buildings."]},{"kind":"paragraph","sents":["Closing city-centre roads to cars often fails to cause the chaos that critics predict.","When a road is removed, some drivers switch to public transport, while others change the time or route of their journeys.","This phenomenon, known as 'traffic evaporation', means that much of the expected congestion never appears.","Seoul's decision to demolish a motorway and restore the Cheonggyecheon stream is a well-known example of traffic evaporation.","Such cases suggest that planners could be bolder in reclaiming street space from vehicles."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Cities are getting way bigger and it's causing loads of problems.'?","opts":["Rapid urban growth is placing increasing pressure on housing, transport and public services.","Cities are growing a lot, and that causes problems.","Cities are getting bigger, which is a nightmare, to be honest.","Because of growth, every city in the world has completely stopped working."],"a":0,"why":"The first names the process ('rapid urban growth') and the specific effects. The others remain vague, sound conversational, or exaggerate absurdly."},{"kind":"topic","q":"Which topic sentence fits best? '___ Abandoned warehouses can become flats, offices or galleries, and disused railway lines can be turned into parks. Reusing existing structures in this way also avoids much of the waste and pollution produced by demolition.'","opts":["Converting old buildings is often a more sustainable alternative to knocking them down.","Most warehouses were built during the Industrial Revolution.","Parks are pleasant places to walk in at weekends.","Old buildings are a thing that every city has."],"a":0,"why":"The body gives examples of reuse and an environmental benefit, which the first sentence introduces. The others are off topic or too vague."},{"kind":"thesis","q":"In many cities, governments are encouraging people to live in high-rise apartment blocks rather than in houses. Do the advantages of this outweigh the disadvantages? Which is the clearest thesis statement?","opts":["In my view, the advantages outweigh the drawbacks, since well-designed high-rise housing uses land efficiently and supports public transport, provided that green space is protected.","High-rise blocks are tall buildings with many floors.","Living in a tower block is awful, end of story.","There are advantages and disadvantages, and people have different opinions."],"a":0,"why":"The first answers 'do the advantages outweigh...' directly, with reasons and a condition. The others define, give an informal unsupported view, or take no position."}]},{"id":"band8-3","title":"Exploring space","emoji":"🚀","words":[{"w":"trajectory","def":"the curved path that a moving object follows through the air or through space","ex":"Engineers calculated the probe's ___ so that it would swing past Jupiter and gain speed.","pos":"noun","syn":["path","course"]},{"w":"propulsion","def":"the force that pushes a vehicle forward, or the system that produces this force","ex":"Ion ___ pushes a spacecraft forward very gently, but for months or even years.","pos":"noun","forms":{"noun":"propulsion","verb":"propel"}},{"w":"celestial","def":"relating to the sky or to outer space","ex":"Ancient sailors found their way by observing the Sun, the Moon and other ___ bodies.","pos":"adj","syn":["heavenly"]},{"w":"habitable","def":"suitable or good enough for people or other living things to live in","ex":"Astronomers are searching for ___ planets where liquid water could exist on the surface.","pos":"adj","ant":["uninhabitable"]},{"w":"speculate","def":"to form ideas or guesses about something without having firm evidence","ex":"Scientists can only ___ about what might lie beneath the thick ice of Europa.","pos":"verb","syn":["guess","wonder"],"forms":{"verb":"speculate","noun":"speculation","adj":"speculative"}},{"w":"anomaly","def":"something that is different from what is normal or expected","ex":"A strange ___ in the data turned out to be caused by a faulty instrument.","pos":"noun","syn":["irregularity"],"forms":{"noun":"anomaly","adj":"anomalous"}},{"w":"pristine","def":"in perfect condition, as clean and untouched as when new","ex":"Samples kept in a ___ state, untouched by Earth's air, are far more valuable to scientists.","pos":"adj","syn":["untouched","spotless"]},{"w":"payload","def":"the cargo, such as a satellite or supplies, that a rocket or spacecraft carries","ex":"The rocket's ___ was a weather satellite that will help forecasters predict storms.","pos":"noun","syn":["cargo"]},{"w":"rudimentary","def":"very basic and simple, often an early form of something","ex":"The earliest space probes carried ___ cameras compared with today's instruments.","pos":"adj","syn":["basic","primitive"],"ant":["advanced"]},{"w":"feasible","def":"possible and practical to do","ex":"Reusable rockets have made frequent launches financially ___.","pos":"adj","syn":["practical","possible"],"ant":["impractical"],"forms":{"adj":"feasible","noun":"feasibility"}},{"w":"debris","def":"broken pieces of something that has been destroyed or thrown away","ex":"Space ___, such as old satellite parts, can damage working spacecraft.","pos":"noun"},{"w":"deploy","def":"to move something into position or open it out so that it is ready to use","ex":"Once in space, the telescope had to ___ its huge sunshield.","pos":"verb","forms":{"verb":"deploy","noun":"deployment"}},{"w":"cosmonaut","def":"an astronaut from the Soviet Union or Russia","ex":"Yuri Gagarin, a Soviet ___, became the first person to travel into space in 1961.","pos":"noun","syn":["astronaut"]},{"w":"luminous","def":"giving out light, or shining brightly, especially in the dark","ex":"Through the telescope, the comet appeared as a ___ smudge with a long, faint tail.","pos":"adj","syn":["glowing","bright"],"ant":["dim"]},{"w":"inhospitable","def":"very difficult to live or survive in because the conditions are so harsh","ex":"With its crushing pressure and a surface hot enough to melt lead, Venus is extremely ___.","pos":"adj","ant":["hospitable","welcoming"]},{"w":"rendezvous","def":"a planned meeting, especially of two spacecraft in space","ex":"After two days in orbit, the capsule made a successful ___ with the space station.","pos":"noun"},{"w":"microgravity","def":"the condition of near weightlessness that astronauts experience in orbit","ex":"In ___, astronauts' muscles weaken, so they must exercise for about two hours a day.","pos":"noun"},{"w":"terrain","def":"land of a particular kind, described by what its surface is like","ex":"The rover was designed to climb over steep, uneven ___ such as the walls of craters.","pos":"noun","syn":["ground","landscape"]},{"w":"elliptical","def":"shaped like a flattened circle; oval","ex":"Comets follow long, ___ orbits that carry them close to the Sun and then far out again.","pos":"adj","syn":["oval"],"forms":{"adj":"elliptical","noun":"ellipse"}},{"w":"jettison","def":"to throw away something that is no longer needed, especially from a vehicle that is moving","ex":"Once their fuel is used up, rockets ___ their empty stages, which fall back towards Earth.","pos":"verb","syn":["discard","dump"]}],"grammar":[{"q":"No sooner ___ the rocket cleared the tower than the crowd began to cheer.","opts":["had","has","did","was"],"a":0,"why":"'No sooner had + subject + past participle... than' shows that one past event followed the other at once."},{"q":"Only by landing probes on Venus ___ its surface up close.","opts":["have scientists seen","scientists have seen","scientists saw","did scientists saw"],"a":0,"why":"When 'Only by + -ing' starts the sentence, the main clause uses question order: have scientists seen."},{"q":"The launch was postponed ___ a fault in the fuel system.","opts":["on account of","because","owing","so as"],"a":0,"why":"'On account of' is followed by a noun phrase to give the cause; 'because' would need 'of'."},{"q":"Had the crew not trained so thoroughly, they ___ the emergency so calmly.","opts":["could not have handled","could not handle","cannot have handled","will not have handled"],"a":0,"why":"'Had... not' is an inverted past conditional, so the result needs 'could not have + past participle'."},{"q":"___ fascinating it may be, Venus is far too hot for any human visit.","opts":["However","Although","Despite","Whatever"],"a":0,"why":"'However + adjective + subject + may be' shows concession: no matter how fascinating it is."},{"q":"The telescope, ___ sunshield is about the size of a tennis court, had to be folded to fit inside the rocket.","opts":["whose","which","its","that's"],"a":0,"why":"'Whose' shows possession in a relative clause: the telescope's sunshield."},{"q":"At no point ___ the astronauts in any real danger during the spacewalk.","opts":["were","was","did","had"],"a":0,"why":"'At no point' is negative, so the verb comes before the subject; the plural 'astronauts' needs 'were'."},{"q":"___ through space for more than forty years, Voyager 1 is now the most distant human-made object.","opts":["Having travelled","Travelled","To travel","Having been travelled"],"a":0,"why":"Voyager has done the travelling (active, over a long earlier period), so use 'Having + past participle'. 'Travel' has no passive."},{"q":"___ a crew ever reach Mars, they will need to grow much of their own food.","opts":["Should","Would","Had","Were"],"a":0,"why":"'Should + subject + base form' is a formal way to say 'If...ever': Should a crew reach. 'Were' would need 'to reach'."},{"q":"___ that sunlight takes about eight minutes to reach us, we always see the Sun as it was slightly in the past.","opts":["Given","Giving","Despite","Although"],"a":0,"why":"'Given that + clause' means 'because we know that'. 'Despite' needs a noun, and 'Although that' is not possible."}],"sentences":["No sooner had the rocket cleared the tower than the crowd cheered.","Astronomers are searching for habitable planets beyond our solar system.","Space debris poses a growing threat to working satellites.","Reusable rockets have made frequent launches financially feasible.","Rockets jettison empty stages once their fuel is used up.","At no point were the astronauts in any real danger."],"reading":[{"title":"Time capsules from the asteroids","text":"Meteorites have been falling to Earth for billions of years, and scientists have long studied them for clues about the early solar system. Yet these natural visitors have a serious drawback: by the time they are found, they have been heated while passing through the atmosphere and have often lain on the ground for years, absorbing water and microbes. Distinguishing what they originally contained from what they have picked up on Earth is notoriously difficult.\n\nTo obtain more reliable material, space agencies have attempted something far more ambitious: collecting rock and dust directly from asteroids and bringing it home. Japan's Hayabusa2 mission returned samples from the asteroid Ryugu in 2020, and NASA's OSIRIS-REx spacecraft delivered material from the asteroid Bennu in 2023. In both cases, the samples were sealed inside capsules, protected during their fiery descent and opened only in specially designed clean rooms.\n\nThe reason for such precautions is that asteroids like Ryugu and Bennu are thought to have changed relatively little since the solar system formed around four and a half billion years ago. They therefore act as time capsules, preserving the raw ingredients from which the planets were assembled. Analyses of both samples have revealed water-bearing minerals and a variety of carbon-based molecules, includin

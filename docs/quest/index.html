g some of the amino acids that living things use to build proteins.\n\nThese findings do not mean that life existed on the asteroids. They do, however, lend weight to the idea that some of the building blocks of life may have been delivered to the early Earth from space. Equally importantly, because the material has never been exposed to Earth's environment, researchers can be considerably more confident that what they detect was genuinely present in space.\n\nPerhaps the most far-sighted decision was to set aside a large part of the material, untouched, for future generations. Scientists recognise that instruments not yet invented may one day answer questions that nobody has yet thought to ask.","qs":[{"type":"tfng","q":"Meteorites can be altered by conditions on Earth after they land.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"The Bennu samples contained a greater number of amino acids than the Ryugu samples.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"The writer states that the samples prove life once existed on the asteroids.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"Why were the samples most likely opened only in special clean rooms?","opts":["to avoid mixing material from Earth with material from space","to protect scientists from dangerous chemicals","to keep the samples at a very high temperature","to allow members of the public to watch"],"a":0},{"type":"mc","q":"Why does the writer mention instruments 'not yet invented'?","opts":["to explain why some of the material has deliberately been left unstudied","to criticise the quality of the equipment used today","to suggest that the missions were launched too early","to warn that the samples will soon be used up"],"a":0}]},{"title":"One twin in orbit","text":"Sending people on long journeys to Mars will require a detailed understanding of how the human body copes with months in space. One of the most unusual experiments in this field took advantage of a rare opportunity. In 2015, the American astronaut Scott Kelly began a stay of almost a year aboard the International Space Station, while his identical twin brother, Mark, also a former astronaut, remained on Earth. Because the brothers share the same genes, scientists could compare them to see which changes might be caused by spaceflight itself.\n\nTen research teams examined everything from the brothers' blood and gut bacteria to their thinking skills. Some of the findings were striking. In microgravity, body fluids shift towards the head, and Scott showed changes in his eyes and in the walls of a major artery in his neck. The caps at the ends of his chromosomes, known as telomeres, which normally shorten with age, unexpectedly grew longer during the mission, only to shorten rapidly once he returned. Many of his genes also changed their level of activity.\n\nReassuringly, most of these changes faded within months of his return to Earth. His immune system responded normally to a flu vaccine given in space, and the bacteria in his gut, which had altered during the flight, returned to something close to their earlier state. However, a small proportion of the changes in gene activity persisted for at least six months, and his performance in some mental tests declined slightly after landing.\n\nThe researchers were careful not to overstate their conclusions. A study of a single pair of people cannot show which effects would appear in every astronaut, and some differences between the twins may have had other causes. Nevertheless, the project provided a valuable starting point, identifying areas that deserve closer study before crews undertake the far longer voyages that a mission to Mars would involve.","qs":[{"type":"tfng","q":"Mark Kelly had never travelled into space himself.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Scott Kelly was selected for the mission because he had a twin brother.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What happened to Scott Kelly's telomeres?","opts":["Contrary to expectations, they lengthened in space but quickly shortened after he came back.","They shortened in space and then grew back to their normal length on Earth.","They stayed exactly the same throughout the study.","They grew longer in space and remained longer for years afterwards."],"a":0},{"type":"mc","q":"Why was it useful that the brothers were identical twins?","opts":["Any differences between them were unlikely to be caused by their genes.","They could both live on the space station at the same time.","Identical twins are known to cope better with spaceflight.","It meant that the study could include many more people."],"a":0},{"type":"mc","q":"What is the main purpose of the final paragraph?","opts":["to point out the limits of the study while recognising its value","to argue that the study proved spaceflight is safe for everyone","to suggest that a mission to Mars should be cancelled","to describe the next experiment that the twins will take part in"],"a":0}]}],"extra":[{"kind":"collocation","q":"The new findings ___ weight to the idea that some of life's ingredients came from space.","opts":["lend","borrow","put","throw"],"a":0,"why":"'Lend weight to an idea' is a fixed phrase meaning to make it seem more likely to be true."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Distinguishing what they originally contained from what they have picked up on Earth is notoriously difficult.'?","opts":["It is famously hard to tell which substances came from space and which were added on Earth.","Scientists can easily separate material from space and material from Earth.","Meteorites pick up very little material after they land on Earth.","It is extremely difficult to find meteorites once they have landed."],"a":0,"why":"'Distinguishing X from Y' means telling them apart, and 'notoriously' means well known for being so."},{"kind":"register","q":"Which sentence is most appropriate in a scientific report?","opts":["The samples were stored in a nitrogen-filled cabinet to prevent contamination.","We stuck the samples in a box so nothing got on them.","The samples went into a cabinet, which was pretty cool.","To keep them clean, the samples were, like, put away safely."],"a":0,"why":"Scientific reports use the passive, precise terms (nitrogen-filled, contamination) and no chatty words."},{"kind":"linking","q":"The capsule remained sealed throughout the journey; ___, the samples were never exposed to Earth's air.","opts":["as a result","in spite of this","by contrast","even so"],"a":0,"why":"Never being exposed is the result of the sealing, so we need a cause-and-effect link: as a result."},{"kind":"cohesion","q":"Which sentence best fills the gap? 'Meteorites are valuable to scientists. ___ This is why sample-return missions are so important.'","opts":["However, they are often changed by Earth's conditions before they are found.","Furthermore, they are completely free from contamination.","For example, they have been falling for billions of years.","Therefore, no further space missions are needed."],"a":0,"why":"Only the limitation of meteorites explains why missions that collect clean samples matter."},{"kind":"wordform","q":"Asteroids preserve material that has remained largely ___ (change) for billions of years.","opts":["unchanged","changing","changeable","unchangeable"],"a":0,"why":"We need an adjective meaning 'not changed': unchanged. 'Unchangeable' means it cannot be changed."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'On the International Space Station, water is far too precious to waste. Moisture from the crew's breath and sweat is collected from the air, and even urine is filtered and purified. As a result, almost all of the station's water is recycled and used again.'","opts":["How the space station recycles its water","Why astronauts drink less water than people on Earth","The dangers of sweating in space","How water was discovered on the Moon"],"a":0,"why":"Every sentence explains how water is collected, cleaned and reused on board the station."},{"kind":"collocation","q":"The discovery of ice on the Moon has ___ fresh impetus to plans for a lunar base.","opts":["given","made","taken","done"],"a":0,"why":"We 'give impetus to' a plan, meaning we make it move forward faster; make, take and do do not go with 'impetus'."},{"kind":"paraphrase","q":"Which sentence means the same as: 'The researchers were careful not to overstate their conclusions.'?","opts":["The researchers took care not to claim more than their results showed.","The researchers refused to publish any conclusions.","The researchers made their conclusions sound as dramatic as possible.","The researchers could not reach any conclusions at all."],"a":0,"why":"To 'overstate' something is to make it seem bigger or more certain than it really is."},{"kind":"cohesion","q":"Which sentence best fills the gap? 'Muscles and bones weaken in microgravity. ___ Even so, many astronauts need several weeks to regain their strength after landing.'","opts":["To reduce this, crew members exercise for about two hours every day.","As a result, astronauts never need to exercise in space.","For example, the station circles the Earth about every ninety minutes.","Therefore, nobody has ever felt weak after a long mission."],"a":0,"why":"'Even so' needs something that should have helped: daily exercise reduces the weakening, yet recovery still takes weeks."}],"writing":[{"kind":"paragraph","sents":["Space debris poses a growing threat to the satellites on which modern life depends.","Fragments of old rockets and broken satellites circle the Earth at speeds of several kilometres per second.","At such speeds, even a piece the size of a marble can seriously damage a working spacecraft.","Collisions also create further fragments, raising the risk of a chain reaction.","For this reason, space agencies are now developing methods to remove debris from orbit."]},{"kind":"paragraph","sents":["Robotic probes have several advantages over crewed missions to other planets.","First, they need no food, water or air, which makes them far cheaper to send.","Second, they can be sent on one-way journeys and can operate for years in conditions that no human could survive.","Nevertheless, a human geologist could probably achieve in days what a rover takes months to complete.","The ideal approach, therefore, may combine robotic scouting with carefully chosen human expeditions."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Space trips cost a crazy amount of money.'?","opts":["Space missions require substantial financial investment, often running into billions of dollars.","Going to space costs heaps of cash.","Space trips are expensive and stuff.","Space missions are the most expensive things humans have ever done, without exception."],"a":0,"why":"The first is formal and specific ('substantial financial investment', 'billions of dollars'). The others are slang ('heaps of cash', 'and stuff') or an unsupported absolute claim."},{"kind":"topic","q":"Which topic sentence fits best? '___ Satellites allow forecasters to track storms days before they reach land, and satellite navigation guides ships, aircraft and delivery vans. Even many card payments rely on precise timing signals sent from orbit.'","opts":["Modern life depends on space technology far more than most people realise.","Storms can cause serious damage to coastal towns.","Card payments are faster than paying with cash.","Space is very big and full of stars."],"a":0,"why":"Every example shows everyday life relying on satellites. The other sentences pick up a single word from the body or are vague."},{"kind":"thesis","q":"Some people believe that space exploration is a waste of money, while others think it brings important benefits. Discuss both views and give your own opinion. Which is the clearest thesis statement?","opts":["While the costs of space exploration are considerable, I believe they are justified by the scientific knowledge and practical technologies that such programmes have produced.","Space exploration began in the twentieth century with the first satellites.","Space is awesome, so we should obviously spend whatever it takes.","Some people agree and some people disagree about space exploration."],"a":0,"why":"The first acknowledges the cost and gives a clear, reasoned opinion. The others give history, an informal overclaim, or simply repeat the question."}]},{"id":"band8-4","title":"Medicine and health science","emoji":"🔬","words":[{"w":"immunity","def":"the body's ability to protect itself against a particular disease","ex":"Vaccines help the body build ___ without having to catch the illness first.","pos":"noun","forms":{"noun":"immunity","adj":"immune"}},{"w":"pathogen","def":"a tiny living thing, such as a virus or bacterium, that causes disease","ex":"A virus is one kind of ___; certain bacteria and fungi are others.","pos":"noun","syn":["germ"]},{"w":"diagnosis","def":"the act of identifying which illness a person has by examining them","ex":"Early ___ makes many conditions much easier to treat.","pos":"noun","forms":{"noun":"diagnosis","verb":"diagnose"}},{"w":"efficacy","def":"the ability of something, such as a medicine, to produce the result it is meant to","ex":"Clinical trials test the ___ of a new medicine as well as its safety.","pos":"noun","syn":["effectiveness"]},{"w":"placebo","def":"a pill or treatment with no active medicine in it, used in tests to compare results","ex":"Half the volunteers received the real drug and half received a ___ that looked identical.","pos":"noun"},{"w":"contagious","def":"easily spread from one person to another by contact","ex":"Chickenpox is highly ___, so children who have it usually stay at home for a few days.","pos":"adj","syn":["infectious","catching"]},{"w":"dormant","def":"not active now, but able to become active later","ex":"Some bacteria can remain ___ inside a tough protective coat until conditions improve.","pos":"adj","syn":["inactive"],"ant":["active"]},{"w":"prognosis","def":"a doctor's opinion about how an illness or injury is likely to develop","ex":"After the operation, the doctor said the ___ was excellent and she would make a full recovery.","pos":"noun"},{"w":"adverse","def":"harmful or unpleasant; having a negative effect","ex":"Like all medicines, the drug can have ___ effects in a small number of people.","pos":"adj","syn":["harmful","negative"],"ant":["beneficial"]},{"w":"antibiotic","def":"a medicine that kills bacteria or stops them from growing","ex":"Penicillin, discovered by Alexander Fleming in 1928, became the first widely used ___.","pos":"noun"},{"w":"alleviate","def":"to make pain or a problem less severe","ex":"Gentle stretching can help to ___ back pain.","pos":"verb","syn":["relieve","ease"],"ant":["worsen"],"forms":{"verb":"alleviate","noun":"alleviation"}},{"w":"susceptible","def":"easily affected or harmed by something","ex":"Young children are more ___ to ear infections than adults are.","pos":"adj","syn":["vulnerable"],"ant":["resistant"],"forms":{"adj":"susceptible","noun":"susceptibility"}},{"w":"eradicate","def":"to destroy or get rid of something completely","ex":"A worldwide vaccination campaign helped to ___ smallpox, which was declared gone for good in 1980.","pos":"verb","syn":["eliminate","destroy"],"forms":{"verb":"eradicate","noun":"eradication"}},{"w":"inoculate","def":"to protect a person against a disease by putting a weak or harmless form of it into their body","ex":"In 1796, Edward Jenner used material from cowpox to ___ a young boy against smallpox.","pos":"verb","syn":["vaccinate"],"forms":{"verb":"inoculate","noun":"inoculation"}},{"w":"clinical","def":"connected with examining and treating patients, rather than with theory or laboratory work","ex":"Before a new medicine is approved, it must pass several stages of ___ trials involving volunteers.","pos":"adj"},{"w":"genome","def":"the complete set of genetic information in a living thing","ex":"Scientists finished reading almost the entire human ___ in 2003, after thirteen years of work.","pos":"noun"},{"w":"dosage","def":"the amount of a medicine that should be taken at one time, and how often","ex":"The correct ___ for a child is usually much lower than for an adult.","pos":"noun","syn":["dose"]},{"w":"metabolism","def":"the chemical processes in the body that turn food into energy","ex":"Hummingbirds have an extremely fast ___, so they must feed almost constantly.","pos":"noun","forms":{"noun":"metabolism","adj":"metabolic"}},{"w":"sedentary","def":"involving a lot of sitting and very little physical activity","ex":"Doctors warn that a ___ lifestyle, with long hours in front of screens, can harm children's health.","pos":"adj","syn":["inactive"],"ant":["active"]},{"w":"longevity","def":"long life, or the length of a person's or animal's life","ex":"Greenland sharks are famous for their ___: some are thought to live for more than 250 years.","pos":"noun"}],"grammar":[{"q":"Doctors recommend that every patient ___ the full course of treatment.","opts":["complete","completed","completing","to complete"],"a":0,"why":"After 'recommend that', formal English uses the base form (the subjunctive): every patient complete."},{"q":"It was not until the 1940s ___ penicillin was produced on a large scale.","opts":["that","when","which","so"],"a":0,"why":"'It was not until + time + that...' is a fixed cleft pattern that stresses when something finally happened."},{"q":"Effective ___ the treatment is, it is not suitable for very young children.","opts":["though","however","despite","even"],"a":0,"why":"'Adjective + though + subject + verb' is a formal concession: Effective though it is = Although it is effective."},{"q":"Hand-washing has become far more common, ___ has led to fewer stomach infections.","opts":["which","what","that","it"],"a":0,"why":"After a comma, 'which' can refer to the whole previous idea; 'that' cannot follow a comma like this."},{"q":"Vaccines are thought ___ millions of lives over the past century.","opts":["to have saved","to save","having saved","that they saved"],"a":0,"why":"'Over the past century' refers to past time, so use the perfect infinitive: are thought to have saved."},{"q":"Under no circumstances ___ antibiotics be shared with other people.","opts":["should","must not","should not","can't"],"a":0,"why":"'Under no circumstances' is already negative and needs inversion, so use 'should' without 'not'."},{"q":"Scarcely ___ the vaccine been approved when millions of doses were ordered.","opts":["had","has","did","was"],"a":0,"why":"'Scarcely had + subject + past participle... when' shows that one past event followed another immediately."},{"q":"___ the right dose, the medicine can relieve pain within an hour.","opts":["Taken at","Taking at","Having taken at","To take at"],"a":0,"why":"The medicine is taken by the patient (passive meaning), so the participle clause starts with the past participle 'Taken'."},{"q":"If the trial ___ to fail, the company would lose years of work.","opts":["were","was being","is","has"],"a":0,"why":"'If + subject + were to + verb' describes an unlikely or imagined future event, followed by 'would' in the result clause."},{"q":"Only later ___ that they had been given a placebo rather than the real drug.","opts":["did the volunteers discover","the volunteers discovered","had discovered the volunteers","the volunteers did discover"],"a":0,"why":"When 'Only later' starts the sentence, the main clause uses question order: did the volunteers discover."}],"sentences":["Vaccines help the body build immunity against a particular disease.","Early diagnosis makes many illnesses far easier to treat.","Doctors recommend that every patient complete the full course of antibiotics.","Gentle exercise can help to alleviate the symptoms of back pain.","A worldwide campaign helped to eradicate smallpox by 1980.","Greenland sharks are thought to live for more than 250 years."],"reading":[{"title":"The power of expectation","text":"In clinical trials, new medicines are usually compared not with nothing at all but with a placebo: a pill or treatment that looks identical to the real one but contains no active ingredient. Strikingly, many volunteers who receive the placebo report that they feel better. Far from being a nuisance, this so-called placebo effect has become a fascinating subject of research in its own right.\n\nThe effect appears to depend heavily on expectation. Studies have found that, in some circumstances, two placebo pills tend to work better than one, injections better than pills, and pills described as expensive better than those described as cheap. Even colour may play a part. Such findings suggest that the brain, anticipating relief, can alter how the body experiences symptoms, particularly pain, which is strongly influenced by attention and mood.\n\nMore surprising still are studies of open-label placebos, in which patients are told quite openly that the pills they are taking contain no medicine. In several trials, a proportion of these patients nevertheless reported meaningful improvements in their symptoms. Researchers are still debating why: the ritual of taking a pill, the care and attention of a doctor, or simply the hope of getting better may all contribute.\n\nIt is important, however, not to exaggerate what placebos can do. Their effects are largely confined to symptoms that people feel and report, such as pain, tiredness or nausea. A placebo cannot destroy bacteria or mend a broken bone, and relying on one instead of proven treatment could be dangerous. The reverse phenomenon, known as the nocebo effect, also exists: people warned about possible side effects sometimes experience them even when they have been given no active drug.\n\nFor doctors, the lesson may not be to prescribe sugar pills, but to recognise that the way a treatment is explained and delivered can influence how well it works.","qs":[{"type":"tfng","q":"Blue placebo pills have been shown to work better than red ones.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"According to the passage, a placebo can help a broken bone to heal.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"How does the writer explain the effect of placebos on pain?","opts":["The expectation of relief can change how the body experiences symptoms.","Placebo pills contain small amounts of real medicine.","Pain usually disappears on its own after a few days.","Patients who expect relief are given stronger medicines."],"a":0},{"type":"mc","q":"What does the writer imply in the final paragraph?","opts":["The way doctors communicate with patients may form part of an effective treatment.","Doctors should give sugar pills instead of real medicines.","Placebos are more dangerous than most real medicines.","Patients should not be told how their treatment works."],"a":0},{"type":"mc","q":"What is the main idea of the passage?","opts":["The placebo effect is real and intriguing, but its power is limited.","Placebos can cure most illnesses if patients believe in them.","Clinical trials no longer need to use placebos.","The nocebo effect is more important than the placebo effect."],"a":0}]},{"title":"The accidental ray","text":"In November 1895, the German physicist Wilhelm Röntgen was experimenting with a glass tube through which he passed an electric current. Although the tube was covered in black card, he noticed that a screen coated with a special chemical was glowing faintly on a bench nearby. Some invisible form of radiation, it seemed, was passing straight through the card. Not knowing what it was, Röntgen called it 'X', the symbol used in mathematics for an unknown quantity.\n\nOver the following weeks, he investigated the mysterious rays with great care, discovering that they passed easily through paper, wood and flesh but were blocked by denser materials such as metal and bone. He also produced an image of the bones in his wife's hand, complete with her wedding ring. When he published his findings at the end of the year, the news spread around the world with remarkable speed, and within months doctors in several countries were using X-rays to locate broken bones and swallowed objects.\n\nRöntgen declined to patent his discovery, reportedly believing that it should benefit everyone, and in 1901 he received the first Nobel Prize in Physics.\n\nThe early enthusiasm, however, outpaced understanding. Since nobody yet realised that high doses of radiation could harm living tissue, X-rays were used with little caution. Researchers who exposed themselves repeatedly suffered burns, and for several decades some shoe shops even offered X-ray machines that allowed customers to see the bones of their feet inside new shoes. Only gradually did scientists establish safe limits.\n\nToday, X-rays remain one of the most widely used tools in medicine, although modern machines use doses far smaller than those of the early years. Röntgen's story illustrates a recurring pattern in science: a chance observation, followed by patient investigation, can transform a field, yet the full consequences of a discovery may take decades to understand.","qs":[{"type":"tfng","q":"Röntgen gave the rays their name because he did not know what they were.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Röntgen had trained and worked as a doctor before he became a physicist.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the passage, why were X-rays used carelessly at first?","opts":["Their power to damage the body had not yet been recognised.","Röntgen had told people that they were completely safe.","The early machines produced only very weak rays.","Doctors were not allowed to use them for patients."],"a":0},{"type":"mc","q":"What can be inferred about the shoe-shop X-ray machines?","opts":["They exposed customers to radiation before proper safety limits existed.","They were invented by Röntgen himself.","They were mainly used to find broken bones in feet.","They were banned as soon as X-rays were discovered."],"a":0},{"type":"mc","q":"Which statement best summarises the writer's point in the final paragraph?","opts":["A lucky observation can transform a field, but its effects may not be fully understood for a long time.","Most scientific discoveries happen by accident and need no further work.","X-rays are now too dangerous to be used in hospitals.","Scientists should always patent their discoveries."],"a":0}]}],"extra":[{"kind":"collocation","q":"The new treatment ___ promising results in early trials.","opts":["yielded","made","did","brought up"],"a":0,"why":"'Yield results' means produce them; make, do and bring up do not combine with 'results' in this way."},{"kind":"cohesion","q":"Which sentence best follows? 'Placebos can reduce pain and tiredness.'","opts":["They cannot, however, cure infections or mend broken bones.","As a result, real medicines are no longer needed.","For instance, they destroy harmful bacteria.","In addition, broken bones heal faster with placebos."],"a":0,"why":"'However' adds the important limit. The other sentences make claims the passage rejects."},{"kind":"register","q":"Which sentence is most suitable for an academic essay?","opts":["Excessive use of antibiotics may contribute to the development of resistant bacteria.","Taking loads of antibiotics is a really bad idea, honestly.","If you take antibiotics all the time, germs get tough.","Antibiotics? Don't overdo them, or bugs fight back."],"a":0,"why":"Academic writing is impersonal and cautious (may contribute) and uses precise terms instead of 'loads', 'germs' or 'bugs'."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Their effects are largely confined to symptoms that people feel and report.'?","opts":["They mainly affect symptoms that patients notice and describe themselves.","Their effects can be measured only with special machines.","People rarely report how they feel during treatment.","Their effects are spread equally across all kinds of illness."],"a":0,"why":"'Largely confined to' means mostly limited to, and 'feel and report' means notice and describe."},{"kind":"preposition","q":"A small number of people are allergic ___ penicillin.","opts":["to","with","of","for"],"a":0,"why":"The adjective 'allergic' is always followed by 'to'."},{"kind":"wordform","q":"The researchers said the results were ___ (conclusion) and called for larger trials.","opts":["inconclusive","conclusive","concluding","conclusion"],"a":0,"why":"Calling for larger trials shows the results did not settle the question, so we need the negative adjective: inconclusive."},{"kind":"linking","q":"Röntgen could have made a fortune from his discovery; ___, he chose not to patent it.","opts":["instead","therefore","likewise","for example"],"a":0,"why":"'Instead' introduces what he did in place of the expected choice. 'Therefore', 'likewise' and 'for example' do not show this contrast."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'Some medicines come from surprising places. Aspirin is related to a substance found in willow bark, which people chewed to ease pain thousands of years ago. A drug for treating malaria was developed from a traditional Chinese herbal remedy, and at least one powerful painkiller was inspired by the venom of sea snails.'","opts":["Nature as a source of medicines","How to treat a headache at home","The dangers of sea snails","Why herbal remedies never work"],"a":0,"why":"Each example shows a medicine that came from a plant or an animal, so the paragraph is about nature as a source of medicines."},{"kind":"collocation","q":"The new treatment ___ a significant improvement on older methods.","opts":["represents","does","brings up","takes"],"a":0,"why":"Something 'represents an improvement' when it is an example of progress; 'does', 'brings up' and 'takes' do not go with 'improvement'."},{"kind":"register","q":"Which sentence is most appropriate in a medical research paper?","opts":["Participants who received the treatment reported significantly less pain than those in the control group.","The people who got the real pills felt way better.","Basically, the treatment worked loads better than nothing.","Guess what? The pills really helped with the pain!"],"a":0,"why":"A research paper uses precise, impersonal terms ('participants', 'control group', 'significantly'), not chatty words like 'way', 'loads' or 'guess what'."}],"writing":[{"kind":"paragraph","sents":["The overuse of antibiotics has accelerated the spread of drug-resistant bacteria.","Whenever antibiotics are taken, the most vulnerable bacteria are killed, but any naturally resistant ones may survive.","These survivors then multiply, passing their resistance on to future generations of bacteria.","Taking antibiotics unnecessarily, for example for colds caused by viruses, therefore adds to the problem without bringing any benefit."]},{"kind":"paragraph","sents":["Well-designed clinical trials are essential for establishing whether a new treatment works.","In a typical trial, volunteers are randomly divided into two groups.","One group receives the new medicine, while the other is given a placebo that looks identical.","Ideally, neither the patients nor the doctors know who is in which group until the trial ends.","This 'double-blind' design prevents expectations from influencing the results."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'The new drug worked really well on most people.'?","opts":["The new drug proved highly effective in the majority of participants.","The new drug was super good for most people.","The new drug cured absolutely everyone who took it.","The new drug did something to people."],"a":0,"why":"The first uses precise, formal terms ('proved highly effective', 'the majority of participants'). The others are informal, overclaim, or too vague to be useful."},{"kind":"topic","q":"Which topic sentence fits best? '___ Regular exercise strengthens the heart and helps to control weight, while a balanced diet reduces the risk of several serious illnesses. Vaccination programmes, meanwhile, protect whole communities from diseases that once spread easily.'","opts":["Many of the greatest gains in public health come from prevention rather than cure.","Exercise is more fun when you do it with friends.","The heart is a muscle that pumps blood around the body.","Health is a thing that matters a lot to people."],"a":0,"why":"Exercise, diet and vaccination are all ways of preventing illness. The other sentences are off topic, about one detail, or too vague."},{"kind":"thesis","q":"Some people think that the best way to improve public health is to build more sports facilities, while others believe other measures would be more effective. Discuss both views and give your own opinion. Which is the clearest thesis statement?","opts":["Although sports facilities can encourage activity, I would argue that measures targeting diet and everyday habits, such as clearer food labelling, are likely to have a greater overall impact.","Sports facilities include gyms, swimming pools and playing fields.","Gyms are boring, so nobody would use them anyway.","Public health is a big topic with many different sides to it."],"a":0,"why":"The first compares the two views and states which is more effective, with an example. The others list facilities, overgeneralise informally, or are vague."}]},{"id":"band8-5","title":"Art, music and creativity","emoji":"🎨","words":[{"w":"aesthetic","def":"connected with beauty and with how pleasing something looks","ex":"The architect cared about the ___ appeal of the bridge as much as its strength.","pos":"adj","forms":{"adj":"aesthetic","noun":"aesthetics"}},{"w":"improvise","def":"to make up music, words or actions on the spot, without preparing them","ex":"Jazz musicians often ___ whole solos, inventing the melody as they play.","pos":"verb","forms":{"verb":"improvise","noun":"improvisation"}},{"w":"virtuoso","def":"a performer with outstanding technical skill, especially in music","ex":"By the age of twelve, she was a piano ___ who performed with major orchestras.","pos":"noun"},{"w":"eclectic","def":"including ideas or styles taken from many different sources","ex":"Her playlist is wonderfully ___, mixing folk, jazz, reggae and classical music.","pos":"adj","syn":["varied","diverse"]},{"w":"evoke","def":"to bring a feeling, memory or image into someone's mind","ex":"The smell of oil paint seemed to ___ memories of her grandfather's studio.","pos":"verb","syn":["suggest","recall"],"forms":{"verb":"evoke","adj":"evocative"}},{"w":"juxtapose","def":"to put two different things side by side so that the contrast between them is noticed","ex":"The photographer likes to ___ ancient ruins and gleaming modern towers in the same frame.","pos":"verb","forms":{"verb":"juxtapose","noun":"juxtaposition"}},{"w":"ingenuity","def":"skill and cleverness in inventing new things or solving problems","ex":"With great ___, the pupils built working instruments from recycled bottles and boxes.","pos":"noun","syn":["inventiveness","cleverness"],"forms":{"noun":"ingenuity","adj":"ingenious"}},{"w":"abstract","def":"showing shapes, colours and lines rather than real people or objects","ex":"In ___ art, colour and shape matter more than recognisable objects.","pos":"adj","ant":["realistic","figurative"]},{"w":"medium","def":"the material or method an artist uses, such as oil paint, clay or film","ex":"Watercolour is a demanding ___ because mistakes are very hard to correct.","pos":"noun"},{"w":"acclaim","def":"enthusiastic public praise","ex":"The film received widespread ___ from critics and audiences alike.","pos":"noun","syn":["praise"],"ant":["criticism"],"forms":{"noun":"acclaim","adj":"acclaimed"}},{"w":"derivative","def":"copied from the work of others and lacking originality","ex":"Critics dismissed the song as ___, saying it borrowed too much from earlier hits.","pos":"adj","ant":["original"]},{"w":"prolific","def":"producing a great many works or results","ex":"Picasso was extraordinarily ___, creating many thousands of paintings, drawings and sculptures.","pos":"adj","syn":["productive"]},{"w":"pigment","def":"a coloured powder that is mixed with oil or water to make paint","ex":"Ultramarine, a deep blue ___ made from a ground-up stone, was once more costly than gold.","pos":"noun"},{"w":"repertoire","def":"all the pieces of music, plays or songs that a performer knows and can perform","ex":"The young pianist's ___ already includes works by Bach, Chopin and Debussy.","pos":"noun"},{"w":"fresco","def":"a painting made directly on a wall or ceiling while the plaster is still wet","ex":"Michelangelo spent four years painting the vast ___ on the ceiling of the Sistine Chapel.","pos":"noun"},{"w":"embellish","def":"to make something more beautiful or interesting by adding decorations or details","ex":"Medieval monks would ___ the first letter of each page with gold leaf and tiny pictures.","pos":"verb","syn":["decorate"],"forms":{"verb":"embellish","noun":"embellishment"}},{"w":"commission","def":"to formally ask an artist to produce a piece of work, usually for payment","ex":"The city council decided to ___ a sculptor to create a statue for the new square.","pos":"verb"},{"w":"curator","def":"a person in charge of the objects or works of art in a museum or gallery","ex":"The ___ of the gallery chose which paintings would hang in each room.","pos":"noun","forms":{"noun":"curator","verb":"curate"}},{"w":"intricate","def":"having many small parts or details arranged in a complicated way","ex":"The watch's ___ mechanism contains more than a hundred tiny moving parts.","pos":"adj","syn":["complex","detailed"],"ant":["simple","rudimentary"]},{"w":"patron","def":"a person who gives money or support to artists or to an activity such as music","ex":"Lorenzo de' Medici, a wealthy ___ of the arts, paid many Florentine painters and sculptors to work for him.","pos":"noun","syn":["sponsor","supporter"]}],"grammar":[{"q":"So moving ___ that the audience stood and cheered for ten minutes.","opts":["was the performance","the performance was","did the performance","the performance had"],"a":0,"why":"After 'So + adjective' at the start of a sentence, the verb comes before the subject: So moving was the performance."},{"q":"___ Monet often painted outdoors to capture changing light, many earlier artists worked mainly in studios.","opts":["Whereas","Despite","Owing to","Notwithstanding"],"a":0,"why":"'Whereas' joins two clauses to contrast them; despite, owing to and notwithstanding need a noun, not a clause."},{"q":"It was the invention of the paint tube ___ made it easier for artists to paint outdoors.","opts":["that","what","where","whom"],"a":0,"why":"A cleft sentence 'It was X that...' highlights X; 'what', 'where' and 'whom' do not fit this pattern."},{"q":"Seldom ___ such a young composer received so much praise.","opts":["has","have","is","did"],"a":0,"why":"After 'Seldom' at the start, invert: Seldom has + singular subject + past participle (received)."},{"q":"___ in 1889, The Starry Night is one of Van Gogh's best-known works.","opts":["Painted","Painting","Having painted","To paint"],"a":0,"why":"The picture was painted (passive meaning), so the participle clause begins with 'Painted'."},{"q":"The more an artist practises, ___ their technique becomes.","opts":["the more reliable","more reliable","the most reliable","the reliable"],"a":0,"why":"The pattern 'The more..., the more...' needs 'the + comparative' in both halves."},{"q":"Nowhere ___ the influence of Japanese prints more obvious than in the work of Van Gogh.","opts":["is","are","does","has"],"a":0,"why":"After 'Nowhere' at the start, invert the verb and subject; the singular subject 'the influence' needs 'is'."},{"q":"The Mona Lisa ___ to have been painted over a period of several years.","opts":["is thought","thinks","is thinking","has thought"],"a":0,"why":"A painting cannot think, so use the passive reporting pattern 'is thought to have been + past participle'."},{"q":"___ much they practise, few musicians ever feel that a piece is truly perfect.","opts":["However","Whatever","Although","Despite"],"a":0,"why":"'However much + clause' means 'no matter how much'. 'Whatever', 'Although' and 'Despite' cannot be followed by 'much' in this way."},{"q":"___ in a damp cellar for over a century, the painting needed careful cleaning.","opts":["Having been stored","Having stored","Storing","To store"],"a":0,"why":"Someone stored the painting earlier (passive and before the main action), so use 'Having been + past participle'."}],"sentences":["Jazz musicians are famous for improvising solos on the spot.","Picasso was one of the most prolific artists of the twentieth century.","The invention of the paint tube allowed artists to work outdoors.","Critics dismissed the song as derivative of earlier hits.","Michelangelo spent four years painting the ceiling of the Sistine Chapel.","The curator chose which paintings would hang in each room."],"reading":[{"title":"The improvising brain","text":"When a jazz pianist improvises, she is composing and performing at the same moment, producing music that has never existed before and will never be played in exactly the same way again. For centuries, such spontaneous creativity was regarded as something close to magic. Recently, however, neuroscientists have begun to investigate what actually happens in the brain when musicians invent music on the spot.\n\nIn a well-known study published in 2008, researchers in the United States asked professional jazz pianists to play a specially designed keyboard while lying inside a brain scanner. The musicians alternated between playing a memorised piece and improvising freely. During improvisation, the scans showed reduced activity in a region at the front of the brain associated with self-monitoring and conscious control, while an area linked to self-expression became more active. Later studies of freestyle rappers reported a broadly similar pattern.\n\nOne interpretation is that improvisation requires musicians to switch off, at least partially, the inner critic that constantly judges what they are doing. Rather than evaluating every note before playing it, the performer allows ideas to flow, trusting years of practice to keep them within the rules of the style.\n\nIt would be a mistake, though, to conclude that creativity is simply a matter of letting go. The musicians in these experiments were highly trained experts who had spent thousands of hours mastering scales, harmonies and patterns. Their apparent freedom rested on an extensive store of knowledge that had become automatic. A beginner who silenced their inner critic would be unlikely to produce anything comparable.\n\nMoreover, researchers caution that a scanner is a highly artificial setting, and that studies involving small numbers of participants cannot reveal the full complexity of artistic invention. What the research does suggest is that creativity may involve a delicate balance between discipline and spontaneity: the hard work of learning, followed by the courage to stop thinking and play.","qs":[{"type":"tfng","q":"The pianists who took part in the 2008 study had all played together in the same band.","opts":["True","False","Not Given"],"a":2},{"type":"tfng","q":"The writer believes that beginners could improvise as well as experts if they simply stopped judging themselves.","opts":["True","False","Not Given"],"a":1},{"type":"mc","q":"According to the passage, what happens to the 'inner critic' during improvisation?","opts":["It becomes less active, so ideas can flow more freely.","It becomes more active and checks every note.","It is replaced by pieces of music learnt by heart.","It stops the musician from following the rules of the style."],"a":0},{"type":"mc","q":"What can be inferred about the experts' 'apparent freedom'?","opts":["It only looked effortless because of years of earlier training.","It was caused by the design of the special keyboard.","It was greater when they played memorised pieces.","It disappeared once they were lying inside the scanner."],"a":0},{"type":"mc","q":"Why does the writer mention that a scanner is 'a highly artificial setting'?","opts":["to point out a limitation of the research","to explain why the musicians played badly","to argue that the studies should never have been carried out","to show that the results apply to every kind of artist"],"a":0}]},{"title":"Why tunes get stuck","text":"Almost everyone has experienced it: a fragment of a song begins playing in the mind and refuses to stop, sometimes for hours. Psychologists call these unwanted repetitions 'involuntary musical imagery', although they are better known by a name borrowed from German, 'earworms'. In one large survey carried out in Finland, around nine in ten people reported having an earworm at least once a week, suggesting that the experience is less a quirk than a normal feature of how the mind works.\n\nWhy do some tunes get stuck more readily than others? In a 2016 study, researchers in London asked around three thousand people to name the songs that most often became earworms for them, and then compared the features of those songs with similar songs that were rarely named. The 'sticky' tunes tended to be relatively fast, with a common, easy-to-sing melodic shape, but they also contained some unusual leaps or repetitions that made them distinctive. In other words, a successful earworm seems to combine the familiar with the surprising.\n\nRecent exposure plays an important part too. Songs heard frequently, or heard shortly before the earworm begins, are particularly likely to return. Stress and tasks that demand little attention, such as repetitive chores, can also leave the mind more open to them.\n\nFor those who find earworms irritating, research offers a few modest remedies. One study found that chewing gum reduced the number of times participants heard a tune in their heads, perhaps because it interferes with the inner 'voice' we use when silently rehearsing sounds. Absorbing tasks, such as a moderately difficult puzzle, may also help. Some people even recommend listening to the whole song, on the theory that an unfinished fragment is what keeps the loop going, though this idea remains largely untested.\n\nFor most people, however, earworms are harmless, and many report that their stuck songs are ones they actually enjoy.","qs":[{"type":"tfng","q":"The survey in Finland suggested that earworms are an unusual experience.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"All the songs in the 2016 study had been in the music charts in the same year.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the 2016 study, what made a tune more likely to become an earworm?","opts":["a mixture of a familiar, simple shape and a few unexpected features","a very slow speed and very few repeated notes","being completely unlike any other song","being sung by a famous performer"],"a":0},{"type":"mc","q":"What can be inferred about the advice to listen to the whole song?","opts":["There is little scientific evidence so far that it works.","It has been proved to be the best remedy.","It works only for people who chew gum.","Researchers have shown that it makes earworms worse."],"a":0},{"type":"mc","q":"What is the main purpose of the passage?","opts":["to explain what earworms are, why they happen and how they might be reduced","to warn readers that earworms are harmful to health","to compare the musical tastes of people in Finland and London","to argue that people should listen to less music"],"a":0}]}],"extra":[{"kind":"collocation","q":"The film ___ the imagination of audiences around the world.","opts":["captured","caught up","took over","held up"],"a":0,"why":"We say a story or idea 'captures the imagination'; the phrasal verbs here have different meanings."},{"kind":"register","q":"Which sentence would suit a formal review in an arts journal?","opts":["The composer's use of silence creates a sense of tension that persists throughout the work.","The bit with the silence is super tense, I loved it.","Honestly, the quiet parts are kind of awesome.","There's loads of silence and it's really dramatic, you know?"],"a":0,"why":"A formal review uses precise, impersonal language; 'super', 'kind of awesome' and 'you know?' are informal."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Their apparent freedom rested on an extensive store of knowledge that had become automatic.'?","opts":["They seemed free only because a great deal of learning had become second nature to them.","They were free because they had forgotten everything they had learnt.","They had little knowledge, so they felt free to experiment.","Their knowledge prevented them from playing freely."],"a":0,"why":"'Apparent' means seeming, 'rested on' means depended on, and 'automatic' knowledge is second nature."},{"kind":"linking","q":"Which sentence best joins the ideas? 'Improvisation feels spontaneous.' + 'It depends on years of disciplined practice.'","opts":["Although improvisation feels spontaneous, it depends on years of disciplined practice.","Because improvisation feels spontaneous, it depends on years of disciplined practice.","Improvisation feels spontaneous, so it depends on years of disciplined practice.","Improvisation feels spontaneous; for example, it depends on years of disciplined practice."],"a":0,"why":"The ideas contrast (spontaneous vs disciplined), so we need a concession: although. The others wrongly show cause or example."},{"kind":"cohesion","q":"Which order is most logical? A: Over time, these patterns become automatic. B: Musicians first practise scales and patterns slowly. C: Only then can they combine them freely while performing.","opts":["B, A, C","A, B, C","C, A, B","B, C, A"],"a":0,"why":"B starts the process ('first'), A follows ('Over time, these patterns'), and C ends it ('Only then')."},{"kind":"wordform","q":"The painting is a striking ___ (juxtapose) of bright colours and deep shadows.","opts":["juxtaposition","juxtaposed","juxtaposing","juxtapose"],"a":0,"why":"After 'a striking' and before 'of' we need a noun: juxtaposition."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'Before the 1840s, painters who wanted to work outdoors had to mix their own colours and carry them in delicate pig's bladders, which often burst. The invention of the metal paint tube changed this. Paint could now be stored for long periods and carried easily, making it far more practical to paint a landscape while looking at it.'","opts":["How a small invention helped painters to work outside","Why landscapes are hard to paint","The life of a famous landscape painter","How colours are made from plants"],"a":0,"why":"The paragraph describes a problem for outdoor painters and how the paint tube solved it."},{"kind":"collocation","q":"The exhibition ___ record numbers of visitors in its first month.","opts":["drew","pulled down","made","did"],"a":0,"why":"An event 'draws' visitors or crowds, meaning it attracts them; 'pulled down', 'made' and 'did' do not have this meaning."},{"kind":"paraphrase","q":"Which sentence means the same as: 'A successful earworm seems to combine the familiar with the surprising.'?","opts":["Tunes that stick usually mix predictable features with unexpected ones.","Only completely new tunes become earworms.","Familiar tunes are never surprising.","Surprising tunes are easier to forget than familiar ones."],"a":0,"why":"'Combine the familiar with the surprising' means it contains both things we expect and things we do not."},{"kind":"linking","q":"___ dismissed by critics at first, the painting is now one of the gallery's most admired works.","opts":["Though","Because","Unless","Since"],"a":0,"why":"'Though + past participle' shows concession (although it was dismissed). The other words give a reason, a condition or a time, which do not fit."}],"writing":[{"kind":"paragraph","sents":["Arts subjects deserve a secure place in the school curriculum.","Music, drama and painting develop creativity, which employers increasingly value in a wide range of careers.","These subjects also give pupils a way of expressing ideas and feelings that may be difficult to put into words.","Finally, there is some evidence that learning a musical instrument supports concentration and memory.","Cutting arts lessons to save money could therefore prove to be a false economy."]},{"kind":"paragraph","sents":["The invention of the collapsible paint tube changed the way artists worked.","Before the 1840s, painters had to grind and mix their own colours, which made working outdoors impractical.","Once paint could be bought ready-made in portable tubes, artists were free to paint directly in front of a landscape.","This freedom helped the Impressionists to capture changing light and weather in their pictures.","Renoir is reported to have said that without paint in tubes there would have been no Impressionism."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Lots of people think modern art is rubbish and anyone could do it.'?","opts":["Modern art is often criticised by those who regard it as requiring little technical skill.","Many people say modern art is rubbish.","Everyone agrees that modern art is completely worthless.","Modern art is a thing some people have views on."],"a":0,"why":"The first reports the criticism precisely and neutrally. The others keep the informal 'rubbish', overclaim ('everyone agrees') or say almost nothing."},{"kind":"topic","q":"Which topic sentence fits best? '___ Studies have found that singing in a choir can lift people's mood and reduce feelings of loneliness. Similarly, painting or playing an instrument can offer a welcome break from everyday stress.'","opts":["Taking part in creative activities can bring real benefits to people's well-being.","Choirs usually rehearse once or twice a week.","Painting requires brushes, paper and paints.","Art is nice and lots of people like it."],"a":0,"why":"Both sentences describe how creative activities help well-being. The others give unrelated details or are too vague and informal."},{"kind":"thesis","q":"Some people believe that governments should spend money on supporting the arts, while others think this money should go to more practical needs such as healthcare. Discuss both views and give your own opinion. Which is the clearest thesis statement?","opts":["While healthcare must remain a priority, I believe a modest level of public funding for the arts is justified, given their contribution to education, tourism and community life.","The arts include painting, music, theatre and dance.","Art is a total waste of money, honestly.","This essay will discuss whether art is good or bad."],"a":0,"why":"The first balances both views and gives a clear, reasoned position. The others list art forms, are informal and unsupported, or misstate the question."}]},{"id":"band8-6","title":"Conservation and heritage","emoji":"🏰","words":[{"w":"outlaw","def":"to make something illegal by passing a law","ex":"In 1989, a worldwide agreement was reached to ___ the international trade in ivory, making it a crime.","pos":"verb","syn":["ban","prohibit"]},{"w":"wilderness","def":"a large natural area that has not been changed by farming, building or other human activity","ex":"Antarctica is the last great ___ on Earth, with no cities or farms.","pos":"noun"},{"w":"dwindle","def":"to become gradually smaller in size or number until little remains","ex":"As their nesting beaches were built on, the turtle population began to ___.","pos":"verb","syn":["shrink","decrease"],"ant":["grow","increase"]},{"w":"replenish","def":"to fill something up again, or to bring it back to its former level","ex":"If fishing stops for a few years, the fish stocks in the bay have time to ___ themselves.","pos":"verb","syn":["refill","restore"]},{"w":"rewilding","def":"returning an area of land to its natural state, often by bringing back animals that once lived there","ex":"Supporters of ___ argue that the best way to restore nature is often to step back and let wild plants and animals take over.","pos":"noun"},{"w":"sanctuary","def":"a place where birds or animals are protected and can live safely","ex":"Rescued baby elephants are cared for at a ___ in Kenya until they are ready to return to the wild.","pos":"noun","syn":["refuge"]},{"w":"irreversible","def":"impossible to change back to how it was before","ex":"Once a species has disappeared, the loss is ___: it can never be brought back.","pos":"adj","syn":["permanent"],"ant":["reversible"]},{"w":"deterioration","def":"the process of slowly becoming worse in condition","ex":"Damp air and pollution have caused the steady ___ of the cathedral's stone carvings.","pos":"noun","ant":["improvement"],"forms":{"noun":"deterioration","verb":"deteriorate"}},{"w":"listed building","def":"in Britain, a building protected by law because of its historical or architectural importance","ex":"Because the old mill is a ___, its owners need special permission even to replace its windows.","pos":"phrase"},{"w":"erode","def":"to wear something away gradually, as wind, rain or the sea do to rock and soil","ex":"Every winter, storm waves ___ a little more of the cliff beneath the old lighthouse.","pos":"verb","syn":["wear"],"forms":{"verb":"erode","noun":"erosion"}},{"w":"archaeological","def":"connected with the study of the past through the objects and buildings that people left behind","ex":"Builders must stop work if they uncover ___ remains, so that experts can examine them first.","pos":"adj","forms":{"adj":"archaeological","noun":"archaeology"}},{"w":"indispensable","def":"so important or useful that it is impossible to manage without it","ex":"Local volunteers have become ___ to the reserve, which could not run without their help.","pos":"adj","syn":["essential","vital"],"ant":["unnecessary"]},{"w":"captive breeding","def":"breeding animals in zoos or centres so that their young can later be released into the wild","ex":"Thanks to ___, the Arabian oryx was saved and returned to the deserts where it once lived.","pos":"phrase"},{"w":"flagship species","def":"a popular animal used to win support for protecting the whole area in which it lives","ex":"The giant panda is a ___: money raised to protect it also protects forests where many other animals live.","pos":"phrase"},{"w":"conservationist","def":"a person who works to protect animals, plants and the natural environment","ex":"The ___ spent ten years counting the snow leopards that live high in the mountains.","pos":"noun"},{"w":"relic","def":"an object, building or custom that has survived from the distant past","ex":"This stone axe, a ___ of the first farmers who lived in the valley, is over five thousand years old.","pos":"noun"},{"w":"coral bleaching","def":"the loss of colour in coral when warm water forces out the tiny algae that live inside it","ex":"During unusually hot summers, ___ can turn large areas of a reef white.","pos":"phrase"},{"w":"stewardship","def":"the careful and responsible management of something that you have been trusted to look after","ex":"Good ___ of the countryside means managing it so that it stays healthy for future generations.","pos":"noun"},{"w":"legislation","def":"a law, or a set of laws, passed by a parliament","ex":"New ___ makes it illegal to damage the nests of protected birds.","pos":"noun","forms":{"noun":"legislation","verb":"legislate"}},{"w":"marine reserve","def":"an area of sea where fishing and other activities are limited by law to protect wildlife","ex":"Since the bay became a ___, fishing has been banned there and lobster numbers have risen sharply.","pos":"phrase"}],"grammar":[{"q":"Only through careful management ___ the island's seabird colonies recover.","opts":["can","are","have","is"],"a":0,"why":"After 'Only through + noun' at the start, invert: can + subject + base form (recover)."},{"q":"So fragile ___ the ancient manuscript that only two scholars a year may handle it.","opts":["is","does","has","it is"],"a":0,"why":"After 'So + adjective' at the start, the verb comes before the subject: So fragile is the manuscript."},{"q":"It is not the tourists themselves but the litter they leave ___ does the most damage.","opts":["that","what","where","who"],"a":0,"why":"In the cleft pattern 'It is not X but Y that...', use 'that'; 'who' is only for people, and the focus here is 'the litter'."},{"q":"The cave's entrance is thought ___ by a rockfall long ago, which kept the paintings hidden until 1940.","opts":["to have been blocked","to be blocked","to have blocked","that it was blocked"],"a":0,"why":"The blocking happened in the past and was done to the entrance, so use the perfect passive infinitive: to have been blocked."},{"q":"Not until the 1970s ___ governments begin to protect wetlands through international agreements.","opts":["did","had","have","were"],"a":0,"why":"After 'Not until + time' at the start, invert the main clause; with the base form 'begin' in the past we need 'did'."},{"q":"The committee insisted that the new visitor centre ___ in the same local stone as the castle.","opts":["be built","is building","building","to be built"],"a":0,"why":"After 'insist that', formal English uses the base form (the subjunctive); here it is passive: be built."},{"q":"___ as the project's aims are, it has struggled to raise enough money.","opts":["Admirable","Although admirable","However admirable","Despite admirable"],"a":0,"why":"'Adjective + as + subject + verb' is a formal concession: Admirable as they are = Although they are admirable."},{"q":"___ the water continue to warm, more of the reef could suffer from bleaching.","opts":["Should","Were","Had","Would"],"a":0,"why":"'Should + subject + base form' is a formal way to say 'If...': Should the water continue. 'Were' would need 'to continue'."},{"q":"___ badly by a storm, the old lighthouse was rebuilt using its original stones.","opts":["Damaged","Damaging","Having damaged","To damage"],"a":0,"why":"The lighthouse was damaged by the storm (passive meaning), so the participle clause starts with 'Damaged'."},{"q":"There is little doubt ___ ecotourism, when well managed, can benefit local communities.","opts":["that","whether","what","of"],"a":0,"why":"'There is little doubt that + clause' states something as almost certain. 'Of' would need a noun, and 'whether' and 'what' do not fit."}],"sentences":["Thanks to captive breeding, the Arabian oryx was returned to the wild.","So fragile is the manuscript that only two scholars may handle it.","Every winter, storm waves erode a little more of the cliff.","The giant panda is a flagship species for the protection of forests.","Damp air has caused the deterioration of the cathedral's stone carvings.","Not until the 1970s did governments begin to protect wetlands."],"reading":[{"title":"Moving a temple","text":"In the early 1960s, Egypt began building the Aswan High Dam across the River Nile. The dam promised to control flooding and generate electricity, but the vast lake that would form behind it threatened to submerge dozens of ancient monuments. Among them were the two magnificent temples at Abu Simbel, carved into a sandstone cliff more than three thousand years ago on the orders of the pharaoh Ramesses II.\n\nIn response, UNESCO launched an international campaign to rescue the monuments, and dozens of countries contributed money and expertise. The solution chosen for Abu Simbel was as bold as it was risky. Between 1964 and 1968, engineers sawed the temples, including their colossal statues, into more than a thousand huge blocks. Each block was numbered, lifted and reassembled on higher ground, about 65 metres above the original site, against an artificial hill built to recreate the cliff.\n\nThe work demanded extraordinary precision. The ancient builders had aligned the main temple so that, on two days each year, the rising sun shines deep inside it and lights up statues in its innermost room. Remarkably, the engineers preserved this effect, although the dates on which it occurs are thought to have shifted by about a day.\n\nNot everyone regards the rescue as a complete success. Some archaeologists point out that a monument cut away from its original setting loses part of its meaning, and that the joins between the blocks remain visible on close inspection. Others note that many smaller sites in the region could not be saved and now lie beneath the lake.\n\nNevertheless, the campaign had a lasting influence. It demonstrated that protecting outstanding places could be treated as a shared international responsibility, an idea that led to the World Heritage Convention, adopted by UNESCO in 1972. Today, more than a thousand sites around the world are protected under that agreement.","qs":[{"type":"tfng","q":"The temples were moved to a lower position, closer to the river.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"The blocks were carried to their new site on boats along the Nile.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the passage, what is remarkable about the rebuilt main temple?","opts":["Sunlight still reaches its innermost room on two days a year, almost as it did originally.","It is now larger than the original temple.","Its statues were replaced with modern copies.","The joins between its blocks are completely invisible."],"a":0},{"type":"mc","q":"What can be inferred from the archaeologists' criticism?","opts":["They believe a monument's original location is part of its value.","They think the temples should have been left to flood.","They were not invited to take part in the campaign.","They prefer modern buildings to ancient ones."],"a":0},{"type":"mc","q":"What is the main purpose of the final paragraph?","opts":["to show that the rescue changed the way the world protects important places","to describe how the World Heritage Convention is organised","to argue that the High Dam should never have been built","to list the sites that are protected today"],"a":0}]},{"title":"The antelope that came back","text":"The Arabian oryx is a white antelope with long, straight horns, superbly adapted to the deserts of the Arabian Peninsula. It can survive for long periods without drinking, obtaining moisture from the plants it eats, and it is said to be able to sense rainfall from a great distance. Yet these remarkable abilities could not protect it from hunters equipped with cars and rifles. By 1972, the last wild oryx had disappeared.\n\nFortunately, conservationists had anticipated the danger. In the early 1960s, a small number of wild oryx were captured and, together with animals donated from private collections, became the founders of a captive herd at Phoenix Zoo in the United States. This 'World Herd', as it became known, bred successfully, and its descendants were later shared among zoos and breeding centres.\n\nIn 1982, the first captive-bred oryx were released into the wild in Oman, and further reintroductions followed in Saudi Arabia, Israel and elsewhere. The recovery was so successful that in 2011 the species' status was improved from 'endangered' to 'vulnerable', making it the first animal to reach this category after once having been extinct in the wild.\n\nThe story, however, is not one of uninterrupted triumph. In Oman, the Arabian Oryx Sanctuary had been declared a UNESCO World Heritage Site in 1994. After illegal hunting and capture caused the population there to fall sharply, and the government reduced the protected area by around ninety per cent, UNESCO removed the site from its list in 2007, the first time it had ever done so.\n\nThe oryx's history therefore offers two lessons. Captive breeding can rescue a species on the brink, but long-term survival depends on protecting the places where animals are returned, and on the continued commitment of the people who live alongside them.","qs":[{"type":"tfng","q":"The Arabian oryx needs to drink water every day in order to survive.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Most visitors to the Arabian Oryx Sanctuary came from Europe.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What made the change in the oryx's status in 2011 unique?","opts":["No animal had recovered to that level before after vanishing from the wild.","It was the first antelope ever to be bred in a zoo.","It was the first time an animal had been released in Oman.","It was the only species protected by UNESCO."],"a":0},{"type":"mc","q":"What can be inferred from the fourth paragraph?","opts":["World Heritage status alone could not guarantee the oryx's protection.","UNESCO removes sites from its list every year.","The oryx population in Oman grew after 2007.","The government of Oman enlarged the sanctuary."],"a":0},{"type":"mc","q":"Which statement best summarises the writer's conclusion?","opts":["Captive breeding can save a species, but protecting its wild home is essential for its future.","Zoos are the safest place for endangered animals to live.","Reintroducing animals to the wild never succeeds.","The oryx no longer needs any protection."],"a":0}]}],"extra":[{"kind":"collocation","q":"The new law ___ a significant step towards protecting the country's coastline.","opts":["marks","does","puts","takes up"],"a":0,"why":"Something 'marks a step' when it is an important stage in progress; 'does', 'puts' and 'takes up' do not go with 'step' like this."},{"kind":"phrasal","q":"Conservation projects often rely on volunteers who ___ their weekends to plant trees and clear rubbish.","opts":["give up","give in","give off","give out"],"a":0,"why":"To 'give up' your time means to spend it on something for others. 'Give in' means surrender, 'give off' means produce a smell or heat, and 'give out' means hand out."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Captive breeding can rescue a species on the brink.'?","opts":["Breeding animals in zoos can save a species that is close to disappearing.","Zoos are the best place for every species to live.","Species on the brink cannot be saved by captive breeding.","Captive breeding causes species to disappear."],"a":0,"why":"'On the brink' means very close to disaster, here close to disappearing, and 'rescue' means save."},{"kind":"paraphrase","q":"Which is the closest paraphrase of: 'The solution chosen for Abu Simbel was as bold as it was risky.'?","opts":["The plan for Abu Simbel was both daring and dangerous.","The plan was bold but carried no risk at all.","The plan was too risky to be carried out.","The plan was less bold than the other solutions."],"a":0,"why":"'As bold as it was risky' means it was equally bold and risky, so both daring and dangerous."},{"kind":"register","q":"Which sentence is most suitable for an academic essay?","opts":["Tourism can generate revenue for conservation, yet large visitor numbers may accelerate the deterioration of fragile sites.","Tourists bring cash, but they kind of wreck stuff too.","Loads of tourists means loads of money, but loads of damage as well.","Tourism? Good for money, bad for old buildings, obviously."],"a":0,"why":"Academic writing is balanced and precise ('generate revenue', 'may accelerate'); 'kind of wreck stuff', 'loads' and 'obviously' are conversational."},{"kind":"linking","q":"___ attracting much-needed funds, tourism can damage the very sites it depends on.","opts":["While","Owing to","Unless","So that"],"a":0,"why":"'While + -ing' admits one point and then contrasts it with another. The others give a cause, a condition or a purpose, which do not fit."},{"kind":"cohesion","q":"Which sentence best fills the gap? 'Coral reefs support around a quarter of all marine species. ___ Protecting them is therefore a priority for ocean conservation.'","opts":["Yet they cover less than one per cent of the ocean floor.","For example, many tourists enjoy snorkelling.","However, coral reefs are of little importance to fish.","As a result, reefs need no protection at all."],"a":0,"why":"Only the first adds a fact that strengthens the case: so much life in so small an area makes reefs a priority. The others are off topic or contradict the point."},{"kind":"wordform","q":"Many historic buildings are ___ (replace), so damaging them means losing them for ever.","opts":["irreplaceable","replaceable","replacement","replacing"],"a":0,"why":"We need a negative adjective meaning 'impossible to replace': irreplaceable, which matches 'losing them for ever'."},{"kind":"mainidea","q":"Which heading best fits this paragraph? 'In the past, many zoos kept animals mainly to entertain the public. Today, the best zoos see their role differently. They run breeding programmes for threatened species, fund conservation work in the wild and teach visitors about the challenges that animals face.'","opts":["How the role of zoos has changed","Why animals should never be kept in zoos","The most popular animals in zoos","How to plan a family day out"],"a":0,"why":"The paragraph contrasts zoos 'in the past' with what the best zoos do 'today'."},{"kind":"collocation","q":"The government has ___ a ban on building within one kilometre of the coast.","opts":["imposed","made","done","put out"],"a":0,"why":"We 'impose a ban' (or restrictions), meaning we officially introduce it; 'made', 'done' and 'put out' do not go with 'ban'."}],"writing":[{"kind":"paragraph","sents":["Mass tourism presents a serious dilemma for those who look after historic sites.","On the one hand, visitors' ticket fees often provide the funds needed to maintain fragile buildings.","On the other hand, the sheer number of visitors can wear away floors, damage paintings and increase pollution.","To resolve this tension, many sites now limit daily visitor numbers or require tickets to be booked in advance.","Such measures allow heritage to be enjoyed without being destroyed by its own popularity."]},{"kind":"paragraph","sents":["Protecting habitats is generally more effective than trying to save individual species.","When a forest or wetland is preserved, every plant and animal that depends on it benefits at the same time.","By contrast, programmes that focus on a single species can be extremely expensive and may fail if the wider habitat continues to decline.","For this reason, many conservationists argue that funding should be directed towards protecting whole ecosystems."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'People should look after old buildings better because they're really important.'?","opts":["Historic buildings merit greater protection, as they embody a society's cultural identity and history.","People should take better care of old buildings because they're super important.","Old buildings are important and stuff, so look after them.","Every old building in the world must be kept exactly as it is for ever."],"a":0,"why":"The first is formal and specific about why buildings matter ('embody a society's cultural identity'). The others are informal or make an extreme, absolute claim."},{"kind":"topic","q":"Which topic sentence fits best? '___ Around a small island off the coast of England, fishing has been banned since 2003, and lobsters there have since become larger and more numerous. Similar no-fishing zones elsewhere have seen fish populations grow.'","opts":["Protecting areas of sea from fishing can allow marine life to recover.","Lobsters are a popular and expensive seafood.","England has many small islands around its coast.","The sea is full of fish and other creatures."],"a":0,"why":"Both examples show sea life recovering after fishing stops. The others mention a minor detail of the example or are far too general."},{"kind":"thesis","q":"Some people think that historic buildings should be preserved at all costs, while others believe they should be replaced with modern buildings when necessary. Discuss both views and give your own opinion. Which is the clearest thesis statement?","opts":["While not every old building can be saved, I would argue that structures of genuine historical or architectural value should be preserved, as they are irreplaceable once lost.","Historic buildings are often found in the centres of old towns.","Old buildings are ugly, so knock them all down.","There are many different opinions about buildings, both old and new."],"a":0,"why":"The first balances both views and states a clear, reasoned position. The others state a fact, give an informal and extreme view, or avoid answering."}]}]}];
const SPEAKING = {"cards":[{"id":"explorer-1","stage":4,"topic":"Describe a place you like to visit at the weekend","points":["where it is","who you go there with","what you do there","and explain why you like it"],"phrases":["One place I really love going to is…","It only takes about twenty minutes to get there by…","I usually go there with…","My favourite part is…, where you can…","What I like most about it is that…"],"model":"One place I really love going to at the weekend is the science museum in the centre of my city. It's a big old building next to the river, and it only takes about twenty minutes to get there by bus.\nI usually go there with my dad and my little brother. We always start on the top floor, because that's where the space exhibition is. You can see real meteorites, which are rocks that fell from space, and a huge model of a rocket. My favourite part is the area downstairs, where you can do simple experiments. I've tried most of them now, but I still love the one about electricity.\nWhat I like most about the museum is that I learn something new every time I go. Actually, it doesn't feel like school at all, because you can touch things and ask lots of questions. It's also free, so we can go as often as we want.","part3":["What kinds of places do families in your country like to visit at the weekend?","Do you think museums should be free for everyone? Why or why not?","Is it better to spend your free time indoors or outdoors? Why?"]},{"id":"explorer-2","stage":4,"topic":"Describe a person in your family who you admire","points":["who this person is","what they are like","what you do together","and explain why you admire them"],"phrases":["I'd like to talk about my…, who is…","She's a very kind and patient person, and…","When I visit her, we often…","The main reason I admire her is that…","I hope I'll be like her when I'm older."],"model":"I'd like to talk about my grandmother, who is my mum's mother. She's seventy-two years old and she lives just t

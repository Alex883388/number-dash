rt learning a foreign language at primary school. Others think it is better to start at secondary school. Discuss both views and give your opinion.' Which is the clearest thesis statement?","opts":["Although older pupils may learn grammar faster, I believe children should start at primary school, when they pick up new sounds more easily.","Foreign languages are taught in many schools.","Primary school and secondary school are both important.","Learning languages is, like, really useful for holidays!"],"a":0,"why":"The best thesis mentions both views and gives a clear opinion with a reason. The others give a fact, avoid the question or are too chatty."}]},{"id":"achiever-3","title":"Science and discovery","emoji":"🔬","words":[{"w":"hypothesis","def":"an idea that scientists test to find out whether it is true","ex":"Her ___ was that plants grow faster with music, so she tested it.","pos":"noun"},{"w":"evidence","def":"facts or signs that show that something is true","ex":"Fossils give us ___ that dinosaurs once lived here.","pos":"noun","pic":"🦴","syn":["proof"]},{"w":"breakthrough","def":"an important discovery that solves a problem or opens a new way forward","ex":"The first vaccine was a major ___ in medicine.","pos":"noun","pic":"💉"},{"w":"analyse","def":"to study something in detail to understand or explain it","ex":"Back at the lab, the scientists will ___ the rock samples.","pos":"verb","forms":{"noun":"analysis","verb":"analyse"}},{"w":"laboratory","def":"a room or building where scientists do experiments","ex":"The ___ was full of test tubes and microscopes.","pos":"noun","pic":"🧪"},{"w":"accidentally","def":"by chance, without planning to","ex":"Fleming ___ discovered penicillin when mould grew on one of his dishes.","pos":"adv","ant":["deliberately"],"forms":{"noun":"accident","adj":"accidental","adv":"accidentally"}},{"w":"observe","def":"to watch something carefully to learn about it","ex":"Galileo used a telescope to ___ the moons of Jupiter.","pos":"verb","pic":"🔭","syn":["watch"],"forms":{"noun":"observation","verb":"observe"}},{"w":"theory","def":"an idea or set of ideas that explains why something happens","ex":"Darwin's ___ of evolution changed how we understand living things.","pos":"noun"},{"w":"species","def":"a group of animals or plants of the same type","ex":"Scientists discover thousands of new ___ of insects every year.","pos":"noun","pic":"🐞"},{"w":"conclusion","def":"what you decide is true after looking at all the facts","ex":"After the experiment, we wrote our ___ at the bottom of the page.","pos":"noun","forms":{"noun":"conclusion","verb":"conclude"}},{"w":"investigate","def":"to try to find out all the facts about something","ex":"The team will ___ how dolphins use sounds to find food.","pos":"verb","pic":"🐬","forms":{"noun":"investigation","verb":"investigate"}},{"w":"curious","def":"wanting to know or learn about something","ex":"Young children are naturally ___ and ask lots of questions.","pos":"adj","pic":"🤔","forms":{"noun":"curiosity","adj":"curious","adv":"curiously"}},{"w":"data","def":"facts and numbers that are collected so that they can be studied","ex":"The weather station collects ___ on rain, wind and temperature every hour.","pos":"noun","pic":"📊"},{"w":"method","def":"a particular way of doing something","ex":"Scientists must describe their ___ so that others can repeat the experiment.","pos":"noun","syn":["way"]},{"w":"sample","def":"a small amount of something that is tested or examined","ex":"The astronauts brought back a ___ of rock from the Moon.","pos":"noun"},{"w":"conduct","def":"to organise and do something, such as an experiment or a survey","ex":"Our class will ___ a survey about how pupils travel to school.","pos":"verb"},{"w":"prove","def":"to show that something is true by giving facts","ex":"On the Moon, an astronaut dropped a hammer and a feather to ___ that they fall at the same speed.","pos":"verb","forms":{"noun":"proof","verb":"prove"}},{"w":"reveal","def":"to show something that was hidden or not known before","ex":"Photos from the new telescope ___ galaxies that nobody has ever seen before.","pos":"verb","syn":["show"],"ant":["hide"]},{"w":"pioneer","def":"one of the first people to do something new or to develop a new area of knowledge","ex":"Marie Curie was a ___ in the study of radioactivity.","pos":"noun"},{"w":"dissolve","def":"to mix completely with a liquid and disappear into it","ex":"If you stir the tea, the sugar will ___ more quickly.","pos":"verb"}],"grammar":[{"q":"If Fleming had cleaned his dishes before his holiday, he ___ penicillin.","opts":["might not have discovered","might not discover","would not discover","had not discovered"],"a":0,"why":"In the third conditional, the result uses would/might + have + past participle."},{"q":"These footprints are 70 million years old. The dinosaur that made them ___ very heavy.","opts":["must have been","should have been","can have been","must be"],"a":0,"why":"'Must have been' shows we are sure about something in the past because of the evidence."},{"q":"You ___ your results before you wrote your conclusion. Now it is full of mistakes.","opts":["should have checked","must have checked","should check","might checked"],"a":0,"why":"'Should have' + past participle means it was a good idea, but you didn't do it."},{"q":"Penicillin, ___ was discovered in 1928, has saved millions of lives.","opts":["which","that","who","what"],"a":0,"why":"Use 'which' for a thing in a non-defining clause (between commas). 'That' is not used after a comma."},{"q":"Marie Curie, ___ work on radioactivity earned her two Nobel Prizes, was born in Poland.","opts":["whose","who","which","that"],"a":0,"why":"'Whose' shows that something belongs to someone: her work."},{"q":"The rock samples ___ in the laboratory at the moment.","opts":["are being tested","are testing","are tested","have tested"],"a":0,"why":"Someone is testing the samples right now, so use the present continuous passive: are being tested."},{"q":"The results ___ checked more carefully before they were published.","opts":["should have been","should have","must be","should been"],"a":0,"why":"The results didn't check themselves, so use a modal perfect in the passive: should + have been + past participle."},{"q":"The journalist asked the scientist what ___ next.","opts":["she would study","would she study","will she study","she will to study"],"a":0,"why":"In a reported question, use normal word order (she would study), not question order, and move 'will' back to 'would'."},{"q":"Cambridge, ___ Isaac Newton studied, has one of the oldest universities in the world.","opts":["where","which","that","when"],"a":0,"why":"Use 'where' for a place in a non-defining clause when a full clause follows (Newton studied there)."},{"q":"My little brother is so curious! I wish he ___ stop asking 'Why?' all the time.","opts":["would","will","can","is going to"],"a":0,"why":"Use 'wish' + would to complain about something annoying that someone keeps doing."}],"sentences":["Scientists must have made a mistake in their calculations.","The results of the experiment have been checked by three scientists.","Do you know who discovered the four largest moons of Jupiter?","I should have asked my teacher for help.","The results should have been checked more carefully.","Ada Lovelace was a pioneer of computer programming."],"reading":[{"title":"The mould that changed medicine","text":"In September 1928, the Scottish scientist Alexander Fleming returned to his laboratory in London after a summer holiday. Before leaving, he had stacked several dishes of bacteria on a bench. When he examined them, he noticed something unusual. A blue-green mould had grown on one dish, and around it there was a clear ring where the bacteria had been killed.\n\nFleming was curious rather than annoyed. He grew more of the mould and found that it produced a substance that could destroy many harmful bacteria. He named it penicillin. However, he struggled to produce it in large amounts, and for about ten years his discovery received little attention.\n\nThe breakthrough came at the University of Oxford, where a team led by Howard Florey and Ernst Chain found a way to purify penicillin. In 1941, they tested it on patients, and the results were remarkable. By the mid-1940s, penicillin was being produced in huge quantities, and in 1945 Fleming, Florey and Chain shared the Nobel Prize.\n\nFleming's story is often told as a lucky accident, and luck certainly played a part. But the mould only mattered because a scientist was paying attention. Many people might have thrown the dish away without a second thought.","qs":[{"type":"mc","q":"What is the main point of the last paragraph?","opts":["Luck alone does not explain the discovery.","Fleming was the luckiest scientist in history.","Scientists should never throw dishes away.","The Oxford team deserved more credit than Fleming."],"a":0},{"type":"tfng","q":"Fleming noticed the mould while he was on holiday.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Fleming found it difficult to make large quantities of penicillin.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Florey and Chain had worked with Fleming before 1928.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What did the Oxford team achieve?","opts":["They found a way to purify penicillin.","They discovered the blue-green mould.","They won the Nobel Prize without Fleming.","They proved that the mould was harmful."],"a":0}]},{"title":"The fossil hunter of Lyme Regis","text":"Two hundred years ago, the cliffs near Lyme Regis, a small town on the south coast of England, were an exciting place for collectors. Every winter, storms washed away parts of the cliffs and uncovered the remains of creatures that had lived millions of years earlier.\n\nMary Anning, who was born in the town in 1799, spent much of her childhood searching these beaches. Her family was poor, and they sold the fossils they found to visitors. When Mary was about twelve, she and her brother discovered the skeleton of an ichthyosaur, a sea reptile that looked a little like a dolphin. Later, she found the first complete skeleton of a plesiosaur, an animal with a long neck and four large flippers.\n\nThese finds were important evidence that some species had died out long ago, an idea that many people at the time found hard to accept. Famous scientists travelled to Lyme Regis to ask Mary's opinion. However, because she was a woman, she was not allowed to join the Geological Society of London, and her discoveries were often described by men who took the credit.\n\nToday, Mary Anning is recognised as a pioneer of science. In 2022, a statue of her was unveiled in her home town.","qs":[{"type":"mc","q":"What is the writer's main purpose?","opts":["to tell the story of an important fossil hunter","to warn readers about storms on the coast","to explain how fossils are formed","to describe the town of Lyme Regis today"],"a":0},{"type":"tfng","q":"Mary Anning's family earned money from fossils.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Mary Anning was a member of the Geological Society of London.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Mary Anning wrote several books about her discoveries.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"Why were Mary's finds important?","opts":["They showed that some animals had died out long ago.","They proved that dolphins are reptiles.","They turned Lyme Regis into a big city.","They were the first fossils ever found."],"a":0}]}],"extra":[{"kind":"collocation","q":"Before the trip, the class ___ some research on the island's birds.","opts":["did","made","took","had"],"a":0,"why":"We say 'do research' (or 'carry out research'), not 'make research'."},{"kind":"wordform","q":"Her careful ___ of the data showed a clear pattern. (analyse)","opts":["analysis","analyse","analytical","analysed"],"a":0,"why":"After 'Her careful' we need a noun: analysis."},{"kind":"paraphrase","q":"Which sentence means the same as 'The results were not what the team had expected'?","opts":["The team was surprised by the results.","The team knew what the results would be.","The experiment had no results.","The team did not carry out the experiment."],"a":0,"why":"If the results were not what they expected, the results surprised them."},{"kind":"linking","q":"Some scientists work in laboratories, ___ others spend most of their time outdoors.","opts":["whereas","despite","because of","so that"],"a":0,"why":"'Whereas' compares two different facts or groups of people."},{"kind":"preposition","q":"Marie Curie is famous ___ her research on radioactivity.","opts":["for","of","with","about"],"a":0,"why":"We say 'famous for' something."},{"kind":"mainidea","q":"Read the paragraph: 'Many great discoveries began with a simple question. Isaac Newton is said to have wondered why apples fall straight down. Charles Darwin asked why birds on different islands had different beaks. Their curiosity led to ideas that changed science.' Which heading fits best?","opts":["Curiosity drives discovery","The life of Isaac Newton","Birds of faraway islands","Why apples fall from trees"],"a":0,"why":"The paragraph uses two examples to make one point: asking questions leads to discoveries."},{"kind":"register","q":"Which sentence is the most suitable for a science report?","opts":["The temperature of the water was measured every ten minutes.","We checked how hot the water was loads of times.","The water got really hot, which was so cool!","Basically, we just kept looking at the water."],"a":0,"why":"Science reports are formal and precise. They often use the passive and avoid chatty words like 'loads of' and 'basically'."},{"kind":"cohesion","q":"Which sentence best fills the gap? 'First, we filled three glasses with water at different temperatures. ___ Finally, we timed how long the sugar took to dissolve in each one.'","opts":["Next, we added a spoonful of sugar to each glass.","Sugar is bad for your teeth.","However, water is a liquid.","In conclusion, the experiment was fun."],"a":0,"why":"'First', 'Next' and 'Finally' show the order of the steps. The missing step comes between filling the glasses and timing the sugar."},{"kind":"phrasal","q":"The scientists ___ an experiment to test their hypothesis.","opts":["carried out","carried away","put out","gave off"],"a":0,"why":"'Carry out' an experiment means do it. 'Put out' a fire means stop it burning."},{"kind":"collocation","q":"Scientists have ___ great progress in understanding how the brain works.","opts":["made","done","taken","had"],"a":0,"why":"We say 'make progress', not 'do progress'."}],"writing":[{"kind":"paragraph","sents":["Scientists usually follow a series of steps when they investigate a question.","First, they suggest a hypothesis, which is an idea that can be tested.","Next, they design an experiment and carefully collect data.","After analysing the results, they decide whether the data supports their hypothesis.","Finally, they share their findings so that other scientists can check them."]},{"kind":"paragraph","sents":["The invention of the telescope completely changed our understanding of space.","In 1610, Galileo used one to discover four moons travelling around Jupiter.","This was important evidence that not everything in the sky goes around the Earth.","As telescopes became more powerful, astronomers found new planets, such as Uranus and Neptune.","Today, space telescopes reveal galaxies that are billions of light years away."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'The scientists did a test and found out some stuff.'?","opts":["The scientists conducted an experiment and made an important discovery.","The scientists did a test and found out loads.","The scientists did something and found things.","Basically, the scientists tested stuff."],"a":0,"why":"'Conducted an experiment' and 'made an important discovery' are precise. 'Loads', 'things', 'basically' and 'stuff' are vague or chatty."},{"kind":"topic","q":"Read the rest of a paragraph: 'Penicillin was found after mould grew on a dish that had been left out by mistake. Similarly, the microwave oven was invented after an engineer noticed that a chocolate bar in his pocket had melted.' Which topic sentence fits best?","opts":["Some important discoveries have happened partly by accident.","Chocolate melts easily in warm places.","Penicillin is a kind of medicine.","Science is really hard, to be honest."],"a":0,"why":"Both examples are discoveries that began with an accident, so the topic sentence must say this. The others are off topic, too narrow or chatty."},{"kind":"thesis","q":"Essay question: 'Some people think that money spent on scientific research is wasted unless it leads to practical results. To what extent do you agree or disagree?' Which is the clearest thesis statement?","opts":["I strongly disagree, because many practical inventions began with research that seemed to have no immediate use.","Scientists work in laboratories and wear white coats.","Research is a thing that costs money.","There are many types of science, such as biology and chemistry."],"a":0,"why":"The best thesis gives a clear position and a reason. The others describe science but do not answer the question."}]},{"id":"achiever-4","title":"Cities of the future","emoji":"🏙️","words":[{"w":"urban","def":"connected with towns and cities","ex":"More than half of the world's people now live in ___ areas.","pos":"adj","pic":"🌆","ant":["rural"]},{"w":"affordable","def":"cheap enough for most people to pay for","ex":"Young families need ___ homes near good schools.","pos":"adj","ant":["expensive"],"forms":{"verb":"afford","adj":"affordable"}},{"w":"infrastructure","def":"the basic systems a place needs, such as roads, railways, water pipes and power lines","ex":"The town needs better ___ before thousands of new homes are built.","pos":"noun","pic":"🌉"},{"w":"congestion","def":"a situation in which there is too much traffic on the roads","ex":"Road ___ is worst in the morning, when everyone drives to work.","pos":"noun","pic":"🚗"},{"w":"pedestrian","def":"a person who is walking in the street, not driving or riding","ex":"The square is closed to cars, so every ___ can walk safely.","pos":"noun","pic":"🚶"},{"w":"commute","def":"to travel regularly between your home and your work or school","ex":"My mum has to ___ for an hour to get to her office.","pos":"verb","pic":"🚆","forms":{"noun":"commuter","verb":"commute"}},{"w":"skyscraper","def":"a very tall building in a city","ex":"From the top of the ___, the cars below looked like toys.","pos":"noun","pic":"🏢"},{"w":"resident","def":"a person who lives in a particular place","ex":"Every ___ of our street was invited to the meeting about the new park.","pos":"noun","pic":"🏘️"},{"w":"vertical","def":"going straight up, not across","ex":"A ___ farm grows vegetables on many floors inside a building.","pos":"adj","ant":["horizontal"]},{"w":"overcrowded","def":"with too many people in one place","ex":"The train was so ___ that we had to stand all the way.","pos":"adj","syn":["packed"]},{"w":"driverless","def":"able to move without a person controlling it","ex":"In some cities, ___ trains already carry passengers.","pos":"adj","pic":"🚝"},{"w":"green space","def":"an area of grass, trees or plants in a town, such as a park","ex":"The new estate has plenty of ___ where children can play.","pos":"noun","pic":"🌳"},{"w":"public transport","def":"buses, trains and trams that everyone can pay to use","ex":"Many teenagers use ___ to get to school because they are too young to drive.","pos":"noun","pic":"🚌"},{"w":"population","def":"the number of people who live in a place","ex":"The ___ of the world is now more than eight billion.","pos":"noun"},{"w":"suburb","def":"an area where people live on the edge of a city, away from the centre","ex":"We live in a quiet ___ and take the train into the city centre.","pos":"noun","forms":{"noun":"suburb","adj":"suburban"}},{"w":"neighbourhood","def":"the area around your home, and the people who live in it","ex":"Our ___ has a library, a park and lots of small shops.","pos":"noun"},{"w":"housing","def":"buildings for people to live in, such as homes and flats","ex":"The city needs more affordable ___ for young families.","pos":"noun"},{"w":"demolish","def":"to knock down a building completely","ex":"They had to ___ the old factory because it was no longer safe.","pos":"verb","forms":{"noun":"demolition","verb":"demolish"}},{"w":"facilities","def":"buildings, rooms or equipment that are provided for a particular use","ex":"The new leisure centre has excellent ___, including two pools and a climbing wall.","pos":"noun"},{"w":"transform","def":"to change something completely, usually to make it better","ex":"Trees and flowers could ___ this grey street into a lovely place to walk.","pos":"verb","forms":{"noun":"transformation","verb":"transform"}}],"grammar":[{"q":"We're ___ solar panels fitted on our roof next week.","opts":["having","making","letting","doing"],"a":0,"why":"'Have something done' means another person does the job for you: we're having panels fitted."},{"q":"The city council had the old bridge ___ last year.","opts":["repaired","repair","repairing","to repair"],"a":0,"why":"In 'have something done', the verb is a past participle: had the bridge repaired."},{"q":"In the future, many cars ___ by computers instead of people.","opts":["will be driven","will drive","are driving","drove"],"a":0,"why":"Computers will do the driving, so use the future passive: will be + past participle (will be driven)."},{"q":"I wish there ___ less traffic outside my school.","opts":["were","is","will be","has been"],"a":0,"why":"After 'wish' about the present, use a past form: I wish there were."},{"q":"If only they ___ more parks when they built the city!","opts":["had planned","plan","will plan","have planned"],"a":0,"why":"For a regret about the past, use 'if only' + had + past participle."},{"q":"___ the city is very crowded, it has lots of green spaces.","opts":["Although","Despite","However","Because of"],"a":0,"why":"'Although' is followed by a full clause (the city is crowded). 'Despite' and 'because of' need a noun."},{"q":"We got our flat ___ before we moved in.","opts":["painted","paint","painting","to paint"],"a":0,"why":"'Get something done' is like 'have something done': someone else did the job. Use the past participle: painted."},{"q":"The old car park ___ next year to make room for a playground.","opts":["is going to be demolished","is going to demolish","has been demolished","was demolished"],"a":0,"why":"It will happen in the future, and the car park doesn't demolish anything, so use the passive: is going to be demolished."},{"q":"Many people now work from home, ___ means there is less traffic in the rush hour.","opts":["which","that","what","who"],"a":0,"why":"After a comma, 'which' can refer back to a whole idea. 'That' and 'what' cannot be used like this."},{"q":"If the city ___ the new tram line, the traffic would have got even worse.","opts":["hadn't built","didn't build","wouldn't build","hasn't built"],"a":0,"why":"Third conditional: if + had (not) + past participle, then would have + past participle."}],"sentences":["We had our bikes checked at the shop.","Vegetables can be grown on the roofs of buildings.","I wish more people would cycle to work.","Do you think driverless cars will make our roads safer?","The old car park is going to be turned into a playground.","Good public transport means that fewer people need to drive."],"reading":[{"title":"A city in a garden","text":"Imagine a city where giant metal trees light up at night and tall buildings are covered in plants. This is not science fiction: it is Singapore, one of the most crowded places on Earth.\n\nSingapore is a small island with millions of residents, so there is very little room to spread out. Instead of losing its nature, however, the city decided to grow upwards. Many skyscrapers now have gardens on their roofs or plants climbing up their walls. These green walls do more than look attractive. They help to keep the buildings cool, which means less electricity is needed for air conditioning.\n\nThe most famous example is Gardens by the Bay, which opened in 2012. Its 18 'Supertrees' are between 25 and 50 metres tall and are covered in thousands of living plants. Some of them have solar panels on top, and they also collect rainwater for the gardens. In the evening, visitors can walk along a high bridge between some of the trees and enjoy a show of light and music.\n\nPlanners in other countries are studying Singapore's ideas carefully. Although every city is different, many of them face the same problem: how to make room for more people without losing the green spaces that keep residents healthy and happy.","qs":[{"type":"mc","q":"What is the main idea of the text?","opts":["Singapore has found ways to keep nature in a crowded city.","Singapore has the tallest trees in the world.","Skyscrapers are bad for the environment.","Solar panels work best on trees."],"a":0},{"type":"tfng","q":"Singapore has plenty of empty land for new buildings.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Plants on buildings can reduce the need for air conditioning.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Most visitors to Gardens by the Bay come from other countries.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What do some of the Supertrees collect?","opts":["rainwater","rubbish","seeds","heat from the sea"],"a":0}]},{"title":"Buses that work like trains","text":"In the 1970s, the Brazilian city of Curitiba had a problem that many growing cities face today. Its population was rising fast, and its roads were becoming more and more crowded. An underground railway was one possible answer, but it would have cost far more than the city could afford.\n\nThe city's mayor, an architect called Jaime Lerner, chose a different approach. Instead of digging tunnels, Curitiba gave its buses their own lanes along the main roads, separated from cars and lorries. Because the buses were no longer stuck in traffic jams, they could run quickly and keep to their timetables, just like trains. The first of these routes opened in 1974.\n\nLater, the city added something that became famous around the world: glass 'tube' stations. Passengers pay when they enter the tube, not when they get on the bus. The platform is at the same height as the bus floor, so passengers can step straight on board, and wheelchairs and pushchairs can roll on easily. Some of the longest buses can carry more than 200 passengers.\n\nThe idea, now known as bus rapid transit, was copied by Bogotá in Colombia and by many other cities. Today, more than 150 cities around the world have similar systems. Curitiba showed that a city does not always need the most expensive solution. Sometimes a clever idea is enough.","qs":[{"type":"mc","q":"What is the writer's main purpose?","opts":["to show how a city solved its transport problem with a cheaper idea","to describe the history of Brazil","to explain how an underground railway is built","to persuade readers to stop travelling by car"],"a":0},{"type":"tfng","q":"Curitiba decided against an underground railway mainly because of the cost.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"In Curitiba's system, passengers buy their tickets from the bus driver.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Most people in Curitiba travel to work by bus.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"Why can wheelchairs roll onto the buses easily?","opts":["The platform is level with the floor of the bus.","The buses have special ramps.","The drivers lift them on board.","The buses stop on the pavement."],"a":0}]}],"extra":[{"kind":"collocation","q":"The roads are busiest during ___ hour, when people travel to and from work.","opts":["rush","fast","hurry","quick"],"a":0,"why":"'Rush hour' is the fixed phrase for the busy time when people travel to and from work."},{"kind":"linking","q":"Big cities offer many jobs. ___, housing there is often very expensive.","opts":["However","Therefore","Moreover","For instance"],"a":0,"why":"'However' introduces a contrast: a good point followed by a problem."},{"kind":"wordform","q":"Thousands of ___ travel into London by train every morning. (commute)","opts":["commuters","commute","commuting","commuted"],"a":0,"why":"After 'Thousands of' we need a plural noun for people: commuters."},{"kind":"register","q":"Which sentence is the most suitable for a report to the city council?","opts":["Traffic congestion in the city centre has increased considerably.","The traffic in town is totally crazy these days.","There are way too many cars around now.","Honestly, driving in town is a nightmare!"],"a":0,"why":"A formal report uses precise words like 'congestion' and 'considerably' and avoids chatty language."},{"kind":"cohesion","q":"Which sentence best fills the gap? 'Cities are growing fast. ___ This means that planners must find new ways to provide homes and transport.'","opts":["By 2050, about two thirds of people may live in urban areas.","Some cities are very old.","My uncle lives in a city.","Buses and trains are types of transport."],"a":0,"why":"The missing sentence must give a fact about growth, so that 'This means...' follows logically."},{"kind":"paraphrase","q":"Which sentence means the same as 'The new park is within walking distance of most homes'?","opts":["Most people can easily walk to the new park.","Most people need a car to reach the new park.","The new park is inside most people's homes.","Walking is not allowed in the new park."],"a":0,"why":"'Within walking distance' means close enough to walk to."},{"kind":"phrasal","q":"The old cinema was ___ to make space for a new library.","opts":["pulled down","pulled up","put up","turned up"],"a":0,"why":"'Pull down' a building means destroy it. 'Put up' a building means build it."},{"kind":"preposition","q":"Our flat is close ___ the station, so I can walk there in five minutes.","opts":["to","from","at","with"],"a":0,"why":"We say 'close to' a place (or 'near' a place)."},{"kind":"mainidea","q":"Read the paragraph: 'In many cities, flat roofs are being turned into small farms. Residents grow tomatoes, herbs and salad leaves just metres above the busy streets. The plants also help to keep the buildings cool, and the gardens give neighbours a place to meet.' Which heading fits best?","opts":["Farming on city rooftops","How to grow tomatoes","The problem with flat roofs","Busy streets in big cities"],"a":0,"why":"Every sentence is about growing food on city roofs and the good things it brings."},{"kind":"wordform","q":"The council plans to ___ the city's old railway station. (modern)","opts":["modernise","modern","modernity","modernly"],"a":0,"why":"After 'plans to' we need a verb. 'Modernise' means make something more modern."}],"writing":[{"kind":"paragraph","sents":["Traffic congestion is a serious problem in many large cities.","It wastes people's time and makes the air dirtier.","One solution is to improve public transport, so that fewer people need to drive.","Another is to build safe cycle lanes, which encourage more people to travel by bike.","If cities combine both measures, their streets could become quieter, cleaner and safer."]},{"kind":"paragraph","sents":["Parks and other green spaces bring many benefits to city residents.","Above all, they give people a place to relax, exercise and meet their neighbours.","Trees also provide shade, which keeps streets cooler on hot days.","Their roots and the soil around them soak up rainwater, which can reduce flooding.","For these reasons, planners should include green spaces in every new neighbourhood."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'The city got a lot bigger over the last few years.'?","opts":["The city has grown rapidly in recent years.","The city got loads bigger lately.","The city changed in size, sort of.","The city is big now and it wasn't before."],"a":0,"why":"'Has grown rapidly in recent years' is short and precise. 'Loads', 'lately' and 'sort of' are chatty, and the last option is clumsy."},{"kind":"topic","q":"Read the rest of a paragraph: 'Sensors can show drivers where the nearest free parking space is. Street lights can dim themselves automatically when nobody is around, which saves energy.' Which topic sentence fits best?","opts":["Technology is helping cities to run more efficiently.","Driving in cities is very stressful.","Street lights were first used hundreds of years ago.","Parking is so annoying!"],"a":0,"why":"Both sentences are examples of technology making a city work better. The others are off topic or too chatty."},{"kind":"thesis","q":"Essay question: 'In many cities, more and more people live in tall apartment buildings. Is this a positive or a negative development?' Which is the clearest thesis statement?","opts":["I believe tall apartment buildings are mainly positive, because they house many people while leaving more land for parks.","Some buildings in cities are very tall.","My cousin lives on the tenth floor of a building.","Tall buildings are both positive and negative, and there are lots of things to say."],"a":0,"why":"The best thesis gives a clear answer and a reason. The others state a fact, tell a story or stay vague."}]},{"id":"achiever-5","title":"Sport and teamwork","emoji":"🤝","words":[{"w":"teammate","def":"a person who is in the same team as you","ex":"She passed the ball to a ___, who scored the winning goal.","pos":"noun","pic":"⚽"},{"w":"opponent","def":"the person or team that you play against","ex":"At the end of the match, she shook hands with her ___.","pos":"noun","pic":"🎾","syn":["rival"]},{"w":"cooperate","def":"to work together with other people to reach the same goal","ex":"In a rowing race, all eight rowers must ___ perfectly to move the boat fast.","pos":"verb","pic":"🚣","forms":{"noun":"cooperation","verb":"cooperate","adj":"cooperative"}},{"w":"tactics","def":"plans for how to win a game or reach a goal","ex":"At half-time, the coach changed the team's ___.","pos":"noun","pic":"📋"},{"w":"referee","def":"the person who makes sure players follow the rules in a match","ex":"The ___ blew the whistle to start the second half.","pos":"noun"},{"w":"determination","def":"the quality of not giving up, even when something is difficult","ex":"With hard work and ___, she finally won the race.","pos":"noun","forms":{"noun":"determination","adj":"determined"}},{"w":"stamina","def":"the physical energy to keep going for a long time","ex":"Marathon runners need great ___ to run for 42 kilometres.","pos":"noun","pic":"🏃"},{"w":"injury","def":"harm done to a person's body, for example in an accident or a game","ex":"He missed three matches because of a knee ___.","pos":"noun","pic":"🩹","forms":{"noun":"injury","verb":"injure","adj":"injured"}},{"w":"motivate","def":"to make someone want to do something and work hard at it","ex":"A good captain knows how to ___ the team when they are losing.","pos":"verb","forms":{"noun":"motivation","verb":"motivate"}},{"w":"spectator","def":"a person who watches a sports event","ex":"Every ___ in the stadium stood up and cheered.","pos":"noun","pic":"🏟️","syn":["viewer"]},{"w":"compete","def":"to take part in a contest and try to win it","ex":"Athletes from more than 200 countries ___ at the Olympic Games.","pos":"verb","pic":"🏅","forms":{"noun":"competition","verb":"compete","adj":"competitive"}},{"w":"sportsmanship","def":"fair, kind and polite behaviour in sport, even when you lose","ex":"Helping an opponent who has fallen is a great example of ___.","pos":"noun"},{"w":"athlete","def":"a person who trains hard to take part in sports, especially running, jumping and throwing","ex":"The ___ trained for four years to compete in the Olympic Games.","pos":"noun","forms":{"noun":"athlete","adj":"athletic"}},{"w":"tournament","def":"a competition in which many players or teams play a series of games to find one winner","ex":"Sixteen schools took part in the netball ___.","pos":"noun"},{"w":"victory","def":"the act of winning a game or a competition","ex":"The fans cheered loudly after the team's 2-0 ___.","pos":"noun","syn":["win"],"ant":["defeat"]},{"w":"trophy","def":"a cup or other prize that is given to the winner of a competition","ex":"The captain lifted the ___ high above her head.","pos":"noun","pic":"🏆"},{"w":"qualify","def":"to win a place in the next stage of a competition by doing well","ex":"She must run 100 metres in under 12 seconds to ___ for the national championships.","pos":"verb","forms":{"noun":"qualification","verb":"qualify"}},{"w":"amateur","def":"doing a sport for fun, not as a paid job","ex":"My uncle plays for an ___ football team on Sunday mornings.","pos":"adj","ant":["professional"]},{"w":"warm up","def":"to do gentle exercise to get your body ready for sport","ex":"Always ___ for ten minutes before you start running fast.","pos":"verb"},{"w":"physical","def":"connected with the body rather than the mind","ex":"Rugby is a very ___ sport, so players need to be strong.","pos":"adj","ant":["mental"]}],"grammar":[{"q":"If our goalkeeper ___ that penalty, we would have won the cup.","opts":["had saved","saved","would save","has saved"],"a":0,"why":"Third conditional: if + had + past participle, then would have + past participle."},{"q":"I'm not sure why Ella missed training. She ___ ill.","opts":["might have been","must have be","should have been","can't be"],"a":0,"why":"'Might have been' shows a possibility in the past. We are not sure, so 'must' and 'can't' are too certain."},{"q":"The coach ___ that we should drink more water during matches.","opts":["recommended","told","encouraged","advised to"],"a":0,"why":"'Recommend' can be followed by 'that'. 'Tell' and 'encourage' need a person first (told us, encouraged us)."},{"q":"The stadium ___ for the final, so it looks brand new.","opts":["has been repainted","has repainted","is repainting","had repainted"],"a":0,"why":"The stadium didn't paint anything, so use the passive. The result is clear now, so use the present perfect passive."},{"q":"Wembley Stadium, ___ the FA Cup Final is played, can hold 90,000 people.","opts":["where","which","that","who"],"a":0,"why":"Use 'where' for a place when a full clause follows (the final is played there)."},{"q":"Despite ___ a goal down at half-time, the team won 3-1.","opts":["being","they were","be","was"],"a":0,"why":"'Despite' is followed by a noun or an -ing form, not by a full clause."},{"q":"I wish I ___ my football boots. I had to play in my trainers!","opts":["had brought","brought","have brought","would bring"],"a":0,"why":"For a regret about the past, use 'wish' + had + past participle: I wish I had brought."},{"q":"Our team ___ new shirts designed for the tournament.","opts":["had","made","let","did"],"a":0,"why":"'Have something done': the team didn't design the shirts themselves; someone else did it for them."},{"q":"The coach promised that she ___ give us extra training before the final.","opts":["would","is going","has","was"],"a":0,"why":"In reported speech, 'will' usually becomes 'would': 'I will give you...' becomes 'she would give us...'."},{"q":"They lost 10-0. Their defenders ___ practised very much this week.","opts":["can't have","mustn't have","shouldn't","couldn't"],"a":0,"why":"'Can't have' + past participle shows we are almost sure that something did not happen."}],"sentences":["The coach told us to pass the ball more quickly.","Our goalkeeper, whose gloves were too big, kept dropping the ball.","The stadium will be opened by the team captain.","Do you know how many players there are in a rugby team?","I wish I had brought my football boots.","Only the best teams will qualify for the final."],"reading":[{"title":"Winning together","text":"The Tour de France is one of the toughest races in the world. Every July, about 170 cyclists ride more than 3,000 kilometres around France in three weeks. It may look like a contest between individuals, but no rider could win it alone.\n\nEach team has eight riders, and usually only one of them has a real chance of winning. Most of the others are known as 'domestiques', a French word meaning 'servants'. Their job is to help their leader. They fetch water bottles and food from the team car, ride in front of the leader to block the wind and, if the leader's bike breaks, they may even hand over their own.\n\nRiding just behind another cyclist takes much less effort than riding at the front, because the rider in front pushes through the air. Domestiques take turns at the front so that their leader can save energy for the hardest mountain climbs. By the final week, many of them are exhausted, having spent their strength on someone else's success.\n\nDespite this, domestiques are highly respected by fans and other riders, who know that the race is rarely won by one person. The winner wears the famous yellow jersey in Paris, but the whole team has earned it.","qs":[{"type":"mc","q":"Why did the writer write this text?","opts":["to show that winning a cycling race depends on a whole team","to explain how to repair a racing bike","to describe the mountains of France","to persuade readers to become professional cyclists"],"a":0},{"type":"tfng","q":"Most riders in a team expect to win the Tour de France.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Cycling just behind another rider is easier than cycling at the front.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Domestiques often become team leaders later in their careers.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"What does the French word 'domestique' mean?","opts":["servant","leader","cyclist","winner"],"a":0}]},{"title":"Two seconds of teamwork","text":"In a Formula One race, drivers usually have to stop at least once to change their tyres. These stops take place in the pit lane, and every second counts: a slow stop can cost a driver several places, while a fast one can help them win.\n\nA modern pit stop is one of the most impressive examples of teamwork in sport. Around twenty mechanics surround the car the moment it stops, and each of them has just one job. Two of them lift the car at the front and back. At each wheel, three people work together: one removes the wheel nut, one pulls off the old wheel and one fits the new one. The best teams can change all four wheels in just over two seconds.\n\nSuch speed does not happen by chance. Teams practise pit stops hundreds of times during a season, and they study videos to see where they can save a fraction of a second. If one person makes even a tiny mistake, the whole stop is slowed down.\n\nDrivers receive the trophies and most of the attention. However, many of them say that a race is never won by one person alone, but by the whole team.","qs":[{"type":"mc","q":"Why did the writer write this text?","opts":["to show how teamwork makes very fast pit stops possible","to explain all the rules of Formula One","to persuade readers to become racing drivers","to compare the fastest drivers in history"],"a":0},{"type":"tfng","q":"Each mechanic in a pit stop has several different jobs.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Teams watch videos of their pit stops to find ways to be faster.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Pit stop mechanics are paid more than other members of the team.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"How many people work on each wheel during a pit stop?","opts":["three","two","four","twenty"],"a":0}]}],"extra":[{"kind":"idiom","q":"We were losing 2-0, but we didn't ___, and in the end we drew 2-2.","opts":["throw in the towel","hit the roof","cost an arm and a leg","spill the beans"],"a":0,"why":"'Throw in the towel' means give up."},{"kind":"collocation","q":"Our team ___ the match 3-1.","opts":["won","beat","gained","earned"],"a":0,"why":"You win a match or a game, but you beat a person or a team."},{"kind":"phrasal","q":"The final was ___ until Sunday because of the storm.","opts":["put off","put up","taken off","called up"],"a":0,"why":"'Put off' means move an event to a later time."},{"kind":"wordform","q":"Swimming is a very ___ sport at our school: everyone wants to win. (compete)","opts":["competitive","competition","competitor","competing"],"a":0,"why":"We need an adjective after 'very' to describe the sport: competitive."},{"kind":"linking","q":"___ he had a sore ankle, Leo played the whole match.","opts":["Even though","Despite","In spite","However"],"a":0,"why":"'Even though' is followed by a full clause (he had a sore ankle). 'Despite' and 'in spite of' need a noun or an -ing form."},{"kind":"cohesion","q":"Which sentence best completes the paragraph? 'Team sports teach children many useful skills. They learn to communicate clearly and to trust others. ___'","opts":["They also learn how to deal with losing as well as winning.","However, football was invented in England.","Tennis players usually play alone.","As a result, stadiums are very large."],"a":0,"why":"The last sentence adds one more skill, so it continues the same idea with 'also'."},{"kind":"paraphrase","q":"Which sentence means the same as 'The match was called off because of the snow'?","opts":["The match was cancelled because of the snow.","The match was played in the snow.","The match started late because of the snow.","The match was moved to a snowy place."],"a":0,"why":"'Call off' means cancel, so the match did not happen."},{"kind":"register","q":"Which sentence is the most suitable for a formal email to a sports club?","opts":["I would like to enquire about joining your junior tennis team.","Hey, can I join your tennis team?","I wanna play tennis with you lot.","Tennis team, here I come!"],"a":0,"why":"'I would like to enquire about...' is polite and formal. 'Hey', 'wanna' and 'you lot' are informal."},{"kind":"preposition","q":"She was very proud ___ her team's performance in the final.","opts":["of","for","with","about"],"a":0,"why":"We say 'proud of' someone or something."},{"kind":"mainidea","q":"Read the paragraph: 'Team sports can help children in many ways. They learn to set goals, manage their time and keep going when things are difficult. Playing with others also helps them to make friends and feel part of a group.' Which heading fits best?","opts":["The benefits of team sports","How to score more goals","Why sport is so difficult","The history of team sports"],"a":0,"why":"The first sentence gives the main idea, and the rest lists ways in which team sports help children."}],"writing":[{"kind":"paragraph","sents":["Successful football teams depend on teamwork rather than on one star player.","Even the most talented striker cannot score without good passes from teammates.","Similarly, defenders must cooperate closely to stop the other team from attacking.","This is why coaches spend so much time practising tactics with the whole team.","In the end, a group that plays together will usually beat a group of individuals."]},{"kind":"paragraph","sents":["The modern Olympic Games began in Athens in 1896.","At those first Games, fewer than 300 athletes from 14 countries took part.","Since then, the Games have grown into one of the biggest sporting events in the world.","Today, more than 10,000 athletes from over 200 countries compete.","However, the aim is still the same: to bring people together through sport."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Our team played really badly and lost by loads.'?","opts":["Our team performed poorly and suffered a heavy defeat.","Our team was rubbish and lost massively.","Our team did bad and lost by a lot.","Our team played and lost, which was not good."],"a":0,"why":"'Performed poorly' and 'a heavy defeat' are precise. 'Rubbish' and 'massively' are slang, 'did bad' is wrong, and the last option is vague."},{"kind":"topic","q":"Read the rest of a paragraph: 'Regular training builds stamina and strength. Just as importantly, playing in a team teaches young people how to cooperate and how to cope with losing.' Which topic sentence fits best?","opts":["Playing sport has both physical and social benefits for young people.","Many sports are played with a ball.","Losing a match is never fun.","Sport is awesome and I love it!"],"a":0,"why":"The paragraph gives one benefit for the body and one for getting on with others, so the topic sentence must mention both. The others are off topic, too narrow or chatty."},{"kind":"thesis","q":"Essay question: 'Some people think that professional athletes are paid too much money. Do you agree or disagree?' Which is the clearest thesis statement?","opts":["I agree that top athletes are paid too much, because they earn far more than doctors and nurses, whose work saves lives.","Football players are famous all over the world.","Money is important for everyone.","Athletes are paid, and some people think it is too much."],"a":0,"why":"The best thesis gives a clear position and a reason. The others are off topic, too vague or only repeat the question."}]},{"id":"achiever-6","title":"Holidays and tourism","emoji":"🏖️","words":[{"w":"destination","def":"the place that someone is travelling to","ex":"Spain is the most popular holiday ___ for British tourists.","pos":"noun"},{"w":"accommodation","def":"a place to stay, such as a hotel, a flat or a campsite","ex":"The price of the trip includes flights and ___.","pos":"noun"},{"w":"itinerary","def":"a plan of a journey that shows where you will go and when","ex":"Our ___ includes three days in Rome and two days in Florence.","pos":"noun"},{"w":"landmark","def":"a famous building or place that is easy to recognise","ex":"The Eiffel Tower is the most famous ___ in Paris.","pos":"noun","pic":"🗼"},{"w":"heritage","def":"the buildings, traditions and history that a country has kept from the past","ex":"Stonehenge is an important part of Britain's ___.","pos":"noun"},{"w":"excursion","def":"a short trip to visit a place, usually as part of a longer holiday","ex":"On the third day, we went on an ___ to a volcano.","pos":"noun","syn":["trip","outing"]},{"w":"package holiday","def":"a holiday in which the travel and the hotel are booked together for one price","ex":"A ___ is often cheaper than booking flights and hotels separately.","pos":"noun"},{"w":"backpacker","def":"a person who travels cheaply, carrying their things in a large bag on their back","ex":"Every ___ in the hostel had a map and a guidebook.","pos":"noun","pic":"🎒"},{"w":"ecotourism","def":"travel to natural places that tries to protect the environment and help local people","ex":"In Costa Rica, ___ brings money to villages and helps to protect the rainforest.","pos":"noun"},{"w":"peak season","def":"the busiest time of year for travel, when prices are highest","ex":"Flights cost much more in the ___, when schools are on holiday.","pos":"noun"},{"w":"jet lag","def":"a tired feeling after a long flight to a place where the time is very different","ex":"After flying from London to Tokyo, I had terrible ___ for three days.","pos":"noun"},{"w":"reservation","def":"an arrangement to keep a room, a table or a seat for you","ex":"We made a ___ at the restaurant for eight o'clock.","pos":"noun","syn":["booking"]},{"w":"departure","def":"the act of leaving a place, especially at the start of a journey","ex":"Please arrive at the airport two hours before ___.","pos":"noun","ant":["arrival"],"forms":{"noun":"departure","verb":"depart"}},{"w":"resort","def":"a place where many people go on holiday, with hotels, beaches or ski slopes","ex":"The ski ___ was packed with families during the February half-term.","pos":"noun"},{"w":"scenery","def":"the natural things you can see in a place, such as mountains, lakes and forests","ex":"The ___ in the Scottish Highlands is wild and beautiful.","pos":"noun"},{"w":"culture shock","def":"a confused or upset feeling when you visit a place where life is very different","ex":"Many students feel ___ when they first move to a new country.","pos":"noun"},{"w":"picturesque","def":"pretty, especially in an old-fashioned way, like a scene in a painting","ex":"We stayed in a ___ village with stone cottages and a little harbour.","pos":"adj"},{"w":"breathtaking","def":"extremely beautiful or amazing","ex":"From the top of the hill, the view was absolutely ___.","pos":"adj","syn":["stunning"]},{"w":"unspoilt","def":"still beautiful and natural, without many new buildings or visitors","ex":"The island has long, ___ beaches with hardly any hotels.","pos":"adj"},{"w":"wander","def":"to walk slowly around a place without a clear plan","ex":"It's fun to ___ through the narrow streets of an old town.","pos":"verb"}],"grammar":[{"q":"If we had booked earlier, we ___ a cheaper flight.","opts":["would have got","will have got","would got","had got"],"a":0,"why":"Third conditional: if + had + past participle, then would have + past participle (would have got)."},{"q":"I wish we ___ here for another week. The holiday is going too quickly!","opts":["were staying","are staying","will stay","have stayed"],"a":0,"why":"To wish that the present were different, use a past form after 'wish': I wish we were staying."},{"q":"If only we ___ the reviews of the hotel before we booked it!","opts":["had checked","checked","have checked","would check"],"a":0,"why":"For a regret about the past, use 'if only' + had + past participle: if only we had checked."},{"q":"We ___ booked our hotel in advance. Now everything in the town is full.","opts":["should have","should","can have","would"],"a":0,"why":"'Should have' + past participle means it was a good idea, but we didn't do it."},{"q":"These days, Machu Picchu ___ by thousands of people every day.","opts":["is visited","visits","is visiting","has visited"],"a":0,"why":"Machu Picchu doesn't visit anyone; people visit it. Use the present simple passive: is visited."},{"q":"The Eiffel Tower ___ for the World's Fair of 1889.","opts":["was built","built","has been built","is built"],"a":0,"why":"1889 is a finished time, and the tower didn't build anything, so use the past simple passive: was built."},{"q":"We had our photo ___ in front of the Taj Mahal.","opts":["taken","take","taking","to take"],"a":0,"why":"'Have something done': someone else took the photo for us. Use the past participle: taken."},{"q":"Venice, ___ is famous for its canals, welcomes millions of visitors every year.","opts":["which","that","who","where"],"a":0,"why":"Use 'which' for a place or thing in a non-defining clause (between commas) when the verb follows. 'That' is not used after a comma."},{"q":"The receptionist asked us how long ___.","opts":["we were staying","were we staying","are we staying","we are stay"],"a":0,"why":"In a reported question, use normal word order (we were staying), not question order, and move the tense back."},{"q":"___ it rained every day, we had a wonderful holiday.","opts":["Although","Despite","In spite of","However"],"a":0,"why":"'Although' is followed by a full clause (it rained every day). 'Despite' and 'in spite of' need a noun or an -ing form."}],"sentences":["The Eiffel Tower was built for the World's Fair of 1889.","We should have booked our hotel in advance.","The receptionist asked us how long we were staying.","I wish we were staying here for another week.","Jet lag can make travellers feel tired for several days.","Have you ever been on a package holiday?"],"reading":[{"title":"The man who invented the package holiday","text":"Today, millions of people buy package holidays, in which the travel and the accommodation are arranged together. The idea goes back to a British cabinet-maker called Thomas Cook.\n\nIn 1841, Cook organised a day trip by train for about 500 people from Leicester to a meeting in Loughborough, around 11 miles away. Each passenger paid one shilling, and the price included the train ticket and food for the journey. Railways were still new at the time, and a group trip like this was something completely different.\n\nThe trip was such a success that Cook began to organise more. Over the next few years, he took groups to the seaside and to Scotland, and in 1855 he led his first tour across the Channel, to an exhibition in Paris. His customers did not need to plan anything themselves: Cook booked the tickets, arranged where they would stay and often travelled with them as a guide.\n\nIn 1872, he led the first organised tour around the world, which lasted more than 200 days. By then, travel was no longer only for the rich. Thanks to cheap train tickets and careful planning, ordinary working families could explore places that their grandparents had only heard about.","qs":[{"type":"mc","q":"What is the writer's main purpose?","opts":["to explain how one man made organised travel possible for ordinary people","to describe the history of the railway","to persuade readers to buy package holidays","to compare holidays in Leicester and Paris"],"a":0},{"type":"tfng","q":"The passengers on the 1841 trip had to pay for their food separately.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Cook's customers did not have to find their own places to stay.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Thomas Cook had travelled abroad many times before 1841.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"How long did the first organised tour around the world last?","opts":["more than 200 days","one day","about 11 days","three years"],"a":0}]},{"title":"Why jet lag happens","text":"Flying across the world is exciting, but many travellers spend the first days of their holiday feeling tired, hungry at strange times and wide awake in the middle of the night. This is jet lag, and it happens because of the body clock.\n\nDeep inside your brain, a tiny group of cells works like a clock. It tells your body when to feel sleepy and when to wake up, mainly by noticing light and darkness. Normally, it matches the day and night outside. However, if you fly from London to Tokyo, which is eight or nine hours ahead, your body clock is still on British time. When it is morning in Japan, your body thinks it is the middle of the night.\n\nThe body clock can only adjust slowly, often by about an hour a day. As a result, recovering from a long flight can take several days. Many people also find that flying east is harder than flying west, because it is easier for the body to stay up later than to go to sleep earlier.\n\nExperts suggest a few ways to adjust more quickly. One of the most effective is to spend time outside in daylight at your destination, as sunlight helps to reset the clock. Eating meals at local times can help too.","qs":[{"type":"mc","q":"What is the main idea of the text?","opts":["Jet lag happens when the body clock does not match the time in a new place.","Tokyo is a difficult city to visit.","People should never fly east.","It is impossible to sleep on a plane."],"a":0},{"type":"tfng","q":"The body clock uses light and darkness to decide when you should sleep.","opts":["True","False","Not Given"],"a":0},{"type":"tfng","q":"Most people recover from a long flight within a few hours.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Children suffer from jet lag less than adults.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the text, what is one of the best ways to adjust?","opts":["spending time outside in daylight","sleeping all afternoon","drinking coffee late at night","staying in a dark hotel room"],"a":0}]}],"extra":[{"kind":"collocation","q":"We ___ a room at a small hotel near the beach.","opts":["booked","made","did","reserved for"],"a":0,"why":"We 'book a room' (or 'reserve a room'). We don't 'make' or 'do' a room."},{"kind":"phrasal","q":"We ___ early in the morning to catch the first ferry.","opts":["set off","set up","put off","took up"],"a":0,"why":"'Set off' means start a journey. 'Put off' means move something to a later time."},{"kind":"phrasal","q":"When we arrived at the hotel, we ___ at the reception desk.","opts":["checked in","checked out","looked up","gave in"],"a":0,"why":"You 'check in' when you arrive at a hotel and 'check out' when you leave."},{"kind":"preposition","q":"We arrived ___ Paris late in the evening.","opts":["in","at","to","on"],"a":0,"why":"We 'arrive in' a city or country, and 'arrive at' a building such as a station or a hotel. We never 'arrive to' a place."},{"kind":"preposition","q":"Tourism has a huge effect ___ small islands.","opts":["on","to","for","at"],"a":0,"why":"We say 'an effect on' something, just as we say 'an impact on' it."},{"kind":"linking","q":"The hotel was small and quite old. ___, the views from our room were breathtaking.","opts":["However","Therefore","For example","Because"],"a":0,"why":"'However' introduces a contrast: first the bad points, then a good one."},{"kind":"wordform","q":"Tourism brings great ___ benefits to the region. (economy)","opts":["economic","economical","economy","economically"],"a":0,"why":"'Economic' means connected with money and jobs in a country. 'Economical' means cheap to use, like an economical car."},{"kind":"register","q":"Which sentence is the most suitable for a formal letter of complaint to a hotel?","opts":["I am writing to complain about the condition of my room.","Your hotel was a total disaster, mate.","OMG, the room was so gross!","Just wanted to say the room wasn't great."],"a":0,"why":"A formal letter starts politely and clearly: 'I am writing to complain about...'. The others are rude or chatty."},{"kind":"paraphrase","q":"Which sentence means the same as 'The hotel was fully booked'?","opts":["There were no free rooms at the hotel.","The hotel had a lot of books.","The hotel was closed for the winter.","We booked the whole hotel."],"a":0,"why":"'Fully booked' means that every room has already been reserved."},{"kind":"cohesion","q":"Which sentence best continues the text? 'Tourism can bring problems to popular places. ___'","opts":["For example, crowds of visitors can damage old buildings and natural sites.","However, many people enjoy going on holiday.","In conclusion, tourists like taking photos.","Paris is the capital of France."],"a":0,"why":"'For example' introduces a problem that supports the sentence before it. The others change the subject."}],"writing":[{"kind":"paragraph","sents":["Tourism can bring many benefits to a region.","The most important is that it creates jobs in hotels, restaurants and shops.","People with these jobs then spend their wages locally, which helps other businesses too.","In addition, entrance fees paid by tourists can be used to protect historic buildings.","For these reasons, many countries work hard to attract more visitors."]},{"kind":"paragraph","sents":["There are several simple ways to be a responsible tourist.","First, try to stay in small, locally owned hotels and eat in local restaurants.","This means that more of your money stays in the community you are visiting.","Second, respect local customs, such as dressing modestly when you visit religious buildings.","Small actions like these help to make tourism good for everyone."]},{"kind":"upgrade","q":"Which is the most precise way to say: 'Loads more people go on holiday abroad than before.'?","opts":["The number of people travelling abroad has risen considerably.","Way more people go abroad now.","People go abroad, and there are more of them.","Going abroad is more and more and stuff."],"a":0,"why":"'The number of people... has risen considerably' is precise and formal. 'Way more' and 'stuff' are chatty, and the third option is clumsy."},{"kind":"topic","q":"Read the rest of a paragraph: 'For example, crowds of visitors can wear away the paths in national parks. In some popular cities, rents have also risen so much that many local people can no longer afford to live in the centre.' Which topic sentence fits best?","opts":["Tourism can cause serious problems for the places that people visit.","National parks are beautiful places to visit.","Rents are very high in many cities.","Holidays are the best, aren't they?"],"a":0,"why":"'For example' shows that examples of a general point follow. Both examples are problems caused by tourism. The others are off topic, too narrow or chatty."},{"kind":"thesis","q":"Essay question: 'International tourism has grown rapidly in recent decades. Do the advantages of this outweigh the disadvantages?' Which is the clearest thesis statement?","opts":["In my view, the advantages outweigh the disadvantages, because tourism creates jobs and helps people to understand other cultures.","Tourism has grown a lot in recent decades.","There are advantages and disadvantages to everything in life.","Last summer, I went to Italy with my family."],"a":0,"why":"The best thesis answers the question clearly and gives reasons. The others repeat the question, stay vague or tell a story."}]}]},{"stage":6,"units":[{"id":"expert-1","title":"How the brain learns","emoji":"🧠","words":[{"w":"cognitive","def":"connected with thinking, learning, understanding and remembering","ex":"Puzzles and chess can sharpen ___ skills such as memory and attention.","pos":"adj","forms":{"noun":"cognition","adj":"cognitive"}},{"w":"retain","def":"to keep something, especially information in your memory","ex":"Without regular review, we ___ only a small part of what we hear in a lesson.","pos":"verb","syn":["keep","remember"],"ant":["forget","lose"],"forms":{"verb":"retain","noun":"retention"}},{"w":"stimulus","def":"something that causes a reaction in a living thing","ex":"The brain reacts to a sudden ___, such as a loud bang, in a fraction of a second.","pos":"noun"},{"w":"consolidate","def":"to make something, such as a memory, stronger and more lasting","ex":"During deep sleep, the brain replays the day's events to ___ them into long-term memories.","pos":"verb","syn":["strengthen"],"ant":["weaken"],"forms":{"verb":"consolidate","noun":"consolidation"}},{"w":"neuron","def":"a nerve cell that carries electrical messages around the brain and body","ex":"Each ___ can link to thousands of other nerve cells through tiny branches.","pos":"noun"},{"w":"plasticity","def":"the brain's ability to change and build new connections throughout life","ex":"Thanks to its ___, the brain can rewire itself when we learn a new skill.","pos":"noun"},{"w":"acquire","def":"to gain knowledge or a skill through your own effort or experience","ex":"Young children ___ their first language without any formal lessons.","pos":"verb","syn":["gain","obtain"],"ant":["lose"],"forms":{"verb":"acquire","noun":"acquisition"}},{"w":"perceive","def":"to notice or become aware of something through the senses or the mind","ex":"Our eyes send signals to the brain, which allows us to ___ colour, shape and movement.","pos":"verb","syn":["notice","sense"],"forms":{"verb":"perceive","noun":"perception","adj":"perceptive"}},{"w":"retrieval","def":"the act of finding and bringing back information stored in memory","ex":"Practice questions help because every act of ___ makes a memory easier to find again.","pos":"noun","forms":{"noun":"retrieval","verb":"retrieve"}},{"w":"fatigue","def":"great tiredness after hard physical or mental effort","ex":"After four hours of revision without a break, mental ___ made it impossible to focus.","pos":"noun","syn":["tiredness","exhaustion"],"ant":["energy"]},{"w":"rote","def":"repeating something many times in order to remember it, without thinking about its meaning","ex":"Learning times tables by ___ can work, but understanding why the answers are right is even better.","pos":"noun"},{"w":"innate","def":"present from birth rather than learnt","ex":"Some researchers argue that babies have an ___ ability to recognise human faces.","pos":"adj","syn":["inborn","natural"],"ant":["learned"]},{"w":"facilitate","def":"to make an action or a process easier","ex":"Clear diagrams can ___ learning by making difficult ideas easier to grasp.","pos":"verb","syn":["ease","help"],"ant":["hinder"],"forms":{"verb":"facilitate","noun":"facilitation"}},{"w":"mnemonic","def":"a short rhyme, phrase or pattern of letters that helps you remember something","ex":"'Richard Of York Gave Battle In Vain' is a ___ for the colours of the rainbow.","pos":"noun"},{"w":"synapse","def":"the tiny gap across which one nerve cell passes a signal to the next","ex":"A signal must jump across a ___, the narrow gap between two nerve cells.","pos":"noun"},{"w":"cortex","def":"the folded outer layer of the brain, involved in thinking, language and memory","ex":"The ___, the brain's wrinkled outer layer, plays a key role in language and planning.","pos":"noun"},{"w":"deliberate","def":"done on purpose, with careful thought and attention","ex":"Musicians improve fastest through ___ practice, working hardest on the passages they find most difficult.","pos":"adj","syn":["intentional","planned"],"ant":["accidental"],"forms":{"adj":"deliberate","adv":"deliberately"}},{"w":"notion","def":"an idea or belief about what something is like","ex":"The ___ that we use only ten per cent of our brains is a popular myth.","pos":"noun","syn":["idea","belief"]},{"w":"comprehension","def":"the ability to understand something, especially spoken or written language","ex":"The reading test checks ___ by asking questions about the meaning of each passage.","pos":"noun","forms":{"noun":"comprehension","verb":"comprehend","adj":"comprehensible"}},{"w":"alter","def":"to change something, often only slightly or in one particular part","ex":"Learning to juggle can physically ___ the structure of the brain within a few months.","pos":"verb","syn":["change","modify"],"forms":{"verb":"alter","noun":"alteration"}}],"grammar":[{"q":"Never ___ so much about the brain as they do today.","opts":["have scientists known","scientists have known","had scientists know","scientists knew"],"a":0,"why":"When 'Never' starts the sentence, the auxiliary comes before the subject: Never have scientists known."},{"q":"___ helps memory most is testing yourself, not rereading your notes.","opts":["What","That","Which","It"],"a":0,"why":"A 'What' cleft sentence puts the focus on the key idea: What helps most is..."},{"q":"It is widely believed ___ we use only ten per cent of our brains, but this is a myth.","opts":["that","what","which","if"],"a":0,"why":"The reporting pattern is 'It is believed that + clause'."},{"q":"___ by the results, the researchers repeated the experiment to make sure.","opts":["Surprised","Surprising","Having surprised","To surprise"],"a":0,"why":"The researchers were surprised (passive meaning), so use the past participle 'Surprised'."},{"q":"If I had gone to bed earlier last night, I ___ so tired now.","opts":["wouldn't feel","wouldn't have felt","won't feel","didn't feel"],"a":0,"why":"Mixed conditional: a past condition (had gone) with a present result (now) takes 'would + verb'."},{"q":"Short breaks during study ___ improve concentration, although more research is needed.","opts":["appear to","appears to","are certain to","have been proved to"],"a":0,"why":"'More research is needed' calls for cautious hedging, and the plural subject 'breaks' needs 'appear to'."},{"q":"Not until the late 1990s ___ evidence that adult human brains can produce new nerve cells.","opts":["did scientists find","scientists found","did scientists found","scientists did find"],"a":0,"why":"After 'Not until + time' at the start, the main clause uses question order: did scientists find."},{"q":"What the brain ___ during deep sleep is replay the events of the day.","opts":["does","makes","is","has"],"a":0,"why":"A 'What' cleft that focuses on an action uses 'do': What the brain does is replay..."},{"q":"___ the list of words twice, the pupils were asked to write down as many as they could remember.","opts":["Having read","Have read","To read","Read"],"a":0,"why":"The pupils read the list before writing (an earlier action they did), so use 'Having + past participle'."},{"q":"The teacher suggested that each pupil ___ a short quiz at the end of every lesson.","opts":["take","taking","to take","to be taking"],"a":0,"why":"After 'suggest that', formal English uses the base form (the subjunctive): each pupil take."}],"sentences":["Sleep plays a vital role in the consolidation of new memories.","The brain's remarkable plasticity allows it to adapt throughout life.","Mental fatigue makes it much harder for students to concentrate.","Babies appear to have an innate ability to recognise faces.","A mnemonic can help pupils remember the order of the planets.","Deliberate practice involves focusing on the skills you find hardest."],"reading":[{"title":"Why testing beats rereading","text":"For generations, students have prepared for exams by rereading their notes and highlighting key passages. It feels productive: the material looks increasingly familiar, and familiarity is easily mistaken for understanding. Yet a large body of research in cognitive psychology suggests that this popular method is surprisingly inefficient.\n\nThe alternative, known as retrieval practice, involves deliberately recalling information without looking at it, for example by answering practice questions or explaining a topic from memory. In a well-known series of experiments, students who tested themselves after reading a passage remembered considerably more a week later than those who simply read it again, even though the rereaders had felt more confident. The effort of searching memory appears to strengthen the pathways that lead back to the information, making it easier to find next time.\n\nTiming matters too. Spreading study sessions over several days, rather than cramming them into a single evening, tends to produce more durable learning. Researchers believe that a small amount of forgetting between sessions is actually useful, because it forces the brain to work harder at each attempt to recall. Sleep also plays a part: during deep sleep, the brain seems to replay and consolidate what was learnt during the day.\n\nNone of this means that rereading is worthless; it can be a sensible first step when meeting a topic for the first time. However, the evidence suggests that learners who want knowledge to last should spend less time looking at their notes and more time trying to remember what is in them.","qs":[{"type":"tfng","q":"In the experiments described, the students who reread the passage felt less sure of themselves than those who tested themselves.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Retrieval practice was first developed by classroom teachers rather than by scientists.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"According to the first paragraph, why does rereading feel effective to many students?","opts":["They confuse recognising material with really understanding it.","It takes far less time than any other method.","Most teachers recommend it as the best way to revise.","It helps them to sleep better before an exam."],"a":0},{"type":"mc","q":"The writer would most likely advise a student with a test in two weeks to","opts":["quiz themselves in short sessions spread across the two weeks.","reread all their notes several times on the evening before the test.","wait until they feel confident before they start to revise.","highlight every important sentence in their textbook."],"a":0},{"type":"mc","q":"What is the writer's main purpose in the passage?","opts":["to argue that active recall is a more effective way to study than rereading","to explain in detail how nerve cells carry messages","to criticise students who never revise for their exams","to show that rereading is of no value at any stage of learning"],"a":0}]},{"title":"The taxi drivers' brains","text":"To earn a licence to drive one of London's famous black cabs, a trainee must pass a notoriously demanding test known as the Knowledge. Candidates are expected to learn the layout of roughly 25,000 streets within six miles of Charing Cross, together with thousands of landmarks, and most spend several years travelling around the city on motorbikes before they are ready to be examined.\n\nIn 2000, the neuroscientist Eleanor Maguire and her colleagues at University College London used brain scans to compare qualified taxi drivers with people who did not drive taxis. They found that the rear part of the hippocampus, a region closely linked to memory for places, was larger in the drivers. Moreover, the longer a driver had been working, the larger this area tended to be.\n\nA difference of this kind, however, does not prove that learning caused it, since people born with a larger hippocampus might simply be more likely to choose the job. To address this problem, the team later followed a group of trainees for about four years. At the start, their brains looked much the same as those of a comparison group. By the end, only the trainees who had passed the test showed growth in the rear hippocampus, which strongly suggests that the effort of learning had altered their brains.\n\nIn another study, the researchers compared taxi drivers with bus drivers, who also spend long days in traffic but follow fixed routes. Only the taxi drivers showed the difference, so driving itself did not seem to be responsible. The taxi drivers, though, were worse at remembering some new visual information, such as a complicated drawing. The brain, it seems, can adapt to intense demands, but perhaps not without a cost.","qs":[{"type":"tfng","q":"Trainees usually need only a few weeks to prepare for the Knowledge.","opts":["True","False","Not Given"],"a":1},{"type":"tfng","q":"Most of the trainees in the four-year study eventually passed the test.","opts":["True","False","Not Given"],"a":2},{"type":"mc","q":"Why did the researchers compare taxi drivers with bus drivers?","opts":["to rule out the idea that long hours of driving explained the difference","because bus drivers also have to pass the Knowledge","to prove that bus drivers have better memories for drawings","because bus drivers know more streets than taxi drivers"],"a":0},{"type":"mc","q":"What can be inferred from the four-year study of trainees?","opts":["The difference in the drivers' brains was probably not there before their training began.","People with a large hippocampus are the most likely to become taxi drivers.","The trainees who failed the test had not studied at all.","Learning the streets made every part of the brain grow larger."],"a":0},{"type":"mc","q":"Which statement best expresses the point of the final sentence?","opts":["Adapting to a very demanding task may bring losses as well as gains.","Intense demands always damage the brain in the end.","The brain cannot change once a person becomes an adult.","Taxi drivers should avoid looking at complicated drawings."],"a":0}]}],"extra":[{"kind":"collocation","q":"New brain scans may ___ light on how memories are stored.","opts":["shed","drop","give","make"],"a":0,"why":"'Shed light on' is a fixed phrase meaning 'help to explain'."},{"kind":"paraphrase","q":"Which sentence means the same as: 'Familiarity is easily mistaken for understanding.'?","opts":["People often think they understand something simply because it looks familiar.","People rarely recognise material that they understand well.","Understanding something well makes it look less familiar.","Material always becomes easy to understand once it is familiar."],"a":0,"why":"'Mistaken for' means wrongly tak

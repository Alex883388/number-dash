<title>English Quest</title>
<meta name="description" content="Step by step from first English words to IELTS band 8: short lessons with words, grammar, listening, spelling, sentence building and reading.">

<style>
:root {
  --sky: #e6f3fc; --sky-top: #8fd1fb; --sky-bot: #e8f6ff; --ink: #29345a; --ink-soft: #5d6890; --card: #fdfeff; --card-2: #eef5fc; --line: #d0dff0;
  --sun: #ffc94d; --sun-deep: #e2a526; --sun-ink: #4a3500; --mint: #4fd1a5; --mint-deep: #2a9f78; --mint-soft: #d9f7ea; --lilac: #9d84ff; --lilac-soft: #ece6ff;
  --coral: #ff7b86; --coral-deep: #d9505d; --coral-soft: #ffe1e4; --sky-blue: #5cb8ff; --pink: #ff9fcf;
  --door: #fff3d6; --door-edge: #f0b544; --door-ink: #3a3f6b; --veil: rgba(230, 243, 252, .6);
  --shadow: 0 12px 32px rgba(41, 52, 90, .16); --shadow-sm: 0 4px 14px rgba(41, 52, 90, .14);
  --font-display: "Fredoka", "Arial Rounded MT Bold", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #1c2147; --sky-top: #1d2350; --sky-bot: #3b3a7e; --ink: #edf0ff; --ink-soft: #b4bbe3; --card: #283063; --card-2: #222955; --line: #3b437f;
    --sun: #ffcd5a; --sun-deep: #d99f2c; --sun-ink: #3d2a00; --mint: #5adbb0; --mint-deep: #5adbb0; --mint-soft: #1f4a4a; --lilac: #ab95ff; --lilac-soft: #352f6e;
    --coral: #ff8a94; --coral-deep: #ff8a94; --coral-soft: #4d2a45; --door: #fff1d2; --veil: rgba(28, 33, 71, .55);
    --shadow: 0 14px 36px rgba(0, 0, 0, .42); --shadow-sm: 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #1c2147; --sky-top: #1d2350; --sky-bot: #3b3a7e; --ink: #edf0ff; --ink-soft: #b4bbe3; --card: #283063; --card-2: #222955; --line: #3b437f;
  --sun: #ffcd5a; --sun-deep: #d99f2c; --sun-ink: #3d2a00; --mint: #5adbb0; --mint-deep: #5adbb0; --mint-soft: #1f4a4a; --lilac: #ab95ff; --lilac-soft: #352f6e;
  --coral: #ff8a94; --coral-deep: #ff8a94; --coral-soft: #4d2a45; --door: #fff1d2; --veil: rgba(28, 33, 71, .55);
  --shadow: 0 14px 36px rgba(0, 0, 0, .42); --shadow-sm: 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  background: linear-gradient(var(--sky-top), var(--sky-bot) 75%) fixed; background-color: var(--sky-bot);
}
button { font: inherit; color: inherit; }
button, label, input, .btn, a { touch-action: manipulation; }
[hidden] { display: none !important; }

/* buttons */
.btn {
  font: 600 1.05rem/1.1 var(--font-display); color: var(--ink); background: var(--card-2); border: 2px solid var(--line); border-radius: 16px;
  padding: .75em 1.15em; box-shadow: 0 4px 0 var(--line); cursor: pointer; text-decoration: none; display: inline-block;
  transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:hover { background: var(--card); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn:focus-visible, .seg input:focus-visible + span { outline: 3px solid var(--lilac); outline-offset: 3px; }
.btn.sun { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); box-shadow: 0 4px 0 var(--sun-deep); }
.btn.sun:active { box-shadow: 0 1px 0 var(--sun-deep); }
.btn.big { font-size: 1.6rem; padding: .6em 2.2em; border-radius: 22px; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

/* menu screens: cards over the game */
#screens {
  position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto; pointer-events: none; touch-action: pan-y; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
}
#screens.dim { background: var(--veil); pointer-events: auto; }
.screen { pointer-events: auto; width: min(100%, 600px); animation: rise .35s ease both; }
.card { background: var(--card); border-radius: 28px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 34px); display: grid; gap: 18px; text-align: center; }
.logo { margin: 0; font: 700 clamp(2.5rem, 9vw, 4rem)/.95 var(--font-display); text-wrap: balance; }
.logo span { color: var(--mint-deep); }
.tag { margin: 0 auto; max-width: 40ch; color: var(--ink-soft); font-size: 1.08rem; line-height: 1.5; text-wrap: balance; }
.how { margin: 0; color: var(--ink-soft); font-weight: 700; }
.small-card h2 { margin: 0; font: 700 clamp(1.9rem, 6vw, 2.6rem)/1.05 var(--font-display); text-wrap: balance; }
.small-card p { margin: 0; color: var(--ink-soft); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; margin: 0; }
.stats div { background: var(--card-2); border-radius: 16px; padding: 12px 6px; min-width: 0; }
.stats dt { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 800; }
.stats dd { margin: 4px 0 0; font: 700 1.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; font: 600 .95rem/1.15 var(--font-display); padding: .55em .85em; border-radius: 14px; background: var(--card-2); border: 2px solid var(--line); }
.seg input:checked + span { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); }
@media (pointer: coarse) { .seg span { min-height: 48px; box-sizing: border-box; display: grid; place-items: center; } }
.seg-title { margin: 0 0 8px; font: 600 .9rem/1 var(--font-display); color: var(--ink-soft); }
.stars { font-size: 2.4rem; letter-spacing: .1em; line-height: 1; }
.stars .off { opacity: .22; filter: grayscale(1); }

/* the HUD along the top while playing */
#hud { position: fixed; left: 0; right: 0; top: 0; pointer-events: none; z-index: 10; }
.hud-top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.chipbox { background: var(--card); border-radius: 99px; box-shadow: var(--shadow-sm); }
.hud-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 600 1.05rem/1 var(--font-display); padding: 8px 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.soft { font-size: .9rem; padding: 7px 12px; color: var(--ink-soft); }
.hud-btn { pointer-events: auto; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow-sm); cursor: pointer; display: grid; place-items: center; flex: none; color: var(--ink); }
.hud-btn:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
@media (pointer: coarse) { .hud-btn { width: 58px; height: 58px; } }

/* toasts and screen-reader text */
.toast {
  position: fixed; left: 50%; top: var(--toast-top, 42%); translate: -50% 0; z-index: 30; pointer-events: none; font: 700 1.4rem/1.1 var(--font-display);
  padding: 12px 20px; animation: pop .3s ease both; white-space: nowrap; background: var(--card); border-radius: 99px; box-shadow: var(--shadow-sm);
}
.toast.hello { top: calc(max(128px, 20%) + env(safe-area-inset-top, 0px)); border: 3px solid var(--lilac); }
.toast.good { color: var(--mint-deep); border: 3px solid var(--mint); }
.toast.oops { color: var(--coral-deep); border: 3px solid var(--coral); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(.85); } 70% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { translate: 0 0; } 20% { translate: -7px 0; } 40% { translate: 6px 0; } 60% { translate: -4px 0; } 80% { translate: 3px 0; } }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(79, 209, 165, .7); } 100% { box-shadow: 0 0 0 18px rgba(79, 209, 165, 0); } }
@media (prefers-reduced-motion: reduce) { .screen, .toast, .card { animation: none !important; } }
/* Layout: menus are cards (home, path, results); a lesson fills the screen: a thin top bar with
   the progress, the question in the middle, and a feedback sheet that slides up after an answer.
   Each stage has its own colour on the path. */
.home { gap: 14px; }
.tagline { margin: -6px 0 0; font: 600 1.05rem/1.2 var(--font-display); color: var(--ink-soft); }
.level { background: var(--card-2); border-radius: 20px; padding: 14px 16px; display: grid; gap: 10px; text-align: left; }
.level-top { display: flex; align-items: center; gap: 12px; }
.level-top .big { font-family: var(--emoji); font-size: 2.2rem; line-height: 1; }
.level-top b { display: block; font: 700 1.25rem/1.15 var(--font-display); }
.level-top span { color: var(--ink-soft); font-weight: 700; font-size: .92rem; }
.wotd { background: var(--card-2); border-radius: 20px; padding: 12px 16px; display: grid; gap: 6px; text-align: left; }
.wotd-tag { font: 800 .72rem/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.wotd-main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wotd-main .pic { font: 2rem/1 var(--emoji); }
.wotd-main b { font: 700 1.5rem/1.1 var(--font-display); }
.wotd-main i { color: var(--ink-soft); font-weight: 700; }
.wotd p { margin: 0; line-height: 1.4; }
.wotd .ex { color: var(--ink-soft); font-style: italic; }
.wotd .row { justify-content: flex-start; }
.track { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.track i { height: 10px; border-radius: 99px; background: var(--line); }
.track i.done { background: var(--mint); }
.track i.now { background: var(--sun); }
.track-labels { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font: 700 .68rem/1.1 var(--font-body); color: var(--ink-soft); text-align: center; }
.note { margin: 0; font-size: .82rem; color: var(--ink-soft); line-height: 1.4; }
.skills { display: grid; gap: 6px; }
.skill { display: grid; grid-template-columns: 82px 1fr 40px; align-items: center; gap: 8px; font: 700 .85rem/1 var(--font-body); color: var(--ink-soft); }
.skill .bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.skill .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--sky-blue), var(--mint)); }
.skill span:last-child { text-align: right; font-variant-numeric: tabular-nums; }

/* the path */
.path-card { width: min(100%, 720px); }
.stage-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.stage-tabs::-webkit-scrollbar { display: none; }
.stage-tabs button { flex: none; border: 2px solid var(--line); background: var(--card-2); border-radius: 14px; padding: 8px 12px; font: 600 .95rem/1.1 var(--font-display); color: var(--ink); cursor: pointer; min-height: 48px; }
.stage-tabs button.on { background: var(--sun); border-color: var(--sun-deep); color: var(--sun-ink); }
.stage-tabs button.locked { opacity: .55; }
.stage-head { text-align: left; display: grid; gap: 4px; }
.stage-head h2 { margin: 0; font: 700 1.6rem/1.1 var(--font-display); }
.stage-head p { margin: 0; color: var(--ink-soft); }
.nodes { display: grid; gap: 10px; }
.node { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; width: min(100%, 520px); text-align: left; border: 2px solid var(--line); background: var(--card-2); border-radius: 20px; padding: 10px 14px; cursor: pointer; color: var(--ink); font: inherit; min-height: 72px; box-shadow: 0 4px 0 var(--line); }
.node:nth-child(odd) { justify-self: start; } .node:nth-child(even) { justify-self: end; }
.node .em { font-family: var(--emoji); font-size: 2rem; line-height: 1; text-align: center; }
.node b { display: block; font: 600 1.1rem/1.15 var(--font-display); }
.node small { color: var(--ink-soft); font-weight: 700; }
.node .st { font-size: 1.05rem; letter-spacing: .05em; white-space: nowrap; }
.node.next { border-color: var(--sun-deep); background: var(--door); box-shadow: 0 4px 0 var(--sun-deep); }
.node.locked { opacity: .5; cursor: default; box-shadow: none; }
.node.test { border-style: dashed; }
.node:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
.soon { padding: 18px; border-radius: 18px; background: var(--card-2); color: var(--ink-soft); font-weight: 700; }

/* a lesson */
#lesson { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; z-index: 5; }
.lbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.prog { height: 14px; border-radius: 99px; background: var(--card); box-shadow: var(--shadow-sm); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--mint), var(--sun)); transition: width .3s ease; }
.lcount { font: 700 1rem/1 var(--font-display); color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.qwrap { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: grid; }
.q { width: min(100%, 780px); margin: auto; display: grid; gap: 14px; justify-items: center; text-align: center; }
.qlabel { font: 700 .82rem/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); background: var(--card); border-radius: 99px; padding: 7px 12px; box-shadow: var(--shadow-sm); }
.qlabel .sk { color: var(--lilac); }
.prompt { font: 600 clamp(1.25rem, 3.6vw, 2rem)/1.3 var(--font-display); text-wrap: balance; white-space: pre-line; }
.prompt .gap { display: inline-block; min-width: 3.2em; border-bottom: 4px solid var(--sun-deep); margin: 0 .15em; color: var(--mint-deep); }
.bigword { font: 700 clamp(2.4rem, 8vw, 4rem)/1 var(--font-display); }
.pic { font: clamp(4.5rem, 16vw, 7.5rem)/1 var(--emoji); }
.say { display: inline-flex; align-items: center; gap: 8px; }
.say .btn { font-size: 1.15rem; }
.listen-big { width: 112px; height: 112px; border-radius: 50%; border: 0; background: var(--sun); color: var(--sun-ink); box-shadow: 0 6px 0 var(--sun-deep), var(--shadow-sm); font: 2.8rem/1 var(--emoji); cursor: pointer; }
.listen-big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sun-deep); }
.passage { width: 100%; box-sizing: border-box; text-align: left; background: var(--card); border-radius: 20px; box-shadow: var(--shadow-sm); padding: 14px 18px; max-height: 42vh; overflow-y: auto; border: 2px solid var(--line); }
.passage h3 { margin: 0 0 6px; font: 700 1.15rem/1.2 var(--font-display); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.passage p { margin: 0 0 .7em; line-height: 1.6; font-size: 1.05rem; }
.passage .btn { font-size: .9rem; padding: .5em .8em; }
.opts { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.opts.long { grid-template-columns: 1fr; }
.opts.row { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
.opts.row .opt { padding: 10px 8px; font-size: 1.1rem; }
.opt { min-height: 60px; padding: 12px 16px; border-radius: 18px; border: 3px solid var(--door-edge); background: var(--door); color: var(--door-ink); box-shadow: 0 5px 0 var(--door-edge); font: 600 1.2rem/1.25 var(--font-display); cursor: pointer; text-align: center; touch-action: manipulation; }
.opts.long .opt { text-align: left; font-size: 1.08rem; font-family: var(--font-body); font-weight: 700; }
.opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--door-edge); }
.opt .k { display: inline-block; min-width: 1.4em; opacity: .5; font-size: .8em; }
.opt.right { background: #dff8ec; border-color: #2fae84; box-shadow: 0 5px 0 #2fae84; color: #1d4a3b; }
.opt.wrong { background: #ffe1e4; border-color: #d9505d; box-shadow: 0 5px 0 #d9505d; color: #5a1f27; animation: shake .35s ease; }
.opt.dim { opacity: .45; }
.opt.picked { background: var(--lilac-soft); border-color: var(--lilac); box-shadow: 0 5px 0 var(--lilac); }
.lcount.timer { min-width: 64px; color: var(--ink); }
.lcount.timer.low { color: var(--coral-deep); }
.opt:disabled { cursor: default; }
.opt:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
.build { width: 100%; min-height: 64px; box-sizing: border-box; border-radius: 18px; border: 3px dashed var(--line); padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-content: center; background: color-mix(in srgb, var(--card) 70%, transparent); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { min-width: 52px; min-height: 52px; padding: 8px 14px; border-radius: 14px; border: 3px solid var(--door-edge); background: var(--door); color: var(--door-ink); box-shadow: 0 4px 0 var(--door-edge); font: 600 1.2rem/1.1 var(--font-display); cursor: pointer; touch-action: manipulation; }
.tile.used { visibility: hidden; }
.tile.placed { background: var(--card); border-color: var(--sky-blue); box-shadow: 0 4px 0 #3a8fd6; color: var(--ink); }
.tile.bad { background: #ffe1e4; border-color: #d9505d; box-shadow: 0 4px 0 #d9505d; color: #5a1f27; animation: shake .35s ease; }
.boxes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.boxes i { font-style: normal; width: clamp(34px, 7vw, 52px); height: clamp(42px, 8.5vw, 60px); border-radius: 12px; background: var(--card); border: 3px solid var(--line); display: grid; place-items: center; font: 700 clamp(1.3rem, 4vw, 2rem)/1 var(--font-display); }
.boxes i.cur { border-color: var(--lilac); }
.boxes i.ok { border-color: var(--mint); }
.check-row { display: flex; gap: 10px; justify-content: center; }
.build.para, .tiles.para { flex-direction: column; align-items: stretch; }
.build.para .tile, .tiles.para .tile { text-align: left; font: 700 1.02rem/1.4 var(--font-body); padding: 10px 14px; min-height: 48px; }
.tiles.para .tile.used { display: none; }
.build.para { min-height: 120px; justify-content: flex-start; }
.tiles.spot .tile { font-family: var(--font-body); font-weight: 800; font-size: 1.15rem; }
.tile.wrongword { background: #ffe1e4; border-color: #d9505d; box-shadow: 0 4px 0 #d9505d; color: #5a1f27; text-decoration: line-through; }
.fixword { align-self: center; font: 700 1.2rem/1 var(--font-display); color: #1d8a65; background: #dff8ec; border: 3px solid #4fd1a5; border-radius: 14px; padding: 10px 12px; }
.sheet { padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; border-top: 3px solid transparent; animation: rise .25s ease both; }

<body>

<script>
(function () {
'use strict';
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const frac = (v) => ((v % 1) + 1) % 1;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const fmtTime = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const stat = (k, v) => '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>';
const starRow = (n, of) => Array.from({ length: of || 3 }, (_, i) => '<span' + (i < n ? '' : ' class="off"') + '>⭐</span>').join('');

/* ================= saved progress (this device) =================
   Settings (math level, music, read-aloud) and the math record are shared by every game in
   number-dash.v1; each game keeps its own records under its own key via loadRecords(). */
const SAVE_KEY = 'number-dash.v1';
const save = {
  levels: {},
  math: { right: 0, wrong: 0, streak: 0, best: 0, tricky: [] },
  settings: { mathLevel: 'explorer', think: 'normal', music: 0.7, sfx: 0.8, sky: 'auto', calm: reduceMotion, speak: true },
  cube: { color: 0, face: 0 }
};
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { const d = JSON.parse(raw); for (const k of Object.keys(save)) if (d && d[k] && typeof d[k] === 'object') Object.assign(save[k], d[k]); }
} catch (e) { /* storage blocked: play without saving */ }
const records = { key: '', data: null };
function loadRecords(key, defaults) {
  records.key = key; records.data = defaults;
  try { const raw = localStorage.getItem(key); if (raw) Object.assign(defaults, JSON.parse(raw)); } catch (e) { /* ignore */ }
  return defaults;
}
function markPlayed() {
  try {
    const d = new Date(), k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const days = JSON.parse(localStorage.getItem('arcade-days.v1') || '{}') || {};
    if (days[k]) return;
    days[k] = 1;
    const keys = Object.keys(days).sort();
    while (keys.length > 400) delete days[keys.shift()];
    localStorage.setItem('arcade-days.v1', JSON.stringify(days));
  } catch (e) { /* storage blocked */ }
}
function writeSave() {
  markPlayed();
  try {
    const cur = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    cur.math = save.math; cur.settings = save.settings;
    if (!cur.cube) cur.cube = save.cube;
    if (!cur.levels) cur.levels = save.levels;
    localStorage.setItem(SAVE_KEY, JSON.stringify(cur));
    if (records.key) localStorage.setItem(records.key, JSON.stringify(records.data));
  } catch (e) { /* ignore */ }
}

// the game's records only, for bookkeeping that is not play (the day is not marked as played)
function writeRecords() { try { if (records.key) localStorage.setItem(records.key, JSON.stringify(records.data)); } catch (e) { /* ignore */ } }

/* ================= math bookkeeping =================
   q is a fact from KINDS (shared/math.js): t = its text, a = its answer. A missed fact is kept
   (the last 12) and comes back now and then in every game until it is answered right. */
function factFrom(kinds, avoid) {
  const tricky = (save.math.tricky || []).filter((t) => !avoid || !avoid.has(t.t));
  if (tricky.length && Math.random() < 0.25) return Object.assign({}, pick(tricky), { again: true });
  let q = KINDS[pick(kinds)]();
  for (let i = 0; i < 12 && avoid && avoid.has(q.t); i++) q = KINDS[pick(kinds)]();
  return q;
}
function mathRight(q) {
  const m = save.math;
  m.right++; m.streak++; m.best = Math.max(m.best, m.streak);
  if (q && q.again) m.tricky = m.tricky.filter((t) => t.t !== q.t);
  writeSave();
}
function mathWrong(q) {
  const m = save.math;
  m.wrong++; m.streak = 0;
  if (q && q.t) {
    const r = { t: q.t, a: q.a };
    if (q.f) r.f = q.f;
    if (q.trap !== undefined) r.trap = q.trap;
    m.tricky = (m.tricky || []).filter((t) => t.t !== r.t).concat([r]).slice(-12);
  }
  writeSave();
}

/* ================= screens, toasts, links ================= */
// show one menu card (<section class="screen" id="s-NAME">) over the game, or none
function showScreen(name, dim) {
  $$('#screens > .screen').forEach((s) => { s.hidden = s.id !== 's-' + name; });
  $('#screens').classList.toggle('dim', !!name && dim !== false);
}
let toastTimer = 0;
// kind: 'hello' (sits higher, for something new), 'good', 'oops', or nothing
function toast(msg, kind, ms) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast' + (kind ? ' ' + kind : ''); t.hidden = false;
  t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms || (kind === 'hello' ? 2400 : 1500));
}
function announce(msg) { const a = $('#announce'); if (a) a.textContent = msg; }
// links marked data-hub lead back to the arcade's home page when the game runs inside the site
function arcadeLinks() { if (window.ARCADE_HOME) $$('[data-hub]').forEach((a) => { a.href = window.ARCADE_HOME; a.hidden = false; }); }
function toggleMusic() { save.settings.music = save.settings.music > 0 ? 0 : 0.7; writeSave(); Sound.init(); Sound.setVolumes(); return save.settings.music > 0; }
// the usual page guards: sound starts on the first touch, no pinch or double-tap zoom, onHide when the page goes away
function arcadeGuards(onHide) {
  document.addEventListener('pointerdown', () => Sound.init());
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (onHide) onHide(); } else Sound.init(); });
  window.addEventListener('blur', () => { if (onHide) onHide(); });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
}

/* ================= read-aloud =================
   English words are spoken with the device's own voice (iPad has good offline ones). Off when
   settings.speak is false. Speech.said keeps the last words asked for, for the playtests. */
const Speech = (function () {
  const ok = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
  const said = [];
  let voice = null;
  function choose() {
    if (!ok) return;
    const en = speechSynthesis.getVoices().filter((v) => /^en[-_]/i.test(v.lang));
    // British English first (the games teach British spelling and IELTS uses British voices), the clearest voices first
    // (on-device voices before online ones, so read-aloud still works offline)
    const gb = en.filter((v) => /^en[-_]GB/i.test(v.lang)).sort((x, y) => (y.localService ? 1 : 0) - (x.localService ? 1 : 0));
    voice = gb.find((v) => /Serena|Kate|Arthur|Martha|Sonia|Libby|Ryan|Google UK English/i.test(v.name)) || gb.find((v) => /Daniel/i.test(v.name)) || gb[0] ||
      en.find((v) => /Samantha|Karen|Moira|Aria|Jenny|Google US English/i.test(v.name)) || en.find((v) => /^en[-_]US/i.test(v.lang)) || en[0] || null;
  }
  if (ok) { choose(); try { speechSynthesis.addEventListener('voiceschanged', choose); } catch (e) { speechSynthesis.onvoiceschanged = choose; } }
  function say(text, rate) {
    said.push(text); if (said.length > 40) said.shift();
    if (!ok || !save.settings.speak) return false;
    try {
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = voice ? voice.lang : 'en-GB'; u.rate = rate || 0.9; u.pitch = 1.05;
      // some iOS versions drop a word spoken straight after cancel(), so only cut in when something is
      // still talking, and then give the voice a moment
      if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(() => speechSynthesis.speak(u), 60); }
      else speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }
  return { ok: ok, say: say, said: said, stop() { if (ok) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } } } };
})();

/* ================= stages and content =================
   CONTENT is filled in at build time from content/stage-*.json (null for a stage not written
   yet). See content/FORMAT.md for what a stage holds. */

e street.","pos":"noun","pic":"🛹"},{"w":"twenty","def":"the number after nineteen; two tens","ex":"Ten and ten make ___.","pos":"other"},{"w":"number","def":"a word like one, two or three","ex":"What's your favourite ___? Seven!","pos":"noun","pic":"🔢"}],"grammar":[{"q":"___ is my kite, here in my hand.","opts":["This","That","These"],"a":0,"why":"Use 'this' for one thing near you."},{"q":"___ is my ball, over there in the garden.","opts":["That","This","Those"],"a":0,"why":"Use 'that' for one thing far from you."},{"q":"How ___ balls have you got?","opts":["many","old","is"],"a":0,"why":"Ask 'How many...?' to find out a number."},{"q":"I have got two red ___.","opts":["trains","train","a train"],"a":0,"why":"Two is more than one, so add -s: two trains."},{"q":"___ is my teddy bear? It's under the bed.","opts":["Where","What","Who"],"a":0,"why":"Use 'where' to ask about a place."},{"q":"These ___ my new toys.","opts":["are","is","am"],"a":0,"why":"'These' means more than one thing, so use 'are'."},{"q":"Look at ___ kites up in the sky!","opts":["those","these","this"],"a":0,"why":"Use 'those' for more than one thing far from you."},{"q":"I've got ___ orange ball.","opts":["an","a","two"],"a":0,"why":"'Orange' starts with o, so use 'an': an orange ball."},{"q":"___ is your bike? It's blue.","opts":["What colour","How many","Where"],"a":0,"why":"Ask 'What colour...?' to find out the colour of something."},{"q":"I ___ ride a bike, but I can't ride a skateboard.","opts":["can","can't","have"],"a":0,"why":"'But' shows two different things: I can ride a bike, but I can't ride a skateboard."}],"sentences":["I have got a blue kite.","How many balls have you got?","Look at my new teddy bear!","My sister has got a pink doll.","Can you ride a skateboard?","I have got twenty toy cars."],"reading":[{"title":"Kim's toy box","text":"Hi! I'm Kim. I have got a big toy box in my bedroom. In my toy box there are ten balls. Three are red and seven are blue. There is a green robot and a yellow train. My favourite toy is my teddy bear. He is brown and his name is Bobby.","qs":[{"type":"mc","q":"How many balls are in the toy box?","opts":["three","seven","ten"],"a":2},{"type":"mc","q":"What colour is the robot?","opts":["green","yellow","blue"],"a":0},{"type":"tf","q":"Seven balls are red.","opts":["True","False"],"a":1},{"type":"mc","q":"What is Kim's favourite toy?","opts":["the train","the teddy bear","the robot"],"a":1},{"type":"tf","q":"The teddy bear is brown.","opts":["True","False"],"a":0}]},{"title":"Jack's birthday toys","text":"It's Jack's birthday. He is eight. He has got lots of new toys! His grandma gives him a black and white football. His cousin gives him a purple kite. From Mum and Dad he gets an orange bike. He can't ride it very well, but he is very happy!","qs":[{"type":"mc","q":"How old is Jack?","opts":["seven","eight","ten"],"a":1},{"type":"mc","q":"What colour is the kite?","opts":["purple","orange","black"],"a":0},{"type":"mc","q":"Who gives Jack a football?","opts":["his cousin","his grandma","his dad"],"a":1},{"type":"tf","q":"Jack's new bike is orange.","opts":["True","False"],"a":0},{"type":"tf","q":"Jack can ride his bike very well.","opts":["True","False"],"a":1}]}],"extra":[]},{"id":"starter-6","title":"At the park","emoji":"🌳","words":[{"w":"park","def":"a big green place in a town where people walk and play","ex":"Our town has got a big ___ with trees, a lake and a playground.","pos":"noun"},{"w":"tree","def":"a very big plant with a lot of green leaves","ex":"I'm sitting under a big ___. It's nice and cool here.","pos":"noun","pic":"🌳"},{"w":"flower","def":"the pretty, coloured part of a plant","ex":"This ___ is red and yellow, and it smells very nice.","pos":"noun","pic":"🌸"},{"w":"playground","def":"a place outside where children play, often with swings and slides","ex":"We play in the school ___ at break time.","pos":"noun"},{"w":"sand","def":"very small yellow bits of rock, like on a beach","ex":"I'm making a big castle with ___.","pos":"noun"},{"w":"sun","def":"the big hot light in the sky in the day","ex":"Put on your hat. The ___ is very hot today!","pos":"noun","pic":"☀️"},{"w":"water","def":"you drink it, and it is in rivers and the sea","ex":"The ducks are swimming on the ___ in the park.","pos":"noun","pic":"💧"},{"w":"boat","def":"it carries people on water","ex":"We sit in a little ___ on the lake.","pos":"noun","pic":"🛶"},{"w":"picnic","def":"a meal that you eat outside, for example in a park","ex":"Let's take some sandwiches and have a ___ in the park!","pos":"noun","pic":"🧺"},{"w":"run","def":"to move your legs very fast","ex":"Can you ___ fast? Let's have a race to that tree!","pos":"verb","pic":"🏃"},{"w":"jump","def":"to go up into the air with your feet off the ground","ex":"Kangaroos can ___ very high.","pos":"verb"},{"w":"walk","def":"to move on your feet, not fast","ex":"Grandma can't run, so we ___ slowly with her.","pos":"verb","pic":"🚶"},{"w":"swim","def":"to move in water using your arms and legs","ex":"Let's ___ in the sea. The water is warm!","pos":"verb","pic":"🏊"},{"w":"throw","def":"to send a ball through the air with your hand","ex":"Can you ___ the ball to me? I want to catch it.","pos":"verb"},{"w":"wave","def":"to move your hand to say hello or goodbye","ex":"Look! Grandma is at the window. Let's ___ to her!","pos":"verb","pic":"👋"},{"w":"ride","def":"to sit on a bike or a horse and make it go","ex":"I can ___ my bike in the park.","pos":"verb","pic":"🚴"},{"w":"baseball","def":"a game where players hit a ball with a bat and then run","ex":"In ___, you hit the ball with a bat and run.","pos":"noun","pic":"⚾"},{"w":"badminton","def":"a game where you hit a light thing with feathers over a high net","ex":"Dad and I play ___ in the garden with a net and two rackets.","pos":"noun","pic":"🏸"},{"w":"smile","def":"to make a happy face with your mouth","ex":"Look at the camera and ___!","pos":"verb","pic":"😊"},{"w":"sit","def":"to put your bottom on a chair or on the floor","ex":"Come and ___ next to me on the grass.","pos":"verb"}],"grammar":[{"q":"___ you swim? Yes, I can.","opts":["Can","Are","Have"],"a":0,"why":"Ask 'Can you...?' about things people are able to do."},{"q":"My little brother can't ___ yet. He is only one.","opts":["walk","walks","walking"],"a":0,"why":"After 'can' or 'can't', use the verb on its own: can't walk."},{"q":"There ___ a big tree in the park.","opts":["is","are","am"],"a":0,"why":"Use 'there is' for one thing: there is a tree."},{"q":"Is ___ your hat over there, under the tree?","opts":["that","this","these"],"a":0,"why":"Use 'that' for one thing far from you: over there."},{"q":"The dog is sleeping ___ the tree, out of the sun.","opts":["under","in","on"],"a":0,"why":"'Under' means below something. The dog is below the tree."},{"q":"Where's my hat? Look, it's ___ your head!","opts":["on","in","under"],"a":0,"why":"'On' means on top of something: the hat is on your head."},{"q":"___ the ball to me, please!","opts":["Throw","Throws","Throwing"],"a":0,"why":"To ask someone to do something, use the verb on its own: Throw the ball."},{"q":"___ are you doing? I'm flying my kite.","opts":["What","Who","Where"],"a":0,"why":"Use 'what' to ask about things and actions: What are you doing?"},{"q":"There are lots of ___ in the playground.","opts":["children","childs","child"],"a":0,"why":"'Child' changes for more than one: one child, two children."},{"q":"___ flowers here are for you, Mum!","opts":["These","This","That"],"a":0,"why":"Use 'these' for more than one thing near you."}],"sentences":["The dog is running in the park.","Can you throw me the ball?","How many boats can you see?","Don't walk on the grass!","My sister is sitting under a big tree.","Let's have a picnic in the park!"],"reading":[{"title":"A sunny day in the park","text":"It is a sunny day and Lucy is at the park with her dad. There are lots of flowers and big green trees. Lucy can't swim, but she can ride her bike. Her dad is reading under a tree. Two boys are playing baseball. Lucy waves to them and smiles.","qs":[{"type":"mc","q":"Who is Lucy with?","opts":["her mum","her dad","her friend"],"a":1},{"type":"tf","q":"Lucy can swim.","opts":["True","False"],"a":1},{"type":"mc","q":"What is Lucy's dad doing?","opts":["reading","swimming","playing baseball"],"a":0},{"type":"mc","q":"What are the two boys playing?","opts":["football","badminton","baseball"],"a":2},{"type":"tf","q":"Lucy waves to the boys.","opts":["True","False"],"a":0}]},{"title":"Tom's picnic","text":"Tom and his family are having a picnic in the park. They sit on the grass next to the water. There are three boats on the water: a red boat, a blue boat and a yellow boat. Tom's sister is in the playground. She is playing in the sand. Tom wants to play badminton with Mum.","qs":[{"type":"mc","q":"Where is Tom's family?","opts":["at the zoo","in the park","at home"],"a":1},{"type":"mc","q":"How many boats are there?","opts":["two","three","four"],"a":1},{"type":"tf","q":"There is a green boat on the water.","opts":["True","False"],"a":1},{"type":"mc","q":"Where is Tom's sister?","opts":["in the playground","in a boat","under a tree"],"a":0},{"type":"tf","q":"Tom wants to play badminton with Mum.","opts":["True","False"],"a":0}]}],"extra":[]}]},{"stage":2,"units":[{"id":"mover-1","title":"My school day","emoji":"🏫","words":[{"w":"get up","def":"to leave your bed after you wake up","ex":"On Sundays I stay in bed and ___ at ten o'clock.","pos":"phrase","pic":"⏰"},{"w":"get dressed","def":"to put your clothes on","ex":"After my shower I ___: shirt, trousers and shoes.","pos":"phrase","pic":"👕"},{"w":"wash","def":"to clean something with water and soap","ex":"Please ___ your hands with soap before lunch.","pos":"verb","pic":"🧼"},{"w":"homework","def":"work your teacher gives you to do after school","ex":"I do my maths ___ after school.","pos":"noun","pic":"📝"},{"w":"break","def":"a short time between lessons when you can rest or play","ex":"We play football in the playground at ___.","pos":"noun"},{"w":"mistake","def":"something that is wrong, like a wrong answer","ex":"Two and two is five? That's a ___!","pos":"noun","pic":"❌"},{"w":"clever","def":"quick at learning and understanding things","ex":"Ana knows all the answers. She's very ___.","pos":"adj","pic":"🧠"},{"w":"quiet","def":"making very little noise","ex":"Please be ___ in the library. People are reading.","pos":"adj","pic":"🤫"},{"w":"easy","def":"not hard to do","ex":"The test was ___. I got all the answers right!","pos":"adj"},{"w":"difficult","def":"hard to do or to understand","ex":"This sum is very ___. Can you help me, please?","pos":"adj"},{"w":"always","def":"every time","ex":"I ___ brush my teeth before bed. I never forget!","pos":"adv"},{"w":"asleep","def":"sleeping; not awake","ex":"At ten o'clock at night I'm fast ___ in bed.","pos":"adj","pic":"😴"},{"w":"wake up","def":"to stop sleeping","ex":"I ___ when my alarm rings, but I stay in bed for five more minutes.","pos":"phrase"},{"w":"brush","def":"to clean your teeth or make your hair tidy","ex":"I ___ my teeth after breakfast and before bed.","pos":"verb","pic":"🪥"},{"w":"shower","def":"you stand under it and water comes down to wash your body","ex":"I stand under the ___ and wash my hair.","pos":"noun","pic":"🚿"},{"w":"tired","def":"feeling that you need to rest or sleep","ex":"I went to bed very late, so I'm very ___ this morning.","pos":"adj","pic":"🥱"},{"w":"school bag","def":"a bag you carry your books and pencils to school in","ex":"Don't forget to put your homework in your ___!","pos":"noun","pic":"🎒"},{"w":"sandwich","def":"two pieces of bread with cheese, meat or salad between them","ex":"For lunch I've got a cheese ___ and an apple.","pos":"noun","pic":"🥪"},{"w":"bell","def":"a metal thing that rings to tell you a lesson is starting or ending","ex":"When the ___ rings at eleven o'clock, we go out to play.","pos":"noun","pic":"🔔"},{"w":"boring","def":"not fun or exciting at all","ex":"Nothing happens in this film. It's so ___!","pos":"adj"}],"grammar":[{"q":"My sister ___ to school by bus.","opts":["goes","go","going"],"a":0,"why":"With he, she and it, add -s or -es to the verb: she goes."},{"q":"We ___ lunch at twelve o'clock.","opts":["have","has","having"],"a":0,"why":"With I, you, we and they, use the verb with no -s: we have."},{"q":"___ your brother walk to school?","opts":["Does","Do","Is"],"a":0,"why":"Ask questions about he, she or it with 'Does': Does he walk?"},{"q":"I ___ like tests.","opts":["don't","doesn't","not"],"a":0,"why":"Use 'don't' with I, you, we and they: I don't like."},{"q":"She ___ her homework after dinner.","opts":["always does","does always","always do"],"a":0,"why":"'Always' goes before the verb, and with she the verb is 'does': she always does."},{"q":"I get up early, so I am ___ late for school.","opts":["never","always","often"],"a":0,"why":"'Never' means not at any time. I get up early, so I'm never late."},{"q":"My brother ___ a shower every morning.","opts":["has","have","is having"],"a":0,"why":"'Every morning' means it happens again and again, so use the present simple. My brother = he, so 'has'."},{"q":"We ___ go to school on Saturdays.","opts":["don't","doesn't","aren't"],"a":0,"why":"Use 'don't' + verb with I, you, we and they: we don't go."},{"q":"What time ___ the bell ring?","opts":["does","do","is"],"a":0,"why":"The bell = it. Ask about it with 'does': What time does it ring?"},{"q":"Our teacher ___ late.","opts":["is never","never is","never"],"a":0,"why":"Put 'never', 'always' and 'often' after am, is or are: she is never late."}],"sentences":["My little sister can't get dressed on her own.","What time do you get up?","Our teacher gives us lots of homework.","Does your brother walk to school?","Don't forget your school bag!","What time does the bell ring?"],"reading":[{"title":"Leo's school day","text":"Leo gets up at seven o'clock every day. He washes his face, gets dressed and has breakfast with his mum. Then he walks to school with his friend Ben. Lessons start at nine. Leo's favourite lesson is science because it is never boring. At break he plays football in the playground. After school he does his homework. It isn't difficult, but it takes a long time. At nine o'clock Leo is asleep in bed.","qs":[{"type":"mc","q":"What time does Leo get up?","opts":["at seven o'clock","at eight o'clock","at nine o'clock"],"a":0},{"type":"mc","q":"Who does Leo walk to school with?","opts":["his mum","his friend Ben","his sister"],"a":1},{"type":"tf","q":"Leo's favourite lesson is maths.","opts":["True","False"],"a":1},{"type":"tf","q":"Leo plays football at break.","opts":["True","False"],"a":0},{"type":"mc","q":"What does Leo do after school?","opts":["He plays tennis.","He does his homework.","He goes to the library."],"a":1}]},{"title":"Mia's late morning","text":"On Monday Mia woke up late because her alarm didn't ring. She had a very quick shower and got dressed. There was no time for breakfast, so Dad gave her a cheese sandwich for the bus. Mia got to school just before the bell rang at nine. In the first lesson she opened her school bag. Oh no! Her maths book was at home. 'Don't worry,' said her teacher. 'You can share with Tom.'","qs":[{"type":"mc","q":"Why did Mia wake up late?","opts":["Her alarm didn't ring.","She was ill.","It was Sunday."],"a":0},{"type":"tf","q":"Mia had breakfast at home.","opts":["True","False"],"a":1},{"type":"mc","q":"What did Dad give Mia for the bus?","opts":["an apple","a cheese sandwich","some juice"],"a":1},{"type":"tf","q":"The bell rang at nine.","opts":["True","False"],"a":0},{"type":"mc","q":"What was at home?","opts":["her school bag","her maths book","her sandwich"],"a":1}]}],"extra":[{"kind":"collocation","q":"I ___ my homework after dinner.","opts":["do","make","play","go"],"a":0,"why":"We say 'do your homework', not 'make' it."},{"kind":"preposition","q":"School starts ___ nine o'clock.","opts":["at","on","in","to"],"a":0,"why":"Use 'at' with clock times: at nine o'clock."},{"kind":"preposition","q":"I have swimming lessons ___ Tuesdays.","opts":["on","in","at","to"],"a":0,"why":"Use 'on' with days: on Monday, on Tuesdays."},{"kind":"phrasal","q":"It's warm in the classroom. Please ___ your coat.","opts":["take off","put on","get up","wake up"],"a":0,"why":"'Take off' means remove your clothes, like a coat. 'Put on' is the opposite."}]},{"id":"mover-2","title":"Sports and hobbies","emoji":"⚽","words":[{"w":"hockey","def":"a team sport where you hit a ball with a long stick","ex":"In ___, you use a stick to hit the ball into the goal.","pos":"noun","pic":"🏑"},{"w":"ice skating","def":"a sport where you move across ice in special boots","ex":"When the lake turns to ice in winter, we go ___.","pos":"noun","pic":"⛸️"},{"w":"climb","def":"to go up something using your hands and feet","ex":"Monkeys can ___ trees very quickly.","pos":"verb","pic":"🧗"},{"w":"dance","def":"to move your body to music","ex":"When I hear music, I want to ___!","pos":"verb","pic":"💃"},{"w":"fishing","def":"trying to catch fish with a long stick and a line","ex":"Grandpa and I go ___ at the river and catch big fish.","pos":"noun","pic":"🎣"},{"w":"swimming pool","def":"a big place full of water where you can swim","ex":"We jump into the blue water at the ___ near our school.","pos":"noun","pic":"🏊"},{"w":"goal","def":"the net you kick or hit the ball into to win a point","ex":"She kicked the ball into the ___ and her team won!","pos":"noun","pic":"🥅"},{"w":"film","def":"a story with moving pictures that you watch on a screen","ex":"We are going to watch a funny ___ at the cinema.","pos":"noun","pic":"🎬"},{"w":"kick","def":"to hit something with your foot","ex":"In football, you ___ the ball with your foot.","pos":"verb"},{"w":"catch","def":"to take and hold something that is moving through the air","ex":"Throw the ball to me. I can ___ it!","pos":"verb"},{"w":"hop","def":"to jump on one foot","ex":"Can you ___ on one foot to the end of the playground?","pos":"verb"},{"w":"comic","def":"a magazine with stories told in pictures","ex":"I'm reading a funny ___ with lots of pictures.","pos":"noun"},{"w":"basketball","def":"a game where two teams try to throw a ball through a high round net","ex":"Tall players are good at ___ because the net is very high.","pos":"noun","pic":"🏀"},{"w":"tennis","def":"a game where two or four players hit a small ball over a net","ex":"I play ___ with my dad. We hit the ball over the net to each other.","pos":"noun","pic":"🎾"},{"w":"sail","def":"to travel on water in a boat that the wind pushes","ex":"On windy days, my uncle likes to ___ his little boat on the lake.","pos":"verb","pic":"⛵"},{"w":"drum","def":"a round music thing that you hit with sticks or your hands","ex":"My brother plays the ___ very loudly. Boom, boom, boom!","pos":"noun","pic":"🥁"},{"w":"guitar","def":"a music thing with six strings that you play with your fingers","ex":"I'm learning to play the ___. It has got six strings.","pos":"noun","pic":"🎸"},{"w":"paint","def":"to make a picture with colours and a brush","ex":"Let's ___ a picture of the sea with blue and green colours.","pos":"verb","pic":"🎨"},{"w":"win","def":"to be the best or come first in a game or race","ex":"Run fast! You can ___ the race!","pos":"verb","pic":"🏆"},{"w":"team","def":"a group of people who play a sport together","ex":"There are eleven players in a football ___.","pos":"noun"}],"grammar":[{"q":"Look! The children ___ football in the park.","opts":["are playing","plays","is playing"],"a":0,"why":"Use am, is or are + -ing for what is happening now. The children = they, so 'are playing'."},{"q":"My dad ___ a book right now. He's on the sofa.","opts":["is reading","reads","are reading"],"a":0,"why":"'Right now' means at this moment, so use is + -ing: he is reading."},{"q":"I love ___ with my friends.","opts":["dancing","dances","danced"],"a":0,"why":"After 'love' or 'like', use the -ing form: I love dancing."},{"q":"What ___ you doing? I'm climbing a tree.","opts":["are","is","do"],"a":0,"why":"Ask about now with 'What are you doing?'"},{"q":"A football is ___ than a tennis ball.","opts":["bigger","big","biggest"],"a":0,"why":"To compare two things, use -er + than: bigger than."},{"q":"Our team ___ the match last Saturday.","opts":["won","wins","winning"],"a":0,"why":"'Last Saturday' is in the past. 'Win' is irregular: win, won."},{"q":"She ___ tennis every Saturday.","opts":["plays","is playing","play"],"a":0,"why":"'Every Saturday' tells us it happens again and again, so use the present simple: she plays."},{"q":"We ___ playing basketball. We're watching a film.","opts":["aren't","isn't","don't"],"a":0,"why":"Use 'aren't' (are not) + -ing with we, you and they."},{"q":"Yesterday Ben ___ the ball very high.","opts":["threw","throwed","throw"],"a":0,"why":"'Throw' is irregular. In the past it is 'threw'."},{"q":"I think tennis is ___ than hockey.","opts":["easier","more easy","easyer"],"a":0,"why":"When a short word ends in -y, change y to i and add -er: easy, easier."}],"sentences":["My brother is climbing a tree.","Do you like ice skating?","She kicked the ball into the goal.","My grandpa loves going fishing.","My sister plays the drums very loudly.","Which team won the match?"],"reading":[{"title":"A busy Saturday","text":"It's Saturday and my family is very busy. My sister Emma is playing hockey with her school team. She is faster than the other players! Dad loves fishing, so he is at the river with Grandpa. I like dancing, and I have a dance class at ten o'clock. And Mum? She is sitting on the sofa and reading a comic. That's her favourite hobby!","qs":[{"type":"mc","q":"What is Emma playing?","opts":["football","hockey","tennis"],"a":1},{"type":"mc","q":"Where is Dad?","opts":["at the river","at the swimming pool","at home"],"a":0},{"type":"tf","q":"Emma is slower than the other players.","opts":["True","False"],"a":1},{"type":"mc","q":"What time is the dance class?","opts":["at nine o'clock","at ten o'clock","at eleven o'clock"],"a":1},{"type":"tf","q":"Mum is reading a comic.","opts":["True","False"],"a":0}]},{"title":"Sam's new hobby","text":"Last year Sam didn't have a hobby. He watched cartoons every afternoon. Then his uncle gave him an old drum. Now Sam plays it every day after school! It's very loud, so Mum isn't always happy. Sam's sister plays the guitar, and his friend Ben sings. They have got a band called The Noisy Cats. On Saturday they are going to play at the school party.","qs":[{"type":"mc","q":"Who gave Sam a drum?","opts":["his uncle","his mum","his friend Ben"],"a":0},{"type":"mc","q":"What does Sam's sister play?","opts":["the drum","the guitar","the piano"],"a":1},{"type":"tf","q":"Sam plays the drum every day after school.","opts":["True","False"],"a":0},{"type":"tf","q":"Ben plays the guitar in the band.","opts":["True","False"],"a":1},{"type":"mc","q":"When are they going to play at the school party?","opts":["on Friday","on Saturday","on Sunday"],"a":1}]}],"extra":[{"kind":"collocation","q":"My sister ___ hockey every Saturday.","opts":["plays","goes","does","makes"],"a":0,"why":"Use 'play' with sports and games: play hockey, play football."},{"kind":"collocation","q":"On Sundays, Grandpa and I ___ fishing.","opts":["go","play","do","make"],"a":0,"why":"Use 'go' with many -ing activities: go fishing, go swimming, go skating."},{"kind":"collocation","q":"I ___ the guitar in a band.","opts":["play","do","go","make"],"a":0,"why":"Use 'play' with music: play the guitar, play the drums."},{"kind":"preposition","q":"My brother is very good ___ tennis.","opts":["at","in","on","for"],"a":0,"why":"We say 'good at' something: good at tennis, good at maths."}]},{"id":"mover-3","title":"In the town","emoji":"🚌","words":[{"w":"city","def":"a very big town with lots of people and buildings","ex":"London is a very big ___ with millions of people.","pos":"noun","pic":"🏙️"},{"w":"village","def":"a very small town in the countryside","ex":"My grandma lives in a small ___ with only one shop.","pos":"noun","pic":"🏘️"},{"w":"bus stop","def":"the place by the road where you wait to get on a bus","ex":"Wait at the ___ and the number 12 bus will come.","pos":"noun","pic":"🚏"},{"w":"cafe","def":"a small place where you can buy drinks and simple food","ex":"Let's have a hot chocolate and a cake at the ___.","pos":"noun","pic":"☕"},{"w":"cinema","def":"a building where you watch films on a big screen","ex":"We are going to the ___ to see a new film.","pos":"noun","pic":"🍿"},{"w":"library","def":"a building with lots of books that you can take home and bring back","ex":"I get books from the ___ and take them back after two weeks.","pos":"noun","pic":"📚"},{"w":"supermarket","def":"a very big shop that sells food and lots of other things","ex":"We push a trolley around the big ___ and buy milk, bread and soap.","pos":"noun","pic":"🛒"},{"w":"market","def":"a place outside with tables where people sell fruit, vegetables and other things","ex":"On Saturdays, farmers sell fruit and vegetables at the ___ in the square.","pos":"noun"},{"w":"building","def":"a house, school, shop or office: something with walls and a roof","ex":"My dad works in a tall ___ with twenty floors.","pos":"noun","pic":"🏢"},{"w":"map","def":"a picture that shows where places and roads are","ex":"We are lost! Let's look at the ___.","pos":"noun","pic":"🗺️"},{"w":"road","def":"a long hard way for cars, buses and bikes","ex":"Look left and right before you cross the ___.","pos":"noun","pic":"🛣️"},{"w":"go shopping","def":"to visit shops and buy things","ex":"On Saturdays, Mum and I ___ for new clothes.","pos":"phrase","pic":"🛍️"},{"w":"station","def":"a building where trains stop so that people can get on and off","ex":"The train leaves from the ___ at ten o'clock.","pos":"noun","pic":"🚉"},{"w":"car park","def":"a place where people can leave their cars","ex":"Dad left the car in the ___ next to the supermarket.","pos":"noun","pic":"🅿️"},{"w":"taxi","def":"a car with a driver that you pay to take you somewhere","ex":"It's late and there are no buses, so let's take a ___ home.","pos":"noun","pic":"🚕"},{"w":"bank","def":"a place that keeps people's money safe","ex":"Mum is getting some money from the ___.","pos":"noun","pic":"🏦"},{"w":"bridge","def":"a road or path that goes over a river so you can cross it","ex":"We walked over the old ___ and looked down at the river.","pos":"noun","pic":"🌉"},{"w":"post office","def":"a place where you can send letters and buy stamps","ex":"I'm going to the ___ to send a letter to my cousin.","pos":"noun","pic":"🏤"},{"w":"square","def":"an open place in the middle of a town, with buildings all around it","ex":"There is a big market in the town ___ on Saturdays.","pos":"noun"},{"w":"straight on","def":"forward, without turning left or right","ex":"Don't turn left or right. Go ___ and the cinema is at the end of the road.","pos":"phrase","pic":"⬆️"}],"grammar":[{"q":"There aren't ___ shops in my village.","opts":["any","some","a"],"a":0,"why":"Use 'any' after 'not': there aren't any shops."},{"q":"There are ___ new books in the library.","opts":["some","any","a"],"a":0,"why":"Use 'some' in positive sentences about more than one thing."},{"q":"A village is ___ than a city.","opts":["smaller","small","more small"],"a":0,"why":"Short words add -er to compare: small, smaller than."},{"q":"The new cafe is ___ than the old one.","opts":["better","gooder","more good"],"a":0,"why":"'Good' is special: good, better."},{"q":"Last Saturday we ___ to the cinema.","opts":["went","go","goed"],"a":0,"why":"'Go' is irregular. In the past it is 'went'."},{"q":"Yesterday we ___ around the market.","opts":["walked","walk","walks"],"a":0,"why":"For the past, add -ed to most verbs: walk, walked."},{"q":"We need ___ bread from the supermarket.","opts":["some","any","a"],"a":0,"why":"Use 'some' in positive sentences, also with words like bread and milk."},{"q":"The new library is ___ than the old one.","opts":["more beautiful","beautifuller","beautiful"],"a":0,"why":"Long words use 'more' to compare: more beautiful than."},{"q":"Last night we ___ a taxi to the station.","opts":["took","taked","take"],"a":0,"why":"'Take' is irregular. In the past it is 'took'."},{"q":"We ___ go to the bank yesterday. It was closed.","opts":["didn't","don't","weren't"],"a":0,"why":"For 'not' in the past, use 'didn't' + verb: we didn't go."}],"sentences":["Is there a library in your town?","My village hasn't got any shops.","Which bus goes to the city centre?","Where can I buy a map?","Let's take a taxi to the station.","Is there a car park near here?"],"reading":[{"title":"A day in the city","text":"Last Saturday Kate went to the city with her grandma. They took the bus from the bus stop near Kate's house. First they went to a big market in the square. Grandma bought some apples and flowers. Then they walked to the library, and Kate chose two books about animals. They were hungry, so they had lunch at a little cafe. Kate had a sandwich and a hot chocolate. It was a great day!","qs":[{"type":"mc","q":"Who did Kate go to the city with?","opts":["her mum","her grandma","her friend"],"a":1},{"type":"mc","q":"How did they go to the city?","opts":["by bus","by car","by train"],"a":0},{"type":"tf","q":"Kate chose two books about cars.","opts":["True","False"],"a":1},{"type":"mc","q":"Where did they have lunch?","opts":["at the market","at the library","at a cafe"],"a":2},{"type":"tf","q":"Kate had a hot chocolate.","opts":["True","False"],"a":0}]},{"title":"Where is the station?","text":"Paul and his dad are in a new city. They want to go to the train station, but they can't find it. Dad asks a woman at the bus stop. 'Go straight on, past the bank,' she says. 'Then walk over the bridge. The station is next to a big car park.' They walk for ten minutes and cross the old bridge. There it is! Their train leaves in five minutes, so they  falls from the sky when it's very cold","ex":"The garden is all white because of the ___.","pos":"noun","pic":"❄️"},{"w":"windy","def":"with a lot of air moving fast outside","ex":"It's ___ today. Let's fly a kite!","pos":"adj","pic":"🌬️"},{"w":"rainbow","def":"seven colours in a big curve across the sky","ex":"After the rain, we saw a beautiful ___ in the sky.","pos":"noun","pic":"🌈"},{"w":"wet","def":"covered in water; not dry","ex":"I didn't take my umbrella, so my hair is ___.","pos":"adj","pic":"💦"},{"w":"spring","def":"the time of year after winter, when flowers start to grow","ex":"In ___, the trees get new green leaves.","pos":"noun","pic":"🌷"},{"w":"summer","def":"the hot time of the year, between spring and autumn","ex":"We go to the beach in ___ because it's hot.","pos":"noun","pic":"🏖️"},{"w":"autumn","def":"the time of year after summer, when leaves fall from the trees","ex":"In ___, the leaves turn red and brown and fall from the trees.","pos":"noun","pic":"🍂"},{"w":"winter","def":"the cold time of the year, after autumn","ex":"In ___, it's very cold and sometimes it snows.","pos":"noun","pic":"⛄"},{"w":"umbrella","def":"you hold it over your head to stay dry when it rains","ex":"It's raining! Take your ___ so you don't get wet.","pos":"noun","pic":"☔"},{"w":"ice","def":"water that is so cold that it becomes hard","ex":"Put some ___ in my juice, please. It's very hot today.","pos":"noun","pic":"🧊"},{"w":"coat","def":"a warm jacket, often long, that you wear outside when it's cold","ex":"My winter ___ is long and warm, and it has got big pockets.","pos":"noun","pic":"🧥"},{"w":"scarf","def":"a long piece of cloth that you wear around your neck to keep warm","ex":"It's cold, so I'm wearing a ___ around my neck.","pos":"noun","pic":"🧣"},{"w":"sunglasses","def":"dark glasses that you wear when the sun is bright","ex":"The sun is very bright. Put on your ___!","pos":"noun","pic":"🕶️"},{"w":"season","def":"spring, summer, autumn or winter: one of the four parts of the year","ex":"My favourite ___ is spring because I love the flowers.","pos":"noun"},{"w":"dry","def":"with no water on it; not wet","ex":"My hair is wet. Can I have a towel to get ___?","pos":"adj"},{"w":"sky","def":"the space above you, where you can see the sun, the moon and clouds","ex":"Look up at the ___! It's blue and there are no clouds.","pos":"noun"}],"grammar":[{"q":"Look at those black clouds! It ___ rain.","opts":["is going to","are going to","going to"],"a":0,"why":"Use 'is going to' when you can see that something will happen. With it, use 'is'."},{"q":"We ___ visit Grandma in the summer.","opts":["are going to","is going to","going"],"a":0,"why":"Use 'are going to' with we, you and they for plans."},{"q":"Today is ___ than yesterday. I need a coat!","opts":["colder","cold","more cold"],"a":0,"why":"To compare, add -er + than: cold, colder than."},{"q":"Summer is ___ than winter.","opts":["hotter","hoter","more hot"],"a":0,"why":"Hot, hotter: double the t, then add -er."},{"q":"Take an umbrella. It ___ outside.","opts":["is raining","rains","rain"],"a":0,"why":"Use is + -ing for things that are happening now."},{"q":"It's very hot here in summer, so it ___ snows.","opts":["never","always","often"],"a":0,"why":"'Never' means not at any time. It's hot, so it never snows."},{"q":"I ___ going to wear my new scarf tomorrow.","opts":["am","is","are"],"a":0,"why":"With 'going to', use 'am' with I: I am going to wear it."},{"q":"It ___ often snow here. It's warm in winter.","opts":["doesn't","don't","isn't"],"a":0,"why":"The weather = it. Use 'doesn't' + verb with it: it doesn't snow."},{"q":"Was it sunny yesterday? No, it ___ cloudy.","opts":["was","were","is"],"a":0,"why":"'Yesterday' is in the past. Use 'was' with it: it was cloudy."},{"q":"In my country it ___ rains in autumn.","opts":["often","is often","often is"],"a":0,"why":"Put 'often' before most verbs: it often rains."}],"sentences":["What is the weather like?","My coat is wet from the rain.","We are going to build a snowman.","Look at that beautiful rainbow!","I'm going to wear my new scarf.","Which season do you like best?"],"reading":[{"title":"Four seasons","text":"There are four seasons in my country. In spring it often rains, and the flowers start to grow. Summer is hot and sunny, so we go swimming in the sea. In autumn it is windy, and the leaves fall from the trees. Winter is very cold. Sometimes it snows, and we make a snowman in the garden. My favourite season is summer because I love the beach!","qs":[{"type":"mc","q":"When do the flowers start to grow?","opts":["in spring","in summer","in autumn"],"a":0},{"type":"mc","q":"What do they do in summer?","opts":["They make a snowman.","They go swimming in the sea.","They fly kites."],"a":1},{"type":"tf","q":"It is windy in autumn.","opts":["True","False"],"a":0},{"type":"tf","q":"The writer's favourite season is winter.","opts":["True","False"],"a":1},{"type":"mc","q":"Where do they make a snowman?","opts":["in the garden","in the park","on the beach"],"a":0}]},{"title":"A snow day","text":"Yesterday it snowed all day, so there was no school! Ella put on her warm coat, her scarf and her boots. She went into the garden with her brother. The sky was grey and the snow was soft. They made a big snowman and gave him Dad's old hat. Then they played in the snow with their friends. When they came inside, their hands were wet and cold. Mum made them hot chocolate.","qs":[{"type":"mc","q":"Why was there no school?","opts":["It snowed all day.","It was Sunday.","The teacher was ill."],"a":0},{"type":"mc","q":"What did they give the snowman?","opts":["Mum's scarf","Dad's old hat","Ella's coat"],"a":1},{"type":"tf","q":"The sky was blue.","opts":["True","False"],"a":1},{"type":"tf","q":"Their hands were wet and cold when they came inside.","opts":["True","False"],"a":0},{"type":"mc","q":"What did Mum make?","opts":["soup","hot chocolate","a cake"],"a":1}]}],"extra":[{"kind":"preposition","q":"My birthday is ___ summer.","opts":["in","on","at","to"],"a":0,"why":"Use 'in' with seasons and months: in summer, in July."},{"kind":"idiom","q":"What does 'It's boiling today!' mean?","opts":["It's very hot.","It's very cold.","It's very wet.","It's very windy."],"a":0,"why":"When people say 'It's boiling!' about the weather, they mean it's very, very hot."},{"kind":"collocation","q":"There's a strong ___ today. Hold on to your hat!","opts":["wind","rain","snow","sky"],"a":0,"why":"We say 'strong wind', but 'heavy rain' and 'heavy snow'."},{"kind":"linking","q":"I took my umbrella ___ it was raining.","opts":["because","but","or","so"],"a":0,"why":"Use 'because' to give a reason: I took it because it was raining."}]},{"id":"mover-5","title":"My body and health","emoji":"🩺","words":[{"w":"neck","def":"the part of your body between your head and your shoulders","ex":"A giraffe has got a very long ___.","pos":"noun"},{"w":"shoulder","def":"the part of your body between your neck and your arm","ex":"The parrot is sitting on the pirate's ___.","pos":"noun"},{"w":"back","def":"the part of your body behind you, from your neck down to your legs","ex":"Lie on your ___ and look up at the stars.","pos":"noun"},{"w":"stomach","def":"the part inside your body where food goes after you eat it","ex":"I ate too much cake and now my ___ hurts.","pos":"noun"},{"w":"teeth","def":"the hard white things in your mouth that you bite with","ex":"Brush your ___ twice a day.","pos":"noun","pic":"🦷"},{"w":"headache","def":"a pain in your head","ex":"The music is very loud and now I've got a ___.","pos":"noun","pic":"🤕"},{"w":"cold","def":"a small illness that makes you sneeze and cough","ex":"I've got a ___, so I need lots of tissues for my nose.","pos":"noun","pic":"🤧"},{"w":"temperature","def":"when your body is too hot because you are ill","ex":"You're very hot. I think you've got a ___.","pos":"noun","pic":"🤒"},{"w":"doctor","def":"a person whose job is to help ill people get better","ex":"I feel ill, so Mum is taking me to see the ___.","pos":"noun","pic":"👩‍⚕️"},{"w":"hospital","def":"a big building where doctors and nurses look after very ill people","ex":"My baby brother was born in this ___.","pos":"noun","pic":"🏥"},{"w":"medicine","def":"something you take when you are ill, to help you get better","ex":"Take this ___ three times a day and you will feel better.","pos":"noun","pic":"💊"},{"w":"hurt","def":"to have a pain somewhere in your body","ex":"My legs ___ after the long walk.","pos":"verb","pic":"🩹"},{"w":"ear","def":"one of the two parts of your head that you hear with","ex":"My ___ hurts, so I can't hear very well.","pos":"noun","pic":"👂"},{"w":"nose","def":"the part of your face that you smell with","ex":"Mmm! My ___ can smell Mum's cake from the garden.","pos":"noun","pic":"👃"},{"w":"foot","def":"the part at the end of your leg that you stand on","ex":"This shoe is too small for my ___.","pos":"noun","pic":"🦶"},{"w":"beard","def":"hair that grows on the lower part of a man's face","ex":"Grandpa has got a long white ___ like Father Christmas.","pos":"noun","pic":"🧔"},{"w":"strong","def":"with a body that can lift and carry heavy things","ex":"My big brother is very ___. He can carry me on his back!","pos":"adj","pic":"💪"},{"w":"sick","def":"feeling ill, often in your stomach","ex":"I ate too many sweets and now I feel ___.","pos":"adj","pic":"🤢"},{"w":"cough","def":"to push air out of your mouth with a short loud noise when you are ill","ex":"Please put your hand over your mouth when you ___.","pos":"verb"},{"w":"nurse","def":"a person in a hospital who looks after ill people and helps the doctors","ex":"The ___ gave me some water and helped the doctor.","pos":"noun"}],"grammar":[{"q":"You ___ brush your teeth every day.","opts":["must","mustn't","musts"],"a":0,"why":"'Must' means it is very important to do it."},{"q":"You ___ eat lots of sweets. They're bad for your teeth.","opts":["mustn't","must","musts"],"a":0,"why":"'Mustn't' means don't do it."},{"q":"What's the matter? My stomach ___.","opts":["hurts","hurt","hurting"],"a":0,"why":"My stomach = it, so add -s: it hurts."},{"q":"Yesterday I ___ over in the playground.","opts":["fell","falled","fall"],"a":0,"why":"'Fall' is irregular. In the past it is 'fell'."},{"q":"Last week Tom ___ a bad cold.","opts":["had","has","haved"],"a":0,"why":"'Have' is irregular. In the past it is 'had'."},{"q":"___ you go to the doctor yesterday?","opts":["Did","Do","Does"],"a":0,"why":"Ask questions about the past with 'Did'."},{"q":"My ears ___ because the music is very loud.","opts":["hurt","hurts","hurting"],"a":0,"why":"'My ears' means more than one (they), so the verb has no -s: they hurt."},{"q":"Last night I ___ a lot because of my cold.","opts":["coughed","cough","coughs"],"a":0,"why":"'Last night' is in the past. Add -ed to the verb: cough, coughed."},{"q":"___ you feel better now? Yes, thank you.","opts":["Do","Are","Does"],"a":0,"why":"Ask 'Do you...?' with you and a verb like 'feel'."},{"q":"He ___ stay in bed today.","opts":["must","musts","must to"],"a":0,"why":"'Must' never changes and has no 'to' after it: he must stay."}],"sentences":["You must drink lots of water.","Has your sister got a temperature?","The doctor gave me some medicine.","What's the matter with your back?","The nurse looked at my sore foot.","My grandpa has got a white beard."],"reading":[{"title":"Max stays at home","text":"Last Monday Max didn't go to school. He woke up with a headache and a cough, and he had a temperature. His mum took him to the doctor. The doctor said, 'You've got a bad cold. You must stay in bed for two days and drink lots of water.' Max took his medicine and slept a lot. On Wednesday he felt better, and he went back to school.","qs":[{"type":"mc","q":"When did Max wake up with a headache?","opts":["last Monday","last Wednesday","last Friday"],"a":0},{"type":"mc","q":"Who took Max to the doctor?","opts":["his dad","his mum","his grandma"],"a":1},{"type":"tf","q":"The doctor said Max had a bad cold.","opts":["True","False"],"a":0},{"type":"tf","q":"Max had to stay in bed for a week.","opts":["True","False"],"a":1},{"type":"mc","q":"When did Max go back to school?","opts":["on Tuesday","on Wednesday","on Thursday"],"a":1}]},{"title":"Lucy and the school nurse","text":"Last Tuesday, Lucy hurt her foot in a hockey game at school. It wasn't bad, but she couldn't walk very well. Her teacher took her to the school nurse. The nurse looked at her foot and put some ice on it. 'You must rest it for two days,' she said. 'And you mustn't play hockey this week.' Lucy was sad, but the next Monday her foot was better and she played again.","qs":[{"type":"mc","q":"How did Lucy hurt her foot?","opts":["in a hockey game","on her bike","at the swimming pool"],"a":0},{"type":"mc","q":"Who took Lucy to the nurse?","opts":["her mum","her teacher","her friend"],"a":1},{"type":"tf","q":"The nurse put some ice on Lucy's foot.","opts":["True","False"],"a":0},{"type":"tf","q":"The nurse said Lucy must rest for a week.","opts":["True","False"],"a":1},{"type":"mc","q":"What mustn't Lucy do this week?","opts":["play hockey","go to school","read books"],"a":0}]}],"extra":[{"kind":"preposition","q":"I've got a pain ___ my stomach.","opts":["in","on","at","under"],"a":0,"why":"Use 'in' for a pain inside your body: a pain in my stomach."},{"kind":"collocation","q":"I ___ a bad cough.","opts":["have got","am","do","make"],"a":0,"why":"We say 'have got' a cough, a cold or a headache."},{"kind":"collocation","q":"I hope you ___ better soon!","opts":["get","make","do","have"],"a":0,"why":"We say 'get better' when an ill person starts to feel well again."},{"kind":"wordform","q":"Brush your teeth ___ (careful).","opts":["carefully","careful","careless","care"],"a":0,"why":"Use an adverb with -ly to say how you do something: brush carefully."}]},{"id":"mover-6","title":"In the kitchen","emoji":"🍳","words":[{"w":"cook","def":"to make food hot so you can eat it, for example in an oven","ex":"Dad likes to ___ fish and rice for dinner.","pos":"verb","pic":"🍳"},{"w":"plate","def":"a flat round dish that you put food on","ex":"Put your chips on your ___ and come to the table.","pos":"noun","pic":"🍽️"},{"w":"bowl","def":"a round deep dish for soup, rice or cereal","ex":"I eat my cereal from a big ___ with a spoon.","pos":"noun","pic":"🥣"},{"w":"cup","def":"a small round thing with a handle that you drink hot drinks from","ex":"Would you like a ___ of tea, Grandma?","pos":"noun"},{"w":"glass","def":"you drink water or juice from it, and you can see through it","ex":"Put the orange juice in a tall ___ with some ice.","pos":"noun","pic":"🥛"},{"w":"spoon","def":"a small thing with a round end that you use to eat soup","ex":"You eat soup with a ___, not with a fork.","pos":"noun","pic":"🥄"},{"w":"fork","def":"a thing with three or four points that you use to pick up food","ex":"Hold your ___ in your left hand and your knife in your right.","pos":"noun"},{"w":"bottle","def":"a tall thing, often made of glass or plastic, for drinks like water or milk","ex":"There is a ___ of water in my school bag.","pos":"noun"},{"w":"fridge","def":"a cold cupboard in the kitchen that keeps food fresh","ex":"The cheese and the milk are in the ___ to keep them cold.","pos":"noun"},{"w":"pancake","def":"a thin, flat, round cake that you cook in a pan","ex":"I like my ___ with lemon and sugar.","pos":"noun","pic":"🥞"},{"w":"soup","def":"a hot food made from vegetables or meat in water, that you eat with a spoon","ex":"It's cold outside, so let's have some hot tomato ___.","pos":"noun","pic":"🍲"},{"w":"salad","def":"a cold mix of vegetables like tomatoes and green leaves","ex":"I'm making a ___ with tomatoes, carrots and green leaves.","pos":"noun","pic":"🥗"},{"w":"cheese","def":"a yellow or white food made from milk","ex":"Pizza has got tomato and ___ on it.","pos":"noun","pic":"🧀"},{"w":"meat","def":"food from animals, like chicken or beef","ex":"Lions eat ___. They don't eat grass.","pos":"noun","pic":"🥩"},{"w":"honey","def":"a sweet, sticky, yellow food that bees make","ex":"Bears love sweet ___.","pos":"noun","pic":"🍯"},{"w":"salt","def":"small white bits that you put on food to make it taste better","ex":"Sea water tastes of ___.","pos":"noun","pic":"🧂"},{"w":"vegetable","def":"a plant that we eat, like a carrot or a potato","ex":"My favourite ___ is broccoli.","pos":"noun","pic":"🥦"},{"w":"hungry","def":"wanting to eat","ex":"I didn't have breakfast, so I'm very ___ now.","pos":"adj"},{"w":"delicious","def":"with a very good taste","ex":"Mmm! This chocolate cake is ___!","pos":"adj","pic":"😋"},{"w":"hot","def":"very warm; the opposite of cold","ex":"Don't touch the pan. It's very ___!","pos":"adj"}],"grammar":[{"q":"Are there ___ eggs in the fridge?","opts":["any","a","much"],"a":0,"why":"Use 'any' in questions: Are there any eggs?"},{"q":"We haven't got ___ milk. Let's buy some.","opts":["any","some","a"],"a":0,"why":"Use 'any' after 'not': we haven't got any milk."},{"q":"Children ___ use the oven without a grown-up.","opts":["mustn't","must","don't must"],"a":0,"why":"'Mustn't' means it is not allowed. Don't use the oven on your own!"},{"q":"Dad ___ pancakes right now. Can you smell them?","opts":["is making","makes","make"],"a":0,"why":"'Right now' means at this moment, so use is + -ing: he is making."},{"q":"I'm ___ make a cake for Grandma's birthday tomorrow.","opts":["going to","go to","going"],"a":0,"why":"Use am, is or are + 'going to' + verb for plans."},{"q":"Yesterday we ___ soup for lunch.","opts":["ate","eated","eat"],"a":0,"why":"'Eat' is irregular. In the past it is 'ate'."},{"q":"Mum's soup is ___ than the soup in the cafe.","opts":["more delicious","deliciouser","delicious"],"a":0,"why":"Long words use 'more' to compare: more delicious than."},{"q":"I ___ have cereal for breakfast. I eat it every day!","opts":["always","never","sometimes"],"a":0,"why":"'Always' means every time. I eat it every day, so I always have it."},{"q":"How often ___ you wash the dishes?","opts":["do","does","are"],"a":0,"why":"Ask with 'do' for I, you, we and they: How often do you...?"},{"q":"Last night I ___ a glass of milk before bed.","opts":["drank","drinked","drink"],"a":0,"why":"'Drink' is irregular. In the past it is 'drank'."}],"sentences":["Dad is making a big pancake.","Is there any milk in the fridge?","You must wash your hands.","Can you give me the salt?","This soup is too hot!","We haven't got any cheese."],"reading":[{"title":"Pancakes for breakfast","text":"It's Saturday morning, and Tom and his dad are in the kitchen. They are going to make pancakes! Tom puts some flour, two eggs and some milk in a big bowl. Dad mixes them with a spoon, and then he cooks the pancakes. Tom eats his pancake with honey, but Dad has his with cheese. 'Mmm, delicious!' says Tom. After breakfast, they wash all the plates and bowls.","qs":[{"type":"mc","q":"What are Tom and his dad going to make?","opts":["soup","pancakes","a salad"],"a":1},{"type":"mc","q":"How many eggs does Tom put in the bowl?","opts":["one","two","three"],"a":1},{"type":"tf","q":"Tom mixes the eggs and the milk.","opts":["True","False"],"a":1},{"type":"mc","q":"What does Tom eat his pancake with?","opts":["cheese","honey","salt"],"a":1},{"type":"tf","q":"They wash the plates and bowls after breakfast.","opts":["True","False"],"a":0}]},{"title":"Grandma's vegetable soup","text":"Last Sunday, Mia visited her grandma. It was cold and rainy, so Grandma made her famous vegetable soup. Mia helped her. She washed the carrots and potatoes, and Grandma cut them. They put them in a big pot with some water and salt. The soup cooked for an hour. When it was ready, it was very hot, so they waited for ten minutes. Then they ate it with bread and cheese. It was the best soup in the world!","qs":[{"type":"mc","q":"What was the weather like last Sunday?","opts":["sunny and hot","cold and rainy","windy and snowy"],"a":1},{"type":"tf","q"

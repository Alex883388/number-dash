en minutes away from us, so I see her nearly every week.\nShe's a very kind and patient person, and she's always smiling. She's also really good at cooking. When I visit her, we often cook together, and she has taught me how to make her famous vegetable soup. In the summer, we work in her garden and grow tomatoes and beans. She also tells me stories about when she was a child, and they're usually very funny.\nThe main reason I admire her is that she never stops learning. Last year, she decided to learn how to use a tablet, and now she sends me a message every day. I think that's amazing. I hope I'll be like her when I'm older.","part3":["Who do children usually admire more, people in their family or famous people? Why?","What can young people learn from older people?","Do grandparents spend more time with their grandchildren now than in the past?"]},{"id":"explorer-3","stage":4,"topic":"Describe a game or sport you enjoy playing with your friends","points":["what the game is","where and when you play it","how you play it","and explain why you enjoy it"],"phrases":["A game I really enjoy playing with my friends is…","I've played it since I was…","The rules are simple. You have to…","I enjoy it for a few reasons. First of all,…","Even when we lose, it doesn't really matter, because…"],"model":"A game I really enjoy playing with my friends is football. I've played it since I was about six, and it's still my favourite sport.\nWe usually play in the park near my school every Saturday morning. There are about ten of us, so we make two teams of five. We use our jackets as goalposts, because there aren't any real goals there. The rules are simple. You have to kick the ball into the other team's goal, and you can't touch it with your hands, unless you're the goalkeeper. We usually keep playing until somebody's mum calls them home for lunch!\nI enjoy it for a few reasons. First of all, it's great exercise, and I always feel full of energy afterwards. It's also a fun way to spend time with my friends. Even when my team loses, it doesn't really matter, because we laugh a lot.","part3":["Why do you think football is so popular all over the world?","Is it better for children to play team sports or sports they do on their own? Why?","Do children today play outside less than children did in the past? Why?"]},{"id":"explorer-4","stage":4,"topic":"Describe a festival or celebration that is important in your country","points":["what it is called","when it happens","what people do to celebrate it","and explain why you enjoy it"],"phrases":["The festival I'd like to describe is…","It usually happens in…, and it lasts for…","Before the festival, everyone…","People believe that it…","I enjoy it so much because…"],"model":"The festival I'd like to describe is Lunar New Year, which is the most important celebration in my country. It usually happens in late January or February, and it lasts for several days.\nBefore the festival, everyone cleans their house from top to bottom, because people believe it sweeps away bad luck. We also buy flowers and decorate our home in red and gold, which are lucky colours. On the first morning of the new year, we put on new clothes and visit our grandparents and other relatives. The adults give the children red envelopes with a little money inside. In the evening, there are often fireworks in the city centre.\nI enjoy it so much because the whole family gets together. My cousins live quite far away, so this is the only time I can see them. And of course, there's lots of delicious food, which is my favourite part!","part3":["Why are festivals important for families?","Do you think traditional festivals will be less popular in the future? Why?","Is it a good idea for children to learn about festivals from other countries?"]},{"id":"achiever-1","stage":5,"topic":"Describe a skill that took you a long time to learn","points":["what the skill is","when and how you learnt it","what was difficult about it","and explain how you felt when you could finally do it well"],"phrases":["It took me much longer than I'd expected.","To be honest, the beginning was really frustrating.","The hardest part, though, was…","At one point I nearly gave up, but…","If I hadn't…, I would probably have…"],"model":"I'd like to talk about learning to play the guitar, which took me much longer than I'd expected. I got my first guitar for my ninth birthday, and since then I've had a lesson with a teacher every Thursday after school. On top of that, I watch online videos to pick up new songs.\nTo be honest, the beginning was really frustrating. My fingers were sore for weeks, and I couldn't press the strings hard enough to make a clear sound. The hardest part, though, was changing quickly from one chord to another. Whenever I tried to play a whole song, I kept stopping in the middle, and it sounded awful. At one point I nearly gave up, but my teacher persuaded me to practise for fifteen minutes every day instead of for an hour once a week.\nThat advice made all the difference. About a year later, I played a complete song at a family party without a single mistake, and I felt incredibly proud. If I hadn't listened to her, I would probably have given up. It taught me that even something that seems impossible gradually gets easier if you keep going.","part3":["Which skills do you think are the most important for young people to learn today?","Is it better to learn a skill from a teacher or to teach yourself using online videos?","Why do some people give up when they are learning something new?"]},{"id":"achiever-2","stage":5,"topic":"Describe a book you enjoyed reading","points":["what the book is called and who wrote it","when you read it","what the story is about","and explain why you enjoyed it"],"phrases":["The book I'd like to talk about is…, which was written by…","I enjoyed it so much that…","The story is about…, who…","What I loved most about the book was…","Apart from that, I admired… because, although…"],"model":"The book I'd like to talk about is Matilda, which was written by Roald Dahl. I first read it when I was ten, during the summer holidays, and I enjoyed it so much that I finished it in three days.\nThe story is about a brilliant little girl called Matilda, who teaches herself to read when she's only three. Unfortunately, her parents aren't interested in her at all, and they'd much rather watch television than talk to her. At school, she meets a kind teacher called Miss Honey, who soon realises how clever Matilda is. However, the headmistress, Miss Trunchbull, is incredibly strict and treats the children terribly. Eventually, Matilda discovers that she can move things just by looking at them, and she uses this power to stand up to the headmistress.\nWhat I loved most about the book was its humour. Roald Dahl describes the adults in such a ridiculous way that I couldn't stop laughing. Apart from that, I admired Matilda because, although she's small, she's brave enough to fight for what's right. I think that's an important message for anyone my age.","part3":["Do you think children read fewer books than they did in the past? Why?","What are the advantages of reading a book compared with watching a film of the same story?","Should parents choose the books their children read, or let them choose for themselves?"]},{"id":"achiever-3","stage":5,"topic":"Describe a time when you helped someone","points":["who you helped","when and where it happened","what you did to help","and explain how you felt about helping this person"],"phrases":["I'd like to describe a time when…","I noticed that he was looking rather…","So I went over and asked if…","Looking back, it was such a small thing to do, but…","It made a huge difference to…"],"model":"I'd like to describe a time when I helped a new classmate called Lucas. He joined our school at the start of this year, after his family had moved here from Brazil.\nOn his first day, I noticed that he was sitting on his own at lunchtime and looking rather lost. His English was quite good, but he was obviously nervous, and he didn't know anyone. So I went over and asked if he wanted to join my friends and me. After that, I showed him around the school, explained how the timetable worked and introduced him to some of the teachers. For the first few weeks, I also helped him with some tricky words in our history lessons, while he taught me a few phrases in Portuguese in return.\nLooking back, it was such a small thing to do, but it made a huge difference to him. A few months later, he told me that if I hadn't spoken to him that day, he would have felt completely alone. Honestly, hearing that made me feel really proud. Now we're close friends, and I've realised that being kind doesn't have to be difficult.","part3":["In what ways can children help people in their local community?","Do you think people are less willing to help strangers than they used to be?","Should schools encourage children to do volunteer work? Why or why not?"]},{"id":"achiever-4","stage":5,"topic":"Describe a change you would like to see in your town or city","points":["what the change is","why it is needed","how it could be done","and explain how it would improve people's lives"],"phrases":["If I could change one thing about my town, I'd…","At the moment, there are hardly any…","The problem is that…","I'm convinced this would make a real difference.","Not only that, but…"],"model":"If I could change one thing about my town, I'd build safe cycle paths, especially on the roads leading to schools. At the moment, there are hardly any, so most parents drive their children to school instead.\nThe problem is that the traffic gets really heavy in the mornings, and the air near the main roads isn't very clean. Lots of my friends would love to cycle, but their parents think it's too dangerous, and to be fair, they're probably right. In my opinion, the council could solve this by turning one lane of the busiest roads into a cycle path, with a low barrier to separate bikes from cars. They might also put bike racks outside schools and the library, so that people have somewhere secure to leave their bikes.\nI'm convinced this would make a real difference. For one thing, children would get more exercise and feel more independent. Not only that, but with fewer cars on the road, the town would be quieter and the air would be cleaner. I just wish the council had done this years ago, because I think everyone would benefit, not only cyclists.","part3":["What do you think is the biggest problem in towns and cities today?","Would it be a good idea to keep cars out of city centres? Why or why not?","How do you think cities might change over the next fifty years?"]},{"id":"expert-1","stage":6,"topic":"Describe a teacher who has had a big influence on you","points":["who the teacher is","what subject they teach","what is special about the way they teach","and explain how they have influenced you"],"phrases":["The teacher who springs to mind straight away is…","What made her lessons so special was the way she…","Rather than just…, she'd…","More often than not,…","If it hadn't been for her, I'd probably still…"],"model":"The teacher who springs to mind straight away is Miss Clarke, who taught me maths for my last two years of primary school. She's retired now, but I still bump into her at the library from time to time.\nWhat made her lessons so special was the way she brought numbers to life. Rather than just giving us pages of sums, she'd set us real problems, like planning a class trip on a tight budget or working out how much paint we'd need to redecorate the classroom. She also had a habit of treating mistakes as something to celebrate. Whenever someone got an answer wrong, she'd ask them to talk us through their thinking, and more often than not, the whole class learnt something from it. As a result, nobody was afraid to put their hand up, which is fairly rare, if you ask me.\nBefore I was in her class, I was convinced I just wasn't a maths person. I used to dread tests, and my mind would go blank the moment I saw a fraction. If it hadn't been for her, I'd probably still feel that way. She showed me that being good at something is largely a matter of persistence rather than talent. These days, maths is one of my strongest subjects, and I'm even considering becoming an engineer. More importantly, though, she taught me to see setbacks as part of learning, and that's a lesson I'll carry with me whatever I end up doing.","part3":["What qualities do you think make someone an effective teacher?","Some people believe that technology will eventually replace teachers. To what extent do you agree?","How has the role of a teacher changed since your parents were at school?"]},{"id":"expert-2","stage":6,"topic":"Describe a piece of technology that you find useful","points":["what it is","how you got it","what you use it for","and explain why you find it so useful"],"phrases":["It might not sound particularly exciting, but…","You'd be amazed at what…","It turns out to be…","As for why it's so useful, I'd say…","Whereas before I'd…, now I…"],"model":"The piece of technology I'd like to talk about is a digital microscope, which is a small device that plugs into a laptop and shows a magnified image on the screen. It might not sound particularly exciting, but I use it far more than I ever expected to.\nI was given it for my eleventh birthday by my aunt, who's a biologist, and I suspect she was hoping to pass on some of her enthusiasm. If so, it certainly worked. Most of the time, I use it to examine things I find around the house and garden. You'd be amazed at what's hiding in an ordinary drop of pond water, for instance. Under the lens, it turns out to be teeming with tiny creatures that are completely invisible to the naked eye. I've also looked at the scales on a butterfly's wing, which are arranged a bit like roof tiles. Best of all, it can take photos and short videos, so I've built up quite a collection, and I've even used some of the images in school projects.\nAs for why it's so useful, I'd say it's changed the way I look at the world. Whereas before I'd walk past a leaf or a stone without a second thought, now I'm constantly wondering what it would look like close up. What I appreciate most, though, is that it's made science feel less like a chapter in a textbook and more like something I can actually do myself.","part3":["How has technology changed the way children learn?","Do you think people rely too heavily on technology nowadays?","Which invention of the last hundred years has had the greatest impact on everyday life, in your view?"]},{"id":"expert-3","stage":6,"topic":"Describe an object that is very important to you","points":["what the object is","where it came from","how long you have had it","and explain why it means so much to you"],"phrases":["An object that means a great deal to me is…","It's roughly the size of…","It's funny how your perspective shifts as…","In terms of money, it's probably not worth much, but…","What makes it truly special, though, is that…"],"model":"An object that means a great deal to me is a small wooden box that sits on the shelf above my bed. It's roughly the size of a shoebox, it's made of dark oak, and there's a pattern of leaves carved into the lid.\nIt was made by my grandfather, who was a carpenter for most of his working life. Apparently, he spent the best part of a winter on it, and he gave it to me on my eighth birthday, so I've had it for about four years now. To be honest, I remember being slightly disappointed at the time, because I'd been hoping for a games console. It's funny how your perspective shifts as you get older.\nThese days, I wouldn't swap it for anything. In terms of money, it's probably not worth much, but its sentimental value is impossible to measure. Over the years, I've filled it with little keepsakes, like tickets from family trips, a shell from the first beach I ever visited and notes from my friends, so it's become a kind of time capsule of my childhood. What makes it truly special, though, is that every time I run my fingers over the carving, I'm reminded of my grandad's patience and the care he puts into everything he makes. He's always telling me that anything worth doing is worth doing properly, and the box is a constant reminder of that. I'd like to think I'll pass it on to my own children one day.","part3":["Why do people often hold on to objects that have no practical use?","Do you think young people today value their possessions more or less than older generations did?","Is a handmade gift more meaningful than one bought in a shop? Why?"]},{"id":"expert-4","stage":6,"topic":"Describe a film that made you think","points":["what the film is","when you watched it","what it is about","and explain why it made you think"],"phrases":["The film that comes to mind is…","It's set…, at a time when…","The story really gets going when…","What struck me most was that…","It made me reflect on…"],"model":"The film that comes to mind is Wall-E, an animated film made by Pixar. I first watched it at home with my family when I was about nine, and I've seen it a few times since, most recently in a science lesson, of all places.\nIt's set hundreds of years in the future, at a time when the Earth has been buried under so much rubbish that humans have had to leave. The main character is a little robot whose job is to tidy up the mess, and he's been doing it on his own for centuries. Meanwhile, people are living on an enormous spaceship, where machines do absolutely everything for them, so they hardly ever move or even look at each other. The story really gets going when Wall-E finds a tiny plant growing among the rubbish, which turns out to be proof that life on Earth is possible again.\nWhat struck me most was that a film with hardly any dialogue in its first half could say so much. It made me reflect on how much plastic my own family gets through in a week, and since then, I've been far more careful about recycling. It also raised a question that I still find myself thinking about, which is whether technology that makes life easier always makes it better. I suppose the film's answer is that it depends on whether we stay in control of it. It's quite a gentle film, admittedly, but that's partly why the message sticks with you.","part3":["To what extent can films influence the way people behave?","Why are animated films often enjoyed by adults as much as by children?","Some people say that films should educate as well as entertain. Do you agree?"]},{"id":"band8-1","stage":7,"topic":"Describe an achievement you are proud of","points":["what you achieved","when it happened","what difficulties you had to overcome","and explain why you feel proud of it"],"phrases":["The achievement I'm proudest of is…","For someone as shy as I was, it was no small feat.","I'd be lying if I said…","Not only did that…, but it also…","What makes me proudest isn't…, it's that…"],"model":"The achievement I'm proudest of is giving a talk in front of the entire school last spring, which, for someone as shy as I was, was no small feat. Every year, one pupil from each class is chosen to speak at a special assembly, and, to my complete astonishment, my class voted for me.\nI'd be lying if I said I was thrilled. Public speaking had always filled me with dread, and the thought of four hundred faces looking up at me was, frankly, overwhelming. I chose to talk about why bees matter far more than most people realise, and for weeks beforehand, I rehearsed in front of the bathroom mirror and then in front of my long-suffering family, who must have heard it a dozen times. The real breakthrough came when my cousin pointed out that I was trying to memorise every single word. She suggested I learn just the key points and speak as if I were chatting to a friend. Not only did that make me sound more natural, but it also took a great deal of pressure off.\nOn the day itself, my hands were shaking, but once I'd got past the first minute, something clicked, and I actually started to enjoy it. What makes me proudest, though, isn't the applause. It's that I confronted something I'd been dreading for years and came out the other side. Ever since, I've been far more willing to step outside my comfort zone, and that's had a knock-on effect on almost every area of my life.","part3":["Why do so many people find public speaking daunting, and how might schools help them overcome this?","Should a pupil's achievements be judged mainly by their exam results?","To what extent does society place too much emphasis on winning rather than on effort?"]},{"id":"band8-2","stage":7,"topic":"Describe a natural place that made a strong impression on you","points":["where it is","when you went there","what you saw there","and explain why it made such an impression on you"],"phrases":["It turned out to be one of the most memorable…","It's thought that…","Rarely have I felt so…","It's one thing to…, but it's quite another to…","If anything, the visit sparked…"],"model":"The place I'd like to describe is the Giant's Causeway, which is on the north coast of Northern Ireland. I went there two summers ago on a family holiday, and although it was a grey, blustery day, it turned out to be one of the most memorable trips I've ever been on.\nWhat greets you when you arrive is a stretch of coastline made up of around forty thousand stone columns, most of them six-sided and packed together so neatly that they look almost man-made. Some are no taller than a step, so you can hop from one to the next, while others rise into towering cliffs. It's thought that they were formed over fifty million years ago, when lava from volcanic eruptions cooled and cracked into these remarkably regular shapes. There's also a local legend which claims that a giant built the causeway so that he could cross the sea to Scotland, and, standing there, you can almost see why people believed it.\nRarely have I felt so small, and yet so utterly fascinated. It's one thing to read about geological time in a textbook, but it's quite another to stand on rock that's been shaped over millions of years. What struck me, too, was the sheer force of the waves crashing against the columns, which really brought home how brief a human lifetime is by comparison. If anything, the visit sparked a lasting interest in geology, and I've been reading about volcanoes ever since.","part3":["Why do you think people are so drawn to dramatic natural landscapes?","To what extent should the number of visitors to fragile natural sites be restricted?","Some argue that spending time in nature is essential to a child's development. How far do you agree?"]},{"id":"band8-3","stage":7,"topic":"Describe a person from history you would like to meet","points":["who the person is","what they are famous for","what you would like to ask them","and explain why you would like to meet them"],"phrases":["If I could meet anyone from history, I think I'd choose…","She's best known for…","First and foremost, I'd love to know…","I'd also be curious to hear what she'd make of…","Had she…, things might have turned out very differently."],"model":"If I could meet anyone from history, I think I'd choose Marie Curie, the scientist whose pioneering research into radioactivity changed the course of modern science. She was born in Poland but spent most of her working life in France, at a time when women were rarely welcome in universities, let alone in laboratories. She's best known for discovering two new elements, polonium and radium, alongside her husband, Pierre, and polonium, incidentally, was named after her home country, which I find rather touching. She went on to become the first woman ever to be awarded a Nobel Prize, and, remarkably, she's still the only person to have won Nobel Prizes in two different sciences, physics and chemistry.\nThere's so much I'd want to ask her. First and foremost, I'd love to know how she kept going when so many people doubted her, and whether she ever imagined how profoundly her work would shape medicine. I'd also be curious to hear what she'd make of the way science is done today, with vast international teams and computers that can process data in seconds.\nAs for why I'd want to meet her, it's largely because she embodies a kind of quiet determination that I really admire. She didn't set out to become famous; she was driven, above all, by curiosity. Had she given up when the odds were stacked against her, things might have turned out very differently. Meeting her would, I imagine, be humbling and inspiring in equal measure.","part3":["Why is it important for young people to learn about figures from history?","Do you think people who become famous today deserve their fame as much as those in the past did?","How might our view of historical figures change as society's values evolve?"]},{"id":"band8-4","stage":7,"topic":"Describe a time when you changed your mind about something","points":["what you changed your mind about","what you used to think","what made you change your mind","and explain how you feel about it now"],"phrases":["…is something I've done a complete U-turn on.","For as long as I can remember, I was convinced that…","What changed everything was…","Much to my surprise,…","Looking back, my problem was never with…, but with…"],"model":"I'd like to talk about poetry, which is something I've done a complete U-turn on over the past year. For as long as I can remember, I was convinced that poems were dull, old-fashioned and deliberately difficult. Whenever we had to study one at school, I'd groan inwardly, because it felt like solving a puzzle nobody had asked me to solve. To my mind, if a writer had something to say, they should simply say it, rather than hiding it behind rhymes and obscure metaphors.\nWhat changed everything was a workshop run by a visiting poet at our school last autumn. Instead of analysing a poem line by line, she simply read a few aloud, and it was a revelation. I suddenly realised that poetry is meant to be heard rather than dissected, and that the rhythm carried a feeling I'd completely missed when reading silently. She then asked us to write a short poem about an ordinary object in our bedroom, and, much to my surprise, I found it oddly absorbing. Searching for exactly the right word turned out to be far more satisfying than I'd ever anticipated.\nLooking back, my problem was never with poetry itself, but with the way I'd been approaching it. These days, I keep a notebook of my own poems, and I've even started reading collections for pleasure. More broadly, the experience has made me wary of dismissing things too quickly. Only when you give something a genuine chance can you judge it fairly.","part3":["Why do people often find it so difficult to change their opinions?","To what extent should young people's views be shaped by those of their parents?","Is changing your mind a sign of weakness or of maturity, in your opinion?"]}],"part1":[{"id":"mover-p1-1","stage":2,"topic":"Your home","qs":[{"q":"Do you live in a house or a flat?","model":"I live in a flat. It's on the third floor, and from my bedroom window I can see the park."},{"q":"What is your favourite room in your home?","model":"My favourite room is my bedroom. It's small, but it's very bright and I've got lots of books there. I like reading on my bed after school."},{"q":"Who do you live with?","model":"I live with my mum, my dad and my little sister. We've also got a cat called Pepper. She likes sleeping on the sofa all day."},{"q":"What do you like doing at home?","model":"I like playing board games with my family. We usually play on Sunday evenings. My dad always wins, but it's still fun."}]},{"id":"mover-p1-2","stage":2,"topic":"Food","qs":[{"q":"What is your favourite food?","model":"My favourite food is pizza. I like it with cheese and tomatoes. My mum and I sometimes make it at home on Fridays."},{"q":"Do you like fruit?","model":"Yes, I love fruit. I eat an apple or a banana every day, and strawberries are my favourite."},{"q":"What do you usually eat for breakfast?","model":"I usually eat cereal with milk. Sometimes I have toast and honey too. I always drink a glass of orange juice."},{"q":"Can you cook?","model":"Yes, I can make a sandwich and a fruit salad. I can't cook pasta yet, but my dad helps me. I like cooking with him in the kitchen."}]},{"id":"mover-p1-3","stage":2,"topic":"Animals","qs":[{"q":"Do you like animals?","model":"Yes, I really like animals. Dogs are my favourite, and I like watching the birds in our garden too."},{"q":"Have you got a pet?","model":"Yes, I've got a rabbit called Snowy. She's white and very soft. I give her a carrot every morning before school."},{"q":"Which animal would you like to see at the zoo?","model":"I'd like to see a giraffe. Giraffes are very tall, and they can eat leaves from the top of the trees."},{"q":"Which animals can you see near your home?","model":"I can see lots of birds and squirrels in the park near my home. The squirrels can climb trees very fast. I like watching them from my window."}]},{"id":"flyer-p1-1","stage":3,"topic":"School","qs":[{"q":"What is your favourite subject at school?","model":"My favourite subject is science, because we do lots of experiments. Last week we made a model volcano that really erupted, and it was brilliant."},{"q":"How do you get to school?","model":"I usually walk to school with my brother, because it's only ten minutes away. When it rains, my mum takes us by car."},{"q":"What do you do at break time?","model":"I play outside with my friends. Yesterday we played tag in the playground, and I was the fastest runner. Sometimes we just sit on a bench and talk."},{"q":"Do you like your school?","model":"Yes, I like it a lot, because the teachers are kind and friendly. We've also got a big library, so I can borrow a new book every week."}]},{"id":"flyer-p1-2","stage":3,"topic":"The weekend","qs":[{"q":"What do you usually do at the weekend?","model":"On Saturdays, I go swimming in the morning. On Sundays, we usually visit my grandparents, so I see my cousins too."},{"q":"What did you do last weekend?","model":"Last weekend, I went to the beach with my family. We built a big sandcastle and ate ice cream. It was quite cold, but we had a great time."},{"q":"Do you prefer Saturdays or Sundays?","model":"I prefer Saturdays, because I don't have any homework and I can play football with my friends. On Sundays, I often have to tidy my room."},{"q":"Who do you spend your weekends with?","model":"I usually spend them with my family. Sometimes my best friend comes to my house, so we play computer games or ride our bikes in the park."}]},{"id":"flyer-p1-3","stage":3,"topic":"Weather","qs":[{"q":"What is the weather usually like where you live?","model":"It's often cloudy and it rains quite a lot, so I always take an umbrella to school. In the summer it's warm and sunny, and that's my favourite time of year."},{"q":"What kind of weather do you like best?","model":"I like snowy weather best, because I love building snowmen. Last winter, it snowed for three days, so we didn't go to school."},{"q":"What do you do when it rains?","model":"When it rains, I usually stay inside and draw or read comics. Sometimes I put on my boots and jump in the puddles, because it's really fun."},{"q":"Do you like hot weather?","model":"Not really, because I get tired and thirsty very quickly. Last summer it was very hot, so we went to the swimming pool almost every day."}]},{"id":"explorer-p1-1","stage":4,"topic":"Friends","qs":[{"q":"Do you have a lot of friends?","model":"I've got quite a lot of friends at school, but only two really close ones. I've known my best friend, Mia, since we were five, so we know everything about each other."},{"q":"What do you like doing with your friends?","model":"We usually ride our bikes in the park or play games at each other's houses. Recently, we've started making short funny videos, which we show to our families."},{"q":"Is it easy for you to make new friends?","model":"Not always, because I'm a bit shy at first. However, if I join a club or a team, I usually make friends quickly, since we already have something in common."},{"q":"What makes someone a good friend?","model":"I think a good friend is someone who listens to you and keeps your secrets. My best friend, for example, always helps me when I'm worried, and I try to do the same for her."}]},{"id":"explorer-p1-2","stage":4,"topic":"Sport","qs":[{"q":"Do you play any sports?","model":"Yes, I play basketball for my school team. I've been in the team for two years now, and we train every Tuesday and Thursday after school."},{"q":"Did you do more sport when you were younger?","model":"Actually, I used to do more, because I went to swimming and gymnastics lessons every week. Now I've got more homework, so I only have time for basketball."},{"q":"Do you prefer watching sport or playing it?","model":"I definitely prefer playing it, because watching can get quite boring after a while. However, I do enjoy watching big tennis matches on television with my dad."},{"q":"Is there a sport you would like to try?","model":"I'd love to try rock climbing, because it looks exciting and it would make me stronger. If I had the chance, I'd start at an indoor climbing centre, where it's safer."}]},{"id":"explorer-p1-3","stage":4,"topic":"Birthdays","qs":[{"q":"How do you usually celebrate your birthday?","model":"I usually have a small party at home with my family and a few friends. My mum always bakes a chocolate cake, and we play games in the garden if the weather's nice."},{"q":"What did you do on your last birthday?","model":"On my last birthday, I went bowling with four friends, and then we had pizza. It was the best birthday I've ever had, because I won both games."},{"q":"Do you prefer giving or receiving presents?","model":"To be honest, I enjoy both, but I think giving presents is more exciting. I love seeing my friends' faces when they open something I've chosen especially for them."},{"q":"Are birthdays important in your country?","model":"Yes, they're quite important, especially for children. Most families have a cake with candles, and everyone sings a birthday song before the candles are blown out."}]},{"id":"achiever-p1-1","stage":5,"topic":"Hobbies","qs":[{"q":"What do you enjoy doing in your free time?","model":"I'm really into photography, especially taking pictures of wildlife. Although it requires a lot of patience, getting the perfect shot of a bird in flight is incredibly rewarding."},{"q":"How did you become interested in it?","model":"I got hooked when my uncle lent me his old camera on a camping trip. I'd never thought of myself as creative, but I was amazed at how much I enjoyed experimenting with light and angles."},{"q":"Do you think hobbies are important for children?","model":"Absolutely, because they give children a break from schoolwork and a chance to discover what they're good at. Whereas lessons often focus on getting the right answer, hobbies let you make mistakes without any pressure."},{"q":"Is there a hobby you would like to take up in the future?","model":"I'd quite like to take up astronomy, since I've always been fascinated by the night sky. The only drawback is that decent telescopes are fairly expensive, so I'll probably have to save up first."}]},{"id":"achiever-p1-2","stage":5,"topic":"Music","qs":[{"q":"What kind of music do you like?","model":"I listen to all sorts, but I'm especially fond of film soundtracks. Unlike pop songs, they don't have any words, so I find them perfect for concentrating while I'm doing my homework."},{"q":"Do you play a musical instrument?","model":"Yes, I've been learning the violin for about three years. It was incredibly frustrating at first, because it sounded awful, but now I can play quite a few pieces without making mistakes."},{"q":"Do you think music is an important subject at school?","model":"I think it should be, although some people see it as less important than maths or science. In my experience, playing in the school orchestra has taught me teamwork and discipline, which are useful everywhere."},{"q":"Do you prefer listening to music alone or with other people?","model":"It depends on my mood, really. When I want to relax, I'd rather listen on my own with headphones, whereas going to a live concert with friends is far more exciting."}]},{"id":"achiever-p1-3","stage":5,"topic":"Holidays","qs":[{"q":"Where do you usually go on holiday?","model":"We tend to go somewhere by the sea, usually in Spain or Portugal. My parents love lying on the beach, whereas my brother and I prefer exploring rock pools and going snorkelling."},{"q":"What is the best holiday you have ever had?","model":"The best one was probably a trip to Scotland two years ago. Despite the fact that it rained nearly every day, the scenery was breathtaking, and we even spotted dolphins from a boat."},{"q":"Do you prefer holidays in your own country or abroad?","model":"Although travelling abroad is exciting, I actually prefer holidays in my own country. They're far less tiring, and I've realised there are lots of beautiful places nearby that I've never visited."},{"q":"Would you rather have a relaxing holiday or an active one?","model":"I'd rather have an active one, to be honest. Lying on a beach all day makes me restless, whereas hiking or kayaking keeps me busy, and I feel as if I've really achieved something."}]},{"id":"expert-p1-1","stage":6,"topic":"Reading","qs":[{"q":"Do you enjoy reading?","model":"Yes, I'm a real bookworm, if I'm honest. I tend to read every night before bed, and once I get into a good mystery, I find it almost impossible to put down."},{"q":"What kind of books are you drawn to?","model":"I'm drawn to science fiction, mainly because it makes me wonder what the future might hold. That said, I'll read pretty much anything with a gripping plot, even the odd biography."},{"q":"Do you think children today read less than in the past?","model":"They probably read fewer books, given how much time they spend on screens. Then again, they're arguably reading more than ever in other forms, like messages and articles online, so it's not entirely clear-cut."},{"q":"Do you prefer paper books or e-books?","model":"I much prefer paper books, as there's something satisfying about turning real pages. Admittedly, e-books are far more practical when you're travelling, since you can carry hundreds of them without any extra weight."}]},{"id":"expert-p1-2","stage":6,"topic":"Technology","qs":[{"q":"How often do you use a computer?","model":"Pretty much every day, mostly for homework and research. Our school has gone almost entirely digital, so I'd struggle to get by without one these days."},{"q":"Which piece of technology do you use most?","model":"I'd have to say my tablet, largely because it's where I keep all my drawings. It's become a kind of portable sketchbook, and I'd be completely lost without it."},{"q":"Do you think children spend too much time on screens?","model":"On the whole, I'd say a lot of us do, myself included. It's all too easy to lose track of time, which is precisely why I've started leaving my tablet downstairs at night."},{"q":"Would you like to work in technology in the future?","model":"I'd jump at the chance, particularly in something like robotics. The idea of designing machines that help people with everyday tasks really appeals to me, though I know it'll take years of hard work to get there."}]},{"id":"expert-p1-3","stage":6,"topic":"Clothes","qs":[{"q":"Do you wear a uniform at school?","model":"Yes, we do, and to be honest, I've come round to the idea. It saves a lot of time in the mornings, and it means nobody gets judged for what they're wearing."},{"q":"What kind of clothes do you like wearing?","model":"I'm far more into comfort than fashion, so you'll usually find me in jeans and a hoodie. On special occasions, though, I don't mind dressing up a bit."},{"q":"Do you think clothes say a lot about a person?","model":"To some extent, yes, since what people choose to wear often reflects their personality or mood. However, it would be a mistake to judge someone purely on their appearance, because first impressions can be misleading."},{"q":"Do you think people buy too many clothes nowadays?","model":"I suspect many people do, mainly because clothes have become so cheap. The trouble is that a lot of them end up being thrown away after only a few wears, which can't be good for the planet."}]},{"id":"band8-p1-1","stage":7,"topic":"Transport","qs":[{"q":"How do you usually get around your town?","model":"Mostly by bike, which is quicker than you might think, given how congested the roads get at rush hour. On particularly wet days, though, I'm more than happy to take the bus."},{"q":"Do you think public transport in your area could be improved?","model":"Without a doubt. The buses are reasonably reliable, but they're few and far between in the evenings, which effectively leaves anyone without a car stranded after about eight o'clock."},{"q":"Is there an unusual form of transport you would like to try?","model":"I'd love to travel on a high-speed train, purely for the experience. Gliding across the countryside at three hundred kilometres an hour sounds genuinely thrilling, and it's far less damaging to the environment than flying."},{"q":"How do you think transport will change in the future?","model":"I imagine electric and self-driving vehicles will become the norm, which could dramatically cut pollution in cities. Whether people will be willing to hand over control to a computer, however, remains to be seen."}]},{"id":"band8-p1-2","stage":7,"topic":"Shopping","qs":[{"q":"Do you enjoy shopping?","model":"It depends what I'm shopping for, to be honest. Browsing in a bookshop is one of my favourite ways to spend an afternoon, whereas trailing round clothes shops with my parents tests my patience to the limit."},{"q":"Do you prefer shopping online or in shops?","model":"On balance, I'd rather go to a real shop, because I like to see and touch things before I buy them. Online shopping is undeniably convenient, but it's all too easy to end up with something that looks nothing like the picture."},{"q":"Do you think children should be given pocket money?","model":"I'm firmly in favour, provided they have to manage it themselves. Learning to budget from an early age is invaluable, and there's no better lesson than blowing everything on sweets and realising you can't afford what you really wanted."},{"q":"Do you think online shopping will replace shops in the future?","model":"I doubt it will replace them altogether, although it's bound to reduce their numbers. Shops that offer something you simply can't get online, like expert advice or a welcoming atmosphere, are likely to survive and may even thrive."}]},{"id":"band8-p1-3","stage":7,"topic":"Your neighbourhood","qs":[{"q":"What do you like about your neighbourhood?","model":"What I appreciate most is the strong sense of community. Neighbours genuinely look out for one another, and every summer there's a street party that brings together people of all ages who might otherwise never have met."},{"q":"Has your neighbourhood changed much in recent years?","model":"Quite considerably, actually. Several blocks of flats have sprung up where a disused factory used to stand, and while that's brought in lots of young families, it's also put a fair amount of pressure on the local school."},{"q":"Is there anything you would change about where you live?","model":"If I could change one thing, it would be the lack of green space. There's only one small park, which gets terribly overcrowded at weekends, so I'd love to see some empty land turned into a community garden."},{"q":"Do you think it's important to know your neighbours?","model":"I'd say it matters more than people tend to realise. Beyond the obvious practical benefits, like having someone to feed your cat while you're away, a friendly neighbourhood can make people feel far less isolated."}]}]};   // content/speaking.json: { cards: Part 2 cue cards, part1: Part 1 question sets }

const has = (s) => !!(CONTENT && CONTENT[s - 1] && CONTENT[s - 1].units && CONTENT[s - 1].units.length);
const unitOf = (s, u) => CONTENT[s - 1].units[u];
const keyOf = (s, u) => STAGES[s - 1].id + '-' + (u + 1);
const nOpts = (s) => (s <= 2 ? 3 : 4);
const nUnits = (s) => (has(s) ? CONTENT[s - 1].units.length : 0);
const unitList = (s) => Array.from({ length: nUnits(s) }, (_, u) => u);
// a unit may hold any number of items, and one reading or a list of them
const readingsOf = (un) => (Array.isArray(un.reading) ? un.reading : [un.reading]);
const anyIdx = (list) => rnd(0, list.length - 1);

const rec = loadRecords('english-quest.v1', { unlocked: 1, units: {}, tests: {}, skills: {}, review: [], days: {}, learned: [], lessons: 0, placed: 0 });
const starsOf = (s, u) => (rec.units[keyOf(s, u)] || {}).stars || 0;
// a stage below the one being worked on is fully open (passed, or skipped by the level test)
function unitOpen(s, u) { if (!has(s) || s > rec.unlocked) return false; if (s < rec.unlocked || u === 0) return true; return starsOf(s, u - 1) > 0; }
function testOpen(s) { if (!has(s) || s > rec.unlocked) return false; if (s < rec.unlocked) return true; return unitList(s).every((u) => starsOf(s, u) > 0); }
const passed = (s) => !!(rec.tests[s] && rec.tests[s].passed);
const cleared = (s) => passed(s) || s < rec.unlocked;   // passed, or below the stage the level test placed you in
const levelNow = () => Math.min(rec.unlocked, STAGES.length);
// the next thing to do: the first unstarted unit of the current stage, then its stage test
function nextStep() {
  for (let s = levelNow(); s >= 1; s--) {
    if (!has(s)) continue;
    for (let u = 0; u < nUnits(s); u++) if (unitOpen(s, u) && !starsOf(s, u)) return { kind: 'unit', s: s, u: u };
    if (testOpen(s) && !passed(s)) return { kind: 'test', s: s };
    if (s === levelNow()) { let low = 0; for (let u = 1; u < nUnits(s); u++) if (starsOf(s, u) < starsOf(s, low)) low = u; return { kind: 'unit', s: s, u: low }; }
  }
  return null;
}

  const parts = []; let n = 0, first = true;
  for (let s = Math.min(rec.unlocked, STAGES.length); s >= 1; s--) {
    const units = has(s) ? unitList(s).filter((u) => unitOpen(s, u)).reverse() : [];
    if (!units.length) continue;
    parts.push('<div class="wl-stage"><h3>' + STAGES[s - 1].icon + ' ' + STAGES[s - 1].name + ' · ' + STAGES[s - 1].cefr + '</h3>' + units.map((u) => {
      const un = unitOf(s, u), seen = new Set(), items = un.grammar.filter((g) => g.why && !seen.has(g.why) && seen.add(g.why));
      n += items.length;
      const h = '<details class="gn-unit"' + (first ? ' open' : '') + '><summary>' + (un.emoji ? '<span aria-hidden="true">' + un.emoji + '</span>' : '') + esc(un.title) + ' <small>' + items.length + '</small></summary><ul>' +
        items.map((g) => '<li>' + esc(g.why) + '<i>' + esc(g.q.replace('___', g.opts[g.a])) + '</i></li>').join('') + '</ul></details>';
      first = false;
      return h;
    }).join('') + '</div>');
  }
  $('#notesNote').textContent = n ? n + ' rules from your lessons so far, each with an example.' : 'Grammar rules from your lessons collect here.';
  $('#notesList').innerHTML = parts.join('');
}
// the notebook: every learned word with its meaning, newest stage first
let wordIndex = null;
function indexWords() {
  if (wordIndex) return wordIndex;
  wordIndex = new Map();
  for (let s = 1; s <= STAGES.length; s++) if (has(s)) CONTENT[s - 1].units.forEach((un, u) => un.words.forEach((w, i) => { if (!wordIndex.has(w.w)) wordIndex.set(w.w, { s: s, u: u, i: i, w: w }); }));
  return wordIndex;
}
const learnedWords = () => rec.learned.map((w) => indexWords().get(w)).filter(Boolean);
function renderWords() {
  const list = learnedWords(), by = {};
  $('#wordsNote').textContent = list.length ? list.length + (list.length === 1 ? ' word' : ' words') + ' learned. Tap 🔊 to hear one.' : 'Words you get right in lessons collect here.';
  $('#practiseWordsBtn').disabled = list.length < 4;
  list.forEach((e) => (by[e.s] = by[e.s] || []).push(e));
  $('#wordList').innerHTML = Object.keys(by).sort((a, b) => b - a).map((st) => '<div class="wl-stage"><h3>' + STAGES[st - 1].icon + ' ' + STAGES[st - 1].name + ' · ' + STAGES[st - 1].cefr + ' <small>' + by[st].length + '</small></h3>' +
    by[st].sort((a, b) => a.w.w.localeCompare(b.w.w)).map((e) => '<div class="wl-row' + (e.w.pic ? '' : ' nopic') + '">' + (e.w.pic ? '<span class="wl-pic" aria-hidden="true">' + e.w.pic + '</span>' : '') + '<div><b>' + esc(e.w.w) + '</b><span>' + esc(e.w.def) + '</span></div><button class="hud-btn wl-say" data-say="' + esc(e.w.w) + '" aria-label="Hear ' + esc(e.w.w) + '">🔊</button></div>').join('') + '</div>').join('');
}
let pathStage = 0;
function renderPath(s) {
  pathStage = s || pathStage || levelNow();
  const st = STAGES[pathStage - 1];
  $('#tabs').innerHTML = STAGES.map((x) => '<button role="tab" aria-selected="' + (x.n === pathStage) + '" class="' + (x.n === pathStage ? 'on' : '') + (x.n > rec.unlocked ? ' locked' : '') + '" data-s="' + x.n + '">' + x.icon + ' ' + x.cefr + '</button>').join('');
  $('#stageHead').innerHTML = '<h2>' + st.icon + ' ' + st.name + '</h2><p>' + st.cefr + (st.ielts ? ' · IELTS ' + st.ielts + ' (practice estimate)' : '') + ' · ' + esc(st.about) + '</p>';
  if (!has(pathStage)) { $('#nodes').innerHTML = '<div class="soon">This stage is coming soon.</div>'; return; }
  const nx = nextStep();
  let h = '';
  CONTENT[pathStage - 1].units.forEach((un, u) => {
    const open = unitOpen(pathStage, u), stars = starsOf(pathStage, u), isNext = nx && nx.kind === 'unit' && nx.s === pathStage && nx.u === u;
    h += '<button class="node' + (open ? '' : ' locked') + (isNext ? ' next' : '') + '" data-u="' + u + '"' + (open ? '' : ' aria-disabled="true"') + '><span class="em" aria-hidden="true">' + (open ? un.emoji : '🔒') + '</span><span><b>' + esc(un.title) + '</b><small>Lesson ' + (u + 1) + '</small></span><span class="st">' + (open ? starRow(stars) : '') + '</span></button>';
  });
  const topen = testOpen(pathStage), t = rec.tests[pathStage];
  h += '<button class="node test' + (topen ? '' : ' locked') + (nx && nx.kind === 'test' && nx.s === pathStage ? ' next' : '') + '" data-test="1"><span class="em" aria-hidden="true">' + (topen ? '🏁' : '🔒') + '</span><span><b>Stage test</b><small>' + (t && t.passed ? 'Passed · best ' + t.best + '%' : t ? 'Best ' + t.best + '% · needs 80%' : '20 questions · needs 80%') + '</small></span><span class="st">' + (t && t.passed ? '✅' : '') + '</span></button>';
  $('#nodes').innerHTML = h;
}
function goNext() {
  const nx = nextStep();
  if (!rec.lessons && !rec.placed && has(2)) { startLesson('place'); return; }
  if (!nx) { renderPath(); showScreen('path'); return; }
  startLesson(nx.kind, nx.s, nx.u);
}
function goHome() { $('#lesson').hidden = true; $('#toast').hidden = true; Speech.stop(); Sound.play('menu'); renderHome(); showScreen('home'); }

document.addEventListener('click', onTap);
$('#nextBtn').addEventListener('click', next);
$('#quitBtn').addEventListener('click', () => { if (L.kind === 'place' && L.place && L.place.best) endLesson(); else goHome(); });
$('#goBtn').addEventListener('click', goNext);
$('#pathBtn').addEventListener('click', () => { renderPath(levelNow()); showScreen('path'); });
$('#reviewBtn').addEventListener('click', () => startLesson('review'));
$('#placeBtn').addEventListener('click', () => startLesson('place'));
$('#wordsBtn').addEventListener('click', () => { renderWords(); showScreen('words'); });
$('#notesBtn').addEventListener('click', () => { renderNotes(); showScreen('notes'); });
$('#speakBtnHome').addEventListener('click', openSpeaking);
$('#speakHomeBtn').addEventListener('click', () => { clearInterval(SP.timer); Speech.stop(); Sound.muffle(false); goHome(); });
$('#speakPart').addEventListener('change', (e) => { if (e.target.name === 'spart') setPart(+e.target.value); });
$('#speakBtns').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'p1Start') { SP.k = 0; p1Show('q'); return; }
  if (t.id === 'p1Say') { Speech.say(SP.set.qs[SP.k].q, 0.9); return; }
  if (t.id === 'p1Done') { p1Show('m'); return; }
  if (t.id === 'p1Hear') { Speech.say(SP.set.qs[SP.k].model, 0.95); return; }
  if (t.id === 'p1Next') { Speech.stop(); if (SP.k + 1 < SP.set.qs.length) { SP.k++; p1Show('q'); } else p1Show('end'); return; }
  if (t.id === 'p1Other') { Speech.stop(); SP.set = nextSet(); SP.k = 0; p1Show('intro'); return; }
  if (t.id === 'spPlan') speakShow('plan');
  else if (t.id === 'spTalk') speakShow('talk');
  else if (t.id === 'spDone') speakShow('done');
  else if (t.id === 'spOther') { Speech.stop(); SP.card = nextCard(); speakShow('card'); }
  else if (t.id === 'spHear') Speech.say(SP.card.model.replace(/\n+/g, ' '), 0.95);
});
$('#notesHomeBtn').addEventListener('click', goHome);
$('#wotd').addEventListener('click', (ev) => {
  const wd = rec.wotd, e = wd && indexWords().get(wd.w); if (!e) return;
  if (ev.target.closest('#wotdSay')) { Speech.say(e.w.w + '. ' + e.w.ex.replace('___', e.w.w), 0.85); return; }
  if (ev.target.closest('#wotdLearn')) {
    if (!rec.learned.includes(wd.w)) rec.learned.push(wd.w);
    wd.done = true; wd.n = (wd.n || 0) + 1; writeSave(); Sound.sfx.right();
    toast('Added to My words!', 'good'); renderHome();
  }
});
$('#mockBtn').addEventListener('click', () => startLesson('mock'));
$('#mockLBtn').addEventListener('click', () => startLesson('mockl'));
$('#wordsHomeBtn').addEventListener('click', goHome);
$('#practiseWordsBtn').addEventListener('click', () => startLesson('words'));
$('#wordList').addEventListener('click', (e) => { const b = e.target.closest('[data-say]'); if (b) Speech.say(b.dataset.say); });
$('#pathHomeBtn').addEventListener('click', goHome);
$('#doneHomeBtn').addEventListener('click', goHome);
$('#donePathBtn').addEventListener('click', () => { renderPath(L.kind === 'place' ? levelNow() : L.s || levelNow()); showScreen('path'); });
$('#doneNextBtn').addEventListener('click', goNext);
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-s]'); if (b) renderPath(+b.dataset.s); });
$('#nodes').addEventListener('click', (e) => {
  const b = e.target.closest('.node'); if (!b || b.classList.contains('locked')) return;
  if (b.dataset.test) startLesson('test', pathStage); else startLesson('unit', pathStage, +b.dataset.u);
});
$('#soundBtn').addEventListener('click', () => { toggleMusic(); renderHome(); });
$('#speakBtn').addEventListener('click', () => { save.settings.speak = !save.settings.speak; writeSave(); renderHome(); if (save.settings.speak) Speech.say('Read aloud is on'); else Speech.stop(); });
window.addEventListener('keydown', (e) => {
  if ($('#lesson').hidden) return;
  const q = L.qs[L.i];
  if (e.key === 'Enter' && L.answered) { e.preventDefault(); next(); return; }
  if (q && q.kind === 'choice' && !L.answered && /^[1-4]$/.test(e.key) && +e.key <= q.opts.length) chooseOpt(q, +e.key - 1);
  if (q && q.kind === 'spell' && !L.answered && /^[a-z]$/i.test(e.key)) { const t = $$('#tiles .tile').find((x) => !x.classList.contains('used') && x.textContent === e.key.toLowerCase()); if (t) t.click(); }
  if (e.key === 'Escape') goHome();
});
arcadeGuards(() => Speech.stop());
arcadeLinks();

window.__quest = { L, rec, save, STAGES, CONTENT, SPEAKING, P1, P2, SP, speakShow, p1Show, setPart, has, next, renderHome, renderNotes, startLesson, nextStep, unitOpen, testOpen, wordQ, unitLesson, stageTest, spotQ, writingQ, showQ, renderWords, mockBand, Speech,
  // answer the current question: right = true picks the right answer (or builds / spells it), false picks a wrong one
  answer(right) {
    const q = L.qs[L.i]; if (!q || L.answered) return false;
    if (q.kind === 'choice') chooseOpt(q, right ? q.a : (q.a + 1) % q.opts.length);
    else if (q.kind === 'spot') $$('#spot .tile')[right ? q.bad : (q.bad + 1) % q.tiles.length].click();
    else if (q.kind === 'order') {
      const used = [];
      if (right) q.words.forEach((w) => used.push(q.tiles.findIndex((t, k) => t === w && !used.includes(k))));
      else { q.tiles.forEach((_, k) => used.unshift(k)); if (used.map((k) => q.tiles[k]).join(' ') === q.sentence) used.reverse(); }
      q.built = used; renderBuild(q); $('#checkBtn').click();
    }
    else if (q.kind === 'spell') { if (!right) { const bad = $$('#tiles .tile').find((t) => t.textContent !== q.word[q.pos]); if (bad) bad.click(); } q.word.split('').slice(q.pos).forEach((ch) => { const t = $$('#tiles .tile').find((x) => !x.classList.contains('used') && x.textContent === ch); if (t) t.click(); }); }
    return true;
  } };
renderHome();
showScreen('home');
})();
</script>
